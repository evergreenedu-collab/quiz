<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진단평가 — 외국인 운전면허 학과시험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--kb:#003FA2;--kb2:#2563EB;--bg:#F3F4F8;--card:#FFF;--txt:#1A1D2E;--txt2:#6E7191;--bdr:#E2E5EF;--ok:#0D7C3F;--ok-bg:#E6F4EC;--no:#C0392B;--no-bg:#FBEAE8;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:1.25rem;font-weight:900;margin:.2rem 0}
h2{font-size:1.05rem;font-weight:700;margin:1.2rem 0 .5rem}
p{margin:.5rem 0}
.hd{background:linear-gradient(135deg,var(--kb),var(--kb2));color:#fff;border-radius:var(--r);padding:18px 16px;text-align:center;margin-bottom:14px}
.hd .sub{font-size:.82rem;opacity:.9}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:12px}
.notice{background:#FBFAF3;border:1px solid #E8E2C8;border-radius:10px;padding:12px 14px;font-size:.84rem;color:#5A5333}
.notice b{color:#3A3520}
label.chk{display:flex;gap:8px;align-items:flex-start;font-weight:700;cursor:pointer;margin:10px 0}
label.chk input{margin-top:3px;width:18px;height:18px;flex:none}
.fld{margin:12px 0}
.fld>span{display:block;font-weight:700;font-size:.9rem;margin-bottom:5px}
select,input[type=text]{width:100%;padding:11px 10px;border:1.5px solid var(--bdr);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
.ages{display:flex;flex-wrap:wrap;gap:7px}
.ages label{flex:1;min-width:78px;text-align:center;border:1.5px solid var(--bdr);border-radius:10px;padding:9px 4px;font-size:.86rem;font-weight:700;cursor:pointer}
.ages label.on{border-color:var(--kb);background:#EBF0FA;color:var(--kb)}
.ages input{display:none}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:1rem;font-weight:900;font-family:inherit;cursor:pointer;margin-top:10px;min-height:50px;text-decoration:none;text-align:center}
.btn-main{background:linear-gradient(135deg,var(--kb),var(--kb2));color:#fff;box-shadow:0 3px 10px rgba(0,32,77,.22)}
.btn-sub{background:#F3F4F8;color:#4A4D63;border:1.5px solid var(--bdr)}
.btn:disabled{opacity:.5}
.q{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:11px}
.q-head{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.q-idx{background:var(--kb);color:#fff;font-weight:900;border-radius:8px;min-width:30px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.q-type{font-size:.72rem;font-weight:700;color:var(--txt2);border:1px solid var(--bdr);border-radius:6px;padding:2px 7px}
.q-body{font-weight:500;margin-bottom:9px}
.q img{max-width:100%;border-radius:8px;margin:5px 0;border:1px solid var(--bdr)}
.opt{display:flex;gap:9px;align-items:flex-start;border:1.5px solid var(--bdr);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}
.opt.sel{border-color:var(--kb);background:#EBF0FA}
.opt input{margin-top:2px;width:18px;height:18px;flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--no);background:var(--no-bg)}
.q.correct{border-color:var(--ok)}
.q.wrong{border-color:var(--no)}
.tag{display:inline-block;font-size:.74rem;font-weight:900;border-radius:6px;padding:2px 8px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.no{background:var(--no-bg);color:var(--no)}
.expl{font-size:.84rem;color:var(--txt2);background:#F7F8FB;border-radius:8px;padding:9px 11px;margin-top:8px}
.score-big{text-align:center;font-size:2.6rem;font-weight:900;color:var(--kb);margin:.2rem 0}
.gain{text-align:center;background:var(--ok-bg);color:var(--ok);font-weight:900;border-radius:12px;padding:14px;font-size:1.1rem;margin:10px 0}
.gain.flat{background:#F3F4F8;color:var(--txt2)}
.linkbtn{display:block;text-align:center;margin-top:10px;color:var(--kb);font-size:.86rem;font-weight:700;text-decoration:underline;cursor:pointer}
.reset{text-align:center;margin-top:22px}
.reset a{color:var(--txt2);font-size:.78rem;text-decoration:underline;cursor:pointer}
.center{text-align:center}
.muted{color:var(--txt2);font-size:.86rem}
</style>
</head>

  try{return "u_"+crypto.randomUUID();}catch(e){return "u_"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);}
}
function ansSet(a){
  var o={};String(a==null?"":a).split(",").forEach(function(x){x=x.trim();if(x)o[x]=1;});return o;
}
function setEq(a,b){var ka=Object.keys(a),kb=Object.keys(b);if(ka.length!==kb.length||ka.length===0)return false;return ka.every(function(k){return b[k];});}

function pick(exclude){
  var ex={};(exclude||[]).forEach(function(n){ex[n]=1;});
  var out=[];
  Object.keys(PLAN).forEach(function(type){
    var pool=QUESTIONS.filter(function(q){return q.t===type&&!ex[q.n];});
    for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
    out=out.concat(pool.slice(0,Math.min(PLAN[type],pool.length)));
  });
  if(out.length<TARGET_N){
    var got={};out.forEach(function(q){got[q.n]=1;});
    var rest=QUESTIONS.filter(function(q){return !ex[q.n]&&!got[q.n]&&q.t!=="동영상형";});
    for(var i=rest.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=rest[i];rest[i]=rest[j];rest[j]=t;}
    out=out.concat(rest.slice(0,TARGET_N-out.length));
  }
  for(var i=out.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=out[i];out[i]=out[j];out[j]=t;}
  return out.map(function(q){return q.n;});
}
function byN(n){for(var i=0;i<QUESTIONS.length;i++){if(QUESTIONS[i].n===n)return QUESTIONS[i];}return null;}

function header(){return '<div class="hd"><h1>'+esc(T.title)+'</h1><div class="sub">'+esc(T.sub)+'</div></div>';}
function resetLink(){return '<div class="reset"><a id="resetA">'+esc(T.reset)+'</a></div>';}
function bindReset(){var a=document.getElementById("resetA");if(a)a.onclick=function(){if(confirm(T.resetAsk)){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}};}

/* ---------- form ---------- */
function screenForm(){
  app.onchange=null;
  var opts='<option value="">'+esc(T.natPick)+'</option>';
  COUNTRIES.forEach(function(c){opts+='<option value="'+c.c+'">'+esc(c[LANG])+'</option>';});
  var ages=T.ages.map(function(a,i){return '<label><input type="radio" name="age" value="'+i+'">'+esc(a)+'</label>';}).join("");
  app.innerHTML=header()
    +'<div class="card"><h2>'+esc(T.formTitle)+'</h2>'
    +'<div class="notice">'+T.notice+'</div>'
    +'<label class="chk"><input type="checkbox" id="agree"><span>'+esc(T.agree)+'</span></label>'
    +'<div class="fld"><span>'+esc(T.nat)+'</span><select id="nat">'+opts+'</select></div>'
    +'<div class="fld"><span>'+esc(T.age)+'</span><div class="ages" id="ages">'+ages+'</div></div>'
    +'<button class="btn btn-main" id="go" disabled>'+esc(T.toPre)+'</button></div>'
    +resetLink();
  var agree=document.getElementById("agree"),nat=document.getElementById("nat"),go=document.getElementById("go"),age=null;
  document.getElementById("ages").addEventListener("change",function(e){
    age=e.target.value;
    [].forEach.call(document.querySelectorAll("#ages label"),function(l){l.classList.toggle("on",l.querySelector("input").checked);});
    check();
  });
  function check(){go.disabled=!(agree.checked&&nat.value&&age!=null);}
  agree.onchange=check;nat.onchange=check;
  go.onclick=function(){
    var s={v:1,uid:newId(),lang:LANG,dataVersion:DATA_VER,createdAt:Date.now(),
      profile:{nat:nat.value,age:parseInt(age,10),consent:true},
      stage:"registered",pre:null,post:null};
    saveState(s);route(s);
  };
  bindReset();
}

/* ---------- intro ---------- */
function screenIntro(s,phase){
  app.onchange=null;
  var pre=phase==="pre";
  var h=header()
    +'<div class="card center"><h2>'+esc(pre?T.preTitle:T.postTitle)+'</h2>'
    +'<p class="muted">'+esc(pre?T.preBody:T.postBody)+'</p>'
    +'<button class="btn btn-main" id="start">'+esc(T.start)+'</button>';
  if(!pre&&s.pre&&s.pre.score!=null){
    h+='<a class="linkbtn" id="viewPre">'+esc(T.viewPreResult)+'</a>';
  }
  h+='</div>'+resetLink();
  app.innerHTML=h;
  document.getElementById("start").onclick=function(){
    var qids=pick(pre?[]:((s.pre&&s.pre.qids)||[]));
    if(pre)s.pre={qids:qids,score:null,total:qids.length,at:null,answers:{}};
    else s.post={qids:qids,score:null,total:qids.length,at:null,answers:{}};
    s.stage=pre?"pre_in_progress":"post_in_progress";
    saveState(s);screenTest(s,phase);
  };
  var vp=document.getElementById("viewPre");
  if(vp)vp.onclick=function(){screenResult(s,"pre");};
  bindReset();
}

/* ---------- test ---------- */
function renderQ(q,idx,opts){
  opts=opts||{};
  var multi=Object.keys(ansSet(q.a)).length>1;
  var h='<div class="q'+(opts.cls||"")+'" data-n="'+q.n+'" data-multi="'+(multi?1:0)+'">';
  h+='<div class="q-head"><span class="q-idx">'+(idx+1)+'</span><span class="q-type">'+esc(T.T[q.t]||q.t)+'</span>';
  if(opts.tag)h+=opts.tag;
  h+='</div>';
  h+='<div class="q-body">'+esc(q.b)+'</div>';
  var altText=(T.imgAlt||"").replace("{n}",q.n);
  (q.imgs||[]).forEach(function(im){h+='<img src="images/'+esc(im)+'" alt="'+esc(altText)+'" loading="lazy">';});
  if(!opts.review)h+='<div class="muted" style="font-size:.78rem;margin:2px 0 4px">'+esc(multi?T.multi:T.single)+'</div>';
  var cor=ansSet(q.a),usr=opts.userSet||{};
  (q.c||[]).forEach(function(ch,i){
    var val=String(i+1),cls="opt";
    if(opts.review){
      if(cor[val])cls+=" ok";else if(usr[val])cls+=" bad";
      h+='<div class="'+cls+'"><span>'+(CIRCLED[i]||(i+1))+'</span><span>'+esc(ch)+'</span></div>';
    }else{
      var checked=usr[val]?" checked":"";
      var selCls=usr[val]?" sel":"";
      h+='<label class="opt'+selCls+'"><input type="'+(multi?"checkbox":"radio")+'" name="q'+q.n+'" value="'+val+'"'+checked+'><span>'+(CIRCLED[i]||(i+1))+'</span><span>'+esc(ch)+'</span></label>';
    }
  });
  if(opts.review){
    var ya=Object.keys(usr);
    h+='<div class="expl"><b>'+esc(T.yours)+':</b> '+(ya.length?esc(ya.join(", ")):esc(T.ansNone))
      +' &nbsp;|&nbsp; <b>'+esc(T.correct)+':</b> '+esc(Object.keys(cor).join(", "));
    if((q.e||"").trim())h+='<br><b>'+esc(T.expl)+':</b> '+esc(q.e.trim());
    h+='</div>';
  }
  return h+'</div>';
}
function screenTest(s,phase){
  var cur=phase==="pre"?s.pre:s.post;
  if(!cur.answers)cur.answers={};
  var qs=cur.qids.map(byN).filter(Boolean);
  var h=header()+'<div class="card"><h2>'+esc(phase==="pre"?T.preTitle:T.postTitle)+'</h2></div>';
  qs.forEach(function(q,i){h+=renderQ(q,i,{userSet:cur.answers[q.n]||{}});});
  h+='<button class="btn btn-main" id="submit">'+esc(T.submit)+'</button>'+resetLink();
  app.innerHTML=h;
  window.scrollTo(0,0);
  app.onchange=function(e){
    var lab=e.target.closest&&e.target.closest("label.opt");if(!lab)return;
    var box=lab.parentNode;
    [].forEach.call(box.querySelectorAll("label.opt"),function(l){l.classList.toggle("sel",l.querySelector("input").checked);});
    var qcard=lab.closest(".q");if(!qcard)return;
    var n=parseInt(qcard.getAttribute("data-n"),10);if(isNaN(n))return;
    var picked={};
    [].forEach.call(document.querySelectorAll('input[name="q'+n+'"]:checked'),function(inp){picked[inp.value]=1;});
    cur.answers[n]=picked;
    saveState(s);
  };
  document.getElementById("submit").onclick=function(){
    var answers={},unanswered=0;
    qs.forEach(function(q){
      var picked={};
      [].forEach.call(document.querySelectorAll('input[name="q'+q.n+'"]:checked'),function(inp){picked[inp.value]=1;});
      answers[q.n]=picked;
      if(Object.keys(picked).length===0)unanswered++;
    });
    if(unanswered>0&&!confirm(unanswered+T.unanswered))return;
    var score=0;
    qs.forEach(function(q){if(setEq(ansSet(q.a),answers[q.n]))score++;});
    cur.score=score;cur.total=qs.length;cur.at=Date.now();cur.answers=answers;
    s.stage=phase==="pre"?"pre_done":"post_done";
    saveState(s);
    screenResult(s,phase);
  };
  bindReset();
}

/* ---------- result ---------- */
function screenResult(s,phase){
  app.onchange=null;
  var pre=phase==="pre",cur=pre?s.pre:s.post;
  var pct=Math.round(cur.score/cur.total*100);
  var h=header()+'<div class="card center"><h2>'+esc(pre?T.resultPre:T.resultPost)+'</h2>'
    +'<div class="score-big">'+cur.score+' / '+cur.total+'</div><p class="muted">'+pct+'%</p>';
  if(!pre&&s.pre&&s.pre.total){
    var prePct=Math.round(s.pre.score/s.pre.total*100),g=pct-prePct;
    h+='<p class="muted">'+T.preWas.replace("{s}",s.pre.score).replace("{p}",prePct)+'</p>';
    if(g>0)h+='<div class="gain">'+T.gainUp.replace("{g}",g)+'</div>';
    else if(g===0)h+='<div class="gain flat">'+esc(T.gainFlat)+'</div>';
    else h+='<div class="gain flat">'+T.gainDown.replace("{g}",g)+'</div>';
  }
  h+='<p class="muted">'+esc(pre?T.afterPre:T.afterPost)+'</p>'
    +'<a class="btn btn-main" href="'+QUIZ_LINK[LANG]+'">'+esc(T.goQuiz)+'</a>'
    +'<a class="btn btn-sub" href="'+BOOK_LINK[LANG]+'">'+esc(T.goBook)+'</a></div>';
  h+='<div class="card"><h2>'+esc(T.review)+'</h2></div>';
  cur.qids.map(byN).filter(Boolean).forEach(function(q,i){
    var usr=(cur.answers&&cur.answers[q.n])||{};
    var ok=setEq(ansSet(q.a),usr);
    var tag='<span class="tag '+(ok?"ok":"no")+'">'+esc(ok?T.ansCorrect:(Object.keys(usr).length?T.ansWrong:T.ansNone))+'</span>';
    h+=renderQ(q,i,{review:true,userSet:usr,cls:ok?" correct":" wrong",tag:tag});
  });
  h+=resetLink();
  app.innerHTML=h;window.scrollTo(0,0);bindReset();
}

/* ---------- done (post already finished) ---------- */
function screenDone(s){
  app.onchange=null;
  app.innerHTML=header()
    +'<div class="card center"><h2>'+esc(T.done)+'</h2><p class="muted">'+esc(T.doneBody)+'</p>'
    +'<button class="btn btn-main" id="v">'+esc(T.viewResult)+'</button>'
    +(s.pre&&s.pre.score!=null?'<a class="linkbtn" id="vp">'+esc(T.viewPreResult)+'</a>':'')
    +'<a class="btn btn-sub" href="'+QUIZ_LINK[LANG]+'">'+esc(T.goQuiz)+'</a></div>'+resetLink();
  document.getElementById("v").onclick=function(){screenResult(s,"post");};
  var vp=document.getElementById("vp");if(vp)vp.onclick=function(){screenResult(s,"pre");};
  bindReset();
}

/* ---------- router ---------- */
function route(s){
  if(!s){screenForm();return;}
  switch(s.stage){
    case "registered":screenIntro(s,"pre");break;
    case "pre_in_progress":
      if(s.pre&&s.pre.qids&&s.pre.qids.length)screenTest(s,"pre");
      else{s.stage="registered";saveState(s);screenIntro(s,"pre");}
      break;
    case "pre_done":
      if(!s.pre||s.pre.score==null){s.stage="registered";saveState(s);screenIntro(s,"pre");}
      else screenIntro(s,"post");
      break;
    case "post_in_progress":
      if(s.post&&s.post.qids&&s.post.qids.length)screenTest(s,"post");
      else{s.stage="pre_done";saveState(s);screenIntro(s,"post");}
      break;
    case "post_done":screenDone(s);break;
    default:screenForm();
  }
}

/* ---------- init ---------- */
app.innerHTML='<p class="center muted" style="margin-top:40px">'+esc(T.loading)+'</p>';
fetch("quiz_data_"+LANG+".json",{cache:"no-cache"})
  .then(function(r){if(!r.ok)throw 0;return r.json();})
  .then(function(d){
    QUESTIONS=(d&&d.questions)||[];
    DATA_VER=(d&&d.version)||"";
    if(!QUESTIONS.length)throw 0;
    route(loadState());
  })
  .catch(function(){
    app.innerHTML=header()+'<div class="card center"><p>'+esc(T.loadErr)+'</p>'
      +'<button class="btn btn-main" onclick="location.reload()">↻</button></div>';
  });
</script>
