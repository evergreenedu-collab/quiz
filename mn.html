улзварт баруун эргэж байх үед гал унтраах машин тусгай гэрлэн дохиогоо асааж, дуут дохио өгсөөр ойртож ирвэл х амгийн аюулгүй жолоодох арга аль нь вэ?","c":["Уулзварыг чөлөөлж, түр зогсоно.","Шууд тухайн байрлал дээрээ зогсоно.","Удаан явсаар баруун эргэнэ.","Уулзварыг хурдан нэвтрээд үргэлжлүүлэн явна."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 29 дүгээр зүйл (Тусгай зориулалтын тээврийн хэрэгслийн давуу эрхтэй хөдөлгөөн) ④ Уулзвар буюу түүний ойролцоо тусгай зориулалтын тээврийн хэрэгсэл ойртож ирэх тохиолдолд тээврийн хэрэгсэл, хөсөг болон трамвайн жолооч уулзвараас зайлсхийж түр зогсох ёстой."},{"n":255,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тусгай зориулалтын тээврийн хэрэгслийн онцгой эрхэд хамаарахгүй нь аль вэ?","c":["Тээврийн хэрэгслийн хурдны хязгаар","Гүйцэж түрүүлэхийг хориглох журам","Эгнээ сүлжихийг хориглох журам","Явган зорчигчийг хамгаалах үүрэг"],"a":"4","imgs":[],"t":"문장형","e":"30 дугаар зүйл (Тусгай зориулалтын тээврийн хэрэгсэлд хамаарах онцгой заалт) Тусгай зориулалтын тээврийн хэрэгсэлд дараах заалтуудыг хэрэглэхгүй. Гэхдээ 4 дэх заалтаас 12 дахь заалт хүртэлх зүйлийг тусгай зориулалтын тээврийн хэрэгслийн дотроос 2 дугаар зүйлийн 22 дахь заалтын \"а\" дэд заалтаас \"в\" дэд заалт хүртэлх автомашин болон Ерөнхийлөгчийн зарлигаар тогтоосон цагдаагийн автомашинд л хэрэглэхгүй. <2021 оны 1 дүгээр сарын 12-ны өдөр нэмэлт өөрчлөлт орсон> 1. 17 дугаар зүйлийн дагуух автомашин зэргийн хурдны хязгаарлалт. Гэхдээ 17 дугаар зүйлийн дагуу тусгай зориулалтын тээврийн хэрэгсэлд хурдны хязгаарлалт тогтоосон тохиолдолд мөн зүйлийн заалтыг хэрэглэнэ. 2. 22 дугаар зүйлийн дагуух гүйцэж түрүүлэхийг хориглох 3. 23 дугаар зүйлийн дагуух шургалж орохыг хориглох 4. 5 дугаар зүйлийн дагуух гэрлэн дохио зөрчих 5. 13 дугаар зүйлийн 1 дэх хэсгийн дагуух явган хүний зам руу орох 6. 13 дугаар зүйлийн 3 дахь хэсгийн дагуух төвийн шугам давах 7. 18 дугаар зүйлийн дагуух хөндлөн гарах зэргийг хориглох 8. 19 дүгээр зүйлийн дагуух аюулгүй зай барих зэрэг 9. 21 дүгээр зүйлийн 1 дэх хэсгийн дагуух гүйцэж түрүүлэх арга зэрэг 10. 32 дугаар зүйлийн дагуух зогсох болон зогсоолд тавихыг хориглох 11. 33 дугаар зүйлийн дагуух зогсоолд тавихыг хориглох 12. 66 дугаар зүйлийн дагуух эвдрэл гэмтэл зэргийн үед авах арга хэмжээ"},{"n":256,"b":"Тусгай зориулалтын тээврийн хэрэгсэл нь шаардлагатай тоноглолтой бөгөөд дуут дохио өгөх эсвэл тусгай гэрлэн дохио асааж яаралтай үүрэг гүйцэтгэж байгаагаа мэдэгдэх ёстой. Дараах тусгай зориулалтын тээврийн хэрэгслүүдээс аль нь ийм арга хэмжээ авах шаардлагагүй вэ?","c":["Хууль бусаар зогсоолд тавьсан автомашиныг хянах зориулалтын автомашин","Гал унтраах машин","Түргэн тусламжийн машин","Хурдны зөрчил хянах цагдаагийн автомашин"],"a":"4","imgs":[],"t":"문장형","e":"Тусгай зориулалтын тээврийн хэрэгсэл нь \"Автотээврийн хэрэгслийн удирдлагын тухай хууль\"-ийн дагуух автомашины аюулгүй хөдөлгөөнд шаардлагатай стандартад тогтоосон тусгай зориулалтын тээврийн хэрэгслийн бүтэцтэй байх ёстой бөгөөд давуу эрхтэй хөдөлгөөн болон тусгай зориулалтын тээврийн хэрэгсэлд хамаарах онцгой заалт, бусад хуульд заасан онцгой заалтыг хэрэглүүлэхийг хүсвэл сирен дуугаргах буюу анивчих дохионы гэрэл асаах ёстой. Гэхдээ хурдны тухай заалтыг зөрчсөн автомашин зэргийг хянан шалгах тохиолдлын тусгай зориулалтын тээврийн хэрэгсэл болон дотоод, гадаадын өндөр албан тушаалтныг хамгаалах үүрэг гүйцэтгэхэд албаны зориулалтаар ашиглагддаг автомашинд үүнд хамаарахгүй."},{"n":257,"b":"Гал унтраах машин, түргэн тусламжийн машин зэрэг тусгай зориулалтын тээврийн хэрэгсэл гүйцэж түрүүлэхийг хориглосон бүсэд гүйцэж түрүүлэх эсвэл хурд хэтрүүлэх зэрэг онцгой эрх эдлэхийн тулд ямар арга хэмжээ авах ёстой вэ?","c":["Дуут дохиогоо өгч явна.","Автомашины удирдлагын тухай хуульд заасан аюулгүй ажиллагааны шаардлагыг хангасан бүтэцтэй байж, сирен (тусгай дуут дохио) ажиллуулах эсвэл тусгай гэрлэн дохио асаах ёстой.","Урд гэрлээ асааж явна.","Тусгай арга хэмжээ авахгүй байсан ч онцгой эрх эдэлж болно."],"a":"2","imgs":[],"t":"문장형","e":"Тусгай зориулалтын тээврийн хэрэгсэл онцгой заалтын дагуу үйлчлүүлэхийн тулд Автотээврийн хэрэгслийн удирдлагын тухай хуулийн дагуух автомашины аюулгүй хөдөлгөөнд шаардлагатай бүтэцтэй байж, сирен дуугаргах буюу анивчих дохионы гэрэл асаах ёстой."},{"n":258,"b":"Энгийн автомашин амь нас нь аюултай өвчтөн тээвэрлэж байгаа тохиолдолд тусгай зориулалтын тээврийн хэрэгсэлд тооцогдохын тулд ямар арга хэмжээ авах ёстой вэ?","c":["Харьяалах цагдаагийн газрын даргын зөвшөөрөл авна.","Урд гэрэл эсвэл аюулын дохионы гэрлээ асааж явна.","Амь нас нь аюултай өвчтөн тээвэрлэж байгаа тул тусгай арга хэмжээ шаардлагагүй.","Заавал өөр автомашины хамгаалалттайгаар явна."],"a":"2","imgs":[],"t":"문장형","e":"Түргэн тусламжийн автомашин дуудах боломжгүй нөхцөлд энгийн автомашинаар амь нас нь аюулд орсон өвчтөнийг тээвэрлэх шаардлагатай яаралтай нөхцөлд эргэн тойрны автомашины жолооч нараас зам тавиулан эмнэлэг зэрэг рүү явах шаардлагатай тохиолдолд тусгай зориулалтын тээврийн хэрэгслийн онцгой заалтыг хэрэглүүлэхийн тулд урд гэрэл буюу ослын дохионы гэрлийг асаах, эсвэл бусад зохистой аргаар яаралтай зорилгоор явж байгаагаа илэрхийлэх ёстой."},{"n":259,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тусгай зориулалтын тээврийн хэрэгсэлд хамаарах 2-ыг сонгоно уу.","c":["Эвдэрсэн тул засварын газар руу явж буй гал унтраах машин","Амь нас нь аюултай өвчтөн, гэмтсэн хүн эсвэл цус сэлбэхэд зориулсан цус тээвэрлэж буй автомашин","Эмнэлгээс гарч буй өвчтөн тээвэрлэж буй түргэн тусламжийн машин","Аймаг, нийслэлийн цагдаагийн газрын даргын зөвшөөрлөөр яаралтай шуудан тээвэрлэхэд ашиглагдаж буй автомашин"],"a":"2, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 22 дахь заалт \"Тусгай зориулалтын тээврийн хэрэгсэл\" гэж дараах дэд заалтуудын автомашин бөгөөд өөрийн үндсэн яаралтай зориулалтаар ашиглагдаж буй автомашиныг хэлнэ. а. Гал унтраах автомашин, б. Түргэн тусламжийн автомашин, в. Цус тээвэрлэх тээврийн хэрэгсэл, г. Бусад Ерөнхийлөгчийн зарлигаар тогтоосон автомашин. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 2 дугаар зүйлийн 5 дахь заалт: дотоод, гадаадын өндөр албан тушаалтныг хамгаалах үүрэг гүйцэтгэхэд албаны зориулалтаар ашиглагддаг автомашин, 10 дахь заалт: яаралтай шуудан тээвэрлэхэд ашиглагддаг автомашин"},{"n":260,"b":"Замын хөдөлгөөний тухай хуулийн дагуу яаралтай үүрэг гүйцэтгэж буй түргэн тусламжийн машины жолоочийн хийж болох үйлдлийн зөв 2-ыг сонгоно уу.","c":["Зам тээврийн осол гаргасан ч хохирогчид тусламж үзүүлэхгүйгээр үргэлжлүүлэн явж болно.","Зам хөндлөн гарч буй явган зорчигчийн хөдөлгөөнд саад учруулан үргэлжлүүлэн явж болно.","Замын төв хэсгээр эсвэл зүүн талаар зорчиж болно.","Зам түгжирсэн үед эгнээ сүлжин орж болно."],"a":"3, 4","imgs":[],"t":"문장형","e":"29 дүгээр зүйл (Тусгай зориулалтын тээврийн хэрэгслийн давуу эрхтэй хөдөлгөөн)-ийн 1 дэх хэсэг. Тусгай зориулалтын тээврийн хэрэгсэл нь 13 дугаар зүйлийн 3 дахь хэсгийг үл харгалзан яаралтай бөгөөд аргагүй тохиолдолд замын төв буюу зүүн хэсгээр явж болно. 2 дахь хэсэг. Тусгай зориулалтын тээврийн хэрэгсэл нь энэ хууль буюу энэ хуулийн дагуух тушаалын дагуу зогсох ёстой тохиолдолд ч яаралтай бөгөөд аргагүй тохиолдолд зогсохгүй байж болно. 3 дахь хэсэг. Тусгай зориулалтын тээврийн хэрэгслийн жолооч 1 дэх хэсэг буюу 2 дахь хэсгийн тохиолдолд замын хөдөлгөөний аюулгүй байдалд онцгой анхаарал хандуулан явах ёстой."},{"n":261,"b":"Замын хөдөлгөөний тухай хуулийн дагуу үндсэн үүргээ гүйцэтгэж буй гал унтраах машины жолоочид тусгай зориулалтын тээврийн хэрэгслийн онцгой зохицуулалтыг хэрэглэх боломжгүй нь аль вэ?","c":["Аюулгүйн бүс зүүгээгүй байх","Согтуугаар жолоо барих","Төв шугам давж зорчих","Гэрлэн дохио зөрчих"],"a":"2","imgs":[],"t":"문장형","e":"30 дугаар зүйл (Тусгай зориулалтын тээврийн хэрэгсэлд хамаарах онцгой заалт) Тусгай зориулалтын тээврийн хэрэгсэлд дараах заалтуудыг хэрэглэхгүй. Гэхдээ 4 дэх заалтаас 12 дахь заалт хүртэлх зүйлийг тусгай зориулалтын тээврийн хэрэгслийн дотроос 2 дугаар зүйлийн 22 дахь заалтын \"а\" дэд заалтаас \"в\" дэд заалт хүртэлх автомашин болон Ерөнхийлөгчийн зарлигаар тогтоосон цагдаагийн автомашинд л хэрэглэхгүй. <2021 оны 1 дүгээр сарын 12-ны өдөр нэмэлт өөрчлөлт орсон> 1. 17 дугаар зүйлийн дагуух автомашин зэргийн хурдны хязгаарлалт. Гэхдээ 17 дугаар зүйлийн дагуу тусгай зориулалтын тээврийн хэрэгсэлд хурдны хязгаарлалт тогтоосон тохиолдолд мөн зүйлийн заалтыг хэрэглэнэ. 2. 22 дугаар зүйлийн дагуух гүйцэж түрүүлэхийг хориглох 3. 23 дугаар зүйлийн дагуух шургалж орохыг хориглох 4. 5 дугаар зүйлийн дагуух гэрлэн дохио зөрчих 5. 13 дугаар зүйлийн 1 дэх хэсгийн дагуух явган хүний зам руу орох 6. 13 дугаар зүйлийн 3 дахь хэсгийн дагуух төвийн шугам давах 7. 18 дугаар зүйлийн дагуух хөндлөн гарах зэргийг хориглох 8. 19 дүгээр зүйлийн дагуух аюулгүй зай барих зэрэг 9. 21 дүгээр зүйлийн 1 дэх хэсгийн дагуух гүйцэж түрүүлэх арга зэрэг 10. 32 дугаар зүйлийн дагуух зогсох болон зогсоолд тавихыг хориглох 11. 33 дугаар зүйлийн дагуух зогсоолд тавихыг хориглох 12. 66 дугаар зүйлийн дагуух эвдрэл гэмтэл зэргийн үед авах арга хэмжээ"},{"n":262,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тусгай зориулалтын тээврийн хэрэгслийн жолоочид зориулсан тогтмол замын хөдөлгөөний аюулгүй байдлын сургалтад ( ) жил тутамд нэг удаа хамрагдана. ( ) -д тохирох нь аль вэ?","c":["1","2","3","5"],"a":"3","imgs":[],"t":"문장형","e":"Тогтмол замын хөдөлгөөний аюулгүй байдлын сургалт: тусгай зориулалтын тээврийн хэрэгсэл жолооддог хүнд зориулан 3 жил тутамд тогтмол явуулдаг сургалт. Энэ тохиолдолд өмнө нь тусгай зориулалтын тээврийн хэрэгслийн замын хөдөлгөөний аюулгүй байдлын сургалтад хамрагдсан өдрөөс эхлэн тоолж 3 жил болох өдөр багтах жилийн 1 дүгээр сарын 1-ний өдрөөс 12 дугаар сарын 31-ний өдрийн хооронд сургалтад хамрагдах ёстой. (Замын хөдөлгөөний тухай хуулийн 73 дугаар зүйлийн 4 дэх хэсэг, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 38-2 дугаар зүйл-ын 2 дахь хэсгийн 2 дахь заалт)"},{"n":263,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тусгай зориулалтын тээврийн хэрэгслийн онцгой эрхийн талаар буруу тайлбар аль нь вэ?","c":["Гүйцэж түрүүлэхийг хориглосон хэсэгт гүйцэж түрүүлж болно.","Эгнээ сүлжихийг хориглосон хэсэгт эгнээ сүлжиж болно.","Явган хүний гарцаар гарч буй явган зорчигчийг хамгаалахгүйгээр өнгөрч болно.","Замын зөвшөөрөгдөх дээд хурднаас илүү хурдтай явж болно."],"a":"3","imgs":[],"t":"문장형","e":"30 дугаар зүйл (Тусгай зориулалтын тээврийн хэрэгсэлд хамаарах онцгой заалт) Тусгай зориулалтын тээврийн хэрэгсэлд дараах заалтуудыг хэрэглэхгүй. Гэхдээ 4 дэх заалтаас 12 дахь заалт хүртэлх зүйлийг тусгай зориулалтын тээврийн хэрэгслийн дотроос 2 дугаар зүйлийн 22 дахь заалтын \"а\" дэд заалтаас \"в\" дэд заалт хүртэлх автомашин болон Ерөнхийлөгчийн зарлигаар тогтоосон цагдаагийн автомашинд л хэрэглэхгүй. <2021 оны 1 дүгээр сарын 12-ны өдөр нэмэлт өөрчлөлт орсон> 1. 17 дугаар зүйлийн дагуух автомашин зэргийн хурдны хязгаарлалт. Гэхдээ 17 дугаар зүйлийн дагуу тусгай зориулалтын тээврийн хэрэгсэлд хурдны хязгаарлалт тогтоосон тохиолдолд мөн зүйлийн заалтыг хэрэглэнэ. 2. 22 дугаар зүйлийн дагуух гүйцэж түрүүлэхийг хориглох 3. 23 дугаар зүйлийн дагуух шургалж орохыг хориглох 4. 5 дугаар зүйлийн дагуух гэрлэн дохио зөрчих 5. 13 дугаар зүйлийн 1 дэх хэсгийн дагуух явган хүний зам руу орох 6. 13 дугаар зүйлийн 3 дахь хэсгийн дагуух төвийн шугам давах 7. 18 дугаар зүйлийн дагуух хөндлөн гарах зэргийг хориглох 8. 19 дүгээр зүйлийн дагуух аюулгүй зай барих зэрэг 9. 21 дүгээр зүйлийн 1 дэх хэсгийн дагуух гүйцэж түрүүлэх арга зэрэг 10. 32 дугаар зүйлийн дагуух зогсох болон зогсоолд тавихыг хориглох 11. 33 дугаар зүйлийн дагуух зогсоолд тавихыг хориглох 12. 66 дугаар зүйлийн дагуух эвдрэл гэмтэл зэргийн үед авах арга хэмжээ"},{"n":264,"b":"Замын хөдөлгөөний тухай хуулийн дагуу гал унтраах усан хангамжийн байгууламж, яаралтай гал унтраах төхөөрөмж, галын аюулгүй байдлын байгууламжаас ( ) метрийн доторх газар түр зогсох, зогсоолд тавихыг хориглоно. ( ) -д тохирох нь аль вэ?","c":["5","6","8","10"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 32 дугаар зүйл (Зогсох болон зогсоолд тавихыг хориглох) Бүх тээврийн хэрэгслийн жолооч дараах заалтуудын аль нэгэнд хамаарах газарт тээврийн хэрэгслээ зогсоох буюу зогсоолд тавьж болохгүй. Гэхдээ энэ хууль буюу энэ хуулийн дагуух тушаал, эсвэл цагдаагийн алба хаагчийн зааврыг дагаж мөрдөх тохиолдол болон аюулаас сэргийлэхийн тулд түр зогсох тохиолдолд үүнд хамаарахгүй. 6. Дараах дэд заалтуудын газраас 5 метрийн дотор газар а. \"Гал түймрийн тухай үндсэн хууль\"-ийн 10 дугаар зүйлийн дагуух гал унтраах усан хангамжийн байгууламж буюу ослын гал унтраах төхөөрөмж суурилуулсан газар б. \"Галын аюулаас хамгаалах байгууламж суурилуулах, ашиглах тухай хууль\"-ийн 2 дугаар зүйлийн 1 дэх хэсгийн 1 дэх заалтын дагуух галын аюулаас хамгаалах байгууламжаас Ерөнхийлөгчийн зарлигаар тогтоосон байгууламж суурилуулсан газар"},{"n":265,"b":"Дараах тээврийн хэрэгслүүдээс аль нь ашиглагч хүн эсвэл байгууллагын хүсэлтээр аймаг, нийслэлийн цагдаагийн газрын даргын шийдвэрээр тусгай зориулалтын тээврийн хэрэгсэл болгож томилогдож болох вэ?","c":["Гал унтраах машин","Хийн алдагдлыг сэргээн засварлах яаралтай ажилд ашигладаг хийн үйлчилгээний автомашин","Түргэн тусламжийн машин","Цус тээвэрлэх автомашин"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 2 дугаар зүйл (Тусгай зориулалтын тээврийн хэрэгслийн төрөл) ① Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 2 дахь заалтын \"г\" дэд заалт дахь \"Ерөнхийлөгчийн зарлигаар тогтоосон автомашин\" гэж яаралтай зориулалтаар ашиглагдаж буй дараах заалтуудын аль нэгэнд хамаарах автомашиныг хэлнэ. Гэхдээ 6 дахь заалтаас 11 дэх заалт хүртэлх автомашины хувьд түүнийг ашиглах хүн буюу байгууллага зэргийн хүсэлтээр аймаг, нийслэлийн Цагдаагийн газрын дарга тогтоосон тохиолдлоор хязгаарлана."},{"n":266,"b":"Дараах тээврийн хэрэгслүүдээс аль нь ашиглагч хүн эсвэл байгууллагын хүсэлтээр аймаг, нийслэлийн цагдаагийн газрын даргын шийдвэрээр тусгай зориулалтын тээврийн хэрэгсэл болгож томилогдохгүй вэ?","c":["Замын хөдөлгөөний хяналтад ашигладаг цагдаагийн автомашин","Яаралтай шуудан тээвэрлэхэд ашигладаг автомашин","Харилцаа холбооны засвар зэрэг яаралтай ажилд ашигладаг автомашин","Иргэний хамгаалалтын байгууллагын яаралтай сэргээн босголтын ажилд ашигладаг автомашин"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 2 дугаар зүйл (Тусгай зориулалтын тээврийн хэрэгслийн төрөл) ① Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 2 дахь заалтын \"г\" дэд заалт дахь \"Ерөнхийлөгчийн зарлигаар тогтоосон автомашин\" гэж яаралтай зориулалтаар ашиглагдаж буй дараах заалтуудын аль нэгэнд хамаарах автомашиныг хэлнэ. Гэхдээ 6 дахь заалтаас 11 дэх заалт хүртэлх автомашины хувьд түүнийг ашиглах хүн буюу байгууллага зэргийн хүсэлтээр аймаг, нийслэлийн Цагдаагийн газрын дарга тогтоосон тохиолдлоор хязгаарлана."},{"n":267,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тусгай зориулалтын тээврийн хэрэгсэл үндсэн яаралтай үүргээс бусад тохиолдолд тусгай гэрлэн дохио ашиглаж болохгүй нөхцөл аль нь вэ?","c":["Гал унтраах машин гал түймрээс урьдчилан сэргийлэх болон аврах, түргэн тусламжийн ажиллагааны зорилгоор эргүүл хийж байгаа үед","Гал унтраах машин засварын газар руу яаралтай шилжин явж байгаа үед","Иргэний хамгаалалтын автомашин үндсэн яаралтай үүрэгтэй холбоотой сургалтад оролцож байгаа үед","Цагдаагийн автомашин гэмт хэргээс урьдчилан сэргийлэх болон хяналт шалгалтын зорилгоор эргүүл хийж байгаа үед"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 10-2 дугаар зүйл (Яаралтай зориулалтаас бусад тохиолдолд анивчих дохионы гэрэл зэргийг ашиглаж болох тохиолдол) Хуулийн 2 дугаар зүйлийн 22 дахь заалтын дэд заалтуудын автомашины жолооч нь хуулийн 29 дүгээр зүйлийн 6 дахь хэсгийн тусгай заалтын дагуу тухайн автомашиныг өөрийн үндсэн яаралтай зориулалтаар явуулахгүй байгаа тохиолдолд ч дараах заалтуудын аль нэгэнд хамаарах тохиолдолд \"Автотээврийн хэрэгслийн удирдлагын тухай хууль\"-ийн дагуу тухайн автомашинд суурилуулсан анивчих дохионы гэрлийг асаах буюу сирен ажиллуулж болно."},{"n":268,"b":"Замын хөдөлгөөний тухай хуулийн дагуу яаралтай дуудлагаар явж буй тусгай зориулалтын тээврийн хэрэгслийн жолоочийн үйлдлээс хууль зөрчсөн нь аль вэ?","c":["Нэг чиглэлд 2 эгнээтэй ердийн зам дээр цагт 100 км хурдтай явсан.","Цагаан тасралтгүй шугамтай хонгил дотор гүйцэж түрүүлсэн.","Баруун эргэхийн тулд уулзвар дээр эгнээ сүлжсэн.","Хүний амь нас, эрүүл мэндэд хохиролтой зам тээврийн осол гарсан ч шаардлагатай мэдэгдэл, арга хэмжээ авахгүйгээр үргэлжлүүлэн явсан."],"a":"4","imgs":[],"t":"문장형","e":"Тусгай зориулалтын тээврийн хэрэгсэлд автомашин зэргийн хурдны хязгаарлалт, гүйцэж түрүүлэхийг хориглох, шургалж орохыг хориглох заалтыг хэрэглэхгүй. (Замын хөдөлгөөний тухай хуулийн 30 дугаар зүйл (Тусгай зориулалтын тээврийн хэрэгсэлд хамаарах онцгой заалт), Замын хөдөлгөөний тухай хуулийн 54 дүгээр зүйл (Осол гарсан үед авах арга хэмжээ)-ийн 5 дахь хэсэг)"},{"n":269,"b":"Тусгай зориулалтын тээврийн хэрэгсэл үндсэн яаралтай үүргээс бусад үед тусгай гэрлэн дохио ашиглаж болохгүй нөхц өл аль нь вэ?","c":["Гал унтраах машин гал түймрээс урьдчилан сэргийлэх зорилгоор эргүүл хийж байгаа үед","Зам зохицуулалтын зориулалттай автомашин зам дээрх аюулыг урьдчилан сэргийлэх зорилгоор эргүүл хийж байгаа үед","Түргэн тусламжийн машин яаралтай үүрэгтэй холбоотой сургалтад оролцож байгаа үед","Цагдаагийн автомашин гэмт хэргээс урьдчилан сэргийлэх зорилгоор эргүүл хийж байгаа үед"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 10-2 дугаар зүйл (Яаралтай зориулалтаас бусад тохиолдолд анивчих дохионы гэрэл зэргийг ашиглаж болох тохиолдол) Хуулийн 2 дугаар зүйлийн 22 дахь заалтын дэд заалтуудын автомашины жолооч нь хуулийн 29 дүгээр зүйлийн 6 дахь хэсгийн тусгай заалтын дагуу тухайн автомашиныг өөрийн үндсэн яаралтай зориулалтаар явуулахгүй байгаа тохиолдолд ч дараах заалтуудын аль нэгэнд хамаарах тохиолдолд \"Автотээврийн хэрэгслийн удирдлагын тухай хууль\"-ийн дагуу тухайн автомашинд суурилуулсан анивчих дохионы гэрлийг асаах буюу сирен ажиллуулж болно."},{"n":270,"b":"Яаралтай үүрэг гүйцэтгэж буй тусгай зориулалтын тээврийн хэрэгсэлд зам тавьж өгөх зөв жолоодох аргын 2-ыг сонгоно уу.","c":["Бүх автомашин үндсэндээ замын зүүн зах руу шахаж зам тавьж өгнө.","Өгсүүр нарийн зам дээр хоёр автомашин өөд өөдөөсөө явж байвал өгсөж яваа тусгай зориулалтын тээврийн хэрэгсэл замын баруун зах руу шахаж зам тавьж өгөх ёстой.","Уулзварын ойролцоо бол уулзварыг чөлөөлөн түр зогсох ёстой.","Уулзвар болон түүний ойролцоо бус газар тусгай зориулалтын тээврийн хэрэгсэл ойртож ирвэл түүнд давуу зорчих боломж олгон зам тавьж өгөх ёстой."],"a":"3, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 29 дүгээр зүйл (Тусгай зориулалтын тээврийн хэрэгслийн давуу эрхтэй хөдөлгөөн) ④ Уулзвар буюу түүний ойролцоо тусгай зориулалтын тээврийн хэрэгсэл ойртож ирэх тохиолдолд тээврийн хэрэгсэл, хөсөг болон трамвайн жолооч уулзвараас зайлсхийж түр зогсох ёстой. ⑤ Бүх тээврийн хэрэгсэл болон трамвайн жолооч 4 дэх хэсэгт заасан газраас бусад газарт тусгай зориулалтын тээврийн хэрэгсэл ойртож ирсэн тохиолдолд тусгай зориулалтын тээврийн хэрэгслийг давуу эрхтэйгээр нэвтрүүлэхийн тулд зам тавьж өгөх ёстой."},{"n":271,"b":"Дараах зүйлсээс тусгай зориулалтын тээврийн хэрэгсэлд хамаарах 2-ыг сонгоно уу.","c":["Цагдаагийн тусгай зориулалтын тээврийн хэрэгслээр чиглүүлэн явуулж буй автомашин","Мөрдөн шалгах байгууллагын автомашин боловч мөрдөн шалгах ажиллагаанаас өөр зориулалтаар ашиглагдаж буй автомашин","Аврах ажиллагаагаа дуусгаад буцаж явж буй аврах автомашин","Амь нас нь аюултай өвчтөн, гэмтсэн хүн эсвэл цус сэлбэхэд зориулсан цус тээвэрлэж буй автомашин"],"a":"1, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 2 дугаар зүйл (Тусгай зориулалтын тээврийн хэрэгслийн төрөл) ① \"Замын хөдөлгөөний тухай хууль\" (цаашид \"хууль\" гэх)-ийн 2 дугаар зүйлийн 22 дахь заалтын \"г\" дэд заалт дахь \"Ерөнхийлөгчийн зарлигаар тогтоосон автомашин\" гэж яаралтай зориулалтаар ашиглагдаж буй дараах заалтуудын аль нэгэнд хамаарах автомашиныг хэлнэ. Гэхдээ 6 дахь заалтаас 11 дэх заалт хүртэлх автомашины хувьд түүнийг ашиглах хүн буюу байгууллага зэргийн хүсэлтээр аймаг, нийслэлийн Цагдаагийн газрын дарга тогтоосон тохиолдлоор хязгаарлана. 1. Цагдаагийн автомашины дотроос гэмт хэргийн мөрдөн байцаалт, замын хөдөлгөөний хяналт шалгалт, бусад яаралтай цагдаагийн үүрэг гүйцэтгэхэд ашиглагддаг автомашин 2. Үндэсний арми болон Солонгост байрлах НҮБ-ын цэргийн автомашины дотроос цэргийн дотоод дэг журмыг сахиулах буюу ангийн эмх цэгцтэй шилжилт хөдөлгөөнийг чиглүүлэхэд ашиглагддаг автомашин 3. Мөрдөн байцаах байгууллагын автомашины дотроос гэмт хэргийн мөрдөн байцаалтад ашиглагддаг автомашин 4. Дараах дэд заалтуудын аль нэгэнд хамаарах байгууламж буюу байгууллагын автомашины дотроос оргодлыг баривчлах буюу хоригдол, тэнсэн хянах этгээдийг хүргэх, хамгаалахад ашиглагддаг автомашин а. Хорих анги, насанд хүрээгүйчүүдийн хорих анги буюу цагдан хорих байр б. Насанд хүрээгүйчүүдийн хүмүүжүүлэх газар буюу насанд хүрээгүйчүүдийн ангилан шинжлэх газар в. Тэнсэн хянах газар 5. Дотоод, гадаадын өндөр албан тушаалтныг хамгаалах үүрэг гүйцэтгэхэд албаны зориулалтаар ашиглагддаг автомашин 6. Цахилгаан, хий, бусад нийтийн аж ахуйн үйл ажиллагаа эрхэлдэг байгууллагад аюулаас урьдчилан сэргийлэх яаралтай ажилд ашиглагддаг автомашин 7. Иргэний хамгаалалтын үүрэг гүйцэтгэдэг байгууллагад яаралтай урьдчилан сэргийлэх буюу сэргээн засварлах ажилд гарахад ашиглагддаг автомашин 8. Замын арчлалтад ашиглагддаг автомашины дотроос зам дээрх аюулаас урьдчилан сэргийлэх яаралтай ажилд ашиглагддаг буюу хөдөлгөөнд оролцохыг хязгаарласан автомашиныг хянан шалгахад ашиглагддаг автомашин 9. Телеграф, утасны засварын ажил зэрэг яаралтай ажилд ашиглагддаг автомашин 10. Яаралтай шуудан тээвэрлэхэд ашиглагддаг автомашин 11. Радио долгионы хяналтын үүрэгт ашиглагддаг автомашин ② 1 дэх хэсгийн заалтуудад заасан автомашинаас гадна дараах заалтуудын аль нэгэнд хамаарах автомашиныг тусгай зориулалтын тээврийн хэрэгсэл гэж үзнэ. 1. 1 дэх хэсгийн 1 дэх заалтын дагуух цагдаагийн тусгай зориулалтын тээврийн хэрэгслээр чиглүүлэгдэж буй автомашин 2. 1 дэх хэсгийн 2 дахь заалтын дагуух үндэсний арми болон Солонгост байрлах НҮБ-ын цэргийн тусгай зориулалтын тээврийн хэрэгслээр чиглүүлэгдэж буй үндэсний арми болон Солонгост байрлах НҮБ-ын цэргийн автомашин 3. Амь нас нь аюулд орсон өвчтөн буюу гэмтсэн хүн, эсвэл цус сэлбэх зориулалттай цус тээвэрлэж яваа автомашин"},{"n":272,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн сургуулийн автобусны жолооч болон ашиглагчийн үүргийн талаар буруу тайлбар аль нь вэ?","c":["Хүүхдийн сургуулийн автобусны жолооч хүүхэд эсвэл бага насны хүүхэд сууж, буух үед л анивчдаг гэрлийг ажиллуулах ёстой.","Хүүхдийн сургуулийн автобусны жолооч суусан бүх хүүхэд болон бага насны хүүхдээр суудлын аюулгүйн бүсийг зүүлгэсний дараа хөдөлнө.","Хүүхдийн сургуулийн автобусны ашиглагч асран хамгаалагчийг хамт суулган явуулж байгаа бол хамгаалагч хамт явж буйг илтгэх тэмдэг байрлуулж болно.","Хүүхдийн сургуулийн автобусны ашиглагч асран хамгаалагч хамт явсан тохиолдолд аюулгүй ажиллагааны бүртгэл хөтлөх шаардлагагүй."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 53 дугаар зүйлийн 1 дэх хэсэг, 2 дахь хэсэг, 6 дахь хэсэг, 7 дахь хэсэг"},{"n":273,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган зорчигч байгаа эсэхээс үл хамааран заавал түр зогсох газар аль нь вэ?","c":["Явган хүний зам болон зорчих хэсэг тусгаарлагдаагүй, төв шугамгүй зам","Хүүхдийн хамгаалалтын бүсэд байрлах гэрлэн дохиогүй явган хүний гарцын өмнө","Явган зорчигч түрүүлж зорчих зам","Замаас бусад газар"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 6 дахь хэсэг: Бүх тээврийн хэрэгслийн жолооч явган хүний зам болон зорчих хэсэг нь тусгаарлагдаагүй замын дотроос төвийн шугамгүй зам, явган зорчигчийн давуу эрхтэй зам, замаас бусад газарт явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явах ёстой бөгөөд явган зорчигчийн хөдөлгөөнд саад болох үед удаан явах буюу түр зогсож, явган зорчигчийг аюулгүй явах боломжоор хангах ёстой. <2022 оны 1 дүгээр сарын 11-ний өдөр нэмэлт өөрчлөлт орсон> Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 7 дахь хэсэг: Жолооч хүүхдийн хамгаалалтын бүс дотор байрлуулсан явган хүний гарцын дотроос гэрлэн дохио тавигдаагүй явган хүний гарцын өмнө (зогсох шугам тавигдсан тохиолдолд тухайн зогсох шугамыг хэлнэ) явган зорчигч хөндлөн гарч байгаа эсэхээс үл хамааран түр зогсох ёстой."},{"n":274,"b":"Нэг чиглэлд 2 эгнээтэй замын 1-р эгнээгээр хүүхэд эсвэл бага насны хүүхэд тээвэрлэж байгааг илтгэх тэмдэгтэй хүүхдийн сургуулийн автобус явж байна. Хамгийн аюулгүй жолоодох арга аль нь вэ?","c":["2-р эгнээ сул байсан ч гүйцэж түрүүлэхгүй.","2-р эгнээгээр гүйцэж түрүүлнэ.","Дуут дохио өгч урд эгнээг чөлөөлөхийг шаардана.","Эсрэг урсгалын байдлыг шалгаад төв шугам давж гүйцэж түрүүлнэ."],"a":"1","imgs":[],"t":"문장형","e":"Хамгийн аюулгүй жолоодлогын арга нь 2 дугаар эгнээ сул байсан ч гүйцэж түрүүлэхгүй байх явдал юм. Бүх тээврийн хэрэгслийн жолооч хүүхэд буюу нялх, балчир хүүхэд тээвэрлэж яваа гэсэн тэмдэглэгээ хийсэн байдлаар замаар явж буй хүүхдийн сургуулийн автобусыг гүйцэж түрүүлж болохгүй. (Замын хөдөлгөөний тухай хуулийн 51 дүгээр зүйл)"},{"n":275,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн хамгаалалтын бүсийн талаар зөв тайлбар аль нь вэ?","c":["Цэцэрлэг болон дунд сургуулийн өмнө байгуулж болно.","Хотын дарга зэрэг эрх бүхий этгээд автомашины хөдөлгөөнийг хориглож болно.","Хүүхдийн хамгаалалтын бүс дэх хүүхэд гэдэг нь 12-оос доош насны хүнийг хэлнэ.","Тээврийн хэрэгслийн хурдыг цагт 30 км дотор байхаар хязгаарлаж болно."],"a":"4","imgs":[],"t":"문장형","e":"Хүүхдийн хамгаалалтын бүсэд тээврийн хэрэгслийн хөдөлгөөний хурдыг цагт 30 километрээс дотор хязгаарлаж болно."},{"n":276,"b":"Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн дагуу хүүхдийн хамгаалалтын бүсэд цагт 40 км хурдтай явж б айхдаа жолоочийн буруугаас хүүхэд гэмтсэн бол ямар шийтгэл ногдуулах вэ?","c":["Хохирогч эрүүгийн шийтгэл шаардах үед л эрүүгийн хариуцлага хүлээнэ.","Хохирогчийн хүсэлтээс үл хамааран эрүүгийн хариуцлага хүлээнэ.","Иж бүрэн даатгалтай бол эрүүгийн хариуцлага хүлээхгүй.","Хохирогчтой тохиролцвол эрүүгийн хариуцлага хүлээхгүй."],"a":"2","imgs":[],"t":"문장형","e":"Хүүхдийн хамгаалалтын бүс дотор явж байхдаа хүүхдийг гэмтээсэн тохиолдолд хохирогчийн шийтгүүлэх хүсэл зоригоос үл хамааран эрүүгийн хариуцлага хүлээлгэнэ."},{"n":277,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн сургуулийн автобусаар бүртгүүлж болох автомашины суудлын багтаамжийн зөв шалгуур аль нь вэ? (1 хүүхдийг 1 суудал гэж тооцно.)","c":["11 хүний суудал ба түүнээс дээш","16 хүний суудал ба түүнээс дээш","17 хүний суудал ба түүнээс дээш","9 хүний суудал ба түүнээс дээш"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 34 дүгээр зүйл (Хүүхдийн сургуулийн автобусаар ашиглаж болох автомашин) Хүүхдийн сургуулийн автобусаар ашиглаж болох автомашин нь суудлын багтаамж 9 (хүүхэд 1-ийг суудлын багтаамж 1 хүн гэж үзнэ) ба түүнээс дээш суудалтай автомашин байна."},{"n":278,"b":"Суудлын автомашины жолооч өглөөний 08:30 цагт хүүхдийн хамгаалалтын бүсэд дээд хурдыг цагт 25 км-ээр хэтрүүлсэн бол хэдэн торгуулийн оноо авах вэ?","c":["10 оноо","15 оноо","30 оноо","60 оноо"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 28] Хүүхдийн хамгаалалтын бүс дотор өглөөний 8 цагаас оройн 8 цагийн хооронд хурд хэтрүүлсэн жолоочид торгуулийн онооны 2 дахинтай тэнцэх торгуулийн оноо ногдуулна."},{"n":279,"b":"Суудлын автомашины жолооч хүүхэд эсвэл бага насны хүүхэд тээвэрлэж байгааг илтгэсэн хүүхдийн сургуулийн автобусыг гүйцэж түрүүлсэн бол хэдэн торгуулийн оноо ногдуулах вэ?","c":["10 оноо","15 оноо","30 оноо","40 оноо"],"a":"3","imgs":[],"t":"문장형","e":"Суудлын автомашины жолооч хүүхэд буюу нялх, балчир хүүхэд тээвэрлэж яваа гэсэн тэмдэглэгээ хийж замаар явж буй хүүхдийн сургуулийн автобусыг гүйцэж түрүүлсэн тохиолдолд 30 торгуулийн оноо ногдуулна."},{"n":280,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн сургуулийн автобусны аюулгүй ажиллагааны сургалтад хамрагдах хүний сургалтын хугацааны зөв шалгуур аль нь вэ?","c":["1 цаг ба түүнээс дээш","3 цаг ба түүнээс дээш","5 цаг ба түүнээс дээш","6 цаг ба түүнээс дээш"],"a":"2","imgs":[],"t":"문장형","e":"Хүүхдийн сургуулийн автобусны аюулгүй байдлын сургалтыг замын хөдөлгөөний аюулгүй байдлын төлөөх хүүхдийн зан үйлийн онцлог, хүүхдийн сургуулийн автобусны ашиглалт зэрэгтэй холбоотой хууль тогтоомж, хүүхдийн сургуулийн автобусны гол ослын жишээний дүн шинжилгээ, бусад жолоодох болон суулгах, буулгах үед хүүхдийг хамгаалахад шаардлагатай зүйл зэргийн талаар лекц, дүрс бичлэгийн сургалт зэргийн аргаар 3 цаг ба түүнээс дээш хугацаагаар явуулна. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 31-2 дугаар зүйл)"},{"n":281,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхэд болон бага насны хүүхдийн насны зөв шалгуур аль нь вэ?","c":["Хүүхэд гэдэг нь 13 ба түүнээс доош насны хүн","Бага насны хүүхэд гэдэг нь 6-аас доош насны хүн","Хүүхэд гэдэг нь 15-аас доош насны хүн","Бага насны хүүхэд гэдэг нь 7-оос доош насны хүн"],"a":"2","imgs":[],"t":"문장형","e":"Хүүхэд гэж 13 нас хүрээгүй хүнийг хэлэх бөгөөд (Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 23 дахь заалт), нялх, балчир хүүхэд гэж 6 нас хүрээгүй хүнийг хэлнэ. (Замын хөдөлгөөний тухай хуулийн 11 дүгээр зүйл)"},{"n":282,"b":"Замын хөдөлгөөний тухай хуулийн дагуу суудлын автомашины жолооч 13:00 цагийн үед хүүхдийн хамгаалалтын бүсэд гэрлэн дохио зөрчсөн бол зөрчлийн торгуулийн хэмжээ хэд вэ?","c":["50,000 вон","70,000 вон","120,000 вон","150,000 вон"],"a":"3","imgs":[],"t":"문장형","e":"Хүүхдийн хамгаалалтын бүс дотор өглөөний 8 цагаас оройн 8 цагийн хооронд гэрлэн дохио зөрчсөн суудлын автомашины жолоочид 120,000 вон зөрчлийн торгууль ногдуулна."},{"n":283,"b":"Хүүхэд асран хамгаалагчгүйгээр зам дээр тоглож байгаа бол жолоочийн хамгийн зөв үйлдэл аль нь вэ?","c":["Хүүхдийн буруу тул тоохгүй өнгөрнө.","Дуут дохио өгч айлган үргэлжлүүлэн явна.","Түр зогсоно.","Хүүхдээс болгоомжлон яаравчлан өнгөрнө."],"a":"3","imgs":[],"t":"문장형","e":"Хүүхэд асран хамгаалагчгүйгээр замд тоглож байгаа тохиолдолд түр зогсож хүүхдийг хамгаална."},{"n":284,"b":"Хүүхэд явган хүний гарцаар гарч яваа үед замын хөдөлгөөний тухай хуулийн заалт болон жолоочийн зөв үйлдэл аль нь вэ?","c":["Явган зорчигч гарцаар гарч байгааг урьдчилан олж харвал аюулгүй байдлыг шалгасны дараа удаан явж өнгөрнө.","Гэрлэн дохиогүй ердийн замын явган хүний гарц дээр зогсох шугамыг давсан байсан ч гарц руу ороогүй бол болно.","Гэрлэн дохиогүй ердийн замын явган хүний гарц дээр хүүхдийн араар удаан явж өнгөрч болно.","Явган хүний гарцын тэмдэг нь гарцтай газрын замын хоёр талд байрладаг бөгөөд гарцын өмнө түр зогсох ёстой."],"a":"4","imgs":[],"t":"문장형","e":"Явган хүний гарцын тэмдэг нь явган зорчигчийг явган хүний гарцаар явахыг заадаг бөгөөд явган хүний гарцын өмнө түр зогсох ёстой ба явган хүний гарц байрлуулсан газрын шаардлагатай цэгийн замын хоёр талд байрлуулна. Хүүхэд гэрлэн дохиогүй явган хүний гарцаар гарч байгаа үед явган хүний гарцын өмнө түр зогсож хүүхдийг гарч дуустал хүлээнэ."},{"n":285,"b":"Хүүхдийн сургуулийн автобус нэг чиглэлд 1 эгнээтэй зам дээр зогсож, бага насны хүүхэд сууж бууж байгааг илтгэх анивчдаг гэрэл ажиллаж байгаа үед эсрэг чиглэлээс ирж буй автомашины жолооч хэрхэн явах ёстой вэ?","c":["Түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явна.","Удаан явж аюулгүй байдлыг шалгасны дараа өнгөрнө.","Шууд өнгөрч болно.","Дуут дохио өгөөд өнгөрнө."],"a":"1","imgs":[],"t":"문장형","e":"Хүүхдийн сургуулийн автобус нэг чиглэлд 1 эгнээтэй замд зогсож, нялх, балчир хүүхэд сууж, бууж байгааг илэрхийлэх анивчих гэрэл ажиллаж байх үед эсрэг чиглэлээс явж буй тээврийн хэрэгслийн жолооч түр зогсож аюулгүй байдлыг шалгасны дараа удаан явах ёстой."},{"n":286,"b":"Жолооч тээврийн хэрэгсэл жолоодож байхдаа “хүүхдийг мөргөсөн тохиолдол”-д хамгийн зөв үйлдэл аль нь вэ?","c":["Хоёр дугуйт тээврийн хэрэгслийн жолооч хүүхдээс гэмтсэн эсэхийг асуухад хүүхэд юу ч хэлээгүй тул гэмтээгүй гэж үзээд үргэлжлүүлэн явсан.","Суудлын автомашины жолооч шууд зогсоод хүүхдийг нүдээр шалгаж, гэмтэлгүй гэж үзээд үргэлжлүүлэн явсан.","Ачааны автомашины жолооч хүүхэд унаад шууд босож ирэхийг хараад гэмтээгүй гэж үзэн үргэлжлүүлэн явсан.","Унадаг дугуйн жолооч унасан хүүхэд хурдан босоод гүйж явахыг харсны дараа цагдаад мэдэгдэж, ослын газарт хүлээсэн."],"a":"4","imgs":[],"t":"문장형","e":"Зөвхөн хүүхдийн үгэнд итгэлгүйгээр цагдаагийн байгууллагад мэдэгдэх ёстой."},{"n":287,"b":"Нарийн гудамжинд гэнэт гүйж гарч ирсэн хүүхдийг автомашин мөргөжээ. Хүүхэд гаднаас харахад гэмтээгүй мэт байсан бөгөөд \"Зүгээр\" гэж хэлж байна. Энэ тохиолдолд жолоочийн зөв үйлдэл аль нь вэ?","c":["Энэ нь хохирогч шийтгэхийг хүсэхгүй гэдгээ илэрхийлсэн бол түүний хүсэл зоригийн эсрэг шийтгэж болохгүй хэрэг тул жолооч замаа үргэлжлүүлнэ.","Хүүхэд гэмтээгүй тул зам тээврийн осол биш гэж үзээд ямар нэг арга хэмжээ авахгүйгээр явна.","Эцэг эхтэй нь холбоо барих зэрэг шаардлагатай бүх арга хэмжээг авсны дараа явна.","Хүүхдийн буруу тул зөвхөн холбоо барих мэдээллийг нь аваад явна."],"a":"3","imgs":[],"t":"문장형","e":"Зам тээврийн ослоор хүүхдийг гэмтээсэн жолооч эцэг эхэд нь мэдэгдэх зэрэг шаардлагатай арга хэмжээг бүрэн авах ёстой."},{"n":288,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн хамгаалалтын бүсийг тогтоож, хариуцан удирдах байгууллага аль нь вэ?","c":["Цагдаагийн газрын дарга","Хотын дарга зэрэг","Аймаг, нийслэлийн цагдаагийн газрын дарга","Боловсролын газрын дарга"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 12 дугаар зүйлийн 1 дэх хэсэг"},{"n":289,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн хамгаалалтын бүсийн талаар зөв 2-ыг сонгоно уу.","c":["Хүүхдийн хамгаалалтын бүс гэдэг нь бага сургуулийн үндсэн үүднээс 100 метрийн доторх тодорхой замын хэсгийг хэлнэ.","Хүүхдийн хамгаалалтын бүсэд өглөөний 08:00–20:00 цагийн хооронд түр зогсох, зогсоолд тавих журмыг зөрчвөл зөрчлийн торгууль нэмэгдэнэ.","Хүүхдийн хамгаалалтын бүсэд байрлах гэрлэн дохионы явган зорчигчийн хугацааг хүүхдийн хамгийн их алхах хурдыг үндэслэн тогтоодог.","Хүүхдийн хамгаалалтын бүсэд өглөөний 08:00–20:00 цагийн хооронд явган зорчигчийг хамгаалах үүргээ биелүүлээгүй бол торгуулийн оноог 2 дахин нэмэгдүүлнэ."],"a":"2, 4","imgs":[],"t":"문장형","e":"Хүүхдийн хамгаалалтын бүс гэж бага сургуулийн гол орц гарцаас 300 метрийн доторх замын тодорхой хэсгийг хэлэх бөгөөд хүүхдийн хамгаалалтын бүс дотор байрлуулсан гэрлэн дохионы явган зорчигчийн гарах хугацааг хүүхдийн дундаж алхах хурдыг үндэслэн тогтооно."},{"n":290,"b":"Хүүхдийн сургуулийн автобусны тусгай хамгаалалтын талаар зөв 2-ыг сонгоно уу.","c":["Хүүхдийн сургуулийн автобусыг гүйцэж түрүүлэх журам нь бусад автомашиныг гүйцэж түрүүлэхтэй адил байна.","Хүүхэд сууж, бууж байх үед төв шугамгүй замд эсрэг чиглэлээс ирж буй автомашин ч аюулгүй байдлыг шалгасны дараа удаан явах ёстой.","Хүүхэд сууж, бууж байх үед нэг чиглэлд 1 эгнээтэй замд эсрэг чиглэлээс ирж буй автомашин ч түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явах ёстой.","Хүүхэд сууж, бууж байх үед тухайн эгнээ болон түүнтэй зэрэгцээ эгнээнд явж буй автомашин түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явах ёстой."],"a":"3, 4","imgs":[],"t":"문장형","e":"Хүүхдийн сургуулийн автобус замд зогсож, анивчих гэрэл зэргээр хүүхэд буюу нялх, балчир хүүхэд сууж, бууж байгааг илэрхийлэх төхөөрөмжийг ажиллуулж байх үед хүүхдийн сургуулийн автобусны зогссон эгнээ болон тухайн эгнээний яг хажуугийн эгнээгээр явж буй тээврийн хэрэгсэл түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явах ёстой. Мөн төвийн шугам тавигдаагүй зам болон нэг чиглэлд 1 эгнээтэй замд эсрэг чиглэлээс явж буй тээврийн хэрэгслийн жолооч ч хүүхдийн сургуулийн автобусанд хүрэхээс өмнө түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явах ёстой."},{"n":291,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуйн зорчих журмын талаар тайлбар юм. Буруу нь аль вэ?","c":["Унадаг дугуйн зам тусдаа байгаа бол тухайн замаар зорчих ёстой.","Унадаг дугуйн зам байхгүй бол замын баруун захыг даган зорчих ёстой.","Унадаг дугуйн жолооч замын хажуугийн хөвөөгөөр (аюулгүй байдлын тэмдгээр унадаг дугуйн хөдөлгөөнийг хориглосон хэсгээс бусад) зорчиж болно.","Унадаг дугуйн жолооч явган хүний гарцаар зам хөндлөн гарахдаа унадаг дугуйгаа унасан чигээрээ гарч болно."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 13-2 дугаар зүйл (Унадаг дугуйн хөдөлгөөний аргын онцгой заалт)"},{"n":292,"b":"Замын хөдөлгөөний тухай хуулийн дагуу \"хамгаалалтын бүсийг тогтоох журам болон шалгуур\" зэрэг шаардлагатай асуудлыг хамтран батлах яамд аль нь вэ?","c":["Хүүхдийн хамгаалалтын бүсийг Дотоод хэрэг, аюулгүй байдлын яам, Эрүүл мэнд, нийгмийн хамгааллын яам, Газрын харилцаа, дэд бүтцийн яам хамтран тогтооно.","Ахмад настны хамгаалалтын бүсийг Дотоод хэрэг, аюулгүй байдлын яам, Газрын харилцаа, дэд бүтцийн яам, Байгаль орчны яам хамтран тогтооно.","Хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг Дотоод хэрэг, аюулгүй байдлын яам, Эрүүл мэнд, нийгмийн хамгааллын яам, Газрын харилцаа, дэд бүтцийн яам хамтран тогтооно.","Замын хөдөлгөөнд эмзэг оролцогчдын хамгаалалтын бүсийг Дотоод хэрэг, аюулгүй байдлын яам, Байгаль орчны яам, Газрын харилцаа, дэд бүтцийн яам хамтран тогтооно."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 12 дугаар зүйл (Хүүхдийн хамгаалалтын бүсийг тогтоох, цуцлах болон удирдах)-ийн 2 дахь хэсэг 1 дэх хэсгийн дагуух хүүхдийн хамгаалалтын бүсийг тогтоох, цуцлах журам болон стандарт зэрэгтэй холбоотой шаардлагатай зүйлийг Боловсролын яам, Дотоод хэрэг, аюулгүй байдлын яам, Газар, дэд бүтэц, тээврийн яамны хамтарсан тушаалаар тогтооно. Ахмад настны хамгаалалтын бүс буюу хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох журам болон стандарт зэрэгтэй холбоотой шаардлагатай зүйлийг Дотоод хэрэг, аюулгүй байдлын яам, Эрүүл мэнд, нийгмийн хамгааллын яам болон Газар, дэд бүтэц, тээврийн яамны хамтарсан тушаалаар тогтооно."},{"n":293,"b":"Хүүхдийн сургуулийн автобусны тусгай хамгаалалтын талаар жолоочийн зөв жолоодох арга аль нь вэ?","c":["Нэг чиглэлд 1 эгнээтэй замд эсрэг чиглэлээс ирж буй автомашины жолооч ч хүүхдийн сургуулийн автобусанд хүрэхээсээ өмнө түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явах ёстой.","Хүүхдийн сургуулийн автобус хүүхэд буулгах гэж анивчдаг гэрлээ асаасан үед тухайн автобус зогссон эгнээнээс бусад эгнээгээр хурдан өнгөрнө.","Төв шугамгүй замд эсрэг чиглэлээс ирж буй автомашин өмнөх хурдаараа явна.","Бүх жолооч хүүхэд эсвэл бага насны хүүхэд тээвэрлэж байгааг илтгэсэн тэмдэгтэй хүүхдийн сургуулийн автобусыг ч гүйцэж түрүүлж болно."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 51 дүгээр зүйлийн 2 дахь хэсэг (Хүүхдийн сургуулийн автобусны онцгой хамгаалалт) ① Хүүхдийн сургуулийн автобус замд зогсож, хүүхэд буюу нялх, балчир хүүхэд сууж, бууж байгааг илэрхийлэх анивчих гэрэл зэргийн төхөөрөмжийг ажиллуулж байх үед хүүхдийн сургуулийн автобусны зогссон эгнээ болон тухайн эгнээний яг хажуугийн эгнээгээр явж буй тээврийн хэрэгслийн жолооч хүүхдийн сургуулийн автобусанд хүрэхээс өмнө түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ② 1 дэх хэсгийн тохиолдолд төвийн шугам тавигдаагүй зам болон нэг чиглэлд 1 эгнээтэй замд эсрэг чиглэлээс явж буй тээврийн хэрэгслийн жолооч ч хүүхдийн сургуулийн автобусанд хүрэхээс өмнө түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ③ Бүх тээврийн хэрэгслийн жолооч хүүхэд буюу нялх, балчир хүүхэд тээвэрлэж яваа гэсэн тэмдэглэгээ хийсэн байдлаар замаар явж буй хүүхдийн сургуулийн автобусыг гүйцэж түрүүлж болохгүй."},{"n":294,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн сургуулийн автобусны бүртгэлийн талаар тайлбар юм. Зөв 2 нь аль вэ?","c":["Хүүхдийн сургуулийн автобус ажиллуулахын өмнө Солонгосын Замын хөдөлгөөний газарт урьдчилан бүртгүүлж, бүртгэлийн гэрчилгээ авах ёстой.","Хүүхдийн сургуулийн автобус нь үндсэндээ 9 хүний суудал ба түүнээс дээш (1 хүүхдийг 1 суудал гэж үзнэ) автомашин байна.","Хүүхдийн сургуулийн автобусны бүртгэлийн гэрчилгээ элэгдэж ашиглах боломжгүй болж дахин авах хүсэлт гаргах бол, хүүхдийн сургуулийн автобусны бүртгэлийн гэрчилгээ дахин олгох хүсэлтэд хэрэглэх боломжгүй болсон бүртгэлийн гэрчилгээг өгөх ёстой.","Хүүхдийн сургуулийн автобусны бүртгэлийн гэрчилгээг тухайн автомашины урд салхины шилний зүүн дээд талын харагдахуйц г азарт байрлуулах ёстой."],"a":"2, 3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 52 дугаар зүйл (Хүүхдийн сургуулийн автобусны мэдүүлэг зэрэг) ① Хүүхдийн сургуулийн автобус ашиглах гэж буй этгээд нь урьдчилан харьяа цагдаагийн хэлтсийн даргад мэдүүлж, мэдүүлгийн гэрчилгээ авах ёстой. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 35 дугаар зүйл (Хүүхдийн сургуулийн автобусны мэдүүлгийн журам зэрэг) ③ Хүүхдийн сургуулийн автобусны мэдүүлгийн гэрчилгээг тухайн автомашины урд салхины шилний баруун дээд хэсгийн харагдахад хялбар газарт наах ёстой. ④ Хүүхдийн сургуулийн автобусны мэдүүлгийн гэрчилгээ элэгдэж ашиглах боломжгүй болсноос дахин хүсэлт гаргах үед хүүхдийн сургуулийн автобусны мэдүүлгийн гэрчилгээ дахин олгуулах хүсэлтэд элэгдэж ашиглах боломжгүй болсон мэдүүлгийн гэрчилгээг хавсаргаж өгөх ёстой."},{"n":295,"b":"Хүүхдийн сургуулийн автобусны жолооч бага насны хүүхдийг суулгах, буулгах зөв арга аль нь вэ?","c":["Бага насны хүүхэд сууж, бууж байгаа үед анивчдаг гэрлийн төхөөрөмжийг ажиллуулж аюулгүй байдлыг хангана.","Замын хөдөлгөөн ихтэй үед анивчдаг гэрлийг түр унтраагаад хүүхдийг суулгана.","Бага насны хүүхдийг автобусны ойролцоо буулгаад шууд хөдөлнө.","Хүүхдийн хамгаалалтын бүсэд суудлын аюулгүйн бүс зүүхгүй байсан ч болно."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 53 дугаар зүйл (Хүүхдийн сургуулийн автобусны жолооч болон ашиглагч зэргийн үүрэг) ① Хүүхдийн сургуулийн автобус жолооддог хүн хүүхэд буюу нялх, балчир хүүхэд сууж, бууж байгаа тохиолдолд л анивчих гэрэл зэргийн төхөөрөмжийг ажиллуулах ёстой бөгөөд хүүхэд буюу нялх, балчир хүүхэд тээвэрлэж явж байгаа тохиолдолд л 51 дүгээр зүйлийн 3 дахь хэсгийн дагуух тэмдэглэгээг хийх ёстой. ② Хүүхдийн сургуулийн автобус жолооддог хүн хүүхэд буюу нялх, балчир хүүхэд хүүхдийн сургуулийн автобусанд суух үед суусан бүх хүүхэд буюу нялх, балчир хүүхдэд суудлын хамгаалах бүс зүүлгэсний дараа хөдлөх ёстой бөгөөд буух үед явган хүний зам буюу замын захын бүс зэрэг автомашинаас аюулгүй газарт хүрснийг шалгасны дараа хөдлөх ёстой."},{"n":296,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн хамгаалалтын бүсийн талаар буруу тайлбар аль нь вэ?","c":["Зогсоолд тавихыг хориглосон журмыг зөрчсөн тохиолдолд ногдуулах зөрчлийн торгууль нь ахмад настны хамгаалалтын бүстэй адил.","Хүүхдийн хамгаалалтын бүсэд удаан явах тэмдэглэгээ байрлуулж болно.","Хүүхдийн хамгаалалтын бүсэд түр зогсох, зогсоолд тавихыг хориглоно.","Хүүхэд гэмтсэн зам тээврийн осол гарвал тохиролцсон эсэхээс үл хамааран эрүүгийн хариуцлага хүлээнэ."],"a":"1","imgs":[],"t":"문장형","e":"① Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 93 дугаар зүйлийн 2 дахь хэсэгт холбогдох [Хавсралт 10] ② Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] 520 ③ Замын хөдөлгөөний тухай хуулийн 32 дугаар зүйлийн 8 дахь заалт Хүүхдийн хамгаалалтын бүсэд зогсох, зогсоолд тавихыг хориглосон. ④ Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн 3 дугаар зүйлийн 2 дахь хэсгийн тусгай заалт Хүүхдийн хамгаалалтын бүс дотор осол гарсан бол эвлэрсэн эсэхээс үл хамааран эрүүгийн хариуцлага хүлээнэ."},{"n":297,"b":"Хүүхдийн хамгаалалтын бүсэд хүүхэд бага насны хүүхдийг дагуулан хамт зам хөндлөн гарч байна. Жолоочийн зөв үйлдэл аль нь вэ?","c":["Хүүхэд болон бага насны хүүхдийг хамгаалахын тулд түр зогсоно.","Хүүхэд бага насны хүүхдийг хамгаалан гарч байгаа тул удаан явна.","Хүүхэд болон бага насны хүүхэд эсрэг эгнээний талд байгаа тул хурдан өнгөрнө.","Хүүхэд болон бага насны хүүхэд удаан алхдаг тул аюулгүй зай барин хажуугаар нь өнгөрнө."],"a":"1","imgs":[],"t":"문장형","e":"Хөндлөн гарч буй явган зорчигчийн аюулгүй байдлын тулд түр зогсож, хөндлөн гарч дууссаны дараа явна."},{"n":298,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн хамгаалалтын бүстэй холбоотой зөв тайлбар аль нь вэ?","c":["Хүүхэд зөвшөөрөлгүйгээр зам хөндлөн гарч осол гарсан бол жолоочийн бүх хариуцлага чөлөөлөгдөнө.","Унадаг дугуйн жолооч жолоодож байхдаа хүүхэд мөргөсөн тохиолдолд унадаг дугуй нь тээврийн хэрэгсэл болон хөсөг биш тул зөвхөн иргэний хариуцлага хүлээнэ.","Зорчих хэсэг рүү гэнэт гүйж орж ирсэн хүүхдийг харвал удаан явахгүй, харин түр зогсоно.","Цагдаагийн газрын дарга тээврийн хэрэгслийн хурдыг цагт 50 км хүртэл тогтоож болно."],"a":"3","imgs":[],"t":"문장형","e":"Түр зогсох ёстой бөгөөд явган зорчигчийн аюулгүй байдлыг хангах нь нэн тэргүүнд байна."},{"n":299,"b":"Хүүхдийн хамгаалалтын бүсийн талаар болон жолоодох арга юм. Зөв 2 нь аль вэ?","c":["Хүүхдийг хамгаалах шаардлагатай тохиолдолд хурдыг цагт 30 км ба түүнээс бага байхаар хязгаарлаж болох бөгөөд тухайн бүсээр явахдаа үргэлж хурдны хязгаар дотор удаан явна.","Хүүхдийн хамгаалалтын бүсийн хурдны хязгаар нь автомашин, моторт унадаг дугуй, трамвайд хамаарах бөгөөд хүүхэд зам хөндлөн гарч байвал түр зогсоно.","Альтернатив сургууль болон гадаадын сургуулийн ойролцоох зам нь хүүхдийн хамгаалалтын бүсэд хамаарахгүй тул хүүхэд явган хүний гарцаас өөр газраар гарч байвал удаан явна.","Хүүхдийн хамгаалалтын бүсэд хурдны хязгаар болон явган хүний гарцын аюулгүй байдлын тэмдгийг нэн тэргүүнд байрлуулж болох бөгөөд хүүхэд төв шугамын ойролцоо зогсож байвал удаан явна."],"a":"1, 2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 12 дугаар зүйл (Хүүхдийн хамгаалалтын бүсийг тогтоох, цуцлах болон удирдах)-ийн 1 дэх хэсэг: Хотын дарга зэрэг нь зам тээврийн ослын аюулаас хүүхдийг хамгаалахад шаардлагатай гэж үзсэн тохиолдолд автомашин зэрэг болон трамвайн хөдөлгөөний хурдыг цагт 30 километрээс ихгүй байхаар хязгаарлаж болно. 4 дэх заалт: Гадаадын иргэдийн сургууль, альтернатив сургуулийг ч хүүхдийн хамгаалалтын бүсээр тогтоож болно. 5 дахь хэсгийн 2 дахь заалт: Хүүхдийн хамгаалалтын бүсэд хүүхдийн аюулгүй байдлын тулд хурдны хязгаарлалт болон явган хүний гарцтай холбоотой аюулгүйн тэмдэглэгээг тэргүүн ээлжинд байрлуулж болно."},{"n":300,"b":"Дараах зүйлсээс аль нь хүүхдийн сургуулийн автобусны тусгай хамгаалалтын үүргийг зөрчөөгүй үйлдэл вэ? (Нэг чиглэлд 1 эгнээтэй замын тохиолдол)","c":["Хүүхэд эсвэл бага насны хүүхэд бууж байх үед түр зогсолгүйгээр шууд өнгөрсөн.","Эсрэг чиглэлээс ирсэн автомашины жолооч хүүхдийн сургуулийн автобусанд хүрэхээсээ өмнө удаан явсан.","Жолооч хүүхэд эсвэл бага насны хүүхдийг аюулгүй суулгаж, буулгаж байх үед дуут дохио өгөөд өнгөрсөн.","Хүүхэд эсвэл бага насны хүүхэд тээвэрлэж буй тэмдэгтэй хүүхдийн сургуулийн автобусыг гүйцэж түрүүлээгүй."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 51 дүгээр зүйл (Хүүхдийн сургуулийн автобусны онцгой хамгаалалт) ① Хүүхдийн сургуулийн автобус замд зогсож, хүүхэд буюу нялх, балчир хүүхэд сууж, бууж байгааг илэрхийлэх анивчих гэрэл зэргийн төхөөрөмжийг ажиллуулж байх үед хүүхдийн сургуулийн автобусны зогссон эгнээ болон тухайн эгнээний яг хажуугийн эгнээгээр явж буй тээврийн хэрэгслийн жолооч хүүхдийн сургуулийн автобусанд хүрэхээс өмнө түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ② 1 дэх хэсгийн тохиолдолд төвийн шугам тавигдаагүй зам болон нэг чиглэлд 1 эгнээтэй замд эсрэг чиглэлээс явж буй тээврийн хэрэгслийн жолооч ч хүүхдийн сургуулийн автобусанд хүрэхээс өмнө түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ③ Бүх тээврийн хэрэгслийн жолооч хүүхэд буюу нялх, балчир хүүхэд тээвэрлэж яваа гэсэн тэмдэглэгээ хийсэн байдлаар замаар явж буй хүүхдийн сургуулийн автобусыг гүйцэж түрүүлж болохгүй."},{"n":301,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхэд, бага насны хүүхдийн тухай журам болон хүүхдийн сургуулийн автобусны жолоочийн үүргийн зөв тайлбар аль нь вэ?","c":["Хүүхэд гэдэг нь 13 ба түүнээс доош насны хүн бөгөөд хүүхэд сууж, буух үед заавал аюулгүй байдлыг шалгасны дараа хөдөлнө.","Хөдөлгөөн эхлэхээс өмнө бага насны хүүхдээс бусад бүх хүүхдээр суудлын аюулгүйн бүсийг зүүлгэнэ.","Хүүхэд буух үед хүүхдийн хүссэн газарт аюулгүй буулгасны дараа хөдөлнө.","Бага насны хүүхэд гэдэг нь 6-аас доош насны хүн бөгөөд бага насны хүүхэд сууж, бууж байгаа үед ч анивчдаг гэрлийн төхөөрөмжийг ажиллуулах ёстой."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 53 дугаар зүйл (Хүүхдийн сургуулийн автобусны жолооч болон ашиглагчийн үүрэг) Хүүхдийн сургуулийн автобус жолооддог хүн хүүхэд буюу нялх, балчир хүүхэд сууж, бууж байгаа тохиолдолд л анивчих гэрэл зэргийн төхөөрөмжийг ажиллуулах ёстой бөгөөд хүүхэд буюу нялх, балчир хүүхэд тээвэрлэж явж байгаа тохиолдолд л Замын хөдөлгөөний тухай хуулийн 51 дүгээр зүйлийн 3 дахь хэсгийн дагуух тэмдэглэгээг хийх ёстой. 2 дахь хэсэг: Хүүхэд буюу нялх, балчир хүүхэд буух үед явган хүний зам буюу замын захын бүс зэрэг автомашинаас аюулгүй газарт хүрснийг шалгасны дараа хөдлөх ёстой."},{"n":302,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхэд эсвэл бага насны хүүхдийг суулгах, буулгах зориулалттай хүүхдийн сургуулийн автобусанд суурилуулсан шар болон улаан дохионы гэрлийг ажиллуулах аргын зөв тайлбар аль нь вэ?","c":["Зогсох үед улаан гэрлийг анивчуулан ажиллуулах ёстой.","Тоормослох үед улаан гэрлийг анивчуулан ажиллуулах ёстой.","Зам дээр зогсох гэж байгаа үед шар гэрлийг анивчуулан ажиллуулах ёстой.","Машинаа тавих үед шар болон улаан гэрлийг зэрэг анивчуулан ажиллуулах ёстой."],"a":"3","imgs":[],"t":"문장형","e":"Автомашин болон автомашины эд ангийн гүйцэтгэл, стандартын тухай дүрмийн 48 дугаар зүйл (Гэрэлтүүлэхтэй холбоотой бусад стандарт)-ийн 4 дэх хэсгийн 5 дахь заалт"},{"n":303,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн хамгаалалтын бүс тогтоох үндэслэл болдог хуульд хамаарахгүй нь аль вэ?","c":["Сургуулийн өмнөх боловсролын тухай хууль","Бага, дунд боловсролын тухай хууль","Сургалтын төв байгуулах, ажиллуулах болон хувийн сургалтын тухай хууль","Хүүхдийн халамжийн тухай хууль"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 12 дугаар зүйлд Сургуулийн өмнөх боловсролын тухай хууль, Бага, дунд боловсролын тухай хууль, Хувийн сургалтын төв байгуулах, ажиллуулах болон нэмэлт сургалтын тухай хууль зэргийг хүүхдийн хамгаалалтын бүсийг тогтоох үндэслэл болох хууль гэж тодорхой заасан байдаг."},{"n":304,"b":"Дараах нь хүүхдийн хамгаалалтын бүсийн тухай тайлбар юм. Буруу нь аль вэ?","c":["Энэ бүсэд гарсан зам тээврийн осол нь зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн онцгой зохицуулалтаас ха сагдах тохиолдолд хамаарч болно.","Тээврийн хэрэгслийн хурдыг цагт 30 км дотор хязгаарлаж болно.","Зөрчлийн торгууль болон торгуулийн оноо нь ердийн замаас 3 дахин их байна.","Түр зогсох, зогсоолд тавихыг хориглоно."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 12 дугаар зүйлийн 1 дэх хэсэг, Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн 3 дугаар зүйлийн 2 дахь хэсгийн 11 дэх заалт, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 10 Хүүхдийн хамгаалалтын бүс болон ахмад настан, хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүс дэх зөрчлийн үйлдэл болон зөрчлийн торгуулийн хэмжээ"},{"n":305,"b":"Замын хөдөлгөөний тухай хуулийн дагуу аюулгүй явган зорчихгүй байгаа хүүхэд аль нь вэ?","c":["Явган хүний зам болон зорчих хэсэг тусгаарлагдсан замд зорчих хэсгийн захаар явж буй хүүхэд","Нэг чигийн хөдөлгөөнтэй замын захаар автомашин ирж буй зүг рүү харж алхаж буй хүүхэд","Явган хүний зам болон зорчих хэсэг тусгаарлагдаагүй замын захын бүсээр автомашин ирж буй чиглэл өөд харж алхаж буй хүүхэд","Явган хүний замын баруун талаар алхаж буй хүүхэд"],"a":"1","imgs":[],"t":"문장형","e":"Явган зорчигч нь явган хүний зам, зорчих хэсэг нь тусгаарлагдсан замд үргэлж явган хүний замаар явах ёстой. Явган хүний зам, зорчих хэсэг нь тусгаарлагдаагүй замд замын захаар буюу замын захын бүсээр явах ёстой. Явган зорчигч явган хүний зам дээр баруун талаар явахыг зарчим болгоно (Замын хөдөлгөөний тухай хуулийн 8 дугаар зүйл)."},{"n":306,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийг хамгаалах тайлбар юм. Буруу нь аль вэ?","c":["Явган хүний гарцгүй замаар хүүхэд гарч байвал удаан явах ёстой.","Аюулгүйн бүс дээр хүүхэд зогсож байвал аюулгүй зай барин удаан явна.","Нарийн гудамжаар хүүхэд алхаж байвал аюулгүй зай барин удаан явна.","Явган хүний гарцаар хүүхэд гарч байвал гарцын өмнө түр зогсох ёстой."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах) ① Бүх тээврийн хэрэгсэл болон трамвайн жолооч нь явган зорчигч (13-2 дугаар зүйл-ын 6 дахь хэсгийн дагуу унадаг дугуй зэргээс бууж, унадаг дугуй зэргийг түлхэж буюу өргөж явж буй унадаг дугуй зэргийн жолоочийг оролцуулна) явган хүний гарцаар гарч байгаа буюу гарах гэж байгаа үед явган зорчигчийн хөндлөн гарахад саад учруулах буюу аюул учруулахгүйн тулд тухайн явган хүний гарцын өмнө (зогсох шугам тавигдсан газарт тухайн зогсох шугамыг хэлнэ) түр зогсох ёстой. ② Бүх тээврийн хэрэгсэл болон трамвайн жолооч нь замын хөдөлгөөний зохицуулалт хийгдэж буй уулзварт зүүн буюу баруун тийш эргэх тохиолдолд гэрлэн дохио буюу цагдаагийн алба хаагч зэргийн дохио, заавраар замыг хөндлөн гарч буй явган зорчигчийн хөдөлгөөнд саад учруулж болохгүй. ③ Бүх тээврийн хэрэгслийн жолооч нь замын хөдөлгөөний зохицуулалт хийгдээгүй уулзвар буюу түүний ойролцоох замыг хөндлөн гарч буй явган зорчигчийн хөдөлгөөнд саад учруулж болохгүй. ④ Бүх тээврийн хэрэгслийн жолооч нь замд байрлуулсан аюулгүйн бүсэд явган зорчигч байгаа тохиолдолд болон эгнээ тэмдэглээгүй нарийн замд явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явах ёстой. ⑤ Бүх тээврийн хэрэгсэл болон трамвайн жолооч нь явган зорчигч 10 дугаар зүйлийн 3 дахь хэсгийн дагуу явган хүний гарц тавигдаагүй замыг хөндлөн гарч байгаа үед аюулгүй зай барьж түр зогсож, явган зорчигчийг аюулгүй хөндлөн гарах боломжоор хангах ёстой. ⑥ Бүх тээврийн хэрэгслийн жолооч нь дараах заалтуудын аль нэгэнд хамаарах газарт явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явах ёстой бөгөөд явган зорчигчийн хөдөлгөөнд саад болох үед удаан явах буюу түр зогсож, явган зорчигчийг аюулгүй явах боломжоор хангах ёстой. 1. Явган хүний зам болон зорчих хэсэг нь тусгаарлагдаагүй замын дотроос төвийн шугамгүй зам 2. Явган зорчигчийн давуу эрхтэй зам 3. Замаас бусад газар ⑦ Бүх тээврийн хэрэгсэл болон трамвайн жолооч нь 12 дугаар зүйлийн 1 дэх хэсгийн дагуух хүүхдийн хамгаалалтын бүс дотор байрлуулсан явган хүний гарцын дотроос гэрлэн дохио тавигдаагүй явган хүний гарцын өмнө (зогсох шугам тавигдсан тохиолдолд тухайн зогсох шугамыг хэлнэ) явган зорчигч хөндлөн гарч байгаа эсэхээс үл хамааран түр зогсох ёстой."},{"n":307,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн сургуулийн автобусны тусгай хамгаалалтын талаар жолоочийн үүргийг зөв тайлбарласан нь аль вэ?","c":["Улаан анивчдаг гэрэл ажиллаж байгаа хүүхдийн сургуулийн автобус зогссон эгнээний яг хажуугийн эгнээгээр зорчих үед түр зогсох ёстой.","Зам дээр явж буй бүх хүүхдийн сургуулийн автобусыг гүйцэж түрүүлэхийг хориглоно.","Энэ үүргийг зөрчвөл жолооны үнэмлэхэд 15 торгуулийн оноо ногдуулна.","Нэг чиглэлд 1 эгнээтэй замд улаан анивчдаг гэрэлтэй хүүхдийн сургуулийн автобус зогссон тохиолдолд энэ үүрэг үйлчлэхгүй."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 19 дэх заалт, Замын хөдөлгөөний тухай хуулийн 51 дүгээр зүйл, Автотээврийн хэрэгслийн удирдлагын тухай хууль, Автомашин болон автомашины эд ангийн гүйцэтгэл, стандартын тухай дүрэм ① Хүүхдийн сургуулийн автобус замд зогсож, хүүхэд буюу нялх, балчир хүүхэд сууж, бууж байгааг илэрхийлэх анивчих гэрэл зэргийн төхөөрөмжийг ажиллуулж байх үед хүүхдийн сургуулийн автобусны зогссон эгнээ болон тухайн эгнээний яг хажуугийн эгнээгээр явж буй тээврийн хэрэгслийн жолооч хүүхдийн сургуулийн автобусанд хүрэхээс өмнө түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ② 1 дэх хэсгийн тохиолдолд төвийн шугам тавигдаагүй зам болон нэг чиглэлд 1 эгнээтэй замд эсрэг чиглэлээс явж буй тээврийн хэрэгслийн жолооч ч хүүхдийн сургуулийн автобусанд хүрэхээс өмнө түр зогсож, аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ③ Бүх тээврийн хэрэгслийн жолооч хүүхэд буюу нялх, балчир хүүхэд тээвэрлэж яваа гэсэн тэмдэглэгээ хийсэн байдлаар замаар явж буй хүүхдийн сургуулийн автобусыг гүйцэж түрүүлж болохгүй. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28. Хүүхдийн сургуулийн автобусны онцгой хамгаалалтын үүргийг зөрчсөн үед жолоодох эрхийн торгуулийн оноо 30 оноо ногдуулна."},{"n":308,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн асран хамгаалагчид торгууль ногдуулах нөхцөл аль нь вэ?","c":["Хүүхдээр зорчих хэсэг дээр унадаг дугуй унуулсан асран хамгаалагч","Тоглоомын талбай дээр хүүхдээр цахилгаан кик скүүтер унуулахыг зөвшөөрсөн асран хамгаалагч","Хүүхдээр зорчих хэсэг дээр цахилгаан кик скүүтер унуулахыг зөвшөөрсөн асран хамгаалагч","Тоглоомын талбай дээр хүүхдээр унадаг дугуй унуулахыг зөвшөөрсөн асран хамгаалагч"],"a":"3","imgs":[],"t":"문장형","e":"Хүүхдийн асран хамгаалагч нь замд хүүхдээр хувийн хөдөлгөөнт хэрэгсэл жолоодуулж болохгүй бөгөөд (Замын хөдөлгөөний тухай хуулийн 11 дүгээр зүйлийн 4 дэх хэсэг), үүнийг зөрчвөл 200,000 вон хүртэл захиргааны торгууль ногдуулна (Замын хөдөлгөөний тухай хуулийн 160 дугаар зүйлийн 2 дахь хэсгийн 9 дэх заалт)."},{"n":309,"b":"Жолоодож байх үед хүүхдийн хамгаалалтын бүсэд хүүхдийг гэмтээсэн бол тодорхой төрлийн гэмт хэрэгт оногдуулах ялыг хүндрүүлэх тухай хуулийн дагуу эрүүгийн хариуцлагын зөв хэмжээ аль нь вэ?","c":["1 жил ба түүнээс дээш 15 жил ба түүнээс доош хүртэл хорих ял эсвэл 5,000,000 вон ба түүнээс дээш 30,000,000 вон ба түүнэ эс доош хүртэл торгууль","Бүх насаар хорих ял эсвэл 5 жил ба түүнээс дээш хорих ял","2 жил ба түүнээс доош хорих ял эсвэл 5,000,000 вон ба түүнээс доош торгууль","5 жил ба түүнээс доош хорих ял эсвэл 20,000,000 вон ба түүнээс доош торгууль"],"a":"1","imgs":[],"t":"문장형","e":"Тодорхой төрлийн гэмт хэрэгт оногдуулах ялыг хүндрүүлэх тухай хуулийн 5 дугаар зүйлийн 13 Замын хөдөлгөөний тухай хуулийн 12 дугаар зүйлийн 3 дахь хэсэг Хүүхдийн хамгаалалтын бүсэд мөн зүйлийн 1 дэх хэсгийн дагуух арга хэмжээг дагаж мөрдөх ёстой бөгөөд Тодорхой төрлийн гэмт хэрэгт оногдуулах ялыг хүндрүүлэх тухай хуулийн 5 дугаар зүйлийн 13-ын дагуу гэмтэл учруулсан тохиолдолд 1 жилээс 15 жил хүртэл хорих ял буюу 5,000,000 воноос 30,000,000 вон хүртэл торгууль ногдуулна."},{"n":310,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн сургуулийн автобусны ашиглагчийн үүргийн талаар буруу тайлбар аль нь вэ?","c":["Хүүхдийг хүүхдийн сургуулийн автобусанд суулгах үед насанд хүрсэн хүнийг хамгаалагчаар томилох ёстой.","Хүүхдийн сургуулийн автобусны ажиллагаа дууссаны дараа бүх хүүхэд болон бага насны хүүхэд буусан эсэхийг шалгах ёстой.","Суудлын аюулгүйн бүс хэрэглэсэн эсэх болон хамгаалагч хамт явсан эсэхийн бүртгэлийг хөтөлж хадгалах ёстой.","Суудлын аюулгүйн бүс хэрэглэсэн болон хамгаалагч хамт явсан эсэхийн бүртгэлийг улирал бүр хүүхдийн сургуулийн автобус ажиллуулдаг байгууллагын хяналтын байгууллагад хүргүүлнэ."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 53 дугаар зүйлийн 3 дахь хэсэг, 6 дахь хэсэг Хүүхдийн сургуулийн автобус ашигладаг этгээд нь хүүхдийн сургуулийн автобусанд хүүхэд буюу нялх, балчир хүүхэд суулгахдаа насанд хүрсэн хүмүүсийн дотроос хүүхдийн сургуулийн автобус ашигладаг этгээдийн томилсон асран хамгаалагчийг хамт суулгаж явуулах ёстой бөгөөд хамт суусан асран хамгаалагч нь хүүхэд буюу нялх, балчир хүүхэд сууж буюу буух үед автомашинаас бууж хүүхэд буюу нялх, балчир хүүхэд аюулгүй сууж, буухыг шалгаж, явж байх үед хүүхэд буюу нялх, балчир хүүхдийг суудалдаа сууж суудлын хамгаалах бүсээ зүүсэн байлгах зэрэг хүүхдийг хамгаалахад шаардлагатай арга хэмжээг авах ёстой. Замын хөдөлгөөний тухай хуулийн 53 дугаар зүйлийн 6 дахь хэсэг, хүүхдийн сургуулийн автобус ашигладаг этгээд нь 3 дахь хэсгийн дагуу асран хамгаалагчийг хамт суулгаж явуулах тохиолдолд Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон асран хамгаалагч хамт сууснийг илэрхийлэх тэмдэг (цаашид \"асран хамгаалагч хамт суусан тэмдэг\" гэх)-ийг наах боломжтой бөгөөд хэн ч асран хамгаалагчийг хамт суулгахгүйгээр явуулах тохиолдолд асран хамгаалагч хамт суусан тэмдгийг нааж болохгүй. 7 дахь хэсэг Хүүхдийн сургуулийн автобус ашигладаг этгээд нь суудлын хамгаалах бүс зүүсэн болон асран хамгаалагч хамт сууснийг шалгасан бүртгэл (цаашид \"аюулгүй үйл ажиллагааны бүртгэл\" гэх)-ийг үйлдэж, хадгалах ёстой бөгөөд улирал бүр хүүхдийн сургуулийн автобус ашигладаг байгууллагыг хянан удирддаг эрх бүхий байгууллагын даргад аюулгүй үйл ажиллагааны бүртгэлийг хүргүүлэх ёстой. ② нь хүүхдийн сургуулийн автобусны жолоочийн үүрэг юм."},{"n":311,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн сургуулийн автобусанд насанд хүрсэн хамгаалагч байхгүй атлаа \"Асран хамгаалагч хамт явж байна\" гэсэн тэмдэг байрлуулсан тохиолдолд ямар шийтгэл ногдуулах вэ?","c":["200,000 вон ба түүнээс доош торгууль эсвэл баривчлах ял","300,000 вон ба түүнээс доош торгууль эсвэл баривчлах ял","400,000 вон ба түүнээс доош торгууль эсвэл баривчлах ял","500,000 вон ба түүнээс доош торгууль эсвэл баривчлах ял"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 53 дугаар зүйл, 154 дүгээр зүйл Хүүхдийн сургуулийн автобусны асран хамгаалагчийг суулгахгүйгээр явж буй хүүхдийн сургуулийн автобусанд асран хамгаалагч хамт суусан тэмдэг наасан хүнд 300,000 вон хүртэл торгууль буюу баривчлах ял оногдуулна."},{"n":312,"b":"Замын хөдөлгөөний тухай хуулийн дагуу ахмад жолоочийн таних тэмдгийн талаар зөв тайлбар аль нь вэ?","c":["Ахмад жолоочийн таних тэмдэг гэдэг нь жолооны үнэмлэхтэй 65 ба түүнээс дээш насны хүн жолоодож буй автомашиныг илтгэх тэмдэг юм.","Суурь өнгө нь цэнхэр, бичиг нь шар өнгөтэй байна.","Урд тал нь салгаж, буцаан тогтоох боломжтой соронзон резинээр, ар тал нь гэрэл ойлгогч материалаар хийгдэнэ.","Автомашины урд хэсэгт жолоодлогод саад болохгүй, харагдахуйц газар байрлуулна."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 10-2 дугаар зүйл (Ахмад настан жолоочийн тэмдгийг үйлдвэрлэх, тараах) ① Цагдаагийн ерөнхий газрын дарга нь хуулийн 7-2 дугаар зүйл-ын 1 дэх хэсгийн дагуу жолоодох эрх авсан 65 ба түүнээс дээш настай хүний жолоодож буй тээврийн хэрэгсэл болохыг илэрхийлэх тэмдэг (цаашид \"ахмад настан жолоочийн тэмдэг\" гэх)-ийг үйлдвэрлэж тарааж болно. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 8-ын 2 <Үйлдвэрлэх арга> а. Дэвсгэр нь тэнгэрийн цэнхэр, үсэг нь цагаан өнгөтэй байна. б. Урд талыг гэрэл ойлгогч цаасаар, ар талыг нааж, авч болохуйц резинэн соронзоор хийнэ. в. Үсгийн хэлбэрийг Соёл, спорт, аялал жуулчлалын яамны тогтоосон гарчгийн үсгийн хэлбэрээр хийнэ. г. Тэмдгийн хэмжээ болон үсгийн хэмжээг өөрчлөхгүй хүрээнд шаардлагатай үг хэллэг зэргийг оруулж болно. <Наах газар> Тээврийн хэрэгслийн ар талын дотроос аюулгүй жолоодлогод саад болохгүй бөгөөд харагдах байдлыг хангаж чадах газарт наана."},{"n":313,"b":"｢Ахмад настны хамгаалалтын бүс｣-д ахмад настны аюулгүй байдлыг хангах зорилгоор аймаг, нийслэлийн цагдаагийн газрын дарга эсвэл цагдаагийн газрын даргын авч болох арга хэмжээнд хамаарахгүй нь аль вэ?","c":["Тээврийн хэрэгсэл болон хөсгийн хөдөлгөөнийг хориглох эсвэл хязгаарлаж болно.","Нарийн гудамжийг нэг чигийн хөдөлгөөнтэй зам болгон тогтоож, ажиллуулж болно.","Тээврийн хэрэгсэл болон хөсгийн хурдыг цагт 30 км ба түүнээс бага байхаар хязгаарлаж болно.","Үндсэн үүднээс холбогдох зам дээр ахмад настанд зориулсан ил задгай авто зогсоол байгуулж болно."],"a":"4","imgs":[],"t":"문장형","e":"Хүүхэд, ахмад настан болон хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох, удирдах тухай дүрмийн 9 дүгээр зүйл (Хамгаалалтын бүсэд шаардлагатай арга хэмжээ)-ийн 1 дэх хэсэгт зааснаар аймаг, нийслэлийн Цагдаагийн газар буюу цагдаагийн хэлтсийн дарга нь хамгаалалтын бүсэд хэсэг тус бүрээр, цагийн хуваарь тус бүрээр дараах арга хэмжээг авч болно. 1. Тээврийн хэрэгсэл, хөсгийн хөдөлгөөнийг хориглох буюу хязгаарлах. 2. Тээврийн хэрэгсэл, хөсгийг зогсох буюу зогсоолд тавихыг хориглох. 3. Хөдөлгөөний хурдыг цагт 30 километрээс дотор хязгаарлах. 4. Туслах замыг нэг чиглэлийн хөдөлгөөнтэй замаар тогтоож, ашиглах"},{"n":314,"b":"Замын хөдөлгөөний тухай хуулийн дагуу ахмад настны хамгаалалтын бүсэд хөдөлгөөнийг хориглож болох тээврийн хэрэгслийн зөв төрөл аль нь вэ?","c":["Хувийн хөдөлгөөнт хэрэгсэл, унадаг дугуй","Ачааны автомашинд суурилуулсан өрмийн төхөөрөмж, хүүхдийн кик скүүтер","Моторт унадаг дугуй, өргөн нь 1 метр ба түүнээс бага явган зорчигчид зориулсан тэргэнцэр","Зам тэгшлэгч, өргөн нь 1 метр ба түүнээс бага ахмад настан болон хөгжлийн бэрхшээлтэй хүмүүст зориулсан алхагч"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 12-2 дугаар зүйл (Ахмад настан болон хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох, цуцлах болон удирдах) ① Хотын дарга зэрэг нь зам тээврийн ослын аюулаас ахмад настан буюу хөгжлийн бэрхшээлтэй иргэнийг хамгаалахад шаардлагатай гэж үзсэн тохиолдолд 1 дэх заалтаас 3 дахь заалт хүртэлх болон 3 дахь заалтын 2-ын дагуух байгууламж буюу газрын эргэн тойрны замын дотроос тодорхой хэсгийг ахмад настны хамгаалалтын бүсээр, 4 дэх заалтын дагуух байгууламжийн эргэн тойрны замын дотроос тодорхой хэсгийг хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсээр тус тус тогтоож, тээврийн хэрэгсэл, хөсөг болон трамвайн хөдөлгөөнийг хязгаарлах буюу хориглох зэрэг шаардлагатай арга хэмжээг авч болно. Унадаг дугуй ч тээврийн хэрэгсэл, хөсөгт хамаарна."},{"n":315,"b":"Замын хөдөлгөөний тухай хуулийн дагуу өглөөний 10:00 цагийн үед ахмад настны хамгаалалтын бүсэд гаргасан дүрмийн зөрчлийн талаар зөв тайлбар аль нь вэ?","c":["Өөрөө буулгагч ачааны машины жолооч гэрлэн дохио зөрчвөл 130,000 воны зөрчлийн торгуультай.","Суудлын автомашины жолооч ахмад явган зорчигчийн хөдөлгөөнд саад учруулбал 70,000 воны зөрчлийн торгуультай.","Унадаг дугуйн жолооч явган хүний гарцаар гарч буй ахмад явган зорчигчид саад учруулбал 50,000 воны зөрчлийн торгуультай.","Мотоблокийн жолооч явган зорчигчийг хамгаалах үүргээ биелүүлээгүй бол 30,000 воны зөрчлийн торгуультай."],"a":"1","imgs":[],"t":"문장형","e":"Гэрлэн дохио зөрчих (самосвал ачааны автомашин 130,000 вон), явган хүний гарц дээр явган зорчигчийн хөндлөн гарахад саад учруулах (суудлын автомашин 120,000 вон, унадаг дугуй 60,000 вон), явган зорчигчийн хөдөлгөөнд саад учруулах буюу хамгаалах үүргээ биелүүлээгүй (суудлын автомашин 80,000 вон, унадаг дугуй 40,000 вон) зөрчлийн торгууль ногдуулна."},{"n":316,"b":"Ахмад настны хамгаалалтын бүс болон хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох, цуцлах журам, шалгуур зэрэг шаардлагатай асуудлыг зохицуулдаг яаманд хамаарахгүй нь аль вэ?","c":["Соёл, спорт, аялал жуулчлалын яам","Дотоод хэрэг, аюулгүй байдлын яам","Эрүүл мэнд, нийгмийн хамгааллын яам","Газрын харилцаа, дэд бүтцийн яам"],"a":"1","imgs":[],"t":"문장형","e":"Ахмад настны хамгаалалтын бүс буюу хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох, цуцлах журам болон стандарт зэрэгтэй холбоотой шаардлагатай зүйлийг Дотоод хэрэг, аюулгүй байдлын яам, Эрүүл мэнд, нийгмийн хамгааллын яам болон Газар, дэд бүтэц, тээврийн яамны хамтарсан тушаалаар тогтооно."},{"n":317,"b":"Дараах этгээдээс ахмад настны хамгаалалтын бүсийг тогтоох эрхгүй нь аль вэ?","c":["Тусгай хотын дарга","Том хотын дарга","Тусгай өөртөө засах аймгийн Засаг дарга","Аймаг, нийслэлийн цагдаагийн газрын дарга"],"a":"4","imgs":[],"t":"문장형","e":"Хүүхэд, ахмад настан болон хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох, удирдах тухай дүрмийн 3 дугаар зүйлийн 1 дэх хэсэг"},{"n":318,"b":"Замын хөдөлгөөнд эмзэг оролцогч болох ахмад настны ерөнхий онцлогийн талаар зөв тайлбар аль нь вэ?","c":["Рефлекс удаан боловч туршлагадаа үндэслэн хурдан шийдвэр гаргах боломжтой.","Хараа мууддаг боловч сонсгол сайжирч, сул чимээнд хүртэл мэдрэмтгий болдог.","Гэнэтийн нөхцөлд хариу үзүүлэх чадвар сул боловч танин мэдэх чадвар нь сайжирдаг.","Нас ахих тусам биеийн хөдөлгөөн удааширч, үйлдэл хийх чадвар мууддаг."],"a":"4","imgs":[],"t":"문장형","e":"Ахмад настны ерөнхий онцлог нь рефлекс удааширч, хараа болон сонсгол сулардаг бөгөөд биеийн байдал хөгшрөх тусам гэнэтийн нөхцөл байдалд хариу үйлдэл үзүүлэх чадвар болон танин мэдэх чадвар ч аажмаар буурдаг."},{"n":319,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хотын дарга зэрэг эрх бүхий байгууллага ахмад настны хамгаалалтын бүсэд авч болох зөв арга хэмжээ аль нь вэ?","c":["Тээврийн хэрэгсэл болон хөсөг, трамвайн хөдөлгөөнийг хязгаарлах эсвэл хориглож болно.","Том оврын олон суудалт автомашины хөдөлгөөнийг хориглож болох боловч трамвайн хөдөлгөөнийг хязгаарлаж болохгүй.","Хоёр дугуйт тээврийн хэрэгслийн хөдөлгөөнийг хориглож болох боловч унадаг дугуйн хөдөлгөөнийг хязгаарлаж болохгүй.","Барилгын машины хөдөлгөөнийг хориглож болохгүй боловч хязгаарлаж болно."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 12-2 дугаар зүйл (Ахмад настан болон хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох, цуцлах болон удирдах)-ын 1 дэх хэсэг Хотын дарга зэрэг нь хамгаалалтын бүсээр тус тус тогтоож, тээврийн хэрэгсэл, хөсөг болон трамвайн хөдөлгөөнийг хязгаарлах буюу хориглох зэрэг шаардлагатай арга хэмжээг авч болно. [Хэрэгжих огноо: 2023 оны 10 дугаар сарын 19-ний өдөр]"},{"n":320,"b":"Явган хүний гэрлэн дохиогүй гарцаар гарч байсан ахмад настныг суудлын автомашины жолооч оройтож анзаарч, хүчтэй тоормослосон боловч мөргөж (2 долоо хоногийн эмчилгээ хийгдэнэ гэж гарсан) зам тээврийн осол гарчээ. Зөв тайлбар болох 2-ыг сонгоно уу.","c":["Явган хүний гэрлэн дохио байхгүй тул автомашины жолооч ямар ч буруугүй.","Автомашины жолооч иргэний хариуцлага хүлээнэ.","Зам хөндлөн гарсан ахмад настан л эрүүгийн хариуцлага хүлээнэ.","Автомашины жолооч эрүүгийн хариуцлага хүлээнэ."],"a":"2, 4","imgs":[],"t":"문장형","e":"Явган хүний гарц дээрх зам тээврийн ослын улмаас жолоочид иргэний болон эрүүгийн хариуцлага үүснэ."},{"n":321,"b":"Харьяалах цагдаагийн газрын дарга ахмад настны хамгаалалтын бүсэд авч болох арга хэмжээний зөв 2-ыг сонгоно уу.","c":["Автомашины хөдөлгөөнийг хориглох эсвэл хязгаарлах","Автомашины түр зогсох, зогсоолд тавихыг хориглох","Ил задгай авто зогсоол байгуулах","Явган зорчигчийн хөдөлгөөнийг хориглох эсвэл хязгаарлах"],"a":"1, 2","imgs":[],"t":"문장형","e":"Хүүхэд, ахмад настан болон хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох, удирдах тухай дүрмийн 9 дүгээр зүйл (Хамгаалалтын бүсэд шаардлагатай арга хэмжээ) 1. Тээврийн хэрэгсэл, хөсгийн хөдөлгөөнийг хориглох буюу хязгаарлах 2. Тээврийн хэрэгсэл, хөсгийг зогсох буюу зогсоолд тавихыг хориглох 3. Хөдөлгөөний хурдыг цагт 30 километрээс дотор хязгаарлах 4. Туслах замыг (хотын бүсэд гол зам биш бөгөөд нийтийн хөдөлгөөнд ашиглагддаг замыг хэлнэ) нэг чиглэлийн хөдөлгөөнтэй замаар тогтоож, ашиглах"},{"n":322,"b":"Ахмад настны хамгаалалтын бүсэд ахмад настны хажуугаар өнгөрөх үед жолоочийн зөв жолоодох арга аль нь вэ?","c":["Одоогийн хурдаа хадгалан хурдан өнгөрнө.","Ахмад настнаас хангалттай зай авч, удаан явж өнгөрнө.","Дуут дохио өгч хурдан өнгөрнө.","Урд гэрлээ анивчуулан өнгөрнө."],"a":"2","imgs":[],"t":"문장형","e":"Ахмад настантай хангалттай зай барьж удаан явж өнгөрнө."},{"n":323,"b":"Ахмад настны хамгаалалтын бүсэд ахмад настны аюулгүй байдлыг хангах зорилгоор суурилуулж болох замын байгууламжаас хамгийн хол хамааралтай нь аль вэ?","c":["Хальтиргаа эсэргүүцэх байгууламж, хамгаалалтын хашлага","Хурд сааруулагч байгууламж, хальтиргаа эсэргүүцэх байгууламж","Хурд авах эгнээ, хамгаалалтын бүсийн замын тэмдэг","Хамгаалалтын хашлага, замын тусгалын толь"],"a":"3","imgs":[],"t":"문장형","e":"Хүүхэд, ахмад настан болон хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох, удирдах тухай дүрмийн 7 дугаар зүйл (Явган хүний зам болон замын туслах байгууламж байрлуулах)-ийн 2 дахь хэсэг Хотын дарга зэрэг нь хамгаалалтын бүсэд дараах заалтуудын аль нэгэнд хамаарах замын туслах байгууламжийг байрлуулах буюу харьяа замын удирдлагын байгууллагад байрлуулахыг хүсэх боломжтой. 1. Хавсралтын дагуух хамгаалалтын бүсийн замын тэмдэг 2. Замын толь 3. Хурд сааруулах байгууламж 4. Гулгалтаас хамгаалах байгууламж 5. Хамгаалалтын хашлага 6. Бусад хотын дарга зэргийн зам тээврийн ослын аюулаас хүүхэд, ахмад настан буюу хөгжлийн бэрхшээлтэй иргэнийг хамгаалахад шаардлагатай гэж үзсэн замын туслах байгууламж бөгөөд \"Замын бүтэц, байгууламжийн стандартын тухай дүрэм\"-д нийцсэн байгууламж"},{"n":324,"b":"Шөнийн цагаар ахмад настны хамгаалалтын бүсээр өнгөрөх үед жолоочийн анхаарах ёсгүй зүйл аль нь вэ?","c":["Алга болох үзэгдэл үүсч болзошгүй тул анхаарна.","Шөнө ахмад настан байдаггүй тул хурдаа нэмэгдүүлэн өнгөрнө.","Зөвшөөрөлгүйгээр зам хөндлөн гарч буй ахмад настанд анхаарна.","Хар хувцастай ахмад настан харагдахгүй байж болох тул болгоомжлоно."],"a":"2","imgs":[],"t":"문장형","e":"Шөнийн цагт ч ахмад настны хөдөлгөөн байж болзошгүй тул удаан явж өнгөрнө."},{"n":325,"b":"Замын хөдөлгөөний тухай хуулийн дагуу ахмад настны хамгаалалтын бүс дэх гэрлэн дохиотой явган хүний гарцаар зорчих болон дүрэм зөрчсөнтэй холбоотой тайлбараас буруу нь аль вэ?","c":["Автомашины жолооч гэрэл солигдсон даруйд хөдөлж болохгүй, орчноо шалган аажмаар хөдөлнө.","Суудлын автомашины жолооч өглөөний 08:00–20:00 цагийн хооронд гэрлэн дохио зөрчвөл 120,000 воны зөрчлийн торгуультай.","Унадаг дугуйн жолооч ч гарч амжаагүй ахмад настан байвал түүнийг аюулгүй гарч дуусах хүртэл хүлээнэ.","Хоёр дугуйт тээврийн хэрэгслийн жолооч өглөөний 08:00–20:00 цагийн хооронд явган хүний гарцаар гарч буй явган зорчигчид саад учруулбал 90,000 воны зөрчлийн торгуультай."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын [Хавсралт 10] Ахмад настны хамгаалалтын бүсэд суудлын автомашины жолооч гэрлэн дохио зөрчсөн тохиолдолд 120,000 вон зөрчлийн торгууль ногдуулах бөгөөд хоёр дугуйт тээврийн хэрэгслийн жолооч явган хүний гарц дээр явган зорчигчийн хөндлөн гарахад саад учруулсан тохиолдолд 80,000 вон зөрчлийн торгууль ногдуулна."},{"n":326,"b":"Ахмад настны хамгаалалтын бүсийн талаар тайлбар юм. Буруу нь аль вэ?","c":["Өглөөний 08:00–20:00 цагийн хооронд хурдны хязгаар зөрчвөл зөрчлийн торгуулийн хэмжээ нэмэгдэнэ.","Явган хүний гэрлэн дохионы хугацаа нь ердийн замынхаас илүү урт байдаг.","Ил задгай авто зогсоол байгуулж болохгүй.","Ахмад настанд илүү сайн харагдуулахын тулд гэрлэн дохиог стандартаас томоор суурилуулж болно."],"a":"4","imgs":[],"t":"문장형","e":"Ахмад настны биеийн байдлыг харгалзан явган зорчигчийн дохионы үргэлжлэх хугацааг хөгжлийн бэрхшээлтэй иргэдийн дундаж алхах хурдыг үндэслэн тогтоодог тул ердийн замын явган зорчигчийн дохионоос илүү урт байдаг (Хүүхэд, ахмад настан болон хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох, удирдах тухай дүрмийн 6 дугаар зүйлийн 2 дахь хэсэг, 2023 оны Гэрлэн дохио суурилуулах, ажиллуулах ажлын гарын авлагын 2 дугаар дэвтрийн 2 дугаар бүлэг Явган зорчигчийн дохионы ажиллагаа-г үзнэ үү). Гэрлэн дохиог журамд зааснаас том хэмжээтэй суурилуулж болохгүй."},{"n":327,"b":"Замын хөдөлгөөний тухай хуулийн дагуу суудлын автомашины жолооч өглөөний 11:00 цагийн үед ахмад настны хамгаалалтын бүсэд хурдны хязгаарыг 25 км/цаг-аар хэтрүүлсэн бол хэдэн торгуулийн оноо авах вэ?","c":["60 оноо","40 оноо","30 оноо","15 оноо"],"a":"3","imgs":[],"t":"문장형","e":"Ахмад настны хамгаалалтын бүсэд өглөөний 8 цагаас оройн 8 цаг хүртэл хурдны дээд хязгаарыг зөрчсөн тохиолдолд торгуулийн оноог 2 дахин ногдуулна. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28)"},{"n":328,"b":"Ахмад настны хамгаалалтын бүс дэх гэрлэн дохиотой явган хүний гарцад ойртож байх үед жолоодох аргын талаар буруу нь аль вэ?","c":["Явган хүний гэрэл улаан болсон ч ахмад настан гарч байвал гарч дуусахыг хүлээсний дараа хөдөлнө.","Гэрэл солигдохыг урьдчилан таамаглан урьдчилж хөдөлнө.","Аюулгүй зогсож чадах хурдаар удаан явж, улаан гэрэлд зогсоно.","Ахмад настны алхах хурд удаан байдгийг тооцон анхааралтай явна."],"a":"2","imgs":[],"t":"문장형","e":"Явган зорчигчийг хамгаалах нь нэн тэргүүний асуудал бөгөөд гэрлэн дохиотой явган хүний гарцад ойртох тохиолдолд явган зорчигчийн аюулгүй байдлын тулд түр зогсож аюулгүй байдлыг шалгаад, явган хүний гарцын дохио өөрчлөгдсөний дараа тээврийн хэрэгслийн явах дохионы дагуу явна."},{"n":329,"b":"Ахмад настны хамгаалалтын бүс тогтоосон үед авч болох арга хэмжээ юм. Буруу нь аль вэ?","c":["Ахмад настны хамгаалалтын бүсэд хурдыг цагт 30 км ба түүнээс бага байхаар хязгаарлаж болно.","Явган хүний гэрлэн дохионы хугацаа ердийн гарцтай ижил байдаг тул анхааруулах тэмдэг байрлуулж болно.","Хурд сааруулагч зэрэг замын хөдөлгөөний аюулгүй байдлын байгууламжийг нэмэлтээр суурилуулж болно.","Хамгаалалтын бүсэд хамаарах байгууламжийн гол үүдэнд хамгийн ойр байрлах үндсэн замын явган хүний гарцад гэрлэн дохиог нэн тэргүүнд суурилуулж, арчилж хамгаална."],"a":"2","imgs":[],"t":"문장형","e":"Ахмад настны хамгаалалтын бүсэд байрлуулах явган зорчигчийн гэрлэн дохионы ногоон дохионы хугацааг хүүхэд, ахмад настан буюу хөгжлийн бэрхшээлтэй иргэдийн дундаж алхах хурдыг үндэслэн тогтоож байна. Хүүхэд, ахмад настан болон хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох, удирдах тухай дүрмийн 6 дугаар зүйл (Замын хөдөлгөөний аюулгүй байдлын байгууламж байрлуулах) ① Аймаг, нийслэлийн Цагдаагийн газрын дарга буюу цагдаагийн хэлтсийн дарга нь 3 дугаар зүйлийн 6 дахь хэсгийн дагуу хамгаалалтын бүсээр тогтоосон байгууламж буюу газрын гол орц гарцаас хамгийн ойр зайд байрлах гол замын явган хүний гарцад гэрлэн дохиог тэргүүн ээлжинд байрлуулж, удирдах ёстой."},{"n":330,"b":"Замын хөдөлгөөний тухай хуулийн дагуу өглөөний 08:00–20:00 цагийн хооронд ахмад настны хамгаалалтын бүсэд замын хөдөлгөөний дүрэм зөрчсөн үед зөрчлийн торгуулийн хэмжээ нэмэгддэггүй үйлдэл аль нь вэ?","c":["Гэрлэн дохио зөрчих","Зогсоохыг хориглосон газар автомашинаа тавих","Явган хүний гарцаар гарч буй явган зорчигчид саад учруулах","Төв шугам давах"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 10 Хүүхдийн хамгаалалтын бүс болон ахмад настан, хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүс дэх зөрчлийн үйлдэл болон зөрчлийн торгуулийн хэмжээ"},{"n":331,"b":"Замын хөдөлгөөний тухай хуулийн дагуу ахмад настны хамгаалалтын бүсийн талаар буруу тайлбар аль нь вэ?","c":["Ахмад настны хамгаалалтын бүсээр зорчихдоо аюултай нөхцөл үүсэж болзошгүйг анхааран жолоодох ёстой.","Ахмад настны хамгаалалтын тэмдэг гэдэг нь ахмад настны хамгаалалтын бүсэд ахмад настныг хамгаалахыг заасан тэмдэг юм.","Ахмад настны хамгаалалтын тэмдгийг хамгаалалтын бүсийн замын голд байрлуулна.","Суудлын автомашины жолооч өглөөний 10:00 цагт ахмад настны хамгаалалтын бүсэд явган хүний гарцаар гарч буй явган зорчигчид саад учруулбал 120,000 воны зөрчлийн торгууль ногдуулна."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын [Хавсралт 10] 2 Ахмад настны хамгаалалтын бүсэд явган хүний гарц дээр явган зорчигчийн хөндлөн гарахад саад учруулсан тохиолдолд суудлын автомашины жолоочид 120,000 вон зөрчлийн торгууль ногдуулна. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] 323 Ахмад настныг хамгаалах тэмдэг нь ахмад настны хамгаалалтын бүс дотор ахмад настныг хамгаалахыг заадаг бөгөөд ахмад настны хамгаалалтын бүсийн замын хоёр талд байрлуулна."},{"n":332,"b":"Замын хөдөлгөөний тухай хуулийн дагуу ахмад настны хамгаалалтын бүсийн талаар тайлбар юм. Буруу нь аль вэ?","c":["Ахмад настны хамгаалалтын бүсийг тогтоох, цуцлах, удирдах эрх нь хотын дарга зэрэг эрх бүхий байгууллагад байдаг.","Цагдаагийн газрын дарга нарийн гудамжийг нэг чигийн хөдөлгөөнтэй зам болгон тогтоож, ажиллуулж болно.","Цагдаагийн газрын дарга ахмад настны хамгаалалтын бүсэд тээврийн хэрэгсэл болон хөсгийн хөдөлгөөнийг хязгаарлаж болно.","Хотын дарга зэрэг нь тээврийн хэрэгслийн хурдыг цагт 30 км ба түүнээс бага байхаар хязгаарлаж болно."],"a":"4","imgs":[],"t":"문장형","e":"Хүүхэд, ахмад настан болон хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсийг тогтоох, удирдах тухай дүрмийн 3 дугаар зүйл болон 9 дүгээр зүйл, хөдөлгөөний хурдыг цагт 30 килом
