 газрын даргад хүсэлт гаргах ёстой бөгөөд хүчинтэй хугацаа нь олгосон өдрөөс хойш 1 жил байна."},{"n":4,"b":"Замын хөдөлгөөний тухай хуулийн дагуу 15 хүний суудалтай тусгай зориулалтын олон суудалт автомашиныг анх у даа жолоодоход шаардлагатай нөхцөл аль нь вэ?","c":["1-р ангиллын ердийн жолоодох эрх, замын хөдөлгөөний аюулгүй байдлын сургалт 3 цаг","1-р ангиллын тусгай жолоодох эрх (том оврын чирэгч автомашин), замын хөдөлгөөний аюулгүй байдлын сургалт 2 цаг","1-р ангиллын тусгай жолоодох эрх (аврах машин), замын хөдөлгөөний аюулгүй байдлын сургалт 2 цаг","2-р ангиллын ердийн жолоодох эрх, замын хөдөлгөөний аюулгүй байдлын сургалт 3 цаг"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 18: 15 хүний суудлын багтаамжтай олон суудалт автомашинд 1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрх эсвэл 1-р ангиллын ердийн жолоодох эрх шаардлагатай бөгөөд тусгай зориулалтын тээврийн хэрэгслийн ажил эрхэлдэг хүн Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 38-2 дугаар зүйл-ын 2 дахь хэсгийн дагуу шинэ (3 цаг) болон тогтмол (2 цаг) замын хөдөлгөөний аюулгүй байдлын сургалтад хамрагдах ёстой."},{"n":5,"b":"Замын хөдөлгөөний тухай хуулийн дагуу дадлагын жолоодох эрхийн үнэмлэхийн хүчинтэй хугацаа хэд вэ?","c":["Олгосон өдрөөс 6 сар","Олгосон өдрөөс 1 жил","Олгосон өдрөөс 2 жил","Олгосон өдрөөс 3 жил"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 81 дүгээр зүйл (Дадлагын жолоодох эрхийн хүчин төгөлдөр байдал): Дадлагын жолоодох эрх нь уг эрхийг авсан өдрөөс хойш 1 жилийн хугацаанд хүчинтэй байна. Гэхдээ дадлагын жолоодох эрх авсан өдрөөс хойш 1 жил болоогүй байсан ч дадлагын жолоодох эрх авсан хүн 1-р ангиллын ердийн жолоодох эрх эсвэл 2-р ангиллын ердийн жолоодох эрх авсан тохиолдолд дадлагын жолоодох эрх хүчингүй болно."},{"n":6,"b":"Замын хөдөлгөөний тухай хуульд заасан жолоодох эрхийн үнэмлэхэд нөхцөл тавих шалгуурын дагуу жолооны үнэмлэхэд тэмдэглэх аргуудаас аль нь буруу вэ?","c":["A: Механик хурдны хайрцаг","E: Сонсголын бэрхшээлтэй жолоочийн тэмдэг, товгор толь","G: Тусгайлан үйлдвэрлэж баталгаажуулсан тээврийн хэрэгсэл","H: Баруун гар тийш чиг заах дохио"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 54 дүгээр зүйл (Жолоодох эрхийн нөхцөл гэх мэт)-ийн 3 дахь хэсгийн дагуу жолоодох эрхийн нөхцөл тогтоох шалгуурыг Хавсралт 20-д заасан бөгөөд A нь автомат хурдны хайрцаг, B нь хиймэл гар, C нь хиймэл хөл, D нь сонсголын аппарат, E нь сонсголын бэрхшээлтэй хүний тэмдэг болон гүдгэр толь, F нь гар ажиллагаатай тоормос ба хурдасгуур, G нь тусгайлан үйлдвэрлэсэн болон батлагдсан автомашин, H нь баруун талын чиг заах дохио, I нь зүүн талын хурдасгуурын дөрөө юм. Бие махбодын бэрхшээлтэй хүн жолоодох эрхийн шалгалт өгөхдөө нөхцөлд тохирсон автомашинаар шалгалт өгч тэнцэх ёстой бөгөөд тэнцсэний дараа тухайн нөхцөлд тохирсон жолоодох эрхийн үнэмлэх олгоно."},{"n":7,"b":"11 хүний суудалтай олон суудалт автомашинаар нийт жин нь 780 килограмм чиргүүлийг чирэх гэж байна. Жолооч ямар ангиллын жолоодох эрхтэй байх ёстой вэ?","c":["1-р ангиллын ердийн жолоодох эрх болон бага оврын чирэгч автомашины жолоодох эрх","2-р ангиллын ердийн жолоодох эрх болон 1-р ангиллын бага оврын чирэгч автомашины жолоодох эрх","1-р ангиллын ердийн жолоодох эрх болон аврах машин жолоодох эрх","2-р ангиллын ердийн жолоодох эрх болон 1-р ангиллын аврах машин жолоодох эрх"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 18-ын тайлбар 3: Нийт жин нь 750 килограммаас хэтэрсэн, 3 тонноос ихгүй чиргүүлийг чирэхийн тулд чирэгч автомашиныг жолоодох эрхээс гадна 1-р ангиллын жижиг оврын чирэгч автомашин жолоодох эрх эсвэл том оврын чирэгч автомашин жолоодох эрхтэй байх ёстой."},{"n":8,"b":"Жолоодох эрхийн ангиллаар жолоодож болох тээврийн хэрэгслийн талаарх зөв тайлбар 2-ыг сонгоно уу.","c":["1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрхийн үнэмлэхээр асфальт цацагч машин жолоодож болно.","1-р ангиллын ердийн жолоодох эрхээр өөрөө буулгагч ачааны машин жолоодож болно.","2-р ангиллын ердийн жолоодох эрхээр 250 см³ хоёр дугуйт тээврийн хэрэгсэл жолоодож болно.","2-р ангиллын жижиг оврын машин жолоодох эрхээр моторт унадаг дугуй жолоодож болно."],"a":"1, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 18 (Жолоодож болох тээврийн хэрэгслийн төрөл)-ийн дагуу өөрөө буулгагч ачааны автомашинд 1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрх, хөдөлгүүрийн багтаамж нь 125 см³-ээс их хоёр дугуйт тээврийн хэрэгсэлд 2-р ангиллын жижиг оврын машин жолоодох эрх шаардлагатай."},{"n":9,"b":"12 хүний суудалтай олон суудалт автомашиныг зам дээр жолоодох гэж байна. Жолооч ямар ангиллын жолоодох эрхтэй байх ёстой вэ?","c":["1-р ангиллын том оврын чирэгч автомашины жолоодох эрх","1-р ангиллын аврах машин жолоодох эрх","1-р ангиллын ердийн жолоодох эрх","2-р ангиллын ердийн жолоодох эрх"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 18: 1-р ангиллын ердийн жолоодох эрхээр 15 хүртэл хүний суудлын багтаамжтай олон суудалт автомашин жолоодож болно; ①, ②, ④-ээр 10 хүртэл хүний суудлын багтаамжтай олон суудалт автомашин жолоодож болно."},{"n":10,"b":"Дараах хүмүүсийн хэн нь 2-р ангиллын ердийн жолоодох эрх авч болох вэ?","c":["Нэг нүдээрээ харахгүй боловч нөгөө нүдний хараа нь 0.5 байгаа хүн","Улаан, ногоон, шар өнгийг ялгаж чаддаггүй хүн","17 настай хүн","Сонсголгүй хүн"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 45 дугаар зүйлийн 1 дэх хэсгийн 1 дэх заалтын «б» дэд заалтын дагуу 2-р ангиллын жолоодох эрх авахад 18 ба түүнээс дээш настай, хоёр нүдээ зэрэг нээж хэмжсэн харааны чадал нь 0.5 ба түүнээс дээш (гэхдээ нэг нүд нь хардаггүй хүний нөгөө нүдний харааны чадал нь 0.6 ба түүнээс дээш байх ёстой) байх шаардлагатай. Мөн улаан, ногоон болон шар өнгийг ялгах чадвартай байх ёстой боловч сонсголгүй байсан ч эрх авч болно."},{"n":11,"b":"Дараах тайлбаруудаас Замын хөдөлгөөний тухай хуульд заасан моторт унадаг дугуйн тодорхойлолт (шалгуур)-ын зөв нь аль вэ?","c":["Хөдөлгүүрийн багтаамж 50 см³ ба түүнээс бага – хамгийн их нэрлэсэн чадал 0.59 кВт ба түүнээс бага","Хөдөлгүүрийн багтаамж 50 см³-аас бага – хамгийн их нэрлэсэн чадал 0.59 кВт-аас бага","Хөдөлгүүрийн багтаамж 125 см³ ба түүнээс бага – хамгийн их нэрлэсэн чадал 11 кВт ба түүнээс бага","Хөдөлгүүрийн багтаамж 125 см³-аас бага – хамгийн их нэрлэсэн чадал 11 кВт-аас бага"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 19 дэх заалтын «б» дэд заалтын тодорхойлолтыг үзнэ үү. «Моторт унадаг дугуй» гэж дараах дэд заалтуудын аль нэгэнд хамаарах тээврийн хэрэгслийг хэлнэ. а. «Автотээврийн хэрэгслийн удирдлагын тухай хууль»-ийн 3 дугаар зүйлд заасан хоёр дугуйт тээврийн хэрэгслээс хөдөлгүүрийн багтаамж нь 125 см³-ээс ихгүй (цахилгаанаар ажилладаг бол дээд нэрлэсэн чадал нь 11 киловаттаас ихгүй) хоёр дугуйт тээврийн хэрэгсэл б. Бусад хөдөлгүүрийн багтаамж нь 125 см³-ээс ихгүй (цахилгаанаар ажилладаг бол дээд нэрлэсэн чадал нь 11 киловаттаас ихгүй) хөдөлгүүр суурилуулсан тээврийн хэрэгсэл («Унадаг дугуйн хэрэглээг дэмжих тухай хууль»-ийн 2 дугаар зүйлийн 1 дэх заалтын 2-т заасан цахилгаан унадаг дугуй болон 21 дэх заалтын 3-т заасан гадна орчинд хөдөлдөг роботыг хасна)"},{"n":12,"b":"Дараах хүмүүсийн хэн нь Замын хөдөлгөөний тухай хуулийн дагуу 1-р ангиллын том оврын тээврийн хэрэгсэл жоло одох эрхийн үнэмлэхийн шалгалтад орох шаардлагыг хангах вэ? (Хоёр дугуйт тээврийн хэрэгсэл жолоодсон туршлагыг тооцохгүй.)","c":["Автомашин жолоодсон туршлага 6 сар ба түүнээс дээш, 18 настай хүн","Автомашин жолоодсон туршлага 1 жил ба түүнээс дээш 18 настай хүн","Автомашин жолоодсон туршлага 6 сар ба түүнээс дээш, 19 настай хүн","Автомашин жолоодсон туршлага 1 жил ба түүнээс дээш, 19 настай хүн"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 82 дугаар зүйлийн 1 дэх хэсгийн 6 дахь заалтын дагуу 19 нас хүрээгүй эсвэл автомашин (хоёр дугуйт тээврийн хэрэгслийг хасна) жолоодсон туршлага нь 1 жилээс бага хүн 1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрх авч болохгүй."},{"n":13,"b":"Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу гадаадад зорчих үед жолоодох эрхийн үнэмлэхийн чадварын шалгалтыг хойшлуулах тухай тайлбаруудаас аль нь буруу вэ?","c":["Улсаас гарахаас өмнө чадварын шалгалтыг хойшлуулах хүсэлт гаргах ёстой.","Улсаас гарсны дараа өөрийн төлөөлөгчөөрөө чадварын шалгалтыг хойшлуулах хүсэлтийг гаргаж болохгүй.","Чадварын шалгалтыг хойшлуулах хүсэлт гаргахдаа и-тасалбар зэрэг улсаас гарсныг нотлох баримтыг бүрдүүлэх ёстой.","Чадварын шалгалтыг хойшлуулах хүсэлт зөвшөөрөгдсөн бол эх орондоо ирснээс хойш 3 сарын дотор чадварын шалгалтад хамрагдах ёстой."],"a":"2","imgs":[],"t":"문장형","e":"①, ③ Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 55 дугаар зүйл (Жолоодох эрхийн үнэмлэхийг шинэчлэн олгох болон тогтмол чадварын шалгалтыг хойшлуулах гэх мэт)-ийн 1 дэх хэсэг ④ Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 55 дугаар зүйл (Жолоодох эрхийн үнэмлэхийг шинэчлэн олгох болон тогтмол чадварын шалгалтыг хойшлуулах гэх мэт)-ийн 3 дахь хэсэг ② Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 83 дугаар зүйл (Жолоодох эрхийн үнэмлэхийг шинэчлэн олгох болон тогтмол чадварын шалгалтыг хойшлуулах)-ийн 3 дахь хэсэг, Маягт 59"},{"n":14,"b":"Зам дээр жолоодох шалгалтад тэнцээгүй хүн тэнцээгүй өдрөөс хойш ( )-ийн дараа дахин зам дээр жолоодох шалгалтад орж болно. ( )-д тохирох нь аль вэ?","c":["1 өдөр","3 өдөр","5 өдөр","7 өдөр"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 49 дүгээр зүйлийн 4 дэх хэсгийн дагуу замын жолоодлогын шалгалтад тэнцээгүй хүн тэнцээгүй өдрөөс хойш 3 хоног өнгөрсний дараа замын жолоодлогын шалгалтыг дахин өгч болно. 15. «Сайн жолоодлогын оноо (майлж)» тогтолцооны талаарх тайлбараас зохисгүй 2 нь аль вэ? ① Замын хөдөлгөөний дүрмийг сайн сахиж хэрэгжүүлдэг жолоочид бодит урамшуулал олгодог тогтолцоо юм. ② Жолооч эрх түдгэлзүүлэх арга хэмжээнд өртөх тохиолдолд хуримтлагдсан онооноос хасаж болно. ③ Зөрчлийн торгууль эсвэл захиргааны торгуулиа төлөөгүй хүн ч майлжийн тогтолцооны зөрчилгүй, осолгүй байх амлалтад оролцож болно. ④ Амлалт биелүүлэх хугацаанд зам тээврийн осол гаргасан эсвэл замын хөдөлгөөний дүрэм зөрчсөн бол дахин амлалт өгч болохгүй."},{"n":15,"b":"\"Сайн жолоочийн оноо\" тогтолцооны талаар тохиромжгүй 2 тайлбарыг сонгоно уу.","c":["Замын хөдөлгөөний дүрмийг сайн мөрдөж хэрэгжүүлсэн жолоочид бодит урамшуулал олгодог тогтолцоо юм.","Жолооч эрх хасуулах шийтгэл хүлээвэл хуримтлагдсан онооноос хасуулж болно.","Зөрчлийн торгууль, торгуулиа төлөөгүй хүн ч онооны тогтолцооны зөрчилгүй, осолгүй байх амлалтад оролцож болно.","Амлалтаа хэрэгжүүлэх хугацаанд зам тээврийн осол гаргах буюу дүрэм зөрчвөл дахин амлалт өгөх боломжгүй."],"a":"3, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 28]: Жолооч эрх түдгэлзүүлэх арга хэмжээнд өртөх тохиолдолд үүнийг хуримтлагдсан онооноос хасаж болно. Жолоодох эрхтэй хэн ч майлжийн тогтолцоонд оролцож болох боловч зөрчлийн торгууль эсвэл захиргааны торгуулиа төлөөгүй хүн амлалт өгч болохгүй бөгөөд амлалт биелүүлэх хугацаанд зам тээврийн осол гарсан эсвэл замын хөдөлгөөний дүрэм зөрчсөн ч дахин амлалт өгч болно (Жолоодох эрхийн урамшууллын оноо олгох шалгуурын тухай мэдэгдэл)."},{"n":16,"b":"Моторт унадаг дугуйн ангилалд багтах хувийн хөдөлгөөнт хэрэгслийн тодорхойлолтын талаар аль нь буруу вэ?","c":["Өгсүүрийн өнцөг 25 градусаас бага байх ёстой.","Тээврийн хэрэгслийн жин 30 килограммаас бага байх ёстой.","Унадаг дугуй зэрэг гэдэгт унадаг дугуй болон хувийн хөдөлгөөнт хэрэгсэл хамаарна.","Цагт 25 километр ба түүнээс дээш хурдтай явах үед цахилгаан хөдөлгүүр ажиллах ёсгүй."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 19 дэх заалтын 2, Унадаг дугуйн хэрэглээг дэмжих тухай хуулийн 3 дугаар зүйлийн 1 дэх заалт: «Хувийн хөдөлгөөнт хэрэгсэл» гэж 19 дэх заалтын «б» дэд заалтад заасан моторт унадаг дугуйнаас цагт 25 километрээс дээш хурдтай явахад цахилгаан мотор нь ажилладаггүй, их биеийн жин нь 30 килограммаас бага, Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон хэрэгслийг хэлэх бөгөөд өгсөх налуугийн өнцгийг тогтоогоогүй."},{"n":17,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хувийн хөдөлгөөнт хэрэгслийн шалгуурын тухай тайлбар юм. Зөв тайлбар аль нь вэ?","c":["Хөдөлгүүртэй тээврийн хэрэгсэл нь цагт 20 километр ба түүнээс дээш хурдтай явах үед хөдөлгүүр ажиллах ёсгүй.","Зөвхөн цахилгаан хөдөлгүүрийн хүчээр хөдлөх боломжгүй (PAS: Pedal Assist System) цахилгаан унадаг дугуйг багтаана.","Хамгийн их нэрлэсэн чадал нь 11 кВт ба түүнээс бага, тээврийн хэрэгслийн жин нь 35 килограммаас бага хөдөлгүүртэй тээврийн хэрэгслийг хэлнэ.","Тээврийн хэрэгслийн жин 30 килограммаас бага байх ёстой."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 19 дэх заалтын «б» дэд заалт: Бусад хөдөлгүүрийн багтаамж нь 125 см³-ээс ихгүй (цахилгаанаар ажилладаг бол дээд нэрлэсэн чадал нь 11 киловаттаас ихгүй) хөдөлгүүр суурилуулсан тээврийн хэрэгсэл (Унадаг дугуйн хэрэглээг дэмжих тухай хуулийн 2 дугаар зүйлийн 1 дэх заалтын 2-т заасан цахилгаан унадаг дугуй болон 21 дэх заалтын 3-т заасан гадна орчинд хөдөлдөг роботыг хасна). 19 дэх заалтын 2: «Хувийн хөдөлгөөнт хэрэгсэл» гэж 19 дэх заалтын «б» дэд заалтад заасан моторт унадаг дугуйнаас цагт 25 километрээс дээш хурдтай явахад цахилгаан мотор нь ажилладаггүй, их биеийн жин нь 30 килограммаас бага, Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон хэрэгслийг хэлнэ. * PAS (Pedal Assist System) төрлийн цахилгаан унадаг дугуй: дөрөө болон цахилгаан моторын хүчээр зэрэг хөдөлдөг бөгөөд зөвхөн моторын хүчээр хөдөлж чадахгүй унадаг дугуй * Хурдасгуурын бариултай төрлийн цахилгаан унадаг дугуй: зөвхөн моторын хүчээр хөдөлж чадах унадаг дугуй бөгөөд хууль тогтоомжийн дагуу «хувийн хөдөлгөөнт хэрэгсэл»-д ангилна"},{"n":18,"b":"Дараах нөхцөлүүдээс жолоодох эрх авах эрхгүй байх хугацаа 2 жилд хамаарах 2 шалтгааныг сонгоно уу.","c":["Жолоодох эрхгүйгээр 3 удаа жолоо барьсан.","Өөр хүний өмнөөс жолоодох эрхийн шалгалтад оролцсон.","Хяналт шалгалтын цагдаагийн алба хаагчид халдсан тул жолоодох эрх нь хүчингүй болсон.","Согтуугаар жолоо барьж байхдаа 3 ба түүнээс дээш удаа зам тээврийн осол гаргасан."],"a":"1, 2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 82 дугаар зүйл (Жолоодох эрх авахад харшлах шалтгаан)-ийн заалтын дагуу хяналт шалгалт хийж буй цагдаагийн алба хаагчид хүч хэрэглэсний улмаас эрүүгийн хэрэг үүсгэгдэж эрх хүчингүй болсон тохиолдолд эрх авах боломжгүй хугацаа 1 жил, согтуугаар жолоо барьж 3 ба түүнээс дээш удаа зам тээврийн осол гаргасан тохиолдолд жолоодох эрх хүчингүй болсон өдрөөс хойш 3 жил байна."},{"n":19,"b":"Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу англи хэл дээрх жолоодох эрхийн үнэмлэхийн талаар өгүүлсэн тайлбаруудаас аль нь буруу вэ? (Зөвхөн Женевийн конвенц эсвэл Венийн конвенцид нэгдсэн улсуудад хамаарна.)","c":["Англи хэл дээрх жолоодох эрхийн үнэмлэхийг хүлээн зөвшөөрдөг улсад нэмэлт орчуулгын нотариатын баталгаагүйгээр жолоо барьж болно.","Англи хэл дээрх жолоодох эрхийн үнэмлэхийг хүлээн зөвшөөрдөг улсад оршин суух хугацаанаас үл хамааран ашиглаж болно.","Англи хэл дээрх жолоодох эрхийн үнэмлэхийг хүлээн зөвшөөрдөггүй улсад БНСУ-ын жолоодох эрхийн үнэмлэх, олон улсын жолоодох эрхийн үнэмлэх, паспорт авч явах ёстой.","Жолоодох эрхийн үнэмлэхийн ар талд жолоодох эрхийн үнэмлэхийн мэдээллийг англи хэлээр бичсэн байдаг."],"a":"2","imgs":[],"t":"문장형","e":"Англи хэл дээрх жолоодох эрхийн үнэмлэхийн заавар (Солонгосын Замын хөдөлгөөний газар (KoROAD)): Жолоо барьж болох хугацаа улс бүрт өөр бөгөөд ихэнх улсад 3 сар орчмын богино хугацаанд л зөвшөөрдөг тул удаан хугацаагаар оршин суух тохиолдолд тухайн улсын жолоодох эрхийг авах шаардлагатай."},{"n":20,"b":"Замын хөдөлгөөний тухай хуулийн дагуу моторт унадаг дугуй нь цахилгаан хөдөлгүүртэй тохиолдолд хамгийн их нэрлэсэн чадал нь ( )-аас ихгүй хоёр дугуйт тээврийн хэрэгсэл байна. ( )-д тохирох нь аль вэ?","c":["11 кВт","9 кВт","5 кВт","0.59 кВт"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Нэр томьёо): Моторт унадаг дугуй гэж Автотээврийн хэрэгслийн удирдлагын тухай хуульд заасан хоёр дугуйт тээврийн хэрэгслээс хөдөлгүүрийн багтаамж нь 125 см³-ээс ихгүй (цахилгаанаар ажилладаг бол дээд нэрлэсэн чадал нь 11 киловаттаас ихгүй) хоёр дугуйт тээврийн хэрэгсэл болон бусад хөдөлгүүрийн багтаамж нь 125 см³-ээс ихгүй (цахилгаанаар ажилладаг бол дээд нэрлэсэн чадал нь 11 киловаттаас ихгүй) хөдөлгүүр суурилуулсан тээврийн хэрэгслийг хэлнэ."},{"n":21,"b":"Дараах зүйлсээс Замын хөдөлгөөний тухай хуульд заасан \"замын хашлагын шугам\"-ын тодорхойлолт аль нь вэ?","c":["Тээврийн хэрэгсэл болон хөсгийн зорчих чиглэлийг тодорхой ялгах зориулалттай шугам","Автомашиныг замын тогтоосон хэсгээр нэг эгнээгээр зорчуулах зориулалттай шугам","Зорчих хэсэг болон явган хүний замыг чулуу зэрэг материалаар тусгаарласан шугам","Эгнээ болон эгнээг хооронд нь тусгаарлах зориулалттай шугам"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Тодорхойлолт) 4. Хашлагын шугам (зорчих хэсэг ба явган хүний замыг тусгаарлах чулуу зэргээр үргэлжилсэн шугамыг хэлнэ.)"},{"n":22,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хувийн хөдөлгөөнт хэрэгслийн талаар зөв тайлбар аль нь вэ?","c":["Зөвшөөрөгдсөн суудлын тооноос илүү хүнтэй жолоодож болно.","Жолоодох эрхээ буцааж өгсөн 65 ба түүнээс дээш настай хүн жолоодож болно.","13 ба түүнээс дээш настай хүн жолоодох эрх авахгүйгээр жолоодож болно.","Явган хүний гарцаар гарахдаа хувийн хөдөлгөөнт хэрэгслээс бууж, түрэн эсвэл өргөн явганаар зорчих ёстой."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 13-2 дугаар зүйл (Унадаг дугуй зэргийн зорчих аргын онцгой журам)-ын 6 дахь хэсэг: Унадаг дугуй зэргийн жолооч явган хүний гарцыг ашиглан замыг хөндлөн гарахдаа унадаг дугуй зэргээсээ бууж, түүнийг түлхэж эсвэл өргөж явган явах ёстой."},{"n":23,"b":"Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу жолоодох эрхийн үнэмлэхийг сунгах болон жолоодох чадварын шалгалтыг 3 жил тутамд хийлгэх насны шалгуур аль нь вэ?","c":["65 ба түүнээс дээш нас","70 ба түүнээс дээш нас","75 ба түүнээс дээш нас","80 ба түүнээс дээш нас"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 87 дугаар зүйлийн 1 дэх хэсэг"},{"n":24,"b":"Дараах нь замын хөдөлгөөний тухай хууль тогтоомжийн дагуу жолоодох эрхийн үнэмлэх авах хүсэлт гаргаж буй хүн мө н эсэхийг баталгаажуулах журмын тухай тайлбар юм. Буруу нь аль вэ?","c":["Иргэний үнэмлэхээ гээгдүүлсэн бол иргэний үнэмлэх шинээр авах хүсэлтийн тодорхойлолтоор баталгаажуулж болно.","Иргэний үнэмлэх эсвэл хурууны хээний мэдээллээр тухайн хүнийг баталгаажуулах боломжгүй бол шалгалтад оролцох боломжгүй.","Өргөдөл гаргагчийн зөвшөөрөлгүйгээр цахим аргаар хурууны хээний мэдээллийг тулган баталгаажуулж болно.","Тухайн хүн мөн эсэхийг баталгаажуулахаас татгалзсан тохиолдолд жолоодох эрхийн үнэмлэх олгохоос татгалзаж болно."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 87-2 дугаар зүйл, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 57 дугаар зүйл (Жолоодох эрхийн шалгалт өгөх): Биеийн байцаалтаа үзүүлж чадахгүй хүний хувьд хүсэлт гаргагч хүсвэл цахим аргаар хурууны хээний мэдээллийг тулгаж биеийн байдлыг нь тогтоож болно."},{"n":25,"b":"Дараах байгууллагуудаас устөрөгчөөр ажилладаг том оврын олон суудалт автомашин (35 ба түүнээс дээш суудалтай)-ыг шинээр жолоодох жолоочид зориулсан тусгай сургалтыг явуулдаг байгууллага аль нь вэ?","c":["Солонгосын Хийн аюулгүй байдлын корпорац","Солонгосын Хөдөлмөрийн аюулгүй байдлын газар","Солонгосын Замын хөдөлгөөний газар","Солонгосын Авто замын корпорац"],"a":"1","imgs":[],"t":"문장형","e":"Өндөр даралтат хийн аюулгүй байдлын удирдлагын тухай хуулийг хэрэгжүүлэх дүрмийн 51 дүгээр зүйлийн 1 дэх хэсэг, Хавсралт 31"},{"n":26,"b":"Замын хөдөлгөөний тухай хуулийн дагуу замын хөдөлгөөний дүрэм зөрчсөний улмаас жолоодох эрхийн үйлчлэл түр түдгэлзэх магадлалтай хүн тусгай замын хөдөлгөөний аюулгүй байдлын зөвлөмжит сургалтад хамрагдахыг хүсвэл хэнд хүсэлт гаргах вэ? (Согтуугаар жолоо барьсан тохиолдлыг оруулахгүй.)","c":["Солонгосын Замын хөдөлгөөний газрын ерөнхийлөгч","Оршин суугаа газрын нутгийн өөрөө удирдах байгууллагын дарга","Жолоодох эрхийн шалгалтын төвийн дарга","Аймаг, нийслэлийн Цагдаагийн газрын дарга"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 73 дугаар зүйл (Замын хөдөлгөөний аюулгүй байдлын сургалт)-ийн 3 дахь хэсэг: Дараах заалтуудын аль нэгэнд хамаарах хүн аймаг, нийслэлийн Цагдаагийн газрын даргад хүсэлт гаргасан тохиолдолд Ерөнхийлөгчийн зарлигаар тогтоосон журмын дагуу замын хөдөлгөөний аюулгүй байдлын тусгай зөвлөмжит сургалтад хамрагдаж болно. Энэ тохиолдолд зөвлөмжит сургалтад хамрагдахаас өмнөх 1 жилийн дотор тухайн сургалтад хамрагдаагүй хүнээр хязгаарлана."},{"n":27,"b":"Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу нэг нүд нь харахгүй хүн 1-р ангиллын ердийн жолоодох эрх авах гэж байгаа бол нөгөө нүдний хараа ( ) ба түүнээс дээш, хэвтээ харах хүрээ ( ) хэм ба түүнээс дээш, босоо харах хүрээ 20 хэ м ба түүнээс дээш, төвийн 20 хэмийн хүрээнд сохор цэг болон хагас хараагүй байх ёсгүй. ( )-д тохирох нь аль вэ?","c":["0.5, 50","0.6, 80","0.7, 100","0.8, 120"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 45 дугаар зүйл (Автомашин зэргийг жолоодоход шаардагдах чадварын шалгуур): Гэхдээ нэг нүд нь хардаггүй хүн 1-р ангиллын ердийн жолоодох эрх авахыг хүсвэл автомашин зэргийг жолоодоход шаардагдах чадварын шалгуурын дагуу нөгөө нүдний харааны чадал нь 0.8 ба түүнээс дээш, хэвтээ харах талбай нь 120 градус ба түүнээс дээш, босоо харах талбай нь 20 градус ба түүнээс дээш, төв харааны 20 градусын дотор харааны сохор цэг болон хагас харалган байдалгүй байх ёстой."},{"n":28,"b":"1-р ангиллын жолоодох эрхийн үнэмлэх авсан, 65 ба түүнээс дээш 75-аас доош насны хүн (нэг нүд нь харахгүй хүнийг оруулахгүй) хэдэн жил тутамд жолоодох чадварын тогтмол шалгалт өгөх ёстой вэ?","c":["3 жил тутам","5 жил тутам","10 жил тутам","15 жил тутам"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 87 дугаар зүйлийн 1 дэх хэсгийн 1 дэх заалт: 1-р ангиллын жолоодох эрх авсан 65 ба түүнээс дээш, 75-аас доош настай хүн 5 жил тутамд тогтмол чадварын шалгалт өгөх ёстой. Гэхдээ зөвхөн нэг нүд нь хардаггүй хүнээс 1-р ангиллын эрхээс ердийн жолоодох эрх авсан хүний хувьд 3 жил байна."},{"n":29,"b":"Жолоодох эрхийн үнэмлэхээ аймаг, нийслэлийн Цагдаагийн газрын даргад буцаан өгөх шаардлагатай 2 тохиолдол аль нь вэ?","c":["Жолоодох эрх хүчингүй болгох шийдвэр гарсан үед","Жолоодох эрхийн үйлчлэл түр түдгэлзүүлэх шийдвэр гарсан үед","Жолоодох эрхийн ээлжит бус чадварын шалгалтад орох мэдэгдэл авсан үед","Жолоодох эрхийн чадварын тогтмол шалгалтын хугацаа 6 сараар хэтэрсэн үед"],"a":"1, 2","imgs":[],"t":"문장형","e":"Жолоодох эрхийг хүчингүй болгох арга хэмжээ авагдсан үед, жолоодох эрхийг түдгэлзүүлэх арга хэмжээ авагдсан үед, жолоодох эрхийн үнэмлэхээ үрэгдүүлж дахин авсны дараа үрэгдүүлсэн үнэмлэхээ олсон үед, дадлагын жолоодох эрхийн үнэмлэх авсан хүн 1-р ангиллын ердийн жолоодох эрх эсвэл 2-р ангиллын ердийн жолоодох эрх авсан үед 7 хоногийн дотор оршин суугаа хаягийг нь харьяалах аймаг, нийслэлийн Цагдаагийн газрын даргад жолоодох эрхийн үнэмлэхээ буцаан өгөх ёстой."},{"n":30,"b":"Замын хөдөлгөөний тухай хуулийн дагуу жолоодох эрхийн үнэмлэхийг сунгах хугацааг зөв тайлбарласан нь аль вэ? (Зөвхөн 65-аас доош насны жолоочид хамаарна.)","c":["Жолоодох эрхийн шалгалтад тэнцсэн өдрөөс тооцон 10 дахь жилийн төрсөн өдрийн өмнөх болон дараах тус бүр 2 сарын дотор","Жолоодох эрхийн шалгалтад тэнцсэн өдрөөс тооцон 10 дахь жилийн төрсөн өдрийн өмнөх болон дараах тус бүр 4 сарын дотор","Жолоодох эрхийн шалгалтад тэнцсэн өдрөөс тооцон 10 дахь жилийн төрсөн өдрийн өмнөх болон дараах тус бүр 6 сарын дотор","Жолоодох эрхийн шалгалтад тэнцсэн өдрөөс тооцон 10 дахь жилийн төрсөн өдрийн өмнөх болон дараах тус бүр 8 сарын дотор"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хууль [2026. 1. 1-нээс хэрэгжих] 87 дугаар зүйл (Жолоодох эрхийн үнэмлэхийг шинэчлэх болон тогтмол чадварын шалгалт) ① Жолоодох эрх авсан хүн дараах заалтуудад заасан хугацааны дотор Ерөнхийлөгчийн зарлигаар тогтоосон журмын дагуу аймаг, нийслэлийн Цагдаагийн газрын даргаас жолоодох эрхийн үнэмлэхээ шинэчлүүлэн авах ёстой. 1. Жолоодох эрхийн үнэмлэхийг анх удаа шинэчлэх хугацаа нь 83 дугаар зүйлийн 1 дэх хэсэг эсвэл 2 дахь хэсэгт заасан жолоодох эрхийн шалгалтад тэнцсэн өдрөөс тоолоход 10 жил (жолоодох эрхийн шалгалтад тэнцсэн өдөр 65 ба түүнээс дээш, 75-аас доош настай хүн 5 жил, 75 ба түүнээс дээш настай хүн 3 жил, зөвхөн нэг нүд нь хардаггүй хүнээс 1-р ангиллын жолоодох эрхээс ердийн жолоодох эрх авсан хүн 3 жил) болох өдрийн хамаарах жилийн төрсөн өдрийн өмнөх болон дараах тус бүр 6 сарын дотор 2. 1 дэх заалтаас бусад жолоодох эрхийн үнэмлэхийг шинэчлэх хугацаа нь өмнөх жолоодох эрхийн үнэмлэх шинэчилсэн өдрөөс тоолоход 10 жил тутам (өмнөх жолоодох эрхийн үнэмлэх шинэчилсэн өдөр 65 ба түүнээс дээш, 75-аас доош настай хүн 5 жил, 75 ба түүнээс дээш настай хүн 3 жил, зөвхөн нэг нүд нь хардаггүй хүнээс 1-р ангиллын жолоодох эрхээс ердийн жолоодох эрх авсан хүн 3 жил) болох өдрийн хамаарах жилийн төрсөн өдрийн өмнөх болон дараах тус бүр 6 сарын дотор"},{"n":31,"b":"Дараах хүмүүсийн хэн нь Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу англи хэл дээрх жолоодох эрхийн үнэмлэх авах боломжгүй вэ?","c":["Жолоодох эрхийн шалгалтад тэнцээд жолоодох эрхийн үнэмлэх авах хүсэлт гаргаж буй тохиолдолд","Жолоодох эрхийн чадварын шалгалтад тэнцээд жолоодох эрхийн үнэмлэх авах хүсэлт гаргаж буй тохиолдолд","Гадаад улсын жолоодох эрхийн үнэмлэхийг Солонгосын жолоодох эрхийн үнэмлэхээр сольж авах хүсэлт гаргаж буй тохиолдолд","Дадлагын жолоодох эрхийн үнэмлэхээр хүсэлт гаргаж буй тохиолдолд"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 78 дугаар зүйл (Англи хэл дээрх жолоодох эрхийн үнэмлэх хүсэх гэх мэт): Дадлагын жолоодох эрхийн үнэмлэх эзэмшигч нь англи хэл дээрх жолоодох эрхийн үнэмлэх олгох хамрах хүрээнд ордоггүй."},{"n":32,"b":"Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу 2-р ангиллын ердийн жолоодох эрхээр жолоодож болохгүй тээврийн хэрэгсэл аль нь вэ?","c":["Аврах автомашин","10-аас цөөн суудалтай олон суудалт автомашин","Суудлын автомашин","2.5 тонн даацтай ачааны автомашин"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 18 (Жолоодож болох тээврийн хэрэгслийн төрөл)"},{"n":33,"b":"Жолоодох эрхийн шалгалтын үеэр хууль бус үйлдэл гаргасны улмаас шалгалтыг хүчингүйд тооцсон хүн шийдвэр гарсан өдрөөс хойш ( )-ийн хугацаанд тухайн шалгалтад дахин оролцох боломжгүй. ( )-д тохирох нь аль вэ?","c":["2 жил","3 жил","4 жил","5 жил"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 84-2 дугаар зүйл (Хууран мэхлэх үйлдэл гаргасан хүнд авах арга хэмжээ): Хууран мэхлэх үйлдлийн улмаас шалгалт нь хүчингүй болсон хүн уг арга хэмжээ авагдсан өдрөөс хойш 2 жилийн хугацаанд тухайн шалгалтыг өгч болохгүй."},{"n":34,"b":"Дараах зүйлсээс Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу жолоодох эрхийн үнэмлэхийг сунгах эсвэл жолоодох чадварын тогтмол шалгалтыг хойшлуулах үндэслэлд хамаарахгүй нь аль вэ?","c":["Гадаадад оршин сууж байгаа тохиолдолд","Өвчний улмаас хөдөлгөөн хийх боломжгүй болсон тохиолдолд","Цэргийн албаны тухай хуульд заасны дагуу хуурай замын цэрэг, тэнгисийн цэрэг, агаарын цэргийн ахлагч болон түүнээс дээш албан тушаалд алба хааж байгаа тохиолдолд","Гамшиг, аюулт үзэгдэлд өртсөн тохиолдолд"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 55 дугаар зүйлийн 1 дэх хэсэг"},{"n":35,"b":"Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу жолоодох эрхийн үнэмлэх сунгах хугацааг хойшлуулах зөвшөөрөл авсан хүн тухайн шалтгаан арилснаас хойш ( )-ийн дотор жолоодох эрхийн үнэмлэхээ сунгуулан авах ёстой. ( )-д тохирох нь аль вэ?","c":["1 сар","3 сар","6 сар","12 сар"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 55 дугаар зүйлийн 3 дахь хэсэг: Жолоодох эрхийн үнэмлэх шинэчлэх хугацааг хойшлуулсан хүн уг шалтгаан арилсан өдрөөс хойш 3 сарын дотор жолоодох эрхийн үнэмлэхээ шинэчлүүлэн авах ёстой."},{"n":36,"b":"Дараах устөрөгчөөр ажилладаг автомашины жолооч нараас өндөр даралтын хийн аюулгүй байдлын тухай хууль тогтоомжийн дагуу тусгай сургалтад хамрагдах ёстой нь аль вэ?","c":["Устөрөгчөөр ажилладаг суудлын автомашины жолооч","Устөрөгчөөр ажилладаг том оврын олон суудалт автомашин (36 ба түүнээс дээш суудалтай)-ы жолооч","Устөрөгчөөр ажилладаг ачааны автомашины жолооч","Устөрөгчөөр ажилладаг тусгай зориулалтын тээврийн хэрэгслийн жолооч"],"a":"2","imgs":[],"t":"문장형","e":"Өндөр даралтат хийн аюулгүй байдлын удирдлагын тухай хуулийг хэрэгжүүлэх дүрмийн 51 дүгээр зүйлийн 1 дэх хэсэг, Хавсралт 31"},{"n":37,"b":"Дараах зүйлсээс Замын хөдөлгөөний тухай хуульд заасан согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулах нөхцөлтэй жолоодох эрх авсан жолоочийн мөрдөх үүргийн талаар зөв тайлбар аль нь вэ?","c":["Согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулсан автомашиныг аймаг, нийслэлийн цагдаагийн газарт бүртгүүлээгүйгээр жолоодвол жолоодох эрхийг түдгэлзүүлнэ.","Согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулаагүй эсвэл суурилуулалтын шаардлага хангахгүй төхөөрөмжтэй автомашин жолоодсон бол 1 сарын дотор зөрчлийг арилгах тухай үүрэг өгнө.","Согтуугаар жолоо барихаас сэргийлэх төхөөрөмжийг засварлах зорилгоор салгасан, өөрчилсөн эсвэл өөр аргаар ажиллагааг нь бууруулсныг мэдсээр байж тухайн төхөөрөмжтэй автомашин жолоодсон бол жолоодох эрхийг түдгэлзүүлнэ.","Согтуугаар жолоо барьсны улмаас жолоодох эрх авахгүй байх хугацаа дууссаны дараа зөвхөн хамгаалах төхөөрөмж суурилуулсан автомашин жолоодох нөхцлөөр жолоодох эрх авсан өдрөөс эхлэн зөвхөн ийм төхөөрөмж суурилуулсан автомашин жолоодож болно."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 50-3 дугаар зүйл (Согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулах болзолт жолоодох эрх авсан жолооч зэргийн дагаж мөрдөх зүйл), мөн хуулийн 93 дугаар зүйл (Жолоодох эрхийг хүчингүй болгох, түдгэлзүүлэх)-ийн 1 дэх хэсэг - Согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулсан автомашин зэргийг аймаг, нийслэлийн Цагдаагийн газарт бүртгүүлэлгүй жолоодсон тохиолдолд жолоодох эрхийг хүчингүй болгоно (21 дэх заалт). - Согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулаагүй эсвэл суурилуулах шалгуурт нийцээгүй согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулсан автомашин зэргийг жолоодсон тохиолдолд жолоодох эрхийг хүчингүй болгоно (22 дахь заалт). - Согтуугаар жолоо барихаас сэргийлэх төхөөрөмжийг засварлах зорилгоор задалсан, өөрчилсөн эсвэл бусад аргаар үр нөлөө нь буурсныг мэдсээр байж уг төхөөрөмж суурилуулсан автомашин зэргийг жолоодсон тохиолдолд жолоодох эрхийг хүчингүй болгоно (23 дахь заалт)."},{"n":38,"b":"Жолооч хуурамч нефтийн бүтээгдэхүүн гэдгийг мэдсээр байж автомашины түлш болгон ашиглавал ямар хариуцлага хүлээх вэ?","c":["50,000 ∼ 100,000 воны торгууль","500,000 ∼ 1,000,000 воны торгууль","2,000,000 ∼ 20,000,000 воны торгууль","Шийтгэл хүлээхгүй."],"a":"3","imgs":[],"t":"문장형","e":"Нефть болон нефтийг орлох түлшний үйл ажиллагааны тухай хуулийг хэрэгжүүлэх журмын Хавсралт 6 Захиргааны торгууль ногдуулах шалгуур: Хуурамч нефтийн бүтээгдэхүүн гэдгийг мэдсээр байж автомашины түлшээр хэрэглэсэн тохиолдолд хэрэглэсэн хэмжээнээс хамаарч 2,000,000 вон-оос 20,000,000 вон хүртэл захиргааны торгууль ногдуулж болно."},{"n":39,"b":"Дараах зүйлсээс цахилгаан автомашины цэнэглэх байгууламжийн талаар буруу тайлбар аль нь вэ?","c":["Нийтийн цэнэглэгч гэдэг нь амрах зогсоол, томоохон худалдааны төв, төрийн байгууллага зэрэгт суурилуулсан цэнэглэгчийг хэлнэ.","Цахилгаан автомашины цэнэглэх арга нь хувьсах гүйдлээр цэнэглэх удаан цэнэглэлт болон тогтмол гүйдлээр цэнэглэх хурдан цэнэглэлт гэсэн төрөлтэй.","Нийтийн цэнэглэгчийг зөвхөн урьдчилан бүртгүүлсэн автомашин ашиглах боломжтой.","Өөрийн эзэмшлийн газартай бол хувийн цэнэглэх байгууламж суурилуулж болно."],"a":"3","imgs":[],"t":"문장형","e":"Солонгосын цахилгаан байгууламжийн журам (KEC) 241.17 Цахилгаан автомашины тэжээлийн байгууламж: нийтийн цэнэглэгчийг цахилгаан автомашинтай жолооч бүр ашиглах боломжтой."},{"n":40,"b":"Хуурамч түлш хэрэглэсэн үед автомашинд үүсч болох асуудал биш зүйл нь?","c":["Түлшний хангамжийн систем зэвэрч, эвдэрснээс хөдөлгүүрийн дуу чимээ ихсэх","Түлш шахах инжектор эвдэрснээс хүч чадал болон түлшний хэмнэлт буурах","Тосолгооны чанар сайжирснаас хөдөлгүүрийн үрэлт багасч, улмаар хүч чадал буурах","Түлш нийлүүлдэг өндөр даралтын түлшний насос эвдэрснээс хөдөлгүүр унтрах"],"a":"3","imgs":[],"t":"문장형","e":"Хуурамч нефтийн бүтээгдэхүүнийг автомашины түлшээр хэрэглэсэн тохиолдолд тосолгооны чанар буурснаас үрэлтийн хүч нэмэгдэж, түлшний өндөр даралтын шахуурга болон инжектор эвдрэх магадлалтай."},{"n":41,"b":"Автомашинд суухаас өмнө тээврийн хэрэгслийн эргэн тойронд шалгах зүйлээс зөв 2-ыг сонгоно уу.","c":["Дугуйн элэгдлийн байдал","Урд болон хойд талд саад байгаа эсэх","Жолоочийн суудлын хяналтын самбар хэвийн ажиллаж байгаа эсэх","Тоормосны дөрөө хэвийн ажиллаж байгаа эсэх"],"a":"1, 2","imgs":[],"t":"문장형","e":"Жолоочийн суудлын хянах самбар болон тоормосны дөрөө хэвийн ажиллаж байгаа эсэх нь автомашинд суусны дараа жолоочийн суудлаас шалгах зүйл юм."},{"n":42,"b":"Ерөнхийдөө засвар үйлчилгээ шаарддаггүй (MF: Maintenance Free) аккумуляторын ашиглалтын хугацаа дууссан үед шалгах цонхонд ямар өнгө харагддаг вэ?","c":["Шар","Цагаан","Хар","Ногоон"],"a":"2","imgs":[],"t":"문장형","e":"Ердийн засвар шаардахгүй (MF: Maintenance Free) аккумуляторын хувьд ногоон (цэнхэр) өнгө нь хэвийн байдлыг, электролитийн нягт бага гэсэн утгатай хар өнгө нь цэнэглэх буюу солих шаардлагатайг, цагаан (улаан) өнгө нь аккумуляторын ашиглалтын хугацаа дууссаныг илэрхийлнэ."},{"n":43,"b":"Дараах зүйлсээс автомашины түлш болгон ашигласан тохиолдолд хуурамч түлшний бүтээгдэхүүнд хамаарахгүй нь аль вэ?","c":["Бензинд метанол хольсон бүтээгдэхүүн","Ердийн бензинд өндөр октантай бензинийг ойролцоогоор 5%-иас бага хэмжээгээр хольсон бүтээгдэхүүн","Дизель түлшинд керосин хольсон бүтээгдэхүүн","Дизель түлшинд ойролцоогоор 5%-иас бага хэмжээний ус хольсон бүтээгдэхүүн"],"a":"4","imgs":[],"t":"문장형","e":"Нефть болон нефтийг орлох түлшний үйл ажиллагааны тухай хуульд заасан хуурамч нефтийн бүтээгдэхүүн гэж нефтийн бүтээгдэхүүнд өөр нефтийн бүтээгдэхүүн (өөр зэрэглэлийн нефтийн бүтээгдэхүүнийг оролцуулан) эсвэл нефть химийн бүтээгдэхүүн зэргийг хольсон аргаар автомашины түлшээр ашиглах зорилгоор үйлдвэрлэсэн бүтээгдэхүүнийг хэлэх бөгөөд холих хэмжээнээс хамаарсан тусдаа шалгуур байхгүй тул бага хэмжээгээр хольсон ч хуурамч нефтийн бүтээгдэхүүн гэж үзэж болно. Хуурамч нефтийн бүтээгдэхүүн эсвэл хууль ёсны зориулалтаас гадуурх түлш хэрэглэх нь автомашины гэмтэлд хүргэж, зам тээврийн осол болон хортой утааны ялгарал нэмэгдсэнээс үүдэх байгаль орчны бохирдол зэргийг үүсгэнэ. Бензин, дизель түлш зэрэгт ус болон тунадас орсон тохиолдолд чанарын шаардлага хангаагүй бүтээгдэхүүн гэж үзнэ."},{"n":44,"b":"Устөрөгчийн хий алдагдсан эсэхийг шалгах арга биш нь аль вэ?","c":["Шатамхай хий илрүүлэгч ашиглан хэмжих","Савантай усаар шалгах","Хийн үнэрийг үнэрлэн шалгах","Устөрөгч илрүүлэгчээр шалгах"],"a":"3","imgs":[],"t":"문장형","e":"Устөрөгчийн автомашины цэнэглэх станцын барилгын гарын авлага, хуудас 12, Солонгосын Хийн аюулгүй байдлын корпораци: Устөрөгч нь дэлхий дээрх хамгийн хөнгөн элемент бөгөөд өнгөгүй, амтгүй, хоргүй шинж чанартай. Мөн устөрөгчтэй төстэй тархалтын хурдтай үнэрлэгч бодис байдаггүй тул алдагдлыг илрүүлэхэд хэцүү хий юм."},{"n":45,"b":"Устөрөгчөөр ажилладаг автомашины аюулгүй ажиллагааны дүрмийн талаар буруу нь аль вэ?","c":["Цэнэглэхийн өмнө автомашины хөдөлгүүрийг унтраана.","Цэнэглэх станцад тамхи татахдаа автомашинаас холдож татна.","Устөрөгчийн хий алдагдсан тохиолдолд цэнэглэх станцын аюулгүй ажиллагаа хариуцсан ажилтнаас аюулгүй байдлын үзлэг хийхийг хүснэ.","Устөрөгчөөр ажилладаг автомашин мөргөлдөх зэрэг зам тээврийн осолд орсны дараа хийн аюулгүй байдлын үзлэг хийлгэсний дараа ашиглана."],"a":"2","imgs":[],"t":"문장형","e":"Устөрөгчийн автомашины цэнэглэх байгууламжийн засвар үйлчилгээний гарын авлага, хуудас 21. Ерөнхий анхаарах зүйлд 1) цэнэглэх станцын орчимд тамхи татахыг хатуу хориглох, 2) дэлбэрэлтээс хамгаалсан цахилгаан тоног төхөөрөмж ашиглах, 3) хийн тоног төхөөрөмжийн өрөөнд гар утас хэрэглэхийг хориглох, 4) цэнэглэх станц доторх автомашины хурдны дээд хязгаар 10 км-ээс ихгүй байх, 5) гарын авлагыг судлахаас өмнө тоног төхөөрөмж ажиллуулахыг хориглох, 6) цэнэглэх станцыг зөвхөн сургалтад хамрагдсан ажилтан ашиглаж, засвар үйлчилгээ хийх ёстой, 7) гарын авлагад дурдсан зүйл болон Өндөр даралтат хийн аюулгүй байдлын удирдлагын тухай хуулийн дагуу ажиллуулах, 8) аюултай нөхцөлд тоног төхөөрөмж ажиллуулахыг хориглох, 9) аюулгүй байдлын холбогдох тоног төхөөрөмж хэвийн ажиллахгүй байгаа үед ажиллуулахыг хориглож, аюулгүй байдлын холбогдох тоног төхөөрөмжийг үл тоон ажиллуулахгүй байх, 10) ашиглалт болон засвар үйлчилгээний холбогдох журмыг дагаж мөрдөх, 11) гарын авлагад тайлбарласан даралтын хүрээнд л ажиллуулах зэрэг орно."},{"n":46,"b":"Дараах зүйлсээс устөрөгчөөр ажилладаг автомашинд хий алдагдсан эсэхийг шалгах шаардлагагүй хэсэг аль нь вэ?","c":["Хавхлага болон савны холболтын хэсэг","Даралт тохируулагч","Хийн хоолой болон дамжуулах хоолойн холболтын хэсэг","Түлшний элементийн өсгөгч инвертер"],"a":"4","imgs":[],"t":"문장형","e":"Цахилгаан тоног төхөөрөмж нь түлшний элементийн багц (стек)-аас гарсан тогтмол гүйдэл (DC)-ийг хувьсах гүйдэл (AC) болгон хувиргах инвертер, тоормослох үед үүсэх цахилгааныг хадгалах суперконденсатор болон хоёрдогч батерей зэргээс бүрдэнэ. Цахилгаан хувиргах төхөөрөмж нь стекээс авсан DC цахилгааныг моторын бүтцийн хүчдэлийн түвшинд хувиргах, эсвэл өндөр гүйдлийн AC хөтлөх моторыг ажиллуулж, удирдахын тулд DC цахилгааныг AC цахилгаан болгон хувиргах, мөн автомашин доторх төрөл бүрийн электрон төхөөрөмжийг ажиллуулах хүчдэл болгон хувиргах үүрэгтэй."},{"n":47,"b":"Цахилгаан автомашиныг зөв цэнэглэх аргын талаар тохиромжгүй нь аль вэ?","c":["Цэнэглэхдээ стандартын шаардлага хангасан цэнэглэгч болон адаптер ашиглана.","Цэнэглэж байх үед цэнэглэх холбогчийг дур мэдэн салгахгүй, цэнэглэлтийг дуусгах товчоор зогсооно.","Нойтон гараар цэнэглэгч ашиглахгүй бөгөөд цэнэглэх төхөөрөмжид ус орохоос сэргийлнэ.","Зөөврийн цэнэглэгч ашиглан цэнэглэх үед ахуйн зориулалтын олон залгууртай сунгагч эсвэл уртасгагч кабель ашиглана."],"a":"4","imgs":[],"t":"문장형","e":"Цахилгаан автомашин цэнэглэхэд стандартад нийцээгүй олон залгуурт удлагч эсвэл уртасгагч утас ашиглавал өндөр чадлын улмаас гал гарах аюултай."},{"n":48,"b":"Хууль тогтоомжийн дагуу автомашины гэрлийн төрөл болон гэрлийн өнгийг зөв харгалзуулсан нь аль вэ?","c":["Ухрах гэрэл – Улбар шар","Улсын дугаарын гэрэл – Цэнхэр","Арын гэрэл – Цагаан","Тоормосны гэрэл – Улаан"],"a":"4","imgs":[],"t":"문장형","e":"Гэрлийн өнгөний хувьд ухрах гэрэл ба улсын дугаарын гэрэл нь цагаан (Автомашин болон автомашины эд ангийн чанар, стандартын тухай дүрмийн 39 дүгээр зүйл, 41 дүгээр зүйл), арын гэрэл ба тоормосны гэрэл нь улаан өнгөтэй байна (мөн дүрмийн 42 дугаар зүйл, 43 дугаар зүйл)."},{"n":49,"b":"LPG (Шингэрүүлсэн хийн түлш) автомашины түлшний шинж чанарын талаар тохиромжгүй тайлбар аль нь вэ?","c":["Ихэвчлэн хийн төлөвт шатдаг тул хөдөлгүүр жигд ажилладаг.","Автомашины LPG нь өвөрмөц үнэртэй байдаг.","Ерөнхийдөө агаараас хөнгөн бөгөөд дэлбэрэх эрсдэл бага байдаг.","Бензин болон дизель түлштэй харьцуулахад энергийн нягт багатай тул ижил хөдөлгүүрийн багтаамжтай үед хүчин чадал бага, түлшний зарцуулалт өндөр байдаг."],"a":"3","imgs":[],"t":"문장형","e":"Ерөнхийдөө хийн төлөвт шатдаг тул хөдөлгүүр зөөлөн ажиллаж, шаталтын үр ашиг өндөр учир нүүрсхүчлийн хий зэрэг бохирдуулагч бодисын ялгарал бага байдаг. LPG нь өөрөө өнгөгүй, үнэргүй боловч автомашины LPG-д тусгай үнэр холиж, алдагдлыг илрүүлэх боломжтой болгодог. Ердийн агаараас хүнд бөгөөд дэлбэрэх аюул их. Бензин, дизель түлштэй харьцуулахад эрчим хүчний нягт бага тул ижил хөдөлгүүрийн багтаамжтай үед хүч чадал бага, түлшний хэмнэлт муу байдаг."},{"n":50,"b":"Автомашины тоормосны хүчийг бууруулах шалтгаанаас хамгийн хамаарал багатай нь аль вэ?","c":["Мастер цилиндрийн гэмтэл","Дугуйн цилиндрийн гэмтэл","Суллах сэрээний хэлбэр алдагдах","Уурын түгжрэл үүсэх"],"a":"3","imgs":[],"t":"문장형","e":"Салгагч сэрээ нь механик хурдны хайрцагтай автомашины авцуулгын системд хамаарах эд анги бөгөөд салгагч холхивчийн хүзүүвчинд суулгагдаж дөрөөний үйлчлэх хүчийг салгагч холхивчид дамжуулах үүрэгтэй тул тоормосны хүчтэй шууд хамааралгүй."},{"n":51,"b":"Жолоодлогын туслах системтэй автомашиныг жолоодох аргын талаар буруу нь аль вэ?","c":["Жолоодлогын туслах системийг ашиглаж байх үед систем ажиллаж байгаа эсэхийг тогтмол шалган жолоодно.","Жолооч оролцох шаардлагатай гэсэн анхааруулга гарсан үед систем унтрах хүртэл хүлээгээд дараа нь оролцоно.","Жолоодлогын туслах системийг хэсэгчлэн эсвэл бүрэн унтраах үед ажиллагааг нь шалгана.","Жолоодлогын туслах систем ажиллаж байсан ч шаардлагатай үед шууд оролцох бэлэн байдалтай жолоодно."],"a":"2","imgs":[],"t":"문장형","e":"Жолоодлогод оролцохыг анхааруулсан үед нэн даруй оролцож жолоодох ёстой."},{"n":52,"b":"Автомашиныг аюулгүй, тав тухтай жолоодоход туслах системийн талаар буруу тайлбар аль нь вэ?","c":["LFA (Lane Following Assist) нь \"эгнээ барих туслах\" функц бөгөөд автомашиныг эгнээний төвд явуулахад тусалдаг.","ASCC (Adaptive Smart Cruise Control) нь \"тээврийн хэрэгсэл хоорондын зай болон хурд барих\" функц бөгөөд жолоочийн тохи руулсан хурдыг хадгалж, урд яваа автомашинтай аюулгүй зайг барин автоматаар хурд нэмэгдүүлэх, хасах ажиллагааг гүйцэтгэдэг.","ABSD (Active Blind Spot Detection) нь \"сохор бүс илрүүлэх\" функц бөгөөд сохор бүсэд мөргөлдөх эрсдэлийг илрүүлж, аюулгүйгээр эгнээ солиход тусалдаг.","AEB (Autonomous Emergency Braking) нь \"автомат яаралтай тоормослох\" функц бөгөөд тоормослох үед дугуй түгжигдэхээс сэргийлж тоормосны зайг багасгадаг."],"a":"4","imgs":[],"t":"문장형","e":"Аюулгүй байдлын зориулалттай дэвшилтэт автомашины функцэд LFA, ASCC, ABSD, AEB зэрэг олон төрлийн функц байдаг бөгөөд автомашин худалдан авах сонголтоос хамаарч жолооч сонгож болох хэсэг байхаас гадна жолоодож явахдаа шаардлагын дагуу зарим функцийг унтраахыг ч жолооч сонгож болохоор байдаг. AEB нь аюултай нөхцөл байдал үүсэхэд жолооч тоормос ажиллуулахгүй эсвэл сул ажиллуулснаас мөргөлдөөнөөс зайлсхийх боломжгүй үед систем автоматаар яаралтай тоормослох функц юм. ④ сонголт нь ABS-ийн тухай тайлбар юм."},{"n":53,"b":"Автомат жолоодлогын системтэй холбоотой хууль тогтоомжийн талаар буруу нь аль вэ?","c":["Замын хөдөлгөөний тухай хуульд заасан \"жолоодох\" гэдэгт зам дээр тээврийн хэрэгсэл болон хөсгийг зориулалтын дагуу автомат ж олоодлогын систем ашиглан жолоодохыг хамааруулахгүй.","Жолооч автомат жолоодлогын системийг ашиглан жолоодож байгаа тохиолдолд гар утас ашиглахыг хориглосон заалт үйлчлэхгүй.","Автомат жолоодлогын системээс жолоочийг оролцох шаардлага тавихад хурдан шаламгай хариу үйлдэл үзүүлж чадаагүй жолоочид ногдуулах зөрчлийн торгууль 40,000 вон байна.","\"Автомат жолоодлогын систем\" гэдэг нь жолооч эсвэл зорчигчийн удирдлагагүйгээр орчны нөхцөл болон замын мэдээллийг өөрөө таньж, дүгнэн автомашиныг жолоодох боломжтой автомат төхөөрөмж, программ хангамж болон түүнтэй холбоотой бүх төхөөрөмжийг хэлнэ."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 26 дахь заалт, 56-2 дугаар зүйл, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8. 38 дахь заалтын 3: «Жолоодох» гэж зам дээр тээврийн хэрэгсэл буюу трамвайг түүний үндсэн ашиглах аргын дагуу ашиглахыг (удирдах эсвэл бие даасан жолоодлогын систем ашиглахыг оролцуулан) хэлнэ. Бүрэн бие даасан жолоодлогын системд хамаарахгүй бие даасан жолоодлогын системтэй автомашины жолооч нь уг системийн шууд жолоодох шаардлагад саадгүй хариу үйлдэл үзүүлж, жолооны механизм, тоормосны систем болон бусад төхөөрөмжийг шууд ажиллуулан жолоодох ёстой. Жолооч бие даасан жолоодлогын системийг ашиглан жолоодож байгаа тохиолдолд 49 дүгээр зүйлийн 1 дэх хэсгийн 10 дахь заалт, 11 дэх заалт болон 11 дэх заалтын 2-ын заалтыг хэрэглэхгүй. Бие даасан жолоодлоготой автомашины худалдааны хэрэглээг дэмжих, туслах тухай хуулийн 2 дугаар зүйлийн 1 дэх хэсгийн 2 дахь заалт: «Бие даасан жолоодлогын систем» гэж жолооч эсвэл зорчигчийн удирдлагагүйгээр орчны нөхцөл байдал, замын мэдээлэл зэргийг өөрөө таньж, шийдвэрлэн автомашиныг ажиллуулах боломжийг олгох автоматжуулсан тоног төхөөрөмж, програм хангамж болон үүнтэй холбоотой бүх төхөөрөмжийг хэлнэ."},{"n":54,"b":"Дараах зүйлсээс устөрөгчөөр ажилладаг автомашины үндсэн эд анги биш нь аль вэ?","c":["Түлшний элемент","Хөдөлгүүрийн цахилгаан мотор","Хөдөлгүүр","Аккумулятор"],"a":"3","imgs":[],"t":"문장형","e":"Устөрөгчийн автомашины ажиллах зарчим: Устөрөгч хадгалах саванд хадгалсан устөрөгчийг түлшний элементийн системд нийлүүлж, түлшний элементийн багц (стек)-д хүчилтөрөгч ба устөрөгчийн химийн урвалаар цахилгаан үүсгэнэ. Үүссэн цахилгаан нь моторыг ажиллуулж автомашиныг хөдөлгөх, эсвэл жолоодлогын байдлаас хамаарч батерейд хадгалагдана. Хөдөлгүүр нь дотоод шаталтат хөдөлгүүртэй автомашины бүрэлдэхүүн хэсэг юм."},{"n":55,"b":"Дотоод шаталтын хөдөлгүүрийн тахир голоос үүсдэг эргүүлэх хүчийг (агшин зуур гаргах хүч) юу гэж нэрлэдэг вэ?","c":["Эргүүлэх хүч","Түлшний зарцуулалт","Хөдөлгүүрийн багтаамж","Морины хүч"],"a":"1","imgs":[],"t":"문장형","e":"② 1 литр түлшээр явж болох зай юм. ③ Дотоод шаталтат хөдөлгүүрт бүлүүрийн хөдлөх эзлэхүүн юм. ④ 75 килограмм жинг 1 секундын дотор 1 метр зөөх ажлын хэмжээ юм."},{"n":56,"b":"Автомат жолоодлоготой автомашиныг арилжааны хэрэглээнд нэвтрүүлэхийг дэмжих болон дэмжлэг үзүүлэх тухай хууль тогтоомжийн дагуу автомат жолоодлоготой автомашины талаарх дараах тайлбаруудаас аль нь буруу вэ?","c":["Автомат жолоодлоготой автомашиныг бүрэн автомат жолоодлоготой автомашин болон хэсэгчилсэн автомат жолоодлоготой автомашин гэж ангилж болно.","Бүрэн автомат жолоодлоготой автомашин гэдэг нь зөвхөн автомат жолоодлогын системээр ажиллах боломжтой бөгөөд жолоочгүй эсвэл жолооч, зорчигчийн оролцоо шаардлагагүй автомашиныг хэлнэ.","Хэсэгчилсэн автомат жолоодлоготой автомашин гэдэг нь зөвхөн автомат жолоодлогын системээр ажиллах боломжгүй эсвэл жолооч байнга анхаарал тавих шаардлагатай зэрэг жолооч эсвэл зорчигчийн оролцоо шаардлагатай автомашиныг хэлнэ.","Автомат жолоодлоготой автомашинд зөвхөн суудлын автомашин хамаарах бөгөөд олон суудалт автомашин болон ачааны автомашинд энэ хууль үйлчлэхгүй."],"a":"4","imgs":[],"t":"문장형","e":"Бие даасан жолоодлоготой автомашины худалдааны хэрэглээг дэмжих, туслах тухай хуулийн 2 дугаар зүйлийн 1 дэх хэсгийн 1 дэх заалт, 2 дахь хэсгийн дагуу 1. Хэсэгчилсэн бие даасан жолоодлоготой автомашин: зөвхөн бие даасан жолоодлогын системээр ажиллах боломжгүй эсвэл жолооч тасралтгүй ажиглах шаардлагатай зэрэг жолооч буюу зорчигчийн оролцоо шаардагддаг бие даасан жолоодлоготой автомашин 2. Бүрэн бие даасан жолоодлоготой автомашин: зөвхөн бие даасан жолоодлогын системээр ажиллах боломжтой тул жолоочгүй эсвэл жолооч буюу зорчигчийн оролцоо шаардагдахгүй бие даасан жолоодлоготой автомашин гэж ангилах бөгөөд ④ бие даасан жолоодлоготой автомашин нь суудлын автомашинаар хязгаарлагдахгүй, олон суудалт автомашин болон ачааны автомашинд ч хамаарна."},{"n":57,"b":"Цахилгаан автомашины ашиглалтын талаар зөв биш 2-ыг сонгоно уу.","c":["Ахуйн зориулалтын суудлын автомашины техникийн хяналтын хүчинтэй хугацаа 6 жил байна.","Холын замд явахын өмнө аккумуляторыг шалгаж, урьдчилан цэнэглэнэ.","Цэнэглэсний дараахан огцом хаазлах, огцом тоормослохгүй байх нь зүйтэй.","Суудлын халаагуур, жолооны хүрдний халаагуураас илүү агаар халаагч ашиглах нь үр ашигтай."],"a":"1, 4","imgs":[],"t":"문장형","e":"① Шинэ автомашинаас бусад ашиг олох зориулалтгүй суудлын автомашины техникийн үзлэгийн хүчинтэй хугацаа 2 жил байна (Автотээврийн хэрэгслийн удирдлагын тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 15-ын 2). ④ Дотоод шаталтат хөдөлгүүргүй цахилгаан автомашины хувьд халаагуур ажиллуулахад их хэмжээний цахилгаан эрчим хүч зарцуулдаг. Тиймээс халаалттай суудал, халаалттай жолооны хүрд ашиглах нь зүйтэй. ② Батерейны үлдэгдэл цэнэг болон явах зайг тооцож, явж байхдаа цэнэг дуусахаас сэргийлнэ. ③ Цэнэглэсний дараа шууд батерейны температур нэмэгддэг. Энэ үед огцом хурдлах, огцом зогсох нь цахилгаан эрчим хүчийг их зарцуулдаг тул батерейны үр ашгийг бууруулдаг."},{"n":58,"b":"Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу автомашины (хүүхдийн сургуулийн автобуснаас бусад) цонхны шилни й үзэгдэх гэрлийн нэвтрүүлэх чадварын зохицуулалтад аль нь хамаарах вэ?","c":["Арын суудлын хоёр хажуугийн цонхны шил","Урд салхины шил болон жолоочийн суудлын баруун, зүүн хажуугийн цонхны шил","Урд салхины шил, жолоочийн суудлын баруун, зүүн хажуугийн шил болон арын шил","Бүх цонхны шил"],"a":"2","imgs":[],"t":"문장형","e":"Автомашины урд салхины шил болон жолоочийн суудлын зүүн, баруун хажуугийн шилний үзэгдэх гэрлийн нэвтрүүлэх чадвар нь Ерөнхийлөгчийн зарлигаар тогтоосон шалгуураас бага байгаагаас замын хөдөлгөөний аюулгүй байдал зэрэгт саад учруулж болзошгүй автомашиныг жолоодож болохгүй."},{"n":59,"b":"Автомашины удирдлагын тухай хууль тогтоомжийн дагуу суудлын автомашин гэж хэд хүртэлх хүнийг тээвэрлэхэд тох ируулан үйлдвэрлэсэн автомашиныг хэлэх вэ?","c":["10 хүн","12 хүн","15 хүн","18 хүн"],"a":"1","imgs":[],"t":"문장형","e":"Суудлын автомашин гэж 10 ба түүнээс цөөн хүн тээвэрлэхэд тохируулан үйлдвэрлэсэн автомашин юм."},{"n":60,"b":"Автомашины удирдлагын тухай хууль тогтоомжийн дагуу ахуйн зориулалтын шинэ суудлын автомашины анхны тех никийн хяналтын хүчинтэй хугацаа хэд вэ?","c":["1 жил","2 жил","4 жил","5 жил"],"a":"4","imgs":[],"t":"문장형","e":"Автотээврийн хэрэгслийн удирдлагын тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 15-ын 2]: Ашиг олох зориулалтгүй суудлын автомашины анхны техникийн үзлэгийн хүчинтэй хугацаа 5 жил байна."},{"n":61,"b":"Автомашины удирдлагын тухай хуульд заасан автомашины төрөлд хамаарах 2-ыг сонгоно уу.","c":["Барилгын машин механизм","Ачааны автомашин","Мотоблок","Тусгай зориулалтын тээврийн хэрэгсэл"],"a":"2, 4","imgs":[],"t":"문장형","e":"Автотээврийн хэрэгслийн удирдлагын тухай хуулийн дагуу автомашинд суудлын автомашин, олон суудалт автомашин, ачааны автомашин, тусгай автомашин, хоёр дугуйт тээврийн хэрэгсэл хамаарна."},{"n":62,"b":"Ахуйн зориулалтын болон түрээсийн зориулалттай цахилгаан автомашин, устөрөгчийн түлшний элементийн автомашины (хайбрид автомашинаас бусад) зориулалтын улсын дугаарын өнгө аль нь вэ?","c":["Шар дэвсгэр дээр хар үсэг","Цэнхэр дэвсгэр дээр хар үсэг","Хөхөвтөр хар дэвсгэр дээр цагаан үсэг","Нил ягаан дэвсгэр дээр хар үсэг"],"a":"2","imgs":[],"t":"문장형","e":"Автомашины улсын бүртгэлийн дугаарын тэмдэг зэргийн стандартын тухай мэдэгдэл (Газар, дэд бүтэц, тээврийн яамны 2017-245 дугаар мэдэгдэл, 2017.4.18-ны хэсэгчилсэн нэмэлт өөрчлөлт)"},{"n":63,"b":"Дараах автомашинуудаас аль нь Hi-Pass эгнээг ашиглах боломжгүй вэ?","c":["16 тонн даацтай өөрөө буулгагч ачааны автомашин","Сөүл–Сувон чиглэлд явдаг хоёр давхар суудлын автобус","Нэг эгнээтэй Hi-Pass замын хувьд өргөн нь 3.7 м гал унтраах автомашин","10 тонн жинтэй том оврын аврах автомашин"],"a":"3","imgs":[],"t":"문장형","e":"Hi-pass эгнээний хувьд нэг эгнээтэй үед эгнээний өргөн 3.0 м, олон эгнээтэй үед эгнээний өргөн 3.6 м байна."},{"n":64,"b":"Автомашины удирдлагын тухай хууль тогтоомжийн дагуу ахуйн зориулалтын бага оврын олон суудалт автомашины (20 01 оноос хойш бүртгэгдсэн, ашиглалтын хугацаа нь 4 жилээс дээш) техникийн хяналтын хүчинтэй хугацаа хэд вэ?","c":["6 сар","1 жил","2 жил","4 жил"],"a":"2","imgs":[],"t":"문장형","e":"Автотээврийн хэрэгслийн удирдлагын тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 15-ын 2: Ашиг олох зориулалтгүй бага болон жижиг оврын олон суудалт автомашины техникийн үзлэгийн хүчинтэй хугацаа (автомашины нас 4 жилээс дээш) 1 жил байна."},{"n":65,"b":"Автомашины удирдлагын тухай хууль тогтоомжийн дагуу ахуйн зориулалтын бага оврын ачааны автомашины (аш иглалтын хугацаа нь 4 жилээс хэтрээгүй) техникийн хяналтын хүчинтэй хугацаа хэд вэ?","c":["6 сар","1 жил","2 жил","4 жил"],"a":"3","imgs":[],"t":"문장형","e":"Автотээврийн хэрэгслийн удирдлагын тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 15-ын 2: Ашиг олох зориулалтгүй бага болон жижиг оврын ачааны автомашины техникийн үзлэгийн хүчинтэй хугацаа (автомашины нас 4 жил ба түүнээс доош) 2 жил байна."},{"n":66,"b":"Автомашины удирдлагын тухай хууль тогтоомжийн дагуу шинэ автомашин худалдан авах үед түр ашиглалтын зөв шөөрлийн хүчинтэй хугацааны стандарт аль нь вэ?","c":["10 хоногоос илүүгүй","15 хоногоос илүүгүй","20 хоногоос илүүгүй","30 хоногоос илүүгүй"],"a":"1","imgs":[],"t":"문장형","e":"Автотээврийн хэрэгслийн удирдлагын тухай хуулийг хэрэгжүүлэх журмын 7 дугаар зүйлийн 2 дахь хэсгийн 1 дэх заалт: Түр ашиглах зөвшөөрлийн хүчинтэй хугацаа 10 хоногоос ихгүй байна."},{"n":67,"b":"Дараах зүйлсээс автомашины удирдлагын тухай хууль тогтоомжийн дагуу автомашины өөрчлөлтийн бүртгэл хийх үнд эслэлд хамаарахгүй нь аль вэ?","c":["Автомашины үндсэн ашиглалтын байршил өөрчлөгдсөн үед","Автомашины явах эд ангийн дугаар өөрчлөгдсөн үед","Өмчлөх эрх өөрчлөгдсөн үед","Хуулийн этгээдийн нэр өөрчлөгдсөн үед"],"a":"3","imgs":[],"t":"문장형","e":"Автотээврийн хэрэгслийн бүртгэлийн тухай зарлигийн 22 дугаар зүйл, 26 дугаар зүйл: Автомашины өмчлөх эрх өөрчлөгдсөн үед шилжүүлэн бүртгүүлэх ёстой."},{"n":68,"b":"Автомат жолоодлоготой автомашины жолоочийн зөв хандлагад тохирохгүй нь аль вэ?","c":["Автомат жолоодлоготой автомашин учраас согтууруулах ундаа хэрэглэсэн үедээ жолоодож болно.","Ядарсан үедээ автомат жолоодлоготой автомашин жолоодож болохгүй.","Автомат жолоодлоготой автомашин байсан ч сэтгэцэд нөлөөлөх эм хэрэглэсний дараа жолоодож болохгүй.","Автомат жолоодлоготой автомашин жолоодож байх үед гар утас ашиглах боломжтой."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 44 дүгээр зүйлийн 1 дэх хэсэг (Согтуу байдалтай жолоо барихыг хориглох): Хэн ч согтуу байдалтай автомашин зэрэг, трамвай эсвэл унадаг дугуй жолоодож болохгүй. 45 дугаар зүйл (Хэт ядарсан үед зэрэгт жолоо барихыг хориглох): Автомашин зэрэг буюу трамвайн жолооч согтуу байдлаас гадна хэт ядарсан, өвчтэй, эсвэл эм бэлдмэл (хар тамхи, каннабис, сэтгэцэд нөлөөт эм зэрэг)-ийн нөлөө болон бусад шалтгаанаар хэвийн жолоодож чадахгүй байж болзошгүй байдалд автомашин зэрэг буюу трамвай жолоодож болохгүй. 56-2 дугаар зүйл (Бие даасан жолоодлоготой автомашины жолоочийн дагаж мөрдөх зүйл гэх мэт)-ын 2 дахь хэсэг: Жолооч бие даасан жолоодлогын системийг ашиглан жолоодож байгаа тохиолдолд 49 дүгээр зүйл (Бүх жолоочийн дагаж мөрдөх зүйл гэх мэт)-ийн 1 дэх хэсгийн 10 дахь заалт (гар утас хэрэглэхийг хориглох), 11 дэх заалт (дүрс дэлгэц үзэхийг хориглох) болон 11 дэх заалтын 2 (дүрс дэлгэц ажиллуулахыг хориглох)-ын заалтыг хэрэглэхгүй."},{"n":69,"b":"Ачааны автомашины тээврийн үйлчилгээний тухай хуульд заасны дагуу ачааны автомашины тээвэрлэгч нь холбогдох хууль тогтоомжийн дагуу жолоодлогын бүртгэлийн төхөөрөмжид хадгалагдсан жолоодлогын мэдээллийг ( )-ийн хугацаанд хадгалах ёстой. ( ) -д тохирох нь аль вэ?","c":["3 сар","6 сар","1 жил","2 жил"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний аюулгүй байдлын тухай хуулийг хэрэгжүүлэх журмын 45 дугаар зүйлийн 2 дахь хэсэг: Замын хөдөлгөөний аюулгүй байдлын тухай хуулийн дагуу 6 сарын хугацаанд хадгалах ёстой."},{"n":70,"b":"Автомашины удирдлагын тухай хууль тогтоомжийн дагуу автомашины өмчлөл шилжүүлэн бүртгүүлэх хүн худалдан авс ан өдрөөс хойш ( )-ийн дотор бүртгүүлэх ёстой. ( )-д тохирох нь аль вэ?","c":["15 хоног","20 хоног","30 хоног","40 хоног"],"a":"1","imgs":[],"t":"문장형","e":"Автотээврийн хэрэгслийн бүртгэлийн тухай зарлигийн 26 дугаар зүйл (Шилжүүлэн бүртгүүлэх хүсэлт): Автомашин худалдан авсан өдрөөс хойш 15 хоногийн дотор шилжүүлэн бүртгүүлэх ёстой."},{"n":71,"b":"Автомашины удирдлагын тухай хуулийн дагуу автомашины ээлжит техник
