тийн хүчтэй салхи нь уулархаг бүс нутаг, өндөрлөг газар, гүүрэн дээр, хонгилын орох, гарах хэсэг зэрэгт үүсэхэд амархан тул ийм газраар өнгөрөхдөө болгоомжилно. Ийм нөхцөлд жолоог хоёр гараараа чанга атгаж эгнээгээ хадгалан хурдаа бууруулж байж аюулгүй. Мөн хүчтэй салхи, шуурганд тэмдэг, гэрлэн дохио, замын хажуугийн мод унаж болзошгүй тул ойролцоо зогсоолд тавихгүй байх."},{"n":428,"b":"Хайрган замаар жолоодох талаар тайлбар юм. Хамгийн зөв 2 нь аль вэ?","c":["Жолооны хүрдийг аль болох сул барьж, гар руу дамжих цохилтыг багасгана.","Дугуйг замтай аль болох сайн хүрэлцүүлэхийн тулд хурдыг нэмэгдүүлэн явна.","Явган зорчигч болон бусад тээврийн хэрэгсэл болон хөсөг рүү хайрга үсрэхгүй байхаар удаан явна.","Дугуйн агаарын даралтыг хэвийн хэмжээнээс бага зэрэг бага байлгах нь өндөр байлгаснаас илүү ашигтай."],"a":"3, 4","imgs":[],"t":"문장형","e":"Хайргатай зам нь гадаргуу тэгш бус бөгөөд хайрганаас болж дугуй гэмтэх, жолооны хөдөлгөөн ихсэж болно. Жолооны хөдөлгөөнийг аль болох бага байлгаж хурдаа бууруулан, доод арааг ашиглан тогтмол хурдыг хадгалах ба дугуйн зохистой хийн даралтыг бага зэрэг бага байлгах тусам барьцалт сайжирч, доргилтыг хамгийн бага болгон жолоодоход ашигтай."},{"n":429,"b":"Бороотой замаар явж байхдаа урд яваа автомашин зогсохыг хараад тоормослох үед үүсэх үзэгдлийн талаар буруу 2 нь аль вэ?","c":["Огцом тоормослох үед дугуй ба замын гадаргуугийн үрэлтийн улмаас автомашины урд хэсэг доош бөхийх үзэгдэл үүсдэг.","Замын гадаргуугийн үрэлт багассанаас болж бороотой замд чөлөөт явалтын зай уртасдаг.","Халтиргаа болон нэг талын тоормослолтын үзэгдэл үүсэж, эгнээнээс гарах боломжтой.","Автомашины дугуйн элэгдэл ихсэх тусам тоормосны зай богиносдог."],"a":"2, 4","imgs":[],"t":"문장형","e":"① Огцом тоормослох үед дугуй болон замын гадаргуугийн үрэлтээс болж автомашины урд хэсэг доош бөхийх үзэгдэл үүснэ. ② Борооны замд дугуй болон замын гадаргуугийн үрэлтийн хүч буурах тул тоормосны зай уртасна. ③ Усан хальсны үзэгдэл болон нэг талын тоормослох үзэгдэл үүсч, жолооны чиглэл өөрчлөгдөн эгнээнээс гарч болзошгүй. ④ Автомашины дугуй элэгдэх тусам тоормосны зай уртасна."},{"n":430,"b":"Өгсүүр замын оройд ойртож байна. Аюулгүй жолоодох арга 2 нь аль вэ?","c":["Түлшний зарцуулалтыг бууруулахын тулд хөдөлгүүрийн RPM (минутын эргэлт)-ийг нэмэгдүүлнэ.","Өгсүүрийн оройд заавал түр зогсоод хөдөлнө.","Урд автомашинтайгаа аюулгүйн зайгаа хадгалан явна.","Өндөр араанаас илүү нам араагаар явна."],"a":"3, 4","imgs":[],"t":"문장형","e":"① RPM өндөр байвал түлшний зарцуулалт их байна. ② Өгсүүрийн оройд удаан явах ба заавал түр зогсох шаардлагагүй. ③ Урд явж буй тээврийн хэрэгслээс зайгаа холдуулж аюулгүй зайг хадгалах нь зүйтэй. ④ Хөдөлгүүрийн хүч бага дээд араанаас хөдөлгүүрийн хүч их доод араагаар явах нь дээр."},{"n":431,"b":"Уруу замаар явах үед хамгийн аюулгүй жолоодох арга 2 нь аль вэ?","c":["Араа солихтой ямар ч хамааралгүй тул зөвхөн хөлийн тоормос хэрэглэнэ.","Яаралтай нөхцөл үүсвэл шууд зогсоолын тоормос хэрэглэнэ.","Өгсөхдөө ашигласан араатайгаа ижил араагаар уруудах нь зөв.","Хөлийн тоормос болон хөдөлгүүрийн тоормосыг зохистой хослуулан хэрэглэнэ."],"a":"3, 4","imgs":[],"t":"문장형","e":"Уруудах замд автомашины их биеийн ачаалал болон инерцийн хүчнээс болж хөлийн тоормост хэт их даралт үзүүлж болзошгүй тул заавал доод араа (хөдөлгүүрийн тоормос) ашиглан хөлийн тоормосны даралтыг бууруулж жолоодох ёстой."},{"n":432,"b":"Өвлийн улиралд зам мөстсөн үед аюулгүй жолоодох талаар хамгийн тохиромжгүй тайлбар аль нь вэ?","c":["Өвлийн улиралд замд гарахаас өмнө цаг агаар болон замын хөдөлгөөний мэдээллийг урьдчилан шалгана.","Мөстөх эрсдэл өндөртэй хонгил, гүүрийн хэсгээр илүү анхааралтай явна.","Хонгил, гүүр орчимд цас орохын өмнө болон дараа цас хайлуулах бодис цацсан бол ердийн хурдны хязгаараар хэвийн явж болно.","Зарим аймаг, нийслэлийн цагдаагийн газар шийдвэрээрээ цастай, мөстэй замд өвлийн тоноглол ашиглахыг журамчилсан байдаг."],"a":"3","imgs":[],"t":"문장형","e":"① Цаг агаарын мэдээлэл, замын хөдөлгөөний нөхцөл байдлын талаарх замын мөстөлтийн мэдээллээр дамжуулан аюулгүй жолоодох шаардлагатай. ③ Мөс хайлуулах бодис цацсаны дараа хайлсан цас орж буй цас, давсны уусмал зэрэгтэй хамт дахин хөлдөх эрсдэлтэй тул хурдаа бууруулж жолоодох ёстой."},{"n":433,"b":"Нүхэн эвдрэл (Pothole)-ийн талаар зөв тайлбар аль нь вэ?","c":["Нүхэн эвдрэл нь зуны аадар бороо зэрэг шалтгаанаар амархан үүсдэг.","Нүхэн эвдрэлээс үүдэх хохирлоос сэргийлэхийн тулд хурдыг нэмэгдүүлнэ.","Замын гадаргуугийн температур нэмэгдсэн үед явган хүний гарц орчимд том оврын ачааны автомашин огцом тоормослосноос үүсдэг.","Зам хуурай үед нүхэн эвдрэл амархан харагддаг тул дээгүүр нь шууд гарсан ч болно."],"a":"1","imgs":[],"t":"문장형","e":"Замын цоорхой (нүх) гэдэг нь борооны усаар хөрс сулран, ан цав үүссэн байдалд тээврийн хэрэгслийн байнгын хөдөлгөөнөөс асфальтын гадаргуу хуурч замд нүх үүсэх үзэгдлийг хэлнэ."},{"n":434,"b":"Аадар борооны үед аюулгүй жолоодох аргын талаар хамгийн хамааралгүй нь аль вэ?","c":["Урд гэрэл болон арын гэрлээ асааж явна.","Халаагуурыг дотоод агаарын эргэлтийн горимд ажиллуулна.","Халтиргаанаас урьдчилан сэргийлэхийн тулд дугуйн элэгдлийг шалгана.","Бороотой замд аюулгүйн зайг 2 дахин буюу түүнээс ихээр авна."],"a":"2","imgs":[],"t":"문장형","e":"Халаагуур эсвэл агааржуулагчийг дотоод агаарын эргэлтийн горимоор ажиллуулбал автомашины доторх шил манарах нь хүндэрч болзошгүй тул гадаад агаар оруулах горимоор ажиллуулна."},{"n":435,"b":"Хүчтэй салхи, аадар бороотой хар салхины үед замаар явж байхдаа жолоочийн авах арга хэмжээний талаар буруу нь аль вэ?","c":["Тоормосны зай ердийн үеэс урт болдог тул урд автомашинтайгаа ердийн үеэс 2 дахин буюу түүнээс их зай барина.","Усанд автсан хэсгээр гарахдаа дунд нь зогсолгүйгээр шууд нэвтрэх нь зүйтэй.","Автомашинаа зогсоолд тавихдаа гол, мөрний эрэг зэрэг үерт автах эрсдэлтэй газраас зайлсхийнэ.","Хашааны хананы дэргэд эсвэл том самбарын доор автомашинаа зогсоолд тавих нь аюулгүй."],"a":"4","imgs":[],"t":"문장형","e":"Тоормосны зай уртсах тул урд явж буй автомашинтай зайгаа ердийнхөөс 2 дахин ба түүнээс их хадгалж шүргэлцэх ослоос сэргийлнэ. Усанд автсан бүсээр өнгөрөхдөө дундаа зогсвол дуу намсгагч руу борооны ус орж хөдөлгүүр унтрах магадлалтай тул аль болох зогсолгүй өнгөрөх нь зүйтэй. Автомашиныг зогсоолд тавихдаа усанд автах эрсдэл өндөр голын эрэг, горхины ойролцоо зэрэг газраас зайлсхийж, аль болох өндөрлөг газар тавих нь зүйтэй. Нурах эрсдэлтэй хашааны хананы хажууд эсвэл том самбарын доор зогсоолд тавих нь ч аюултай байж болох тул зайлсхийнэ. Усанд автахаар таамаглагдаж буй барилгын газар доорх зогсоолд тавьсан автомашиныг аюулгүй газар руу шилжүүлнэ."},{"n":436,"b":"Цастай замаар жолоодох талаар буруу нь аль вэ?","c":["Жолоочийн харагдах орчныг хангахын тулд зөвхөн урд шилэн дээрх цасыг цэвэрлээд явахад аюулгүй.","Хөлийн тоормос болон хөдөлгүүрийн тоормосыг хамт хэрэглэнэ.","Цасны гинж суурилуулсан бол цагт 30 км-ээс ихгүй хурдтай явах нь аюулгүй.","Ердийн үеэс хангалттай аюулгүйн зай барин явна."],"a":"1","imgs":[],"t":"문장형","e":"Автомашины бүх хэсэгт хуримтлагдсан цасыг цэвэрлээд жолоодож байж аюулгүй. Ялангуяа урд капотын хэсгийн цас харагдах орчинг халхлах тохиолдол гарах эрсдэлтэй тул урд хэсгийн цасыг арилгаж жолоодох нь илүү чухал."},{"n":437,"b":"Дараахын аль нь бороотой үед аюулгүй жолоодох арга биш вэ?","c":["Нөхцөл байдлаас шалтгаалан хязгаарлагдсан хурдаас ойролцоогоор 50 хувиар бууруулж жолоодно.","Явган зорчигч руу ус цацруулахгүй байхаар зохих зайтай явна.","Бороо орж эхэлсэн үед хааз болон тоормосны дөрөөг гишгэхгүйгээр автомашины аажмаар өнхөрөх крийп (Creep) төлөвөөр явуу лах нь сайн биш.","Өдрийн цагаар ч арын гэрэл болон урд гэрлээ асаан явах нь зүйтэй."],"a":"3","imgs":[],"t":"문장형","e":"① Нөхцөл байдлаас хамааран борооны замд хурдны дээд хязгаараас 20 хувь, аадар бороо зэргээс болж харагдах зай 100 метрийн дотор байгаа тохиолдолд 50 хувь ба түүнээс дээш хурдаа бууруулж жолоодно. ② Замаар явж буй явган зорчигч руу ус үсэргэхгүйн тулд 1 метр ба түүнээс дээш зай барьж явна. ③ Бороо орж эхлэх үед замын гадаргуугийн тоос, бохирдол зэрэг борооны устай холилдсоноос үүсэх хальтиргаанаас сэргийлэхийн тулд хурдасгуур болон тоормосны дөрөөг гишгээгүй байдалд дугуй өөрөө өнхрөх мөлхөх горимоор жолоодох нь зүйтэй. ④ Өдрийн цагаар жолоодох үед ч оврын гэрэл болон их гэрлийг асааж жолоодох нь зүйтэй."},{"n":438,"b":"Дараахын аль нь манантай замаар явах үеийн зөв жолоодлогын аргаас хамгийн хол вэ?","c":["Арын автомашинд өөрийн байрлалыг мэдэгдэхийн тулд оворын гэрэл, арын гэрэл, урд гэрлээ асаана.","Урд автомашинд өөрийн байрлалыг мэдэгдэхийн тулд заавал холын тусгалтай гэрлээ асаана.","Аюулгүйн зайгаа барьж, хурдыг бууруулна.","Чийг тогтсон бол шил арчигчийг ажиллуулж харагдах орчноо хангана."],"a":"2","imgs":[],"t":"문장형","e":"Холын гэрэл манан доторх усны хэсгүүдээс болж сарнидаг тул асаахгүй, ойрын гэрэл эсвэл манангийн гэрлийг асаана."},{"n":439,"b":"Замын хөдөлгөөний тухай хуулийн дагуу нэг чиглэлийн 2 эгнээтэй автомашины зориулалтын замд бороо орж зам норсон үед хурд сааруулан явах хурд аль нь вэ?","c":["Цагт 80 километр","Цагт 90 километр","Цагт 72 километр","Цагт 100 километр"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйл (Автомашин зэргийн хурд) ② Бороо, манан, цас зэргээс үүдсэн цаг агаарын таагүй нөхцөлд 1 дэх хэсгийг үл харгалзан дараах заалт бүрийн стандартын дагуу хурдаа бууруулж жолоодох ёстой."},{"n":440,"b":"Явж байх үед аянга буухад аюулгүй жолоодох арга 2 нь аль вэ?","c":["Автомашинаа том модны доор түр зогсооно.","Автомашины цонхоо хааж, автомашин дотороо хэвээр байна.","Байшингийн ханын дагуу ус норсон гадаргуугаар цахилгаан дамжиж болзошгүй тул ойртохоос зайлсхийнэ.","Аянга автомашинд тусвал маш аюултай тул автомашинаас гарч зугтана."],"a":"2, 3","imgs":[],"t":"문장형","e":"Том мод аянгад цохиулах магадлал өндөр бөгөөд тэгвэл мод унаж осол гарах магадлал өндөр тул зайлсхийх нь зүйтэй ба хэдийгээр автомашинд аянга буусан ч автомашины дотор нь гаднаас илүү аюулгүй."},{"n":441,"b":"Дараахын аль нь зам тээврийн осол гарсан үед хамгийн зөв үйлдэл вэ?","c":["Ослын нөхцөл байдлыг илэрхийлэхийн тулд аюулын дохионы гэрэл асааж, тээшний хэсгийг онгойлгох шаардлагагүй.","Осол болсон зам дээр ослын зургийг авч, автомашиндаа хүлээнэ.","Осол болсон газраас гарах шаардлагагүйгээр автомашиндаа хүлээнэ.","Автомашины гадна аюулгүй газар гарч, ойролцоох гэрлийн шон, гэрлэн дохион дээрх суурь дугаарын пайзыг харж ослын байршлыг илүү тодорхойлон 119, 112-т мэдэгдэнэ."],"a":"4","imgs":[],"t":"문장형","e":"④ Замын нэрийн хаягийн тухай хуулийн 9 дүгээр зүйл (Замын нэрийн самбар болон суурь дугаарын самбар байрлуулах)-ийн 1 дэх хэсэг - Тусгай өөрөө удирдах хотын захирагч, тусгай өөрөө удирдах аймгийн засаг дарга болон хот, сум, дүүргийн дарга нар замын нэрийн хаягийг заах эсвэл аврах, яаралтай тусламжийн үйл ажиллагааг дэмжихэд шаардлагатай газарт замын нэрийн самбар болон суурь дугаарын самбарыг байрлуулах ёстой."},{"n":442,"b":"Шөнийн цагаар эсрэг талаас ирж буй автомашины урд гэрлийн хурц гэрлээс нүд гялбахгүй байх зөв арга аль нь вэ?","c":["Урд гэрэл рүү шууд харахгүй, өөрийн эгнээний яг доош хэсэг рүү харна.","Урд гэрэл рүү шууд харахгүй, замын баруун зах руу харна.","Нүдээ жоохон онийлгон өөрийн эгнээний яг доош хэсэг рүү харна.","Нүдээ жоохон онийлгон замын зүүн зах руу харна."],"a":"2","imgs":[],"t":"문장형","e":"Эсрэг урсгалын тээврийн хэрэгслийн их гэрлээс болж нүд гялбах тохиолдолд их гэрлийн гэрлийг шууд харалгүй, замын баруун захын зүг рүү харж жолоодох нь зүйтэй."},{"n":443,"b":"Замын хөдөлгөөний тухай хуулийн дагуу шөнө хурдны зам зэрэгт автомашин эвдэрч цааш явах боломжгүй болсон үед жолоочийн авах арга хэмжээний талаар буруу нь аль вэ?","c":["Дөрвөн талаас 500 метрийн зайнаас танигдах улаан анивчдаг дохио, цахилгаан гэрэл эсвэл галын дохио байрлуулах ёстой.","Тэмдэг байрлуулахдаа араас ирэх жолооч харах боломжтой байрлалд байрлуулна.","Хурдны зам зэрэг биш өөр газар руу шилжүүлэх зэрэг шаардлагатай арга хэмжээ авна.","Аюулгүйн гурвалжинг эвдэрсэн автомашинаас яг 200 метрийн ард заавал байрлуулах ёстой."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 66 дугаар зүйл, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 40 дүгээр зүйл Эвдэрсэн автомашины тэмдэглэгээ"},{"n":444,"b":"Замын хөдөлгөөний тухай хуулийн дагуу бизнесийн бус зориулалттай суудлын автомашины жолооч урд гэрэл, оворын гэрэл, арын гэрэл, улсын дугаарын гэрлийг бүгдийг нь асаах ёстой тохиолдол аль нь вэ?","c":["Шөнийн цагаар зам дээр түр зогссон үед","Манантай зам дээр түр зогссон үед","Зогсоолын журам зөрчсөний улмаас чирэгдэж байгаа автомашин","Хонгил доторх замаар явж байгаа үед"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 37 дугаар зүйл (Тээврийн хэрэгсэл болон трамвайн гэрэл) ① Бүх тээврийн хэрэгслийн жолооч дараах заалтын аль нэгэнд хамаарах тохиолдолд Ерөнхийлөгчийн зарлигаар тогтоосны дагуу их гэрэл, оврын гэрэл, арын гэрэл болон бусад гэрлийг асаах ёстой."},{"n":445,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хурдны зам дээр автомашин эвдэрсэн үед авах зөв арга хэмжээ аль нь вэ?","c":["Ослын дохионы гэрлийг шуурхай асааж, автомашинаа зам дээр зогсоон даатгалын компанид мэдэгдэнэ.","Тээшний хэсгийг онгойлгож эвдрэлээ хурдан шалгаад чирэгч автомашин дуудна.","Хөдөлгөх боломжгүй бол эвдэрсэн автомашины урд 500 метрийн зайд аюулгүйн гурвалжин байрлуулна.","Хөдөлгөх боломжтой бол ослын дохионы гэрлээ асааж, замын захад зогсоогоод аюулгүй газар шилжинэ."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 66 дугаар зүйл (Эвдрэл зэргийн үед авах арга хэмжээ), 67 дугаар зүйл (Хурдны зам зэрэгт жолоочийн дагаж мөрдөх зүйл), Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 40 дүгээр зүйл (Эвдэрсэн автомашины тэмдэг): эвдэрсэн автомашиныг шилжүүлэх боломжтой бол замын зах руу шилжүүлж, аюулгүй газраас тусламж хүснэ."},{"n":446,"b":"Явж байх үед дугуй хагарахаас урьдчилан сэргийлэх болон авах арга хэмжээний талаар буруу нь аль вэ?","c":["Замтай хүрэлцэж буй дугуйн гадаргууд хадаас зэрэг зүйл шигдсэн эсэхийг тогтмол шалгана.","Дугуйн агаарын даралтыг тогтмол хэвийн хэмжээнд барьж, хээний элэгдэл зөвшөөрөгдөх хэмжээнээс хэтэрсэн эсэхийг шалгана.","Жолооны хүрд нэг тал руу татаж байвал арын дугуй хагарсан байх магадлал өндөр.","Жолооны хүрдийг шулуун барьж, одоогийн араагаар хөдөлгүүрийн тоормос ашиглан хурдыг бууруулна."],"a":"3","imgs":[],"t":"문장형","e":"Жолоо нэг тал руу татагдах тохиолдолд урд дугуй хагарсан байх магадлал өндөр тул хөлийн тоормос гишгэвэл замналаасаа гарах магадлал өндөр."},{"n":447,"b":"Замын хөдөлгөөний тухай хуулийн дагуу шөнө хурдны зам дээр автомашин эвдэрч явах боломжгүй болсон үед аюулгүйн гурвалжин ба түүнтэй хамт нэмэлтээр ( )-ээс танигдах галын дохио зэргийг нэмж байрлуулах ёстой. ( )-д тохирох нь аль вэ?","c":["Дөрвөн талаас 200 метр","Дөрвөн талаас 300 метр","Дөрвөн талаас 400 метр","Дөрвөн талаас 500 метр"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 40 дүгээр зүйл (Эвдэрсэн автомашины тэмдэг)-ийн дагуу шөнийн цагаар хурдны замд аюулгүйн гурвалжин тэмдгийн хамт 500 метрийн зайнаас бүх зүгээс ялгаж харагдах улаан өнгийн анивчих дохио, цахилгаан дэнлүү эсвэл галт дохиог нэмж байрлуулах ёстой."},{"n":448,"b":"Автомашин явж байх үед дугуй хагарвал хамгийн зөв арга хэмжээ аль нь вэ?","c":["Нэг тийш хүчтэй татвал ослоос сэргийлэхийн тулд огцом тоормослоно.","Жолооны хүрдийг чанга барьж чигээрээ яван, огцом тоормослохоос зайлсхийж, хөдөлгүүрийн тоормос ашиглан аюулгүй газар зогсоно.","Автомашин татаж буй чиглэл рүү жолооны хүрдийг эргүүлнэ.","Тоормосны дөрөө ажиллахгүй тул зогсоолын тоормос ашиглан зогсоно."],"a":"2","imgs":[],"t":"문장형","e":"Дугуй хагарвал огцом тоормослохоос зайлсхийж, автомашиныг чигээрээ явуулж, хөдөлгүүрийн тоормосыг ашиглан аюулгүй газарт зогсооно."},{"n":449,"b":"Хурдны зам дээр зам тээврийн осол гарсан үед хоёрдогч ослоос урьдчилан сэргийлэх хамгийн зөв арга хэмжээ аль нь вэ?","c":["Даатгалын асуудалд ашиглахын тулд юуны өмнө нотлох баримтын зураг авна.","Нөгөө жолооч буруутай болохыг тодорхой болгож, даатгал хэрэглэхийг шаардана.","Автомашинаа замын баруун захад зогсоож, захиргаа, аюулгүй байдлын яамны журмын дагуу тэмдэг байрлуулах ёстой.","Ослын дохионы гэрлээ асаагаад автомашин дотроос холбогдох байгууллагад мэдэгдэнэ."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 67 дугаар зүйл (Хурдны зам зэрэгт жолоочийн дагаж мөрдөх зүйл) ② Хурдны зам зэргээр явж буй автомашины жолооч замын хөдөлгөөний аюулгүй байдал, саадгүй нэвтрэлтийг хангахын тулд 66 дугаар зүйлд заасан эвдэрсэн автомашины тэмдгийг байнга авч явах бөгөөд эвдрэл эсвэл бусад аргагүй шалтгаанаар автомашиныг жолоодох боломжгүй болсон үед автомашиныг замын баруун захад зогсоож, Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосны дагуу тухайн тэмдгийг байрлуулах ёстой."},{"n":450,"b":"Дараахын аль нь хурдны замын засварын хэсгийн талаар буруу тайлбар вэ?","c":["Эгнээ хаасан засварын үед түгжрэл үүсч болзошгүй тул анхаарах хэрэгтэй.","Ачааны автомашины хувьд хормын төдий нойрмоглох, урд замаа анхаарахгүй байх нь томоохон осолд хүргэж болзошгүй.","Хөдөлгөөнт засвар, суурин засвар зэрэг олон төрлийн засварын ажил хийгддэг.","Хурдны хязгаар нь зөвхөн цагт 80 километрээр тогтоогддог."],"a":"4","imgs":[],"t":"문장형","e":"Барилгын ажлын бүсийн хувьд хэсэг тус бүрээр цагт 80 километр болон цагт 60 километрээр хязгаарласан байдаг тул хурдны хязгаарлалтын тэмдгийг таньж, хурдаа хангалттай бууруулж жолоодох ёстой. (Газар нутаг, дэд бүтэц, тээврийн яамны замын барилгын талбайн замын хөдөлгөөний удирдлагын заавар, хурдны замын барилгын талбайн замын хөдөлгөөний удирдлагын стандарт)"},{"n":451,"b":"Дараахын аль нь Hi-pass төхөөрөмж эвдэрч Hi-pass танигдаагүй тохиолдолд авах зөв арга хэмжээ 2 вэ?","c":["Ослын дохионы гэрлээ асааж, түр зогссоны дараа ердийн эгнээгээр нэвтрэх тасалбар авна.","Очих газрын төлбөр авах цэг дээр тооцоо хариуцсан ажилтанд орсон цэгээ тайлбарлаж төлбөрөө төлнө.","Очих газрын төлбөр авах цэгийн Hi-pass эгнээгээр нэвтрэхэд автоматаар төлбөр тооцогдоно.","Очих газрын төлбөр авах цэг дээр Hi-pass төхөөрөмжийн картыг салгаж, уг картаар төлбөрөө тооцоо хариуцсан ажилтанд төлж болно."],"a":"2, 4","imgs":[],"t":"문장형","e":"Очих газрын төлбөрийн цэгт тооцоо хариуцсан ажилтанд орж ирсэн газраа тайлбарлаж тооцоо хийнэ."},{"n":452,"b":"Дараахын аль нь хонгил дотор гал гарсан үед жолоочийн хамгийн зөв үйлдэл вэ?","c":["Хулгайгаас сэргийлэхийн тулд автомашины хаалгаа түгжээд хонгилоос гарч нүүнэ.","Галын улмаас хонгил дотор утаагаар дүүрдэг тул автомашиндаа хүлээнэ.","Автомашины хөдөлгүүрийг унтрааж, автомашиныг шаардлагатай үед хөдөлгөх боломжтой байлгахын тулд түлхүүрийг нь залгаатай үлдээн хурдан бууж нүүнэ.","Буцаж эргээд гарцын эсрэг чиглэл рүү явна."],"a":"3","imgs":[],"t":"문장형","e":"Хонгил доторх гал түймрийн үед нүүлгэн шилжүүлэх нь хамгийн чухал тул аюулыг дутуу үнэлж автомашин дотор үлдэх нь аюултай үйлдэл бөгөөд хөдөлгүүрийг унтраасны дараа түлхүүрийг хэвээр нь үлдээгээд шуурхай буун нүүлгэн шилжих ёстой."},{"n":453,"b":"Дараахын аль нь хонгилоор нэвтрэх үед жолоочийн аюулгүй жолоодлогын аргаас хамгийн буруу вэ?","c":["Хонгилд орохын өмнө гэрэлд дасан зохицох үзэгдэлд бэлтгэж нарны шилээ авч, шөнийн үеийн адил гэрлээ асаана.","Хонгил доторх эгнээ цагаан үргэлжилсэн шугамтай бол эгнээгээ солихгүйгээр хонгилоор гарна.","Урд автомашинтай аюулгүйн зайгаа хадгалж, огцом тоормослоход бэлэн байна.","Хонгилд орохын өмнө үүдэнд байрлуулсан замын мэдээллийн самбарыг шалгана."],"a":"1","imgs":[],"t":"문장형","e":"Харанхуйд дасах (гэрэлтэй газраас харанхуй газарт орох үед эхэндээ харагдаагүй зүйл хугацаа өнгөрөхөд харагдаж эхлэх үзэгдэл) болон гэрэлд дасах (харанхуй газраас гэрэлтэй газарт гарах үед аажмаар хурц гэрэлд дасах үзэгдэл)-аас үүдэх ослоос сэргийлэхийн тулд хонгилоор явахдаа ердийнхөөс 10~20% хурдаа бууруулж, их гэрэл, оврын гэрэл, арын гэрэл зэрэг гэрлийг заавал асаах ёстой. Мөн мөстөлт болон хоёрдогч осол зэргээс сэргийлэхийн тулд ердийн замаас илүү аюулгүй зайг хангаж, огцом тоормослоход бэлтгэх шаардлагатай."},{"n":454,"b":"Дараах нь автомашин жолоодож байх үеийн онцгой нөхцөлд тоормостой холбоотой тайлбар юм. Зөв нь аль вэ?","c":["Халтиргаа үүсэх үед тоормосны үр нөлөө ердийн үеэс илүү болдог.","Яаралтай үед мөргөлдөөний энерги шингээх хамгаалалтын хаалт ашиглах нь томоохон ослоос урьдчилан сэргийлэх нэг арга юм.","Замын гадаргуу чийгтэй үед огцом тоормословол автомашин үргэлж урагшаа чиглэлд халтирна.","ABS (Дугуй түгжрэхээс хамгаалах тоормосны систем)-тай автомашины тоормосны зай нь ABS-гүй автомашинаас урт байдаг."],"a":"2","imgs":[],"t":"문장형","e":"① Тоормослох хүч буурна. ③ Нэг талын тоормослолтоос болж хажуу тийш хальтирч болзошгүй. ④ ABS нь борооны замд төвөөс зугтах хүчийг бууруулж, тодорхой хурдад тоормосны зайг тодорхой хэмжээгээр багасгадаг."},{"n":455,"b":"Газар хөдлөлт болсон үед аюулгүй авах арга хэмжээ 2 нь аль вэ?","c":["Газар хөдлөлт болсон даруйд хурдан явж тухайн бүсээс гарна.","Тээврийн хэрэгсэл хоорондын зайг хангалттай авч, замын баруун талд түр зогсоно.","Автомашинаа орхиод нүүх шаардлагатай бол хөдөлгүүрийг нь унтраана.","Газар хөдлөлт болсон ч үргэлжлүүлэн явна."],"a":"2, 3","imgs":[],"t":"문장형","e":"Газар хөдлөлт болох үед автомашин жолоодох нь маш аюултай. Хангалттай болгоомжилж уулзвараас зайлсхийн замын баруун талд зогсоож, радиогийн мэдээллийг сайн сонсож, ойролцоо цагдаагийн ажилтан байвал зааврын дагуу үйлдэл хийнэ. Автомашиныг орхиж нүүлгэн шилжих тохиолдолд автомашины хөдөлгүүрийг унтрааж, түлхүүрийг хэвээр нь үлдээгээд нүүлгэн шилжинэ."},{"n":456,"b":"Хурдны замын засварын хэсгээр явах үед жолоочийн зөв жолоодлогын арга биш 2 нь аль вэ?","c":["Урд талын засварын хэсгийн нөхцөлд анхааран жолоодно.","Засварын хэсгийн хурдны хязгаарын тэмдэгт зааснаас илүү хурдтай явна.","Хүчээр эгнээ шахаж орох болон гүйцэж түрүүлэхгүй.","Замын хөдөлгөөнийг жигд байлгахын тулд засварын хэсэгт ойртохоос өмнө хурдаа тогтвортой хадгалан явна."],"a":"2, 4","imgs":[],"t":"문장형","e":"Барилгын ажлын хэсэгт замын хурдны дээд хязгаараас бага хурдаар хөдөлгөөнийг зохицуулдаг тул барилгын талбайд байрлуулсан хурдны дээд хязгаарын тэмдэгт заасан хурдад тохируулан хурдаа бууруулж жолоодох ёстой."},{"n":457,"b":"Автомашин жолоодож байх үед хонгил дотор гал гарсан бол авах зөв арга хэмжээ 2 нь аль вэ?","c":["Автомашинаас бууж нүүх бол хөдөлгүүрийг унтраагаад бууна.","Гал унтраагчаар гал унтраах бол салхийг нуруугаараа авч зогсоно.","Хонгилоос гарах боломжгүй бол автомашинаа аль болох төв шугамын зүг зогсооно.","Автомашинаа орхиод нүүх бол түлхүүрийг нь сугалж авч явна."],"a":"1, 2","imgs":[],"t":"문장형","e":"① Дэлбэрэлт зэрэг аюулаас сэргийлж хөдөлгүүрийг унтраах ёстой. ③ Хажуугийн ханын зүг рүү зогсоож байж яаралтай тусламжийн тээврийн хэрэгсэл зэрэг нэвтрэх боломжтой. ④ Автомашины түлхүүрийг хэвээр нь үлдээж байж өөр нөхцөл байдал үүссэн үед арга хэмжээ авах боломжтой."},{"n":458,"b":"Автомашин халтирдаг үзэгдлийн талаар зөв тайлбар 2 нь аль вэ?","c":["Өндөр хурдтай явж байх үед огцом тоормослох үед ихэвчлэн үүсдэг тул хурд хэтрүүлэх нь гол шалтгаан болдог.","Бороотой замд бага хурдтай явах үед ихэвчлэн үүсдэг.","Халтирснаас үлдсэн замын мөр нь ослын шалтгааныг тогтооход бараг тус болдоггүй.","Жолооны хүрдийг огцом эргүүлэх нь мөн халтиргааны шалтгаан болж болно."],"a":"1, 4","imgs":[],"t":"문장형","e":"② Өндөр хурдтай явах үед голчлон үүсдэг. ③ Хальтирсан үзэгдлээс үүссэн замын гадаргуугийн ул мөр нь ослыг шийдвэрлэхэд чухал баримт болдог."},{"n":459,"b":"Автомашин эгнээнээс гарах магадлал хамгийн өндөр байдаг 2 тохиолдол аль вэ?","c":["Өгсүүр замаар явж байх үед","Эргэлттэй замд жолооны хүрдийг огцом эргүүлэх үед","Уруу замаар явж байх үед","Замын гадаргуу халтиргаатай үед"],"a":"2, 4","imgs":[],"t":"문장형","e":"Автомашин эгнээнээсээ гарах тохиолдол нь муруй замд жолоог огцом эргүүлэх үед голчлон гардаг. Мөн дугуйн хээ элэгдсэн эсвэл дугуйн хийн даралт хэт өндөр, эсвэл замын гадаргуу хальтиргаатай бол замын гадаргуу болон дугуйн үрэлтийн хүч буурч автомашин замаас гарах эсвэл төвийн шугам давж болзошгүй."},{"n":460,"b":"Хурдны замаар явж байх үед хөдөлгүүрийн тасалгаанаас (капот) утаа гарч гал гарсан бол хамгийн зөв арга хэмжээ 2 нь аль вэ?","c":["Олж мэдмэгцээ тухайн газартаа шууд зогсоно.","Замын зах рүү шилжиж, хөдөлгүүрээ унтраагаад автомашинаас хурдан бууж аюулгүй газар нүүнэ.","Эхний шатанд унтраах боломжтой бол автомашинд байрлуулсан гал унтраагчийг ашиглана.","Эхний шатны унтраалт амжилтгүй бол 119 зэрэгт мэдэгдээд автомашины яг хажууд хүлээнэ."],"a":"2, 3","imgs":[],"t":"문장형","e":"Хурдны замаар явж байхад автомашинд гал гарсан үед авах арга хэмжээ 1. Автомашиныг замын зах руу шилжүүлнэ. 2. Хөдөлгүүрийг унтрааж автомашинаас түргэн бууна. 3. Галыг эхний үед унтраах боломжтой бол автомашинд байгаа гал унтраагуурыг ашиглан галыг унтраана. 4. Галыг эхний үед унтраах оролдлого амжилтгүй болсон үед автомашин дэлбэрч болзошгүй тул хол зайд нүүлгэн шилжинэ. 5. 119 зэрэгт автомашины галын тухай мэдэгдэнэ."},{"n":461,"b":"Замын засварын хэсгээр аюулгүй нэвтрэхийн тулд эгнээ солих шаардлагатай, эгнээ багасч эхэлдэг цэгийг юу гэдэг вэ?","c":["Анхааруулах хэсгийн эхлэл","Шилжилтийн хэсгийн эхлэл","Ажлын хэсгийн эхлэл","Дуусах хэсгийн эхлэл"],"a":"2","imgs":[],"t":"문장형","e":"Замын барилгын талбай нь анхааруулах - шилжилтийн - ажлын - төгсгөлийн хэсгээс бүрддэг. Үүнээс шилжилтийн хэсэг нь эгнээний тоо цөөрдөг хэсэг бөгөөд эгнээ солих шаардлагатай хэсэг юм. Аюулгүй нэвтрэхийн тулд урьдчилан эгнээ солих болон удаан явах нь зайлшгүй шаардлагатай."},{"n":462,"b":"Шөнийн жолоодлоготой холбоотой дараах тайлбаруудаас хамгийн зөв нь аль вэ?","c":["Урд шилэнд бараан хальс (тинт) наавал шөнө илүү өргөн харагдах орчинтой болно.","Цэлмэг өдөр өдрийн жолоодлогын үед тоормосны зай шөнийн үеэс урт байдаг.","Шөнө урд гэрлээс илүү манангийн гэрэл асааж явах нь урд харагдах орчинд илүү ашигтай.","Эсрэг талаас ирж буй автомашины гэрэл рүү шууд харвал алга болох үзэгдэл үүсдэг."],"a":"4","imgs":[],"t":"문장형","e":"Ууршилтын үзэгдлээс (гэрлийн гялбаанаас болж явган зорчигч зэрэг биет харагдахгүй болох үзэгдэл) сэргийлэхийн тулд эсрэг урсгалын тээврийн хэрэгслийн гэрлийг шууд харахгүй байна."},{"n":463,"b":"Шөнийн жолоодлогын үед гардаг алга болох үзэгдлийн талаар зөв тайлбар аль нь вэ?","c":["Алга болох үзэгдэл үүсэхэд автомашины урд гэрлийг шууд унтраавал үзэгдэл арилна.","Алга болох үзэгдэл нь эсрэг чиглэлээс ирж буй хоёр автомашин хоёулаа холын тусгалтай гэрэл асаасан үед ихэвчлэн үүсдэг.","Шөнө хотын түгжрэлтэй замаар явах үед ихэвчлэн үүсдэг.","Шөнө хонгилд ороход хурц гэрлийн улмаас түр зуур харагдахгүй болох үзэгдлийг хэлнэ."],"a":"2","imgs":[],"t":"문장형","e":"Ууршилтын үзэгдэл нь эсрэг чиглэлд ирж буй хоёр тээврийн хэрэгсэл хоёулаа холын гэрэлтэй үед үүсдэг."},{"n":464,"b":"Шөнийн жолоодлогын үед “жолоочийн сэрэмж буурсан жолоодлого”-ын талаар зөв тайлбар аль нь вэ?","c":["Ердийн үеэс танин мэдэх чадвар сайжирдаг.","Нүдний хөдөлгөөн харьцангуй идэвхтэй болдог.","Хотын түгжрэлтэй замаар явах үед ихэвчлэн үүсдэг.","Нэг хэвийн орчинд дасаж, нэг төрлийн мэдрэхүйн саажилтын байдалд орохыг хэлнэ."],"a":"4","imgs":[],"t":"문장형","e":"Шөнийн жолоодлого ба сэрэмж буурах: шөнийн жолоодлогын харах талбар их гэрлийн гэрэл тусах хүрээгээр хязгаарлагддаг тул өдрийнхтэй харьцуулахад зөвхөн замын гадаргуу болон урд явж буй тээврийн хэрэгслийн арын гэрлийн гэрэл л харагддаг учир маш нэг хэвийн харах талбар болдог. Тиймээс жолооч ухамсаргүйгээр нэг хэвийн харах талбарт дасан нэг төрлийн мэдрэхүйн мэдээгүй байдалд ордог. Тэгвэл зайлшгүй нүдний хөдөлгөөн идэвхгүй болж, өдөөлтөд үзүүлэх хариу үйлдэл ч удаашардаг. Энэ үзэгдэл даамжирвал булчин болон тархины долгионы хариу үйлдэл ч буурч аажмаар нойрмог байдалд хүрдэг. Ийнхүү сэрэмж буурсан байдалд жолоодохыг \"сэрэмж буурсан жолоодлого\" гэж нэрлэдэг."},{"n":465,"b":"Нар жаргаж харанхуй болж эхлэх үед жолоочийн авах арга хэмжээнээс хамгийн хамааралгүй нь аль вэ?","c":["Оворын гэрэл, арын гэрлээ асаана.","Өдрийн үеийн хурднаас удаан явна.","Нар жаргах үед нүд харанхуйд дасан зохицох хугацаа шаардлагатай тул анхааралтай байна.","Өдрийн үеэс илүү харагдах орчин сайжирдаг тул жолоодоход амар байдаг."],"a":"4","imgs":[],"t":"문장형","e":"Өдрийнхөөс харагдах орчин хангахад хэцүү болдог тул болгоомжлох шаардлагатай."},{"n":466,"b":"Дараахын аль нь цахилгаан автомашины цэнэглэх кабелийн холбогч (coupler)-ийн талаар буруу тайлбар вэ?","c":["Бусад цахилгааны холбогчоор орлуулах боломжгүй бүтэцтэй, туйл нь ялгаатай бөгөөд газардуулгын туйлтай байна.","Газардуулгын туйл нь холбох үед хамгийн сүүлд холбогдож, салгах үед хамгийн түрүүнд салдаг бүтэцтэй байна.","Санамсаргүйгээр ачаалал тасрахаас сэргийлэхийн тулд түгжээ эсвэл салгаж, угсрах механик төхөөрөмжтэй байна.","Цахилгаан автомашины холбогчийг автомашины холболтын залгуураас салгах үед цэнэглэх кабелийн тэжээлийг таслах интерлок (interlock) функцтэй байна."],"a":"2","imgs":[],"t":"문장형","e":"Солонгосын цахилгаан байгууламжийн журам (KEC) 241.17 Цахилгаан автомашины тэжээлийн байгууламж: газардуулгын туйл нь залгах үед хамгийн түрүүнд холбогдож, салгах үед хамгийн сүүлд салдаг бүтэцтэй байна."},{"n":467,"b":"Автомашины гал түймрээс урьдчилан сэргийлэх хамгийн зөв арга аль нь вэ?","c":["Автомашин дотор өсгөгч (амп) суурилуулахын тулд цахилгааны утсыг дур мэдэн өөрчилнө.","Өвлийн улиралд шатахуун хийхдээ статик цахилгаан үүсэхээс болгоомжилно.","LPG (Шингэрүүлсэн нефтийн хий) автомашинд яаралтай үед ашиглах зорилгоор нэг удаагийн бутан хийн баллон авч явна.","Нэг удаагийн асаагуурыг зуны улиралд автомашин дотор үлдээсэн ч болно."],"a":"2","imgs":[],"t":"문장형","e":"Цахилгааны утсыг дур мэдэн өөрчилж болохгүй бөгөөд автомашин дотор нэг удаагийн бутан хий байлгах нь аюултай. Нэг удаагийн асаагуурт дэлбэрэлтээс хамгаалах төхөөрөмж байдаггүй тул зуны улиралд автомашин дотор үлдээвэл аюултай."},{"n":468,"b":"Урд яваа автомашин огцом тоормослосны улмаас мөргөлдөх эрсдэлтэй болсон үед хамгийн зөв арга хэмжээ аль нь вэ?","c":["Мөргөлдөхийн өмнөх сүүлийн мөч хүртэл бууж өгөхгүйгээр тоормосны дөрөөг гишгэж хурдыг бууруулна.","Урд автомашинтай мөргөлдөхөөс зайлсхийхийн тулд жолооны хүрдийг огцом зүүн тийш эргүүлэн төв шугам давна.","Хохирлыг багасгахын тулд нүдээ анина.","Шил арчигч болон холын тусгалтай гэрлийг зэрэг ажиллуулна."],"a":"1","imgs":[],"t":"문장형","e":"Урд явж буй тээврийн хэрэгслийн ард мөргөхөөс сэргийлэхийн тулд аюулгүй зайг хангалттай хангаж, аюулд бэлтгэн хэзээ ч тоормослох боломжтой байхаар бэлтгэнэ. Аргагүй мөргөх тохиолдолд бэлтгэн тоормосны дөрөөг хүчтэй гишгэж хурдаа бууруулан хохирлыг хамгийн бага болгоно. Жолоог огцом зүүн тийш эргүүлж төвийн шугам давбал эсрэг урсгалаар явж буй тээврийн хэрэгсэлтэй осол гарч болзошгүй. Мөн нүдээ аних болон шил арчигч, холын гэрлийг ажиллуулах нь мөргөлдөөний хохирлыг багасгахтай хамааралгүй."},{"n":469,"b":"Дараахын аль нь өндөр хурдтай явж буй автомашины дугуйн гэмтлээс үүсдэг үзэгдэл 2 вэ?","c":["Вейпор лок үзэгдэл","Стэндинг вэйв үзэгдэл","Фэйд үзэгдэл","Хайдроплэйнинг үзэгдэл"],"a":"2, 4","imgs":[],"t":"문장형","e":"Өндөр хурдтай явж буй автомашины дугуйн хийн даралт дутуу бол зогсонги долгионы үзэгдэл үүсэх ба өндөр хурдтай явж буй автомашины дугуй элэгдсэн байдалд ус тогтсон газраар өнгөрвөл усан хальсны үзэгдэл үүсдэг. Тоормос сулрах үзэгдэл гэдэг нь тоормосны дөрөөг хэт их ашигласан үед наклад болон тоормосны туузны үрэлтийн коэффициент буурч тоормослох хүч муудан хальтрах үзэгдлийг хэлнэ. Уурын түгжрэл болон тоормос сулрах үзэгдэл нь тоормосны системийн гэмтлээс илэрдэг үзэгдэл юм."},{"n":470,"b":"Замын хөдөлгөөний тухай хуулийн дагуу суудлын хамгаалах бүс хэрэглэх талаар зөв тайлбар аль нь вэ?","c":["Суудлын хамгаалах бүсийг бүсэлхийнээс дээш байрлуулж бэхэлнэ.","Гал унтраахаар үүрэг гүйцэтгэж яваа гал сөнөөгч суудлын хамгаалах бүс зүүхгүй байж болно.","Хүүхдийг урд суудалд суулгаж хамгаалах бүс зүүлгэх нь хамгийн аюулгүй.","13-аас доош насны хүүхдэд суудлын хамгаалах бүс зүүлгээгүй бол 30,000 воны торгууль ногдуулна."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 6, хамт зорчигч нь 13 нас хүрээгүй бол захиргааны торгууль 60,000 вон, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 31 дүгээр зүйл (Суудлын хамгаалах бүс хэрэглэхгүй байх шалтгаан)-ийн 4 дэх заалт: тусгай зориулалтын тээврийн хэрэгсэл өөрийн үндсэн зориулалтаар явж байгаа үед"},{"n":471,"b":"Зам тээврийн ослын үед толгой, хүзүүний гэмтлийг багасгахын тулд хөдөлгөөн эхлэхээс өмнө юуг тохируулах ёстой вэ?","c":["Суудлын урд, хойд байрлал","Суудлын түшлэгийн өнцөг","Толгой түшигчийн өндөр","Суудлын өндөр"],"a":"3","imgs":[],"t":"문장형","e":"Жолооч нарын хувьд суудлаа тохируулахдаа толгойн тулгуурыг тохируулах тохиолдол тийм ч олон биш. Иймд зам тээврийн ослын цохилтын үед толгойг тогтоож өгөх толгойн тулгуурыг ч өөрийн толгойд тохируулах шаардлагатай."},{"n":472,"b":"Хонгилд аюулгүй жолоодлоготой холбоотой зөв тайлбар аль нь вэ?","c":["Гүйцэж түрүүлэхдээ зүүн чиг заах дохио өгч зүүн талаар гүйцэж түрүүлнэ.","Хонгил дотор урд автомашинтай зайгаа зөв мэдрэх чадвар буурдаг.","Хонгилд орох үед гэрэлд дасан зохицох үзэгдлийг анхаарах хэрэгтэй.","Хонгилоос гарах үед харанхуйд дасан зохицох үзэгдэл үүсдэг."],"a":"2","imgs":[],"t":"문장형","e":"Уулзвар, гүүрэн дээр, хонгил дотор зэрэг нь гүйцэж түрүүлэхийг хориглосон газар бөгөөд хонгилд орох үед харанхуйд дасах үзэгдэл үүсэх ба цагаан тасархай шугамын замын гадаргуугийн тэмдэглэгээтэй тохиолдолд эгнээ солих боломжтой."},{"n":473,"b":"Дараах нь чиглэлээ өөрчлөх үед өгөх дохионы талаар юм. Хамгийн тохирох нь аль вэ?","c":["Дохио өгөхгүйгээр чиглэлээ өөрчилсөн ч бусад хөдөлгөөнд саад болоогүй бол замын хөдөлгөөний дүрэм зөрчсөнд тооцохгүй.","Чиглэлээ өөрчилж дууссаны дараа ч тодорхой хугацаанд дохиогоо үргэлжлүүлэн өгнө.","Чиглэлээ өөрчлөхдөө дохио өгөөгүй бол суудлын автомашин болон олон суудалт автомашинд 30,000 воны зөрчлийн торгууль ногдуулна.","Хурдны зам дээр чиглэлээ өөрчлөхдөө өөрчлөх цэгээс 30 метрийн өмнөөс эхлэн чиглэлээ өөрчилж дуусах хүртэл дохио өгнө."],"a":"3","imgs":[],"t":"문장형","e":"① Дохио өгөлгүй чиглэлээ өөрчлөх үед бусад хөдөлгөөнд саад учруулаагүй байсан ч дохио өгөөгүй гэх замын хөдөлгөөний дүрмийн зөрчилд тооцогдоно. ② Чиглэл өөрчилж дууссаны дараа дохиог шууд зогсоох ёстой. ③ Чиглэл өөрчлөх үед дохио өгөхгүй бол суудлын автомашин болон олон суудалт автомашин зэрэг 30,000 воны зөрчлийн торгуульд тооцогдоно. ④ Хурдны замд чиглэл өөрчлөх үед 100 метрийн өмнөх цэгээс эхлэн чиглэл өөрчилж дуустал дохио өгнө."},{"n":474,"b":"Гүйцэж түрүүлэхийг зөвшөөрсөн тохиолдол аль нь вэ?","c":["Урд автомашин өөр автомашиныг гүйцэж түрүүлж байгаа үед","Урд автомашин аюулаас сэргийлэхийн тулд зогссон эсвэл удаан явж байгаа үед","Урд автомашины зүүн талд өөр автомашин урд автомашинтай зэрэгцэн явж байгаа үед","Урд автомашин бага хурдтай явж, бусад автомашинтай аюулгүйн зайгаа хадгалж байгаа үед"],"a":"4","imgs":[],"t":"문장형","e":"Бүх тээврийн хэрэгслийн жолооч урд явж буй тээврийн хэрэгслийн зүүн талд өөр тээврийн хэрэгсэл түүнтэй зэрэгцэн явж байгаа тохиолдолд, урд явж буй тээврийн хэрэгсэл өөр тээврийн хэрэгслийг гүйцэж түрүүлж байгаа эсвэл гүйцэж түрүүлэх гэж байгаа тохиолдолд урд явж буй тээврийн хэрэгслийг гүйцэж түрүүлж болохгүй. (Замын хөдөлгөөний тухай хуулийн 21 дүгээр зүйл, 22 дугаар зүйл)"},{"n":475,"b":"Дараах нь өөр автомашиныг гүйцэж түрүүлэх гэж буй автомашины хурдны талаар тайлбар юм. Зөв нь аль вэ?","c":["Өөр автомашиныг гүйцэж түрүүлэх үед хурдны хязгаар байхгүй.","Тухайн замын хуульд заасан хамгийн дээд хурдны 50 хувиар илүү хурд хүртэл зөвшөөрөгдөнө.","Жолоочийн ур чадвараас хамааран ямар ч хязгааргүйгээр боломжтой.","Тухайн замын хамгийн дээд хурдны дотор л гүйцэж түрүүлэх боломжтой."],"a":"4","imgs":[],"t":"문장형","e":"Өөр тээврийн хэрэгслийг гүйцэж түрүүлэх гэж буй автомашины хурд нь тухайн замын дээд хурдны хязгаарын дотор л байж гүйцэж түрүүлэх боломжтой."},{"n":476,"b":"Хурдны зам дээр ослоос урьдчилан сэргийлэхийн тулд түр зогсох болон зогсоолд тавихыг хориглодог. Үүний талаар буруу тайлбар аль нь вэ?","c":["Гал унтраах автомашин нь иргэдийн аюулгүй байдлын ажиллагаа явуулахын тулд түр зогсох эсвэл зогсоолд тавьж болно.","Цагдаагийн албан хаагчийн зааврыг дагах эсвэл аюулаас урьдчилан сэргийлэхийн тулд түр зогсох эсвэл зогсоолд тавьж болно.","Энгийн автомашин нь төлбөр төлөхийн тулд төлбөр авах цэг дээр түр зогсож болно.","Хонгил доторх яаралтай зогсоолыг зөвхөн гал унтраах автомашин болон цагдаагийн тусгай зориулалтын тээврийн хэрэгсэл түр зогсох эсвэл зогсоолд тавьж болно."],"a":"4","imgs":[],"t":"문장형","e":"Яаралтай зогсоолд цагдаагийн тусгай зориулалтын тээврийн хэрэгсэл болон гал унтраах машинаас гадна ердийн автомашин ч зогсох эсвэл зогсоолд тавьж болно."},{"n":477,"b":"Дараахын аль нь автомашины жолооч аюул мэдэрч тоормосны дөрөө гишгээд бодитоор зогсох хүртэлх зогсох зай хамгийн урт болох 2 тохиолдол вэ?","c":["Автомашины жин харьцангуй хөнгөн үед","Автомашины хурд харьцангуй өндөр үед","Дугуйг шинээр худалдан авч суурилуулсны дараахан","Хэт ядарсан болон согтуугаар жолоо барьж байгаа үед"],"a":"2, 4","imgs":[],"t":"문장형","e":"Жолооч аюулыг мэдэрч, тоормосны дөрөөг гишгэснээр автомашин бодитоор зогсох хүртэлх автомашины зогсох зай гэгч нь хэт ядарсан болон согтуугаар жолоо барих үед, тээврийн хэрэгслийн жин хүнд эсвэл хурд өндөр байх тусам, дугуйн элэгдэл их байх тусам уртасдаг."},{"n":478,"b":"Автомашины зорчигчийн тооны талаар зөв тайлбар 2 нь аль вэ?","c":["Хурдны зам дээр автомашины зөвшөөрөгдсөн суудлын тооноос хэтрүүлэн зорчигч тээвэрлэхийг хориглоно.","Автомашины бүртгэлийн гэрчилгээнд бичигдсэн суудлын тоо нь жолоочийг хассан тоо юм.","Хөдөлгөөн эхлэх газрын харьяа цагдаагийн газрын даргын зөвшөөрөлтэй бол суудлын тооноос илүү зорчигчтой явж болно.","Суудлын тооноос хэтэрсэн тохиолдолд очих газрын харьяа цагдаагийн газрын даргын зөвшөөрөл авах ёстой."],"a":"1, 3","imgs":[],"t":"문장형","e":"Бүх тээврийн хэрэгслийн жолооч зорчигчийн тоо, ачааны жин болон ачааны багтаамжийн хувьд жолоодлогын аюулгүй байдлын стандартаас хэтрүүлэн хүн суулгах эсвэл ачаа ачиж жолоодож болохгүй. Гэхдээ хөдлөх газрыг харьяалах цагдаагийн хэлтсийн даргын зөвшөөрөл авсан үед үүнд хамаарахгүй. (Замын хөдөлгөөний тухай хуулийн 39 дүгээр зүйл)"},{"n":479,"b":"Урд талд зам тээврийн ослын улмаас урд автомашин огцом зогссон үед араас мөргөх ослоос урьдчилан сэргийлэх хамгийн аюулгүй жолоодох арга 2 нь аль вэ?","c":["Урд автомашинтай зогсох зайнаас багагүй зай барин жолоодно.","Ослын дохионы гэрлээ асааж, тусгай зориулалтын тээврийн хэрэгслийг даган явна.","Урд автомашинтай мөргөлдөхгүй хэмжээнд хангалттай хурд сааруулж, аюулгүйн зай авна.","Аюул илэрвэл хөлийн тоормос болон зогсоолын тоормосыг зэрэг ашиглан тоормосны зайг багасгана."],"a":"1, 3","imgs":[],"t":"문장형","e":"Урд явж буй тээврийн хэрэгслээс зогсох зайнаас багагүй зай барьж, урд явж буй тээврийн хэрэгслийн ард мөргөхгүй байх хэмжээнд хурдаа хангалттай бууруулж аюулгүй зайг хангана. (Замын хөдөлгөөний тухай хуулийн 19 дүгээр зүйл)"},{"n":480,"b":"Суудлын хамгаалах бүсний талаар зөв тайлбар 2 нь аль вэ?","c":["Жолооч хамгаалах бүс зүүгээгүй бол 30,000 воны торгууль ногдуулна.","Ерөнхийдөө хүзүүний ташуурын гэмтэл нь 2 цэгийн хамгаалах бүсэнд илүү их тохиолддог.","13-аас доош насны хүүхэд хамгаалах бүс зүүгээгүй бол 60,000 воны зөрчлийн торгууль ногдуулна.","Хамгаалах бүсийг 2 цэгийн, 3 цэгийн, 4 цэгийн гэж ангилна."],"a":"2, 4","imgs":[],"t":"문장형","e":"① Жолооч хамгаалах бүс хэрэглээгүй тохиолдолд 30,000 воны зөрчлийн торгууль ногдуулна. ② Ерөнхийдөө хүзүүний ташуурдалтын гэмтэл нь 2 цэгт бүсэнд илүү их тохиолддог. ③ 13 нас хүрээгүй хүүхэд хамгаалах бүс хэрэглээгүй бол 60,000 воны захиргааны торгууль ногдуулна. ④ Хамгаалах бүсийг хэрэглэх аргаар нь 2 цэгт, 3 цэгт, 4 цэгт гэж ангилдаг."},{"n":481,"b":"Суудлын хамгаалах бүс хэрэглэх талаар зөв тайлбар 2 нь аль вэ?","c":["Ойрхон зайд зорчих үед үр нөлөө бага тул зүүхгүй байж болно.","Автомашины бүх зорчигч аюулгүй байдлын үүднээс суудлын хамгаалах бүс зүүх ёстой.","Хүүхдийг эцэг эхийн тусламж авах боломжтой жолоочийн хажуугийн суудалд суулгаж, хамгаалах бүс зүүлгэх нь аюулгүй.","Яаралтай үүрэг гүйцэтгэж явахаас бусад тохиолдолд тусгай зориулалтын тээврийн хэрэгслийн жолооч ч хамгаалах бүсийг заавал зүүх ёстой."],"a":"2, 4","imgs":[],"t":"문장형","e":"Автомашинд зорчигч аюулгүй байдлын үүднээс суудлын хамгаалах бүс хэрэглэх ёстой бөгөөд яаралтай үүргээр хөдлөх тохиолдлоос бусад үед тусгай зориулалтын тээврийн хэрэгслийн жолооч ч суудлын хамгаалах бүсийг заавал хэрэглэх ёстой. (Замын хөдөлгөөний тухай хуулийн 50 дугаар зүйл)"},{"n":482,"b":"Зам тээврийн ослын улмаас нурууны ноцтой хугарал байж болзошгүй үед хамгийн зөв арга хэмжээ аль нь вэ?","c":["Ухаантай эсэхийг шалгаад шууд зүрх, уушгины сэхээн амьдруулах арга хэмжээ авна.","Гэмтсэн хүнийг түшиж аюулгүй газар шилжүүлээд 119-д мэдэгдэнэ.","Амьсгалын дээд зам бөглөрч болзошгүй тул геймлихийн аргыг (аюулхай хэсэгт шахаж түлхэх) хэрэглэнэ.","Яаралтай биш бол зөөвөрлөж болохгүй, харин зайлшгүй зөөвөрлөх шаардлагатай бол чиг тавьж нурууг хөдөлгөөнгүй болгосны дараа аюулгүй газар нүүлгэнэ."],"a":"4","imgs":[],"t":"문장형","e":"Зам тээврийн ослоор нурууны яс хугарсан байж болзошгүй өвчтөн байгаа тохиолдолд яаралтай биш бол тээвэрлэж болохгүй. Тээвэрлэхээс өмнө зохих арга хэмжээ аваагүй бол нөхөж баршгүй мэдрэлийн гэмтлийг даамжруулах эрсдэл өндөр учраас юм. Иймд хоёрдогч ослын эрсдэл зэргээс сэргийлэхийн тулд аргагүй тээвэрлэх шаардлагатай бол чиг ашиглан нурууны хэсгийг бэхэлсний дараа аюулгүй газар руу эхлээд нүүлгэн шилжүүлэх ёстой."},{"n":483,"b":"Зам тээврийн осол гарсан үед гэмтсэн хүний ухаан санааг шалгахдаа хамгийн түрүүнд хийх зүйл аль нь вэ?","c":["Судасны цохилтыг шалгана.","Дуудаж үзэх эсвэл мөрийг нь зөөлөн товшино.","Аль хэсгээс их хэмжээний цус гарч байгааг шалгана.","Амьсгалын замд гаднын биет байгаа эсэхийг амны хөндийг шалгаж үзнэ."],"a":"2","imgs":[],"t":"문장형","e":"Ухаан санааны байдлыг шалгахын тулд гэмтсэн хүнтэй ярьж үзэх, мөрийг нь зөөлөн тогших, гарыг нь чимхэж шалгах аргууд байдаг."},{"n":484,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зам тээврийн осол гарсан үед яаралтай нөхцөлд хамт зорчигчоор шаардлагатай арга хэмжээ авахуулж, жолоодлогоо үргэлжлүүлж болох тээврийн хэрэгсэл 2 нь аль вэ?","c":["Гэмтсэн хүнийг эмнэлэг рүү тээвэрлэж байгаа суудлын автомашин","Гал унтраасны дараа гал унтраах ангид буцаж байгаа гал унтраах автомашин","Зам тээврийн ослын газар руу явж буй чирэгч автомашин","Шуудангийн ачаа тээвэрлэж яваа шуудангийн автомашин"],"a":"1, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 54 дүгээр зүйл (Осол гарсан үед авах арга хэмжээ)-ийн 5 дахь хэсэг: тусгай зориулалтын тээврийн хэрэгсэл, гэмтсэн хүн тээвэрлэж яваа тээврийн хэрэгсэл, шуудангийн автомашин болон трамвай зэргийн жолооч яаралтай тохиолдолд хамт зорчигч зэргээр ослын арга хэмжээ авахуулах эсвэл цагдаад мэдэгдүүлээд жолоодлогоо үргэлжлүүлж болно."},{"n":485,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зам тээврийн осол гарсан үед жолоодлогоо үргэлжлүүлж болох тохиолдол 2 нь аль вэ?","c":["Яаралтай өвчтөн тээвэрлэж байгаа түргэн тусламжийн автомашины жолооч хамт зорчигчоор шаардлагатай арга хэмжээ авахуулан жолоодлогоо үргэлжлүүлсэн.","Яаралтай хуралд оролцохоор явж буй жолооч хамт зорчигчоор шаардлагатай арга хэмжээ авахуулан жолоодлогоо үргэлжлүүлсэн.","Яаралтай шуудан тээвэрлэж буй автомашины жолооч хамт зорчигчоор шаардлагатай арга хэмжээ авахуулан жолоодлогоо үргэлжлүүлсэн.","Яаралтай эм тээвэрлэж буй түргэн тусламжийн автомашины жолооч хамт зорчигчоор шаардлагатай арга хэмжээ авахуулан жолоодлогоо үргэлжлүүлсэн."],"a":"1, 3","imgs":[],"t":"문장형","e":"Тусгай зориулалтын тээврийн хэрэгсэл эсвэл гэмтсэн хүн тээвэрлэж яваа тээврийн хэрэгсэл болон шуудан тээвэрлэх автомашин зэргийн жолооч яаралтай тохиолдолд хамт зорчигчоор шаардлагатай арга хэмжээ авахуулах эсвэл мэдэгдүүлээд жолоодлогоо үргэлжлүүлж болно. (Замын хөдөлгөөний тухай хуулийн 54 дүгээр зүйлийн 5 дахь хэсэг)"},{"n":486,"b":"Шөнийн цагаар замд амьтан дайрах (road kill)-аас урьдчилан сэргийлэх жолоодлогын талаар зохимжгүй нь аль вэ?","c":["Хүн болон автомашины хөдөлгөөн багатай улсын чанартай зам, уулын замаар явахдаа хурдыг бууруулна.","Зэрлэг амьтан харагдвал удаан ойртож, хүнгүй замын захад автомашинаа зогсоож мөргөлдөхөөс сэргийлнэ.","Зэрлэг амьтан харагдвал урд гэрлээ унтраасан чигээрээ дуут дохиог зөөлөн өгч үргээнэ.","Гарч ирэх амьтдыг амархан харахын тулд аль болох замын захад ойрхон явна."],"a":"4","imgs":[],"t":"문장형","e":"Амьтан дайрах ослын эрсдэл нь амьтан гэнэт гарч ирснээс хариу арга хэмжээ авч чадахгүй байх тохиолдол тул амьтан гарч ирэх магадлал өндөр замд хурдаа бууруулж жолоодох нь зүйтэй."},{"n":487,"b":"Хурдны зам дээр эвдрэл зэрэг яаралтай нөхцөл үүссэн үед тодорхой зай хүртэл үнэ төлбөргүй чирэх үйлчилгээ үзүүлдэг байгууллага аль нь вэ?","c":["Солонгосын замын хөдөлгөөний газар","Солонгосын Авто замын корпораци","Цагдаагийн ерөнхий газар","Солонгосын Тээврийн аюулгүй байдлын газар"],"a":"2","imgs":[],"t":"문장형","e":"Солонгосын Хурдны замын корпорацийн (дуудлагын төв 1588-2504) яаралтай чирэх үйлчилгээ нь осол эсвэл эвдрэлийн улмаас хурдны замд зогсож, хоёрдогч ослын эрсдэлтэй тээврийн хэрэгслийг хамгийн ойрын амралтын газар, салбар, нойрмоглолтын амралтын цэг зэрэг аюулгүй бүс хүртэл үнэ төлбөргүй чирч өгдөг тогтолцоо юм."},{"n":488,"b":"Замд амьтан дайруулж үхсэн (road kill) үед авах арга хэмжээний талаар буруу нь аль вэ?","c":["Халдварт өвчний эрсдэлтэй байж болох тул амьтны сэг зэргийг дур мэдэн хүрэхгүй.","Амьтан дайруулж үхвэл зэрлэг амьтан аврах төв эсвэл орон нутгийн дуудлагын төвд (орон нутгийн код +120) мэдэгдэнэ.","Хоёрдогч ослоос сэргийлэхийн тулд мөргүүлсэн амьтныг автомашиндаа ачиж явна.","Хоёрдогч ослоос урьдчилан сэргийлэх болон хөдөлгөөнийг хэвийн болгох арга хэмжээ авсан бол мэдэгдэх шаардлагагүй."],"a":"3","imgs":[],"t":"문장형","e":"Өвчний хяналт, урьдчилан сэргийлэх газрын мэдээлснээр амьтны сэг зэм халдвар тараах эрсдэлтэй тул шууд гараар хүрч болохгүй бөгөөд осол гарсан тохиолдолд орон нутгийн засаг захиргаа эсвэл замын удирдлагын байгууллага болон бүсийн код +120 дуудлагын төвд (амьдралын мэдээллийн зөвлөгөөний үйлчилгээ) мэдэгдэж тусламж авах ба осолд өртсөн амьтан нь одоогийн хуулиар эд зүйлд тооцогддог тул хоёрдогч ослоос сэргийлэх аюулаас хамгаалах арга хэмжээ авч, саадгүй нэвтрэлтийг хангасан тохиолдолд мэдэгдэхгүй байж болно."},{"n":489,"b":"Хариу авах жолоодлого болон зам тээврийн ослоос урьдчилан сэргийлэх уур бухимдлаа зохицуулах аргын талаар зөв тайлбар аль нь вэ?","c":["Сэтгэл хөдлөл оргилсон үед түр холдож, хугацааны завсарлага авч тайвширдаг аргыг зогсох Stop Button арга гэдэг.","Уур төрүүлсэн сөрөг бодлыг зогсоож, өмнө нь бодож байсан аз жаргалтай дүр зургийг 1–2 минут төсөөлөн төвлөрдөг аргыг Time Out арга гэдэг.","Уур төрүүлдэг итгэл үнэмшлийн тогтолцоо болон өнгөрсөн үеийн гажуудсан бодлын талаарх идэвхгүй танин мэдэх туршлагыг өөрөөсөө асуух аргыг туршлага эргэн санах асуултын арга гэдэг.","Хоёр гар, хоёр хөл, хэвлийн доод хэсэг, цээж, мөр зэрэг биеийн хэсгүүдийг аль болох чангалж дараа нь суллан тайвшруулахыг давтан хийх аргыг булчин чангалж суллах дасгалын арга гэдэг."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний аюулгүй байдлын дүрэм 2021 оны шинэчилсэн 2 дахь хэвлэл: уур хилэнгээ хянах зан үйлийн аргад завсарлага авах арга, зогсоох товчны арга, хурцадмал байдлыг тайлах дасгалын арга байдаг. ① Сэтгэл хөдлөл оргилж буй нөхцөл байдлаас түр гарч, цаг хугацааны боломж гарган сэтгэлээ тайвшруулах уур хилэн хянах аргыг завсарлага авах арга гэнэ. ② Уур хилэн төрүүлж буй сөрөг бодлыг зогсоож, урьдчилан бодож бэлдсэн аз жаргалтай дүр зургийг 1-2 минутын турш санан төвлөрөх уур хилэн хянах аргыг зогсоох товчны арга гэнэ. ③ Туршлага эргэн санах асуултын арга нь уур хилэн хянах аргад хамаарахгүй. ④ Хоёр гар, хөл, хэвлийн доод хэсэг, цээж, мөр зэрэг биеийн хэсэг бүрийг аль болох чангалаад сулруулж тайван байдалд орохыг давтах аргыг хурцадмал байдлыг тайлах дасгалын арга гэнэ."},{"n":490,"b":"Аадар борооны улмаас газрын доорх авто зам усанд автсан байна. Дараахаас хамгийн аюулгүй жолоодох арга аль нь вэ?","c":["Ус дугуйг бүрэн далдлах хүртэл аюулгүй тул удаан явж гарна.","Аль болох өндөр хурдтайгаар гарна.","Тойруу зам байгаа эсэхийг шалгаад тойруу замаар явна.","Гарч байх үед хөдөлгүүр унтарвал шууд дахин асаагаад гарна."],"a":"3","imgs":[],"t":"문장형","e":"Аадар борооны улмаас газар доорх зам усанд автаж автомашины бампер хүртэл эсвэл автомашины дугуйн талаас илүү хэсэг усанд автсан бол автомашин өнгөрч чадахгүй. Мөн дээрх шиг бүсээр өнгөрөхдөө өндөр хурдтай явбал автомашин усыг түлхэж урд талын усны түвшин нэмэгдэн хөдөлгүүрт ус орж ч болзошгүй. Усанд автсан бүсэд хөдөлгүүр унтарсан үед дахин асаавал хөдөлгүүр эвдэрнэ."},{"n":491,"b":"Зам тээврийн осол зэрэг яаралтай нөхцөл үүссэн үед авах арга хэмжээний талаар хамгийн хамааралгүй нь аль вэ?","c":["Аюул байгаа эсэхийг шалгах","Өвчтөний хариу үйлдлийг шалгах","Амьсгалын замыг чөлөөлж, амьсгалж байгаа эсэхийг шалгах","Өвчтөний очих газар болон хувийн мэдээллийг шалгах"],"a":"4","imgs":[],"t":"문장형","e":"Яаралтай нөхцөл байдал үүссэн үед аюултай эсэхийг шалгаж, өвчтөний хариу үйлдлийг ажиглан, ойр орчмынхноос тусламж хүсэж, шаардлагатай бол өвчтөн амьсгалах боломжтой байхаар амьсгалын замыг чөлөөлөх шаардлагатай бөгөөд аврах дуудлага өгөх ёстой."},{"n":492,"b":"Жолоодож байх үед автомашинд гэнэтийн нөхцөл үүсэхэд авах зөв арга хэмжээнээс хамгийн хамааралгүй нь аль вэ?","c":["Жолооны хүрд хүчтэй чичирвэл жолооны хүрдийг чанга бариад үргэлжлүүлэн явна.","Автомашинаас утаа гарвал шууд аюулгүй газар шилжиж, хөдөлгүүрээ унтраана.","Дугуй хагарвал жолооны хүрдийг чанга барьж, хурдыг бууруулаад аюулгүй газар түр зогсоно.","Төмөр замын гарам дээр хөдөлгүүр унтраад дахин асахгүй бол хурдан нүүж, холбогдох байгууллагад мэдэгдэнэ."],"a":"1","imgs":[],"t":"문장형","e":"Жолоо хүчтэй чичирвэл дугуй хагарах эсвэл обуд мултарч болзошгүй тул заавал аюулгүй газарт зогсоож шалгана."},{"n":493,"b":"Зам тээврийн ослын газар нотлох баримт болгон зураг авах зөв арга 2 нь аль вэ?","c":["Хар хайрцгийн бичлэг байгаа бол нэмэлт зураг авах шаардлагагүй.","Зам дээрх хөдөлгүүрийн тос, хөргөлтийн шингэн зэрэг мөр удаан хадгалагддаг тул зураг авах шаардлагагүй.","Хагархай эд анги, автомашин болон замын эвдэрсэн хэсэг зэрэг нэг объектыг ойроос болон холоос хоёуланг нь зураг авна.","Автомашины дугуйн явсан чиглэлийг шүршдэг будаг зэргээр тэмдэглэх эсвэл зураг авч үлдээнэ."],"a":"3, 4","imgs":[],"t":"문장형","e":"Гэмтсэн хэсгийг ойроос болон холоос зураг авах ёстой бөгөөд автомашины дугуй эргэсэн байдлыг хүртэл зураг авч байж дараа нь ослыг тодруулахад тус болно."},{"n":494,"b":"Хол замд гарахаас өмнө заавал шалгах хамгийн чухал 2 зүйл аль вэ?","c":["Автомашины цэвэр байдлыг шалгах","DMB (дүрс гаргах төхөөрөмж) ажиллаж байгаа эсэхийг шалгах","Бүх төрлийн тос, шингэнийг шалгах","Дугуйн байдлыг шалгах"],"a":"3, 4","imgs":[],"t":"문장형","e":"Холын аялалд гарахын өмнө дугуйн элэгдлийн байдал, хийн даралт, төрөл бүрийн тос, шил арчигч болон шил угаагч шингэн, гэрлүүд зэргийг шалгах ёстой."},{"n":495,"b":"Замын хөдөлгөөний тухай хуулийн дагуу жолоодох эрхийн үнэмлэх хүчингүй болох үндэслэл аль нь вэ?","c":["Чадварын тогтмол шалгалтын хугацаа дууссаны дараагийн өдрөөс эхлэн шалгалт өгөөгүйгээр 6 сараас хэтэрсэн тохиолдол","Жолооч хяналт тавьж буй албан хаагчийг (цагдаагийн албан хаагч, аймаг·сум·дүүргийн албан хаагч) зодож, цагдан хорихгүйгээр эрүүгийн хэрэг үүсгүүлсэн тохиолдол","Автомашин бүртгүүлсний дараа улсын дугаарын хавтан суурилуулахгүйгээр жолоодсон тохиолдол","2-р ангиллын энгийн жолооны үнэмлэхээ шинэчлээгүйгээр 2 жилээс хэтэрсэн тохиолдол"],"a":"2","imgs":[],"t":"문장형","e":"① 1 жил ② Эрүүгийн хэрэг үүсгэгдсэн тохиолдолд хүчингүй болгох үндэслэл болно. ③ Автотээврийн хэрэгслийн удирдлагын тухай хуулийн дагуу бүртгүүлээгүй эсвэл түр ашиглах зөвшөөрөл аваагүй автомашиныг жолоодсон тохиолдолд жолоодох эрхийг хүчингүй болгох бөгөөд бүртгүүлсэн боловч улсын дугаарын тэмдгийг байрлуулалгүй жолоодсон нь жолоодох эрхийг хүчингүй болгох үндэслэл биш. (Замын хөдөлгөөний тухай хуулийн 93 дугаар зүйл)"},{"n":496,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зөрчлийн торгуулийн мэдэгдэл хүлээн авсан хүн эхний төлбөрийн хугацаа өнгөрсн ий дараа 20 хоногийн дотор төлөх дүн аль нь вэ?","c":["Мэдэгдсэн зөрчлийн торгуулийн дүн дээр 10 хувь нэмсэн хэмжээ","Мэдэгдсэн зөрчлийн торгуулийн дүн дээр 20 хувь нэмсэн хэмжээ","Мэдэгдсэн зөрчлийн торгуулийн дүн дээр 30 хувь нэмсэн хэмжээ","Мэдэгдсэн зөрчлийн торгуулийн дүн дээр 40 хувь нэмсэн хэмжээ"],"a":"2","imgs":[],"t":"문장형","e":"Төлбөрийн хугацаанд зөрчлийн торгуулиа төлөөгүй хүн төлбөрийн хугацаа дуусах өдрийн дараагийн өдрөөс 20 хоногийн дотор мэдэгдсэн зөрчлийн торгууль дээр түүний 100-ны 20-ийг нэмсэн дүнг төлөх ёстой. (Замын хөдөлгөөний тухай хуулийн 164 дүгээр зүйлийн 2 дахь хэсэг)"},{"n":497,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хуримтлагдсан оноо хэтэрснээс жолоодох эрхийн үнэмлэх хүчингүй болох шалгуурын зөв нь аль вэ?","c":["1 жилийн хугацаанд 100 оноо ба түүнээс дээш","2 жилийн хугацаанд 191 оноо ба түүнээс дээш","3 жилийн хугацаанд 271 оноо ба түүнээс дээш","5 жилийн хугацаанд 301 оноо ба түүнээс дээш"],"a":"3","imgs":[],"t":"문장형","e":"1 жилд 121 оноо ба түүнээс дээш, 2 жилд 201 оноо ба түүнээс дээш, 3 жилд 271 оноо ба түүнээс дээш бол жолоодох эрхийг хүчингүй болгоно. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28)"},{"n":498,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зам тээврийн ослын үр дүнд ногдуулах торгуулийн онооны талаар зөв тайлбар аль нь вэ?","c":["Захиргааны арга хэмжээ авах жолооч өөрөө гэмтсэн байсан ч хүний хохиролтой ослын ангиллын дагуу торгуулийн оноо ногдуулна.","Автомашин ба явган хүний ослын үед хоёр тал буруутай бол торгуулийн оноо ногдуулахгүй.","Зам тээврийн ослын шалтгаан нь даван туулах боломжгүй хүчин зүйл эсвэл хохирогчийн илт буруутай үйлдэл бол торгуулийн оноог тал хувиар бууруулна.","Автомашин ба автомашины ослын үед зөвхөн хамгийн ноцтой зөрчил гаргасан жолоочид торгуулийн оноо ногдуулна."],"a":"4","imgs":[],"t":"문장형","e":"①-ийн тохиолдолд захиргааны шийтгэл хүлээх жолооч өөрийн хохирлын хувьд торгуулийн оноо тооцохгүй. ②-ийн тохиолдолд 2-ны 1 болгож хөнгөрүүлнэ. ③-ийн тохиолдолд торгуулийн оноо ногдуулахгүй. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28)"},{"n":499,"b":"Замын хөдөлгөөний тухай хуулийн дагуу дүрс бичлэгийн хэрэгслээр нотлогдсон зогсоолын журам зөрчсөн тохиолдолд ногдуулах торгуулийн талаар зөв тайлбар аль нь вэ?","c":["Суудлын автомашины өмчлөгч 30,000 воны торгууль төлнө.","Олон суудалт автомашины өмчлөгч 70,000 воны торгууль төлнө.","Тогтоосон хугацаанд торгуулиа төлөөгүй ч ямар нэгэн сөрөг үр дагавар гарахгүй.","Нэг газар 2 цаг ба түүнээс дээш хугацаагаар зогсоолын журам зөрчсөн тохиолдолд торгууль нэмэгдэнэ."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 33 дугаар зүйл, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 6: зогсоолд тавихыг хориглосон зөрчлийн үед суудлын автомашинд 40,000 вон, олон суудалт автомашинд 50,000 воны захиргааны торгууль ногдуулах бөгөөд 2 цаг ба түүнээс дээш хугацаагаар зогсоолын зөрчил гаргасан тохиолдолд 10,000 вон нэмэгдэж, төлөөгүй үед нэмэгдэл болон хүндрүүлсэн нэмэгдэл ногдуулна."},{"n":500,"b":"Дараахын аль нь зам тээврийн осол гаргасан жолооч нь иж бүрэн даатгал эсвэл харилцан туслалцах холбоонд хамрагдсан тул зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн тусгай зохицуулалт хэрэгжих тохиолдол вэ?","c":["Аюулгүй жолоодох үүргээ зөрчсөний улмаас автомашинд гэмтэл учруулж, хөнгөн гэмтэлтэй зам тээврийн осол гаргасан тохиолдол","Зам тээврийн ослын улмаас хүний амь нас хохироосон тохиолдол","Зам тээврийн осол гаргасны дараа гэмтсэн хүнд туслалгүйгээр зугтсан тохиолдол","Гэрлэн дохио зөрчсөний улмаас хөнгөн гэмтэлтэй зам тээврийн осол гаргасан тохиолдол"],"a":"1","imgs":[],"t":"문장형","e":"Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн 4 дүгээр зүйл"},{"n":501,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зам дээр ижил сонирхолтой 7 хүн 4 автомашинд хуваагдан сууж, хамтран бусдад хохи рол учруулан эрүүгийн хэрэг үүсгүүлжээ. Шийтгэлийн талаар буруу нь аль вэ? (Хувийн хөдөлгөөнт хэрэгслийг оруулахгүй)","c":["2 жил хүртэл хугацаагаар хорих ял эсвэл 5,000,000 вон хүртэл торгууль","Илэрсэн даруйд жолоодох эрхийн үнэмлэхийг түдгэлзүүлнэ","Баривчлагдсан тохиолдолд жолоодох эрхийн үнэмлэхийг хүчингүй болгоно","Эрүүгийн хэрэг үүссэн тохиолдолд торгуулийн 40 оноо"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 46 дугаар зүйл (Хамтарсан аюултай үйлдлийг хориглох)-ийн 1 дэх хэсэг: автомашин зэргийн жолооч замд 2 ба түүнээс дээш хүн хамтран 2 ба түүнээс дээш автомашин зэргийг хууль ёсны шалтгаангүйгээр урд хойно эсвэл зүүн баруун талд эгнүүлэн явуулж бусдад хор хохирол учруулах эсвэл замын хөдөлгөөний аюул үүсгэж болохгүй. Замын хөдөлгөөний тухай хуулийн 150 дугаар зүйл (Шийтгэл)-ийн 1 дэх заалт: 2 жил хүртэл хугацаагаар хорих ял эсвэл 5,000,000 вон хүртэл торгууль. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28: цагдан хоригдсон үед жолоодох эрхийг хүчингүй болгох, эрүүгийн хэрэг үүсгэгдсэн үед торгуулийн оноо 40 оноо"},{"n":502,"b":"Замын хөдөлгөөний тухай хуулийн дагуу автомашины жолооч аюултай, түрэмгий жолоодлого хийсний улмаас эрүүгийн хэрэг үүсгүүлсэн. Жолоодох эрхийн үнэмлэхэд авах захиргааны арга хэмжээ аль нь вэ?","c":["Жолоодох эрхийн үнэмлэх хүчингүй болгоно","Жолоодох эрхийн үнэмлэхийг 100 хоног түдгэлзүүлнэ","Жолоодох эрхийг 60 хоногоор түдгэлзүүлэх","Жолоодох эрхийг 40 хоногоор түдгэлзүүлэх"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28"},{"n":503,"b":"Замын хөдөлгөөний тухай хуулийн дагуу согтуу байдалтай унадаг дугуй жолоодсон тохиолдолд яах вэ?","c":["Шийтгэл оногдуулахгүй.","30,000 воны зөрчлийн торгуулийн мэдэгдэл өгнө.","40,000 воны торгууль ногдуулна.","100,000 вон хүртэл торгууль эсвэл баривчлах ял ногдуулна."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 8-ын 64-ийн 2: согтуу байдалтай унадаг дугуй жолоодсон тохиолдолд зөрчлийн торгууль 30,000 вон."},{"n":504,"b":"Замын хөдөлгөөний тухай хуулийн дагуу согтуу байдалтай гэж үзэх хангалттай үндэслэлтэй унадаг дугуйн жолооч цагдаагийн албан хаагчийн хууль ёсны согтууруулах ундааны шинжилгээ өгөх шаардлагыг биелүүлээгүй бол ямар шийтгэлтэй вэ?","c":["Шийтгэл оногдуулахгүй.","70,000 воны торгууль ногдуулна.","100,000 воны зөрчлийн торгуулийн мэдэгдэл өгнө.","100,000 вон хүртэл торгууль эсвэл баривчлах ял ногдуулна."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8: согтуу байдалтай гэж үзэх хангалттай үндэслэлтэй унадаг дугуйн жолооч цагдаагийн алба хаагчийн амьсгалын шинжилгээний хэмжилтэд татгалзсан тохиолдолд зөрчлийн торгууль 100,000 вон."},{"n":505,"b":"Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн дагуу эрүүгийн шийтгэл хүлээх тохиолдол 2 нь аль вэ?","c":["Иж бүрэн даатгалд хамрагдаагүй автомашин зөвхөн эд хөрөнгийн хохиролтой осол гаргаж, хохирогчтой эвлэрсэн тохиолдолд","Таксины харилцан туслалцах холбоонд хамрагдсан такси төв шугам давж, хүний хохиролтой осол гаргасан тохиолдолд","Иж бүрэн даатгалтай автомашин гэрлэн дохио зөрчиж, хүний хохиролтой осол гаргасан тохиолдолд","Ачааны автомашины харилцан туслалцах холбоонд хамрагдсан ачааны автомашин аюулгүй жолоодох үүргээ биелүүлээгүйгээс хүний хохиролтой осол гаргасан тохиолдолд"],"a":"2, 3","imgs":[],"t":"문장형","e":"Төвийн шугам давах эсвэл гэрлэн дохио зөрчиж хүний амь нас, эрүүл мэндэд хохирол учруулсан зам тээврийн осол гаргасан үед иж бүрэн даатгал эсвэл харилцан туслалцах холбоонд даатгуулсан байсан ч шийтгүүлнэ. (Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн 3 дугаар зүйл, 4 дүгээр зүйл)"},{"n":506,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зөрчлийн торгуулийн мэдэгдэл авсан хүн хоёр дахь төлбөрийн хугацааг хэ трүүлсэн тохиолдлын талаар зөв тайлбар 2 нь аль вэ?","c":["Нэн даруй шуурхай шүүх хурал хүсэх ёстой.","Шуурхай шүүх хуралд ороогүй бол жолоодох эрхийн үнэмлэхийг 40 хоног түдгэлзүүлнэ.","Торгууль ногдуулна.","Зөрчлийн торгуулийн дүн дээр 30 хувь нэмсэн хэмжээг төлсөн бол шуурхай шүүх хурал хүсэхгүй."],"a":"1, 2","imgs":[],"t":"문장형","e":"Зөрчлийн торгууль төлөх мэдэгдэл хүлээн авсан хүн 2 дахь төлбөрийн хугацааг хэт нээс буруу нь аль вэ? (Хүүхдийн хамгаалалтын бүс болон ахмад настан, хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсээс бусад)","c":["Төв шугам давсан тохиолдолд 90,000 воны торгууль","Гэрлэн дохио зөрчсөн тохиолдолд 70,000 воны торгууль","Явган хүний зам руу орсон тохиолдолд 70,000 воны торгууль","Хурд хэтрүүлсэн (цагт 20 км ба түүнээс доош) тохиолдолд 50,000 воны захиргааны торгууль"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 6: хурдны дээд хязгаарыг (цагт 20 километр ба түүнээс бага хэмжээгээр) зөрчсөн тээврийн хэрэгслийн ажил олгогч зэрэгт захиргааны торгууль 40,000 вон ногдуулна"},{"n":527,"b":"Замын хөдөлгөөний тухай хуулийн дагуу торгуулийн оноо ногдуулах жолоочийн үйлдэл аль нь вэ?","c":["Жолоодож байхдаа автомашинаас юм шидсэн тохиолдолд","Эгнээ солих үед дохио өгөөгүй тохиолдолд","Хууль бусаар тоноглол суурилуулсан автомашин жолоодсон тохиолдолд","Уулзвараар нэвтрэх журмыг зөрчсөн тохиолдолд"],"a":"1","imgs":[],"t":"문장형","e":"Замаар явж буй тээврийн хэрэгслээс гадагш юм шидсэн тохиолдолд торгуулийн оноо 10 оноо ногдуулна. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28)"},{"n":528,"b":"Замын хөдөлгөөний тухай хуулийн дагуу осолгүй, зөрчилгүй байх амлалтаар торгуулийн оноо бууруулах (Сайн жолоочийн миль онооны тогтолцоо)-ын талаар зөв тайлбар аль нь вэ?","c":["40 онооны урамшууллын оноо олгоно.","2 жилийн хугацаанд зам тээврийн осол болон хууль зөрчөөгүй тохиолдолд урамшууллын оноо олгоно.","Тодорхой нөхцөлөөс бусад тохиолдолд жолоодох эрхийн үнэмлэх түдгэлзүүлэх шийдвэр гарвал хуримтлагдсан онооноос урамшууллын оноог хасна.","Жолоодох эрхийн үнэмлэхийн шалгалтын төвд биечлэн очиж амлалтын хуудсаа өгсөн тохиолдолд л хүчинтэй."],"a":"3","imgs":[],"t":"문장형","e":"1 жилийн турш зам тээврийн осол болон дүрмийн зөрчилгүй байж 10 оноогийн урамшууллын оноо олгоно. Цагдаагийн байгууллагад очихоос гадна интернэтээр (www.efine.go.kr) ч тангаргийн бичиг гаргаж өгч болно. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28-ын 1 дэх хэсэг Ерөнхий стандартын \"б\". Торгуулийн оноог нэгдсэн байдлаар удирдах) Гэхдээ зам тээврийн ослоор хүний амь нас хохироосон, согтуугаар жолоо барьсан, зэрлэг жолоодлого хийсэн, автомашин зэрэг ашиглан гэмт хэрэг үйлдсэн, автомашин хулгайлсан эсвэл булаасан тохиолдлыг хамааруулахгүй."},{"n":529,"b":"Замын хөдөлгөөний тухай хуулийн дагуу согтуугаар жолоо барихаас сэргийлэх төхөөрөмжийн талаар зөв тайлбар 2 нь аль вэ?","c":["“Согтуугаар жолоо барихаас сэргийлэх төхөөрөмж” гэж согтуу үед автомашин зэрэг тээврийн хэрэгслийг жолоодох гэж оролдох үед хөдөлгүүр асахгүй байлгадаг захиргаа, аюулгүй байдлын яамны журмаар тогтоосон төхөөрөмжийг хэлнэ.","Согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулах нөхцөлтэй жолоодох эрхийн үнэмлэх авсан хүн автомашин зэрэг тээврийн хэрэгсэл жолоодох бол уг төхөөрөмжийг суурилуулж, аймаг, хотын цагдаагийн газрын даргад бүртгүүлэх ёстой.","Согтуугаар жолоо барихаас сэргийлэх төхөөрөмжийн суурилуулах хугацааг жолоодох эрхийн үнэмлэх авах эрхгүй хугацаа дууссан өдрөөс эхлэн тооцно.","Согтууруулах ундаа хэрэглэсний дараа хувийн хөдөлгөөнт хэрэгсэл жолоодсон хүн 5 жилийн дотор дахин согтуугаар жолоо барьсны улмаас жолоодох эрхийн үнэмлэх хүчингүй болсон бол уг төхөөрөмж суурилуулах нөхцөлтэй жолоодох эрхийн үнэмлэх авах ёстой."],"a":"1, 2","imgs":[],"t":"문장형","e":"① Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 34 дэх заалт ② Замын хөдөлгөөний тухай хуулийн 50-3 дугаар зүйл-ын 1 дэх хэсэг ③ Жолоодох эрх авах боломжгүй хугацаа дууссан \"дараагийн өдрөөс\" суурилуулах хугацааг тооцно (Замын хөдөлгөөний тухай хуулийн 80-2 дугаар зүйл-ын 2 дахь хэсэг). ④ Хувийн хөдөлгөөнт хэрэгсэл жолоодсон тохиолдлыг хамааруулахгүй (Замын хөдөлгөөний тухай хуулийн 80-2 дугаар зүйл-ын 1 дэх хэсэг)."},{"n":530,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тусгай замын хөдөлгөөний аюулгүй байдлын заавал суралцах сургалтад хэн хамрагдах ёстой вэ?","c":["Анх удаа жолоодох эрхийн үнэмлэх авах гэж байгаа хүн","Шийтгэлийн торгуулийн 30 оноотой хүн","Замын хөдөлгөөнд оролцогчийн сургалтад хамрагдсан хүн","Аюултай, түрэмгий жолоодлогын улмаас жолоодох эрхийн үнэмлэх нь түдгэлзсэн хүн"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 73 дугаар зүйл (Замын хөдөлгөөний аюулгүй байдлын сургалт): анх удаа жолоодох эрх авах гэж буй хүн замын хөдөлгөөний аюулгүй байдлын сургалтад хамрагдах ёстой. Шийтгэлийн торгуулийн оноо нь 40 оноогоос бага хүн замын хөдөлгөөний дүрмийн сургалтад хамрагдаж болно."},{"n":531,"b":"Замын хөдөлгөөний тухай хуулийн дагуу уулзвар, явган хүний гарц, төмөр замын гарам дээр 2 цагаас дээш хугацаагаар зогсоолд тавьсан суудлын автомашины өмчлөгчид ногдуулах захиргааны торгууль хэд вэ? (Хүүхдийн хамгаалалтын бүс болон ахмад настан, хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүсээс бусад)","c":["40,000 вон","50,000 вон","60,000 вон","70,000 вон"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 6: уулзвар, явган хүний гарц, төмөр замын гарам эсвэл явган хүний зам ба зорчих хэсэг нь тусгаарлагдсан замын явган хүний зам дээр 2 цаг ба түүнээс дээш хугацаагаар зогсоолд тавьсан суудлын автомашины ажил олгогч зэрэгт захиргааны торгууль 50,000 вон ногдуулна."},{"n":532,"b":"Замын хөдөлгөөний тухай хуулийн дагуу жолоодох эрхийн үнэмлэх хүчингүй болох үндэслэл биш нь аль вэ?","c":["Чадварын тогтмол шалгалтын хугацааг 1 жилээс илүү хэтрүүлсэн тохиолдол","Хариу авах жолоодлогын улмаас баривчлагдсан тохиолдол","Хурдны хязгаарыг цагт 100 км-ээс илүүгээр 2 удаа хэтрүүлсэн тохиолдол","Автомашин зэрэг тээврийн хэрэгсэл ашиглан бусдыг хулгайлан авч явах, хуурч дагуулах эсвэл хууль бусаар хорьсон тохиолдол"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 93 дугаар зүйл (Жолоодох эрхийг хүчингүй болгох, түдгэлзүүлэх): хурдны дээд хязгаарыг цагт 100 километрээс илүү хэтрүүлсэн хурдаар 3 ба түүнээс дээш удаа автомашин зэргийг жолоодсон тохиолдол"},{"n":533,"b":"3 жилийн өмнө согтууруулах ундааны шинжилгээ өгөхөө суудлын автомашин жолоодсон хүний шийтгэлийн зөв хэмжээ аль нь вэ? (10 жилийн дотор 1 удаа зөрчил гаргасан тохиолдол)","c":["2 жил ба түүнээс доош хорих ял эсвэл 5,000,000 вон ба түүнээс доош торгууль","3 жил ба түүнээс доош хүртэл хорих ял эсвэл 5,000,000 вон ба түүнээс дээш 10,000,000 вон ба түүнээс доош хүртэл торгууль","1 жил ба түүнээс дээш 2 жил ба түүнээс доош хүртэл хорих ял эсвэл 5,000,000 вон ба түүнээс дээш 10,000,000 вон ба түүнээс доош хүртэл торгууль","2 жил ба түүнээс дээш 5 жил ба түүнээс доош хүртэл хорих ял эсвэл 10,000,000 вон ба түүнээс дээш 20,000,000 вон ба түүнэ эс доош хүртэл торгууль"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 148-2 дугаар зүйл (Шийтгэл) ③ 44 дүгээр зүйлийн 1 дэх хэсгийг зөрчиж согтуу байдалтай автомашин зэрэг эсвэл трамвай жолоодсон хүнийг дараах заалтын ангиллын дагуу шийтгэнэ."},{"n":535,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зам дээр автомашины жолооч эд хөрөнгийн хохиролтой зам тээврийн осол гаргасны дараа авах ёстой арга хэмжээг биелүүлээгүй тохиолдолд ногдуулах торгуулийн оноо хэд вэ?","c":["15 оноо","20 оноо","30 оноо","40 оноо"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28: арга хэмжээ зэргийг биелүүлээгүйд ногдуулах торгуулийн оноогийн стандартын дагуу эд хөрөнгийн хохирол учирсан зам тээврийн осол гаргасны дараа зугтсан үед торгуулийн оноо 15 оноо ногдуулна."},{"n":536,"b":"Замын хөдөлгөөний тухай хуулийн дагуу 4.5 тонн ачааны автомашинд ачсан ачааг унахаас хамгаалах арга хэмжээ аваагүй бол хэдэн воны зөрчлийн торгуультай вэ?","c":["50,000 вон","40,000 вон","30,000 вон","20,000 вон"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 39 дүгээр зүйлийн 4 дэх хэсэг, хэрэгжүүлэх журмын Хавсралт 8: 4 тонноос дээш даацтай ачааны автомашины ачаа унахаас сэргийлэх үүргийг зөрчсөн үйлдэлд зөрчлийн торгууль 50,000 вон."},{"n":537,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тусгай эгнээгээр зорчих тухай зөв тайлбар аль нь вэ?","c":["Суудлын автомашинд 2 хүн суусан бол олон зорчигчийн тусгай эгнээгээр зорчиж болно.","9 ба түүнээс дээш суудалтай суудлын автомашинд 6 хүн суусан бол хурдны замын автобусны тусгай эгнээгээр зорчиж болно.","12 ба түүнээс доош суудалтай олон суудалт автомашинд 5 хүн суусан байсан ч хурдны замын автобусны тусгай эгнээгээр зорчиж болно.","16 суудалтай хувийн олон суудалт автомашин хурдны замаас бусад зам дээрх автобусны тусгай эгнээгээр зорчиж болно."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 1 ① 3 ба түүнээс дээш хүн сууж явах ёстой. ③ Зорчигч 6 ба түүнээс дээш байх ёстой. ④ Аж ахуйн зориулалтын олон суудалт автомашин байх, эсвэл сургууль, ажилд зорчих зориулалтаар аймаг, нийслэлийн Цагдаагийн газрын даргаар томилогдсон байх зэрэг нөхцөлийг хангаж байж явах боломжтой. 36 ба түүнээс дээш суудалтай том оврын олон суудалт автомашин, 36-аас доош суудалтай аж ахуйн зориулалтын олон суудалт автомашин болон мэдүүлгийн гэрчилгээ авсан хүүхдийн сургуулийн автобус нь хурдны замаас бусад замд автобусны тусгай эгнээгээр явах боломжтой."},{"n":538,"b":"Замын хөдөлгөөний тухай хуулийн дагуу 75 ба түүнээс дээш настай хүний авах ёстой замын хөдөлгөөний аюулгүй байдлын сургалтын талаар буруу нь аль вэ?","c":["75 ба түүнээс дээш настай хүний замын хөдөлгөөний аюулгүй байдлын сургалтыг Солонгосын Замын хөдөлгөөний газар зо хион байгуулна.","Жолоодох эрхийн үнэмлэх шинэчлэх өдөр нь 75 ба түүнээс дээш настай хүн шинэчлэх хугацаандаа сургалтад хамрагдах ёстой.","75 ба түүнээс дээш настай хүн анх удаа жолоодох эрхийн үнэмлэх авах гэж байгаа бол сургалтын хугацаа 1 цаг байна.","Сургалтыг лекц, дүрс бичлэг, танин мэдэхүйн чадварын өөрийн үнэлгээ зэрэг аргаар 2 цаг явуулна."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 16-ийн 4: 75 ба түүнээс дээш настай хүнд зориулсан замын хөдөлгөөний аюулгүй байдлын сургалтын хугацаа 2 цаг байна."},{"n":539,"b":"Замын хөдөлгөөний тухай хуулийн дагуу автомашины жолооч төв шугам давсны улмаас нэг хүн хүнд гэмтэж, нэг хүн хөнгөн гэмтсэн зам тээврийн осол гаргасан бол торгуулийн оноо хэд вэ?","c":["30 оноо","40 оноо","50 оноо","60 оноо"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28: жолоодох эрхийг хүчингүй болгох, түдгэлзүүлэх шийтгэлийн стандартын дагуу төвийн шугам давахад торгуулийн оноо 30 оноо, хүнд гэмтэл 1 хүн тутамд торгуулийн оноо 15 оноо, хөнгөн гэмтэл 1 хүн тутамд торгуулийн оноо 5 оноо байна."},{"n":540,"b":"Замын хөдөлгөөний тухай хуулийн дагуу “зам дээр хүүхдээр хувийн хөдөлгөөнт хэрэгсэл жолоодуулсан асран хамгаалагчид ногдуулах захиргааны торгууль” болон “согтуу байдалтай хувийн хөдөлгөөнт хэрэгсэл жолоодсон хүний зөрчлийн торгууль (шинжилгээ өгөхөөс татгалзсан тохиолдлоос бусад)”-ын нийлбэр зөв аль нь вэ?","c":["100,000 вон","200,000 вон","300,000 вон","400,000 вон"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 6: замд хүүхдээр хувийн хөдөлгөөнт хэрэгсэл жолоодуулсан хүүхдийн асран хамгаалагчид захиргааны торгууль 100,000 вон. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8: согтуу байдалтай унадаг дугуй зэргийг жолоодсон хүмүүсээс хувийн хөдөлгөөнт хэрэгсэл (зөрчлийн торгууль 100,000 вон), унадаг дугуй (зөрчлийн торгууль 30,000 вон)"},{"n":541,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хурдны замын автобусны тусгай эгнээгээр зорчих боломжтой автомашины шалгуурын зөв нь аль вэ?","c":["11 хүний суудалтай олон суудалт автомашинд 6 ба түүнээс дээш хүн суусан бол зорчиж болно.","9 хүний суудалтай суудлын автомашинд 5 ба түүнээс дээш хүн суусан бол зорчиж болно.","7 хүний суудалтай суудлын автомашинд 6 ба түүнээс дээш хүн суусан бол зорчиж болно.","Бүх олон суудалт автомашин зорчигчийн тооноос үл хамааран зорчиж болно."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 1: хурдны замын автобусны тусгай эгнээгээр явж болох автомашин нь 9 ба түүнээс дээш суудалтай суудлын автомашин болон олон суудалт автомашин юм. Гэхдээ 9-өөс 12 хүртэл суудалтай суудлын автомашин болон олон суудалт автомашин нь 6 ба түүнээс дээш хүн сууж явсан тохиолдолд л явах боломжтой."},{"n":542,"b":"Дараах сонголтуудаас уулзвараар нэвтрэх үед түр зогсох шаардлагагүй газар аль нь вэ?","c":["Гэрлэн дохио шар анивчиж байгаа уулзвар","Гэрлэн дохио улаан анивчиж байгаа уулзвар","Замын хөдөлгөөн зохицуулагдаагүй бөгөөд зүүн, баруун талыг харах боломжгүй уулзвар","Замын хөдөлгөөн зохицуулагдаагүй бөгөөд хөдөлгөөн ихтэй уулзвар"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 2: шар гэрэл анивчиж байх үед тээврийн хэрэгсэл болон хөсөг бусад хөдөлгөөн эсвэл аюулгүйн тэмдэглэгээний заалтад анхаарал тавин явж болно."},{"n":543,"b":"Төлбөртэй авто замын тухай хуулийн дагуу төлбөрөө төлөлгүй хурдны замаар нэвтэрсэн автомашинд ногдуулах нэмэлт төлбөрийн зөв хэмжээ аль нь вэ?","c":["Замын төлбөрийн 5 дахин их хэмжээтэй дүн ногдуулах боломжтой.","Замын төлбөрийн 10 дахин их хэмжээтэй дүн ногдуулах боломжтой.","Замын төлбөрийн 20 дахин их хэмжээтэй дүн ногдуулах боломжтой.","Замын төлбөрийн 30 дахин их хэмжээтэй дүн ногдуулах боломжтой."],"a":"2","imgs":[],"t":"문장형","e":"Замын төлбөр төлөлгүй төлбөртэй замаар явах үйлдэл гаргасан үед замын төлбөрийн 10 дахинтай тэнцэх дүнг ногдуулж болно. (Төлбөртэй замын тухай хуулийн 20 дугаар зүйл болон Төлбөртэй замын тухай хуулийг хэрэгжүүлэх журмын 14 дүгээр зүйл)"},{"n":544,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тусгай эгнээгээр зорчих эрхтэй тээврийн хэрэгслээс бусад тээврийн хэрэгсэл тусгай эгнээгээр зорчиж болохгүй тохиолдол аль нь вэ?","c":["Яаралтай тусгай зориулалтын тээврийн хэрэгсэл өөрийн үндсэн яаралтай зориулалтаар явж байгаа үед","Зам эвдэрсэн зэрэг шалтгаанаар тусгай эгнээгээр явахаас өөр боломжгүй үед","Тусгай эгнээгээр зорчих эрхтэй автомашины хөдөлгөөнд саад учруулахгүй хэмжээнд такси зорчигч авахын тулд түр хугацаанд зорчих үед","Хүргэлтийн автомашин ачаа буулгахын тулд түр хугацаанд зорчих үед"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 10 дугаар зүйл (Тусгай эгнээгээр явах тээврийн хэрэгслээс бусад тээврийн хэрэгсэл тусгай эгнээгээр явж болох тохиолдол)"},{"n":545,"b":"Замын хөдөлгөөний тухай хуулийн дагуу автомашины зориулалтын зам дээр автомашины хамгийн дээд болон хамгийн бага хурд хэд вэ?","c":["Цагт 110 км, цагт 50 км","Цагт 100 км, цагт 40 км","Цагт 90 км, цагт 30 км","Цагт 80 км, цагт 20 км"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйл (Автомашин зэрэг болон трамвайн хурд): автомашины зориулалтын замд автомашины дээд хурд нь цагт 90 километр, доод хурд нь цагт 30 километр байна."},{"n":546,"b":"Хурдны замын төлбөрөө төлөөгүй тохиолдолд албадан хураах аргын буруу нь аль вэ?","c":["Банкны хадгаламж битүүмжлэх","Виртуал хөрөнгө битүүмжлэх","Албадан дуудлага худалдаа","Улсын дугаарын хавтан хураах"],"a":"4","imgs":[],"t":"문장형","e":"Хурдны замын төлбөр төлөх хугацаа хэтэрсэн үед улсын татварын өрийг барагдуулах журмын жишгээр цахим хадгаламж битүүмжлэх системийг ашиглан өртөний хадгаламж болон виртуал хөрөнгийг битүүмжилж (гаргуулан авч) төлөгдөөгүй замын төлбөрийг албадан хураах боломжтой бөгөөд битүүмжилсэн тээврийн хэрэгслийг албадан хүлээлгэн авсны дараа нээлттэй дуудлага худалдаа явуулж болно. Төлбөртэй замын тухай хуулийн 21 дүгээр зүйл, Улсын татвар хураах тухай хуулийн 31 дүгээр зүйл, Улсын татвар хураах тухай хуулийн 45 дугаар зүйлийн 5 дахь хэсэг, Улсын татвар хураах тухай хуулийн 64 дүгээр зүйлийн 1 дэх хэсэг"},{"n":547,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хувийн хөдөлгөөнт хэрэгсэл жолоочийн (13 ба түүнээс дээш насны) хууль зөрчсөн үйлдлийн зөрчлийн торгуулийн хэмжээнээс өөр нь аль вэ?","c":["Жолоодох эрхийн үнэмлэхгүйгээр жолоодох","Цагдаагийн албан хаагчийн амьсгалын согтууруулах ундааны шалгалтад хамрагдахаас татгалзах","Согтуу байдалтай жолоодох","Эмийн нөлөөгөөр хэвийн жолоодох боломжгүй байдалтай жолоодох"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын [Хавсралт 8] ①, ③, ④ нь зөрчлийн торгууль 100,000 вон, ② нь зөрчлийн торгууль 130,000 вон"},{"n":548,"b":"Замын хөдөлгөөний тухай хуулийн дагуу согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулах нөхцөлтэй жолоодох эрхийн үнэмлэх авах шаардлагад хамаарахгүй нь аль вэ?","c":["Согтуугаар жолоо барьсан зөрчилтэй хүн 5 жилийн дотор согтуу байдалтай моторт унадаг дугуй жолоодож, жолоодох эрхийн үнэмлэх нь хүчингүй болсон тохиолдол","Согтуугаар жолоо барьсан зөрчилтэй хүн 3 жилийн дотор согтуу байдалтай хувийн хөдөлгөөнт хэрэгсэл жолоодож, жолоодох эрхийн үнэмлэх нь хүчингүй болсон тохиолдол","Согтуугаар жолоо барьсан зөрчилтэй хүн 5 жилийн дотор согтуу байдалтай үедээ цагдаагийн албан хаагчийн согтууруулах ундааны шинжилгээнд хамрагдахаас татгалзаж, жолоодох эрхийн үнэмлэх нь хүчингүй болсон тохиолдол","Согтуугаар жолоо барьсан зөрчилтэй хүн 3 жилийн дотор согтууруулах ундааны шинжилгээнд саад учруулсан үйлдлийн улмаас жолоодох эрхийн үнэмлэх нь хүчингүй болсон тохиолдол"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 80-2 дугаар зүйл (Согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулах нөхцөлт жолоодох эрх)-ийн 1 дэх хэсэг: 44 дүгээр зүйлийн 1 дэх хэсэг, 2 дахь хэсэг эсвэл 5 дахь хэсгийг зөрчсөн (автомашин зэрэг эсвэл трамвай жолоодсон тохиолдлоор хязгаарлана. Гэхдээ хувийн хөдөлгөөнт хэрэгсэл жолоодсон тохиолдлыг хамааруулахгүй. Цаашид мөн адил) өдрөөс хойш 5 жилийн дотор дахин мөн зүйлийн 1 дэх хэсэг, 2 дахь хэсэг эсвэл 5 дахь хэсгийг зөрчиж жолоодох эрхийг хүчингүй болгох шийтгэл хүлээсэн хүн автомашин зэргийг жолоодох гэж буй тохиолдолд аймаг, нийслэлийн Цагдаагийн газрын даргаас согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулах нөхцөлт жолоодох эрх (цаашид \"нөхцөлт жолоодох эрх\" гэх. Цаашид мөн адил) авах ёстой."},{"n":549,"b":"Замын хөдөлгөөний тухай хуулийн дагуу техникийн гэмтэлтэй автомашин илэрвэл ( ) хоног хүртэл хугацаагаар ашиглалтыг нь түдгэлзүүлж болно. ( ) -д тохирох нь аль вэ?","c":["5","7","10","14"],"a":"3","imgs":[],"t":"문장형","e":"Аймаг, нийслэлийн Цагдаагийн газрын дарга 2 дахь хэсгийг үл харгалзан засвар үйлчилгээний байдал маш муу, аюул үүсэх эрсдэлтэй тохиолдолд тухайн тээврийн хэрэгслийн автомашины бүртгэлийн гэрчилгээг хадгалж, жолоодлогыг түр зогсоохыг тушааж болно. Энэ тохиолдолд шаардлагатай бол 10 хоногийн хүрээнд засварын хугацааг тогтоож тухайн тээврийн хэрэгслийн ашиглалтыг зогсоож болно. (Замын хөдөлгөөний тухай хуулийн 41 дүгээр зүйлийн 3 дахь хэсэг)"},{"n":550,"b":"Замын хөдөлгөөний тухай хуулийн дагуу дохионы утгын талаар зөв тайлбар 2 нь аль вэ?","c":["Шар анивчсан гэрэл – Тээврийн хэрэгсэл болон хөсөг бусад хөдөлгөөн болон аюулгүй байдлын тэмдэгт анхааран үргэлжлү үлэн явж болно.","Улаан гэрэл – Явган зорчигч явган хүний гарцаар анхааралтай гарч болно.","Ногоон сумтай гэрэл – Тээврийн хэрэгсэл болон хөсөг сум заасан чиглэлд явж болно.","Шар гэрэл – Тээврийн хэрэгсэл болон хөсөг аль хэдийн уулзварт орсон бол уулзвар дотор зогсох ёстой."],"a":"1, 3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 2] - Явган зорчигчийн гэрлэн дохионы улаан гэрэл: явган зорчигч явган хүний гарцаар гарч болохгүй. - Тээврийн хэрэгслийн гэрлэн дохионы шар гэрэл: тээврийн хэрэгсэл болон хөсөг зогсох шугам эсвэл явган хүний гарц байгаа үед түүний яг өмнө эсвэл уулзварын яг өмнө зогсох ёстой бөгөөд тээврийн хэрэгсэл, мал уналгын аль нэг хэсэг нь уулзварт аль хэдийн орсон тохиолдолд уулзвараас шуурхай гарч явах ёстой."},{"n":551,"b":"Замын хөдөлгөөний тухай хуулийн дагуу дараахын аль 2 нь “автомашин”-д хамаарах вэ?","c":["Өрөмдлөгийн машин (ачааны автомашинд суурилуулсан)","Зам тогтворжуулагч машин","Унадаг дугуй","Хүүхдийн тэргэнцэр (өргөн нь 1 метрээс ихгүй)"],"a":"1, 2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл болон Барилгын машин механизмын удирдлагын тухай хуулийн 26 дугаар зүйлийн 1 дэх хэсгийн тайлбар заалтын
