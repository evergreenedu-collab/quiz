бүтэцтэй бөгөөд дээд гадаргуугийн газраас өндөр нь ихэнхдээ 1,100 миллиметр ба түүнээс доош, чирэгч автомашины холбогчийн дээд хэсгийн өндрөөс нам хийгдсэн чиргүүл тээврийн хэрэгсэл ④ Төв тэнхлэгт чиргүүл - жигд ачсан байдал дахь хүндийн төв нь тээврийн хэрэгслийн тэнхлэгийн төвөөс урд талд байрлаж, чирэгч автомашинтай холбох төхөөрөмж нь босоо чиглэлд нугардаггүй, тээврийн хэрэгслийн нийт жингийн 10 хувь буюу 1,000 килограммаас бага ачааллыг чирэгч автомашинд хуваарилдаг бүтэцтэй, 1 ба түүнээс дээш тэнхлэгтэй чиргүүл тээврийн хэрэгсэл"},{"n":654,"b":"Их биеийн нэг хэсэг нь чирэгч автомашины дээд хэсэг дээр байрлаж, тухайн автомашин болон ачааны жингийн ихээхэн хэсгийг чирэгч автомашин дээр хуваарилдаг бүтэцтэй чиргүүл аль нь вэ?","c":["Бүтэн чиргүүл","Хагас чиргүүл","Нам шалтай чиргүүл","Төв тэнхлэгтэй чиргүүл"],"a":"2","imgs":[],"t":"문장형","e":"① Бүтэн чиргүүл - тээврийн хэрэгсэл болон ачааны жингийн ихэнх хэсгийг тухайн тээврийн хэрэгслийн өөрийн тэнхлэгээр тулдаг бүтэцтэй чиргүүл тээврийн хэрэгсэл ② Хагас чиргүүл - түүний нэг хэсэг нь чирэгч автомашины дээд хэсэгт тулж, тухайн тээврийн хэрэгсэл болон ачааны жингийн нэлээд хэсгийг чирэгч автомашинд хуваарилдаг бүтэцтэй чиргүүл тээврийн хэрэгсэл ③ Нам тавцантай чиргүүл - хүнд ачаа тээвэрлэхэд тохиромжтой, хагас чиргүүлийн бүтэцтэй бөгөөд дээд гадаргуугийн газраас өндөр нь ихэнхдээ 1,100 миллиметр ба түүнээс доош, чирэгч автомашины холбогчийн дээд хэсгийн өндрөөс нам хийгдсэн чиргүүл тээврийн хэрэгсэл ④ Төв тэнхлэгт чиргүүл - жигд ачсан байдал дахь хүндийн төв нь тээврийн хэрэгслийн тэнхлэгийн төвөөс урд талд байрлаж, чирэгч автомашинтай холбох төхөөрөмж нь босоо чиглэлд нугардаггүй, тээврийн хэрэгслийн нийт жингийн 10 хувь буюу 1,000 килограммаас бага ачааллыг чирэгч автомашинд хуваарилдаг бүтэцтэй, 1 ба түүнээс дээш тэнхлэгтэй чиргүүл тээврийн хэрэгсэл"},{"n":655,"b":"Чиргүүлийн онцлогийн талаар тайлбар юм. Хамгийн тохирох нь аль вэ?","c":["Их бие нь хүнд тул тоормослох зай нь энгийн суудлын автомашинаас богино.","Эгнээг огцом солих үед хазайх эсвэл онхолдох эрсдэл өндөр.","Жолоочийн суудал өндөр тул урд явж буй тээврийн хэрэгсэл бодитоос илүү ойр харагддаг.","Их бие том тул дотоод дугуйн зөрүүтэй бараг хамааралгүй."],"a":"2","imgs":[],"t":"문장형","e":"① Их бие хүнд бол тоормосны зай уртасна. ② Их бие урт тул хөмрөх, онхолдох аюул өндөр бөгөөд огцом эгнээ солих үед эвхдэг хутганы үзэгдэл үүсч болно. (Эвхдэг хутганы үзэгдэл - чиргүүлтэй автомашины урд хэсэг огцом эгнээ сольсон ч ард холбогдсон чингэлэг нь эгнээ сольсон чиглэл рүү явахгүй, явж байсан чиглэлээрээ шууд үсрэн гарах үзэгдэл) ③ Чиргүүлтэй автомашин нь жолоочийн суудал өндөр тул урд явах тээврийн хэрэгсэл бодит хоорондын зайнаас хол харагдаж аюулгүй зайг хангахгүй байх хандлага (жолооч аюулгүй зай хангагдсан гэж андуурдаг)-тай байдаг. ④ Их бие урт, том тул дотор дугуйн зөрүү их үүсдэг."},{"n":656,"b":"Дараах зүйлсийн аль нь том оврын ачааны автомашины эргэлтийн болон савлалтын онцлогийн талаар хамгийн зөв тайлбар вэ?","c":["Савлалтын өнцөг нь төвөөс зугтах хүчинд төдийлөн нөлөөлдөггүй.","Савлалтын өнцөг нь тээврийн хэрэгслийн хүндийн төвийн өндрөөс төдийлөн хамаардаггүй.","Ачааны төрөл болон ачсан байрлалаас шалтгаалан эргэлтийн радиус болон тогтвортой байдал ихээхэн өөрчлөгдөж болно.","Савлалтын өнцөг нь суудлын автомашинаас бага тул араас мөргөх осол гаргах магадлал өндөр."],"a":"3","imgs":[],"t":"문장형","e":"Том оврын ачааны автомашины эргэлтийн радиус, тогтвортой байдал нь ачааны төрөл, ачсан байрлалаас хамаарч ихээхэн өөрчлөгдөж болох бөгөөд чичиргээний өнцөг нь автомашины төвөөс зугтах хүч, хүндийн төвийн өндөрт ихээхэн нөлөөлдөг ба чичиргээний өнцөг нь суудлын автомашинаас их байдаг."},{"n":657,"b":"Чиргүүл жолоодож буй жолоочийн мөрдөх үүргийн талаар хамгийн зөв тайлбар аль нь вэ?","c":["Зөвхөн хөдөлгөөнөө дуусгасны дараа тээврийн хэрэгслийн өдөр тутмын үзлэг, шалгалтыг хийх ёстой.","Үндэслэлгүйгээр ачаа тээвэрлэхээс татгалзаж болохгүй.","Тээврийн хэрэгслийн цэвэр байдлыг зөвхөн тээврийн хөлс өндөр үед сайн байлгана.","Ачаа унахаас хамгаалах бүтээлэг, сав баглаа боодол зэргийг зөвхөн очих газартаа хүрсний дараа шалгана."],"a":"2","imgs":[],"t":"문장형","e":"Жолооч ашиглалтын өмнө ачсан ачаа унахаас сэргийлэх бүрээс, баглаа боодлыг бат бөх хийж, үргэлж цэвэр байлгаж, тээврийн хэрэгслийн өдөр тутмын үзлэг, шалгалтыг ашиглалтын өмнө төдийгүй ашиглалтын дараа ч тогтмол хийх ёстой."},{"n":658,"b":"Дараахын аль нь нэг чиглэлд 3 эгнээтэй хурдны замд чирэгч автомашин явах ёстой эгнээ вэ? (Автобусны тусгай эгнээ байхгүй)","c":["1-р эгнээ","Зүүн эгнээ","Баруун эгнээ","Бүх эгнээ"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 9-ийг үзнэ үү."},{"n":659,"b":"Дараах зүйлсийн аль нь байнгын 4 дугуйн хөтлөгчтэй автомашиныг чирэгч автомашинаар чирэх хамгийн зөв арга вэ?","c":["Автомашины арын хэсгийг өргөж чирнэ.","Байнгын 4 дугуйн хөтлөгчтэй автомашиныг бүхэлд нь өргөж чирнэ.","Хөтлөгчийн төрөл болон чирэх арга хоорондоо хамааралгүй.","Чирүүлж байгаа бүх автомашины зогсоолын тоормосыг заавал татсан байх ёстой."],"a":"2","imgs":[],"t":"문장형","e":"Аврах чирэгч автомашинаар байнгын 4 дугуйн хөтлөгчтэй автомашиныг чирэх тохиолдолд тээврийн хэрэгслийг бүхэлд нь өргөж ачааны тэвшинд ачиж тээвэрлэх ёстой."},{"n":660,"b":"Автомашины удирдлагын тухай хуулийн дагуу аврах зориулалтын тусгай тээврийн хэрэгслийн нарийвчилсан шалгуур аль нь вэ?","c":["Зөвхөн чирэх зориулалтын бүтэцтэй байх.","Чирэх болон аврах боломжтой бүтэцтэй байх.","Эвдрэл, осол зэрэг шалтгаанаар хөдөлгөөнд оролцох боломжгүй болсон автомашиныг аврах, чирэх боломжтой бүтэцтэй байх.","Дээрх аль ч төрөлд хамаарахгүй тусгай зориулалтын ажлын бүтэцтэй байх."],"a":"3","imgs":[],"t":"문장형","e":"Автомашины удирдлагын тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 1: Тусгай автомашины дотроос аврах төрлийн төрөл тус бүрийн нарийвчилсан шалгуур нь эвдрэл, осол зэргээс ашиглахад хүндрэлтэй болсон автомашиныг аварч чирэх боломжтой бүтэцтэй байхыг хэлнэ."},{"n":661,"b":"Автомашин болон автомашины эд ангийн гүйцэтгэл, стандартыг тогтоох журмын дагуу автомашины уртын дээд хэмжээ хэд вэ? (Холбогдсон тээврийн хэрэгсэл биш)","c":["13 метр","14 метр","15 метр","16 метр"],"a":"1","imgs":[],"t":"문장형","e":"Автомашин болон автомашины эд ангийн чанар, стандартын тухай дүрмийн 4 дүгээр зүйл (Урт, өргөн, өндөр) ① Автомашины урт, өргөн, өндөр нь дараах шалгуураас хэтэрч болохгүй. 1. Урт: 13 метр (холбоот автомашины хувьд 16.7 метрийг хэлнэ) 2. Өргөн: 2.5 метр (шууд бус харааны төхөөрөмж, агааржуулах төхөөрөмж буюу гадагш нээгддэг цонхны хувьд эдгээр төхөөрөмжийн өргөн нь суудлын автомашинд 25 сантиметр, бусад автомашинд 30 сантиметр. Гэхдээ чиргүүл тээврийн хэрэгслийн өргөн нь чирэгч автомашины өргөнөөс өргөн тохиолдолд тухайн чирэгч автомашины шууд бус харааны төхөөрөмж л чиргүүл тээврийн хэрэгслийн хамгийн гадна талаас 10 сантиметрээс илүү гарч болохгүй) 3. Өндөр: 4 метр"},{"n":662,"b":"Зам тээврийн ослын газар дээр хүрэлцэн ирсэн чирэгч автомашины жолоочийн хамгийн зөв үйлдэл аль нь вэ?","c":["Осолд орсон автомашины жолоочийн жолоодох эрхийн үнэмлэхийг хураан авна.","Очмогцоо осолд орсон автомашиныг чирж засварын газар руу хүргэнэ.","Жолоочтой болон автомашины засварын зардлын талаар тохиролцоно.","Жолоочийн гэмтлийн байдлыг шалгаж, хоёрдогч ослоос урьдчилан сэргийлэх аюулгүй байдлын арга хэмжээ авна."],"a":"4","imgs":[],"t":"문장형","e":"Аврах чирэгч автомашины жолооч ослыг шийдвэрлэх захиргааны ажил гүйцэтгэх эрхгүй тул ослын газрыг хэвээр хадгалах ёстой. Гэхдээ шархадсан хүнийг аврах болон хоёрдогч (2 дахь) ослоос сэргийлэх зорилгоор орчны нөхцөл байдалд тохирсон аюулгүй байдлын арга хэмжээ авч болно."},{"n":663,"b":"Чирэгч автомашины жолоочийн хамгийн зөв үйлдэл аль нь вэ?","c":["Эвдэрсэн автомашин гарвал шуурхай очиж ямар ч нөхцөлгүйгээр чирнэ.","Чирүүлж буй автомашиныг чирэхдээ хууль, дүрмийг мөрдөж аюулгүйгээр чирнэ.","Чирэгч автомашины явсан зайны төлбөр өндөр үед л аюулгүй явна.","Осол гарсан үед ослын газар хүрэхдээ гэрлэн дохиог үл тоомсорлож болно."],"a":"2","imgs":[],"t":"문장형","e":"Аврах чирэгч автомашины жолооч түргэн шуурхай очих боловч хууль сахин жолоодох ёстой бөгөөд тээврийн хэрэгслийн эзний саналыг үл тоомсорлох буюу ослын газрыг эвдэж гэмтээх тохиолдол гаргаж болохгүй."},{"n":664,"b":"Чирэгч автомашин замын захаар эвдэрсэн автомашиныг чирэн хөдөлгөөний эгнээнд орох үед хамгийн их анхаарах зүйл аль нь вэ?","c":["Хурдны замын урд хэсэгт тогтмол хурдтай явж буй автомашинуудыг анхаарах.","Чирүүлж буй автомашинд сууж байгаа хүмүүсийн аюулгүй байдлыг анхаарах.","Үндсэн хөдөлгөөний эгнээгээр өндөр хурдтай явж буй автомашинуудыг анхаарах.","Чирэгч автомашин ихэд анзаарагддаг тул онцгой анхаарах шаардлагагүй."],"a":"3","imgs":[],"t":"문장형","e":"Аврах чирэгч автомашин замын захаас эвдэрсэн тээврийн хэрэгслийг чирч явах эгнээнд орох тохиолдолд явах эгнээгээр явж буй араас ирэх тээврийн хэрэгслийн хөдөлгөөнд саад болохгүй байхаар анхаарч орох ёстой. Чирүүлж буй автомашинд суухад хууль зүйн хязгаарлалт байхгүй ч ялангуяа чирэгч автомашины аюулгүй байдлыг хангахын зэрэгцээ суугчийн аюулгүй байдлын үүднээс чирэгч автомашины жолооч чирүүлж буй автомашинд хүн суулгадаггүй."},{"n":665,"b":"Гэмтсэн хүнтэй ослын газар дээр чирэгч автомашины жолоочийн авсан арга хэмжээнээс хамгийн тохиромжгүй нь аль вэ?","c":["Гэмтсэн хүний ухаан санааны байдлыг шалгасан.","Гэмтсэн хүний амьсгалын байдлыг шалгасан.","Гэмтсэн хүний цус алдалтын байдлыг шалгасан.","Шууд чирэх бэлтгэл хийж, эвлэрэхийг шахсан."],"a":"4","imgs":[],"t":"문장형","e":"Ослын газарт ослын тээврийн хэрэгслийн талуудыг ослыг шийдвэрлэхгүй байхаар өдөөх буюу ослын талаар эвлэрэхийг шахаж болохгүй."},{"n":666,"b":"Дараах зүйлсийн аль нь чирэгч автомашины төрөл бүрийн төхөөрөмжийн талаар зөв тайлбар вэ?","c":["Краны үндсэн биед байрлах краны гар хэсгийг дэгээ (hook) гэдэг.","Байгууламжийг чирэх үед чирэгч автомашинтай холбодог төхөөрөмжийг хүч дамжуулах төхөөрөмжийн (PTO) унтраалга гэдэг.","Ажиллах үед тогтвортой байдлыг хангахын тулд урд болон хойд хажуу талд байрлуулсан төхөөрөмжийг тогтворжуулах тулгуур гэдэг.","Кранд суурилуулсан, утсан олсонд өлгөгдсөн дэгээ хэлбэртэй хүнд ачаа өргөх төхөөрөмжийг өргөх гар гэдэг."],"a":"3","imgs":[],"t":"문장형","e":"① Краны сум: краны их биед бэхлэгдсэн краны гар хэсэг ② Чирэх гурвалжин: байгууламжийг чирэх үед аврах чирэгч автомашинтай холбох төхөөрөмж, PTO унтраалга: кран болон аврах өргүүрт шаардагдах хүч нь тээврийн хэрэгслийн PTO (хүч гаргах төхөөрөмж)-оос гардаг. ③ Тулгуур хөл (аутригер): ажлын үед тогтвортой байдлыг хангахын тулд урд, хойд хажуу талд бэхэлсэн байгууламж ④ Дэгээ: кранд суурилуулсан, дэгээ хэлбэртэй, ган татлагаас өлгөгдөж хүнд ачааг өлгөх төхөөрөмж"},{"n":667,"b":"Чирэгч автомашины жолооч урд хөдөлгүүртэй, урд дугуйн хөтлөгчтэй (Front engine Front wheel drive) хэлбэрийн эвдэрсэн автомашиныг аврах хамгийн зөв арга аль нь вэ?","c":["Автомашины урд хэсгийг өргөж чирнэ.","Автомашины хойд хэсгийг өргөж чирнэ.","Урд эсвэл хойд хэсгийг өргөх нь ялгаагүй.","Заавал автомашиныг бүхэлд нь өргөж чирнэ."],"a":"1","imgs":[],"t":"문장형","e":"FF (урд хөдөлгүүрт урд дугуйн хөтлөгчтэй) төрлийн урд дугуйн хөтлөгчтэй тээврийн хэрэгсэл нь хөдөлгүүр урд талдаа байрлаж, урд дугуйгаар хөтлөгддөг тул гэмтэхээс сэргийлж их биеийн урд хэсгийг өргөж чирдэг."},{"n":668,"b":"Чирэгч автомашины жолооч зам тээврийн ослын газар дээр авсан арга хэмжээ юм. Хамгийн зөвийг сонгоно уу.","c":["Зам тээврийн осолд оролцогчдоос иргэний журмаар эвлэрэхийг шаардав.","Зам тээврийн осолд оролцогчдын хүсэл зоригоос үл хамааран шууд чирэх арга хэмжээ авсан.","Өдрийн цагаар сайн харагддаг тул тусгай аюулгүй байдлын арга хэмжээ авахгүйгээр чирэх бэлтгэл хийсэн.","Осолд оролцогчийг сэтгэл санаагаа тайвшруулахад нь эхлээд тусалсан."],"a":"4","imgs":[],"t":"문장형","e":"Зам тээврийн ослын талуудыг эвлэрэхийг шахах зэргээр ослыг шийдвэрлэхэд оролцож болохгүй бөгөөд өдрийн цагт ч аюулгүй байдлын арга хэмжээ авах ёстой."},{"n":669,"b":"Чирэгч автомашины жолооч зам тээврийн ослын газар дээр гэмтсэн хүн олсон үед авах хамгийн зөв арга хэмжээ аль нь вэ?","c":["Яриа өдөх эсвэл мөрөн дээр нь зөөлөн товшин гэмтсэн хүний ухаан санааны байдлыг шалгана.","Гэмтсэн хүн ухаангүй байвал хиймэл амьсгал хийнэ.","Ясны хугаралтай хүнийг нэн даруй чиг тавьж, түргэн тусламж ирэх хүртэл хүлээнэ.","Хүчтэй цус алдалтын үед цус алдаж буй хэсгийг зүрхнээс доош байрлуулна."],"a":"1","imgs":[],"t":"문장형","e":"Эмнэлгийн мэргэжлийн мэдлэггүй энгийн хүний хувьд ухаан санааны байдлыг шалгах нь хамгийн чухал бөгөөд 119-д мэдэгдэж түргэн тусламжийн ажилтан (эмнэлгийн мэргэжилтэн)-аас шархадсан хүнд үзүүлэх тусламжийн зааварчилгаа авч биелүүлэн, түргэн тусламжийг хүлээх нь зүйтэй. Зөвхөн нүдээр харж дүгнээд хийх яаруу үйлдэл нь илүү хүнд гэмтэл, хойшхи үр дагаварт хүргэх магадлал өндөр."},{"n":670,"b":"Зам тээврийн ослын газар дээр хүрэлцэн ирсэн чирэгч автомашины жолооч гэмтсэн хүнд яаралтай тусламж үзүүлэх ёстой шалтгаанаас хамгийн хамаарал багатай нь аль вэ?","c":["Гэмтсэн хүнийг түргэн тээвэрлэхийн тулд","Гэмтсэн хүний амь насыг хамгаалахын тулд","Гэмтсэн хүний эд хөрөнгийг хамгаалахын тулд","Гэмтсэн хүний амь аврагдах магадлалыг нэмэгдүүлэхийн тулд"],"a":"3","imgs":[],"t":"문장형","e":"Шархадсан хүнд үзүүлэх яаралтай тусламж нь амь насыг аврах, амьд үлдэх хувийг нэмэгдүүлэх, мэргэжлийн эмчилгээ авахуулахаар тээвэрлэхийг анхаарч байх ёстой бөгөөд аль болох мэргэжлийн эмнэлгийн ажилтны эмчилгээ авахуулахын тулд зайлшгүй шаардлагатай хамгийн бага хэмжээнд хийх анхны тусламж шаардлагатай. Зөвхөн эд хөрөнгө хамгаалах зорилготой үйлдлийг анхны тусламжийн үндэслэл гэж үзэж болохгүй."},{"n":671,"b":"Дараах зүйлсийн аль нь автомашин явж байх үед эсвэл огцом тоормослох үед автомашины арын хэсэг баруун, зүүн тийш савлах үзэгдлийг илэрхийлэх нэр томьёо вэ?","c":["Арын хэсэг хажуу тийш савлах үзэгдэл (Fishtailing)","Усан хальтиргааны үзэгдэл (Hydroplaning)","Дугуйн долгион үүсэх үзэгдэл (Standing wave)","Уурын түгжээ үүсэх үзэгдэл (Vapor lock)"],"a":"1","imgs":[],"t":"문장형","e":"«Fishtailing» гэдэг нь явах буюу огцом тоормослох үед их биеийн хойд хэсэг загасны сүүлний сэлүүр мэт зүүн баруун тийш савлах үзэгдэл юм. «Hydroplaning» гэдэг нь усанд норсон замын гадаргуу дээр өндөр хурдтай явах үед дугуй замын гадаргуутай шүргэлцэхгүй болж жолоодох чадвар алдагдах буюу боломжгүй болох байдлыг хэлнэ. «Standing wave» гэдэг нь автомашин өндөр хурдтай явах үед дугуйн замтай хүрэлцэх хэсэгт дулаан хуримтлагдаж хэв гажилт үүсэх үзэгдэл юм. «Vapor lock» гэдэг нь тоормосны шингэнд хийн бөмбөлөг үүсч тоормос зохих ёсоор ажиллахгүй болох үзэгдлийг хэлнэ."},{"n":672,"b":"Дараах зүйлсийн аль нь чирэгч автомашины жолоочийн хамгийн зөв үйлдэл вэ?","c":["Гал гарсан үед анхан шатны галыг унтраахын тулд гал унтраах төхөөрөмжийг автомашинд байнга авч явна.","Ослын газар аль болох хурдан хүрэхийн тулд төв шугам давж явна.","Хөнгөн ослын үед жолооч нарыг хооронд нь эвлэрэхийг шаардана.","Зам тээврийн осолд орсон жолооч болон зорчигчийг осолд орсон автомашинд нь суулгасан хэвээр чирнэ."],"a":"1","imgs":[],"t":"문장형","e":"Аврах чирэгч автомашины жолооч ослын газарт хамгийн түрүүнд очих боломжтой тул тээврийн хэрэгсэлд гал гарсан үед эхний шатанд унтраах боломжтой гал унтраах хэрэгслийг бэлэн байлгах нь зүйтэй. Хурдан очихын тулд замын хөдөлгөөний дүрэм зөрчих буюу газар дээр нь эвлэрэхийг шахах нь хийж болохгүй үйлдэл бөгөөд осолд орсон тээврийн хэрэгсэлд хүн суулгах үйлдэл нь туйлын аюултай тул хэзээ ч хийж болохгүй."},{"n":673,"b":"Хурдны дээд хязгаар нь цагт 100 км байдаг хурдны зам дээр чирэгч автомашин цагт 145 км хурдтай явж байгаад хурд хэтрүүлсэн зөрчил гаргасан байна. Оноох торгуулийн оноо болон зөрчлийн торгууль хэд вэ?","c":["Торгуулийн 70 оноо, зөрчлийн торгууль 140,000 вон","Торгуулийн 60 оноо, зөрчлийн торгууль 130,000 вон","Торгуулийн 30 оноо, зөрчлийн торгууль 100,000 вон","Торгуулийн 15 оноо, зөрчлийн торгууль 70,000 вон"],"a":"2","imgs":[],"t":"문장형","e":"Аврах чирэгч автомашин нь Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлийн 1 дэх хэсгийн 3 дахь заалтын \"б\" дэд заалтад хамаарах тул цагт 100 километрийн хурдны хязгаартай нэг чиглэлд 2 эгнээтэй хурдны зам дээр хурдны дээд хязгаар нь цагт 80 километр болох бөгөөд Автомашины удирдлагын тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 1-ийн дагуу тусгай автомашинд ангилагдаж, тусгай автомашин нь Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8 болон Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28-ын дагуу олон суудалт автомашин зэрэгт багтдаг тул ② зөв хариулт болно."},{"n":674,"b":"Дараах зүйлсийн аль нь чирэгч автомашины жолооч автомашиндаа будалт эсвэл тэмдэглэгээ хийх боломжтой вэ?","c":["Замын хөдөлгөөний хяналтын автомашинтай төстэй будалт болон тэмдэглэгээ","Гэмт хэрэг мөрдөн шалгах автомашинтай төстэй будалт болон тэмдэглэгээ","Тусгай зориулалтын тээврийн хэрэгсэлтэй төстэй будалт болон тэмдэглэгээ","Онцгой нөхцөл байдал үүссэн үед холбоо барих жолоочийн утасны дугаар"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 42 дугаар зүйл (Төстэй тэмдэглэгээний хязгаарлалт болон ашиглалтыг хориглох), 27 дугаар зүйл. Мөн хуулийг хэрэгжүүлэх журмын 27 дугаар зүйл (Төстэй тэмдэглэгээ, будалт зэргийн хүрээ): Хуулийн 42 дугаар зүйлийн 2 дахь хэсгийн дагуу автомашин зэрэг (хувийн хөдөлгөөнт хэрэгслийг оролцуулахгүй)-т хязгаарлагдах будалт буюу тэмдэглэгээ зэрэг нь дараах заалтуудтай адил байна. 1. Тусгай зориулалтын тээврийн хэрэгсэл гэж андуурч болох будаг буюу тэмдэглэгээ 2. Хараалын үг илэрхийлэх буюу садар самуун үйлдлийг дүрслэх зэргээр бусдад жигшил төрүүлэх зураг, тэмдэг буюу үсэг"},{"n":675,"b":"Чирэгч автомашины жолооч хойд хөдөлгүүртэй, хойд дугуйн хөтлөгчтэй (Rear engine Rear wheel drive) хэлбэрийн эвдэрсэн автомашиныг аврах хамгийн зөв арга аль нь вэ?","c":["Автомашины урд хэсгийг өргөж чирнэ.","Автомашины хойд хэсгийг өргөж чирнэ.","Урд эсвэл хойд хэсгийг өргөх нь ялгаагүй.","Заавал автомашиныг бүхэлд нь өргөж чирнэ."],"a":"2","imgs":[],"t":"문장형","e":"RR (хойд хөдөлгүүрт хойд дугуйн хөтлөгчтэй) төрлийн хойд дугуйн хөтлөгчтэй тээврийн хэрэгсэл нь хөдөлгүүр ард байрлаж, хойд дугуйгаар хөтлөгддөг тул гэмтэхээс сэргийлж их биеийн хойд хэсгийг өргөж чирдэг."},{"n":676,"b":"Зам тээврийн ослын газарт очиж буй чирэгч автомашины жолоочийн жолоодох аргаас хамгийн зөв нь аль вэ?","c":["Аль болох хурдан хүрэх нь хамгийн чухал тул эсрэг урсгалын эгнээгээр явна.","Тусгай зориулалтын тээврийн хэрэгсэлд хамаарах тул хурдны дээд хязгаарыг давж явна.","Хурдны зам дээр түгжрэл үүсвэл дуут дохио өгч замын захаар явна.","Хурдан хүрэх нь чухал боловч зам тээврийн ослоос урьдчилан сэргийлэхийн тулд аюулгүй жолоодно."],"a":"4","imgs":[],"t":"문장형","e":"Зам тээврийн ослын газарт ойртох тохиолдолд чирэх ажил авахын төлөөх өрсөлдөөнөөс болж сэтгэл зүйн дарамтад орж зам тээврийн осол үүсгэх магадлал өндөрсдөг тул аюулгүй жолоодох ёстой."},{"n":677,"b":"Дараах зүйлсийн аль нь автомашины удирдлагын тухай хуульд заасан тусгай зориулалтын тээврийн хэрэгслийн ангилалд хамаарахгүй вэ?","c":["Чирэх зориулалтын тусгай тээврийн хэрэгсэл","Тусгай зориулалтын тусгай тээврийн хэрэгсэл","Аврах зориулалтын тусгай тээврийн хэрэгсэл","Хотын хийн шугамын яаралтай сэргээн засварлах зориулалтын тусгай тээврийн хэрэгсэл"],"a":"4","imgs":[],"t":"문장형","e":"Автомашины удирдлагын тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 1] Автомашины төрөл (2 дугаар зүйлтэй холбоотой): Тусгай автомашиныг төрлөөр нь чирэх төрөл, аврах төрөл, тусгай зориулалтын төрөл гэж ангилдаг."},{"n":678,"b":"1-р ангиллын тусгай жолоодох эрхийн үнэмлэхийн жижиг оврын чирэгч автомашины жолоодох эрхийн үнэмлэхийн ур чадварын шалгалтын талаар тайлбар юм. Зөв нь аль вэ?","c":["Жижиг оврын чирэгч автомашины жолоодох эрхийн үнэмлэхийн тэнцэх шалгуур нь 100 онооноос 90 ба түүнээс их оноо авах.","Жижиг оврын чирэгч автомашины шалгалтад нугаралт, муруй зам, чиглэл өөрчлөх, жолоодлогын маршрутыг туулах ёстой.","Жижиг оврын чирэгч автомашины шалгалтын замын хэсэг бүрийг 5 минутын дотор туулах ёстой.","Жижиг оврын чирэгч автомашины шалгалтын замын хэсэг бүрийн шалгах шугамд хүрээгүй бол тус бүр 5 оноо хасна."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 66 дугаар зүйл, мөн хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 24] Ур чадварын шалгалтын дүгнэх шалгуур, тэнцэх шалгуур: Жижиг оврын чирэгч автомашины жолоодох эрхийн ур чадварын шалгалтад нугалаат зам, тахир зам, чиглэл өөрчлөх замыг даван туулах ёстой бөгөөд зам тус бүрт 3 минут хэтрэх үед, мэдрэгч шугамд хүрэх үед, чиглэл өөрчлөх замын баталгаажуулах шугамд хүрээгүй үед тус бүр 10 оноо хасна. Тэнцэх шалгуур нь 90 ба түүнээс дээш оноо юм."},{"n":679,"b":"Чирэгч автомашинаар эвдэрсэн автомашиныг чирэх үед чирүүлж байгаа автомашин ямар гэрлийг асаах ёстой вэ?","c":["Урд гэрэл, аюулын дохионы гэрэл анивчих","Урд гэрэл, арын гэрэл","Арын гэрэл, оворын гэрэл, улсын дугаарын гэрэл","Зүүн чиг заах дохио"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 37 дугаар зүйл, мөн хуулийг хэрэгжүүлэх журмын 19 дүгээр зүйл: Чирүүлж буй тээврийн хэрэгсэл арын гэрэл, оврын гэрэл, улсын дугаарын гэрлээ асаах ёстой."},{"n":680,"b":"Чирэгч автомашины жолоочийн мөрдөх ёстой зүйлээс зөв нь аль вэ?","c":["Цагдаагийн радио холбоог чагнахыг зарим тохиолдолд зөвшөөрдөг.","Чирэгч автомашины жолооч Замын хөдөлгөөний тухай хуулийг заавал мөрдөх ёстой.","Зам тээврийн осол гарсан үед очих чирэгч автомашин хурд хэтрүүлж болно.","Чирэгч автомашин зам тээврийн ослын үед гэрлэн дохиог үл тоомсорлон явж болно."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 22 дахь заалтад тусгай зориулалтын тээврийн хэрэгслийг гал унтраах автомашин, түргэн тусламжийн автомашин, цус нийлүүлэх тээврийн хэрэгсэл, цагдаагийн автомашин зэргээр хязгаарласан бөгөөд аврах чирэгч автомашин үүнд ордоггүй. Иймд аврах чирэгч автомашин тусгай зориулалтын тээврийн хэрэгсэлд олгодог онцгой эрх (гэрлэн дохио зөрчих, хурд хэтрүүлэх зэрэг)-ийг эдлэх боломжгүй, Замын хөдөлгөөний тухай хуулийг заавал дагаж мөрдөх ёстой бөгөөд аврах чирэгч автомашины жолооч цагдаагийн радио холбоог чагнах нь хууль бус юм."},{"n":681,"b":"Дараах нөхцөлд буруу зорчих арга 2-ыг сонгоно уу.","c":["Чигээрээ явах бол ногоон гэрлээр явна.","Зүүн эргэх бол өөдөөс ирэх хөдөлгөөнд анхааран ногоон гэрлээр эргэнэ.","Зүүн эргэх бол ногоон суман зүүн эргэх гэрлээр эргэнэ.","1-р эгнээнээс баруун эргэх бол зогсох шугамын өмнө түр зогсоод удаан хөдөлнө.","Баруун эргэх бол урьдчилан замын баруун зах руу орж удаан хөдөлнө."],"a":"3, 4","imgs":["img_0000.jpg"],"t":"사진형","e":"Зураг дээрх гэрлэн дохио нь хэвтээ гурван өнгийн гэрлэн дохио бөгөөд улаан, шар, ногоон гэрлээс бүрдэх ба зүүн эргэлтийн сумтай гэрэл ороогүй. Ийм хэвтээ гурван өнгийн гэрлэн дохио болон хамгаалалтгүй зүүн эргэлтийн тэмдэг суурилуулсан бол эсрэг талын хөдөлгөөнд анхаарч зүүн эргэлт хийж болно. Бүх тээврийн хэрэгслийн жолооч уулзварт баруун эргэлт хийх гэж буй тохиолдолд урьдчилан замын баруун захаар удаан явж баруун эргэх ёстой. Энэ тохиолдолд баруун эргэж буй тээврийн хэрэгслийн жолооч дохионы дагуу зогсох буюу явж буй явган зорчигч буюу унадаг дугуй зэрэгт анхаарах ёстой (Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйлийн 1 дэх хэсэг)."},{"n":682,"b":"Дараах нөхцөлд буруу зорчих арга 2-ыг сонгоно уу.","c":["Гэрэл солигдохоос өмнө уулзварыг гарахын тулд аль болох хурдаа нэмэгдүүлнэ.","\"+\" хэлбэрийн уулзварт баруун эргэхийн тулд үргэлж 1-р эгнээгээр явна.","Ногоон гэрэлтэй үед чигээрээ явах эсвэл баруун эргэж болно.","Улаан гэрэлтэй үед зогсох шугамын өмнө зогсоно.","Улаан гэрэлтэй үед зогсох шугамын өмнө түр зогсоод баруун эргэж болно."],"a":"1, 2","imgs":["img_0001.jpg"],"t":"사진형","e":"Таксины зогсоолын ойролцоо такси руу суух, буух зорчигч буюу зөвшөөрөлгүй газраар гарах гэж буй явган зорчигч байх магадлал өндөр тул эргэн тойрноо ажиглан хурдаа сааруулж жолоодох нь аюулгүй. Бүх тээврийн хэрэгслийн жолооч уулзварт баруун эргэлт хийх гэж буй тохиолдолд урьдчилан замын баруун захаар удаан явж баруун эргэх ёстой (Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйлийн 1 дэх хэсэг)."},{"n":683,"b":"Дараах нөхцөлд буруу зорчих арга 2-ыг сонгоно уу.","c":["1-р эгнээнээс ногоон гэрлээр баруун эргэж болно.","1-р эгнээнээс зүүн эргэх суман гэрлээр зүүн эргэж болно.","2-р эгнээнээс ногоон гэрлээр чигээрээ явж болно.","3-р эгнээнээс улаан гэрэлтэй үед зогсох шугамын өмнө түр зогсоод баруун эргэж болно.","3-р эгнээнээс ногоон гэрлээр чигээрээ явж уулзвар дотор байрлах аюулгүйн бүсэд зогсоно."],"a":"1, 5","imgs":["img_0002.jpg"],"t":"사진형","e":"Бүх тээврийн хэрэгслийн жолооч уулзварт баруун эргэлт хийх гэж буй тохиолдолд урьдчилан замын баруун захаар удаан явж баруун эргэх ёстой (Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйлийн 1 дэх хэсэг). 3 дугаар эгнээгээр явж байхад урд талд барилгын ажлын талбай 3, 4 дүгээр эгнээнд байвал хурдаа сааруулан чиг заах дохиог асааж урьдчилан 2 дугаар эгнээ рүү шилжих ёстой. Бүх тээврийн хэрэгсэл аюулгүйн арал зэрэг орохыг хориглосон газарт орж болохгүй."},{"n":684,"b":"Дараах нөхцөлөөс ойлгож болох мэдээллээс буруу 2-ыг сонгоно уу.","c":["Урд талд явган хүний гарц байна.","Урд талын тээврийн хэрэгслийн гэрлэн дохио ногоон байна.","Замын баруун талд унадаг дугуйн зориулалтын зам байна.","Энэ замын хурдны хязгаар цагт 30 км байна.","Урд явж буй автомашинууд тоормосны дөрөө ашиглаж байна."],"a":"4, 5","imgs":["img_0003.jpg"],"t":"사진형","e":"Энэ газар нь хүүхдийн хамгаалалтын бүс юм. Хүүхдийн хамгаалалтын бүс дэх хөдөлгөөний хурдыг цагт 30 километрийн дотор хязгаарлаж болно (Замын хөдөлгөөний тухай хуулийн 12 дугаар зүйлийн 1 дэх хэсэг). Гэхдээ цагт 30 километрийн шалгуураас өөр хөдөлгөөний хурд тогтоосон хүүхдийн хамгаалалтын бүс ч олон байдаг. Тоормосны дөрөөг гишгэхэд автомашины ар талд суурилуулсан тоормосны гэрэл асдаг. Зураг дээрх нөхцөлд хурдны дээд хязгаарыг тодорхойлж болох тэмдэглэгээ харагдахгүй бөгөөд урд явж буй 2 тээврийн хэрэгслийн аль алиных нь тоормосны гэрэл асаагүй байна."},{"n":685,"b":"Дараах нөхцөлөөс ойлгож болох мэдээлэл болон түүнд тохирох зөв жолоодох аргыг холбосноос буруу 2-ыг сонгоно уу.","c":["Явган хүний гарц – Баруун, зүүнээ сайн харж, явган зорчигчид анхаарна.","Зорчих хэсэг дээр байгаа хүн – Хурдыг сааруулах зэрэг аюулгүй байдалд анхаарна.","Хэвтээ байрлалтай хоёр өнгийн дохио – Улаан \"X\" тэмдэгтэй эгнээгээр явна.","Хувьсах эгнээ – Нөхцөл байдлаас шалтгаалан явах эгнээ өөрчлөгдөж болно.","Замын голын шар тасархай шугам – Гүйцэж түрүүлэх үед ч огт давж болохгүй шугам."],"a":"3, 5","imgs":["img_0004.jpg"],"t":"사진형","e":"Аймаг, нийслэлийн Цагдаагийн газрын дарга цагийн байдлаас хамаарч хоёр чиглэлийн хөдөлгөөний эрчим илт ялгаатай замд хөдөлгөөн ихтэй тал руу эгнээний тоог нэмэгдүүлэх боломжтой байхаар гэрлэн дохиогоор эгнээний явах чиглэлийг заадаг хувьсах эгнээ суурилуулж болно (Замын хөдөлгөөний тухай хуулийн 14 дүгээр зүйлийн 1 дэх хэсэг). Хувьсах эгнээгээр тогтоосон замын хэсгийн орох, дунд болон гарах хэсэгт хэвтээ хоёр өнгийн гэрлэн дохио суурилуулна (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 3]). Ногоон сумтай гэрэл (доош чиглэсэн) асах үед тээврийн хэрэгсэл заасан эгнээгээр явж болох бөгөөд улаан X тэмдэгтэй гэрэл асах үед тухайн эгнээгээр явж болохгүй (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 2]). Төвийн шугамын дотроос шар үргэлжилсэн шугам нь тээврийн хэрэгсэл давж болохгүйг тэмдэглэдэг бөгөөд шар тасархай шугам нь эсрэг чиглэлийн хөдөлгөөнд анхаарч түр зуур эсрэг талын эгнээ рүү давж болох боловч явах чиглэлийн эгнээндээ буцаж орох ёстойг тэмдэглэдэг (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] дугаар 501)."},{"n":686,"b":"Дараах нөхцөлөөс ойлгож болох мэдээлэл болон түүнд тохирох зөв жолоодох аргыг холбосноос буруу 2-ыг сонгоно уу.","c":["Явган хүний гарцын урьдчилан анхааруулах тэмдэглэл – Урд талд удахгүй явган хүний гарц гарч ирэх тул анхааралтай жолоодно.","Эгнээний баруун талын давхар шар үргэлжилсэн шугам – Явган хүний зам дээр хэсэгчлэн гаргаж түр зогсохыг зөвшөөрнө.","Зам мөстсөн байгаа тул хурдны дээд хязгаараас 20 хувиар бууруулсан хурдтай явна.","Урд талын цас цэвэрлэх автомашин – Ажлын автомашинтай хангалттай аюулгүйн зай барьж явна.","Баруун урд түр зогссон ачааны автомашин – Хүн зорчих хэсэг рүү гэнэт гарч ирж болзошгүй тул анхаарч жолоодно."],"a":"2, 3","imgs":["img_0005.jpg"],"t":"사진형","e":"Шар давхар шугам нь зогсох, зогсоолд тавихыг хориглох тэмдэглэгээ юм (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] дугаар 516-ын 2). Түүнчлэн явган хүний зам дээр зогсох болон зогсоолд тавихыг хориглоно (Замын хөдөлгөөний тухай хуулийн 32 дугаар зүйлийн 1 дэх заалт). Замын гадаргуу хөлдсөн тохиолдолд хурдны дээд хязгаарын 100-ны 50-аар бууруулсан хурдаар явах ёстой (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлийн 2 дахь хэсгийн 2 дахь заалтын \"б\" дэд заалт). Бороо орж замын гадаргуу норсон тохиолдолд буюу цас 20 миллиметрээс бага зузаантай хуримтлагдсан тохиолдолд хурдны дээд хязгаарын 100-ны 20-оор бууруулсан хурдаар явах ёстой (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлийн 2 дахь хэсгийн 1 дэх заалт)."},{"n":687,"b":"Дараах нөхцөлд жолоодох аргуудаас буруу 2-ыг сонгоно уу.","c":["Унадаг дугуйны жолооч зүүн эргэх бол 1-р эгнээнд зүүн эргэх дохиог хүлээнэ.","Хувийн хөдөлгөөнт хэрэгслийн жолооч зүүн эргэх бол 2-р эгнээнд зүүн эргэх дохиог хүлээнэ.","Хоёр дугуйт тээврийн хэрэгслийн жолооч зүүн эргэх бол 2-р эгнээнд зүүн эргэх дохиог хүлээнэ.","Суудлын автомашины жолооч баруун эргэх бол явган зорчигчид анхааран баруун эргэнэ.","Ачааны автомашины жолооч баруун эргэх бол урьдчилан замын баруун захыг ашиглан баруун эргэнэ."],"a":"1, 2","imgs":["img_0006.jpg"],"t":"사진형","e":"Унадаг дугуй зэргийн жолооч уулзварт зүүн эргэлт хийх гэж буй тохиолдолд урьдчилан замын баруун захад шахаж удаан явангаа уулзварын захын хэсгийг ашиглан зүүн эргэх ёстой (Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйлийн 3 дахь хэсэг). \"Унадаг дугуй зэрэг\" гэж унадаг дугуй болон хувийн хөдөлгөөнт хэрэгслийг хэлнэ (Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 21 дэх заалтын 2)."},{"n":688,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Цагт 30 км-ээс ихгүй хурдтай жолоодно.","Урд талын баруун байрлах худалдааны төвийн газрын доорх зогсоол руу 10 м-ийн дараа орох бол түр зогсоод аюулгүй эсэхийг шалган удаан орно.","Урд талын зүүн байрлах худалдааны төвийн газрын доорх зогсоол руу 10 м-ийн дараа орох бол бүрэн зогсоод аюулгүй эсэхийг шалган удаан орно.","Зүүн эргэх бол урьдчилан чиг заах дохиогоо өгч, уулзварын төвийн гадна талаар удаан эргэнэ.","Хот суурин газарт хувийн хөдөлгөөнт хэрэгсэл жолоодохдоо явган хүний замаар явна."],"a":"1, 2","imgs":["img_0007.jpg"],"t":"사진형","e":"Урд 10 метрийн зайд зүүн талын худалдааны байрны газар доорх зогсоол руу орохын тулд төвийн шугам давж жолоодох шаардлагатай болно. Бүх тээврийн хэрэгслийн жолооч уулзварт зүүн эргэлт хийх гэж буй тохиолдолд урьдчилан замын төвийн шугамыг дагаж удаан явангаа уулзварын төвийн дотор талыг ашиглан зүүн эргэх ёстой (Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйлийн 2 дахь хэсэг). Хувийн хөдөлгөөнт хэрэгсэл жолоодох үед зориулалтын зам байхгүй тохиолдолд зорчих хэсгээр явах ёстой."},{"n":689,"b":"Дараах нөхцөлөөс ойлгож болох мэдээлэл болон түүний тайлбарыг холбосноос буруу 2-ыг сонгоно уу.","c":["Хүүхэд хамгаалах тэмдэг – Энэ нь хүүхдийн хамгаалалтын бүс бөгөөд хүүхдийг онцгойлон хамгаалах бүс юм.","Хурдны дээд хязгаарын тэмдэг – Цагт 30 км-ээс ихгүй хурдтай жолоодно.","Явган хүний гарцын тэмдэг – Явган зорчигчид анхаарч жолоодно.","Улаан анивчдаг гэрэл – Удаан хөдөлж жолоодно.","Замын баруун талд зогсоолд тавьсан автомашинууд – Тэдгээрийн дундаас явган зорчигч гэнэт гарч ирж болзошгүйг анхаарна."],"a":"1, 4","imgs":["img_0008.jpg"],"t":"사진형","e":"Баруун талд зогссон тээврийн хэрэгсэл нь хүүхдийн сургуулийн автобус юм. Хүүхдийн сургуулийн автобусны ар талд байрлуулсан тэмдэг нь хүүхэд хамгаалах тэмдэг бөгөөд хүүхэд буюу нялх, бага насны хүүхэд тээвэрлэн явж байгааг илэрхийлдэг (Замын хөдөлгөөний тухай хуулийн 53 дугаар зүйлийн 1 дэх хэсэг, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 14]). Хүүхдийн хамгаалалтын бүсэд байрлуулах хүүхэд хамгаалах тэмдэг нь Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] дугаар 324-ийн адил байрлуулагдсан байх ёстой. Зураг дээр хүүхдийн хамгаалалтын бүсэд байрлуулдаг хүүхэд хамгаалах тэмдэг байхгүй. Улаан гэрэл анивчихын утга нь зогсох шугам буюу явган хүний гарц байгаа үед тээврийн хэрэгсэл түүний яг өмнө буюу уулзварын яг өмнө түр зогссоны дараа бусад хөдөлгөөнд анхаарч явж болно гэсэн үг юм (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 2])."},{"n":690,"b":"Дараах замын нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Тээврийн хэрэгслийн гэрэл улаан тул тайван хүлээнэ.","Явган зорчигч удаан явж байгаа тул дуут дохио өгч хурдан гарахыг шаардана.","Эгнээг жигд солихын тулд зогсох шугам давж хажуугийн автомашины өмнө зогсож болно.","Хөдөлгөөнийг саадгүй болгохын тулд гэрэл солигдохыг урьдчилан тооцож огцом хөдөлнө.","Зогсох шугам байгаа тул заавал мөрдөж, гэрлээ хүлээнэ."],"a":"1, 5","imgs":["q690.png"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 2, гэрлэн дохионы илэрхийлэх дохионы төрөл болон дохионы утга, Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах)-ийн 1 дэх хэсэг. Бүх тээврийн хэрэгсэл буюу трамвайн жолооч явган зорчигч явган хүний гарцаар гарч байгаа буюу гарах гэж байгаа үед явган зорчигчийн гарахад саад учруулахгүй, аюул учруулахгүйн тулд тухайн явган хүний гарцын өмнө (зогсох шугам тэмдэглэсэн газарт тухайн зогсох шугамыг хэлнэ) түр зогсох ёстой (②, ③, ⑤-ын тайлбар). Явган хүний замаас гэнэт үсрэн гарах явган зорчигч байж болох тул таамаглах болон огцом хөдлөх нь аюултай жолоодлогын арга юм (④-ийн тайлбар)."},{"n":691,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох аргаас зөв 2-ыг сонгоно уу.","c":["Уулзварт баруун эргэхдээ явган хүний гарц эсвэл зогсох шугамын өмнө зогсолгүй удаан явж гарна.","Явган зорчигч гарцаар гарч байгаа тул бүрэн гарч дуустал нь хүлээнэ.","Явган хүний гарц руу гүйж ирж буй хүн байвал дуут дохио өгч хурдан баруун эргэнэ.","Баруун эргэх үед үзэгдэх орчныг сайжруулахын тулд явган хүний гарц дээр зогсоно.","Урд талын тээврийн хэрэгслийн гэрэл улаан тул заавал түр зогсож, бүх явган зорчигчийг гаргасны дараа удаан баруун эргэж болно."],"a":"2, 5","imgs":["img_0009.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 2. Тээврийн хэрэгслийн гэрлэн дохио, улаан гэрлийн утга. 2. Тээврийн хэрэгсэл баруун эргэлт хийх гэж буй тохиолдолд зогсох шугам, явган хүний гарц болон уулзварын яг өмнө зогссоны дараа дохионы дагуу явж буй бусад тээврийн хэрэгслийн хөдөлгөөнд саад учруулахгүйгээр баруун эргэж болно (①, ⑤-ын тайлбар). Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах)-ийн 1 дэх хэсэг. Бүх тээврийн хэрэгсэл буюу трамвайн жолооч явган зорчигч явган хүний гарцаар гарч байгаа буюу гарах гэж байгаа үед явган зорчигчийн гарахад саад учруулахгүй, аюул учруулахгүйн тулд тухайн явган хүний гарцын өмнө (зогсох шугам тэмдэглэсэн газарт тухайн зогсох шугамыг хэлнэ) түр зогсох ёстой (②, ③, ④-ийн тайлбар)."},{"n":692,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Явган зорчигч байгаа тул аюулгүй гарах боломжийг хангахын тулд удаан явах эсвэл түр зогсож аюулгүй эсэхийг шалгаад явна.","Ойр орчимд түр зогссон болон зогсоолд тавьсан автомашинуудын дундаас явган зорчигч гарч ирж болзошгүй тул анхаарч явна.","Хүүхдийн хамгаалалтын бүс биш тул жолооч явган зорчигчийг хамгаалах үүрэггүй.","Зүүн талын дэлгүүр орох бол уулзварын буланд түр зогсох эсвэл зогсоолд тавьж болно.","Орон сууцны нарийн гудамжинд зогсоолд тавьсан автомашин болон явган зорчигч олон байдаг тул дуут дохиог байнга өгч явна."],"a":"1, 2","imgs":["img_0010.jpg"],"t":"사진형","e":"Хүүхдийн хамгаалалтын бүс биш ч гэсэн явган зорчигч болон унадаг дугуйгаар сургуульдаа явдаг сурагчид олон орон сууцны хорооллын туслах зам тул хүндэтгэн үзэх шалтгаангүйгээр дуут дохиог тасралтгүй дуугаргахаас зайлсхийж аюулгүй явах нь зүйтэй. Уулзварын булан нь зогсох, зогсоолд тавихыг хориглосон газар тул зогсох, зогсоолд тавьж болохгүй."},{"n":693,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Баруун эргэх эгнээгээр явж байхдаа чигээрээ явах бол цагаан үргэлжилсэн шугамтай хэсэгт эгнээ сольж болно.","Баруун эргэх зориулалтын гурван өнгийн гэрэл улаан байсан ч явган хүний гарцаар гарч буй явган зорчигч байхгүй бол баруун эргэж болно.","Баруун эргэх зориулалтын гурван өнгийн гэрэл улаан тул зогсож, ногоон болсны дараа баруун эргэнэ.","Чигээрээ явах эгнээнд ногоон гэрэл байсан ч явган зорчигч байж болзошгүй тул аюулгүй эсэхийг шалган баруун эргэнэ.","Баруун эргэх зориулалтын гурван өнгийн гэрэл ногоон байсан ч явган зорчигч байж болзошгүй тул аюулгүй эсэхийг шалган баруун эргэнэ."],"a":"3, 5","imgs":["img_0011.jpg"],"t":"사진형","e":"Баруун эргэлтийн гурван өнгийн гэрлэн дохионы өмнө баруун эргэх гэж буй үед тухайн дохионы дагуу явах ёстой бөгөөд баруун эргэлтийн гурван өнгийн гэрлэн дохио ногоон сумтай гэрэл асаж байсан ч хожуу гарч буй явган зорчигч байж болох тул түүний аюулгүй байдлыг ч шалгах ёстой. Баруун эргэлтийн эгнээ байгаа тохиолдолд тухайн эгнээг дагаж баруун эргэх ёстой бөгөөд цагаан үргэлжилсэн шугамтай хэсэгт эгнээ солихыг хязгаарладаг."},{"n":694,"b":"Дараах нөхцөлд замын хөдөлгөөний аюулгүй байдлын тэмдгийн талаарх хамгийн зөв тайлбар 2-ыг сонгоно уу.","c":["Автомашины зориулалтын замын тэмдэг нь автомашинаас бусад тээврийн хэрэгсэл нэвтрэхийг хориглоно гэсэн утгатай.","Хамгаалалтгүй зүүн эргэлтийн тэмдэг байгаа тул тээврийн хэрэгслийн гэрлэн дохионоос үл хамааран аюулгүй бол зүүн эргэж болно.","Баруун талын давхар шар шугам нь түр хугацаагаар зогсоолд тавьж болно гэсэн тэмдэглэгээ юм.","Баруун урд байрлах автомашины дүрстэй цэнхэр тэмдэг нь замын хөдөлгөөний аюулгүй байдлын заах тэмдэг юм.","Уулзварын зогсох шугамын өмнөх цагаан үргэлжилсэн шугам нь урд талд уулзвар байгааг анхааруулсан тэмдэглэгээ юм."],"a":"1, 4","imgs":["q694.png"],"t":"사진형","e":"Баруун талын шар өнгийн тэмдэг нь Замын тухай хуулийн дагуух тэмдэг бөгөөд цэнхэр автомашинаар дүрсэлсэн тэмдэг нь аюулгүйн тэмдэглэгээний дотроос автомашины зориулалтын замыг илэрхийлэх заах тэмдэг юм. Цагаан үргэлжилсэн шугам нь эгнээ солихыг хязгаарлах шугамыг илэрхийлдэг бөгөөд хамгаалалтгүй зүүн эргэлтийг тээврийн хэрэгслийн гэрлэн дохио ногоон гэрэлтэй үед хийх ёстой ба баруун талын үргэлжилсэн шар давхар шугам нь зогсох, зогсоолд тавихыг хориглох утгатай."},{"n":695,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Явах чиглэлийн урд талд автомашин байхгүй тул хурдтай явна.","Зүүн тийш мурийсан уруудах замд урд талын нөхцөл байдлыг харахад хүндрэлтэй тул урьдчилан хурдаа бууруулж уулзварт орно.","Орон сууцны хорооллоос зам руу гарч ирэх автомашин байж болзошгүй тул урьдчилан бэлтгэлтэй явна.","Өөдөөс ирж буй автомашин зүүн эргэх гэж байгаа бол чигээрээ явж буй автомашин үргэлж давуу эрхтэй тул дуут дохио өгч үргэлжлүүлэн явна.","Орон сууцны хорооллын орох, гарах үүд нь явган зорчигч олонтой газар боловч харагдахгүй тул дуут дохио өгч хурдаа нэмэгдүүлэн явна."],"a":"2, 3","imgs":["img_0012.jpg"],"t":"사진형","e":"Зүүн тийш тахирсан замд урд талын нөхцөл байдлыг харахад хүндрэлтэй тул удаан явж ойртох нь аюулгүй. Гэрлэн дохиогүй уулзварын хувьд шулуун явж буй тээврийн хэрэгсэл ямар ч нөхцөлд давуу эрхтэй байдаггүй бөгөөд орон сууцны хорооллоос зам руу гарах тээврийн хэрэгсэл буюу явган зорчигч байхад бэлтгэж дуут дохио дуугаргахаас илүү удаан явж аюулгүй байдлыг шалгах нь зүйтэй."},{"n":696,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Замын баруун талд явган зорчигч байгаа тул өндөр хурдтай өнгөрнө.","Орчныг харахад хүндрэлтэй газарт замын тусгал толиор хөдөлгөөний нөхцөл байдлыг шалгана.","Зүүн талын нарийн гудамжинд автомашин байгаа тул уулзварт орохоос өмнө сайн ажиглаж, удаан явж уулзварт орно.","Баруун тийш мурийсан өгсүүр замд урд талын нөхцөл байдлыг харахад хүндрэлтэй тул дуут дохиог тасралтгүй өгч явна.","Өөдөөс уруудаж ирж буй автомашин байсан ч өгсөж буй автомашин үргэлж давуу эрхтэй тул хурд бууруулахгүй явна."],"a":"2, 3","imgs":["img_0013.jpg"],"t":"사진형","e":"Замын толиор зүүн талын гудамжны аюулгүй байдлыг тодорхой шалгаж, уулзварт орохын өмнө удаан явж гэрлэн дохиогүй уулзварыг өнгөрөх нь аюулгүй бөгөөд баруун талд явган зорчигч байгаа тул дуут дохио дуугаргахаас илүү аюулгүй байдлыг хангаж удаан явах буюу түр зогсон явах нь аюулгүй. Замын хөдөлгөөний тухай хуулийн 20 дугаар зүйлийн дагуу налуу нарийн замд бие биенийхээ эсрэг явах тохиолдолд өгсөж буй тээврийн хэрэгсэл зам тавьж өгөх ёстой."},{"n":697,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Урд талын тээврийн хэрэгслийн гэрэл улаан тул зогсох шугамын өмнө урьдчилан хурдаа бууруулж аюулгүй зогсоно.","Зүүн талд хүүхдийн хамгаалалтын бүс дууссаны тэмдэг байгаа тул одоо явж буй замд хүүхдийн аюулгүй байдалд онцгой анхаарах шаардлагагүй.","Зүүн эргэх бол урьдчилан 1-р эгнээгээр яваа арын автомашинуудыг сайн ажиглаж, аюулгүйгээр эгнээгээ солино.","Баруун эргэх бол 3-р эгнээнд дохио хүлээж буй автомашиныг тойрон явган хүний замаар баруун эргэнэ.","Замын баруун талын шар үргэлжилсэн шугам нь түр зогсохыг зөвшөөрч, зогсоолд тавихыг хориглодог тул түр зогсож болно."],"a":"1, 3","imgs":["img_0014.jpg"],"t":"사진형","e":"Урд талын тээврийн хэрэгслийн гэрлэн дохио улаан гэрэлтэй тохиолдолд урьдчилан удаан явж уулзварын өмнө аюулгүй зогсох бөгөөд зүүн тийш эгнээ солих гэж буй тохиолдолд араас зүүн талын эгнээгээр явж буй тээврийн хэрэгсэл байгаа эсэхийг шалгаж жолоодох ёстой. Хүүхдийн хамгаалалтын бүс дууссаныг заах тэмдэг байгаа тохиолдолд тэр хүртэл хүүхдийн хамгаалалтын бүс гэж тооцогдох бөгөөд 3 дугаар эгнээ нь шулуун болон баруун эргэлтийн эгнээ тул ард зогсож баруун эргэх зай гартал хүлээх нь зүйтэй ба замын баруун талын шар үргэлжилсэн шугам нь зогсох, зогсоолд тавихыг хориглосон бүсийг тэмдэглэдэг тул зогсохыг ч хориглоно."},{"n":698,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Гурван өнгийн гэрэлтэй уулзварт буцах эргэлтийн тэмдэг байхгүй байсан ч бусад тээврийн хэрэгсэл болон хөсөгт саад болохгүй бол буцах эргэлт хийж болно.","Зигзаг хэлбэрийн цагаан үргэлжилсэн шугам нь эгнээ солихыг хориглосон шугам тул эгнээ сольж болохгүй.","Зигзаг хэлбэрийн цагаан үргэлжилсэн шугам нь удаан явахыг илэрхийлдэг тул хурдаа бууруулж удаан явна.","1-р эгнээгээр явж байхдаа баруун эргэх бол ард автомашин байхгүй үед чиг заах дохио өгөөд 3-р эгнээ рүү нэг дор шилжинэ.","Урд талын гурван өнгийн гэрэл удахгүй улаан болж болзошгүй тул ногоон байсан ч зогсох шугамын өмнө огцом тоормослон хүлээнэ."],"a":"2, 3","imgs":["img_0015.jpg"],"t":"사진형","e":"Гурван өнгийн гэрлэн дохио суурилуулсан уулзварт буцаж эргэх тэмдэг байхгүй бол тээврийн хэрэгсэлд саад болох эсэхээс үл хамааран буцаж эргэхийг зөвшөөрдөггүй бөгөөд зигзаг хэлбэрийн цагаан үргэлжилсэн шугам нь эгнээ солихыг хязгаарлах шугам болон удаан явах гэсэн утгыг нэгэн зэрэг агуулдаг ба баруун эргэх гэж буй тохиолдолд 1 эгнээгээр урьдчилан эгнээ солих нь аюулгүй бөгөөд боломжгүй тохиолдолд P хэлбэрийн эргэлтийг ашиглан явах нь аюулгүй. Урд талын тээврийн хэрэгслийн гэрлэн дохио улаан гэрэл болж өөрчлөгдөж болзошгүй тул үүнийг урьдчилан тооцож хурдаа сааруулан удаан явах нь аюулгүй арга боловч ногоон гэрэлтэй байхад огцом зогсох нь араас ирэх тээврийн хэрэгсэлтэй мөргөлдөх эрсдэлтэй тул аюултай."},{"n":699,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Баруун эргэх бол зам чөлөөтэй байгаа тул чигээрээ явах эгнээнээс шууд баруун эргэнэ.","Урд талд хөдөө аж ахуйн машин явж байгаа тул дуут дохиог тасралтгүй өгч хурдаа нэмээд уулзварыг гарна.","Баруун талын газар доорх замаас орж ирэх автомашиныг харахад хүндрэлтэй тул хурдаа бууруулж уулзварт орно.","Хөдөлгөөний ачаалал багатай зам тул замын баруун талд зогсоолд тавьж болно.","Зам хөндлөн гарах гэж буй явган зорчигч байвал түр зогсож, аюулгүй байдлыг нь хангаад үргэлжлүүлэн явна."],"a":"3, 5","imgs":["img_0016.jpg"],"t":"사진형","e":"Шар гэрэл анивчих үед тээврийн хэрэгсэл бусад хөдөлгөөн буюу аюулгүйн тэмдэглэгээний заалтад анхаарч явж болно. Зам дээр хөдөө аж ахуйн машин явж байгаа тохиолдолд хурд нь удаан тул аюулгүй байдалд анхаарч явна. Баруун талын газар доорх замын харагдах байдал хангагдаагүй тохиолдолд уулзварт орохдоо анхаарна."},{"n":700,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Урд талын тээврийн хэрэгслийн гэрэл шар болсон тул аажмаар хурдаа бууруулж, зогсох шугамын өмнө зогсоно.","1, 2-р эгнээний арын хөдөлгөөнийг шалгасны дараа ард автомашин байхгүй бол эгнээгээ сольж 1-р эгнээнээс буцах эргэлт хийж болно.","Хажуугийн 4, 5-р эгнээнд байгаа цагаан автомашин болон автобусыг эхэлж өнгөрүүлсний дараа эгнээгээ сольж баруун эргэж болно.","Цагаан үргэлжилсэн шугамтай хэсэг тул эгнээ сольж болохгүй.","Урд талын тээврийн хэрэгслийн гэрэл шар болсон тул хурдаа нэмэгдүүлж урд автомашины араас даган уулзварыг гарна."],"a":"1, 4","imgs":["img_0017.jpg"],"t":"사진형","e":"Бүх жолооч замын хөдөлгөөний аюулгүй байдлын тэмдэг, гэрлэн дохионы заалтыг дагаж мөрдөх ёстой (Замын хөдөлгөөний тухай хуулийн 5 дугаар зүйл). Шар гэрэлтэй үед тээврийн хэрэгсэл зогсох шугам буюу явган хүний гарц байгаа бол түүний яг өмнө буюу уулзварын яг өмнө зогсох ёстой бөгөөд тээврийн хэрэгслийн аль нэг хэсэг нь уулзварт аль хэдийн орсон тохиолдолд уулзвараас түргэн гарах ёстой (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 2]). Мөн цагаан үргэлжилсэн шугамтай хэсэгт эгнээ солихыг хориглодог тул эгнээ сольж буцаж эргэх буюу баруун эргэхийг оролдох нь хууль зөрчсөн бөгөөд аюултай жолоодлогын үйлдэл юм. ⑤ дугаар хувилбар нь шар дохиог үл тоомсорлон хурдаа нэмж уулзварыг өнгөрөх явдал бөгөөд хууль зөрчсөн төдийгүй уулзвар доторх мөргөлдөөний магадлал өндөр тул том зам тээврийн осол үүсгэж болзошгүй."},{"n":701,"b":"Дараах нөхцөлд буруу жолоодох арга 2-ыг сонгоно уу.","c":["Чигээрээ явах бол зогсох шугамын өмнө зогсоно.","Буцаж эргэх бол урд талд автомашин байхгүй үед 2-р эгнээнээс уулзвараар дамжин аюулгүй буцаж эргэнэ.","Зорчигч буулгах бол явган хүний гарцын өмнө түр зогсоно.","Баруун эргэх бол зогсох шугамын өмнө түр зогсоод удаан явж баруун эргэнэ.","Явган хүний гарцыг ашиглах үед унадаг дугуйнаасаа бууж түрэн гарна."],"a":"2, 3","imgs":["img_0018.jpg"],"t":"사진형","e":"Уулзварт ногоон, шар, улаан гурван өнгийн гэрэл л гардаг гэрлэн дохио суурилуулсан бөгөөд үүнээс гадна хамгаалалтгүй зүүн эргэлтийн тэмдэглэгээ буюу буцаж эргэхийг зөвшөөрсөн тэмдэглэгээ байхгүй бол тээврийн хэрэгслийн зүүн эргэлт буюу буцаж эргэхийг зарчмын хувьд зөвшөөрдөггүй. Иймд дээрх уулзварт улаан гэрэлтэй үед зогсох шугам дээр зогсолгүй зүүн эргэх буюу буцаж эргэж явсан бол энэ нь онцгой нөхцөл байдал байхгүй л бол Замын хөдөлгөөний тухай хуулийн 5 дугаар зүйлийн заалтын дагуух гэрлэн дохионы дохиог зөрчиж жолоодсон тохиолдолд хамаарна гэж үзэх ёстой (Дээд шүүх, 1996. 5.)."},{"n":702,"b":"Дараах нөхцөлөөс ойлгож болох мэдээлэл болон түүний тайлбарыг холбосноос буруу 2-ыг сонгоно уу.","c":["Замын баруун талд зогсоолд тавьсан автомашин – Зогсоолын журам зөрчсөн байна.","Явган хүний гарцын урьдчилан анхааруулах тэмдэглэл – Урд талд удахгүй явган хүний гарц гарч ирнэ.","Зорчих хэсгийн баруун талын шар үргэлжилсэн шугам – Зогсоолд тавихыг хориглоно, харин түр зогсохыг зөвшөөрнө.","Явган хүний зам – Унадаг дугуйны жолооч явган хүний замаар явах ёстой.","Хурд сааруулагч – Хурдаа сааруулан жолоодох нь зөв."],"a":"3, 4","imgs":["img_0019.jpg"],"t":"사진형","e":"Шар үргэлжилсэн шугам нь зогсох, зогсоолд тавихыг хориглох тэмдэглэгээ юм (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] дугаар 516). Зогсох, зогсоолд тавихыг зөвшөөрсөн цагаас бусад үед зогсох, зогсоолд тавихыг хориглоно. Унадаг дугуй зэргийн жолооч унадаг дугуйн зам байгуулаагүй газарт замын баруун захад шахаж явах ёстой (Замын хөдөлгөөний тухай хуулийн 13-2 дугаар зүйл-ын 2 дахь хэсэг). Гэхдээ хүүхэд, ахмад настан, бие махбодийн бэрхшээлтэй хүний хувьд явган хүний зам дээр унадаг дугуй унаж болно (Замын хөдөлгөөний тухай хуулийн 13-2 дугаар зүйл-ын 4 дэх хэсгийн 1 дэх заалт)."},{"n":703,"b":"Дараах нөхцөлтэй холбоотой тайлбараас зөв 2-ыг сонгоно уу.","c":["Удаан явж байх үед жолооч гар утас ашиглаж болно.","Түр зогссон үед жолооч гар утас ашиглаж болно.","Удаан явж байх үед гар утас ашиглаж болохгүй боловч дүрс харуулах төхөөрөмжийг ажиллуулж болно.","Хотын замд жолооч аюулгүйн бүсээ заавал бүслэх үүрэгтэй.","Хотын замд зорчигч аюулгүйн бүсээ бүслэх үүрэггүй."],"a":"2, 4","imgs":["img_0020.jpg"],"t":"사진형","e":"Автомашин зогсож байгаа нөхцөлд гар утас хэрэглэж болно (Замын хөдөлгөөний тухай хуулийн 49 дүгээр зүйлийн 1 дэх хэсгийн 10 дахь заалтын \"а\" дэд заалт). Газарзүйн заавар дүрс буюу замын хөдөлгөөний мэдээллийн дүрс харуулдаг дүрс харуулах төхөөрөмж (ихэвчлэн навигаци)-ийг жолооч жолоодож байхдаа харж болох байрлалд дүрс харагдахаар байрлуулж болно (Замын хөдөлгөөний тухай хуулийн 49 дүгээр зүйлийн 1 дэх хэсгийн 11 дэх заалтын \"б\" дэд заалтын 1). Замын төрлөөс үл хамааран хамт зорчигч ч хамгаалах бүс зүүх ёстой (Замын хөдөлгөөний тухай хуулийн 50 дугаар зүйлийн 1 дэх хэсэг)."},{"n":704,"b":"Дараах нөхцөлд жолооч бүрийн буруу жолоодох арга 2-ыг сонгоно уу.","c":["Унадаг дугуйны жолооч – Зорчих хэсгийн хамгийн баруун талаар бусад тээврийн хэрэгслийг гүйцэж түрүүлж болно.","Цахилгаан кик скүүтерийн жолооч – Жолооч болон зорчигч хоёулаа хамгаалалтын малгай өмссөн үед л хөдөлгөөнд оролцож болно.","Хоёр дугуйт тээврийн хэрэгслийн жолооч – Түгжрэлийг тойрон гарахын тулд төвийн автобусны тусгай эгнээгээр явж болно.","Суудлын автомашины жолооч – Түгжрэлийн үед араас мөргөх ослоос сэрэмжлэн жолоодно.","Автобусны жолооч – Автобусны тусгай эгнээгээр яваагүй үед төвийн автобусны гэрлэн дохиог бус, тээврийн хэрэгслийн гэрлэн дохиог дагана."],"a":"2, 3","imgs":["img_0021.jpg"],"t":"사진형","e":"Цахилгаан скүүтерийн суудлын багтаамж нь 1 хүн юм (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 33-3 дугаар зүйл). Зориулалтын эгнээгээр явж болох тээврийн хэрэгсэл биш бол зориулалтын эгнээгээр явж болохгүй (Замын хөдөлгөөний тухай хуулийн 15 дугаар зүйлийн 3 дахь хэсэг)."},{"n":705,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зогсоолд тавьсан автомашины ар талаас явган зорчигч гарч ирж болзошгүйг анхааран жолоодно.","Баруун талын явган зорчигчоос хангалттай зай авч, түр зогсох эсвэл удаан явж өнгөрнө.","Цас орж зам халтиргаатай тул хурдаа нэмэгдүүлэн хурдан явна.","Цастай замд хурдны дээд хязгаараас 20 хувиар нэмэгдүүлж явна.","Явган зорчигчийн гэнэтийн үйлдлээс сэргийлэхийн тулд дуут дохиог тасралтгүй өгч явна."],"a":"1, 2","imgs":["img_0022.jpg"],"t":"사진형","e":"Бүх тээврийн хэрэгслийн жолооч явган хүний зам, зорчих хэсэг ялгаагүй замын дотроос төвийн шугамгүй замд явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явах ёстой бөгөөд явган зорчигчийн явахад саад болох үед удаан явах буюу түр зогсож явган зорчигчийг аюулгүй явах боломжоор хангах ёстой (Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 6 дахь хэсгийн 1 дэх заалт). Тээврийн хэрэгслийн жолооч зам (явган хүний зам, зорчих хэсэг ялгасан замд зорчих хэсгийг хэлнэ)-ын төв (төвийн шугам тэмдэглэсэн тохиолдолд тухайн төвийн шугамыг хэлнэ. Цаашид мөн адил)-ийн баруун талын хэсгээр явах ёстой (Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйлийн 3 дахь хэсэг). Цаг агаарын хүнд нөхцөлд бэлтгэж хурд бууруулах заалтыг хэрэглэнэ. Хурдны дээд хязгаарын 100-ны 20-оор бууруулсан хурдаар явах ёстой тохиолдол нь бороо орж замын гадаргуу норсон тохиолдол, цас 20 миллиметрээс бага зузаантай хуримтлагдсан тохиолдол бөгөөд хурдны дээд хязгаарын 100-ны 50-аар бууруулсан хурдаар явах ёстой тохиолдол нь ширүүн бороо, их цас, манан зэргээс үзэгдэх орчин 100 метрийн дотор байгаа тохиолдол, замын гадаргуу хөлдсөн тохиолдол, цас 20 миллиметр ба түүнээс дээш зузаантай хуримтлагдсан тохиолдол юм (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлийн 2 дахь хэсэг)."},{"n":706,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Автобусны ард дуут дохиог тасралтгүй өгч хурдан явахыг шаардана.","Орчны нөхцөл байдлыг шалгасны дараа 1-р эгнээ рүү шилжинэ.","Аюулын дохионы гэрэл анивчуулж, хурдаа нэмээд 1-р эгнээ рүү шилжинэ.","1-р эгнээ рүү шилжих үед автобусны урдаас гарч ирэх явган зорчигчид анхаарах шаардлагагүй.","1-р эгнээний ард автомашин байвал хүчээр эгнээ солихгүй, автобусны ард хүлээнэ."],"a":"2, 5","imgs":["img_0023.jpg"],"t":"사진형","e":"Хүндэтгэн үзэх шалтгаангүйгээр дуут дохиог тасралтгүй дуугаргах үйлдлээс зайлсхийх ёстой бөгөөд эгнээ солих үед чиг заах дохиог асааж урд, хойд тээврийн хэрэгслийн аюулгүй байдлыг шалгасны дараа явах ёстой ба харагдах байдал хангагдаагүй тохиолдолд явган зорчигчийн аюулгүй байдалд анхаарах ёстой."},{"n":707,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Дуут дохиог тасралтгүй өгч явган зорчигчид анхааруулан хурдаа нэмэгдүүлж явна.","Төв шугамын зүүн талын явган зорчигчийн гэнэтийн үйлдэлд бэлтгэх шаардлагагүй.","Зогсоолд тавьсан автомашинуудын дундаас автомашин гэнэт хөдөлж болзошгүй тул урд болон хоёр талыг ажиглан удаан явна.","Баруун талын явган зорчигчоос хангалттай зай авч, аюулгүй байдлыг ханган удаан явна.","Орон сууцны хороололд ерөнхийдөө төв шугамын зүүн талаар явах нь аюулгүй."],"a":"3, 4","imgs":["img_0024.jpg"],"t":"사진형","e":"Хүндэтгэн үзэх шалтгаангүйгээр дуут дохиог тасралтгүй дуугаргах үйлдлээс зайлсхийх ёстой бөгөөд явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явж явган зорчигчийг аюулгүй явах боломжоор хангах ёстой. Төвийн шугам давж зүүн талаар явах үйлдлийг онцгой нөхцөл байдлаас бусад тохиолдолд хориглоно."},{"n":708,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Аюулгүй байдлын үүднээс дуут дохиог тасралтгүй өгч явна.","Зүүн талын явган хүний замаар явж буй явган зорчигчид анхаарах шаардлагагүй.","Аюулын дохионы гэрэл анивчуулж, хурдаа нэмэн хурдан явна.","Баруун талаас хөдөлж буй суудлын автомашинтай хангалттай аюулгүйн зай барьж удаан явна.","Орон сууцны хорооллын нарийн гудамж тул явган зорчигч гарч ирж болзошгүйг тооцож хурдаа бууруулна."],"a":"4, 5","imgs":["img_0025.jpg"],"t":"사진형","e":"Хүндэтгэн үзэх шалтгаангүйгээр дуут дохиог тасралтгүй дуугаргах үйлдлээс зайлсхийх ёстой бөгөөд орон сууцны хорооллын туслах замд гэнэтийн нөхцөл байдлыг урьдчилан тооцож хамгаалалтын, зам тавьж өгөх жолоодлого хийх ёстой."},{"n":709,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Удаан явж эсвэл түр зогсон зам хөндлөн гарч буй явган зорчигчийг хамгаална.","Зам хөндлөн гарч буй явган зорчигчийг хамгаалах үүрэггүй тул хурдан явна.","Баруун талд зогсоолд тавьсан автомашины хаалга онгойж болзошгүй тул анхаарч явна.","Зогсоол хүрэлцэхгүй бол урд талын зүүн талын улаан хашлагатай хэсэгт зогсоолд тавьж болно.","Зогсоолд тавьсан автомашины араас хүн гарч ирэхийг анхаарах шаардлагагүй тул хурдаа нэмэгдүүлж явж болно."],"a":"1, 3","imgs":["img_0026.jpg"],"t":"사진형","e":"Явган зорчигч явган хүний гарц байгуулаагүй замаар гарч байгаа үед аюулгүй зай барьж удаан явах буюу түр зогсож явган зорчигчийг аюулгүй гарах боломжоор хангах ёстой. Зогсоолд тавьсан тээврийн хэрэгслийн хаалга нээгдэх тохиолдолд бэлтгэж жолоодох нь аюулгүй. Гал унтраах усны цоргоны өмнөх улаан хашлагатай хэсэгт зогсох, зогсоолд тавихыг бүгдийг хориглоно."},{"n":710,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Баруун талын нарийн гудамжаас автомашин эсвэл явган зорчигч орж ирж болзошгүй тул анхааран явна.","Төв шугам байхгүй тул явган зорчигчид аль болох ойртож замын баруун талаар явна.","Хурдны дээд хязгаарын тэмдэг байхгүй тул хурдаа нэмэгдүүлэн хурдан явна.","Замын баруун талаар явж байхдаа явган зорчигчдод дуут дохиог тасралтгүй өгч зам тавьж өгөхийг шаардана.","Явган зорчигчийн хөдөлгөөнд саад учруулж байвал удаан явж эсвэл түр зогсоно."],"a":"1, 5","imgs":["img_0027.jpg"],"t":"사진형","e":"Төвийн шугамгүй замд явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явах ёстой бөгөөд явган зорчигчийн явахад саад болох үед удаан явах буюу түр зогсож явган зорчигчийг аюулгүй явах боломжоор хангах ёстой. Уулзварт орох үед бусад тээврийн хэрэгсэл буюу явган зорчигчид анхаарч явах ёстой. Хүндэтгэн үзэх шалтгаангүйгээр дуут дохиог тасралтгүй дуугаргахаас зайлсхийнэ."},{"n":711,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зам чөлөөтэй тул хурдаа нэмэгдүүлнэ.","Цаг агаарын нөхцөлд тохируулан тогтоосон хурдны хүрээнд явна.","Урд талд зам засварын ажил явагдаж байгаа тул хөдөлгөөний нөхцөл байдлыг сайн ажиглан явна.","Зам халтиргаатай тул хоёр эгнээг дамнан явна.","Урд удаан явж буй ачааны автомашины ард маш ойрхон даган явна. ■ Цас орж байгаа нөхцөл"],"a":"2, 3","imgs":["img_0028.jpg"],"t":"사진형","e":"Урд талд барилгын ажил хийгдэж байх үед гэнэтийн нөхцөл байдал үүсч болох тул замын хөдөлгөөний нөхцөл байдлыг ажиглан явах ёстой. Цаг агаарын нөхцөл байдлаас хамаарч хурд бууруулах заалтыг хэрэглэнэ. Хурдны дээд хязгаарын 100-ны 20-оор бууруулсан хурдаар явах ёстой тохиолдол нь бороо орж замын гадаргуу норсон тохиолдол, цас 20 миллиметрээс бага зузаантай хуримтлагдсан тохиолдол бөгөөд хурдны дээд хязгаарын 100-ны 50-аар бууруулсан хурдаар явах ёстой тохиолдол нь ширүүн бороо, их цас, манан зэргээс үзэгдэх орчин 100 метрийн дотор байгаа тохиолдол, замын гадаргуу хөлдсөн тохиолдол, цас 20 миллиметр ба түүнээс дээш зузаантай хуримтлагдсан тохиолдол юм (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлийн 2 дахь хэсэг)."},{"n":712,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Урд талд явган зорчигч байгаа тул түр зогсож, аюулгүй байдлыг нь шалгасны дараа явна.","Зам хөндлөн гарч буй явган зорчигчийг хамгаалах үүрэггүй тул шууд явна.","Баруун талд зогсоолд тавьсан цагаан автомашины ар талын явган зорчигчид анхааран явна.","Дуут дохиог чанга өгч явган зорчигчийг зам хөндлөн гарахаас сэргийлнэ.","Явган зорчигчийн өмнө огцом зогсож анхааруулна."],"a":"1, 3","imgs":["img_0029.jpg"],"t":"사진형","e":"Явган зорчигч явган хүний гарц байгуулаагүй замаар гарч байгаа үед аюулгүй зай барьж түр зогсоно. Явган зорчигчийг аюулгүй гарах боломжоор хангах ёстой."},{"n":713,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зам засварын анхааруулах тэмдэг байгаа тул хурдаа бууруулан явна.","Урд талд төв шугам давсан автомашинд анхааруулахын тулд хурдаа нэмэгдүүлж, холын гэрлээ асаан явна.","Аюулын дохионы гэрэл анивчуулж, хурдаа нэмэгдүүлэн хурдан явна.","Ослоос урьдчилан сэргийлэхийн тулд ар талаас ирж буй автомашинд анхааран хурдаа бууруулж явна.","Баруун талын замын хажуугийн хөвөөний цагаан шугамтай хэсэг нь түр зогсохыг зөвшөөрдөггүй газар юм."],"a":"1, 4","imgs":["img_0030.jpg"],"t":"사진형","e":"Барилгын ажил хийгдэж буй зам тул аюулгүй байдлыг шалгасны дараа анхааралтай, удаан явах ёстой. Мөн урд, хойд явж буй тээврийн хэрэгслүүдийн аюулгүй байдлыг шалган явна. Замын захын бүсийн шугамын дотроос цагаан үргэлжилсэн шугам нь зогсох, зогсоолд тавихыг зөвшөөрдөг боловч барилгын ажлын хэсэгт зогсоолд тавихыг хориглож, зогсохыг зөвшөөрнө."},{"n":714,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Өвлийн улиралд замын нимгэн мөсөн бүрхүүлээс болгоомжилж жолоодно.","Замын хөдөлгөөн сийрэг тул зогсоолд тавьж болно.","Эгнээгээ сольж явж болно.","Гүүрэн дээр явж байхдаа гүйцэж түрүүлэхийг хориглоно.","Эгнээ сольж буй ачааны автомашинд анхааруулахын тулд маш ойрхон даган явна."],"a":"1, 4","imgs":["img_0031.jpg"],"t":"사진형","e":"Бүх тээврийн хэрэгслийн жолооч гүүрэн дээр бусад тээврийн хэрэгслийг гүйцэж түрүүлж болохгүй (Замын хөдөлгөөний тухай хуулийн 22 дугаар зүйлийн 3 дахь хэсгийн 3 дахь заалт). Бүх тээврийн хэрэгслийн жолооч хонгил дотор болон гүүрэн дээр зогсоолд тавьж болохгүй (Замын хөдөлгөөний тухай хуулийн 33 дугаар зүйлийн 1 дэх заалт)."},{"n":715,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Урд явж буй хоёр дугуйт тээврийн хэрэгсэл гэнэт замын төв рүү шилжиж болзошгүй тул анхааран явна.","Зам чөлөөтэй тул хурдаа нэмэгдүүлэн явна.","Хоёр дугуйт тээврийн хэрэгсэлтэй хангалттай аюулгүйн зай барина.","Дуут дохиог давтан өгч хурдаа нэмэгдүүлэн гүйцэж түрүүлнэ.","Төв шугам давахгүйгээр хоёр дугуйт тээврийн хэрэгсэлд маш ойртон явна."],"a":"1, 3","imgs":["img_0032.jpg"],"t":"사진형","e":"Хоёр дугуйт тээврийн хэрэгсэл замын төв рүү шилжиж болзошгүй тул аюулгүй зайг хангалттай барьж хурдаа сааруулах ёстой."},{"n":716,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Нар мандах үеэр өдөртэй харьцуулахад харанхуй байдаг тул холын гэрлээ асааж, дуут дохиог тасралтгүй өгч жолоодно.","Өөдөөс ирж буй автомашин өнгөрсний дараа харагдах орчин бүрэн хангагдмагц хурдан гүйцэж түрүүлнэ.","Урд явж буй ачааны автомашины өмнө гэнэтийн нөхцөл байдал үүсвэл огцом зогсож болзошгүй тул хангалттай аюулгүйн зай барин жолоодно.","Замын төв шугам үргэлжилсэн шугамтай тул гүйцэж түрүүлэхгүй.","Хөдөлгөөнийг саадгүй байлгахын тулд урд явж буй автомашинд дуут дохио өгч хурдыг нь нэмэгдүүлнэ."],"a":"3, 4","imgs":["img_0033.jpg"],"t":"사진형","e":"Бүх тээврийн хэрэгслийн жолооч нэг чиглэлд явж буй урд тээврийн хэрэгслийн араас явах тохиолдолд урд тээврийн хэрэгсэл гэнэт зогсох үед тухайн тээврийн хэрэгсэлтэй мөргөлдөхөөс зайлсхийж чадах шаардлагатай зайг хангах ёстой (Замын хөдөлгөөний тухай хуулийн 19 дүгээр зүйлийн 1 дэх хэсэг). Ялангуяа том оврын ачааны автомашины араар явах үед урд талын харагдах байдлыг хангахад хүндрэлтэй, гэнэтийн нөхцөл байдал үүсч болох тул хангалттай аюулгүй зай барих шаардлагатай. Мөн төвийн шугамыг үргэлжилсэн шугамаар тэмдэглэсэн хэсэгт гүйцэж түрүүлэхийг хориглодог (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] 501 дугаар төвийн шугамын тэмдэглэгээ). Харин холын гэрэл хэрэглэх болон дуут дохиог тасралтгүй хэрэглэх нь бусад жолоочийн харааг саатуулах буюу шаардлагагүй дуу чимээ үүсгэж аюул учруулж болзошгүй."},{"n":717,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Баруун талын зам тавьж өгөх тэмдэг нь уулзварт орж буй автомашин мөрдөх ёстой тэмдэг юм.","Тойрог уулзвар дотор гүйцэж түрүүлэх бол урд автомашины зүүн талаар гүйцэж түрүүлнэ.","Бүх автомашин ямар нэгэн хязгаарлалтгүйгээр 1 цагийн чиглэлийн гарцаар гарч болно.","Тойрог уулзвар руу орж буй автомашин нь тойрог уулзвар дотор явж буй автомашинаас давуу эрхтэй тул шууд орно.","Тойрог уулзвараас гарахдаа чиг заах дохиогоо асаана."],"a":"1, 5","imgs":["img_0034.jpg"],"t":"사진형","e":"Уулзварт гүйцэж түрүүлэхийг хориглоно (Замын хөдөлгөөний тухай хуулийн 22 дугаар зүйлийн 3 дахь хэсгийн 1 дэх заалт). Тээврийн хэрэгслийн жолооч тойрог уулзварт орох гэж буй тохиолдолд аль хэдийн явж буй өөр тээврийн хэрэгсэл байвал тухайн тээврийн хэрэгсэлд зам тавьж өгөх ёстой (Замын хөдөлгөөний тухай хуулийн 25-2 дугаар зүйл-ын 2 дахь хэсэг). Аль хэдийн тойрч буй тээврийн хэрэгсэлд зам тавьж өгөх үүрэг байхгүй. Уулзварт зогсоолд тавих болон зогсохыг хориглоно (Замын хөдөлгөөний тухай хуулийн 32 дугаар зүйлийн 1 дэх заалт). Баруун эргэх буюу баруун тийш эгнээ солих гэж буй үед баруун талын чиг заах дохиог асаахаар заасан бөгөөд (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 2) тойрог уулзвараас гарах гэж буй тохиолдолд чиг заах дохиог асаахаар заасан (Замын хөдөлгөөний тухай хуулийн 38 дугаар зүйлийн 1 дэх хэсэг). Гүүрээр явах тохиолдолд хөдөлгөөн хязгаарлах тэмдгийн агуулгыг дагаж мөрдөх ёстой."},{"n":718,"b":"Дараах нөхцөлд харагдахгүй байгаа замын хөдөлгөөний аюулгүй байдлын тэмдэг 2-ыг сонгоно уу.","c":["Явган хүний гарцын тэмдэг","Зүүн эргэхийг хориглосон тэмдэг","Тойрог уулзварын тэмдэг","Түр зогсох, зогсоолд тавихыг хориглосон тэмдэг","Нэвтрэхийг хориглосон тэмдэг"],"a":"3, 5","imgs":["img_0035.jpg"],"t":"사진형","e":"Тойрог уулзварын тэмдэг (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] дугаар 109) зураг дээр байхгүй. Хөдөлгөөн хориглох тэмдэг (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] дугаар 201) зураг дээр байхгүй."},{"n":719,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Хүүхдийн хамгаалалтын бүс тул хурдны дээд хязгаарын хүрээнд явж, гэнэтийн аюулд бэлэн байна.","Зам засварын талбай боловч ажлын автомашин байхгүй бол хурдан явна.","Аюулын дохионы гэрэл анивчуулж, хурдаа нэмэгдүүлэн явна.","Замын хөдөлгөөн сийрэг тул замын нөхцөлд анхаарах шаардлагагүй.","Явган хүний гарцын өмнө явган зорчигч байхгүй байсан ч заавал түр зогсоод явна."],"a":"1, 5","imgs":["img_0036.jpg"],"t":"사진형","e":"Зураг нь хүүхдийн хамгаалалтын бүс тул цагт 30 км ба түүнээс доош хурдаар удаан явж гэнэтийн аюулд бэлтгэх ёстой. Мөн хүүхдийн хамгаалалтын бүс доторх явган хүний гарцын дотроос гэрлэн дохио суурилуулаагүй явган хүний гарцын өмнө явган зорчигч байгаа эсэхээс үл хамааран түр зогссоны дараа явах ёстой (Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 7 дахь хэсэг). Харин барилгын ажлын хэсэг ч гэсэн ажлын тээврийн хэрэгсэл байхгүй бол түргэн явж болно гэсэн ②, ослын дохио асааж хурдаа нэмэх ёстой гэсэн ③, хүн ховортой зам тул анхаарах шаардлагагүй гэсэн нь буруу юм."},{"n":720,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Урд талд явган зорчигч зам хөндлөн гарах гэж байгаа тул түр зогсож, аюулгүй байдлыг нь шалгасны дараа явна.","Нарийн гудамж тул явган зорчигчийг хамгаалах үүрэггүй учир хурдаа нэмэгдүүлнэ.","Ард дагаж яваа автомашин байвал аюулын дохионы гэрэл анивчуулж аюултай нөхцөл байдлыг мэдэгдэнэ.","Дуут дохиог давтан өгч явган зорчигчийг зам хөндлөн гарахаас сэргийлнэ.","Явган зорчигчийн яг өмнө огцом зогсож анхааруулна."],"a":"1, 3","imgs":["img_0037.jpg"],"t":"사진형","e":"Явган зорчигч төвийн шугамгүй туслах замаар явган явж байгаа тохиолдолд аюулгүй зай барьж удаан явах буюу түр зогсож явган зорчигчийг аюулгүй явах боломжоор хангах ёстой. Мөн араас ирэх тээврийн хэрэгсэлд аюулыг мэдэгдэхийн тулд ослын анивчих дохиог асаах нь аюулгүй."},{"n":721,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Явган зорчигч зориулалтын бус газраар зам хөндлөн гарч байсан ч түүний аюулгүй байдлыг шалган явна.","Зориулалтын бус газраар зам хөндлөн гарч буй явган зорчигчийг хамгаалах шаардлагагүй тул шууд явна.","Дуут дохиог чанга өгч зориулалтын бус газраар зам хөндлөн гарч буй явган зорчигчийг цааш гарахаас сэргийлнэ.","Аюулын дохионы гэрэл анивчуулж арын автомашинуудад аюултай нөхцөл байдлыг мэдэгдэнэ.","Зориулалтын бус газраар зам хөндлөн гарч буй явган зорчигчийн яг өмнө огцом зогсож сургамжилна."],"a":"1, 4","imgs":["img_0038.jpg"],"t":"사진형","e":"Зөвшөөрөлгүй газраар гарч буй явган зорчигч байсан ч аюулгүй зай барьж осол гарахгүй байхад анхаарах ёстой. Мөн араас ирэх тээврийн хэрэгсэлд аюулыг мэдэгдэхийн тулд ослын анивчих дохиог асаах нь аюулгүй."},{"n":722,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Гүйцэж түрүүлэх бол зүүн эгнээгээр явж буй суудлын автомашин өнгөрсний дараа аюулгүйгээр зүүн эгнээгээр гүйцэж түрүүлнэ.","Гүүрэн дээр зогсоолд тавьж болохгүй.","2-р эгнээнээс 1-р эгнээ рүү шилжин явж болно.","Гүүрэн дээр гүйцэж түрүүлж болохгүй.","Урд талын автомашин удаан явж байвал ард нь маш ойрхон даган явна."],"a":"2, 4","imgs":["img_0039.jpg"],"t":"사진형","e":"Зураг дээрх газар нь гүүрэн дээрх замын хэсэг бөгөөд гүйцэж түрүүлэхийг хориглосон газарт хамаарна (Замын хөдөлгөөний тухай хуулийн 22 дугаар зүйлийн 3 дахь хэсэг). Иймд зүүн эгнээний тээврийн хэрэгсэл өнгөрсний дараа ч гүйцэж түрүүлэхийг оролдож болохгүй. Мөн зүүн талыг цагаан үргэлжилсэн шугамаар тэмдэглэсэн тул эгнээ солихыг хориглосон бөгөөд 2 дугаар эгнээнээс 1 дүгээр эгнээ рүү эгнээ солих нь ч боломжгүй (Замын хөдөлгөөний тухай хуулийн 14 дүгээр зүйлийн 5 дахь хэсэг). Харин хонгил дотор болон гүүрэн дээр зогсоолд тавихыг хориглодог (Замын хөдөлгөөний тухай хуулийн 33 дугаар зүйл). Иймд хамгийн аюулгүй жолоодлогын арга нь гүүрэн дээр зогсоолд тавихгүй байх (②) болон гүйцэж түрүүлэхгүй байх (④) явдал юм."},{"n":723,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зүүн талд зогсож буй явган зорчигчид дуут дохиог тасралтгүй өгч анхааруулаад хурдан явна.","Аюултай нөхцөл байдлыг урьдчилан тооцох шаардлагагүйгээр шууд явна.","Баруун урд талаас автомашин орж ирж болзошгүй тул удаан явна.","Гэрлэн дохиогүй уулзвар тул хурдаа нэмэгдүүлэн хурдан гарна.","Явган хүний гарцын өмнөх зогсох шугам дээр түр зогсоно."],"a":"3, 5","imgs":["img_0040.jpg"],"t":"사진형","e":"Хүндэтгэн үзэх шалтгаангүйгээр дуут дохиог тасралтгүй дуугаргах үйлдлээс зайлсхийж, гэрлэн дохиогүй уулзварт орох үед эргэн тойрны нөхцөл байдлыг ажиглан удаан явах ёстой. Явган зорчигч явган хүний гарцаар гарч байгаа буюу гарах гэж байгаа үед явган зорчигчийн гарахад саад учруулахгүй, аюул учруулахгүйн тулд тухайн явган хүний гарцын өмнө (зогсох шугам тэмдэглэсэн газарт тухайн зогсох шугамыг хэлнэ) түр зогсох ёстой."},{"n":724,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зам засварын ажил явагдаж байгаа тул урд талын нөхцөл байдлыг сайтар ажиглан жолоодно.","Замын гадаргуу тэгш биш тул хурдаа бууруулахгүйгээр хурдан явах нь аюулгүй.","Өөдөөс ирж буй автомашинд анхааран удаан явна.","Дуут дохиог тасралтгүй өгч баруун талд зогсоолд тавьсан зам засварын автомашинд анхааруулан хурдаа нэмэгдүүлж хурдан явна.","Өөдөөс ирж буй автомашин ойрттол хурдаа хадгалж байгаад дараа нь огцом зогсоно."],"a":"1, 3","imgs":["img_0041.jpg"],"t":"사진형","e":"Барилгын ажил хийгдэж буй туслах замд гэнэтийн нөхцөл байдалд бэлтгэж хурдаа сааруулан урьдчилан тооцсон, хамгаалалтын, зам тавьж өгөх жолоодлого хийнэ."},{"n":725,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Тойрог уулзварт цагийн зүүний дагуу зорчих нь аюулгүй.","Тойрог уулзвар руу орохын өмнө удаан явж эсвэл түр зогсох ёстой.","Тойрог уулзвар дотор явж буй автомашин нь тойрог уулзвар руу орох гэж буй автомашинд зам тавьж өгөх ёстой.","Тойрог уулзвараас гарахдаа чиг заах дохио өгөхгүйгээр шууд гарна.","Тойрог уулзвар руу орохын тулд чиг заах дохио өгсөн автомашин байвал түүний арын автомашин урд автомашины хөдөлгөөнд саад учруулж болохгүй. ■ Тойрог уулзвар"],"a":"2, 5","imgs":["img_0042.jpg"],"t":"사진형","e":"Тойрог уулзварт цагийн зүүний эсрэг чиглэлд явах ёстой. Тойрог уулзварт орох гэж буй тохиолдолд удаан явах буюу түр зогсох ёстой бөгөөд аль хэдийн явж буй өөр тээврийн хэрэгсэл байвал тухайн тээврийн хэрэгсэлд зам тавьж өгөх ёстой. Тойрог уулзвараар явахын тулд гар, чиг заах дохио буюу гэрлээр дохио өгч буй тээврийн хэрэгсэл байгаа тохиолдолд түүний ард явах тээврийн хэрэгслийн жолооч дохио өгсөн урд тээврийн хэрэгслийн хөдөлгөөнд саад учруулж болохгүй. Тойрог уулзварт орох, гарах үед чиг заах дохиог асаах ёстой (Замын хөдөлгөөний тухай хуулийн 25-2 дугаар зүйл)."},{"n":726,"b":"Дараах нөхцөлд эгнээ солихтой холбоотой тайлбараас зөв 2-ыг сонгоно уу.","c":["2-р эгнээгээр явж буй суудлын автомашин 1-р эгнээ рүү эгнээ сольж болно.","1-р эгнээгээр явж буй суудлын автомашин 2-р эгнээ рүү эгнээ сольж болохгүй.","Нэгдэх эгнээнээс шууд 1-р эгнээ рүү эгнээ сольж болно.","2-р эгнээгээр явж буй суудлын автомашин нэгдэх эгнээ рүү эгнээ сольж болохгүй.","Бүх эгнээнээс эгнээ сольж болно."],"a":"2, 4","imgs":["img_0043.jpg"],"t":"사진형","e":"Тээврийн хэрэгслийн жолооч аюулгүйн тэмдэглэгээ суурилуулж эгнээ солихыг тусгайлан хориглосон газарт тээврийн хэрэгслийн эгнээг сольж болохгүй. Гэхдээ замын эвдрэл буюу замын засварын ажил зэргээс болж саад байгаа тохиолдолд үүнд хамаарахгүй (Замын хөдөлгөөний тухай хуулийн 14 дүгээр зүйлийн 5 дахь хэсэг). Цагаан тасархай шугамтай хэсэгт эгнээ солих боломжтой боловч цагаан үргэлжилсэн шугамтай хэсэгт эгнээ сольж болохгүй. Мөн тасархай шугам ба үргэлжилсэн шугам давхар шугам байх үед ч тасархай шугам байгаа талаас л эгнээ солих боломжтой."},{"n":727,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Замын захад түр зогссоны дараа гарна.","Цагаан тасархай болон үргэлжилсэн хос шугамтай хэсгээс гарна.","Гарах гарцыг өнгөрүүлсэн бол ухарч байсан ч анх зорьсон гарцаар гарна.","Зам халтиргаатай тул хангалттай хурдаа бууруулж эгнээгээ солино.","Гарах хэсэг түгжирсэн бол шахаж орсон ч хурдан гарахыг оролдоно."],"a":"2, 4","imgs":["img_0044.jpg"],"t":"사진형","e":"Тээврийн хэрэгслийн жолооч аюулгүйн тэмдэглэгээ суурилуулж эгнээ солихыг тусгайлан хориглосон газарт тээврийн хэрэгслийн эгнээг сольж болохгүй. Гэхдээ замын эвдрэл буюу замын засварын ажил зэргээс болж саад байгаа тохиолдолд үүнд хамаарахгүй (Замын хөдөлгөөний тухай хуулийн 14 дүгээр зүйлийн 5 дахь хэсэг). Цагаан тасархай шугамтай хэсэгт эгнээ солих боломжтой боловч цагаан үргэлжилсэн шугамтай хэсэгт эгнээ сольж болохгүй. Мөн тасархай шугам ба үргэлжилсэн шугам давхар шугам байх үед ч тасархай шугам байгаа талаас л эгнээ солих боломжтой."},{"n":728,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Хурдаа бууруулж, урд талын нөхцөл байдлын аюулгүй байдлыг шалган явна.","2-р эгнээгээр явж байхдаа баруун талын эгнээ рүү шилжээд ачааны автомашиныг гүйцэж түрүүлнэ.","Цас орж байгаа тул хурдны дээд хязгаараас 10 хувиар бууруулж явна.","Цагаан тасархай шугамтай хэсэг тул эгнээ сольж болохгүй.","Зам мөстсөн эсэхийг шалгаж, арын хөдөлгөөнийг мөн ажиглан явна."],"a":"1, 5","imgs":["img_0045.jpg"],"t":"사진형","e":"Тээврийн хэрэгслийн жолооч аюулгүйн тэмдэглэгээ суурилуулж эгнээ солихыг тусгайлан хориглосон газарт тээврийн хэрэгслийн эгнээг сольж болохгүй. Гэхдээ замын эвдрэл буюу замын засварын ажил зэргээс болж саад байгаа тохиолдолд үүнд хамаарахгүй (Замын хөдөлгөөний тухай хуулийн 14 дүгээр зүйлийн 5 дахь хэсэг). Цагаан тасархай шугамтай хэсэгт эгнээ солих боломжтой боловч цагаан үргэлжилсэн шугамтай хэсэгт эгнээ сольж болохгүй. Мөн тасархай шугам ба үргэлжилсэн шугам давхар шугам байх үед ч тасархай шугам байгаа талаас л эгнээ солих боломжтой. Мөн урд, хойд явж буй тээврийн хэрэгслүүдийн аюулгүй байдлыг шалган явна. Цас орж 20 миллиметр ба түүнээс доош зузаантай хуримтлагдсан тохиолдолд замын хурдны дээд хязгаарын 20 хувиар хурдаа бууруулж жолоодно."},{"n":729,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зүүн чиг заах дохио өгч, аюулгүйн зай барин нөхцөл байдалд тохируулан баруун тийш гарна.","Урд болон арын хөдөлгөөнийг ажиглан гарах эгнээ рүү орно.","Гарах гарцыг өнгөрүүлсэн бол ухарч буцан ирээд анхны зорьсон замаараа явна.","Гарах эгнээнд автомашин харагдахгүй бол чиг заах дохио өгөх шаардлагагүй.","Хальтрахаас сэргийлэхийн тулд урд автомашинтайгаа ердийн үеэс илүү зайтай явна."],"a":"2, 5","imgs":["img_0046.jpg"],"t":"사진형","e":"Бүх тээврийн хэрэгслийн жолооч тээврийн хэрэгслийн эгнээг солих гэж буй тохиолдолд солих гэж буй чиглэлээс ирж буй өөр тээврийн хэрэгслийн хэвийн хөдөлгөөнд саад учруулж болзошгүй үед эгнээ сольж болохгүй (Замын хөдөлгөөний тухай хуулийн 19 дүгээр зүйлийн 3 дахь хэсэг). Жолооч эгнээ солих гэж буй тохиолдолд тухайн үйлдэл дуустал чиг заах дохиогоор дохио өгөх ёстой (Замын хөдөлгөөний тухай хуулийн 38 дугаар зүйлийн 1 дэх хэсэг). Огцом эгнээ сольж болохгүй бөгөөд хангалттай аюулгүй зайг хангаж гарах гэж буй чиглэлийн чиг заах дохиог урьдчилан асааж явна."},{"n":730,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["3-р эгнээнд автомашин байхгүй тул 3-р эгнээ рүү шилжиж хурдан гүйцэж түрүүлнэ.","Урд талын ачааны автомашинд холын гэрлийг дараалан асааж зам тавьж өгөхийг шаардана.","Урд талын удаан явж буй ачааны автомашины ард маш ойрхон даган явна.","Хонгил дотор гүйцэж түрүүлэхийг хориглоно.","Зүүн эгнээнд автомашин их байгаа тул хүчээр гүйцэж түрүүлэхийг оролдохгүй."],"a":"4, 5","imgs":["img_0047.jpg"],"t":"사진형","e":"Өвлийн улиралд цастай замаар явахад замын гадаргуу халтиргаатай бөгөөд удахгүй хонгилд орох ёстой тул онцгой анхаарал шаардлагатай. Бүх тээврийн хэрэгслийн жолооч өөр тээврийн хэрэгслийг гүйцэж түрүүлэхийн тулд урд тээврийн хэрэгслийн зүүн талаар явах ёстой (Замын хөдөлгөөний тухай хуулийн 21 дүгээр зүйлийн 1 дэх хэсэг). Тээврийн хэрэгслийн эгнээг солих гэж буй тохиолдолд солих гэж буй чиглэлээс ирж буй өөр тээврийн хэрэгслийн хэвийн хөдөлгөөнд саад учруулж болзошгүй үед эгнээ сольж болохгүй (Замын хөдөлгөөний тухай хуулийн 19 дүгээр зүйлийн 3 дахь хэсэг). Мөн зүүн талын чиг заах дохиог урьдчилан асааж аюулгүй зайг хангасны дараа зүүн эгнээнд орж гүйцэж түрүүлэхийг оролдох ёстой. Уулзвар, хонгил дотор, гүүрэн дээр зэрэг нь гүйцэж түрүүлэхийг хориглосон газар юм (Замын хөдөлгөөний тухай хуулийн 22 дугаар зүйлийн 3 дахь хэсэг). Иймд хамгийн аюулгүй жолоодлогын арга нь хонгил дотор гүйцэж түрүүлэхгүй байх (④), зүүн талд тээврийн хэрэгсэл олон тул хүчээр гүйцэж түрүүлэхээс зайлсхийх (⑤) явдал юм."},{"n":731,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зам халтиргаатай тул хонгилоос гарахаас өмнө 3-р эгнээ рүү шилжээд хурдаа бууруулан явна.","Хонгилын гаднах нөхцөл байдлыг мэдэхгүй тул хонгилоос гармагцаа хурдаа нэмэгдүүлэн явна.","Хонгил дотор эгнээ солих боломжтой хэсэг тул 1-р эгнээ рүү шилжээд хурдаа нэмэгдүүлэн явна.","Хонгилын гаднах зам халтиргаатай байж болзошгүй тул хурдаа бууруулан явна.","Хонгилоос гарах үед гэрэлд дасах үзэгдэл гарч болох тул анхаарна."],"a":"4, 5","imgs":["img_0048.jpg"],"t":"사진형","e":"Харанхуй газраас гэрэлтэй газарт гэнэт гарахад нүд хурц гэрэлд дасахад тодорхой хугацаа шаардагдаж, гэрэлд дасан зохицох үзэгдэл илэрч болзошгүй. Иймээс хурдаа бууруулж, гэнэтийн нөхцөл байдалд бэлэн байх аюулгүй жолоодлогын хандлага шаардлагатай."},{"n":732,"b":"Зурагт үзүүлсэн замын хөдөлгөөний аюулгүй байдлын байгууламж болон түүний тайлбараас буруу 2-ыг сонгоно уу.","c":["Өргөний хязгаарын тэмдэг – Тэмдэг дээр заасан өргөнөөс хэтэрсэн автомашин (ачсан ачааны өргөнийг оролцуулан)-ы хөдөлгөөнийг хязгаарлана.","Хоёр дугуйт тээврийн хэрэгсэл болон моторт унадаг дугуйн хөдөлгөөнийг хориглох тэмдэг – Хоёр дугуйт тээврийн хэрэгсэл болон моторт унадаг дугуйн хөдөлгөөнийг хориглоно.","Автомашины зориулалтын замын тэмдэг – Автомашины зориулалтын зам эсвэл зориулалтын бүс болохыг заана.","Тээврийн хэрэгслийн гэрлэн дохио (улаан анивчдаг) – Бусад хөдөлгөөн болон аюулгүй байдлын тэмдэгт анхаарч удаан явж болно.","Төв шугам – Байрлуулсан газрын баруун талаар зорчихыг илэрхийлсэн шугам."],"a":"1, 4","imgs":["q732.png"],"t":"사진형","e":"Тээврийн хэрэгслийн өндөр хязгаарлах тэмдэг - тэмдэг дээр заасан өндрөөс хэтэрсэн тээврийн хэрэгсэл (ачсан ачааны өндрийг оролцуулан)-ийн хөдөлгөөнийг хязгаарлана (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] дугаар 221). Тээврийн хэрэгслийн гэрлэн дохионы дотроос улаан гэрэл анивчихын утга нь зогсох шугам буюу явган хүний гарц байгаа үед тээврийн хэрэгсэл түүний яг өмнө буюу уулзварын яг өмнө түр зогссоны дараа бусад хөдөлгөөнд анхаарч явж болно гэсэн үг юм (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 2])."},{"n":733,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Эгнээ солих боломжтой хэсэгт чиг заах дохио өгөхгүйгээр эгнээ сольж болно.","1-р эгнээгээр явж буй суудлын автомашин 2-р эгнээ рүү эгнээ сольж болно.","Нэгдэх эгнээнээс шууд 1-р эгнээ рүү эгнээ сольж болно.","2-р эгнээгээр явж буй суудлын автомашин 1-р эгнээ рүү эгнээ сольж болно.","2-р эгнээнээс нэгдэх эгнээ рүү эгнээ сольж болно."],"a":"2, 4","imgs":["img_0049.jpg"],"t":"사진형","e":"Аюулгүйн тэмдэглэгээ суурилуулж эгнээ солихыг тусгайлан хориглосон газарт тээврийн хэрэгслийн эгнээг сольж болохгүй. Цагаан тасархай шугамтай хэсэгт эгнээ солих боломжтой боловч цагаан үргэлжилсэн шугамтай хэсэгт эгнээ сольж болохгүй. Цагаан үргэлжилсэн шугам ба тасархай шугамын давхар шугамтай хэсэгт тасархай шугам байгаа талаас л эгнээ солих боломжтой. Эгнээ солих үед чиг заах дохиог заавал асаах ёстой бөгөөд нэг удаад нэг эгнээ л сольж, аюулгүй байдалд анхаарах нь зүйтэй."},{"n":734,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Цагаан үргэлжилсэн болон тасархай хос шугамтай хэсэг тул тасархай шугамтай талаас эгнээ сольж гарна.","Замын зүүн захад түр зогссоны дараа гарна.","Гарах гарцыг өнгөрүүлсэн бол ухарч байсан ч анхны гарцаар гарахыг оролдоно.","Арын хөдөлгөөнийг харгалзан зүүн талын гарах гарцаар явна.","Гарах эгнээ рүү орсны дараа дахин баруун талын эгнээ рүү шилжиж болно."],"a":"1, 4","imgs":[
