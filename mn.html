 дагуу барилгын машин механизмаас өөрөө буулгагч ачааны машин, асфальт цацагч, замын гадаргуу тогтворжуулагч, бетон зуурагч машин, бетон шахуурга, өрөмдлөгийн машин (ачааны машинд суурилуулсан) нь автомашинд хамаарна."},{"n":552,"b":"Замын хөдөлгөөний тухай хуулийн дагуу автомашин зэрэг тээврийн хэрэгсэл (хувийн хөдөлгөөнт хэрэгслээс бусад) жолоодсон хүнд ногдуулах шийтгэлийн талаар тайлбар юм. Буруу холбосон 2 нь аль вэ?","c":["Цусан дахь спиртийн агууламж 0.2% ба түүнээс дээш үед согтуугаар жолоо барьсан хүн – 1 жил ба түүнээс дээш 2 жил ба түүнээс доош хорих ял эсвэл 10,000,000 вон ба түүнээс доош торгууль","Хамтарч аюултай үйлдэл хийсэн хүн – 2 жил ба түүнээс доош хугацаагаар хорих ял эсвэл 5,000,000 вон ба түүнээс доош торгууль","Аюултай, түрэмгий жолоодлого хийсэн хүн – 1 жил ба түүнээс доош хугацаагаар хорих ял эсвэл 5,000,000 вон ба түүнээс д оош торгууль","Моторт унадаг дугуйг жолоодох эрхийн үнэмлэхгүйгээр жолоодсон – 500,000 вон ба түүнээс доош торгууль эсвэл баривчлах ял"],"a":"1, 4","imgs":[],"t":"문장형","e":"① Цусан дахь спиртийн агууламж 0.2% ба түүнээс дээш байхдаа согтуугаар жолоо барих (1 удаа зөрчсөн тохиолдолд) – 2 жилээс 5 жил хүртэл хугацаагаар хорих ял эсвэл 10,000,000 воноос 20,000,000 вон хүртэл торгууль ② Хамтарсан аюултай үйлдэл – 2 жил хүртэл хугацаагаар хорих ял эсвэл 5,000,000 вон хүртэл торгууль ③ Зэрлэг жолоодлого – 1 жил хүртэл хугацаагаар хорих ял эсвэл 5,000,000 вон хүртэл торгууль ④ Моторт унадаг дугуйг жолоодох эрхгүй жолоодох – 300,000 вон хүртэл торгууль эсвэл баривчлах ял"},{"n":553,"b":"Замын хөдөлгөөний тухай хуулийн дагуу согтууруулах ундааны шинжилгээнд саад учруулах үйлдэлд хамаарах т айлбаруудаас хамгийн тохиромжгүй 2 нь аль вэ?","c":["Согтуу байдалтай гэж үзэх хангалттай үндэслэлтэй хүн цагдаагийн албан хаагчийн хэмжилтийг хүндрүүлэх зорилгоор нэмж архи уух нь үүнд хамаарна.","Автомашин зэрэг тээврийн хэрэгсэл жолоодсоны дараа согтууруулах ундааны шинжилгээнд саад учруулсан бол 1 жил хүртэл хугацаагаар хорих ял эсвэл 5,000,000 вон хүртэл торгууль ногдуулна.","Согтуу байдалтай гэж үзэх хангалттай үндэслэлтэй хүн цусан дахь спиртийн агууламжид нөлөөлж болох эм болон захиргаа, аюулгүй байдлын яамны журмаар тогтоосон бусад зүйл хэрэглэх нь үүнд хамаарна.","Согтуу байдалтай гэж үзэх хангалттай үндэслэлтэй хүн унадаг дугуй жолоодсоны дараа согтууруулах ундааны шинжилгээнд саад учруулсан бол үүнд хамаарахгүй."],"a":"2, 4","imgs":[],"t":"문장형","e":"44 дүгээр зүйл (Согтуу байдалтай жолоодохыг хориглох)-ийн 5 дахь хэсэг: согтуу байдалтай гэж үзэх хангалттай үндэслэлтэй хүн автомашин зэрэг, трамвай эсвэл унадаг дугуй жолоодсоны дараа 2 дахь хэсэг эсвэл 3 дахь хэсгийн дагуух хэмжилтийг хүндрүүлэх зорилгоор нэмж согтууруулах ундаа уух эсвэл цусан дахь спиртийн агууламжид нөлөөлж болзошгүй эм зэрэг Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон зүйлийг хэрэглэх үйлдэл (цаашид \"согтуурлын хэмжилтэд саад учруулах үйлдэл\" гэх. Цаашид мөн адил) хийж болохгүй. 148-2 дугаар зүйл (Шийтгэл)-ийн 2 дахь хэсэг: дараах заалтын аль нэгэнд хамаарах хүнийг 1 жилээс 5 жил хүртэл хугацаагаар хорих ял эсвэл 5,000,000 воноос 20,000,000 вон хүртэл торгуулиар шийтгэнэ. 2. Согтуу байдалтай гэж үзэх хангалттай үндэслэлтэй хүн 44 дүгээр зүйлийн 5 дахь хэсгийг зөрчиж автомашин зэрэг эсвэл трамвай жолоодсоны дараа согтуурлын хэмжилтэд саад учруулах үйлдэл хийсэн хүн 156 дугаар зүйл (Шийтгэл): дараах заалтын аль нэгэнд хамаарах хүнийг 200,000 вон хүртэл торгууль, баривчлах ял эсвэл бага торгуулиар шийтгэнэ. 12-ын 2. Согтуу байдалтай гэж үзэх хангалттай үндэслэлтэй хүн 44 дүгээр зүйлийн 5 дахь хэсгийг зөрчиж унадаг дугуй зэргийг жолоодсоны дараа согтуурлын хэмжилтэд саад учруулах үйлдэл хийсэн хүн"},{"n":554,"b":"Замын хөдөлгөөний тухай хуулийн дагуу суудлын автомашин тухайн зам дээр хуульд заасан хурдыг зөрчин явж байгаа 2 тохиолдол аль вэ?","c":["Нэг чиглэлд 2 эгнээтэй ердийн замаар цагт 85 км хурдтай явж байна.","Баруун эргийн хурдны замаар цагт 90 км хурдтай явж байна.","Автомашины зориулалтын замаар цагт 95 км хурдтай явж байна.","Нэг чиглэлд 1 эгнээтэй хурдны замаар цагт 75 км хурдтай явж байна."],"a":"1, 3","imgs":[],"t":"문장형","e":"Нэг чиглэлд 2 эгнээтэй ердийн замд цагт 80 километр, автомашины зориулалтын замд цагт 90 километр нь хурдны дээд хязгаар бөгөөд Баруун эргийн хурдны замд цагт 110 километр, нэг чиглэлд 1 эгнээтэй хурдны замд цагт 80 километр нь хурдны дээд хязгаар юм. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйл)"},{"n":555,"b":"Замын хөдөлгөөний тухай хуулийн дагуу замын хажуугийн хөвөөний талаар зөв тайлбар 2 нь аль вэ?","c":["Хил заагийн тэмдэглэгээ хийдэггүй.","Явган зорчигчийн аюулгүй байдлыг хангахын тулд байгуулдаг.","Явган хүний зам болон зорчих хэсэг тусгаарлагдаагүй зам дээр байгуулдаг.","Замд хамаарахгүй."],"a":"2, 3","imgs":[],"t":"문장형","e":"Замын захын бүс гэдэг нь явган хүний зам ба зорчих хэсэг нь тусгаарлагдаагүй замд явган зорчигчийн аюулгүй байдлын үүднээс аюулгүйн тэмдэглэгээ зэргээр хил хязгаарыг тэмдэглэсэн замын захын хэсгийг хэлнэ. (Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 11 дэх заалт)"},{"n":556,"b":"Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн дагуу эрүүгийн шийтгэлийн онцгой зохицуулалтын та лаар зөв тайлбар аль нь вэ?","c":["Автомашины хөдөлгөөний улмаас ноцтой хайхрамжгүй байдлын улмаас бусдын биед гэмтэл учруулсан гэмт хэрэг үйлдсэн жолооч иж бүрэн даатгалтай бол ямар ч тохиолдолд яллах боломжгүй.","Автомашины хөдөлгөөний улмаас ажил үүргийн хайхрамжгүй байдлаар гэмтэл учруулсан жолоочийг хохирогчийн илэрхий хүсэлтийн эсрэг ч үргэлж яллаж болно.","Автомашины жолооч зам тээврийн ослын улмаас эрүүгийн хариуцлага хүлээвэл 5 жил ба түүнээс доош хугацаагаар хорих ял эсвэл 20,000,000 вон ба түүнээс доош торгууль ногдуулна.","Хурдны хязгаараас цагт 20 км-ээс илүү хурдтай явсны улмаас хүний хохиролтой осол гарсан ч иж бүрэн даатгалтай бол яллах боломжгүй."],"a":"3","imgs":[],"t":"문장형","e":"Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн 3 дугаар зүйл"},{"n":557,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган хөдөлгөөнд туслах сандалтай тэрэг (өргөн нь 1 метрээс ихгүй)-т хамаарахгүй нь аль вэ?","c":["Гар тэргэнцэр","Цахилгаан тэргэнцэр","Эмнэлгийн зориулалтын скутер","Цахилгаан унадаг дугуй"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 2 дугаар зүйл (Тээврийн хэрэгсэл, хөсөгас хасагдах хэрэгсэл, төхөөрөмж) ① \"Замын хөдөлгөөний тухай хууль\" (цаашид \"хууль\" гэх)-ийн 2 дугаар зүйлийн 10 дахь заалт болон 17 дахь заалтын \"а\" дэд заалтын 5)-д заасан \"хүүхдийн тэрэг, явган хүний туслах сандалтай тэргэнцэр, өндөр настан, сул дорой хүний явган явахад туслах хэрэгсэл зэрэг Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон хэрэгсэл, төхөөрөмж\" гэдэг нь өргөн нь 1 метр ба түүнээс бага, дараах заалтын хэрэгсэл, төхөөрөмжийг хэлнэ. 1. Хүүхдийн тэрэг 2. Явган хүний туслах сандалтай тэргэнцэр (\"Эмнэлгийн хэрэгслийн тухай хууль\"-ийн 19 дүгээр зүйлийн дагуу Хүнс, эмийн аюулгүй байдлын газрын даргын тогтоосон эмнэлгийн хэрэгслийн стандарт үзүүлэлтийн дагуух гар ажиллагаатай тэргэнцэр, цахилгаан тэргэнцэр болон эмнэлгийн зориулалтын скутерыг хэлнэ) 3. Өндөр настан, сул дорой хүний явган явахад туслах хэрэгсэл 4. Хуулийн 11 дүгээр зүйлийн 3 дахь хэсгийн дагуух тоглоомын хэрэгсэл (хүүхдийн хэрэглэдэг зүйлээр хязгаарлана) 5. Хөдөлгүүргүй гар тэрэг 6. Хоёр дугуйт тээврийн хэрэгсэл, моторт унадаг дугуй эсвэл унадаг дугуйнаас жолооч нь буугаад түлхэж эсвэл өргөж явж буй зүйл 7. Замын засвар, арчлалт, зам дээрх барилгын ажил зэрэг ажилд ашиглагддаг хэрэгсэл, төхөөрөмж (хүн суудаггүй эсвэл ачаа тээвэрлэдэггүй зүйлээр хязгаарлана)"},{"n":558,"b":"Замын хөдөлгөөний тухай хуулийн дагуу шинэ жолоочийн талаар зөв тайлбар аль нь вэ?","c":["Зөвхөн 1-р ангиллын ердийн жолоодох эрхийн үнэмлэх эзэмшигчийг шинэ жолооч гэж тодорхойлдог.","Зөвхөн моторт унадаг дугуйн жолоодох эрхийн үнэмлэх авснаас хойш 2 жил болоогүй хүнийг хэлнэ.","Анх жолоодох эрхийн үнэмлэх авснаас хойш 2 жил хүрэхээс өмнө хүчингүй болж, дараа нь дахин жолоодох эрхийн үнэмлэх авсан бол хүчингүй болохоос өмнөх хугацааг шинэ жолоочийн туршлагад тооцно.","Анх жолоодох эрхийн үнэмлэх авснаас хойш 2 жил болоогүй хүн шинэ жолоочид хамаарна."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 27 дахь заалт: \"шинэ жолооч\" гэдэг нь анх жолоодох эрх авсан өдрөөс (анх жолоодох эрх авсан өдрөөс хойш 2 жил өнгөрөхөөс өмнө жолоодох эрхийг хүчингүй болгох шийтгэл хүлээсэн тохиолдолд түүнээс хойш дахин жолоодох эрх авсан өдрийг хэлнэ) 2 жил өнгөрөөгүй хүнийг хэлнэ. Энэ тохиолдолд зөвхөн моторт унадаг дугуйн жолоодох эрх авсан хүн моторт унадаг дугуйн жолоодох эрхээс өөр жолоодох эрх авсан тохиолдолд анх жолоодох эрх авсан гэж үзнэ."},{"n":559,"b":"Замын хөдөлгөөний тухай хуулийн дагуу моторт унадаг дугуйн талаарх зөв тайлбар аль нь вэ?","c":["Бүх хоёр дугуйт тээврийн хэрэгслийг хэлнэ.","Автомашины удирдлагын тухай хуульд заасан 250cc хүртэлх хоёр дугуйт тээврийн хэрэгслийг хэлнэ.","150см³ ба түүнээс дээш хөдөлгүүртэй тээврийн хэрэгслийг хэлнэ.","Цахилгаан хөдөлгүүртэй бол хамгийн их нэрлэсэн чадал нь 11 кВт-аас ихгүй хөдөлгүүртэй тээврийн хэрэгслийг (цахилгаан унадаг дугуйнаас бусад) хэлнэ."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 19 дэх заалт: \"моторт унадаг дугуй\" гэдэг нь дараах дэд заалтын аль нэгэнд хамаарах тээврийн хэрэгслийг хэлнэ. а. Автотээврийн хэрэгслийн удирдлагын тухай хуулийн 3 дугаар зүйлийн дагуух хоёр дугуйт тээврийн хэрэгслээс хөдөлгүүрийн багтаамж 125 куб.см ба түүнээс бага (цахилгаанаар ажилладаг бол дээд нэрлэсэн чадал 11 киловатт ба түүнээс бага) хоёр дугуйт тээврийн хэрэгсэл б. Үүнээс гадна хөдөлгүүрийн багтаамж 125 куб.см ба түүнээс бага (цахилгаанаар ажилладаг бол дээд нэрлэсэн чадал 11 киловатт ба түүнээс бага) хөдөлгүүр суурилуулсан тээврийн хэрэгсэл (цахилгаан унадаг дугуйг хамааруулахгүй)"},{"n":560,"b":"Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн дагуу зам тээврийн осолд хамаарахгүй нь аль вэ?","c":["4.5 тонн ачааны автомашин суудлын автомашинтай мөргөлдөж, суудлын автомашины жолооч гэмтсэн тохиолдол","Төмөр замын гарам дээр явган зорчигч галт тэргэнд мөргүүлж гэмтсэн тохиолдол","Явган зорчигч явган хүний гарцаар гарч байхдаа гэрлэн дохио зөрчсөн автомашинд мөргүүлж гэмтсэн тохиолдол","Явган хүний зам дээр унадаг дугуй унаж яваад явган зорчигчийг мөргөж гэмтээсэн тохиолдол"],"a":"2","imgs":[],"t":"문장형","e":"Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн 2 дугаар зүйлийн 2 дахь заалт"},{"n":561,"b":"Замын хөдөлгөөний тухай хуулийн дагуу замын хэсэг буюу газарт байрлуулах замын тэмдэглэгээний өнгөний талаар зөв тайлбар аль нь вэ?","c":["Төв шугам, аюулгүйн бүс нь цагаан өнгөтэй.","Автобусны тусгай эгнээний тэмдэглэгээ, аюулгүйн бүсийн тэмдэглэгээ нь шар өнгөтэй.","Гал түймэртэй тэмцэх байгууламжийн орчимд түр зогсох, зогсоолд тавихыг хориглосон тэмдэглэгээ нь улаан өнгөтэй.","Зогсоолд тавихыг хориглосон, түр зогсох болон зогсоолд тавихыг хориглосон тэмдэглэгээ, аюулгүйн бүс нь улаан өнгөтэй."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, ① Төвийн шугам шар өнгөтэй, аюулгүйн бүс шар эсвэл цагаан өнгөтэй байна. ② Автобусны тусгай эгнээний тэмдэглэгээ цэнхэр өнгөтэй байна. ④ Зогсоолд тавихыг хориглох тэмдэглэгээ болон зогсох, зогсоолд тавихыг хориглох тэмдэглэгээ шар өнгөтэй байна."},{"n":562,"b":"Замын хөдөлгөөний тухай хуулийн дагуу гүйцэж түрүүлэх тухай зөв тайлбар аль нь вэ?","c":["Урд автомашины баруун талд өөр автомашин урд автомашинтай зэрэгцэн явж байвал гүйцэж түрүүлэхийг хориглоно.","Шинээр ашиглалтад орсон хонгил, гүүрэн дээр болон уулзварт гүйцэж түрүүлэх боломжтой.","Жолооч урд явж байгаа өөр автомашины зүүн талаар өнгөрч, урд нь гарч явахыг хэлнэ.","Хурдны зам дээр суудлын автомашин автобусны тусгай эгнээг ашиглан гүйцэж түрүүлж болно."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Нэр томьёоны тодорхойлолт)-ийн 29 дэх заалт, 21 дүгээр зүйл"},{"n":563,"b":"Замын хөдөлгөөний тухай хуулийн дагуу автомашин биш нь аль вэ?","c":["Суудлын автомашин","Унадаг дугуй","Тусгай зориулалтын тээврийн хэрэгсэл","Олон суудалт автомашин"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 18 дахь заалт"},{"n":564,"b":"Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн дагуу хохирогчийн илэрхий хүсэлтийн эсрэг ч яллах б оломжтой хурд хэтрүүлсэн осол аль нь вэ?","c":["Хамгийн дээд хурд нь цагт 100 км хурдны зам дээр цагт 110 км хурдтай явж байгаад гарсан осол","Хамгийн дээд хурд нь цагт 80 км, нэг чиглэлд 3 эгнээтэй ердийн зам дээр цагт 95 км хурдтай явж байгаад гарсан осол","Хамгийн дээд хурд нь цагт 90 км автомашины зориулалтын зам дээр цагт 100 км хурдтай явж байгаад гарсан осол","Хамгийн дээд хурд нь цагт 60 км, нэг чиглэлд 1 эгнээтэй ердийн зам дээр цагт 82 км хурдтай явж байгаад гарсан осол"],"a":"4","imgs":[],"t":"문장형","e":"Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн 3 дугаар зүйл (Шийтгэлийн тусгай журам) ② Тээврийн хэрэгслийн хөдөлгөөнөөр 1 дэх хэсгийн гэмт хэргээс ажил үүргийн болгоомжгүй байдлаас гэмтээх эсвэл хүнд болгоомжгүй байдлаас гэмтээх гэмт хэрэг болон Замын хөдөлгөөний тухай хуулийн 151 дүгээр зүйлийн гэмт хэрэг үйлдсэн жолоочид хохирогчийн илэрхий хүсэл зоригийн эсрэг яллах дүгнэлт үйлдэж болохгүй. Гэхдээ дараах заалтын аль нэгэнд хамаарах үйлдлийн улмаас мөн гэмт хэрэг үйлдсэн тохиолдолд үүнд хамаарахгүй."},{"n":565,"b":"Замын хөдөлгөөний тухай хуулийн дагуу 4 өнгийн хэвтээ байрлалтай гэрлэн дохионы зөв дараалал аль нь вэ?","c":["Баруунаас: Улаан → Ногоон сум → Шар → Ногоон","Зүүнээс: Улаан → Шар → Ногоон сум → Ногоон","Зүүнээс: Шар → Улаан → Ногоон сум → Ногоон","Баруунаас: Ногоон сум → Шар → Улаан → Ногоон"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 7 дугаар зүйл, Хавсралт 4"},{"n":566,"b":"Замын хөдөлгөөний тухай хуулийн дагуу мэргэшлийн шалгалтын шаардлага хангаж байгаа эсэхийг тогтооход ашиглах баримт бичигт хамаарахгүй нь аль вэ?","c":["Үндэсний эрүүл мэндийн даатгалын тухай хуульд заасан эрүүл мэндийн үзлэгийн дүнгийн мэдэгдэл","Эмнэлгийн тухай хуулийн дагуу эмчийн олгосон оношийн бичиг","Цэргийн албаны тухай хуулийн дагуу цэргийн үзлэгийн дүнгийн мэдэгдэл","Солонгосын нүдний шилний мэргэжилтний холбооны даргын олгосон харааны үзлэгийн бичиг"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 45 дугаар зүйл (Автомашин зэргийг жолоодоход шаардлагатай чадварын стандарт) ② Солонгосын Замын хөдөлгөөний газар (KoROAD) 1 дэх хэсгийн заалт бүрийн чадварын шалгалтын стандартыг хангасан эсэхийг дараах заалт бүрийн баримт бичгээр тогтоож болно. 1. Жолоодох эрхийн шалгалтад хүсэлт гаргасан өдрөөс хойш 2 жилийн дотор олгогдсон дараах дэд заалтын аль нэгэнд хамаарах баримт бичиг а. Эмнэлэг, эмнэлгийн газар болон нэгдсэн эмнэлгээс олгосон биеийн үзлэгийн бичиг б. Эрүүл мэндийн үзлэгийн дүнгийн мэдэгдэл в. Эмчийн олгосон оношийн бичиг г. Цэргийн албаны биеийн үзлэг (идэвхтэй цэргийн албанд сайн дураар элсэгчийн биеийн үзлэгийг оруулна)-ийн дүнгийн мэдэгдэл"},{"n":567,"b":"Дараахын аль нь хэрэглэгч эсвэл байгууллагын хүсэлтээр аймаг, хотын Цагдаагийн газрын дарга тусгай зориулалтын тээврийн хэрэгсэл гэж тогтоож болох вэ?","c":["Цус тээвэрлэх автомашин","Цагдаагийн автомашинаас гэмт хэрэг мөрдөн шалгах, замын хөдөлгөөн хянах болон бусад яаралтай цагдаагийн ажиллагаанд ашиглагддаг автомашин","Радио долгионы хяналтын ажиллагаанд ашиглагддаг автомашин","Мөрдөн шалгах байгууллагын гэмт хэрэг мөрдөхөд ашиглагддаг автомашин"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 2 дугаар зүйл ① Замын хөдөлгөөний тухай хуулиар тогтоосон тусгай зориулалтын тээврийн хэрэгсэл ②, ④ Ерөнхийлөгчийн зарлигаар тогтоосон автомашин ③ Аймаг, нийслэлийн Цагдаагийн газрын даргын тогтоосон автомашин"},{"n":568,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тусгай зориулалтын тээврийн хэрэгсэл мөрдөх ёстой шаардлагын зөв 2 нь аль вэ?","c":["Хурдны журам зөрчсөн автомашин зэрэг тээврийн хэрэгслийг хянах зориулалттай тусгай зориулалтын тээврийн хэрэгсэл нь автомашины аюулгүй ажиллагааны стандартад заасан бүтэцтэй байх ёстой.","Дотоод, гадаадын өндөр албан тушаалтны хамгаалалтын албанд ашиглагдаж буй тусгай зориулалтын тээврийн хэрэгсэл нь дуут дохио өгөхгүй, тусгай гэрлэн дохио асаахгүй байж болно.","Энгийн автомашин урд гэрэл эсвэл ослын дохионы гэрэл асааж яаралтай зориулалтаар явж байгаагаа илэрхийлсэн ч тусгай зориулалтын тээврийн хэрэгсэл гэж үзэхгүй.","Тусгай зориулалтын тээврийн хэрэгсэл нь зарчмын хувьд дуут дохио өгч эсвэл тусгай гэрлэн дохио асаасан тохиолдолд л даву у эрх болон хуульд заасан онцгой зохицуулалтыг эдэлнэ."],"a":"2, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 3 дугаар зүйл (Тусгай зориулалтын тээврийн хэрэгслийн дагаж мөрдөх зүйл)"},{"n":569,"b":"Дараах нь замын хөдөлгөөний тухай хуульд тодорхойлсон нэр томьёо юм. Зөв тайлбар 2 нь аль вэ?","c":["“Эгнээ” гэж хашлага, аюулгүй байдлын тэмдэг эсвэл түүнтэй адил хиймэл байгууламжаар хил заагийг тэмдэглэн бүх тээврийн хэрэгсэл зорчихоор байгуулсан замын хэсгийг хэлнэ.","“Эгнээний шугам” гэж эгнээ хоорондын хил заагийг аюулгүй байдлын тэмдгээр тэмдэглэсэн шугамыг хэлнэ.","“Зорчих хэсэг” гэж тээврийн хэрэгсэл болон хөсөг нэг эгнээгээр замын тогтоосон хэсгээр зорчихоор эгнээний шугамаар тусгаар ласан замын хэсгийг хэлнэ.","“Явган хүний зам” гэж хашлага зэрэг зүйлээр хил заагийг тэмдэглэн явган зорчигч зорчихоор байгуулсан замын хэсгийг хэлнэ."],"a":"2, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл"},{"n":570,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуйн зорчих аргын талаар буруу нь аль вэ?","c":["Явган хүний зам болон зорчих хэсэг тусгаарлагдсан зам дээр зорчих хэсгээр зорчих ёстой.","Уулзварт баруун эргэхдээ урьдчилан замын баруун зах руу орж удаан яван баруун эргэнэ.","Уулзварт зүүн эргэхдээ удаан явж замын төв хэсэг эсвэл зүүн захад шахаж зүүн эргэнэ.","Тусдаа унадаг дугуйн замтай бол тэр замаар зорчих ёстой."],"a":"3","imgs":[],"t":"문장형","e":"Хууль зүйн яамны иргэний асуултад өгсөн хариу (Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйлийн 3 дахь хэсэгтэй холбоотой, унадаг дугуйн жолооч уулзварт зүүн тийш эргэх аргын талаарх асуултад Цагдаагийн ерөнхий газрын өгсөн хариулт): унадаг дугуйн жолооч уулзварт зүүн эргэлтийн дохиогоор шууд зүүн тийш эргэж болохгүй, явах чиглэлийн чигээрээ явах дохиогоор урьдчилан замын баруун захад наалдан 2 үе шаттайгаар чигээрээ - чигээрээ явах аргаар зүүн тийш эргэх ёстой гэсэн дэгээн эргэлтийг (hook-turn) хэлж байгаа юм."},{"n":571,"b":"Замын хөдөлгөөний тухай хуулийн дагуу нэр томьёоны тодорхойлолтын зөв нь аль вэ?","c":["“Автомашины зориулалтын зам” гэж зөвхөн автомашин зорчихоор байгуулсан замыг хэлнэ.","“Унадаг дугуйн зам гэж” аюулгүй байдлын тэмдэг, хамгаалалтын хашлага эсвэл түүнтэй адил хиймэл байгууламжаар хил заагийг тэмдэглэн зөвхөн унадаг дугуй зорчихоор байгуулсан замыг хэлнэ.","“Автомашин зэрэг тээврийн хэрэгсэл” гэж автомашин, үхэр болон адууг хэлнэ.","“Унадаг дугуй зэрэг гэж” унадаг дугуй болон цахилгаан унадаг дугуйг хэлнэ."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 2 дахь заалт, 8 дахь заалт, 21 дэх заалт, 21-ийн 2: \"унадаг дугуйн зам\" гэдэг нь унадаг дугуй болон хувийн хөдөлгөөнт хэрэгсэл явах боломжтойгоор байгуулсан замыг хэлнэ. \"Автомашин зэрэг\" гэдэг нь автомашин болон моторт унадаг дугуйг хэлнэ. \"Унадаг дугуй зэрэг\" гэдэг нь унадаг дугуй болон хувийн хөдөлгөөнт хэрэгслийг хэлнэ."},{"n":572,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хувийн хөдөлгөөнт хэрэгсэл жолоочийн мөрдөх үүргээс буруу нь аль вэ?","c":["Хувийн хөдөлгөөнт хэрэгслийг жолоодох эрхийн үнэмлэхгүйгээр жолоодож болно.","Зөвшөөрөгдсөн зорчигчийн тооноос илүү хүн суулган жолоодож болохгүй.","Жолооч хамгаалах хэрэгсэл өмсөн жолоодох ёстой.","Тусдаа унадаг дугуйн замтай бол тэр замаар зорчих ёстой."],"a":"1","imgs":[],"t":"문장형","e":"Хувийн хөдөлгөөнт хэрэгсэл нь моторт унадаг дугуйн нэг хэсэгт хамаарах тул жолоодох гэж буй хүн моторт унадаг дугуйн жолоодох эрх ба түүнээс дээш эрх авсан байх ёстой. (Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 19-ийн 2 дахь заалт, 80 дугаар зүйл)"},{"n":573,"b":"Дараах хүмүүсээс замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуйгаар явган хүний замаар зорчих боломжгүй хүн аль нь вэ?","c":["「Хөгжлийн бэрхшээлтэй иргэдийн халамжийн тухай хууль」-ийн дагуу биеийн хөгжлийн бэрхшээлтэй гэж бүртгэгдсэн хүн","Хүүхэд","Биеийн гэмтлийн улмаас гипстэй хүн","「Үндэсний гавьяатан болон тэдний дэмжлэгийн тухай хууль」-ийн дагуу 1-7 дугаар зэргийн тахир дутуугийн зэрэгтэй үндэсний гавьяатан"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 13-2 дугаар зүйл (Унадаг дугуйн явах аргын тусгай журам)-ын 4 дэх хэсэг, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 14-4 дүгээр зүйл (Унадаг дугуй унаж явган хүний замаар явж болох хөгжлийн бэрхшээлтэй хүн)"},{"n":574,"b":"Урд талд унадаг дугуйгаа түрэн зорчих хэсгийг хөндлөн гарч байгаа хүн байвал хамгийн аюулгүй жолоодох арга аль нь вэ?","c":["Хөндлөн гарч буй унадаг дугуйн баруун, зүүн талын зайгаар хурдан өнгөрнө.","Автомашин ойртож байгааг мэдэгдэхийн тулд урд гэрэл болон дуут дохио ашиглана.","Унадаг дугуй гарч байгаа цэгээс тодорхой зай барин түр зогсоно.","Автомашины жолооч давуу эрхтэй тул гарч буй хүнийг зогсооно."],"a":"3","imgs":[],"t":"문장형","e":"Урд талд унадаг дугуй түлхэн замыг хөндлөн гарч буй хүн байх үед хамгийн аюулгүй жолоодох арга нь аюулгүй зай барьж түр зогсон аюулгүй хөндлөн гарах боломж олгох явдал юм."},{"n":575,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн хамгаалалтын бүс дотор эгнээ тэмдэглээгүй нарийн замаар унадаг дугуй унаж, явган зорчигчийн хажуугаар өнгөрөхдөө аюулгүй зай барилгүй, удаан яваагүй бол зөрчлийн торгуулийн мэ дэгдлийн хэмжээ хэд вэ?","c":["100,000 вон","80,000 вон","40,000 вон","20,000 вон"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 4 дэх хэсэг: бүх тээврийн хэрэгслийн жолооч замд байгуулсан аюулгүйн бүсэд явган зорчигч байгаа тохиолдолд болон эгнээ байгуулаагүй нарийн замд явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явах ёстой. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 10: зөрчлийн торгууль 40,000 вон"},{"n":576,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхэд зам дээр унах үед хамгаалах хэрэгсэл заавал өмсөх ёстой, захиргаа, аюулгүй байдлын яамны журмаар тогтоосон өндөр эрсдэлтэй тоглоомын хэрэгсэлд хамаарахгүй нь аль вэ?","c":["Кик скүүтер","Цахилгаан хоёр дугуйт тэнцвэржүүлэгч","Роликт тэшүүр","Скейтборд"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 13 дугаар зүйл: Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон аюул ихтэй тоглоомын хэрэгсэл гэдэг нь кикборд, роликон тэшүүр, шугаман роликон тэшүүр, тэшүүрт банз болон үүнтэй төстэй тоглоомын хэрэгслийг хэлэх бөгөөд цахилгаан хоёр дугуйт тэнцвэрт хэрэгсэл зэрэг хувийн хөдөлгөөнт хэрэгслийн хувьд Замын хөдөлгөөний тухай хуулийн 11 дүгээр зүйлийн 4 дэх хэсэгт хүүхдийн асран хамгаалагчаар хүүхдийг жолоодохыг хориглуулсан байдаг."},{"n":577,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуйн зорчих аргын талаар зөв 2 нь аль вэ?","c":["Унадаг дугуйн жолооч аюулгүй байдлын тэмдгээр зөвшөөрсөнөөс бусад тохиолдолд хоёр буюу түүнээс олон унадаг дугуйгаар з эрэгцэн зорчих хэсгээр явж болохгүй.","Унадаг дугуйн жолооч явган хүний гарцаар зам хөндлөн гарахдаа унадаг дугуйгаа бууж түрэн гарна.","Унадаг дугуйн жолооч зам эвдэрсэн, зам засварын ажил хийгдэж байгаа болон бусад саадтай байсан ч унадаг дугуйн жолооч явган хүний замаар явж болохгүй.","Унадаг дугуйн жолооч нь унадаг дугуйн зам байхгүй газарт замын төв хэсэгт наалдан явна."],"a":"1, 2","imgs":[],"t":"문장형","e":"Унадаг дугуйн зам тусад нь байгаа газарт тухайн унадаг дугуйн замаар явах ёстой бөгөөд унадаг дугуйн зам байгуулаагүй газарт замын баруун захад наалдан явах ёстой ба замын захын бүсээр (аюулгүйн тэмдэглэгээгээр унадаг дугуйн хөдөлгөөнийг хориглосон хэсгийг хамааруулахгүй) явах тохиолдолд явган зорчигчийн хөдөлгөөнд саад болох үед удаан явах эсвэл түр зогсох ёстой."},{"n":578,"b":"Унадаг дугуйн хэрэглээг дэмжих тухай хуулийн дагуу ( ) нас хүрээгүй хүүхдийн асран хамгаалагч хүүхдээр цахилгаан у надаг дугуй унуулж болохгүй. ( ) -д тохирох нь аль вэ?","c":["10","13","15","18"],"a":"2","imgs":[],"t":"문장형","e":"Унадаг дугуйн хэрэглээг идэвхжүүлэх тухай хуулийн 22-2 дугаар зүйл (Цахилгаан унадаг дугуйн хөдөлгөөний хязгаарлалт): 13 нас хүрээгүй хүүхдийн асран хамгаалагч хүүхдээр цахилгаан унадаг дугуй жолоодуулж болохгүй."},{"n":579,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуй зэрэг тээврийн хэрэгслийн зорчих аргын хувьд зохисгүй үйлдэл аль нь вэ?","c":["Явах чиглэлийн хамгийн зүүн эгнээнээс зүүн эргэсэн.","Зам эвдэрч засвар хийж байсан тул явган хүний замаар явсан.","Явган хүний гарцаар гарахдаа бууж түрэн гарсан.","Явган зорчигчтой осол гарахаас сэргийлэн удаан явсан."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 13-2 дугаар зүйл (Унадаг дугуй зэргийн явах аргын тусгай журам): унадаг дугуй ч баруун талаар явах ёстой бөгөөд унадаг дугуйн зам байгуулаагүй газарт замын баруун захад наалдан явах ёстой. Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйл (Уулзвар нэвтрэх арга)-ын 3 дахь хэсэг: 2 дахь хэсгийг үл харгалзан унадаг дугуй зэргийн жолооч уулзварт зүүн тийш эргэх гэж буй тохиолдолд урьдчилан замын баруун захад наалдан удаан явангаа уулзварын захын хэсгийг ашиглан зүүн тийш эргэх ёстой."},{"n":580,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуйн жолоочийн мөрдөх ёстой зүйлээс зөв нь аль вэ?","c":["Явган зорчигчийн хөдөлгөөнд саад болох нөхцөлд удаан явж, түр зогсох ёстой.","Хүүхэд унадаг дугуй унаж байгаа тохиолдолд явган хүний замаар явж болохгүй.","Унадаг дугуй явахыг хориглосон хэсэгт унадаг дугуйгаа түрж ч явж болохгүй.","Замын хажуугийн хөвөөгөөр хоёр унадаг дугуй зэрэгцэн явж болно."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 13-2 дугаар зүйл (Унадаг дугуй зэргийн явах аргын тусгай журам)"},{"n":581,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуйн (цахилгаан унадаг дугуйнаас бусад) жолоочийн замаар зорчих аргаас хамгийн зохисгүй нь аль вэ?","c":["Хүүхэд унадаг дугуйтай явган хүний замаар явсан.","Аюулгүй байдлын тэмдгээр зөвшөөрөгдсөн явган хүний замаар явсан.","Зам эвдэрсэн тул аргагүйгээр явган хүний замаар явсан.","Зам дээр автомашин байгаагүй тул замын төвөөр явсан."],"a":"4","imgs":[],"t":"문장형","e":"①, ②, ③-ын тохиолдолд явган хүний замаар явж болно. (Замын хөдөлгөөний тухай хуулийн 13-2 дугаар зүйл-ын 4 дэх хэсэг)"},{"n":582,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хувийн хөдөлгөөнт хэрэгсэл жолоочийн талаар буруу тайлбар аль нь вэ?","c":["Явган хүний гарцаар зам хөндлөн гарахдаа хувийн хөдөлгөөнт хэрэгслээс бууж, түрж эсвэл өргөн явганаар гарна.","Унадаг дугуйн зам байхгүй бол замын баруун захыг даган зорчих ёстой.","Цахилгаан хоёр дугуйт тэнцвэржүүлэгчийг 1 хүний суудлын багтаамжаас илүү зорчигчтой жолоодож болно.","Шөнө замаар зорчих үед урд гэрэл, арын гэрлээ асаах эсвэл гэрэл ойлгогч тууз зэрэг гэрэлтэх хэрэгсэл өмсөнө."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 50 дугаар зүйлийн 10 дахь хэсэг: хувийн хөдөлгөөнт хэрэгслийн жолооч Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон суудлын багтаамжаас хэтрүүлэн хамт зорчигч суулгаж хувийн хөдөлгөөнт хэрэгсэл жолоодож болохгүй. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 33-3 дугаар зүйл Хувийн хөдөлгөөнт хэрэгслийн суудлын багтаамж 1. Цахилгаан хоёр дугуйт тэнцвэрт хэрэгслийн хувьд: 1 хүн"},{"n":583,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуйн жолооч уулзварт зүүн эргэх аргын талаар тайлбар юм. Зөв нь аль вэ?","c":["Замын баруун захыг даган удаан явж, уулзварын зах хэсгийг ашиглан зүүн эргэнэ.","Замын зүүн захыг даган удаан явж, уулзварын зах хэсгийг ашиглан зүүн эргэнэ.","Замын 1-р эгнээний төвөөр удаан явж, уулзварын төвийг ашиглан зүүн эргэнэ.","Замын хамгийн баруун эгнээгээр удаан явж, уулзварын төвийн дотор талаар зүүн эргэнэ."],"a":"1","imgs":[],"t":"문장형","e":"Унадаг дугуйн жолооч уулзварт зүүн тийш эргэх гэж буй тохиолдолд урьдчилан замын баруун захад наалдан удаан явангаа уулзварын захын хэсгийг ашиглан зүүн тийш эргэх ёстой. (Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйл Уулзвар нэвтрэх арга)"},{"n":584,"b":"Замын хөдөлгөөний тухай хуулийн дагуу суудлын автомашин унадаг дугуйн тусгай эгнээгээр явж байгаад илэрвэл ямар шийтгэл ногдуулах вэ?","c":["1 жил ба түүнээс доош хүртэл хугацаагаар хорих ял.","3,000,000 вон ба түүнээс доош торгууль ногдуулна.","40,000 воны зөрчлийн торгуулийн мэдэгдэл гаргана.","Шийтгэх боломжгүй."],"a":"3","imgs":[],"t":"문장형","e":"Тусгай эгнээний төрөл (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 1: Тусгай эгнээний төрөл болон тусгай эгнээгээр явж болох тээврийн хэрэгсэл), тусгай эгнээ байгуулах (Замын хөдөлгөөний тухай хуулийн 15 дугаар зүйлийн 2 дахь хэсэг болон 3 дахь хэсэг)-ийн дагуу зөрчлийн торгууль 40,000 вон ногдуулна."},{"n":585,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуйн замаар зорчих боломжтой цахилгаан унадаг дугуйн шалгуураас буруу нь аль вэ?","c":["Суурилуулсан төхөөрөмжийн жинг оролцуулсан нийт жин 30 кг-аас бага байх.","Цагт 25 км-ээс дээш хурдтай болоход цахилгаан хөдөлгүүр ажиллахгүй байх.","Зөвхөн цахилгаан хөдөлгүүрээр өөрөө явахгүй байх.","Хамгийн их нэрлэсэн чадал нь 11 кВт-аас дээш байх."],"a":"4","imgs":[],"t":"문장형","e":"Унадаг дугуйн хэрэглээг идэвхжүүлэх тухай хуулийн 2 дугаар зүйл (Нэр томьёоны тодорхойлолт)-ийн 1 дэх заалт: хоёр ба түүнээс дээш дугуйтай тээврийн хэрэгсэл. 1 дэх заалтын 2: \"цахилгаан унадаг дугуй\" гэдэг нь унадаг дугуй бөгөөд хүний хүчийг нөхөх зорилгоор цахилгаан мотор суурилуулсан, дараах дэд заалтын шаардлагыг бүгдийг нь хангасан зүйлийг хэлнэ. а. Дөрөө (гар дөрөөг оруулна) болон цахилгаан моторын хүчээр зэрэг хөдөлж, зөвхөн цахилгаан моторын хүчээр хөдөлдөггүй байх б. Цагт 25 километр ба түүнээс дээш хурдтай хөдлөх үед цахилгаан мотор ажилладаггүй байх в. Суурилуулсан төхөөрөмжийн жинг оруулаад унадаг дугуйн нийт жин 30 килограммаас бага байх"},{"n":586,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуйн жолооч шөнө замаар зорчих үед зөв жолоодох аргуудаас хамгийн тохиромжгүй нь аль вэ?","c":["Дуут дохиог байнга хэрэглэн явна.","Урд болон арын гэрлээ асаан явна.","Гэрэл ойлгогч хантааз зэрэг өмсөн явна.","Гэрэл ойлгогч тууз зэрэг гэрэлтэх хэрэгсэл өмсөн явна."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 50 дугаар зүйл (Тодорхой жолоочийн дагаж мөрдөх зүйл)-ийн 9 дэх хэсэг: унадаг дугуй зэргийн жолооч шөнийн цагаар замаар явах үед урд гэрэл болон арын гэрлийг асаах эсвэл гэрэл ойлгогч бүс зэрэг гэрэлтэгч төхөөрөмж зүүх ёстой."},{"n":587,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуйн жолооч хууль зөрчсөн тохиолдолд зөрчлийн торгууль но гдуулахгүй зөрчил аль нь вэ?","c":["Гэрлэн дохио зөрчих","Төв шугам давах","Явган хүний гарцаар гарч буй явган зорчигчид саад учруулах","Хурдны хязгаар зөрчих"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8: гэрлэн дохио зөрчих 30,000 вон, төвийн шугам давах 30,000 вон, явган хүний гарцаар явган зорчигч гарахад саад учруулах 30,000 воны зөрчлийн торгууль ногдуулах бөгөөд хурд хэтрүүлэх зохицуулалт нь Замын хөдөлгөөний тухай хуулийн 17 дугаар зүйл (Автомашин зэрэг болон трамвайн хурд) ① автомашин зэрэг (хувийн хөдөлгөөнт хэрэгслийг хамааруулахгүй. Цаашид энэ зүйлд мөн адил) болон трамвайн замаар явах хурдыг Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтооно."},{"n":588,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуйн зам ашиглахтай холбоотойгоор зохисгүй 2 нь аль вэ?","c":["Ахмад настан унадаг дугуй унаж байгаа бол явган хүний замаар явж болно.","Унадаг дугуйн тусгай замаар моторт унадаг дугуй явж болохгүй.","Унадаг дугуйн замаар хувийн хөдөлгөөнт хэрэгсэл явж болохгүй.","Унадаг дугуйн тусгай зам нь замын хөдөлгөөний тухай хуульд заасан замд хамаарахгүй."],"a":"3, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Нэр томьёоны тодорхойлолт): унадаг дугуйн замаар унадаг дугуй болон хувийн хөдөлгөөнт хэрэгсэл (унадаг дугуй зэрэг) аль аль нь явах боломжтой бөгөөд унадаг дугуйн зориулалтын зам ч замд хамаарна."},{"n":589,"b":"Замын хөдөлгөөний тухай хуулийн дагуу унадаг дугуй зорчих боломжтой замын нэршилд хамаарахгүй 2 нь аль вэ?","c":["Унадаг дугуйн тусгай зам","Унадаг дугуйн давуу эгнээ","Унадаг дугуй, моторт унадаг дугуйн хамтарсан зам","Унадаг дугуйн давуу зам"],"a":"2, 3","imgs":[],"t":"문장형","e":"Унадаг дугуй явж болох замд унадаг дугуйн зориулалтын зам, унадаг дугуйн тусгай эгнээ, унадаг дугуйн давуу эрхтэй зам, унадаг дугуй, явган зорчигчийн хамтарсан зам байдаг."},{"n":590,"b":"Түлшний зарцуулалтын үр ашиг хамгийн өндөр жолоодох арга аль нь вэ?","c":["Хамгийн дээд хурдтай явна.","Хамгийн бага хурдтай явна.","Хэмнэлттэй хурдтай явна.","Аюулгүй хурдтай явна."],"a":"3","imgs":[],"t":"문장형","e":"Хэмнэлттэй хурдаар явах нь түлшний зарцуулалтын үр ашгийг хамгийн их дээшлүүлэх жолоодлогын арга юм."},{"n":591,"b":"Байгаль орчинд ээлтэй, хэмнэлттэй жолоодлогын хамгийн зөв арга аль нь вэ?","c":["Аль болох хурдан хурдаа нэмнэ.","Уруу замд хөдөлгүүрээ унтраагаад уруудна.","Дугуйн агаарын даралтыг бууруулна.","Огцом сааруулахыг аль болох зайлсхийх."],"a":"4","imgs":[],"t":"문장형","e":"Огцом хурдлах, хурд бууруулах нь түлшний хэмнэлтийг бууруулах шалтгаан болдог бөгөөд дугуйн хийн даралтыг хэт бууруулбал дугуйн голч багасаж түлшний хэмнэлт буурах ба уруудах замд хөдөлгүүрийг унтраавал тоормосны хүч нэмэгдүүлэгч төхөөрөмж ажиллахгүй тоормос ажиллахгүй болох тул зөв бус жолоодлогын арга юм."},{"n":592,"b":"Автомашины агааржуулагчийг ашиглах болон шалгах талаар хамгийн зөв тайлбар аль нь вэ?","c":["Агааржуулагчийг анх асаахдаа өндөр горимоор эхлүүлээд дараа нь бага горимд шилжүүлнэ.","Агааржуулагчийн хөргөлтийн шингэнийг 6 сар тутам сольдог.","Агааржуулагчийн тохиромжтой температур нь Цельсийн 16 хэм.","Агааржуулагч ажиллуулахдаа боломжтой бол гадна агаар оруулах горимыг ашиглах нь үр дүнтэй."],"a":"1","imgs":[],"t":"문장형","e":"Агааржуулагч хэрэглэх нь түлшний зарцуулалтын үр ашигтай холбоотой бөгөөд агааржуулагчийн хөргөгч бодис нь озоны давхаргыг устгадаг байгаль орчны бохирдуулагч бодис тул аль болох хэрэглээг багасгах эсвэл үр ашигтай хэрэглэх нь зүйтэй."},{"n":593,"b":"Дараахын аль нь автомашины түлшний хэмнэлтийг сайжруулах хамгийн зөв арга вэ?","c":["Шатахуун хийх бүрдээ үргэлж дүүрэн хийдэг.","Хөдөлгүүрийн тос солихдоо тосны шүүлтүүр болон агаарын шүүлтүүрийг хамт солино.","Зогсохдоо тоормосны дөрөөг нэг дор хүчтэй гишгэж тоормослоно.","Хааз болон тоормосны дөрөөг байнга ашиглана."],"a":"2","imgs":[],"t":"문장형","e":"Хөдөлгүүрийн тос нь хөдөлгүүрийн доторх тосолгоо болон хөргөлт, битүүмжлэл, цэвэрлэгээний үйлчилгээ зэргээр дамжуулан хөдөлгүүрийн гүйцэтгэлийг дээшлүүлж, ашиглалтын хугацааг уртасгах үүрэгтэй. Хэрэв хөдөлгүүрийн тос дутуу байдалд автомашиныг үргэлжлүүлэн жолоодвол хөдөлгүүрийн доторх хөдөлгөөнт хэсгүүд наалдаж хөдөлгүүр эвдрэх шалтгаан болдог ба солих хугацааг хэтрүүлбэл хөдөлгүүрийн тосны зуурамтгай чанар нэмэгдэж түлшний хэмнэлтэд ч муугаар нөлөөлдөг тул удаан хугацаагаар жолоодохын өмнө явсан зай болон хэрэглэсэн хугацааг харгалзан шалгаж солих ба тосны шүүлтүүр болон агаарын шүүлтүүрийг ч хамт солих нь зүйтэй."},{"n":594,"b":"Явж байх үед хаазны дөрөөнөөс хөлөө авах эсвэл арааг бага араанд шилжүүлэн автомашины хурдыг бууруулах жолоодлогын аргыг юу гэдэг вэ?","c":["Арааг сул байрлалд тавих","Хөлийн тоормос","Зогсоолын тоормос","Хөдөлгүүрийн тоормос"],"a":"4","imgs":[],"t":"문장형","e":"Хөдөлгүүрийн тоормос ашиглах тухай тайлбар юм."},{"n":595,"b":"Дараахын аль нь автомашины түлшний хэмнэлтийг сайжруулах хамгийн зөв жолоодлогын арга вэ?","c":["Автомашин эвдэрч болзошгүй тул төрөл бүрийн багаж, сэлбэг байнга ачиж явна.","Тогтмол хурдтай явна.","Огцом хөдөлж, огцом хурдалж, огцом тоормослохыг байнга хийдэг.","Түлш хэмнэхийн тулд дугуйн агаарын даралтыг анхны хэмжээнээс нь 30 хувьтай тэнцэх хэмжээнд хүртэл бууруулж явна."],"a":"2","imgs":[],"t":"문장형","e":"Тогтмол хурдтай явах нь түлшний хэмнэлтийг дээшлүүлэхэд тусалдаг."},{"n":596,"b":"Дараахын аль нь жолоодлогын дадлаа сайжруулах замаар хэрэгжүүлэх байгаль орчинд ээлтэй, хэмнэлттэй жолоодлого биш вэ?","c":["Автомашины түлшийг үргэлж дүүрэн байлгана.","Зөөлөн хөдөлж эхэлнэ.","Тогтмол хурдтай явна.","Хэмнэлттэй хурдыг мөрдөнө."],"a":"1","imgs":[],"t":"문장형","e":"Жолоодлогын дадлаа сайжруулах замаар хэрэгжүүлж болох хэмнэлттэй жолоодлогод хөдөлгүүрийг сул ажиллуулахыг багасгах, зөөлөн хөдлөх, тогтмол хурдаар явах, хэмнэлттэй хурдыг баримтлах, инерцийн жолоодлогыг ашиглах, агааржуулагч хэрэглэхээс татгалзах зэрэг орно. (Газар, дэд бүтэц, тээврийн яам болон Тээврийн аюулгүй байдлын газраас санал болгож буй хэмнэлттэй жолоодлого)"},{"n":597,"b":"Дараахын аль нь автомашины байгаль орчинд ээлтэй, хэмнэлттэй жолоодлогын арга вэ?","c":["Дугуйн агаарын даралтыг бага байлгана.","Агааржуулагчийг бага горимоор эхлүүлнэ.","Хөдөлгүүрийн тос солихдоо тосны шүүлтүүр болон агаар шүүгчийг солихгүйгээр үргэлжлүүлэн ашиглана.","Автомашины түлшийг тал орчим хэмжээнд байлгана."],"a":"4","imgs":[],"t":"문장형","e":"Дугуйны хийн даралтыг зохистой түвшинд байлгаж, агааржуулагчийг өндөр түвшнээс эхлүүлээд доод түвшинд байлгаж, агаар шүүгч зэрэг элэгдэх хэрэгслийн арчилгааг сайтар хийнэ. Мөн автомашины жинг багасгахын тулд шаардлагагүй ачааг гаргаж тэвшийг хоослон, автомашины түлшийг ойролцоогоор хагас л дүүргэнэ."},{"n":598,"b":"Устөрөгчийн автомашины талаарх тайлбаруудаас зохисгүй нь аль вэ?","c":["Автомашинд гал гарсан үед автомашинаас хол аюулгүй газар руу зугтана.","Устөрөгч алдагдсан тухай анхааруулах гэрэл асвал нэн даруй аюулгүй газар түр зогсоож, хөдөлгүүрийг унтраана.","Устөрөгчийн суудлын автомашины жолооч тусгай аюулгүй ажиллагааны сургалт заавал дүүргэх шаардлагагүй.","Устөрөгчийн автомашины цэнэглэх станц дээр жолооч өөрөө дур мэдэн станцын тоног төхөөрөмжийг ажиллуулсан."],"a":"4","imgs":[],"t":"문장형","e":"Устөрөгчийн том оврын олон суудалт автомашин (суудлын багтаамж 36 ба түүнээс дээш) жолоодох гэж буй жолооч л аюулгүй байдлын сургалт (тусгай сургалт)-д хамрагдах ёстой. Устөрөгчийн автомашины цэнэглэх станцын тоног төхөөрөмжийг жолооч дур мэдэн ажиллуулж болохгүй."},{"n":599,"b":"Дараахын аль нь хэмнэлттэй жолоодлогын талаар жолоочийн зөв дадлаас хамгийн зохисгүй нь вэ?","c":["Уруу замд явахдаа хаазны дөрөөг гишгэхгүй байх","Зардал хэмнэхийн тулд хуурамч, стандартын шаардлага хангаагүй түлш хэрэглэх","Зөөлөн хөдөлж эхлэх, огцом зогсохгүй байх","Дугуйн агаарын даралтыг тогтмол шалгах"],"a":"2","imgs":[],"t":"문장형","e":"Хуурамч (орлуулах) түлш хэрэглэх нь тээврийн хэрэгслийн эвдрэл, байгаль орчны бохирдлын шалтгаан болж болно."},{"n":600,"b":"Байгаль орчинд ээлтэй автомашиныг хөгжүүлэх болон түгээн дэлгэрүүлэхийг дэмжих тухай хуулийн дагуу байгаль орчинд ээлтэй автомашины тусгай зогсоолд зогсоож болохгүй автомашин аль нь вэ?","c":["Цахилгаан автомашин","Нарны эрчим хүчний автомашин","Хайбрид автомашин","Устөрөгчийн цахилгаан автомашин"],"a":"2","imgs":[],"t":"문장형","e":"Байгаль орчинд ээлтэй автомашины хөгжүүлэлт, түгээлтийг дэмжих тухай хуулийн 11-2 дугаар зүйл-ын 7 дахь хэсэг: Цахилгаан автомашин, хайбрид автомашин, устөрөгчийн цахилгаан автомашинд хамаарахгүй автомашиныг байгаль орчинд ээлтэй автомашины зориулалтын зогсоолд тавьж болохгүй."},{"n":601,"b":"Дараахын аль нь устөрөгчийн автомашины талаар зөв тайлбар вэ?","c":["Устөрөгч нь шатамхай хий тул бүх устөрөгчийн автомашины жолооч өндөр даралтын хийн аюулгүй байдлын удирдлагын тухай хуулийн дагуу жолоочийн тусгай сургалтад хамрагдах ёстой.","Устөрөгчийн автомашин нь устөрөгчийг шатаадаг тул байгаль орчны бохирдол үүсгэдэг.","Устөрөгчийн автомашинд гал түймэр зэрэг онцгой нөхцөл үүсэх үед дэлбэрэлтээс хамгаалах тусгай аюулгүй ажиллагааны төхөөрөмж байдаггүй.","Устөрөгчийн автомашины жолооч тухайн автомашин аюулгүй зорчиход саадгүй эсэхийг шалгаж, аюулгүй жолоодох ёстой."],"a":"4","imgs":[],"t":"문장형","e":"① Өндөр даралтат хийн аюулгүй байдлын удирдлагын тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 31-ийн дагуу устөрөгчийн том оврын олон суудалт автомашин (суудлын багтаамж 36 ба түүнээс дээш)-ыг шинээр жолоодох гэж буй жолооч тусгай сургалтад хамрагдах ёстой боловч бусад жолооч сургалтын хамрах хүрээнд ордоггүй. ② Устөрөгчийн автомашин нь саванд хадгалагдсан устөрөгч, хүчилтөрөгчийн химийн урвалаар үүссэн цахилгаанаар моторыг ажиллуулж автомашиныг хөдөлгөдөг зарчимтай бөгөөд устөрөгчийг шатаадаггүй. ③ Устөрөгчийн автомашинд гал түймэр зэрэг шалтгаанаар температур нэмэгдэх үед сав зэргийг дэлбэрэхээс сэргийлэх аюулгүйн хавхлага суурилуулсан байдаг тул онцгой байдал үүсэхэд аюулгүйн хавхлага нээгдэж устөрөгч гадагш гарч дэлбэрэлтээс сэргийлдэг. ④ Тээврийн аюулгүй байдлын тухай хуулийн 7 дугаар зүйлийн дагуу тээврийн хэрэгсэл жолоодож буй хүн зэрэг нь хууль тогтоомжид заасны дагуу тухайн тээврийн хэрэгсэл аюулгүй ажиллахад саадгүй эсэхийг шалгаж аюулгүй жолоодох ёстой."},{"n":602,"b":"Дараахын аль нь автомашины яндангийн хийн нарийн ширхэгт тоосонцрыг бууруулах хамгийн зөв жолоодлогын арга вэ?","c":["Хөдөлж эхлэхдээ хаазны дөрөөг хүчтэй гишгэн хөдөлнө.","Огцом хурдлахгүйгээр зөөлөн хөдөлж эхэлнэ.","Явах үедээ байнга хаазалж, зогсох үйлдлийг давтана.","Түр зогсох болон зогсоолд тавих үед хөдөлгүүрээ унтраахгүй сул ажиллуулна."],"a":"2","imgs":[],"t":"문장형","e":"Байгаль орчинд ээлтэй жолоодлогод огцом хөдлөх, огцом тоормослох, огцом хурдлахаас зайлсхийх ёстой бөгөөд явах үедээ тогтмол хурдаар явах ба байнга хурдлах, зогсохыг давтах нь зохимжгүй. Мөн зогсох болон зогсоолд тавих үед хөдөлгүүрийг үргэлжлүүлэн сул ажиллуулж болохгүй."},{"n":603,"b":"Дараах зүйлсээс устөрөгчөөр ажилладаг автомашины үндсэн эд анги биш нь аль вэ?","c":["Түлшний элементийн систем (Stack)","Устөрөгч хадгалах сав","Дотоод шаталтын хөдөлгүүрээр ажилладаг цахилгаан үүсгүүр","Хөдөлгөгч мотор"],"a":"3","imgs":[],"t":"문장형","e":"Устөрөгчийн автомашин нь саванд хадгалагдсан устөрөгчийг түлшний элементийн систем (стак)-д хүчилтөрөгчтэй химийн урвалд оруулж үүссэн цахилгаанаар моторыг ажиллуулан автомашиныг хөдөлгөдөг зарчимтай."},{"n":604,"b":"Дараахын аль нь байгаль орчинд ээлтэй жолоодлоготой холбоотой зөв 2 тайлбар вэ?","c":["Хүлэмжийн хийг бууруулах зорилтыг тогтоосон Киотогийн протоколтой холбоотой.","Агаарын бохирдол үүсгэдэг бодист нүүрсустөрөгч, нүүрстөрөгчийн дутуу исэл, нүүрстөрөгчийн давхар исэл, азотын ислүүд зэрэг орно.","Автомашины бүхээгийн температурыг нэмэгдүүлэхийн тулд хөдөлгүүр асаасны дараа удаан хугацаагаар сул ажиллуулна.","Автомашинаа тогтмол үзлэгт оруулж, 2,000 км тутамд хөдөлгүүрийн тосыг заавал солино."],"a":"1, 2","imgs":[],"t":"문장형","e":"Хөдөлгүүрийг сул ажиллуулж болохгүй бөгөөд автомашиныг байнга шалгаж, хөдөлгүүрийн тосыг бохирдлын зэргээс (ойролцоогоор 10,000 км явсны дараа) хамааран солих нь хэмнэлттэй. Киотогийн протокол нь хөгжингүй орнуудын хүлэмжийн хийг бууруулах зорилтыг тогтоосон олон улсын гэрээ бөгөөд 2005 оны 2 дугаар сарын 16-нд албан ёсоор хүчин төгөлдөр болсон."},{"n":605,"b":"Дараахын аль автомашин хамгийн их хэмжээний хорт яндангийн хий ялгаруулдаг вэ?","c":["Цахилгаан автомашин","Устөрөгчийн автомашин","LPG(Шингэрүүлсэн хийн түлштэй) автомашин","Хуучирсан дизель автомашин"],"a":"4","imgs":[],"t":"문장형","e":"Дизель түлш хэрэглэдэг хуучирсан дизель автомашин нь хамгийн их хортой утаа ялгаруулдаг автомашин юм."},{"n":606,"b":"Байгаль орчинд ээлтэй, хэмнэлттэй жолоодлогын үед инерцээр явах (fuel cut) арга биш нь аль вэ?","c":["Уулзварт орохын өмнө хаазны дөрөөнөөс хөлөө авч, хөдөлгүүрийн тоормос ашиглана.","Тэгш зам дээр хурдыг бууруулахгүйгээр хаазны дөрөөг үргэлжлүүлэн гишгэнэ.","Уруу замд хөдөлгүүрийн тоормосыг зохистой ашиглана.","Өгсүүрт орохоос өмнө хаазалж инерцийг ашиглана."],"a":"2","imgs":[],"t":"문장형","e":"Түлшний хангамжийг таслах функцийг идэвхтэй ашигладаг инерцийн жолоодлогыг (тогтмол хурдыг хадгалах үед хурдасгуурын дөрөөг гишгэхгүй байхыг хэлнэ) хэвшил болгоно."},{"n":607,"b":"Дараахын аль нь автомашины яндангийн хийн дахин эргэлтийн төхөөрөмж (Exhaust Gas Recirculation, EGR) голчлон бууруулдаг бодис вэ?","c":["Азотын ислүүд (Nox)","Нүүрсустөрөгч (HC)","Нүүрстөрөгчийн дутуу исэл (CO)","Нүүрстөрөгчийн давхар исэл (CO₂)"],"a":"1","imgs":[],"t":"문장형","e":"Утааны хийг дахин эргэлтэд оруулах төхөөрөмж (EGR) нь идэвхгүй утааны хийн нэг хэсгийг сорох системд буцааж оруулж, хөдөлгүүрт сорогдох хольц хийтэй холилдон шаталтын үеийн хамгийн өндөр температурыг бууруулснаар хортой бохирдуулагч болох NOx (азотын исэл)-ийг голчлон дарангуйлдаг төхөөрөмж юм."},{"n":608,"b":"Дараахын аль нь устөрөгчийн автомашины үзлэгийн талаар буруу тайлбар вэ?","c":["Устөрөгч нь шатамхай хий тул устөрөгчийн автомашинд тогтмол үзлэг хийх нь зайлшгүй шаардлагатай.","Устөрөгчийн автомашины үзлэгийг агааржуулалт сайтай газар хийх ёстой.","Үзлэг хийхдээ хийн хоолой, цэнэглэх холбогч зэрэгт устөрөгч алдагдсан эсэхийг шалгах ёстой.","Устөрөгчийн автомашины жолооч тухайн автомашин аюулгүй зорчиход саадгүй эсэхийг шалгах үүрэггүй."],"a":"4","imgs":[],"t":"문장형","e":"Тээврийн аюулгүй байдлын тухай хуулийн 7 дугаар зүйл (Тээврийн хэрэгслийн жолооч зэргийн үүрэг)-ийн дагуу тээврийн хэрэгсэл жолоодож буй хүн зэрэг нь хууль тогтоомжид заасны дагуу тухайн тээврийн хэрэгсэл аюулгүй ажиллахад саадгүй эсэхийг шалгаж, явган зорчигч болон унадаг дугуй хэрэглэгчдэд аюул, хохирол учруулахгүйгээр аюулгүй жолоодох ёстой."},{"n":609,"b":"Устөрөгчийн автомашины жолооч цэнэглэх станцыг ашиглах үед анхаарах зүйлсээс буруу нь аль вэ?","c":["Устөрөгчийн автомашины цэнэглэх станцын орчимд тамхи татаж болохгүй.","Устөрөгчийн автомашинд түлш цэнэглэж байх үед автомашиныг хөдөлгөж болно.","Устөрөгчийн автомашинд түлш цэнэглэж байх үед хөдөлгүүрийг унтраана.","Цэнэглэх станцын ажилтан байхгүй үед дур мэдэн цэнэглэгчийг ажиллуулахгүй."],"a":"2","imgs":[],"t":"문장형","e":"① Устөрөгчийн автомашины цэнэглэх станцын орчимд тамхи татахыг хориглоно. ② Устөрөгчийн автомашины түлш цэнэглэлт дууссан эсэхийг шалгасны дараа хөдөлнө. ③ Устөрөгчийн автомашинд түлш цэнэглэхийн өмнө хөдөлгүүрийг заавал унтраана. ④ Устөрөгчийн автомашины цэнэглэх станцын тоног төхөөрөмжийг зөвхөн станцын ажилтан ажиллуулж болно."},{"n":610,"b":"Дараахын аль нь устөрөгчийн автомашинд түлш цэнэглэх үед жолоочийн зохисгүй үйлдэл вэ?","c":["Түлш цэнэглэхийн өмнө хөдөлгүүрийг унтраана.","Устөрөгчийн автомашины цэнэглэх төхөөрөмжийн ойролцоо тамхи татсан.","Устөрөгчийн автомашины цэнэглэх станцын тоног төхөөрөмжийг дур мэдэн ажиллуулаагүй.","Түлш цэнэглэж дууссаны дараа хөдөлгүүрийг асаасан."],"a":"2","imgs":[],"t":"문장형","e":"Устөрөгчийн автомашины цэнэглэх станцын доторх байгууламжид заасан газраас бусад газарт тамхи татаж болохгүй. «Өндөр даралтат хийн аюулгүй байдлын удирдлагын тухай хууль»-ийг хэрэгжүүлэх дүрмийн Хавсралт 5, KGS Code FP216/FP217 2.1.2 (галтай харьцах зай)-ын дагуу хийн тоног төхөөрөмжийн гадна талаас гал ашиглах газар хүртэл 8 м-ээс багагүй тойруу зай байлгах ёстой."},{"n":611,"b":"Ачаа ачсан өөрөө буулгагч ачааны машин уруу замаар бууж байгаа үед дараахын аль нь хамгийн аюулгүй жолоодох арга вэ?","c":["Түлш хэмнэхийн тулд арааг сул байрлалд тавин явна.","Тоормосны дөрөөг хэсэгчлэн гишгэхэд тоормосны үр нөлөө байхгүй тул нэг дор хүчтэй гишгэнэ.","Урд автомашин гэнэт зогсохыг тооцоолж хангалттай зай барина.","Дуут дохиог чанга өгч, хурдыг нэмэгдүүлэн хурдан явна."],"a":"3","imgs":[],"t":"문장형","e":"Ачаа ачсан самосвал нь ачааны жингээс болж тоормосны систем эвдрэх эрсдэлтэй тул араагаа доод шатанд байлгаж хөдөлгүүрийн тоормосыг ашиглан, тоормосны дөрөөг байнга хувааж гишгэж тоормосны системд ачаалал өгөхийг багасгаж, аюулгүй зайг хангалттай барих ёстой."},{"n":612,"b":"Дараахын аль нь ачааг буруу ачсанаас үүдэлтэй зам тээврийн ослыг бууруулахын тулд жолоочийн авах хамгийн зөв арга хэмжээ вэ?","c":["Ачаа ачиж тээвэрлэхдээ заавал бүтээлгээр бүтээнэ.","Нөөц дугуй зэрэг бэхлэгдсэн эд ангийг шалгах шаардлагагүй.","Ачааг хурдан хүргэхийн тулд сулхан бэхэлнэ.","Ойрын зайд явах бол ачааг бэхлэх шаардлагагүй."],"a":"1","imgs":[],"t":"문장형","e":"Ачаа ачиж явах үед ойрын зайд ч гэсэн ачааг заавал бат бөх бэхэлж, бүрээс тавьж хөдлөхгүй болгож, хөдлөхийн өмнө нөөц дугуй зэрэг бэхлэгдсэн зүйлсэд гэмтэл байгаа эсэхийг шалгаж баталгаажуулан, засаж залруулсны дараа хөдлөх ёстой."},{"n":613,"b":"Ачааны автомашинд ачаа ачих талаарх тайлбаруудаас хамгийн буруу нь аль вэ?","c":["Ачааг ачихдаа ачааны хэсгийн төвөөс эхлэн баруун, зүүн тийш жигд ачаална.","Ачааны автомашины жингийн төв урд хэсэгт байдаг тул ачааны хэсгийн ар талаас эхлэн ачаална.","Илүү хүнд ачааг ачааны хэсгийн доод талд байрлуулна.","Ачааг бүрэн ачсаны дараа автомашинаас унахгүйгээр сайтар бэхэлнэ."],"a":"2","imgs":[],"t":"문장형","e":"Ачаа тээврийн ажилтны мэргэшлийн шалгалтын сурах бичгийн ачаа зөөвөрлөх зааврын дагуу ачааны тэвшинд ачаа ачих үед жин урагш, хойш хэлбийхгүй байхаар тэнцвэртэй ачина."},{"n":614,"b":"Том оврын болон тусгай зориулалтын автомашины тоормосны онцлогийн талаарх тайлбар юм. Буруу нь аль вэ?","c":["Ачааллын өөрчлөлтөөс хамааран өөрчлөгдөнө.","Дугуйн агаарын даралт болон хээ жигд биш бол тоормосны зам өөрчлөгдөнө.","Автомашины жингээс хамааран өөрчлөгдөнө.","Автомашины ачаалал ихсэх тусам бодит тоормосны зам богиносдог."],"a":"4","imgs":[],"t":"문장형","e":"Тээврийн хэрэгслийн жин (ачааны хэмжээ) ихсэх тусам бодит тоормосны зай уртасдаг тул аюулгүй зай барих болон тоормосны дөрөөний ажиллагаанд анхаарах ёстой."},{"n":615,"b":"Дараах нь нам шалтай автобусны онцлогийн талаарх тайлбар юм. Хамгийн тохиромжгүй нь аль вэ?","c":["Ахмад настан болон хөгжлийн бэрхшээлтэй хүн амархан сууж, бууж чадна.","Шалны өндөр нь энгийн автобуснаас нам байдаг.","Үүдэнд шатны оронд налуу тавцан суурилуулсан байдаг.","Автомашины нийт өндөр нь энгийн автобусны хагас байдаг."],"a":"4","imgs":[],"t":"문장형","e":"Шал нь нам, орох хаалганд шатгүй автобус юм. Ердийн автобусны шатаар өгсөж уруудахад хүндрэлтэй, зорчиход бэрхшээлтэй хүмүүс, ялангуяа хөгжлийн бэрхшээлтэй хүмүүсийн зорчих эрхийг хангах зорилгоор нэвтрүүлсэн."},{"n":616,"b":"Явалтын бүртгэгч суурилуулаагүйгээр чиргүүлтэй тусгай зориулалтын тээврийн хэрэгслийг (Ачааны автомашины тээврийн бизнесийн тухай хуульд заасан автомашинд хамаарна) жолоодсон бол жолоочид ямар шийтгэл ногдуулах вэ?","c":["100,000 воны торгууль","100,000 воны зөрчлийн торгууль","70,000 воны торгууль","70,000 воны зөрчлийн торгууль"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 50 дугаар зүйлийн 5 дахь хэсэг, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8-ын 16 дахь заалт: явалтын бүртгэлийн төхөөрөмж суурилуулаагүй олон суудалт автомашин зэрэг (тусгай автомашин)-ийг жолоодсон тохиолдолд зөрчлийн торгууль 70,000 вон; Тээврийн аюулгүй байдлын тухай хуулийн 55 дугаар зүйлийн 1 дэх хэсэг, Тээврийн аюулгүй байдлын тухай хуулийг хэрэгжүүлэх журмын Хавсралт 9: явалтын бүртгэлийн төхөөрөмж суурилуулаагүй тохиолдолд захиргааны торгууль 500,000~1,500,000 вон."},{"n":617,"b":"Ачааны автомашины ачаа унахаас урьдчилан сэргийлэх талаарх тайлбаруудаас хамгийн буруу нь аль вэ?","c":["Өнхрөх магадлалтай ачаанд тулгуур мод эсвэл ачааны тулгуур хэрэглэнэ.","Барилгын машин механизм зэрэг ачааг ачсан үед утас, олс зэргийг ашиглана.","Ачааны хэсгийн урд, хойд, баруун, зүүн талд сул зай байвал тулгуур мод зэргийг ашиглана.","Ачаа унахаас хамгаалах шаардлага зөрчсөн тохиолдолд зөрчлийн торгууль 50,000 вон, торгуулийн оноо 10 байна."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8, ачаа унахаас сэргийлэх үүргийн зөрчил: 4 тонноос дээш ачааны автомашин зөрчлийн торгууль 50,000 вон, 4 тонн ба түүнээс доош ачааны автомашин зөрчлийн торгууль 40,000 вон; Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28, ачаа унахаас сэргийлэх үүргийн зөрчилд торгуулийн оноо 15 оноо."},{"n":618,"b":"Төлбөртэй тээврийн зориулалтаар бүртгэгдсэн бизнесийн зориулалтын ачааны автомашины жолооч заавал ямар үнэмлэхтэй байх ёстой вэ?","c":["Автомашин засварын мэргэжлийн үнэмлэх","Ачаа тээврийн жолоочийн мэргэшлийн үнэмлэх","Такси жолоочийн мэргэшлийн үнэмлэх","1-р ангиллын тусгай жолоодох эрхийн үнэмлэх"],"a":"2","imgs":[],"t":"문장형","e":"Аж ахуйн (арилжааны) ачааны автомашин (жижиг ачаа тээвэр, хувийн, ерөнхий)-ы жолооч ачаа тээврийн ажилтны мэргэшлийг заавал авсны дараа жолоодох ёстой."},{"n":619,"b":"Дараах нь том оврын ачааны автомашины онцлогийн талаарх тайлбар юм. Хамгийн тохирох нь аль вэ?","c":["Ачааны төрөлөөс хамааран эргэлтийн радиус болон тогтвортой байдал ихээхэн өөрчлөгдөж болно.","Тэнхлэг хоорондын зай урт тул тогтвортой байдал маш муу байдаг.","Суудлын автомашинтай харьцуулахад жолооны хүрдний буцах чадвар илүү сайн байдаг.","Автомашины жин хөнгөн боловч хэмжээ нь суудлын автомашинаас том байдаг."],"a":"1","imgs":[],"t":"문장형","e":"Том оврын ачааны автомашин нь суудлын автомашинтай харьцуулахад жолооны хүрд буцах хүч нь төдийлөн сайн биш, их бие нь хүнд, тэнхлэг хоорондын зай урт тул харьцангуй тогтвортой байдал нь өндөр бөгөөд ачааны төрлөөс хамаарч эргэлтийн радиус, тогтвортой байдал нь ихээхэн өөрчлөгдөж болно."},{"n":620,"b":"Дараахын аль нь тээврийн үйлчилгээний зориулалттай автомашин зэрэг замын хөдөлгөөний тухай хуульд заасан явалтын бүртгэгч суурилуулах ёстой автомашины жолоочийн зөв үйлдэл вэ?","c":["Явалтын бүртгэгчгүй автомашин жолоодох","Эвдэрсэн тул ашиглах боломжгүй явалтын бүртгэгчтэй автомашин жолоодох","Явалтын бүртгэгчийг зориулалтын дагуу ашиглахгүйгээр автомашин жолоодох","Явалтын бүртгэгчийг тогтмол арчилж, эвдрэл гэмтлээс урьдчилан сэргийлэх"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 50 дугаар зүйл (Тодорхой жолоочийн дагаж мөрдөх зүйл)-ийн 5 дахь хэсгийн заалт бүр: явалтын бүртгэлийн төхөөрөмж суурилуулаагүй буюу эвдрэл зэргээс ашиглах боломжгүй явалтын бүртгэлийн төхөөрөмж суурилуулсан автомашиныг жолоодох, эсвэл явалтын бүртгэлийн төхөөрөмжийг анхны зориулалтаар нь ашиглахгүйгээр автомашин жолоодох үйлдэл хийж болохгүй."},{"n":621,"b":"1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрхийн үнэмлэх авахад шаардагдах сонсголын шалгуур хэд вэ? ( Сонсголын аппарат хэрэглэгчийг оруулахгүй)","c":["25 децибел","35 децибел","45 децибел","55 децибел"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 45 дугаар зүйлийн 1 дэх хэсгийн дагуу том оврын тээврийн хэрэгсэл жолоодох эрх буюу тусгай жолоодох эрх авах гэж буй тохиолдолд жолоодоход шаардлагатай чадварын шалгуур нь 55 децибел (сонсголын аппарат хэрэглэдэг хүн 40 децибел)-ийн чимээг сонсох чадвартай байх явдал юм."},{"n":622,"b":"Дараахын аль нь том оврын ачааны автомашины онцлогийн талаар хамгийн зөв тайлбар вэ?","c":["Ачсан ачааны байрлал болон өндрөөс хамааран автомашины жингийн төв өөрчлөгдөнө.","Жингийн төв нь дээш, доош чиглэлд бараг өөрчлөгддөггүй.","Жингийн төвийн өндөр нь доргилтын шинж чанарт бараг нөлөөлдөггүй.","Доргилтын шинж чанар байхгүй тул том оврын ачааны автомашины хэлбэлзлийн өнцөг суудлын автомашинаас маш бага байдаг."],"a":"1","imgs":[],"t":"문장형","e":"Том оврын ачааны автомашин нь чичиргээний онцлогтой бөгөөд чичиргээний өнцөг нь суудлын автомашинтай харьцуулахад маш их, хүндийн төвийн өндөр нь чичиргээний онцлогт нөлөөлдөг ба хүндийн төв нь дээш, доош чиглэлд ч нөлөөлдөг."},{"n":623,"b":"Дараахын аль нь том оврын ачааны автомашины жолоодлогын онцлогийн талаар хамгийн зөв тайлбар вэ?","c":["Их жинтэй, урт тэнхлэг хоорондын зайтай тул тогтвортой байдал муу байдаг.","Өндөр хурдтай явах үед автомашины их бие савлаж, заримдаа чигээрээ явах тогтвортой байдал түр хугацаанд муудаж болно.","Жолооны хүрдийг эргүүлэх үед жижиг суудлын автомашинаас ялгаатай нь жолооны хүрд өөрөө буцах чадвар сайн байдаг.","Жолоочийн суудал өндөр тул цаг агаар муу үед харагдах орчин улам сайжирдаг."],"a":"2","imgs":[],"t":"문장형","e":"Том оврын ачааны автомашины жолоочийн суудал өндөр гэдэг нь цаг агаар муу үед харагдах байдал сайжирна гэсэн үг биш бөгөөд жижиг оврын суудлын автомашинтай харьцуулахад жолооны хүрд буцах хүч нь төдийлөн сайн биш, хүнд жин, урт тэнхлэг хоорондын зайгаас болж тогтвортой байдал нь суудлын автомашинаас өндөр байдаг."},{"n":624,"b":"Дараахын аль нь том оврын ачааны автомашины сохор бүс болон тоормослох үеийн ачааллын өөрчлөлтийн талаар хамгий н зөв тайлбар вэ?","c":["Сохор бүс нь хамартай автомашин болон хамаргүй автомашины хооронд бараг ялгаагүй.","Урд болон хойд дугуйн тоормосны хүч нь ачааллын өөрчлөлттэй холбоогүй.","Жолоочийн суудлын баруун талынхаас зүүн талын сохор бүс илүү өргөн байдаг.","Ачааны жингийн өөрчлөлтөөс хамааран тоормосны хүчинд ялгаа гардаг."],"a":"4","imgs":[],"t":"문장형","e":"Том оврын ачааны автомашины үл үзэгдэх бүс нь капоттой эсэхээс хамаарч ихээхэн ялгаатай, ачааллын өөрчлөлт нь урд, хойд дугуйны тоормосны хүчинд нөлөөлдөг бөгөөд жолоочийн суудлын зүүн талаас баруун талын үл үзэгдэх бүс нь хамаагүй өргөн байдаг."},{"n":625,"b":"Замын хөдөлгөөний тухай хуулийн дагуу ачааны автомашины ачааны багтаамжийн аюулгүй ажиллагааны стандартыг зөрчсөн автомашин аль нь вэ?","c":["Автомашины уртын 10-ны 2-ыг нэмсэн урттай","Арын харах толины тусламжтайгаар ар талыг харах боломжтой өргөнтэй","Газраас 3.9 метрийн өндөртэй","Бүтэц, техникийн үзүүлэлтэд заасан ачааны жингийн 105 хувьтай"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 22 дугаар зүйл (Ашиглалтын аюулгүй байдлын шалгуур): Хуулийн 39 дүгээр зүйлийн 1 дэх хэсгийн үндсэн хэсэгт заасан \"Ерөнхийлөгчийн зарлигаар тогтоосон ашиглалтын аюулгүй байдлын шалгуур\" гэж дараах заалтуудыг хэлнэ. 3. Ачааны автомашины ачааны жин нь бүтэц, хүчин чадалд тохирсон ачааны жингийн 110 хувийн дотор байх. 4. Автомашин (зөвхөн ачааны автомашин, хоёр дугуйт тээврийн хэрэгсэл болон жижиг оврын 3 дугуйт автомашинд хамаарна)-ы ачааны багтаамж нь дараах дэд заалтын ангиллын дагуух шалгуураас хэтрэхгүй байх. \"а\" Урт: автомашины уртад түүний уртын 10-ны 1-ийг нэмсэн урт. Гэхдээ хоёр дугуйт тээврийн хэрэгслийн хувьд суух төхөөрөмжийн урт буюу ачих төхөөрөмжийн уртад 30 сантиметр нэмсэн уртыг хэлнэ. \"б\" Өргөн: автомашины хойд толиноор ар талыг харж болох хүрээ (ачааг хойд толины өндрөөс нам ачсан тохиолдолд тухайн ачааг, хойд толины өндрөөс өндөр ачсан тохиолдолд ар талыг харж болох хүрээг хэлнэ)-ний өргөн. \"в\" Өндөр: ачааны автомашин газраас 4 метр (замын бүтцийг хамгаалах, хөдөлгөөний аюулгүй байдалд саадгүй гэж үзэж зарласан замын чиглэлийн хувьд 4 метр 20 сантиметр), жижиг оврын 3 дугуйт автомашин газраас 2 метр 50 сантиметр, хоёр дугуйт тээврийн хэрэгсэл газраас 2 метрийн өндөр."},{"n":626,"b":"Дараах 1-р ангиллын тусгай жолоодох эрхийн үнэмлэхийн талаарх тайлбаруудаас зөвийг сонгоно уу.","c":["Бага оврын чирэгчийн жолоодох эрхийн үнэмлэхээр 3.5 тонн ачааны даацтай чиргүүлтэй тусгай зориулалтын тээврийн хэ рэгсэл жолоодож болно.","Бага оврын чирэгчийн жолоодох эрхийн үнэмлэхээр 4 тонн ачааны автомашин жолоодож болно.","Аврах автомашины жолоодох эрхийн үнэмлэхээр суудлын багтаамж 12 хүнтэй олон суудалт автомашин жолоодож болно.","Том оврын чирэгчийн жолоодох эрхийн үнэмлэхээр 10 тонн ачааны автомашин жолоодож болно."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 18: ① Жижиг оврын чирэгч автомашины жолоодох эрхээр нийт жин 3.5 тонны чирэх төрлийн тусгай автомашин жолоодож болно. ② Жижиг оврын чирэгч автомашины жолоодох эрхээр ачааны жин 4 тонны ачааны автомашин жолоодож болно. ③ Аврах чирэгч автомашины жолоодох эрхээр суудлын багтаамж 10 ба түүнээс доош хүний олон суудалт автомашин жолоодож болно. ④ Том оврын чирэгч автомашины жолоодох эрхээр ачааны жин 4 тонны ачааны автомашин жолоодож болно."},{"n":627,"b":"Том оврын автомашины жолоодлогын онцлогийн талаар буруу тайлбар аль нь вэ?","c":["Их жин, урт тэнхлэг хоорондын зайтай тул тогтвортой байдал өндөр боловч жолооны хүрдний буцах чадвар жижиг автомашинаас муу байдаг.","Жижиг автомашинаас жолоочийн суудал өндөр тул зөвхөн автомашины яг урд хэсгийг харж жолооддог учраас чигээрээ явах тогтвортой байдал сайжирдаг.","Ачааны төрөл болон ачсан байрлалаас хамааран эргэлтийн онцлог ихээхэн өөрчлөгдөнө.","Ачааны төрөл болон ачсан байрлалаас хамааран тогтвортой байдал ихээхэн өөрчлөгдөнө."],"a":"2","imgs":[],"t":"문장형","e":"Том оврын автомашин нь өндөр хурдтай явах үед их бие нь ганхдаг тул агшин зуур шулуун явах тогтвортой байдал муудах тохиолдол байдаг бөгөөд түүнчлэн жолоочийн суудал өндөр учраас шөнө, ширүүн бороо, манан зэрэг цаг агаар муу үед автомашины яг урдыг л харж жолооддог тул шулуун явах тогтвортой байдал улам муудна. Шулуун явах тогтвортой байдлыг дээшлүүлэхийн тулд харц төвлөрүүлэх цэгийг аль болох хол байлгаж, жолооны хүрдний ажиллагааг болгоомжтой хийх ёстой."},{"n":628,"b":"Автомашин болон автомашины эд ангийн техникийн үзүүлэлт, стандартын тухай журмын дагуу автомашины (холбогдсон автомашинаас бусад) урт нь ( ) метрээс хэтэрч болохгүй. ( )-д тохирох нь аль вэ?","c":["10","11","12","13"],"a":"4","imgs":[],"t":"문장형","e":"Автомашин болон автомашины эд ангийн чанар, стандартын тухай дүрмийн 4 дүгээр зүйл (Урт, өргөн, өндөр) ① Автомашины урт, өргөн, өндөр нь дараах шалгуураас хэтэрч болохгүй."},{"n":629,"b":"Том оврын олон суудалт автомашин явж байх үед зорчигчдыг машин дотор бүжиглэхийг зөвшөөрсөн бол жолоочид ногдуу лах шийтгэл аль нь вэ?","c":["Зөрчлийн торгууль 90,000 вон, торгуулийн оноо 30","Зөрчлийн торгууль 100,000 вон, торгуулийн оноо 40","Зөрчлийн торгууль 110,000 вон, торгуулийн оноо 50","Зөрчлийн торгууль 120,000 вон, торгуулийн оноо 60"],"a":"2","imgs":[],"t":"문장형","e":"Тээврийн хэрэгсэл дотор үймээн дэгдээх үйлдлийг орхисон жолоодлогын тохиолдолд зөрчлийн торгууль 100,000 вон, торгуулийн оноо 40 оноо ногдуулна. Замын хөдөлгөөний тухай хуулийн 49 дүгээр зүйл (Бүх жолоочийн дагаж мөрдөх зүйл зэрэг), Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын (Хавсралт 8) зөрчлийн үйлдэл болон зөрчлийн торгуулийн хэмжээ (жолооч), Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн (Хавсралт 28) жолоодох эрхийг хүчингүй болгох, түдгэлзүүлэх шийтгэлийн шалгуур."},{"n":630,"b":"4.5 тонн ачааны автомашины ачааны хэсэгт хүн суулган явсан тохиолдолд зөрчлийн торгуулийн хэмжээ хэд вэ?","c":["50,000 вон","40,000 вон","30,000 вон","20,000 вон"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 49 дүгээр зүйлийн 1 дэх хэсгийн 12 дахь заалт, хэрэгжүүлэх журмын Хавсралт 8: 4 тонноос дээш ачааны автомашины ачааны тэвшинд зорчигч суувал зөрчлийн торгууль 50,000 вон."},{"n":631,"b":"Хот хоорондын хурдны автобус шөнө замаар зорчих үед асаах ёстой гэрлийн талаар зөв тайлбар аль нь вэ?","c":["Урд гэрэл, оворын гэрэл, арын гэрэл, улсын дугаарын гэрэл, машины доторх гэрэл","Урд гэрэл, арын гэрэл","Арын гэрэл, оворын гэрэл, улсын дугаарын гэрэл","Арын гэрэл, оворын гэрэл"],"a":"1","imgs":[],"t":"문장형","e":"Хурдны замын автобус шөнө явах үед асаах ёстой гэрэл нь урд гэрэл, оврын гэрэл, арын гэрэл, улсын дугаарын гэрэл, салоны гэрэлтүүлэг юм."},{"n":632,"b":"Замын хөдөлгөөний тухай хуулийн дагуу автомашинд хүн суулгах болон ачаа ачих аргын талаар буруу тайлбар аль нь вэ?","c":["Жолооч нь ерөнхийлөгчийн зарлигаар тогтоосон зорчих үеийн аюулгүй ажиллагааны стандартаас илүү хүн суулгасан байдалтай жолоодож болохгүй.","Жолооч жолоодож байх үед зорчиж буй хүн унахгүй байхаар хаалгыг сайтар хаах зэрэг шаардлагатай арга хэмжээ авах ёстой.","Жолооч жолоодож байх үед ачсан ачаа унахгүй байхаар бүтээх, боох зэрэг аргаар найдвартай бэхлэх ёстой.","Жолооч нярай хүүхэд болон амьтны аюулгүй байдлыг хангахын тулд тэвэрч жолоодох ёстой."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 39 дүгээр зүйл (Суух буюу ачих арга, хязгаарлалт): Бүх тээврийн хэрэгслийн жолооч нялх хүүхэд буюу амьтныг тэврээд жолооны төхөөрөмжийг удирдах, жолоочийн суудлын орчимд эд зүйл ачих зэрэг аюулгүй байдалд саад учруулж болзошгүй байдалтайгаар жолоодож болохгүй."},{"n":633,"b":"Ачааны автомашины ачаа унахаас урьдчилан сэргийлэх талаар буруу тайлбар аль нь вэ?","c":["Ачааны автомашинд битүү ачааны хэсэг суурилуулан тээвэрлэнэ.","Үр ашигтай тээвэрлэхийн тулд зөвшөөрөгдсөн ачааны жингийн 120 хувь хүртэл ачна.","Ачаа ачсан үед огцом тоормослох, эргэх зэрэг автомашины хөдөлгөөнөөс шалтгаалан ачаа унах эсвэл хийсэхээс сэргийлж бүтээлэг эсвэл савлагаа хэрэглэнэ.","7 тонн ба түүнээс дээш жинтэй ган ороомог ачсан тохиолдолд хөшүүрэгтэй гинжит өргүүрээр хоёроос доошгүй мөрөөр бэхэлж, мөр бүрт хоёроос доошгүй бэхэлгээний цэг ашиглана."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 22 дугаар зүйл (Ашиглалтын аюулгүй байдлын шалгуур)"},{"n":634,"b":"1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрхийн үнэмлэх болон 1-р ангиллын ердийн жолоодох эрхийн үнэ млэхийн жолоодох хүрээг ялгах ачааны автомашины ачааны даацын стандарт аль нь вэ?","c":["12 тонноос бага","10 тонноос бага","4 тонн ба түүнээс бага","2 тонн ба түүнээс бага"],"a":"1","imgs":[],"t":"문장형","e":"Ачааны жин 12 тонноос доош ачааны автомашиныг 1-р ангиллын ердийн жолоодох эрхээр жолоодож болох бөгөөд ачааны жин 12 тонн ба түүнээс дээш ачааны автомашиныг 1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрх авсан тохиолдолд л жолоодож болно."},{"n":635,"b":"1-р ангиллын ердийн жолоодох эрхийн үнэмлэхтэй хүн нийт жин нь 750 кг-аас их, 3 тонн ба түүнээс бага чиргүүл автомашин чирэхийн тулд нэмэлтээр ямар жолоодох эрхийн үнэмлэхтэй байх ёстой вэ?","c":["1-р ангиллын бага оврын чирэгчийн жолоодох эрхийн үнэмлэх","2-р ангиллын ердийн жолоодох эрхийн үнэмлэх","1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрхийн үнэмлэх","1-р ангиллын аврах автомашины жолоодох эрхийн үнэмлэх"],"a":"1","imgs":[],"t":"문장형","e":"(Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 18-ын тайлбар 3) Нийт жин 750 кг-аас дээш 3 тонн ба түүнээс доош чиргүүл тээврийн хэрэгслийг чирэхийн тулд чирэгч автомашиныг жолоодох эрх болон жижиг оврын чирэгч автомашины жолоодох эрх буюу том оврын чирэгч автомашины жолоодох эрхтэй байх ёстой."},{"n":636,"b":"Дараах жолоодох эрхийн үнэмлэхээс нийт жин нь 750 кг хүртэлх чиргүүл автомашин чирж болохгүй нь аль вэ?","c":["1-р ангиллын ердийн жолоодох эрхийн үнэмлэх","1-р ангиллын ердийн дадлагын жолоодох эрхийн үнэмлэх","1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрхийн үнэмлэх","2-р ангиллын ердийн жолоодох эрхийн үнэмлэх"],"a":"2","imgs":[],"t":"문장형","e":"Дадлагын жолоодох эрхийн үнэмлэхээр чиргүүл тээврийн хэрэгсэл чирч болохгүй."},{"n":637,"b":"Хурдны зам биш газар нийт жин нь 1,500 кг автомашиныг нийт жин нь 5,000 кг олон суудалт автомашинаар чирж явах үед зөвшөөрөгдөх хамгийн дээд хурд хэд вэ?","c":["Цагт 50 км","Цагт 40 км","Цагт 30 км","Цагт 20 км"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 20 дугаар зүйл: нийт жин 2,000 килограммаас бага автомашиныг нийт жин нь түүнээс 3 дахин ба түүнээс дээш автомашинаар чирэх тохиолдолд цагт 30 километр байна."},{"n":638,"b":"Автомашин чирэх талаар буруу тайлбар аль нь вэ?","c":["3 тонноос дээш жинтэй автомашин чирэхийн тулд тухайн чирэгч автомашиныг жолоодох эрхийн үнэмлэх болон 1-р ангиллын том оврын чирэгчийн жолоодох эрхийн үнэмлэхтэй байх ёстой.","Ердийн зам дээр нийт жин нь 2,000 кг-аас бага автомашиныг өөрөөс нь 3 дахин буюу түүнээс их нийт жинтэй автомашинаар чир ж байгаа бол цагт 30 км хүртэл хурдтай явж болно.","Ердийн зам дээр чирэгч автомашин биш автомашинаар өөр автомашин чирэхдээ тухайн замын хурдны хязгаараар явж болно.","Чирэгч автомашин биш ердийн автомашинаар өөр автомашин чирэх бол тухайн ангиллын автомашиныг жолоодох эрхийн үнэмлэхтэй байх ёстой."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйл - Нэг чиглэлд 2 ба түүнээс дээш эгнээтэй хурдны зам дээрх хурдны дээд хязгаар нь цагт 100 километр [ачааны автомашин (ачааны жин 1.5 тонноос дээш тохиолдолд л хамаарна. Энэ заалтад цаашид мөн адил), тусгай автомашин, аюултай ачаа тээвэрлэх автомашин (Хавсралт 9-ийн (тайлбар) 6-д заасан аюултай ачаа зэргийг тээвэрлэх автомашиныг хэлнэ. Энэ заалтад цаашид мөн адил) болон барилгын машин механизмын хурдны дээд хязгаар нь цагт 80 километр], хурдны доод хязгаар нь цагт 50 километр. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 20 дугаар зүйл - Чирэгч автомашин биш автомашинаар өөр автомашин чирч зам (хурдны замыг оролцуулахгүй)-аар явах үеийн хурд нь 19 дүгээр зүйлээс үл хамааран дараах заалтуудад тогтоосны дагуу байна. 1. Нийт жин 2,000 килограммаас бага автомашиныг нийт жин нь түүнээс 3 дахин ба түүнээс дээш автомашинаар чирэх тохиолдолд цагт 30 километрийн дотор 2. 1 дэх заалтаас бусад тохиолдол болон хоёр дугуйт тээврийн хэрэгсэл чирэх тохиолдолд цагт 25 километрийн дотор. Мөн хуулийг хэрэгжүүлэх дүрмийн Хавсралт 18 - Чиргүүл тээврийн хэрэгслийг 1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрх, 1-р ангиллын ердийн жолоодох эрх буюу 2-р ангиллын ердийн жолоодох эрхтэй хүн тухайн эрхээрээ жолоодож болох автомашин («Автомашины удирдлагын тухай хууль»-ийн 3 дугаар зүйлд заасан хоёр дугуйт тээврийн хэрэгслийг оролцуулахгүй)-аар чирч болно. Энэ тохиолдолд нийт жин 750 килограммаас дээш 3 тонн ба түүнээс доош чиргүүл тээврийн хэрэгслийг чирэхийн тулд чирэгч автомашиныг жолоодох эрх болон жижиг оврын чирэгч автомашины жолоодох эрх буюу том оврын чирэгч автомашины жолоодох эрхтэй байх ёстой бөгөөд 3 тонноос дээш чиргүүл тээврийн хэрэгслийг чирэхийн тулд чирэгч автомашиныг жолоодох эрх болон том оврын чирэгч автомашины жолоодох эрхтэй байх ёстой."},{"n":639,"b":"Дараахын аль жолоодох эрхийн үнэмлэхээр тусгай зориулалтын ажил гүйцэтгэх зориулалтаар үйлдвэрлэсэн нийт жин нь 3.5 тонн хүртэлх тусгай зориулалтын тээврийн хэрэгслийг (аврах автомашин зэргийг оруулахгүй) жолоодож болох вэ?","c":["1-р ангиллын ердийн дадлагын жолоодох эрхийн үнэмлэх","2-р ангиллын ердийн дадлагын жолоодох эрхийн үнэмлэх","2-р ангиллын ердийн жолоодох эрхийн үнэмлэх","1-р ангиллын бага оврын жолоодох эрхийн үнэмлэх"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 18: нийт жин 3.5 тонн ба түүнээс доош тусгай автомашиныг 2-р ангиллын ердийн жолоодох эрхээр жолоодож болно."},{"n":640,"b":"Дараахын аль нь замын хөдөлгөөний тухай хуулийн дагуу бага оврын чирэгчийн жолооч мөрдөх ёстой шаардлага вэ?","c":["Бага оврын чирэгчийн жолооч яаралтай ажил гүйцэтгэдэг тул хамгаалах бүс зүүх шаардлагагүй.","Бага оврын чирэгчийн жолооч жолоодож байхдаа өдөр тутмын ажилтай холбоотой гар утас ашиглаж болно.","Бага оврын чирэгчийн жолооч 1-р ангиллын тусгай (бага оврын чирэгч) жолоодох эрхийн үнэмлэх авч, биедээ авч явах ёстой.","Бага оврын чирэгчийн жолооч ослын газарт очих үед тогтоосон хурдыг хэтрүүлэн явж болно."],"a":"3","imgs":[],"t":"문장형","e":"Жижиг оврын чирэгч автомашины жолооч ч Замын хөдөлгөөний тухай хуулийн дагуу бүх жолоочийн дагаж мөрдөх зүйлийг сахих ёстой бөгөөд ашиглалтын үед жижиг оврын чирэгч автомашины жолоодох эрхийг авч биедээ авч явах ёстой."},{"n":641,"b":"Дараахын аль нь нэг чиглэлд 3 эгнээтэй хурдны зам дээр чирэгч автомашины зорчих эгнээ вэ? (Автобусны тусгай эгнээ байхгүй)","c":["1-р эгнээ","2-р эгнээ","3-р эгнээ","Бүгд боломжтой"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 9]-ийг үзнэ үү."},{"n":642,"b":"Огцом сааруулах, огцом тоормослох үед чиргүүл автомашин урд талын чирэгч автомашиныг урагшаа чиглэлд түлхэн, холбогдсон хэсэг нь 'Г' үсэг шиг нугарах үзэгдлийг юу гэж нэрлэдэг вэ?","c":["Чиргүүлийн арын хэсэг гадагш савлах (Swing-out)","Хутга мэт нугарах үзэгдэл (Jackknife)","Усан хальтиргаа (Hydroplaning)","Уурын түгжээ (Vapor lock)"],"a":"2","imgs":[],"t":"문장형","e":"«Jack knife» (эвхдэг хутга) гэдэг нь нойтон замын гадаргуу зэрэг замын нөхцөлд чирэгч тракторын тоормосны хүч чиргүүлийн тоормосны хүчнээс их байх үед үүсч болох үзэгдэл бөгөөд чиргүүл инерцийн хөдөлгөөнөөрөө тракторыг түлхэн урагшлахдаа трактор ба чиргүүлийн холбоос хэсэг нь өнцөг хэлбэрээр нугарахыг хэлнэ. «Swing-out» гэдэг нь тодорхойгүй шалтгаанаар зөвхөн чиргүүлийн дугуй тоормослогдох тохиолдолд чиргүүл дүүжин мэт зүүн баруун тийш савлах хөдөлгөөнийг хэлнэ. «Hydroplaning» гэдэг нь усанд норсон замын гадаргуу дээр өндөр хурдтай явах үед дугуй замын гадаргуутай шүргэлцэхгүй болж жолоодох чадвар алдагдах буюу боломжгүй болох байдлыг хэлнэ. «Vapor lock» гэдэг нь тоормосны шингэнд хийн бөмбөлөг үүсч тоормос зохих ёсоор ажиллахгүй болох үзэгдлийг хэлнэ."},{"n":643,"b":"Дараахын аль нь замын хөдөлгөөний тухай хуулийн дагуу автомашин чирэх талаар буруу тайлбар вэ?","c":["1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрхийн үнэмлэхээр том оврын чирэгч автомашин жолоодож хоёр дугуйт тэ эврийн хэрэгслийг чирсэн.","Бага оврын чирэгчийн жолоодох эрхийн үнэмлэхээр нийт жин нь 3.5 тонн хүртэлх чиргүүлтэй тусгай зориулалтын тээврийн х эрэгсэл жолоодсон.","1-р ангиллын ердийн жолоодох эрхийн үнэмлэхээр 10 тонн ачааны автомашин жолоодож эвдэрсэн суудлын автомашиныг чирсэн.","Нийт жин нь 1,500 кг автомашиныг нийт жин нь 5,000 кг автомашинаар чирж цагт 30 км хурдтай явсан."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 18] - 1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрхээр том оврын чирэгч автомашин, жижиг оврын чирэгч автомашин, аврах чирэгч автомашин жолоодож болохгүй. - Том оврын чирэгч автомашин: чирэх төрлийн тусгай автомашин, 2-р ангиллын ердийн жолоодох эрхээр жолоодож болох тээврийн хэрэгсэл - Жижиг оврын чирэгч автомашин: нийт жин 3.5 тонн ба түүнээс доош чирэх төрлийн тусгай автомашин, 2-р ангиллын ердийн жолоодох эрхээр жолоодож болох тээврийн хэрэгсэл - Чиргүүл тээврийн хэрэгслийг 1-р ангиллын том оврын тээврийн хэрэгсэл жолоодох эрх, 1-р ангиллын ердийн жолоодох эрх буюу 2-р ангиллын ердийн жолоодох эрхтэй хүн тухайн эрхээрээ жолоодож болох автомашин («Автомашины удирдлагын тухай хууль»-ийн 3 дугаар зүйлд заасан хоёр дугуйт тээврийн хэрэгслийг оролцуулахгүй)-аар чирч болно. Энэ тохиолдолд нийт жин 750 килограммаас дээш 3 тонн ба түүнээс доош чиргүүл тээврийн хэрэгслийг чирэхийн тулд чирэгч автомашиныг жолоодох эрх болон жижиг оврын чирэгч автомашины жолоодох эрх буюу том оврын чирэгч автомашины жолоодох эрхтэй байх ёстой бөгөөд 3 тонноос дээш чиргүүл тээврийн хэрэгслийг чирэхийн тулд чирэгч автомашиныг жолоодох эрх болон том оврын чирэгч автомашины жолоодох эрхтэй байх ёстой."},{"n":644,"b":"Дараахын аль нь чиргүүлтэй тээврийн хэрэгслийн онцлогийн талаар хамгийн зөв тайлбар вэ?","c":["Зүүн эргэх үед суудлын автомашинтай төстэй эргэлтийн өнцөгтэй байдаг.","Уруу замд халтирахаас сэргийлэхийн тулд арааг сул байрлалд тавина.","Суудлын автомашинтай харьцуулахад дотоод дугуйн зөрүү их байдаг.","Суудлын автомашинтай харьцуулахад тэнхлэг хоорондын зай богино байдаг."],"a":"3","imgs":[],"t":"문장형","e":"Чиргүүлтэй автомашин зүүн эргэлт хийх үед суудлын автомашинтай төстэй эргэлтийн өнцөг барьвал хойд дугуйгаараа зүүн эргэлт хүлээж буй тээврийн хэрэгслийг мөргөх тул суудлын автомашинаас өргөн эргэх ёстой бөгөөд уруу замд арааг саармаг байрлалд тавих нь том ослын шалтгаан болдог."},{"n":645,"b":"Ачаа ачсан чиргүүлтэй автомашин цагт 50 км хурдтайгаар нэг чиглэлд нэг эгнээтэй замын баруун эргэлттэй хэсэгт орж байгаа үед хамгийн аюулгүй жолоодох арга аль нь вэ?","c":["Хурдыг бууруулбал онхолдох аюултай тул хурдыг нэмэгдүүлэн орно.","Эргэлтийн радиусыг багасгахын тулд эсрэг урсгалын эгнээгээр орно.","Хөдөлгөөний урсгалыг саатуулахгүйн тулд одоогийн хурдыг хадгалан хурдан орно.","Төвөөс зугтах хүчний улмаас онхолдох эрсдэлтэй тул хурдыг бууруулан орно."],"a":"4","imgs":[],"t":"문장형","e":"Тахир замд төвөөс зугтах хүчний улмаас тээврийн хэрэгсэл онхолдох аюултай тул хурдаа сааруулан аюулгүй орно."},{"n":646,"b":"Автомашины удирдлагын тухай хуулийн дагуу ангилсан тусгай зориулалтын тээврийн хэрэгсэлд хамаарахгүй нь аль вэ?","c":["Чирэгч төрөл","Аврах төрөл","Ердийн төрөл","Тусгай зориулалтын хэрэглээний төрөл"],"a":"3","imgs":[],"t":"문장형","e":"Автомашины удирдлагын тухай хуулийн дагуу тусгай автомашиныг төрлөөр нь чирэх төрөл, аврах төрөл, тусгай зориулалтын төрөл гэж ангилдаг."},{"n":647,"b":"Дараахын аль нь чиргүүлийн төрөлд хамаарахгүй вэ?","c":["Бүтэн чиргүүл","Нам шалтай чиргүүл","Хагас чиргүүл","Өндөр чиргүүл"],"a":"4","imgs":[],"t":"문장형","e":"Чиргүүлд бүтэн чиргүүл, нам тавцантай чиргүүл, хагас чиргүүл, төв тэнхлэгт чиргүүл, модуль чиргүүл гэж байдаг."},{"n":648,"b":"Автомашин болон автомашины эд ангийн техникийн үзүүлэлт, стандартын тухай журмын дагуу чиргүүлтэй автомашины жин гэж юуг хэлэх вэ?","c":["Ачаагүй үеийн автомашины жин","Ачаатай үеийн автомашины жин","Ачаагүй үеийн автомашины тэнхлэгийн ачаалал","Ачаатай үеийн автомашины тэнхлэгийн ачаалал"],"a":"1","imgs":[],"t":"문장형","e":"Тээврийн хэрэгслийн жин гэж ачаагүй байдал дахь автомашины жинг хэлнэ. Тээврийн хэрэгслийн нийт жин гэж ачаатай байдал дахь автомашины жинг хэлнэ."},{"n":649,"b":"Зам дээр аяллын чиргүүлтэй чиргүүл автомашин явж байх үед хажуугийн салхи зэрэг физикийн хүчин зүйлээс шалтгаалан чиргүүл автомашин загасны сүүл мэт савлах үзэгдлийг юу гэж нэрлэдэг вэ?","c":["Хутга мэт нугарах (Jackknife) үзэгдэл","Хажуу тийш савлах (Sway) үзэгдэл","Усан хальтиргааны (Hydroplaning) үзэгдэл","Дугуйн тэнхлэгийн тохируулга (Wheel alignment) үзэгдэл"],"a":"2","imgs":[],"t":"문장형","e":"Кемпер чиргүүл (караван) ашиглах үеийн том ослын ихэнх нь савлах үзэгдлээс болдог бөгөөд энэ нь караван загасны сүүл мэт савлах үзэгдэл учраас загасны сүүлний үзэгдэл гэж ч нэрлэдэг."},{"n":650,"b":"Автомашин болон автомашины эд ангийн техникийн үзүүлэлт, стандартын тухай журмын дагуу чиргүүлтэй тусгай зориулалтын тээврийн хэрэгслийн ар тал эсвэл баруун талд юу тэмдэглэх ёстой вэ?","c":["Автомашины нийт жин, хамгийн их ачааны хэмжээ","Автомашины жин дээр зорчигчийн суудлын багтаамжийн жинг нэмсэн жин","Автомашины нийт жин дээр зорчигчийн суудлын багтаамжийн жинг нэмсэн жин","Автомашины нийт жин, хамгийн их ачааны хэмжээ, хамгийн их ачааны эзлэхүүн, ачих барааны нэр"],"a":"2","imgs":[],"t":"문장형","e":"Автомашин болон автомашины эд ангийн чанар, стандартын тухай дүрмийн 19 дүгээр зүйл: Ачааны автомашины ар талд тогтоосон тээврийн хэрэгслийн нийт жин болон хамгийн их даац (цистерн автомашины хувьд тээврийн хэрэгслийн нийт жин, хамгийн их даац, хамгийн их ачих эзэлхүүн болон ачааны нэр)-ыг тэмдэглэж, чирэх төрлийн тусгай автомашины ар тал буюу баруун талд тээврийн хэрэгслийн жинд суудлын багтаамжийн жинг нэмсэн жинг тэмдэглэх ёстой бөгөөд бусад автомашины ар талд тогтоосон хамгийн их даацыг тэмдэглэх ёстой. Гэхдээ тээврийн хэрэгслийн нийт жин 15 тонноос бага тохиолдолд тээврийн хэрэгслийн нийт жинг тэмдэглэхгүй байж болно."},{"n":651,"b":"Дараах зүйлсийн аль нь чирэгч автомашины трактор болон чиргүүлийг холбодог төхөөрөмж вэ?","c":["Холбогч","Холбох гол","Тогтворжуулах тулгуур","Өргөх гар"],"a":"1","imgs":[],"t":"문장형","e":"Холбогч (залгуур): трактор (чирэгч автомашин) ба чиргүүл (чирүүлэгч автомашин)-ийг холбох төхөөрөмж бөгөөд тракторын ар тал нь дээд хэсэгтээ хагас дугуй хэлбэртэй, төв хэсэг рүүгээ нарийссан, ойролцоогоор 20 сантиметрийн ховилтой ба холбогчийн баруун тал нь холбогчийг ажиллуулах бариул болон пүршин түгжээнээс бүрддэг."},{"n":652,"b":"Автомашин болон автомашины эд ангийн гүйцэтгэл, стандартыг тогтоох журмын дагуу холбогдсон тээврийн хэрэгслийн урт хэдэн метрээс их байж болохгүй вэ?","c":["13.5 метр","16.7 метр","18.9 метр","19.3 метр"],"a":"2","imgs":[],"t":"문장형","e":"Автомашин болон автомашины эд ангийн чанар, стандартын тухай дүрмийн 19 дүгээр зүйлийн 2 дахь хэсэг: Автомашин болон автомашины эд ангийн чанар, стандартын тухай дүрмийн 4 дүгээр зүйлийн 1 дэх хэсгийн агуулгын дагуу автомашины урт 13 метрээс хэтэрч болохгүй бөгөөд холбоот автомашины хувьд 16.7 метрээс хэтэрч болохгүй."},{"n":653,"b":"Хэт том, хүнд ачааг тээвэрлэх зорилгоор дангаар нь эсвэл хоёр ба түүнээс олонг хослуулан ашиглах боломжтой бүтэцтэй бөгөөд ачааллыг жигд хуваарилах төхөөрөмжөөр тоноглогдсон чиргүүл аль нь вэ?","c":["Хагас чиргүүл","Нам шалтай чиргүүл","Модуль чиргүүл","Төв тэнхлэгтэй чиргүүл"],"a":"3","imgs":[],"t":"문장형","e":"① Хагас чиргүүл - түүний нэг хэсэг нь чирэгч автомашины дээд хэсэгт тулж, тухайн тээврийн хэрэгсэл болон ачааны жингийн нэлээд хэсгийг чирэгч автомашинд хуваарилдаг бүтэцтэй чиргүүл тээврийн хэрэгсэл ② Нам тавцантай чиргүүл - хүнд ачаа тээвэрлэхэд тохиромжтой, хагас чиргүүлийн
