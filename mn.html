етрээс дотор хязгаарлах боломжтой нь аймаг, нийслэлийн Цагдаагийн газрын дарга буюу цагдаагийн хэлтсийн даргын бүрэн эрх юм."},{"n":333,"b":"Дараах явган зорчигчдоос замын хөдөлгөөний тухай хуулийг хамгийн сайн мөрдөж байгаа нь аль вэ?","c":["Явган хүний гарцгүй газраар хамгийн богино зайгаар зам хөндлөн гарсан.","Ямар ч автомашин байгаагүй тул явган хүний гарцаар бус шууд зам хөндлөн гарсан.","Зогсож байсан ачааны автомашины яг ар талаар зам хөндлөн гарсан.","Явган хүний замын зүүн талаар алхсан."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 8 дугаар зүйл, 10 дугаар зүйл ①, ② Явган хүний гарц байрлуулаагүй замд хамгийн богино зайгаар хөндлөн гарах ёстой. ③ Явган зорчигч бүх тээврийн хэрэгслийн урд буюу ардаар хөндлөн гарч болохгүй. ④ Явган зорчигч явган хүний зам дээр баруун талаар явахыг зарчим болгоно."},{"n":334,"b":"Замын хөдөлгөөний тухай хуулийн дагуу ахмад жолооч дараах үйлдлүүдийг хийсэн тохиолдолд хамгийн өндөр торгуулийн оноотой зөрчил аль нь вэ?","c":["Явган хүний гарц дээр зогсож, явган зорчигчийн хөдөлгөөнд саад учруулсан.","Явган зорчигчийг оройтож анзааран огцом тоормослож, явган зорчигч унах шахсан.","Зөвшөөрөлгүйгээр зам хөндлөн гарч буй явган зорчигчийг хараад дуут дохио өгч, урдуур нь хурдан өнгөрсөн.","Шар тасралтгүй төв шугам давж гүйцэж түрүүлсэн."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28, суудлын автомашины хувьд ① Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 1 дэх хэсэг зөрчлийн торгууль 60,000 вон, торгуулийн оноо 10 оноо ② Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 3 дахь хэсэг зөрчлийн торгууль 60,000 вон, торгуулийн оноо 10 оноо, ③ Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 5 дахь хэсэг зөрчлийн торгууль 40,000 вон, торгуулийн оноо 10 оноо ④ Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйлийн 3 дахь хэсэг зөрчлийн торгууль 60,000 вон, торгуулийн оноо 30 оноо"},{"n":335,"b":"Дараах хүмүүсээс замын хөдөлгөөнд эмзэг оролцогчийн хөдөлгөөний хүртээмжийг сайжруулах тухай хуульд заасан замын хөдөлгөөнд эмзэг оролцогчид хамаарахгүй нь хэн бэ?","c":["Хүүхэд","Ахмад настан","Өсвөр насны хүүхэд","Жирэмсэн эмэгтэй"],"a":"3","imgs":[],"t":"문장형","e":"Хөдөлгөөний бэрхшээлтэй иргэдийн зорчих тав тухыг нэмэгдүүлэх тухай хуулийн 2 дугаар зүйлийн 1 дэх заалт Хөдөлгөөний бэрхшээлтэй иргэн гэж хөгжлийн бэрхшээлтэй иргэн, ахмад настан, жирэмсэн эмэгтэй, нялх, балчир хүүхэд дагуулсан хүн, хүүхэд зэрэг өдөр тутмын амьдралд зорчиход бэрхшээл мэдэрдэг хүнийг хэлнэ."},{"n":336,"b":"Ахмад настны бие махбодын ерөнхий онцлогийн талаар тохиромжгүй тайлбар аль нь вэ?","c":["Хөдөлгөөн удааширдаг.","Хараа мууддаг боловч сонсгол сайжирдаг.","Рефлекс удааширдаг.","Булчингийн хүч сулардаг."],"a":"2","imgs":[],"t":"문장형","e":"Ахмад настанд хараа болон сонсгол суларах биеийн онцлог үүсдэг."},{"n":337,"b":"Дараах ахмад жолооч нараас хамгийн зөв жолоодож байгаа нь аль вэ?","c":["Замын нөхцөлөөс үл хамааран холын замд аюулгүй байдлын үүднээс үргэлж удаан явдаг.","Цаг хэмнэхийн тулд зорьсон газартаа амралтгүй явдаг.","Замын нөхцөл байдлыг ажиглан, тогтоосон хурдыг мөрдөн жолооддог.","Замын хөдөлгөөн багатай шөнийн цагаар голдуу жолоо барьдаг."],"a":"3","imgs":[],"t":"문장형","e":"Ахмад настан жолооч холын зайн жолоодлого буюу урт хугацааны, шөнө оройн жолоодлогоос зайлсхийх ёстой."},{"n":338,"b":"Ахмад жолоочийн аюулгүй жолоодлоготой хамгийн хамаарал багатай нь аль вэ?","c":["Жолоо барихаас өмнө хангалттай амрах","Эрүүл мэндийн байдлаа тогтмол шалгах","Жолоо барихаас өмнө хүрэх газрын маршрутаа шалгах","Өдрийн цагаас илүү шөнийн орой жолоо барихыг зөвлөх"],"a":"4","imgs":[],"t":"문장형","e":"Ахмад настан жолооч жолоодохын өмнө хангалттай амарч, эрүүл мэндийн байдлаа тогтмол шалгаж байх нь зүйтэй. Жолоодохын өмнө очих газрын маршрутыг шалгаж, аль болох шөнө оройн цагт жолоодохгүй байх нь зүйтэй."},{"n":339,"b":"Суудлын автомашины жолооч ахмад настны хамгаалалтын бүсэд урд замаа анхаараагүйн улмаас ахмад настанд 3 долоо хоногийн гэмтэл учруулсан бол эрүүгийн хариуцлагын талаар буруу тайлбар аль нь вэ?","c":["Иж бүрэн даатгалд хамрагдсан бол эрүүгийн хариуцлага хүлээхгүй.","Ахмад настны хамгаалалтын бүсийг заасан аюулгүй байдлын тэмдэг байгаа бол эрүүгийн хариуцлага хүлээнэ.","Хохирогч шийтгэхийг хүсэхгүй бол эрүүгийн хариуцлага хүлээхгүй.","Эвлэрсэн бол эрүүгийн хариуцлага хүлээхгүй."],"a":"2","imgs":[],"t":"문장형","e":"Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн 3 дугаар зүйл (Шийтгэлийн онцгой заалт)-ийн 2 дахь хэсэг Хохирогчийн тодорхой илэрхийлсэн хүсэл зоригийн эсрэг эрүүгийн хэрэг үүсгэж болохгүй. 4 дүгээр зүйл (Иж бүрэн даатгал зэрэгт хамрагдсан тохиолдлын онцгой заалт)-ийн 1 дэх хэсэг Даатгал буюу хамтын даатгалд хамрагдсан тохиолдолд 3 дугаар зүйлийн 2 дахь хэсгийн үндсэн заалтад заасан гэмт хэрэг үйлдсэн тээврийн хэрэгслийн жолоочид эрүүгийн хэрэг үүсгэж болохгүй. Гэхдээ Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн 3 дугаар зүйлийн 2 дахь хэсгийн тусгай заалтад заасан зүйлийн хувьд хохирогчийн тодорхой илэрхийлсэн хүсэл зоригийн эсрэг буюу иж бүрэн даатгалд хамрагдсан байсан ч эрүүгийн хариуцлага хүлээлгэж болно. Гэхдээ ахмад настны хамгаалалтын бүс нь шийтгэлийн онцгой заалтад хамаарах тул иж бүрэн даатгалд хамрагдсан, шийтгүүлэхийг хүсэхгүй байгаа хүсэл зориг байгаа тохиолдолд эрүүгийн хариуцлага хүлээлгэхгүй."},{"n":340,"b":"Замын хөдөлгөөний тухай хуулийн дагуу суудлын автомашины жолооч ахмад настны хамгаалалтын бүсэд 15:00 цагийн үе д тогтоосон хурднаас цагт 60 км-ээс их хэтрүүлэн жолоодсон бол зөрчлийн торгууль болон торгуулийн оноо (нэмэгдэл төлбөрөөс бусад) аль нь вэ?","c":["60,000 вон, 60 оноо","90,000 вон, 60 оноо","120,000 вон, 120 оноо","150,000 вон, 120 оноо"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 10, хэрэгжүүлэх дүрмийн Хавсралт 28 суудлын автомашин 150,000 вон, торгуулийн оноо 120 оноо"},{"n":341,"b":"Хөгжлийн бэрхшээлтэй иргэдэд зориулсан авто зогсоолын талаар тайлбар юм. Буруу нь аль вэ?","c":["Хөгжлийн бэрхшээлтэй иргэдэд зориулсан авто зогсоолын зөвшөөрлийн тэмдэгтэй автомашинд хөгжлийн бэрхшээлтэй хүн сууж яваагүй байсан ч зогсоолд тавьж болно.","Тусгай зөвшөөрлийн тэмдэг авсан хүн уг тэмдгийг шилжүүлэх, түрээслүүлэх зэрэг зориулалтын бусаар ашигласан тохиолдолд тэмдгийг хураах эсвэл дахин олголтыг хязгаарлаж болно.","Хөгжлийн бэрхшээлтэй иргэдэд зориулсан авто зогсоолд эд зүйл овоолох, зорчих хэсгийг хаах зэрэг зогсоолд саад учруулах үйлдэл хийхийг хориглоно.","Хөгжлийн бэрхшээлтэй иргэдэд зориулсан авто зогсоолын зөвшөөрлийн тэмдэггүй автомашиныг уг зогсоолд байрлуулбал 100,000 воны торгууль ногдуулна."],"a":"1","imgs":[],"t":"문장형","e":"Хөгжлийн бэрхшээлтэй иргэн, ахмад настан, жирэмсэн эмэгтэй зэргийн тав тухыг нэмэгдүүлэх баталгааны тухай хуулийн 17 дугаар зүйлийн 4 дэх хэсэг Хэн ч 2 дахь хэсгийн дагуух хөгжлийн бэрхшээлтэй иргэдийн зориулалтын зогсоолын тэмдэг наагаагүй автомашиныг хөгжлийн бэрхшээлтэй иргэдийн зориулалтын зогсоолд тавьж болохгүй. Хөгжлийн бэрхшээлтэй иргэдийн зориулалтын зогсоолын тэмдэг наасан автомашинд алхахад бэрхшээлтэй хүн суугаагүй тохиолдолд ч мөн адил."},{"n":342,"b":"Хөгжлийн бэрхшээлтэй иргэдэд зориулсан авто зогсоолын зөвшөөрлийн тэмдэг олгодог байгууллагад хамаарахгүй нь аль вэ?","c":["Үндэсний ахмад дайчдын хэргийн сайд","Тусгай өөртөө засах хотын дарга, тусгай өөртөө засах аймгийн Засаг дарга","Хотын дарга, сумын засаг дарга, дүүргийн засаг дарга","Эрүүл мэнд, нийгмийн хамгааллын сайд"],"a":"4","imgs":[],"t":"문장형","e":"Хөгжлийн бэрхшээлтэй иргэн, ахмад настан, жирэмсэн эмэгтэй зэргийн тав тухыг нэмэгдүүлэх баталгааны тухай хуулийн 17 дугаар зүйл (Хөгжлийн бэрхшээлтэй иргэдийн зориулалтын зогсоол зэрэг)"},{"n":343,"b":"Замын хөдөлгөөний тухай хуулийн дагуу шөнийн цагаар автомашины (Хоёр дугуйт тээврийн хэрэгслээс бусад) жолооч эвдрэл болон бусад зайлшгүй шалтгааны улмаас зам дээр түр зогсох үед асаах ёстой гэрэл аль нь вэ?","c":["Урд гэрэл болон арын гэрэл","Машины дотор гэрэл болон оврын гэрэл","Дугаарын гэрэл болон урд гэрэл","Арын гэрэл болон оврын гэрэл"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 19 дүгээр зүйлийн 2 дахь хэсэг Тээврийн хэрэгсэл буюу трамвайн жолооч хуулийн 37 дугаар зүйлийн 1 дэх хэсгийн заалтуудын дагуу замд зогсох буюу зогсоолд тавих үед асаах ёстой гэрлийн төрөл нь дараах заалтуудын ангиллын дагуу байна. 1. Автомашин (хоёр дугуйт тээврийн хэрэгслийг хасна): автомашины аюулгүй байдлын стандартад тогтоосон арын гэрэл болон оврын гэрэл"},{"n":344,"b":"Замын хөдөлгөөний тухай хуулийн дагуу замын захад татсан шар тасархай шугамын талаар тайлбар юм. Хамгийн тохирох нь аль вэ?","c":["Түр зогсож, зогсоолд тавьж болно.","Зогсоолд тавихыг хориглох боловч түр зогсож болно.","Зогсоолд тавьж болох боловч түр зогсож болохгүй.","Түр зогсох болон зогсоолд тавихыг хоёуланг нь хориглоно."],"a":"2","imgs":[],"t":"문장형","e":"Шар тасархай шугамаар тэмдэглэсэн замын захын бүсийн шугамын утга нь зогсоолд тавихыг хориглох боловч түр зогсож болно гэсэн утгатай."},{"n":345,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хувийн хөдөлгөөнт хэрэгслийг түр зогсох болон зогсоолд тавихыг хориглох газры н талаар буруу нь аль вэ?","c":["Уулзварын захаас 10 метрийн дотор, замын булангаас 5 метрийн доторх газар","Явган хүний гарцаас 10 метрийн дотор, төмөр замын гарамын захаас 10 метрийн доторх газар","Аюулгүйн бүсийн бүх талаас тус бүр 10 метрийн дотор, автобусны буудлын шонгоос 10 метрийн доторх газар","Яаралтай гал унтраах төхөөрөмжөөс 5 метрийн дотор, гал унтраах усан хангамжийн байгууламжаас 5 метрийн доторх газар"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 32 дугаар зүйл (Зогсох болон зогсоолд тавихыг хориглох). 2 дахь заалт Уулзварын захаас 5 метрийн доторх газар."},{"n":346,"b":"Цахилгаан автомашин биш автомашиныг байгальд ээлтэй автомашины цэнэглэх байгууламжийн цэнэглэх бүсэд байрлуулсан бол хэдэн воны торгууль ногдуулах вэ?","c":["30,000 вон","50,000 вон","70,000 вон","100,000 вон"],"a":"4","imgs":[],"t":"문장형","e":"Байгаль орчинд ээлтэй автомашины хөгжүүлэлт, түгээлтийг дэмжих тухай хуулийн 11 дүгээр зүйлийн 2-ын 4 дэх хэсэг Байгаль орчинд ээлтэй автомашины хөгжүүлэлт, түгээлтийг дэмжих тухай хуулийг хэрэгжүүлэх журмын 21 дүгээр зүйл"},{"n":347,"b":"Автомашинаас буухдаа хаалгыг нээх \"Dutch Reach\" аргын талаар зөв тайлбар аль нь вэ?","c":["Автомашинаас буухдаа цонхноос хол байгаа гараараа хаалганы бариулыг барьж, ар талаа шалгасны дараа хаалгаа нээнэ.","Автомашинаас буухдаа цонхонд ойр байгаа гараараа хаалганы бариулыг барьж, урд талаа шалгасны дараа хаалгаа нээнэ.","Хаалга онгойлгож хөдөлгөөн эхлүүлэхтэй холбоотой ослоос урьдчилан сэргийлдэг.","Их Британид анх эхэлсэн замын хөдөлгөөний аюулгүй байдлын аян юм."],"a":"1","imgs":[],"t":"문장형","e":"Дач рич (Dutch Reach) нь 1960-аад онд Нидерландад суудлын автомашины хажуу талын араас ойртож ирэх унадаг дугуйтай осол гарахаас урьдчилан сэргийлэх зорилгоор эхэлсэн замын хөдөлгөөний аюулгүй байдлын аян юм. Жолооч буюу хамт суусан хүн суудлын автомашинаас буухын тулд хаалга онгойлгохдоо цонхноос хол талын гараараа бариулаас барьж хаалга онгойлгох арга юм. Ингэж хаалга онгойлговол бие нь аяндаа 45 градус ба түүнээс дээш эргэх тул ар талыг нүдээрээ шалгах боломжтой болж, суудлын автомашины арын хажуу талаас ойртож ирэх унадаг дугуй, мотоцикл зэрэгтэй гарах ослоос урьдчилан сэргийлж чадна. Хаалга онгорхой хөдлөх осол гэж жолооч зэрэг автомашины хаалгыг онгойлгоод хөдлөх явцад гарах ослыг хэлнэ."},{"n":348,"b":"Цахилгаан автомашин эсвэл гадаад эх үүсвэрээс цэнэглэдэг хайбрид автомашин хурдан цэнэглэх байгууламжид цэнэглэж эхэлснээс хойш цэнэглэх бүсэд хамгийн ихдээ хэр хугацаагаар байрлаж болох вэ?","c":["1 цаг","2 цаг","3 цаг","4 цаг"],"a":"1","imgs":[],"t":"문장형","e":"Байгаль орчинд ээлтэй автомашины хөгжүүлэлт, түгээлтийг дэмжих тухай хуулийг хэрэгжүүлэх журмын 18-8 дугаар зүйл (Байгаль орчинд ээлтэй автомашины цэнэглэлтэд саад учруулах үйлдлийн стандарт зэрэг) Хурдан цэнэглэх байгууламжийн цэнэглэх бүсэд цахилгаан автомашин болон гаднаас цэнэглэдэг хайбрид автомашин 2 цагийн доторх хүрээнд Үйлдвэр, худалдааны сайдын зарласан хугацаа болох 1 цаг өнгөрсний дараа ч үргэлжлүүлэн зогсоолд тавих үйлдэл нь байгаль орчинд ээлтэй автомашины цэнэглэлтэд саад учруулах үйлдэл болно."},{"n":349,"b":"Замын хөдөлгөөний тухай хуулийн дагуу налуу газар түр зогсох болон зогсоолд тавих аргын талаар буруу тайлбар аль нь вэ?","c":["Зогсоолд тавих үед зогсоолын тоормосыг ажиллуулсны дараа ивүүр, чулуу зэрэг ашиглан өнхрөхөөс хамгаалах арга хэмжээ авна.","Түр зогсох үед жолооч суудалдаа сууж, тоормосыг өөрөө барьж байгаа бол нэмэлт өнхрөлтөөс хамгаалах арга хэмжээ авах шаардлагагүй.","Зогсоолд тавих үед зогсоолын тоормосыг ажиллуулсны дараа жолооны хүрдийг замын зүг эргүүлэн байрлуулах ёстой.","Түр зогсоод жолооч суудлаа түр орхих тохиолдолд зөвхөн зогсоолын тоормос хангалтгүй бөгөөд резин, хуванцар зэрэг зүйлээр өнхрөлтөөс хамгаалах арга хэмжээ авах ёстой."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 11 дүгээр зүйлийн 3 дахь хэсэг Автомашины жолооч хуулийн 34-3 дугаар зүйл-ын дагуу налуу газарт зогсох буюу зогсоолд тавих (замаас бусад налуу газарт зогсох буюу зогсоолд тавих тохиолдлыг оролцуулна) гэж буй тохиолдолд автомашины зогсоолын тоормосыг ажиллуулсны дараа дараах заалтуудын аль нэгэнд хамаарах арга хэмжээг авах ёстой. Гэхдээ жолооч жолоочийн суудлаас холдолгүй тоормосыг шууд ажиллуулж байгаа тохиолдлыг хасна."},{"n":350,"b":"Хөгжлийн бэрхшээлтэй иргэдэд зориулсан авто зогсоолд эд зүйл овоолох, зорчих хэсгийг хаах зэрэг байдлаар зогсоолд саад учруулсан бол ногдуулах торгуулийн зөв хэмжээ аль нь вэ?","c":["40,000 вон","200,000 вон","500,000 вон","1,000,000 вон"],"a":"3","imgs":[],"t":"문장형","e":"Хэн ч хөгжлийн бэрхшээлтэй иргэдийн зориулалтын зогсоолд зогсоолд тавихад саад учруулах үйлдэл хийвэл 500,000 вон захиргааны торгууль ногдуулна (Хөгжлийн бэрхшээлтэй иргэн, ахмад настан, жирэмсэн эмэгтэй зэргийн тав тухыг нэмэгдүүлэх баталгааны тухай хуулийн 17 дугаар зүйлийн 5 дахь хэсэг, хэрэгжүүлэх журмын Хавсралт 3)"},{"n":351,"b":"Жолоочийн мөрдөх үүргийн талаар зөв тайлбарласан 2-ыг сонгоно уу.","c":["Зорчигч хаалга онгойлгон буух үед аюулгүй байдлын хариуцлага зөвхөн зорчигчид байдаг.","Ямар нэгэн зүйл худалдан авахын тулд түр хугацаагаар зогссон тохиолдолд ч хөдөлгүүрийг унтраана.","Жолооч хөдөлгүүрийг унтрааж, аюулгүй байдлыг шалгасны дараа тээврийн хэрэгслийн хаалгыг онгойлгон буух ёстой.","Зогсоол биш зөвшөөрөөгүй газарт зогссон бол хэн ч шаардлагатай үед нэн даруй хөдөлгөж болохоор арга хэмжээ авсан байна."],"a":"2, 3","imgs":[],"t":"문장형","e":"Жолооч жолоочийн суудлаас холдох үед тээврийн хэрэгслийн хөдөлгүүрийг унтрааж, тоормосыг сайтар ажиллуулах зэргээр тээврийн хэрэгслийн зогссон байдлыг аюулгүй хадгалж, бусад хүн дур мэдэн жолоодож чадахгүй байхаар шаардлагатай арга хэмжээ авахыг заасан байдаг."},{"n":352,"b":"Замын хөдөлгөөний тухай хуулийн дагуу огцом налуу зам дээр зогсоолд тавих үед хамгийн аюулгүй 2 арга аль нь вэ?","c":["Налуугийн чиглэлээс үл хамааран зогсоолын тоормосыг татаж, ухрах араанд тавина.","Зогсоолын тоормосыг татсаны дараа жолооны хүрдийг замын захын (тээврийн хэрэгсэлд ойр талын) чиглэл рүү эргүүлж байрлуулна.","Зогсоолын тоормосыг татсаны дараа уруудах чиглэлд дугуйнд ивүүр зэрэг гулсахаас хамгаалах хэрэгсэл байрлуулна.","Механик хурдны хайрцагтай тээврийн хэрэгслийг зогсоолд тавихдаа зогсоолын тоормосыг татаад арааг сул байрлалд үлдээнэ."],"a":"2, 3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 11 дүгээр зүйлийн 3 дахь хэсэгт зогсоолд тавих тохиолдолд тоормосыг ажиллуулсны дараа налуугийн уруудах чиглэлд дугуйнд ивүүр зэрэг автомашин гулсах ослоос сэргийлж чадах зүйл тавьж, жолооны механизмыг замын зах (автомашинаас ойр талыг хэлнэ) руу эргүүлж тавих, заавал ухрах араа хийх биш налуугийн дагуу уруудахгүй байхаар араа хийж орхих нь ч нэг арга бөгөөд арааг саармаг байрлалд тавихаас зайлсхийх ёстой."},{"n":353,"b":"Замын хөдөлгөөний тухай хуулийн дагуу түр зогсох болон зогсоолд тавих аргын талаар тайлбар юм. Зөв 2-ыг сонгоно уу.","c":["Зорчих хэсэг болон явган хүний зам тусгаарлагдсан замд түр зогсох бол зорчих хэсгийн баруун захад зогсооно.","Аюулгүйн тэмдэглэгээгээр түр зогсох, зогсоолд тавих аргыг тогтоосон газарт тухайн аргыг дагах шаардлагагүй.","Тэгш зам дээр зогсоолын тоормос татахгүйгээр механик хурдны хайрцагтай тээврийн хэрэгслийг зөвхөн 1-р араа эсвэл ухрах араа нд үлдээхэд хангалттай.","Налуу зам дээр зогсоолд тавихдаа зогсоолын тоормосыг татсаны дараа дугуйнд ивүүр тавина."],"a":"1, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 11 дүгээр зүйлийн 3 дахь хэсгийн 1 дэх заалтын дагуу автомашины жолооч хуулийн 34-3 дугаар зүйл-ын дагуу налуу газарт зогсох буюу зогсоолд тавих (замаас бусад налуу газарт зогсох буюу зогсоолд тавих тохиолдлыг оролцуулна) гэж буй тохиолдолд автомашины зогсоолын тоормосыг ажиллуулсны дараа дараах заалтуудын аль нэгэнд хамаарах арга хэмжээг авах ёстой. Гэхдээ жолооч жолоочийн суудлаас холдолгүй тоормосыг шууд ажиллуулж байгаа тохиолдлыг хасна."},{"n":354,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зогсоолд тавих үйлдэлд хамаарах 2 нь аль вэ?","c":["Тээврийн хэрэгсэл эвдэрсний улмаас үргэлжлүүлэн зогсож буй тохиолдол","Аюулаас урьдчилан сэргийлэх зорилгоор түр зогсох","5 минутаас хэтрээгүй боловч жолооч тээврийн хэрэгслээс холдож, шууд жолоодох боломжгүй болсон байдал","Метроны буудал дээр найзыгаа буулгахын тулд түр зогссон тохиолдол"],"a":"1, 3","imgs":[],"t":"문장형","e":"Дохио хүлээх зогсолт, аюулаас сэргийлэх түр зогсолт нь 5 минутаас хэтэрсэн ч зогсоолд тавихад хамаарахгүй. Харин 5 минутаас хэтрээгүй боловч жолооч тээврийн хэрэгслээ орхиж нэн даруй жолоодох боломжгүй байдал нь зогсоолд тавихад хамаарна. (Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл)"},{"n":355,"b":"Замын хөдөлгөөний тухай хуулийн дагуу түр зогсох үйлдэлд хамаарах 2 нь аль вэ?","c":["Таксины зогсоолд хүлээж байх үед жолооч ариун цэврийн өрөө орсон тохиолдол","Ачаа ачихын тулд жолооч тээврийн хэрэгслээс холдож, шууд жолоодох боломжгүй болсон тохиолдол","Хөдөлгөөнд оролцож байхдаа гэрлэн дохио хүлээн зогссон тохиолдол","Тээврийн хэрэгслээ зогсоож, жолоочийн суудлаасаа өнгөрч буй явган хүнээс зам асуусан тохиолдол"],"a":"3, 4","imgs":[],"t":"문장형","e":"Зогсох (түр зогсолт) гэж жолооч 5 минутаас хэтрэхгүй хугацаанд тээврийн хэрэгслийг зогсоохыг хэлэх бөгөөд зогсоолд тавихаас бусад зогссон байдлыг хэлнэ. (Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 25 дахь заалт)"},{"n":356,"b":"Замын хөдөлгөөний тухай хуулийн дагуу түр зогсох болон зогсоолд тавихыг хориглосон газрын онцгой журам үйлчлэхгүй 2 нь аль вэ?","c":["Хүүхдийн хамгаалалтын бүсийн үндсэн үүднээс 50 метрийн дотор","Явган хүний гарцаас 10 метрийн дотор","Гал унтраах яаралтай төхөөрөмж байрласан газраас 5 метрийн дотор","Аюулгүйн бүсийн дөрвөн талаас тус бүр 10 метрийн дотор"],"a":"3, 4","imgs":[],"t":"문장형","e":"Зогсох болон зогсоолд тавихыг хориглосон газар Бүх тээврийн хэрэгслийн жолооч дараах заалтуудын аль нэгэнд хамаарах газарт тээврийн хэрэгслээ зогсоох буюу зогсоолд тавьж болохгүй. Гэхдээ энэ хууль буюу энэ хуулийн дагуух тушаал, эсвэл цагдаагийн алба хаагчийн зааврыг дагаж мөрдөх тохиолдол болон аюулаас сэргийлэхийн тулд түр зогсох тохиолдолд үүнд хамаарахгүй. 1. Уулзвар, явган хүний гарц, төмөр замын гарам буюу явган хүний зам болон зорчих хэсэг нь тусгаарлагдсан замын явган хүний зам (\"Зогсоолын тухай хууль\"-ийн дагуу зорчих хэсэг болон явган хүний замыг дамнан байгуулсан замын зогсоолыг хасна) 2. Уулзварын зах буюу замын булангаас 5 метрийн доторх газар 3. Аюулгүйн бүс байрлуулсан замд тухайн аюулгүйн бүсийн дөрвөн талаас тус бүр 10 метрийн доторх газар 4. Автобусны зорчигч тээврийн автомашины зогсоолын газар болохыг илэрхийлэх шон буюу тэмдэг, эсвэл шугам байрлуулсан газраас 10 метрийн доторх газар. Гэхдээ автобусны зорчигч тээврийн автомашины жолооч тухайн автобусны зорчигч тээврийн автомашины ажиллах цагт чиглэлийн дагуух буудалд зорчигч суулгах буюу буулгахын тулд тээврийн хэрэгслээ зогсоох буюу зогсоолд тавих тохиолдолд үүнд хамаарахгүй. 5. Төмөр замын гарамын зах буюу явган хүний гарцаас 10 метрийн доторх газар 6. Дараах дэд заалтуудын газраас 5 метрийн доторх газар а. \"Гал түймрийн тухай үндсэн хууль\"-ийн 10 дугаар зүйлийн дагуух гал унтраах усан хангамжийн байгууламж буюу ослын гал унтраах төхөөрөмж суурилуулсан газар б. \"Гал түймрээс урьдчилан сэргийлэх, галын аюулаас хамгаалах байгууламж суурилуулах, арчлах болон аюулгүй байдлын удирдлагын тухай хууль\"-ийн 2 дугаар зүйлийн 1 дэх хэсгийн 1 дэх заалтын дагуух галын аюулаас хамгаалах байгууламжаас Ерөнхийлөгчийн зарлигаар тогтоосон байгууламж суурилуулсан газар 7. Аймаг, нийслэлийн Цагдаагийн газрын дарга замын аюулаас сэргийлж, хөдөлгөөний аюулгүй байдал болон саадгүй урсгалыг хангахад шаардлагатай гэж үзэж тогтоосон газар 8. Хотын дарга зэргийн 12 дугаар зүйлийн 1 дэх хэсгийн дагуу тогтоосон хүүхдийн хамгаалалтын бүс 34-2 дугаар зүйл (Зогсох буюу зогсоолд тавихыг хориглосон газрын онцгой заалт) ① Дараах заалтуудын аль нэгэнд хамаарах тохиолдолд 32 дугаар зүйлийн 1 дэх заалт, 4 дэх заалт, 5 дахь заалт, 7 дахь заалт, 8 дахь заалт буюу 33 дугаар зүйлийн 3 дахь заалтыг үл харгалзан зогсох буюу зогсоолд тавьж болно. 1. \"Унадаг дугуйн хэрэглээг идэвхжүүлэх тухай хууль\"-ийн 2 дугаар зүйлийн 2 дахь заалтын дагуух унадаг дугуйн хэрэглээний байгууламжийн дотроос цахилгаан унадаг дугуйн цэнэглэх цэг болон унадаг дугуйн зогсоолын төхөөрөмжид унадаг дугуйг зогсоох буюу зогсоолд тавих тохиолдолд 2. Хотын дарга зэргийн хүсэлтээр аймаг, нийслэлийн Цагдаагийн газрын дарга аюулгүйн тэмдэглэгээгээр унадаг дугуй зэргийг зогсох буюу зогсоолд тавихыг зөвшөөрсөн тохиолдолд ② Аймаг, нийслэлийн Цагдаагийн газрын дарга аюулгүйн тэмдэглэгээгээр бүс, цаг, арга болон тээврийн хэрэгслийн төрлийг тогтоож зогсох буюу зогсоолд тавихыг зөвшөөрсөн газарт 32 дугаар зүйлийн 7 дахь заалт, 8 дахь заалт буюу 33 дугаар зүйлийн 3 дахь заалтыг үл харгалзан зогсох буюу зогсоолд тавьж болно."},{"n":357,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зогсоолд тавих боломжтой газар 2 нь аль вэ?","c":["Уулзварын булангаас 5 метрийн зайд","Гал унтраах усан хангамжийн байгууламжаас 7 метрийн зайд","Гал унтраах яаралтай төхөөрөмжөөс 7 метрийн зайд","Аюулгүйн бүсээс 5 метрийн зайд"],"a":"2, 3","imgs":[],"t":"문장형","e":"Зогсоолд тавихыг хориглосон газар: ① Явган хүний гарцаас 10 метрийн дотор ② Гал унтраах усан хангамжийн байгууламж суурилуулсан газраас 5 метрийн дотор ③ Ослын гал унтраах төхөөрөмж суурилуулсан газраас 5 метрийн дотор ④ Аюулгүйн бүсийн дөрвөн талаас тус бүр 10 метрийн дотор (Замын хөдөлгөөний тухай хуулийн 32 дугаар зүйл) 34-2 дугаар зүйл (Зогсох буюу зогсоолд тавихыг хориглосон газрын онцгой заалт) ① Дараах заалтуудын аль нэгэнд хамаарах тохиолдолд 32 дугаар зүйлийн 1 дэх заалт, 4 дэх заалт, 5 дахь заалт, 7 дахь заалт, 8 дахь заалт буюу 33 дугаар зүйлийн 3 дахь заалтыг үл харгалзан зогсох буюу зогсоолд тавьж болно. 1. \"Унадаг дугуйн хэрэглээг идэвхжүүлэх тухай хууль\"-ийн 2 дугаар зүйлийн 2 дахь заалтын дагуух унадаг дугуйн хэрэглээний байгууламжийн дотроос цахилгаан унадаг дугуйн цэнэглэх цэг болон унадаг дугуйн зогсоолын төхөөрөмжид унадаг дугуйг зогсоох буюу зогсоолд тавих тохиолдолд 2. Хотын дарга зэргийн хүсэлтээр аймаг, нийслэлийн Цагдаагийн газрын дарга аюулгүйн тэмдэглэгээгээр унадаг дугуй зэргийг зогсох буюу зогсоолд тавихыг зөвшөөрсөн тохиолдолд ② Аймаг, нийслэлийн Цагдаагийн газрын дарга аюулгүйн тэмдэглэгээгээр бүс, цаг, арга болон тээврийн хэрэгслийн төрлийг тогтоож зогсох буюу зогсоолд тавихыг зөвшөөрсөн газарт 32 дугаар зүйлийн 7 дахь заалт, 8 дахь заалт буюу 33 дугаар зүйлийн 3 дахь заалтыг үл харгалзан зогсох буюу зогсоолд тавьж болно."},{"n":358,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хөдөлгөөн зохицуулагчгүй уулзварт зүүн эргэх үед хамгийн аюулгүй жолоодох арга аль нь вэ?","c":["Өмнө нь орсон өөр тээврийн хэрэгсэл байсан ч болгоомжтой, удаан явж зүүн эргэнэ.","Өргөн замаар явж буй тээврийн хэрэгсэлд зам тавьж өгнө.","Чигээрээ явж буй тээврийн хэрэгсэлд зам тавьж өгдөг боловч баруун эргэж буй тээврийн хэрэгслээс давуу эрхтэй.","Урьдчилан төв шугам даган удаан явж, уулзварын төвийн гадна талаар зүүн эргэнэ."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 26 дугаар зүйл Түрүүлж орсон тээврийн хэрэгсэлд замаа тавьж өгөх ёстой бөгөөд зүүн тийш эргэж буй тээврийн хэрэгсэл чигээрээ явж буй болон баруун тийш эргэж буй тээврийн хэрэгсэлд давуу эрхийг тавьж өгөх ёстой ба уулзварын төвийн дотор талыг ашиглан зүүн тийш эргэх ёстой."},{"n":359,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тойрог уулзвараар нэвтрэх журмын талаар буруу тайлбар аль нь вэ?","c":["Нэвтрэхдээ хурдаа сааруулж удаан явна.","Зам тавьж өгөх шугам дээр зогсон, түр зогссоны дараа удаан явж орно.","Нэвтэрч буй тээврийн хэрэгсэл давуу эрхтэй бөгөөд тойрогт явж буй тээврийн хэрэгсэл зам тавьж өгнө.","Цагийн зүүний эсрэг чиглэлээр эргэнэ."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 25-2 дугаар зүйл (Тойрог уулзвараар нэвтрэх арга) ① Тойрог уулзварт цагийн зүүний эсрэг чиглэлд явах ёстой. ② Тойрог уулзварт орох гэж буй тохиолдолд удаан явах буюу түр зогсох ёстой бөгөөд аль хэдийн явж буй өөр тээврийн хэрэгсэл байгаа үед тухайн тээврийн хэрэгсэлд зам тавьж өгөх ёстой."},{"n":360,"b":"Замын хөдөлгөөний тухай хуулийн дагуу гэрлэн дохиогүй уулзварт өмнө нь орж зүүн эргэж буй тээврийн хэрэгсэл байгаа бол аль нь зөв бэ?","c":["Чигээрээ явах тээврийн хэрэгсэл анхааралтай явна.","Баруун эргэх тээврийн хэрэгсэл удаан явж баруун эргэнэ.","Чигээрээ явах болон баруун эргэх тээврийн хэрэгсэл хоёулаа зүүн эргэж буй тээврийн хэрэгсэлд зам тавьж өгнө.","Нарийн замаар явж буй тээврийн хэрэгсэл удаан явж нэвтэрнэ."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний зохицуулалт хийгдээгүй уулзварт зүүн тийш эргэж буй тээврийн хэрэгсэл байсан ч уулзварт аль хэдийн түрүүлж орсон тохиолдолд давуу эрхтэй тул чигээрээ явж буй тээврийн хэрэгсэл болон баруун тийш эргэж буй тээврийн хэрэгсэл байсан ч зүүн тийш эргэж буй тээврийн хэрэгсэлд давуу эрх байна. (Замын хөдөлгөөний тухай хуулийн 26 дугаар зүйл)"},{"n":361,"b":"Замын хөдөлгөөний тухай хуулийн дагуу уулзварт зүүн эргэх хамгийн зөв арга аль нь вэ?","c":["Төв шугам даган удаан явж, уулзварын төвийн дотор талаар зүүн эргэнэ.","Гэрлэн дохиотой уулзварт хамгаалалтгүй зүүн эргэлтийг зөвшөөрсөн аюулгүй байдлын тэмдэг байгаа бол улаан гэрлээр зүүн эргэхийг зөвшөөрнө.","Гэрлэн дохиогүй уулзварт зэрэг орсон тохиолдолд зүүн эргэх тээврийн хэрэгсэл чигээрээ явах тээврийн хэрэгслээс давуу эрхтэй.","Хөдөлгөөнгүй нэг чиглэлийн 3 эгнээтэй замд баруун эгнээнээс зүүн эргэхийг зөвшөөрнө."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйл болон 26 дугаар зүйл Бүх тээврийн хэрэгслийн жолооч уулзварт зүүн тийш эргэх гэж буй үед урьдчилан замын төвийн шугамыг дагаж удаан явж уулзварын төвийн дотор талыг ашиглан зүүн тийш эргэх ёстой. Хамгаалалтгүй зүүн эргэлтийн аюулгүйн тэмдэглэгээ байгаа тохиолдолд чигээрээ явах гэрэлтэй үед зүүн тийш эргэх ёстой бөгөөд нэгэн зэрэг орсон тохиолдолд зүүн тийш эргэж буй тээврийн хэрэгслээс чигээрээ явж буй тээврийн хэрэгсэл давуу эрхтэй."},{"n":362,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хөдөлгөөн зохицуулагчгүй уулзвараар нэвтрэх зөв арга аль нь вэ?","c":["Баруун, зүүн талыг харах боломжгүй бол удаан явна.","Зүүн эргэх тээврийн хэрэгсэл чигээрээ явах тээврийн хэрэгслээс түрүүлж нэвтрэх ёстой.","Баруун эргэх тээврийн хэрэгсэл чигээрээ явах тээврийн хэрэгслээс түрүүлж нэвтрэх ёстой.","Явж буй замаас огтлолцож буй зам илүү өргөн бол удаан явна."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 26 дугаар зүйл Зүүн, баруун талыг шалгах боломжгүй тохиолдолд түр зогсох ёстой бөгөөд тухайн тээврийн хэрэгслийн явж буй замын өргөнөөс огтлолцож буй замын өргөн илүү өргөн тохиолдолд удаан явах ёстой."},{"n":363,"b":"Замын хөдөлгөөний урсгал болон аюулгүй байдлыг хангахын тулд ямар тохиолдолд тойрог уулзвар байгуулахыг зөвлөдөг вэ?","c":["Хөдөлгөөний ачаалал өндөр биш боловч уулзвар дээр зам тээврийн осол их гардаг газар","Уулзварт нийлэх замын нэг буюу түүнээс олон нь нэг чиглэлийн 3 ба түүнээс олон эгнээтэй газар","Тойрог уулзварын хөдөлгөөний хэмжээ нэвтрүүлэх хүчин чадлаас давсан газар","Гэрлэн дохионы уялдаа холбоо шаардлагатай хэсэг бөгөөд тойрог уулзвар байгуулбал уялдааны үр нөлөө буурах газар"],"a":"1","imgs":[],"t":"문장형","e":"Тойрог уулзварын зураг төслийн заавар (2022 оны 8 дугаар сар, Газар, дэд бүтэц, тээврийн яам) 1) Тойрог уулзвар байгуулахыг зөвлөдөг тохиолдол ① Хөдөлгөөний эрчмийн түвшин нь гэрлэн дохиогүй уулзвараар ажиллуулахад их, гэрлэн дохиотой уулзвараар ажиллуулахад хэт бага тул гэрлэн дохионы ажиллагааны үр ашиг буурах тохиолдол ② Хөдөлгөөний эрчмийн түвшин өндөр биш боловч уулзварын зам тээврийн осол их гардаг тохиолдол ③ Жолоочид давуу эрхийг ойлгоход хэцүү тохиолдол ④ Y хэлбэрийн уулзвар, T хэлбэрийн уулзвар, уулзварын хэлбэр онцгой тохиолдол ⑤ Хөдөлгөөнийг намжаах төслийн хэсэг доторх уулзвар 2) Тойрог уулзвар байгуулахыг зөвлөдөггүй тохиолдол ① Тойрог уулзварын хөдөлгөөний эрчмийн түвшин нэвтрүүлэх хүчин чадлаас хэтэрсэн тохиолдол ② Тойрог уулзварын зураг төслийн стандартыг хангаж чадахгүй тохиолдол ③ Ачааллын оргил цагт хувьсах эгнээ ажиллуулдаг тохиолдол ④ Гэрлэн дохионы уялдаа хийгдэж буй хэсэг доторх уулзвар байх тохиолдол ⑤ Уулзварт нэг ба түүнээс дээш ойртох зам нь нэг чиглэлд 3 ба түүнээс дээш эгнээтэй тохиолдол"},{"n":364,"b":"Тойрог уулзварын талаар зөв тайлбар аль нь вэ?","c":["Тойрог уулзвар нь гэрлэн дохиотой уулзвараас зөрөх цэгийн тоо илүү олон байдаг.","Нэвтрэхдээ тойрог уулзвар дотор хангалттай сул зай гартал зам тавьж өгөх шугам дээр хүлээнэ.","Гэрлэн дохио суурилуулан орж буй тээврийн хэрэгслийг чиглүүлж, уулзварын хөдөлгөөнийг зохицуулдаг.","Тойрогт эргэлдэж буй тээврийн хэрэгсэл орж ирж буй тээврийн хэрэгсэлд зам тавьж өгнө."],"a":"2","imgs":[],"t":"문장형","e":"Тойрог уулзвар нь гэрлэн дохиотой уулзвартай харьцуулахад зөрчилдөх цэгийн тоо цөөн бөгөөд эргэж буй тээврийн хэрэгсэлд орох гэж буй тээврийн хэрэгсэл зам тавьж өгөх ёстой ба тойрог уулзвар дотор сул зай байхгүй тохиолдолд орж болохгүй."},{"n":365,"b":"Замын хөдөлгөөний тухай хуулийн дагуу жолоочийг уулзварт зүүн эргэлтийг зөв хийхэд зориулан цагаан тасархай шугамаар тэмдэглэсэн замын тэмдэглэл аль нь вэ?","c":["Чиглүүлэх шугам","Үргэлжлэх шугам","Заах шугам","Зохицуулах шугам"],"a":"1","imgs":[],"t":"문장형","e":"Уулзварт явж байх үед хажуу талаас мөргөлдөх осол гарах нь чиглүүлэх шугамын талаарх ойлголт дутмагаас болсон байх магадлал өндөр. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6 Ⅰ. Ерөнхий стандарт 2. Замын гадаргуугийн тэмдэглэгээ, Ⅱ. Тусгай стандарт 5. Замын гадаргуугийн тэмдэглэгээ)"},{"n":366,"b":"Уулзварт зүүн эргэж буй жолоочийн хамгийн аюулгүй жолоодох арга 2 нь аль вэ?","c":["Эсрэг чиглэлд зогсож буй тээврийн хэрэгслийг анхаарах ёстой.","Эсрэг чиглэлээс баруун эргэж буй тээврийн хэрэгслийг анхаарахад болно.","Нэг чиглэлээс баруун эргэж буй тээврийн хэрэгслийг анхаарах ёстой.","Хамт зүүн эргэж буй хажуугийн тээврийн хэрэгслийг мөн анхаарах ёстой."],"a":"2, 4","imgs":[],"t":"문장형","e":"Уулзварт хамгаалалтгүй зүүн эргэлт хийж буй тээврийн хэрэгсэл баруун тийш эргэж буй тээврийн хэрэгсэл болон нэг чиглэлд хамт зүүн тийш эргэж буй хажуугийн тээврийн хэрэгсэлд ч анхаарал хандуулан зүүн тийш эргэх ёстой. (Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйл)"},{"n":367,"b":"Уулзварт зүүн болон баруун эргэх үед хамгийн аюулгүй жолоодох арга 2 нь аль вэ?","c":["Баруун эргэхдээ урьдчилан замын баруун зах руу шахаж, удаан яван баруун эргэнэ.","Замын хөдөлгөөн ихтэй үед зүүн эргэхдээ зүүн чиглүүлэх шугамыг үл харгалзан аль болох хурдан нэвтэрнэ.","Зүүн эргэхдээ урьдчилан төв шугам даган удаан явж, уулзварын төвийн дотор талаар зүүн эргэнэ.","Чиглүүлэх шугамтай уулзварт зүүн эргэхдээ зүүн дугуй чиглүүлэх шугамын дотор талаар өнгөрөх ёстой."],"a":"1, 3","imgs":[],"t":"문장형","e":"Бүх тээврийн хэрэгслийн жолооч уулзварт баруун тийш эргэх гэж буй үед урьдчилан замын баруун захыг дагаж удаан явж баруун тийш эргэх ёстой бөгөөд зүүн тийш эргэхдээ урьдчилан замын төвийн шугамыг дагаж удаан явж уулзварын төвийн дотор талыг ашиглан зүүн тийш эргэх ёстой. (Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйл)"},{"n":368,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тойрог уулзвараар нэвтрэх зөв арга аль нь вэ?","c":["Тойрогт явж буй тээврийн хэрэгсэл давуу эрхтэй.","Орох гэж буй тээврийн хэрэгсэл давуу эрхтэй.","Гарч буй тээврийн хэрэгсэл давуу эрхтэй.","Давуу эрхийн дараалал байхгүй."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 25-2 дугаар зүйл (Тойрог уулзвараар нэвтрэх арга) Тойрог уулзварт орох гэж буй тохиолдолд удаан явах буюу түр зогсох ёстой бөгөөд аль хэдийн явж буй өөр тээврийн хэрэгсэл байгаа үед тухайн тээврийн хэрэгсэлд зам тавьж өгөх ёстой."},{"n":369,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тойрог уулзварт хориглодоггүй үйлдэл аль нь вэ?","c":["Түр зогсох","Зогсоолд тавих","Удаан явах болон түр хугацаанд бүрэн зогсох","Гүйцэж түрүүлэх"],"a":"3","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийн 32 дугаар зүйл (Зогсох болон зогсоолд тавихыг хориглох)> Бүх тээврийн хэрэгслийн жолооч дараах заалтуудын аль нэгэнд хамаарах газарт тээврийн хэрэгслээ зогсоох буюу зогсоолд тавьж болохгүй. Гэхдээ энэ хууль буюу энэ хуулийн дагуух тушаал, эсвэл цагдаагийн алба хаагчийн зааврыг дагаж мөрдөх тохиолдол болон аюулаас сэргийлэхийн тулд түр зогсох тохиолдолд үүнд хамаарахгүй."},{"n":370,"b":"Дараахын аль тээврийн хэрэгсэл тойрог уулзварт зорчих давуу эрхтэй вэ?","c":["Тойрог уулзварын эргэлтийн эгнээгээр явж буй тээврийн хэрэгсэл","Тойрог уулзварт орохын өмнө зүүн эргэх гэж буй тээврийн хэрэгсэл","Тойрог уулзварт орохын өмнө баруун эргэх гэж буй тээврийн хэрэгсэл","Тойрог уулзварт орохын өмнө зүүн болон баруун эргэх гэж буй тээврийн хэрэгсэл"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 25-2 дугаар зүйл (Тойрог уулзвараар нэвтрэх арга) ① Бүх тээврийн хэрэгслийн жолооч тойрог уулзварт цагийн зүүний эсрэг чиглэлд явах ёстой. ② Бүх тээврийн хэрэгслийн жолооч тойрог уулзварт орох гэж буй тохиолдолд удаан явах буюу түр зогсох ёстой бөгөөд аль хэдийн явж буй өөр тээврийн хэрэгсэл байгаа үед тухайн тээврийн хэрэгсэлд зам тавьж өгөх ёстой. ③ 1 дэх хэсэг болон 2 дахь хэсгийн дагуу тойрог уулзвараар нэвтрэхийн тулд гар буюу чиг заах дохио, эсвэл гэрлээр дохио өгч буй тээврийн хэрэгсэл байгаа тохиолдолд түүний ард явж буй тээврийн хэрэгслийн жолооч дохио өгсөн урд явж буй тээврийн хэрэгслийн хөдөлгөөнд саад учруулж болохгүй."},{"n":371,"b":"Тойрог уулзварын талаар буруу тайлбар аль нь вэ?","c":["Тээврийн хэрэгсэл уулзварт удаан явж ойртдог.","Тойрогт эргэлдэж буй тээврийн хэрэгсэл давуу эрхтэй.","Гэрлэн дохио байхгүй тул тээврийн хэрэгсэл тасралтгүй нэвтрэх боломжтой.","Тойрог уулзварт цагийн зүүний дагуу эргэдэг."],"a":"4","imgs":[],"t":"문장형","e":"Тойрог уулзварт цагийн зүүний эсрэг чиглэлд эргэнэ."},{"n":372,"b":"Тойрог уулзвараар нэвтрэх хамгийн зөв 2 арга аль нь вэ?","c":["Уулзварт орохын өмнө түр зогсож, уулзвар дотор зүүн талаас ирж буй тээврийн хэрэгсэл байхгүй бол орно.","Тойрог уулзварт цагийн зүүний дагуу эргэх ёстой.","Тойрог уулзварт орох болон гарах үед чиг заах дохио өгөх шаардлагагүй.","Тойрог уулзварт орсны дараа ч бусад тээврийн хэрэгслийг анхааран явна."],"a":"1, 4","imgs":[],"t":"문장형","e":"Тойрог уулзварт эргэхдээ цагийн зүүний эсрэг чиглэлд эргэх ёстой бөгөөд орох, гарахдаа чиг заах дохиог ажиллуулах ёстой."},{"n":373,"b":"Замын хөдөлгөөний тухай хуулийн дагуу түр зогсох газар аль нь вэ?","c":["Замын тахир хэсгийн орчим","Огцом уруудах налуу зам","Налуу замын оргил хэсгийн орчим","Хөдөлгөөн зохицуулагчгүй, хөдөлгөөн ихтэй уулзвар"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 31 дүгээр зүйл (Удаан явах буюу түр зогсох газар) Удаан явах ёстой газарт замын тахир хэсгийн ойролцоо, эгц налуу замын уруудах хэсэг, налуу замын давааны орой ойролцоо багтана. Замын хөдөлгөөний зохицуулалт хийгдээгүй бөгөөд зүүн, баруун талыг шалгах боломжгүй буюу хөдөлгөөн ихтэй уулзвар, аймаг, нийслэлийн Цагдаагийн газрын дарга замын аюулаас сэргийлж, хөдөлгөөний аюулгүй байдал болон саадгүй урсгалыг хангахад шаардлагатай гэж үзэж аюулгүйн тэмдэглэгээгээр тогтоосон газар нь түр зогсох ёстой газар юм."},{"n":374,"b":"Замын хөдөлгөөний тухай хуулийн дагуу заавал түр зогсох газар аль нь вэ?","c":["Хөдөлгөөн зохицуулагчгүй бөгөөд баруун, зүүн талыг харах боломжгүй уулзвар","Ногоон гэрэл ассан уулзвар","Хөдөлгөөн ихтэй гүүрэн дээр эсвэл хонгил дотор","Замын тахир хэсэг эсвэл налуу замын оргил хэсгийн орчим"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 31 дүгээр зүйлийн 2 дахь хэсэг Замын хөдөлгөөний зохицуулалт хийгдээгүй бөгөөд зүүн, баруун талыг шалгах боломжгүй буюу хөдөлгөөн ихтэй уулзварт түр зогсох ёстой."},{"n":375,"b":"Замын хөдөлгөөний тухай хуулийн дагуу түр зогсох ёстой газар аль нь вэ?","c":["Хонгил дотор болон гүүрэн дээр","Гэрлэн дохиогүй, хөдөлгөөн ихтэй уулзвар","Огцом уруудах налуу зам","Замын тахир хэсгийн орчим"],"a":"2","imgs":[],"t":"문장형","e":"Гүйцэж түрүүлэхийг хориглосон бүс болон түр зогсох ёстой газрыг өөр өөрөөр тогтоосон байдаг. Хонгил дотор болон гүүрэн дээр, эгц налуу замын уруудах хэсэг, замын тахир хэсгийн ойролцоо нь гүйцэж түрүүлэхийг хориглосон бүс юм. Замын хөдөлгөөний зохицуулалт хийгдээгүй бөгөөд зүүн, баруун талыг шалгах боломжгүй буюу хөдөлгөөн ихтэй уулзвар, аймаг, нийслэлийн Цагдаагийн газрын дарга замын аюулаас сэргийлж, хөдөлгөөний аюулгүй байдал болон саадгүй урсгалыг хангахад шаардлагатай гэж үзэж аюулгүйн тэмдэглэгээгээр тогтоосон газар нь түр зогсох ёстой газар юм. (Замын хөдөлгөөний тухай хуулийн 31 дүгээр зүйлийн 2 дахь хэсэг)"},{"n":376,"b":"Хувьсах хурдны хязгаарлалтын бүсийн талаар буруу тайлбар аль нь вэ?","c":["Нөхцөл байдлаас шалтгаалан тогтоосон хурдыг өөрчилдөг идэвхтэй систем юм.","Хурдны тоон утгыг өөрчилж харуулах боломжтой цахим мэдээллийн самбар ашигладаг.","Хувьсах хурдны хязгаарлалтын тэмдгээр тогтоосон хамгийн дээд хурдыг мөрдөнө.","Хувьсах хурдны хязгаарлалтын тэмдгээр тогтоосон хамгийн дээд хурд болон аюулгүй байдлын тэмдэгт заасан хамгийн дээд хурд өөр байвал аюулгүй байдлын тэмдэгт заасан хурдыг мөрдөнө."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлийн 1 дэх заалт Хувьсах хурдны хязгаарлалтын тэмдгээр хурдны дээд хязгаарыг тогтоосон тохиолдолд үүнийг дагах ёстой бөгөөд хувьсах хурдны хязгаарлалтын тэмдгээр тогтоосон хурдны дээд хязгаар болон бусад аюулгүйн тэмдэглэгээгээр тогтоосон хурдны дээд хязгаар өөр байх үед хувьсах хурдны хязгаарлалтын тэмдгийг дагах ёстой."},{"n":377,"b":"Замын хөдөлгөөний тухай хуулийн дагуу ( )-ийн жолооч төмөр замын гарамаар нэвтрэх гэж байгаа бол гарамын өмнө ( ) хийж, аюулгүй эсэхийг шалгасны дараа нэвтэрнэ. ( ) -д тохирох нь аль вэ?","c":["Бүх тээврийн хэрэгсэл, удаан явна.","Бүх автомашин болон барилгын машин механизм, удаан явна.","Бүх тээврийн хэрэгсэл эсвэл бүх трамвай, түр зогсоно.","Бүх тээврийн хэрэгсэл эсвэл трамвай, түр зогсоно."],"a":"4","imgs":[],"t":"문장형","e":"Бүх тээврийн хэрэгсэл болон трамвайн жолооч төмөр замын гарамаар нэвтрэх гэж буй тохиолдолд гарамын өмнө түр зогсож аюулгүй байдлыг шалгасны дараа нэвтрэх ёстой. (Замын хөдөлгөөний тухай хуулийн 24 дүгээр зүйл Төмөр замын гарамаар нэвтрэх)"},{"n":378,"b":"Дараахын аль нь хурдны замын орох, гарах уулзвар дээр хамгийн аюулгүй жолоодох арга вэ?","c":["Хурдны замын орох, гарах уулзварт түгжрэл үүсдэг тул ослоос сэргийлэхийн тулд арын машиныг ойртуулахгүйгээр огцом тоормослоно.","Хурдны замын орох, гарах уулзварт хурдны мэдрэмж сул болдог тул түр зогссоны дараа хөдөлнө.","Хурдны замаас гарах гэж байсан уулзварыг өнгөрүүлсэн бол дараагийн уулзварыг ашиглана.","Огцом хурдлан уулзвараар гарна."],"a":"3","imgs":[],"t":"문장형","e":"Гэнэт тоормослох нь ард явж буй тээврийн хэрэгсэлтэй осол гарах эрсдэлийг нэмэгдүүлнэ. Хурдны замын орц гарцын ойролцоо гэнэт хурдаа сааруулж ердийн замд гарах үед хурдны мэдрэмж мохдог тул урьдчилан удаан явж ердийн замын тогтоосон хурдад тохируулан явах ёстой. Гарах ёстой орц гарцыг өнгөрөөсөн тохиолдолд дараагийн орц гарцыг ашиглан гарах ёстой."},{"n":379,"b":"Замын хөдөлгөөний тухай хуулийн дагуу урд яваа тээврийн хэрэгслийн жолооч зүүн гараа мөрний түвшинд сунган тээврийн хэрэгслийн зүүн талаас гаргасан үед авах хамгийн зөв арга хэмжээ аль нь вэ?","c":["Урд яваа тээврийн хэрэгсэл баруун эргэнэ гэж үзэн удаан явна.","Урд яваа тээврийн хэрэгсэл зам хөндлөн гарна гэж үзэн дээд эгнээ рүү шилжинэ.","Урд яваа тээврийн хэрэгсэл буцаж эргэлт хийнэ гэж үзэн гүйцэж түрүүлнэ.","Урд яваа тээврийн хэрэгсэл эгнээ солих гэж байгаа тул удаан явна."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 2, зүүн тийш эргэх, хөндлөн гарах, буцаж эргэх буюу нэг чиглэлд явж байхдаа чиглэлээ зүүн тийш өөрчлөх гэж буй үед тухайн үйлдлийг хийх гэж буй цэгт (зүүн тийш эргэх тохиолдолд тухайн уулзварын зах) хүрэхээс өмнө 30 метр (хурдны замд 100 метр) ба түүнээс дээш зайтай цэгт хүрсэн үед зүүн гараа хэвтээ сунгаж тээврийн хэрэгслийн зүүн гадна талд гаргах, эсвэл баруун гараа тээврийн хэрэгслийн баруун гадна талд гаргаж тохойгоо нугалан босоо өргөх, эсвэл зүүн талын чиг заах дохио буюу гэрлийг ажиллуулна."},{"n":380,"b":"Замын хөдөлгөөний тухай хуулийн дагуу жолооч баруун эргэхдээ ашигладаг гар дохио аль нь вэ?","c":["Зүүн гараа тээврийн хэрэгслийн зүүн талаас гаргаж, тохойгоо нугалан босоо чиглэлд дээш өргөнө.","Зүүн гараа мөрний түвшинд чигээрээ сунган тээврийн хэрэгслийн зүүн талаас гаргана.","Баруун гараа тээврийн хэрэгслийн баруун талаас мөрний түвшинд сунгаж, гараа урагш хойш савлана.","Зүүн гараа тээврийн хэрэгслийн гадна гаргаж, 45° доош чиглэлд сунгана."],"a":"1","imgs":[],"t":"문장형","e":"Жолооч баруун тийш эргэх гэж буй үед зүүн гараа тээврийн хэрэгслийн зүүн гадна талд гаргаж тохойгоо нугалан босоо өргөнө."},{"n":381,"b":"Гэрлэн дохионы дагуу уулзварт орох гэж байтал цагдаагийн алба хаагч зогс гэсэн гар дохио өглөө. Дараахаас хамгийн аюулгүй жолоодох арга аль нь вэ?","c":["Зогсох шугамын өмнө түр зогсоно.","Огцом хурд сааруулж удаан явна.","Гэрлэн дохиог дагаж явна.","Уулзварт аажмаар орно."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний аюулгүй байдлын байгууламжийн заадаг дохио буюу заавар болон замын хөдөлгөөний зохицуулалт хийж буй цагдаагийн алба хаагч зэргийн дохио буюу заавар өөр тохиолдолд цагдаагийн алба хаагч зэргийн дохио буюу зааврыг дагах ёстой."},{"n":382,"b":"Төв шугам нь шар тасархай болон шар үргэлжилсэн хос шугамаас бүрдэх үед гүйцэж түрүүлэх тухай зөв тайлбар аль нь вэ?","c":["Шар үргэлжилсэн болон шар тасархай шугамын аль ч талаас төв шугам давж гүйцэж түрүүлэхийг хориглоно.","Шар тасархай шугамтай талаас төв шугам давж гүйцэж түрүүлэх боломжтой.","Аюулгүй нь баталгаажсан бол шар үргэлжилсэн эсвэл шар тасархай шугамтай эсэхээс үл хамааран гүйцэж түрүүлж болно.","Шар үргэлжилсэн шугамтай талаас төв шугам давж гүйцэж түрүүлэх боломжтой."],"a":"2","imgs":[],"t":"문장형","e":"Шар тасархай шугамтай талаас төвийн шугамыг давж гүйцэж түрүүлж болох боловч шар тасралтгүй шугамтай талаас төвийн шугамыг давж гүйцэж түрүүлж болохгүй."},{"n":383,"b":"Жолоодож явах үед төмөр замын гарамаар нэвтрэх хамгийн зөв арга аль нь вэ?","c":["Галт тэрэг ирэхгүй бол шууд гарна.","Түр зогсож, аюулгүй эсэхийг шалгасны дараа гарна.","Хурдны хязгаартай тэнцүү буюу түүнээс дээш хурдтай гарна.","Хаалт буух гэж байвал хурдан гарна."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 24 дүгээр зүйл (Төмөр замын гарамаар нэвтрэх) ① Бүх тээврийн хэрэгсэл болон трамвайн жолооч төмөр замын гарам (цаашид \"гарам\" гэх)-аар нэвтрэх гэж буй тохиолдолд гарамын өмнө түр зогсож аюулгүй эсэхийг шалгасны дараа нэвтрэх ёстой. Гэхдээ гэрлэн дохио зэргийн заадаг дохиог дагах тохиолдолд зогсолгүй нэвтэрч болно. ② Бүх тээврийн хэрэгсэл болон трамвайн жолооч гарамын хаалт буусан буюу буух гэж байгаа тохиолдолд, эсвэл гарамын дохиолол дуугарч байх хугацаанд тухайн гарамд орж болохгүй."},{"n":384,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зүүн эгнээ рүү шилжих зөв арга аль нь вэ?","c":["Шилжих цэгээс өмнө 30 метр (хурдны замд 100 метрээс) ба түүнээс дээш зайд хүрэхэд зүүн чиг заах дохиог асаана.","Шилжих цэгээс өмнө 10 метр (хурдны замд 100 метрээс) ба түүнээс дээш зайд хүрэхэд зүүн чиг заах дохиог асаана.","Шилжих цэгээс өмнө 20 метрээс (хурдны замд 80 метрээс) доошгүй зайд хүрэхэд зүүн чиг заах дохиог асаана.","Шилжих цэг дээр очоод зүүн чиг заах дохиог асаана."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын [Хавсралт 2] Дохио өгөх цаг хугацаа болон арга, чиглэлээ өөрчлөх гэж буй тохиолдолд тухайн цэгт хүрэхээс өмнө 30 метр ба түүнээс дээш зайтай цэгт хүрсэн үед чиг заах дохиог ажиллуулна."},{"n":385,"b":"Замын хөдөлгөөний тухай хуулийн дагуу автомашины хурдтай холбоотой буруу тайлбар аль нь вэ?","c":["Энгийн зам, автомашины зориулалтын зам, хурдны зам болон нийт эгнээний тооноос хамааран хуулиар тогтоосон хурдыг тусад нь тогтоодог.","Энгийн замд хамгийн бага хурдны хязгаар байдаггүй.","Цаг агаарын аюултай үзэгдлийн үед хурдыг сааруулан явна.","Хувьсах хурдны хязгаарлалтын тэмдэгт заасан хамгийн дээд хурд болон бусад аюулгүй байдлын тэмдэгт заасан хамгийн дээд хурд өөр байвал бусад аюулгүй байдлын тэмдгийг дагана."],"a":"4","imgs":[],"t":"문장형","e":"Хувьсах хурдны хязгаарлалтын тэмдгийг дагах ёстой."},{"n":386,"b":"Замын хөдөлгөөний тухай хуулийн дагуу автомашины хурдтай холбоотой буруу тайлбар аль нь вэ?","c":["Тээврийн хэрэгслийн хурд нэмэгдэх тусам ослын эрсдэл өсдөг тул хурд хэтрүүлэхийг хязгаарлах зорилготой.","Автомашины зориулалтын зам болон хурдны замд замын ашиглалтыг сайжруулахын тулд хамгийн бага хурдыг тогтоодог.","Цагдаагийн ерөнхий газрын дарга эсвэл аймаг, нийслэлийн цагдаагийн газрын дарга хөдөлгөөний аюулгүй байдал, хэвийн урсгалыг хангахын тулд тусгайлан хурд тогтоож болно.","Хурдны замын хурдны зохицуулалтыг аймаг, нийслэлийн цагдаагийн газрын дарга, хурдны замаас бусад замын хурдны зохицуулалтыг Цагдаагийн ерөнхий газрын дарга хэрэгжүүлдэг."],"a":"4","imgs":[],"t":"문장형","e":"Хурдны замд Цагдаагийн ерөнхий газрын дарга, хурдны замаас бусад замд аймаг, нийслэлийн Цагдаагийн газрын дарга нь хурдыг зохицуулах эрх бүхий этгээд юм."},{"n":387,"b":"Замын хөдөлгөөний тухай хуулийн дагуу гэрлэн дохио зөрчсөнд тооцогдох 2 нь аль вэ?","c":["Улаан гэрэл ассан үед зогсох шугамыг давж зогсох","Уулзварт хүрэхээс өмнө шар гэрэл асахад уулзварт орох","Шар анивчдаг гэрлийн үед бусад хөдөлгөөн болон аюулгүй байдлын тэмдгийг анхааран үргэлжлүүлэн явах","Улаан анивчдаг гэрлийн үед зогсох шугамын өмнө түр зогсоод бусад хөдөлгөөнийг анхааран үргэлжлүүлэн явах"],"a":"1, 2","imgs":[],"t":"문장형","e":"Улаан дохиотой үед зогсох шугамын яг өмнө зогсох бөгөөд уулзварт хүрэхээс өмнө шар дохиотой үед ч зогсох шугамын яг өмнө зогсох ёстой."},{"n":388,"b":"Нэг чиглэлийн 3 эгнээтэй замын уулзварт баруун эргэх зөв арга 2 нь аль вэ?","c":["Баруун эргэхдээ уулзварын өмнө чиг заах дохиог асааж, явах чиглэлээ мэдэгдэнэ.","Баруун талын замын явган хүний гарцын гэрэл ногоон байсан ч явган хүн байхгүй бол нэвтэрч болно.","Баруун эргэх гурван өнгийн гэрэл улаан байвал явган хүн байхгүй байсан ч нэвтрэх боломжгүй.","Нэг чиглэлийн 3 эгнээтэй замд 2-р эгнээнээс баруун эргэх нь аюулгүй."],"a":"2, 3","imgs":[],"t":"문장형","e":"Уулзварт баруун тийш эргэх үед баруун талын замын явган хүний гарцын явган зорчигчийн гэрлэн дохио ногоон байсан ч явган зорчигчийн хөдөлгөөнд саад учруулахгүй хүрээнд нэвтэрч болно. Гэхдээ явган зорчигчийн гэрлэн дохионы хажууд тээврийн хэрэгслийн туслах гэрлэн дохио суурилуулсан тохиолдолд туслах гэрлэн дохио улаан байх үед нэвтэрвэл гэрлэн дохио зөрчихөд хамаарч болзошгүй тул нэвтэрч болохгүй бөгөөд явган зорчигч явган хүний гарц дээр байвал явж буй тээврийн хэрэгсэл болон явган зорчигч хол зайтай байсан ч явган зорчигчийн хөдөлгөөнд саад учруулж байгаа тул нэвтэрч болохгүй."},{"n":389,"b":"Дараах автомашины удирдлагын тухай хуулийн дагуу олон суудалт автомашины ангилал болон түүнийг даган зүүн эргэх үед анхаарах жолоодлогын аргуудаас зөв 2-ыг нь сонгоно уу.","c":["Том оврын олон суудалт автомашин нь 36 ба түүнээс их хүний суудалтай тээврийн хэрэгсэл бөгөөд ийм том оврын олон суудалт автомашин гэрлэн дохиог халхалж болзошгүй тул аюулгүйн зай барин удаан явна.","Дунд оврын олон суудалт автомашин нь 16–35 хүний суудалтай бөгөөд чиг заах дохио өгсөн үед өөр тээврийн хэрэгсэл эгнээ сольж орж ирж болзошгүй тул тээврийн хэрэгсэл хоорондын зайг багасган удаан явна.","Жижиг оврын олон суудалт автомашин нь 15 хүртэлх хүний суудалтай бөгөөд суудлын автомашинаас хүндийн төв өндөр тул онхолдох эрсдэлтэй учир аюулгүйн зай барин явна.","Бага оврын олон суудалт автомашин нь 1200 см³-аас бага хөдөлгүүрийн багтаамжтай бөгөөд суудлын автомашинтай ижил хүндийн төвтэй боловч хангалттай аюулгүйн зай барин даган явна."],"a":"1, 3","imgs":[],"t":"문장형","e":"Дохиог тухайн үйлдлийг хийх гэж буй цэгт (зүүн тийш эргэх тохиолдолд тухайн уулзварын зах) хүрэхээс өмнө 30 метр (хурдны замд 100 метр) ба түүнээс дээш зайтай цэгт хүрсэн үед өгөх ёстой бөгөөд урьдчилан хурдаа бууруулсны дараа 1 дүгээр эгнээ буюу зүүн эргэлтийн эгнээгээр удаан явж орох ёстой. Автотээврийн хэрэгслийн удирдлагын тухай хуулийг хэрэгжүүлэх дүрмийн 2 дугаар зүйл (Автомашины төрлийн ангилал Хавсралт 1 Автомашины төрөл)"},{"n":390,"b":"Эгнээ солих үед хамгийн аюулгүй жолоодох арга 2 нь аль вэ?","c":["Шилжих гэж буй эгнээнд ардаас дагаж яваа тээврийн хэрэгсэлтэй хангалттай зайтай бол хурдаа хадгалан эгнээгээ солино.","Шилжих гэж буй эгнээнд ардаас дагаж яваа тээврийн хэрэгсэлтэй хангалттай зайтай бол хурдаа сааруулан эгнээгээ солино.","Шилжих гэж буй эгнээнд арын тээврийн хэрэгсэл ойртож байгаа бол хурдаа багасгаж, эхлээд арын тээврийн хэрэгслийг өнгөрүүлнэ.","Арын тээврийн хэрэгсэл ойртож байгаа үед яаран эгнээгээ солино."],"a":"1, 3","imgs":[],"t":"문장형","e":"Ард явж буй тээврийн хэрэгсэлтэй зай байгаа үед хурдаа хадгалсаар эгнээ солих бөгөөд ойртож байгаа үед хурдаа бууруулж ард явж буй тээврийн хэрэгслийг эхлээд өнгөрүүлнэ."},{"n":391,"b":"Эгнээг тусгаарлах замын шугамын талаар зөв тайлбар 2 нь аль вэ?","c":["Үргэлжилсэн болон тасархай шугам зэрэгцсэн үед үргэлжилсэн шугамын талаас тасархай шугамын тал руу эгнээ солих боломжгүй.","Үргэлжилсэн болон тасархай шугам зэрэгцсэн үед үргэлжилсэн шугамын талаас тасархай шугамын тал руу эгнээ солих боломжтой.","Үргэлжилсэн болон тасархай шугам зэрэгцсэн үед тасархай шугамын талаас үргэлжилсэн шугамын тал руу эгнээ солих боломжгүй.","Үргэлжилсэн болон тасархай шугам зэрэгцсэн үед тасархай шугамын талаас үргэлжилсэн шугамын тал руу эгнээ солих боломжтой."],"a":"1, 4","imgs":[],"t":"문장형","e":"① Эгнээг тусгаарлах шугамын дотроос тасралтгүй шугам нь эгнээ солих боломжгүй шугам юм. ② Тасархай шугам нь эгнээ солих боломжтой шугам юм. ③ Тасралтгүй шугам болон тасархай шугам зэрэгцэн байгаа тохиолдолд тасралтгүй шугамын талаас тасархай шугамын чиглэлд эгнээ солих боломжгүй. ④ Тасралтгүй шугам болон тасархай шугам зэрэгцэн байгаа тохиолдолд тасархай шугамын талаас тасралтгүй шугамын чиглэлд эгнээ солих боломжтой."},{"n":392,"b":"Замын хөдөлгөөний тухай хуулийн дагуу улаан анивчдаг гэрлийн утга юу вэ?","c":["Тээврийн хэрэгсэл болон хөсөг бусад хөдөлгөөнийг анхааран удаан явна.","Тээврийн хэрэгсэл болон хөсөг бусад хөдөлгөөнийг анхааран үргэлжлүүлэн явж болно.","Тээврийн хэрэгсэл болон хөсөг аюулгүй байдлын тэмдгийг анхааран ухарч болно.","Тээврийн хэрэгсэл болон хөсөг зогсох шугамын өмнө түр зогсоод бусад хөдөлгөөнийг анхааран үргэлжлүүлэн явж болно."],"a":"4","imgs":[],"t":"문장형","e":"Улаан гэрэл анивчиж байх үед тээврийн хэрэгсэл, хөсөг нь зогсох шугам буюу явган хүний гарц байгаа үед түүний яг өмнө, эсвэл уулзварын яг өмнө түр зогссоны дараа бусад хөдөлгөөнд анхаарал хандуулан явж болно."},{"n":393,"b":"Хамгаалалтгүй зүүн эргэлтийн тэмдэгтэй уулзварын талаар тайлбар юм. Зөв нь аль вэ?","c":["Гэрлэн дохионоос үл хамааран бусад хөдөлгөөнийг анхааран зүүн эргэж болно.","Улаан гэрэл ассан үед бусад хөдөлгөөнийг анхааран зүүн эргэж болно.","Ногоон гэрэл ассан үед бусад хөдөлгөөнийг анхааран зүүн эргэж болно.","Шар гэрэл ассан үед бусад хөдөлгөөнийг анхааран зүүн эргэж болно."],"a":"3","imgs":[],"t":"문장형","e":"Хамгаалалтгүй зүүн эргэлтийн тэмдэг байгаа газарт ногоон дохио асаалттай байх үед бусад хөдөлгөөнд анхаарал хандуулан зүүн тийш эргэж болно. Ногоон дохиотой үед зүүн тийш эргэж байгаад эсрэг талын чигээрээ явж буй тээврийн хэрэгсэлтэй мөргөлдсөн тохиолдолд зүүн тийш эргэж буй тээврийн хэрэгсэл нь хөнгөн болгоомжгүй ердийн ослын буруутай этгээд болно."},{"n":394,"b":"Замын хөдөлгөөний тухай хуулийн дагуу автомашины хурдтай холбоотой зөв тайлбар аль нь вэ?","c":["Хурдны замын хамгийн бага хурдыг цагт 50 км гэж тогтоосон.","Автомашины зориулалтын замд хамгийн дээд хурдыг хязгаарладаг боловч хамгийн бага хурдыг хязгаарладаггүй.","Энгийн замд хамгийн бага болон хамгийн дээд хурдыг хоёуланг нь хязгаарладаг.","Нэг чиглэлийн 2 ба түүнээс дээш эгнээтэй хурдны замын хамгийн дээд хурд нь тээврийн хэрэгслийн төрлөөс үл хамааран ижил байдаг."],"a":"1","imgs":[],"t":"문장형","e":"Хурдны замын хурдны доод хязгаарыг бүх хурдны замд адилхан цагт 50 километр гэж тогтоосон бөгөөд автомашины зориулалтын замд хурдны дээд хязгаар болон хурдны доод хязгаар хоёулаа хязгаарлалттай. Ердийн замд хурдны доод хязгаарын хязгаарлалт байхгүй бөгөөд нэг чиглэлд 2 ба түүнээс дээш эгнээтэй хурдны замын хурдны дээд хязгаарыг тээврийн хэрэгслийн төрлөөс хамааран өөр өөрөөр тогтоосон байдаг."},{"n":395,"b":"Замын хөдөлгөөний тухай хуулийн дагуу гүйцэж түрүүлэх тухай зөв тайлбар аль нь вэ?","c":["Урд яваа тээврийн хэрэгсэл өөр тээврийн хэрэгслийг гүйцэж түрүүлж байгаа үед мөн гүйцэж түрүүлж болно.","Хонгил дотор гүйцэж түрүүлэх бол заавал баруун талаар гүйцэж түрүүлнэ.","Нэг чиглэлийн нэг эгнээтэй замд зөвхөн шар үргэлжилсэн шугамтай хэсэгт гүйцэж түрүүлэх боломжтой.","Уулзвар дотор гүйцэж түрүүлэхийг хориглоно."],"a":"4","imgs":[],"t":"문장형","e":"Шар тасралтгүй шугамд гүйцэж түрүүлэхийг хориглох бөгөөд хонгил дотор буюу гүүрэн дээр нь гүйцэж түрүүлэхийг хориглосон газар бөгөөд урд явж буй тээврийн хэрэгсэл өөр тээврийн хэрэгслийг гүйцэж түрүүлж байгаа тохиолдолд гүйцэж түрүүлж болохгүй гэж тогтоосон байдаг."},{"n":396,"b":"Замын хөдөлгөөний тухай хуулийн дагуу замын төв шугамын талаар тайлбар юм. Зөв нь аль вэ?","c":["Нэг шар үргэлжилсэн төв шугамтай үед гүйцэж түрүүлэх боломжтой.","Хувьсах эгнээнд гэрлэн дохиогоор заасан чиглэлийн хамгийн зүүн талын шар тасархай шугамыг хэлнэ.","Нэг чиглэлийн нэг эгнээтэй орон нутгийн замд автобус зорчигч буулгах, суулгах зорилгоор түр зогссон үед шар үргэлжилсэн төв шугам давж гүйцэж түрүүлж болно.","Замын өргөн хамгийн багадаа 4.75 метр болсон үед төв шугам тавих боломжтой."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 5 дахь заалт болон 13 дугаар зүйл, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6-ын дугаар 501: төвийн шугам давхар ч бай, дан ч бай давж болохгүй бөгөөд автобус зорчигч суулгах, буулгахаар зогссон тохиолдолд гүйцэж түрүүлж болохгүй. Мөн төвийн шугамыг зорчих хэсгийн өргөн 6 метр ба түүнээс дээш газарт байрлуулна."},{"n":397,"b":"Замын хөдөлгөөний тухай хуулийн дагуу нэг чиглэлийн 3 эгнээтэй хурдны замын 2-р эгнээгээр зорчих боломжтой тээврийн хэрэгсэл аль нь вэ?","c":["Ачааны автомашин","Тусгай зориулалтын тээврийн хэрэгсэл","Барилгын машин механизм","Жижиг болон дунд оврын олон суудалт автомашин"],"a":"4","imgs":[],"t":"문장형","e":"Нэг чиглэлд 3 эгнээтэй хурдны замд 2 дугаар эгнээ нь зүүн эгнээнд хамаарах тул түүгээр явж болох тээврийн хэрэгслийн төрөл нь суудлын автомашин болон хөнгөн, жижиг, дунд оврын олон суудалт автомашин юм. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 9)"},{"n":398,"b":"Замын хөдөлгөөний тухай хуулийн дагуу нэг чиглэлийн 2 эгнээтэй хурдны замд хөдөлгөөний ачаалал нэмэгдсэн зэрэг зайлшгүй шалтгааны улмаас 1-р эгнээгээр цагт ( ) км-ээс бага хурдтай явахаас өөр аргагүй болсон тохиолдолд гүйцэж түрүүлэхгүй байсан ч тухайн эгнээгээр зорчиж болно. ( ) -д тохирох нь аль вэ?","c":["80","90","100","110"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 9] Эгнээгээр явах тээврийн хэрэгслийн стандарт: нэг чиглэлд 2 эгнээтэй хурдны замд гүйцэж түрүүлэх гэж буй бүх автомашин. Гэхдээ тээврийн хэрэгслийн хөдөлгөөн ихсэх зэрэг замын нөхцөл байдлаас шалтгаалан цагт 80 километрээс доош хурдтай явахаас өөр аргагүй тохиолдолд гүйцэж түрүүлэхгүй байсан ч тэр эгнээгээр явж болно."},{"n":399,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хурдны замын захыг ашиглах талаар зөв тайлбар аль нь вэ?","c":["Нойрмог жолоодлогоос сэргийлэхийн тулд захад түр зогсож амарна.","Нар мандахыг үзэхийн тулд захад зогсоолд тавина.","Хурдны замын зорчих эгнээнд түгжрэлтэй үед захаар явна.","Зайлшгүй шалтгаангүйгээр хурдны замын зах дээр зорчсон суудлын автомашины жолоочид ногдуулах зөрчлийн торгууль 6 0,000 вон байна."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 60 дугаар зүйл (Замын захаар явахыг хориглох зэрэг), Замын хөдөлгөөний тухай хуулийн 64 дүгээр зүйл (Хурдны зам зэрэгт зогсох, зогсоолд тавихыг хориглох), Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8-ын 19 дэх заалт: суудлын автомашин зэрэг 60,000 вон."},{"n":400,"b":"Замын хөдөлгөөний тухай хуулийн дагуу нэг чиглэлийн 5 эгнээтэй хурдны замын эгнээ ашиглах журмаар бол аль хүртэлх эгнээ нь зүүн талын эгнээ вэ? (Хөдөлгөөн хэвийн, тусгай зориулалтын эгнээ болон хурд авах/сааруулах эгнээ байхгүй гэж үзнэ.)","c":["1–2-р эгнээ","2–3-р эгнээ","1–3-р эгнээ","Зөвхөн 2-р эгнээ"],"a":"2","imgs":[],"t":"문장형","e":"1 дүгээр эгнээг эс тооцсон эгнээнүүдийг хоёр хуваахад 1 дүгээр эгнээнд ойр хэсгийн эгнээг хэлнэ. Гэхдээ 1 дүгээр эгнээг эс тооцсон эгнээний тоо сондгой бол дундах эгнээг хамааруулахгүй."},{"n":401,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хурдны замын зориулалтын эгнээний талаар буруу тайлбар аль нь вэ? (Хөдөлгөөн хэвийн, автобусны тусгай эгнээ байхгүй.)","c":["Нэг чиглэлийн 3 эгнээтэй замын 1-р эгнээгээр гүйцэж түрүүлэх гэж буй суудлын автомашин, бага оврын, жижиг оврын, дунд оврын олон суудалт автомашин зорчиж болно.","Гүйцэж түрүүлэх үед зориулалтын эгнээний зүүн талын шууд залгаа эгнээгээр зорчиж болно.","Бүх тээврийн хэрэгсэл зориулалтын эгнээнээс зүүн талын эгнээгээр зорчиж болно.","Хурдны замын зориулалтын эгнээний журам зөрчсөн суудлын автомашины жолоочид 10 онооны торгуулийн оноо ногдуулна."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 9] Бүх тээврийн хэрэгсэл заасан эгнээнээс баруун талд байрлах эгнээгээр явж болно. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8-ын 39 дэх заалт: суудлын автомашин зэрэг 40,000 вон. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28-ын 3-ын 21 дэх заалт: торгуулийн оноо 10 оноо."},{"n":402,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хөдөлгөөн хэвийн нэг чиглэлийн 3 эгнээтэй хурдны замд гүйцэж түрүүлэх аргын талаар буруу тайлбар аль нь вэ? (Автобусны тусгай эгнээ байхгүй.)","c":["Суудлын автомашин гүйцэж түрүүлэхийн тулд 1-р эгнээ рүү шилжсэний дараа үргэлжлүүлэн 1-р эгнээгээр явна.","3-р эгнээгээр явж буй том оврын олон суудалт автомашин 2-р эгнээгээр гүйцэж түрүүлнэ.","2-р эгнээгээр явж буй жижиг оврын олон суудалт автомашин 1-р эгнээг ашиглан гүйцэж түрүүлнэ.","5 тоннын ачааны автомашин 2-р эгнээг ашиглан гүйцэж түрүүлнэ."],"a":"1","imgs":[],"t":"문장형","e":"Хурдны замд суудлын автомашин гүйцэж түрүүлэхдээ 1 дүгээр эгнээг ашиглаж, гүйцэж түрүүлж дууссаны дараа заасан явах эгнээгээр явах ёстой. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 9)"},{"n":403,"b":"Замын хөдөлгөөний тухай хуулийн дагуу эгнээний зориулалтын талаар тайлбар юм. Буруу нь аль вэ?","c":["Бүх тээврийн хэрэгсэл зориулалтын эгнээний баруун талын эгнээгээр зорчиж болно.","Суудлын автомашин гүйцэж түрүүлэх үед зориулалтын эгнээний шууд баруун талын эгнээгээр зорчих ёстой.","Нэг чиглэлийн 4 эгнээтэй ердийн замд суудлын автомашин бүх эгнээгээр зорчиж болно.","Нэг чиглэлийн 4 эгнээтэй хурдны замд том оврын ачааны автомашины зорчих эгнээ нь баруун талын эгнээ юм."],"a":"2","imgs":[],"t":"문장형","e":"Гүйцэж түрүүлэхдээ явах стандартаар заасан эгнээний яг зэргэлдээх зүүн эгнээгээр явж болно. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 9)"},{"n":404,"b":"Замын хөдөлгөөний тухай хуулийн дагуу энгийн замын автобусны тусгай эгнээгээр зорчиж болох тохиолдол аль нь вэ?","c":["12 хүний суудалтай олон суудалт автомашин жолоочоос бусад 6 зорчигчтой явж байгаа тохиолдол","Дотоодын жуулчин тээвэрлэх зориулалттай олон суудалт автомашин 25 жуулчин тээвэрлэж байгаа тохиолдол","Тогтмол чиглэлээр ажилладаг ажилчдын зориулалттай 12 хүний суудалтай олон суудалт автомашин ажилчдаа тээвэрлэж байгаа тохиолдол","Такси зорчигч буулгах эсвэл суулгах зорилгоор түр хугацаанд нэвтрэн өнгөрөх тохиолдол"],"a":"4","imgs":[],"t":"문장형","e":"Тусгай эгнээгээр явах тээврийн хэрэгслийн хөдөлгөөнд саад учруулахгүй хүрээнд такси зорчигч суулгах, буулгахын тулд түр явах тохиолдол. Энэ тохиолдолд таксины жолооч зорчигч суусан эсвэл буусан даруйд тусгай эгнээнээс гарах ёстой. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 10 дугаар зүйлийн 2 дахь заалт, мөн журмын Хавсралт 1)"},{"n":405,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хурдны замын автобусны тусгай эгнээгээр зорчих 9 хүний суудалтай суудлын автомашин нь ( ) ба түүнээс олон хүн суусан тохиолдолд л зорчиж болно. ( ) -д тохирох нь аль вэ?","c":["3","4","5","6"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 1"},{"n":406,"b":"Нэг чиглэлийн 3 эгнээтэй хурдны замын эгнээ ашиглах журмын талаар зөв тайлбар аль нь вэ? (Хөдөлгөөн хэвийн, автобусны тусгай эгнээ байхгүй.)","c":["Суудлын автомашины зорчих эгнээ нь 1-р эгнээ тул 1-р эгнээгээр зорчих ёстой.","Зорчих эгнээ нь 2-р эгнээ байдаг жижиг оврын олон суудалт автомашин гүйцэж түрүүлэхдээ 1-р эгнээг ашиглана.","Том оврын олон суудалт автомашин 1-р эгнээгээр зорчих ёстой.","Ачааны даац 1.5 тонн ба түүнээс бага ачааны автомашин 1-р эгнээгээр зорчих ёстой."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 9: нэг чиглэлд 3 эгнээтэй хурдны замд суудлын автомашин болон хөнгөн, жижиг, дунд оврын олон суудалт автомашины явах эгнээ нь зүүн талын 2 дугаар эгнээ бөгөөд 2 дугаар эгнээнээс гүйцэж түрүүлэхдээ 1 дүгээр эгнээг ашиглан гүйцэж түрүүлэх ёстой."},{"n":407,"b":"Замын хөдөлгөөний тухай хуулийн дагуу нэг чиглэлийн 3 эгнээтэй хурдны замаар суудлын автомашин 2-р эгнээгээр явж байна. Гүйцэж түрүүлж болох эгнээ нь аль вэ?(Хөдөлгөөн хэвийн, автобусны тусгай эгнээ байхгүй.)","c":["1-р эгнээ","2-р эгнээ","3-р эгнээ","1, 2, 3-р эгнээ бүгд"],"a":"1","imgs":[],"t":"문장형","e":"1 дүгээр эгнээг ашиглан гүйцэж түрүүлж болно."},{"n":408,"b":"Замын хөдөлгөөний тухай хуулийн дагуу гүйцэж түрүүлэх аргын талаар хамгийн буруу тайлбар аль нь вэ?","c":["Өөр тээврийн хэрэгслийг гүйцэж түрүүлэхдээ урд яваа тээврийн хэрэгслийн зүүн талаар өнгөрнө.","Төв шугам шар тасархай бол эсрэг урсгалд тээврийн хэрэгсэл байхгүй үед гүйцэж түрүүлэх боломжтой.","Хувьсах эгнээнд гэрлэн дохиогоор заасан чиглэлийн хамгийн зүүн талын шар тасархай шугам дээр гүйцэж түрүүлэх боломжгүй.","Нэг чиглэлийн 4 эгнээтэй хурдны замд баруун талын эгнээгээр явж буй тээврийн хэрэгсэл 1-р эгнээ хүртэл орж болно."],"a":"4","imgs":[],"t":"문장형","e":"① Замын хөдөлгөөний тухай хуулийн 21 дүгээр зүйл (Гүйцэж түрүүлэх арга зэрэг)-ийн 1 дэх хэсэг: бүх тээврийн хэрэгслийн жолооч өөр тээврийн хэрэгслийг гүйцэж түрүүлэхдээ урд явж буй тээврийн хэрэгслийн зүүн талаар явах ёстой. ② Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, төвийн шугамын тэмдэглэгээ (замын гадаргуугийн тэмдэглэгээний дугаар 501). ③ Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Нэр томьёоны тодорхойлолт)-ийн 5 дахь заалт: хувьсах эгнээ байрлуулсан тохиолдолд гэрлэн дохионы заасан явах чиглэлийн хамгийн зүүн талд байрлах шар тасархай шугамыг төвийн шугам гэж үзнэ. ④ Замын хөдөлгөөний тухай хуулийн 16 дугаар зүйлийн 1 дэх хэсэг болон 39 дүгээр зүйлийн 1 дэх хэсэг, хэрэгжүүлэх дүрмийн Хавсралт 9-ийн дагуу гүйцэж түрүүлэхдээ эгнээгээр явах тээврийн хэрэгслийн стандартын дагуу яг зэргэлдээх зүүн эгнээгээр явж болох тул нэг чиглэлд 3 ба түүнээс дээш эгнээтэй хурдны замд баруун эгнээгээр явж буй тээврийн хэрэгсэл 1 дүгээр эгнээ хүртэл орж болохгүй бөгөөд яг зэргэлдээх эгнээг ашиглан гүйцэж түрүүлж болно."},{"n":409,"b":"Замын хөдөлгөөний тухай хуулийн дагуу эгнээний зориулалтын талаар тайлбар юм. Буруу нь аль вэ? (Хурдны замын хувьд хөдөлгөөн хэвийн, автобусны тусгай эгнээ байхгүй.)","c":["Удаан хурдтай явах үед тухайн зорчиж буй эгнээний баруун талын эгнээгээр зорчиж болно.","Нэг чиглэлийн 2 эгнээтэй хурдны замын 1-р эгнээгээр бүх автомашин гүйцэж түрүүлэх зорилгоор зорчиж болно.","Нэг чиглэлийн замд баруун талаас эхлэн 1-р эгнээ гэж тооцно.","Нэг чиглэлийн 3 эгнээтэй хурдны замын баруун талын эгнээ нь ачааны автомашин зорчих эгнээ юм."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 16 дугаар зүйл: эгнээний дарааллыг замын төвийн шугамын талд байрлах эгнээнээс эхлэн 1 дүгээр эгнээ гэж тооцно. Гэхдээ нэг чиглэлийн хөдөлгөөнтэй замд замын зүүн талаас эхлэн 1 дүгээр эгнээ гэж тооцно."},{"n":410,"b":"Замын хөдөлгөөний тухай хуулийн дагуу нэг чиглэлийн 3 эгнээтэй хурдны замын эгнээ ашиглах журмын талаар зөв тайлбар аль нь вэ? (Хөдөлгөөн хэвийн, автобусны тусгай эгнээ байхгүй.)","c":["1-р эгнээ нь зорчих эгнээ нь 2-р эгнээ байдаг суудлын автомашины гүйцэж түрүүлэх эгнээ юм.","1-р эгнээ нь олон суудалт автомашины зорчих эгнээ юм.","Замын зах нь тусгай зориулалтын тээврийн хэрэгсэл болон чирэгч автомашины зорчих эгнээ юм.","Автобусны тусгай эгнээ ажиллаж байгаа үед 1-р эгнээ нь ачааны автомашины зорчих эгнээ болно."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 9: нэг чиглэлд 3 ба түүнээс дээш эгнээтэй хурдны замд 1 дүгээр эгнээгээр гүйцэж түрүүлэх гэж буй суудлын автомашин болон гүйцэж түрүүлэх гэж буй хөнгөн, жижиг, дунд оврын олон суудалт автомашин (гэхдээ тээврийн хэрэгслийн хөдөлгөөн ихсэх зэрэг замын нөхцөл байдлаас шалтгаалан цагт 80 километрээс доош хурдтай явахаас өөр аргагүй тохиолдолд гүйцэж түрүүлэхгүй байсан ч явж болно), зүүн эгнээгээр суудлын автомашин болон хөнгөн, жижиг, дунд оврын олон суудалт автомашин, баруун эгнээгээр том оврын олон суудалт автомашин, ачааны автомашин, тусгай автомашин болон хуулийн 2 дугаар зүйлийн 18 дахь заалтын \"б\" дэд заалтад заасан барилгын машин механизм явж болно."},{"n":411,"b":"Замын хөдөлгөөний тухай хуулийн дагуу дараахын аль нь тусгай эгнээний төрөл биш вэ?","c":["Автобусны тусгай эгнээ","Олон зорчигчтой тээврийн хэрэгслийн тусгай эгнээ","Автомашины тусгай эгнээ","Унадаг дугуйн тусгай эгнээ"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 1 (Тусгай эгнээний төрөл болон тусгай эгнээгээр явж болох тээврийн хэрэгсэл): тусгай эгнээний төрлийг автобусны тусгай эгнээ, олон зорчигчтой тээврийн хэрэгслийн тусгай эгнээ, унадаг дугуйн тусгай эгнээ гэсэн 3 төрөлд хуваана."},{"n":412,"b":"Халтиргааны талаар хамгийн зөв тайлбар аль нь вэ?","c":["Халтиргаа үүсэхийг багасгахын тулд стандарт дугуйнаас илүү өргөн дугуйгаар сольдог.","Бороотой замаас илүү цастай замд халтиргаа их үүсдэг тул хурдыг сааруулан явна.","Дугуйн хээ элэгдэх тусам барьцалдах чадвар нэмэгдэж, халтиргаа үүсэх магадлал буурна.","Дугуйн агаарын даралт багасах тусам өндөр хурдтай үед халтиргаа ихэсдэг."],"a":"4","imgs":[],"t":"문장형","e":"Өргөн дугуй, хийн даралт бага, дугуйн хээ элэгдсэн үед усан хальсны үзэгдэл үүсэх магадлал өндөр бөгөөд шинэ дугуй усан хальсны үзэгдэл үүсэхийг багасгадаг."},{"n":413,"b":"Мөстэй зам дээр автомашин халтирсан үед аюулгүй жолоодох зөв арга аль нь вэ?","c":["Жолооны хүрдийг халтирч буй чиглэл рүү эргүүлнэ.","Механик хурдны хайрцагтай тээврийн хэрэгслийн хувьд өндөр араанд шилжүүлнэ.","Жолооны хүрдийг халтирч буй чиглэлийн эсрэг эргүүлнэ.","Зогсоолын тоормос ашиглан зогсооно."],"a":"1","imgs":[],"t":"문장형","e":"Мөстэй замд автомашин хальтрах үед жолоог хальтарч буй чиглэл рүү эргүүлэх нь аюулгүй."},{"n":414,"b":"Манантай замд автомашин жолоодох үед хамгийн аюулгүй арга аль нь вэ?","c":["Эргэлттэй зам, уулзвар зэрэгт дуут дохио өгч бусад тээврийн хэрэгслийг холдуулан хурдан явна.","Манан өтгөн үед харагдах орчныг сайжруулахын тулд урд гэрлийг холын тусгалд шилжүүлнэ.","Манантай үед зөвхөн манангийн гэрэл асаах нь аюулгүй жолоодлогод тустай.","Тодорхой хэмжээнд харагдах орчинтой үед замын хашлага, төв шугам, эгнээ зэрэг байрлалаа тодорхойлох боломжтой тэмдэглэгээг ашиглан удаан явна."],"a":"4","imgs":[],"t":"문장형","e":"Манантай замд автомашин жолоодох үед тодорхой хэмжээнд харагдах орчин хангагдсан бол хамгаалалтын хашлага, төвийн шугам, эгнээний шугам зэрэг автомашины байрлалыг тодорхойлох боломжтой газрын тэмдэг, байгууламжийг ашиглан удаан явна."},{"n":415,"b":"Цастай эсвэл мөстэй зам дээр явж байхдаа зогсох үед хамгийн аюулгүй тоормослох арга аль нь вэ?","c":["Тоормосны дөрөөг хүчтэй гишгэнэ.","Хөлийн тоормос болон зогсоолын тоормосыг зэрэг ашиглан хурдан зогсооно.","Автомашин бүрэн зогсох хүртэл зөвхөн хөдөлгүүрийн тоормосоор хурд сааруулна.","Хөдөлгүүрийн тоормосоор хурд сааруулсны дараа тоормосны дөрөөг олон дахин зөөлөн гишгэнэ."],"a":"4","imgs":[],"t":"문장형","e":"Цастай болон мөстэй зам хальтиргаатай тул зогсохдоо хөдөлгүүрийн тоормосоор хурдаа бууруулсны дараа хөлийн тоормосыг хэд хэдэн удаа хувааж гишгэх нь аюулгүй."},{"n":416,"b":"Аадар бороотой үед газрын доорх авто замаар явах жолоочийн хамгийн зөв хандлага аль нь вэ?","c":["Бүх газрын доорх авто зам ус зайлуулах байгууламж сайн тул аюул үүсэхгүй.","Гамшгийн мэдээ, мэдээллийн самбар зэрэг мэдээллийг сонсон, аюулд тохируулан арга хэмжээ авна.","Бороо зогсох хүртэл газрын доорх авто замын захад түр зогсон амарна.","Аль болох хурдан гарахын тулд тогтоосон хурднаас өндөр хурдтай явна."],"a":"2","imgs":[],"t":"문장형","e":"Газар доорх зам (доогуур гарц) нь аюултай хүчин зүйл ихтэй тул гамшгийн мэдээллийг шалгах нь аюулгүй жолоодлогод тустай."},{"n":417,"b":"Өвлийн улирлын мөстэй замын талаар тайлбар юм Хамгийн зөв тайлбар аль нь вэ?","c":["Ихэвчлэн хонгил дотор үүсдэг бөгөөд манангийн жижиг дусал хөлдөж зам мөстдөг.","Гүүрэн дээр, хонгилын орох гарах үүд болон сүүдэртэй замд хар мөсөн (Black Ice) үзэгдэл байнга тохиолддог.","Хар мөсөн үзэгдэл нь автомашины утаанд бохирдсон цас зам дээр хуримтлагдан хөлдсөнөөс үүсдэг.","Мөстэй замаар гарахдаа жолооны хүрдийг хөдөлгөөнгүй барьж, огцом тоормослон аль болох хурд бууруулна."],"a":"2","imgs":[],"t":"문장형","e":"Хар мөс гэдэг нь нүдэнд сайн харагдахгүй нимгэн мөсөн хальс үүсэх үзэгдэл бөгөөд гүүрэн дээр, хонгилын орох, гарах хэсэг, сүүдэртэй замд байнга тохиолддог үзэгдэл юм."},{"n":418,"b":"Аадар борооны улмаас автомашин усанд автсан үед авах арга хэмжээний талаар хамгийн буруу нь аль вэ?","c":["Усны хүчтэй урсгал ирж буй талын эсрэг хаалгыг онгойлгон гарахыг оролдоно.","Хаалга онгойхгүй бол хурц зүйлээр (толгойн түшлэг, аюулгүйн бүсний түгжээ гэх мэт) цонхны шилний ирмэгийг хүчтэй цохиж хагалан гарна.","Цонхыг хагалж чадахгүй бол сандралгүйгээр 119-д дуудлага өгч, автомашины дотор ба гаднах усны түвшин ойролцоо болох үед (30 см-ээс ихгүй) хаалгаа хурдан онгойлгон гарна.","Гарч чадсан бол аль болох нам дор газар эсвэл автомашины доогуур хоргодоно."],"a":"4","imgs":[],"t":"문장형","e":"Дотоод хэрэг, аюулгүй байдлын яамны Иргэдийн гамшгийн аюулгүй байдлын портал, Иргэдийн үйл ажиллагааны заавар - Дугуйны 2/3 нь усанд автахаас өмнө автомашиныг аюулгүй газар руу шилжүүлж, усанд автсан тохиолдолд жолоочийн суудлын толгойн тулгуурын төмөр саваагаар шилийг хагалж гарч зугтах - Шилийг хагалж чадаагүй тохиолдолд автомашины дотор, гадна талын усны түвшний зөрүү 30 см ба түүнээс бага болтол хүлээж, хаалга онгойх тэр мөчид шуурхай гарах - Цагт 100 мм бороо орвол 100 метр ба түүнээс хол зайд байгаа тэмдгийг ялгах боломжгүй тул автомашиныг аюулгүй газар руу шилжүүлж, бороо намдтал түр хүлээх - Газар доорх замд ус хурж эхэлбэл огт орохгүй байх, орсон бол автомашиныг орхиж шуурхай гарах - Гүүрийг ус давж урсаж байвал огт орохгүй, тойрч явах эсвэл аюулгүй газар хүлээх - Автомашин усанд хүрээлэгдсэн тохиолдолд хурдан урсгалын эсрэг талын хаалгыг онгойлгох эсвэл цонхыг хагалж гарах ※ Автомашины шил тодорхой уян хатан чанартай тул хагалахын тулд дунд хэсгийг цохивол их хүч шаардагддаг учир булангийн хэсгийг цохих ёстой (Солонгосын Тээврийн аюулгүй байдлын газрын албан ёсны блогийн карт мэдээ) ※ Автомашин усанд автсан үед шуурхай гарсны дараа уснаас өндөр газар руу нүүлгэн шилжих эсвэл автомашины дээвэр дээр гарч аврахыг хүлээнэ. (Гал түймэртэй тэмцэх газрын албан ёсны блогийн карт мэдээ)"},{"n":419,"b":"Уруу замаар явж байх үед тоормос ажиллахгүй бол хамгийн зөв арга хэмжээ аль нь вэ?","c":["Шууд хөдөлгүүрээ унтраана.","Нам араанд шилжүүлээд автомашинаас үсэрч бууна.","Жолооны хүрдийг зигзаг хөдөлгөн хурдыг бууруулна.","Нам араанд шилжүүлэн хурдыг сааруулсны дараа автомашины их биеийг хамгаалалтын хашлага эсвэл хананд хүргэн мөргөнө."],"a":"4","imgs":[],"t":"문장형","e":"Тоормос гэмтэж ажиллахгүй болсон үед ард нь мөргөх осол эсвэл эсрэг урсгалын тээврийн хэрэгсэлтэй мөргөлдөх замаар том осол гарах магадлал өндөр. Тоормос гэмтсэн үед сандрахгүйгээр доод арааг залган хурдаа бууруулсны дараа автомашины их биеийг хамгаалалтын хашлага, хана зэрэгт шүргүүлж зогсох нь хоёрдогч ослоос сэргийлэх арга юм."},{"n":420,"b":"Хонгил дотор явж байх үед автомашины ослоос үүдэлтэй гал гарсныг харвал хамгийн зөв арга хэмжээ аль нь вэ?","c":["Хөдөлгөөн боломжтой байсан ч автомашинаа зогсоох нь аюулгүй.","Хөдөлгөөн боломжгүй бол автомашинаа зогсоож, дотор нь үлдэн галыг унтраахыг хүлээнэ.","Хөдөлгөөн боломжгүй бол автомашинаа зогсоож, түлхүүрээ авч гараад нүүнэ.","Автомашинаас буусны дараа утаа их байвал аль болох бөгтийж, утааны эсрэг чиглэлд чиглүүлэх гэрэл, тэмдэг даган явна."],"a":"4","imgs":[],"t":"문장형","e":"Хонгил дотор явж байхдаа автомашины осол зэргээс үүдсэн гал түймэр харсан үед зөв хариу үйлдэл хийх арга ① Тээврийн хэрэгслийн хөдөлгөөн боломжтой бол хонгилоос шуурхай гарна. ② Гал гарсан ч харагдах орчин хангагдаж, хөдөлгөөн боломжтой бол автомашиныг тэр чигээр нь гадагш гаргана. ③ Харагдах орчин хангагдахгүй, тээврийн хэрэгсэл түгжирсэн эсвэл явах боломжгүй үед яаралтай зогсоол эсвэл замын захад автомашинаа зогсооно. Хөдөлгүүрийг унтрааж, түлхүүрийг хэвээр нь үлдээгээд автомашинаас бууна. Гар утас эсвэл хонгил доторх яаралтай утсаар 119 зэрэгт мэдэгдэж, гэмтсэн хүн байвал үзнэ. Утаа их гарч байвал биеэ аль болох намхан байлгаж, утаа гарч буй чиглэлийн эсрэг зүг рүү хонгил доторх чиглүүлэх гэрлэн тэмдгийг дагаж явна."},{"n":421,"b":"Эргэлттэй замаар явж байх үеийн талаар зөв тайлбар аль нь вэ?","c":["Эргэлтэд орохоос өмнөх хурдаа хадгалан тогтмол хурдтайгаар гарна.","Эргэлтэд орсны дараа арааны харьцааг өсгөж төвөөс зугтах хүчийг бууруулах нь зүйтэй.","Эргэлттэй замд хойд дугуйн хөтлөгчтэй автомашинд андерстир (understeer) үзэгдэл үүсч болно.","Эргэлттэй замд оверстир (oversteer) үзэгдлийг багасгахын тулд жолооны хүрдийг эргэж буй чиглэлийн эсрэг бага багаар эргүүлнэ."],"a":"4","imgs":[],"t":"문장형","e":"① Муруй замд орохын өмнөх хурдаараа тогтмол хурдтай явбал замаас гарах аюултай. ② Муруй замд орсны дараа арааны харьцааг бууруулж байж төвөөс зугтах хүчийг багасгана. ③ Муруй замд урд дугуйн хөтлөгчтэй автомашинд урд дугуй гадагш гулсах (understeer) үзэгдэл үүсэж болно. ④ Муруй замд хойд дугуй гадагш гулсах үзэгдлийг багасгахын тулд эргэх чиглэлийн эсрэг зүг рүү жолоог эргүүлж автомашины тэнцвэрийг барих эсрэг жолоодлогын аргыг хэрэглэх ёстой."},{"n":422,"b":"Хөлийн тоормосыг хэт их хэрэглэсний улмаас үрэлтийн халуун үүсэж, тоормосны шингэнд хий үүссэнээс тоормос ажиллахгүй болох үзэгдлийг юу гэдэг вэ?","c":["Дугуйн долгион үүсэх үзэгдэл (Standing wave)","Уурын түгжээ үүсэх үзэгдэл (Vapor lock)","Замтай барьцалдах чадвар (Road holding)","Дутуу эргэх үзэгдэл (Under steering)"],"a":"2","imgs":[],"t":"문장형","e":"Хөлийн тоормосыг хэт их ашигласнаас үүссэн үрэлтийн халуунаас болж тоормосны шингэнд хийн бөмбөлөг үүсч, тоормос ажиллахгүй болох үзэгдлийг уурын түгжрэл (Vapor lock) гэнэ."},{"n":423,"b":"Манантай замд жолоодох үед аюулгүй жолоодлогын талаар буруу нь аль вэ?","c":["Эргэлттэй зам, өгсүүр зэрэгт дуут дохио хэрэглэнэ.","Урд харагдах орчин ойролцоогоор 70 метр байвал тогтоосон хурдны хагасаас ихгүй хурдтай явна.","Ердийн үеэс урд харагдах орчин муу тул манангийн гэрэл болон холын тусгалтай урд гэрлийг хамтад нь асааж хангалттай харагдах орчин бүрдүүлнэ.","Автомашин эвдэрсэн эсвэл хөнгөн мөргөлдөөн болсон ч замын зах руу аль болох хурдан шилжинэ."],"a":"3","imgs":[],"t":"문장형","e":"Холын гэрэл асаавал манан доторх усны жижиг хэсгүүд гэрлийг хугалж, сарниулснаар эсрэг урсгалын жолоочийн харагдах орчинд саад учруулж болзошгүй тул манангийн гэрэл болон ойрын гэрлийг хэвээр байлгах нь илүү сайн арга юм."},{"n":424,"b":"Өвлийн улирлын хар мөс (black ice)-ийн талаар буруу тайлбар аль нь вэ?","c":["Замын гадаргуу дээр нимгэн мөсөн бүрхүүл үүссэн үзэгдэл юм.","Асфальтан замын цас, чийг агаар дахь бохирдуулагчтай холилдон замд шингэсний дараа харлан хөлдсөн үзэгдэл юм.","Хүйтэн өвөл гүүрэн дээр, хонгилын орох гарах үүд, сүүдэртэй зам, уулын сүүдэртэй эргэлт зэрэг температур бага газарт ихэвчлэн үүсдэг.","Нар сайн тусдаг зам дээр хайлсан цас шингэсний дараа замын хар өнгө нарны гэрэлд ойж гялалзах үзэгдлийг хэлнэ."],"a":"4","imgs":[],"t":"문장형","e":"Замын гадаргуу мөстөх үзэгдлийн нэг бөгөөд хар мөс (black ice) эсвэл тунгалаг мөс (Clear ice) гэж нэрлэдэг, замын гадаргуу дээр бүрсэн мэт нимгэн мөсөн хальс үүсэх үзэгдлийг хэлнэ. Асфальтын завсраар цас, чийг агаар дахь утаа, тоостой холилдон нэвчсэний дараа хар өнгөтэй хөлдөх үзэгдлийг багтаана. Хүйтэн өвөл гүүрэн дээр, хонгилын орох, гарах хэсэг, сүүдэртэй зам, уулын тохойн сүүдэр зэрэг сүүдэртэй, температур бага замд голчлон үүсдэг. Нүдээр амархан ялгагдахгүй тул ослын аюул маш өндөр."},{"n":425,"b":"Дараахын аль нь өвлийн улирлын замын мөстөлтийн талаар буруу тайлбар вэ?","c":["Асфальтан замаас илүү бетон хучилттай зам мөстөх нь их байдаг.","Бетон замаас илүү асфальтан замын мөс оройтож хайлдаг.","Асфальтан замын үрэлтийн коэффициент хуурай замын үед 1.6 хүртэл өндөр байдаг.","Ижил нөхцөлтэй мөстсөн үед бетон болон асфальтан замын гадаргуугийн үрэлтийн коэффициент ижил байдаг."],"a":"3","imgs":[],"t":"문장형","e":"① Асфальтаас илүү бетонон хучилттай зам илүү их мөстдөг. ② Бетоноос илүү асфальтан хучилттай замын мөс илүү удаан хайлдаг. ③, ④ Ижил нөхцөлийн мөстсөн байдалд бетонон болон асфальтан хучилттай замын гадаргуугийн үрэлтийн коэффициент 0.3 болж, хуурай замын гадаргуугийн үрэлтийн коэффициентоос хоёр дахин ба түүнээс бага болж буурдаг."},{"n":426,"b":"Дараахын аль нь газар хөдлөлт болсон үед жолоочийн авах арга хэмжээний хувьд хамгийн зохимжгүй вэ?","c":["Жолоодож явсан автомашины хурдыг нэмэгдүүлж тухайн бүсийг аль болох хурдан нэвтэрнэ.","Автомашинаар шилжин явах боломжгүй бол автомашинаа замын захад зогсоолд тавиад нүүнэ.","Зогсоолд тавьсан автомашиныг шаардлагатай үед шилжүүлэх боломжтой байлгахын тулд түлхүүрийг нь залгаатай орхиод нүүнэ.","Радиогоо асааж, гамшгийн мэдээг анхааралтай сонсоно."],"a":"1","imgs":[],"t":"문장형","e":"Газар хөдлөлт болоход хамгийн түрүүнд радио асааж гамшгийн нэвтрүүлэгт анхаарлаа төвлөрүүлж, түргэн тусламж, цагдаагийн машин замыг түрүүлж ашиглах боломжтой байхаар замын төв хэсгийг чөлөөлөхийн тулд жолоодож явсан автомашинаа замын баруун захад наан зогсоож, зогсоосон автомашиныг шилжүүлэх тохиолдолд бэлтгэн автомашины түлхүүрийг хэвээр нь үлдээж, хамгийн бага ачаагаа аваад автомашиныг замын захад зогсоосны дараа нүүлгэн шилжинэ. <Дотоод хэрэг, аюулгүй байдлын яамны газар хөдлөлтийн үед нүүлгэн шилжүүлэх заавар>"},{"n":427,"b":"Дараахын аль нь хүчтэй салхи эсвэл гэнэтийн салхитай үед хамгийн зөв жолоодох арга 2 вэ?","c":["Жолооны хүрдийг хоёр гараараа чанга барьж, эгнээгээ хадгална.","Салхинаас үл хамааран хурдыг нэмэгдүүлнэ.","Замын тэмдэг, гэрлэн дохио, модны ойролцоо автомашинаа зогсоолд тавина.","Уулархаг бүс, гүүрэн дээр, хонгилын орох гарах үүдэнд хүчтэй салхины эрсдэл их байдаг тул анхаарна."],"a":"1, 4","imgs":[],"t":"문장형","e":"хүчтэй салхи, гэнэ
