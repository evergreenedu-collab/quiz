г зөрчих, аюулгүй зай барихгүй байх, эгнээ солихыг хориглосныг зөрчих, огцом тоормослохыг хориглосныг зөрчих, гүйцэж түрүүлэх арга эсвэл гүйцэж түрүүлэхэд саад учруулахыг хориглосныг зөрчих, хууль ёсны шалтгаангүй дуу чимээ гаргах, хурдны зам дээр гүйцэж түрүүлэх арга зөрчих, хурдны зам зэрэг дээр хөндлөн гарах, буцаж эргэх, ухрахыг хориглох"},{"n":149,"b":"Автомашины (хувийн хөдөлгөөнт хэрэгслээс бусад) жолооч дараах үйлдлийг давтан хийж бусдад заналхийлсэн тохиолдолд аюултай, түрэмгий жолоодлогоор шийтгүүлнэ. Аюултай, түрэмгий жолоодлогын үйлдлийн талаар буруу нь аль вэ?","c":["Гэрлэн дохио болон заавар зөрчих, төвийн шугам давах","Аюулгүй зай бариагүй, огцом тоормослохыг хориглосон дүрэм зөрчих","Гүйцэж түрүүлэхэд саад учруулахыг хориглосон дүрэм зөрчих, гүйцэж түрүүлэх аргыг зөрчих","Нэвтрэхийг хориглосон замаар зорчих, жолоо барьж байхдаа гар утас ашиглах"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 46-3 дугаар зүйл (Бүдүүлэг жолоодлогыг хориглох): Дохио эсвэл заавар зөрчих, төвийн шугам давах, хурд зөрчих, хөндлөн гарах, буцаж эргэх, ухрахыг хориглосныг зөрчих, аюулгүй зай барихгүй байх, эгнээ солихыг хориглосныг зөрчих, огцом тоормослохыг хориглосныг зөрчих, гүйцэж түрүүлэх арга эсвэл гүйцэж түрүүлэхэд саад учруулахыг хориглосныг зөрчих, хууль ёсны шалтгаангүй дуу чимээ гаргах, хурдны зам дээр гүйцэж түрүүлэх арга зөрчих, хурдны зам зэрэг дээр хөндлөн гарах, буцаж эргэх, ухрахыг хориглох"},{"n":150,"b":"Дараах үйлдлийг давтан хийсний улмаас замын хөдөлгөөнд аюул учруулсан тохиолдолд аюултай, түрэмгий жолоодлогоор шийтгүүлж болох нь аль вэ?","c":["Хурдны замын захад зогсох, түр зогсох","Согтуугаар жолоо барих","Ердийн замын тусгай зориулалтын эгнээний дүрэм зөрчих","Төвийн шугам давах"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 46-3 дугаар зүйл (Бүдүүлэг жолоодлогыг хориглох): Дохио эсвэл заавар зөрчих, төвийн шугам давах, хурдны хязгаар зөрчих, хөндлөн гарах, буцаж эргэх, ухрахыг хориглосныг зөрчих, аюулгүй зай барихгүй байх, эгнээ солихыг хориглосныг зөрчих, огцом тоормослохыг хориглосныг зөрчих, гүйцэж түрүүлэх арга эсвэл гүйцэж түрүүлэхэд саад учруулахыг хориглосныг зөрчих, хууль ёсны шалтгаангүй дуу чимээ гаргах, хурдны зам дээр гүйцэж түрүүлэх арга зөрчих, хурдны зам зэрэг дээр хөндлөн гарах, буцаж эргэх, ухрахыг хориглох"},{"n":151,"b":"Дараах үйлдлүүдийг давтан хийсний улмаас замын хөдөлгөөний аюул үүссэн тохиолдолд, аль нь аюултай, түрэмгий жолоодлого гэж шийтгэж болохгүй нь аль вэ?","c":["Гэрлэн дохио зөрчих","Хурдны хязгаар зөрчих","Техникийн бүрэн бус тээврийн хэрэгсэл жолоодохыг хориглосон журмыг зөрчих","Эгнээ солихыг хориглосон журмыг зөрчих"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 46 дугаар зүйлийн 3 (Бүдүүлэг жолоодлогыг хориглох)"},{"n":152,"b":"Автомашин ашиглан эрүүгийн хуулийн дагуу аюултай эд зүйл ашиглан бусдад гэмтэл учруулах гэмт хэрэг үйлдэж (хариу үйлдлийн жолоодлого) баривчлагдсан. Жолоодох эрхийн үнэмлэхэд авах захиргааны арга хэмжээ аль нь вэ?","c":["Жолоодох эрхийг хүчингүй болгох","Жолоодох эрхийг 100 хоногоор түдгэлзүүлэх","Жолоодох эрхийг 60 хоногоор түдгэлзүүлэх","Арга хэмжээ авах боломжгүй"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28: Автомашин зэргийг ашиглан Эрүүгийн хуулийн тусгай гэмтэл учруулах, тусгай заналхийлэл, тусгай эд хөрөнгө эвдэх гэмт хэрэг үйлдэж цагдан хоригдсон үед жолоодох эрхийг хүчингүй болгоно. Эрүүгийн хэрэг үүсгэгдсэн үед 100 торгуулийн оноо ногдуулна."},{"n":153,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зам дээр 2 ба түүнээс их хүн 2 ба түүнээс их автомашин (хувийн хөдөлгөөнт хэрэгслийг оруулахгүй)-аар үндэслэлгүйгээр урд хойноо эсвэл зэрэгцэн явж, бусдад хохирол учруулах буюу замын хөдөлгөөний аюул үүсгэх үйлдлийг юу гэж нэрлэх вэ?","c":["Хамтын аюултай үйлдэл","Уулзвар руу дайран орох үйлдэл","Дундуур дайран орох үйлдэл","Журам зөрчсөн үйлдэл"],"a":"1","imgs":[],"t":"문장형","e":"46 дугаар зүйл (Хамтарсан аюултай үйлдлийг хориглох)-ийн 1 дэх хэсэг: Автомашин зэргийн жолооч зам дээр 2 ба түүнээс дээш хүн хамтран 2 ба түүнээс дээш автомашин зэргийг хууль ёсны шалтгаангүйгээр урд хойно эсвэл зүүн баруун талд эгнүүлэн явуулж бусдад хор хохирол учруулах эсвэл замын хөдөлгөөний аюул үүсгэж болохгүй."},{"n":154,"b":"Дараах жолооч нарын аль нь замын хөдөлгөөний тухай хуулийн дагуу аюултай, түрэмгий жолоодлогод хамаарахгүй вэ?","c":["Огцом тоормослолтыг давтан хийж замын хөдөлгөөний аюул үүсгэдэг жолооч","Аюулгүй зайг байнга баримтлаагүйгээс бусдад заналхийлэл учруулдаг жолооч","Хурдны зам дээр гүйцэж түрүүлэх журмыг байнга зөрчиж замын хөдөлгөөний аюул үүсгэдэг жолооч","Шөнийн цагаар хурдны замын захад гэрлээ унтраан зогсож бусдад аюул учруулдаг жолооч"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 46-3 дугаар зүйл"},{"n":155,"b":"Дараах жолоочийн зөв дадал зуршлаас аль нь хамгийн зохимжгүй вэ?","c":["Түлш цэнэглэх үед хөдөлгүүрийг унтраадаг.","Онцгой нөхцөлөөс бусад үед огцом тоормослож, арын машиныг мөн огцом тоормослоход хүргэдэггүй.","Аюултай нөхцөлийг урьдчилан таамаглаж хамгаалалтын жолоодлого хийхийн тулд зөвшөөрөгдсөн хурд болон аюулгүй зайг хоёуланг нь мөрдөн жолооддог.","Дугуйн агаарын даралтыг улирлаас үл хамааран жолоодлогын тогтвортой байдлын үүднээс зохих хэмжээнээс 10%-иар өндөр байлгадаг."],"a":"4","imgs":[],"t":"문장형","e":"Дугуйны хийн даралт нь дээд даралтын 80% байх нь зохистой бөгөөд улирлаас хамаарч зун 10% орчим бага, өвөл 10% орчим их хийлэх нь аюулгүй байдалд тустай."},{"n":156,"b":"Автомашин ашиглан эрүүгийн хуулийн дагуу аюултай эд зүйл ашиглан бусдын биед халдах гэмт хэрэг үйлдэж (хариу үйлдлийн жолоодлого) эрүүгийн хэрэг үүсгэгдсэн. Жолоодох эрхийн үнэмлэхэд авах захиргааны арга хэмжээ аль нь вэ?","c":["Жолоодох эрхийг хүчингүй болгох","Жолоодох эрхийг 100 хоногоор түдгэлзүүлэх","Жолоодох эрхийг 60 хоногоор түдгэлзүүлэх","Захиргааны арга хэмжээ байхгүй"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 28: Автомашин зэргийг ашиглан Эрүүгийн хуулийн тусгай гэмтэл учруулах, тусгай заналхийлэл, тусгай эд хөрөнгө эвдэх гэмт хэрэг үйлдэж цагдан хоригдсон үед жолоодох эрхийг хүчингүй болгоно. Эрүүгийн хэрэг үүсгэгдсэн үед 100 торгуулийн оноо ногдуулна."},{"n":157,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган зорчигчийн тухай тайлбараас аль нь буруу вэ?","c":["Өргөн нь 1 метр ба түүнээс бага, хөдөлгүүргүй гар тэргээр зорчиж байгаа хүн явган зорчигч биш.","Өргөн нь 1 метр ба түүнээс бага явган зорчигчид зориулсан сандалтай туслах хэрэгсэл ашиглан зорчиж байгаа хүн явган зорчигч мөн.","Унадаг дугуй унаж байгаа хүн явган зорчигч биш.","Өргөн нь 1 метр ба түүнээс бага ахмад настан болон хөгжлийн бэрхшээлтэй хүмүүст зориулсан алхуулагч ашиглан зорчиж байгаа хүн явган зорчигч мөн."],"a":"1","imgs":[],"t":"문장형","e":"«Явган хүний зам» гэж хашлагын шугам, аюулгүйн тэмдэглэгээ эсвэл түүнтэй төстэй хиймэл байгууламжаар хил хязгаарыг нь тэмдэглэж явган зорчигч (хүүхдийн тэрэг, явган хүний туслах сандалтай тэргэнцэр, ахмад болон сул дорой хүний алхуулагч зэрэг Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон хэрэгсэл, төхөөрөмж ашиглан зорчиж буй хүн болон 21 дэх заалтын 3-т заасан гадна орчинд хөдөлдөг роботыг оролцуулна. Цаашид мөн адил) зорчих боломжтой болгосон замын хэсгийг хэлнэ. (Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 10 дахь заалт) Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон хэрэгсэл, төхөөрөмж гэж өргөн нь 1 метрээс ихгүй: хүүхдийн тэрэг, явган хүний туслах сандалтай тэргэнцэр, ахмад болон сул дорой хүний алхуулагч, хүүхдийн тоглоомын хэрэгсэл, хөдөлгүүргүй гар тэрэг, жолооч нь бууж түлхэж эсвэл өргөж явж буй хоёр дугуйт тээврийн хэрэгсэл зэрэг, замын засвар, арчлалт зэрэгт ашиглах хэрэгсэл болон 21 дэх заалтын 3-т заасан гадна орчинд хөдөлдөг робот зэрэг (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 2 дугаар зүйл)"},{"n":158,"b":"Автомашинаар үйлчлэх цэг (Drive-through үйлчилгээ) ашиглаж буй жолоочийн зөв үйлдлээс хамгийн буруу нь аль вэ?","c":["Автомашинаар үйлчлэх цэгийн ажилтны аюулгүй ажиллагаатай холбоотой зааврыг дагана.","Автомашинаар үйлчлэх цэгт байрлуулсан заавар тэмдгийг мөрдөнө.","Автомашинаар үйлчлэх цэгийн очер дараалалд зогсож байхдаа явган хүний гарцыг хаан зогсоно.","Автомашинаар үйлчлэх цэгийн орох гарах газрын аюулгүйн байгууламжид анхааран хөдөлнө."],"a":"3","imgs":[],"t":"문장형","e":"Автомашинаас буулгүй үйлчлүүлэх дэлгүүр нь сүүлийн үед нийгмийн замын хөдөлгөөний асуудал болж байна. Эдгээрийн дараалал нь түгжрэлд нөлөөлөөд зогсохгүй замын хөдөлгөөний аюулгүй байдалд заналхийлж байна. Автомашинаас буулгүй үйлчлүүлэх дэлгүүрийн дараалал байсан ч явган хүний гарц руу орж зогсож болохгүй."},{"n":159,"b":"Замын хөдөлгөөний тухай хуулийн дагуу жолоочийн явган зорчигчийг хамгаалах үүргийн талаар аль нь буруу вэ?","c":["Явган зорчигч түрүүлж зорчих зам дээр жолооч удаан явах буюу түр зогсох үүргээ биелүүлээгүйгээс явган зорчигчийн хөдөлгөөнд саад учруулсан бол зөрчлийн торгууль ногдуулна.","Зам биш газарт жолоодож байгаа жолоочид ч явган зорчигчийг хамгаалах үүрэг ногдоно.","Явган зорчигч явган хүний гарцаар гарах гэж байгаа үед жолооч тухайн гарцын өмнө түр зогсох ёстой.","Жолооч хүүхдийн хамгаалалтын бүс дэх гэрлэн дохиогүй явган хүний гарцын өмнө заавал удаан явах ёстой."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 1 дэх хэсэг, 6 дахь хэсгийн 2 дахь, 3 дахь заалт, 7 дахь хэсэг; Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8-ын 11 дэх заалт: Суудлын автомашин зэргийн зөрчлийн торгуулийн хэмжээ 60,000 вон. Жолооч хүүхдийн хамгаалалтын бүс доторх гэрлэн дохио суурилуулаагүй явган хүний гарцын өмнө явган зорчигч хөндлөн гарч байгаа эсэхээс үл хамааран түр зогсох ёстой."},{"n":160,"b":"Жолоочийн явган зорчигчийг хамгаалах үүргийн талаар аль нь буруу вэ?","c":["Жолооч явган зорчигч явган хүний гарцаар гарах гэж байгаа үед тухайн гарцын өмнө түр зогсох ёстой.","Жолооч эгнээ тэмдэглээгүй нарийн зам дээр явган зорчигчийн хажуугаар өнгөрөхдөө аюулгүй зай барин удаан явах ёстой.","Жолооч хүүхдийн хамгаалалтын бүсэд байрлах гэрлэн дохиогүй явган хүний гарцын өмнө явган зорчигч гарахгүй бол түр зогсох шаардлагагүй.","Жолооч замын хөдөлгөөнийг зохицуулаагүй уулзварыг явган зорчигч хөндлөн гарч байх үед түүний хөдөлгөөнд саад учруулж болохгүй."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 1 дэх хэсэг, 3 дахь хэсэг, 4 дэх хэсэг, 7 дахь хэсэг ① Бүх тээврийн хэрэгсэл буюу трамвайн жолооч явган зорчигч (13-2 дугаар зүйл-ын 6 дахь хэсгийн дагуу унадаг дугуй зэргээсээ бууж түлхэж эсвэл өргөж явж буй унадаг дугуй зэргийн жолоочийг оролцуулна) явган хүний гарцаар гарч байгаа эсвэл гарах гэж байгаа үед явган зорчигчийн хөндлөн гарахад саад болохгүй, аюул учруулахгүйн тулд уг явган хүний гарцын өмнө (зогсох шугам байрлуулсан газарт уг зогсох шугамыг хэлнэ) түр зогсох ёстой. ③ Бүх тээврийн хэрэгслийн жолооч замын хөдөлгөөний зохицуулалтгүй уулзвар эсвэл түүний ойролцоох замыг хөндлөн гарч буй явган зорчигчийн хөдөлгөөнд саад учруулж болохгүй. ④ Бүх тээврийн хэрэгслийн жолооч замд байгуулсан аюулгүйн бүсэд явган зорчигч байгаа тохиолдолд болон эгнээ тэмдэглээгүй нарийн замд явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явах ёстой. ⑦ Бүх тээврийн хэрэгсэл буюу трамвайн жолооч 12 дугаар зүйлийн 1 дэх хэсэгт заасан хүүхдийн хамгаалалтын бүс дотор байгуулсан явган хүний гарцаас гэрлэн дохио суурилуулаагүй явган хүний гарцын өмнө (зогсох шугам байрлуулсан бол уг зогсох шугамыг хэлнэ) явган зорчигч хөндлөн гарч байгаа эсэхээс үл хамааран түр зогсох ёстой. <2022. 1. 11-нд шинээр нэмэгдсэн>"},{"n":161,"b":"Явган зорчигч түрүүлж зорчих замын талаар аль тайлбар хамгийн буруу вэ?","c":["Явган зорчигч түрүүлж зорчих зам дээр явган зорчигч зөвхөн замын баруун захаар явж болно.","Жолоочид удаан явах, түр зогсох зэрэг явган зорчигчийг хамгаалах төрөл бүрийн үүрэг ногдоно.","Явган зорчигчийг хамгаалах үүргээ биелүүлээгүй бол суудлын автомашины хувьд 40,000 воны зөрчлийн торгууль, 10 онооны шийтгэл ногдуулна.","Цагдаагийн газрын дарга шаардлагатай гэж үзвэл явган зорчигчийг хамгаалах зорилгоор тээврийн хэрэгслийн хурдыг 20 км/цаг хүртэл хязгаарлаж болно."],"a":"1","imgs":[],"t":"문장형","e":"Явган зорчигч явган зорчигчийн давуу эрхтэй зам дээр замын бүх хэсгээр зорчиж болно. Энэ тохиолдолд явган зорчигч тээврийн хэрэгслийн хөдөлгөөнд санаатайгаар саад учруулж болохгүй (Замын хөдөлгөөний тухай хуулийн 8 дугаар зүйлийн 3 дахь хэсгийн 1 дэх заалт). Явган зорчигчийн зориулалтын замаар зорчихыг зөвшөөрсөн тээврийн хэрэгслийн жолооч явган зорчигчид аюул учруулахгүй, зорчиход нь саад болохгүйн тулд тээврийн хэрэгслийг явган хүний алхах хурдаар явуулах эсвэл түр зогсох ёстой (Замын хөдөлгөөний тухай хуулийн 28 дугаар зүйлийн 3 дахь хэсэг). Аймаг, нийслэлийн Цагдаагийн газрын дарга эсвэл цагдаагийн хэлтсийн дарга явган зорчигчийн давуу эрхтэй зам дээр явган зорчигчийг хамгаалахад шаардлагатай гэж үзвэл тээврийн хэрэгслийн зорчих хурдыг цагт 20 километрээс ихгүй байхаар хязгаарлаж болно (Замын хөдөлгөөний тухай хуулийн 28-2 дугаар зүйл)."},{"n":162,"b":"Хотын замаар цагт 50 км хурдтай явж байхдаа зөвшөөрөлгүйгээр зам хөндлөн гарч буй явган зорчигчийг олж харлаа. Хамгийн зөв арга хэмжээ аль нь вэ?","c":["Явган зорчигч гарч байгаа тул шууд огцом тоормослон зогсоно.","Явган зорчигчийн хөдөлгөөнийг таамаглан завсраар нь өнгөрнө.","Хурдаа сааруулж, зогсоход бэлэн байж, аюулын дохионы гэрлээ асаан арын автомашинд анхааруулж, аюулгүйгээр зогсоно.","Дуут дохио өгч анхааруулаад бага зэрэг хурдаа нэмэн өнгөрнө."],"a":"3","imgs":[],"t":"문장형","e":"Зөвшөөрөгдөөгүй газраар замыг хөндлөн гарч буй явган зорчигчийг илрүүлбэл хурдаа бууруулж зогсоход бэлтгэн, ослын дохиогоор ард явж буй тээврийн хэрэгсэлд ч мэдэгдэж аюулгүйгээр зогсоно."},{"n":163,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган зорчигчийг хамгаалах тухай тайлбараас аль нь буруу вэ?","c":["Зам дээрх аюулгүйн бүс дээр явган зорчигч байгаа үед болон эгнээ тэмдэглээгүй нарийн замд явган зорчигчийн хажуугаар өнгөрөхдөө аюулгүй зай барин удаан явах ёстой.","Явган хүний гарцгүй замаар явган зорчигч гарч байгаа үед аюулгүй зай барин түр зогсож, аюулгүй гарахад нь боломж олгох ёстой.","Явган хүний зам, зорчих хэсэг тусгаарлагдаагүй бөгөөд төв шугамгүй зам дээр явган зорчигчийн хөдөлгөөнд саад болох нөхц өлд удаан явах эсвэл түр зогсож аюулгүй зорчих боломж олгох ёстой.","Хүүхдийн хамгаалалтын бүсэд байрлах гэрлэн дохиогүй явган хүний гарцын өмнө (зогсох шугамтай бол тухайн шугамын өмнө) явган зорчигч гарч байгаа эсэхээс үл хамааран удаан явах ёстой."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах)-ийн 7 дахь хэсэг: Бүх тээврийн хэрэгсэл буюу трамвайн жолооч 12 дугаар зүйлийн 1 дэх хэсэгт заасан хүүхдийн хамгаалалтын бүс дотор байгуулсан явган хүний гарцаас гэрлэн дохио суурилуулаагүй явган хүний гарцын өмнө (зогсох шугам байрлуулсан бол уг зогсох шугамыг хэлнэ) явган зорчигч хөндлөн гарч байгаа эсэхээс үл хамааран түр зогсох ёстой."},{"n":164,"b":"Замын хөдөлгөөний тухай хуулийн дагуу зам дээр 13-аас доош насны хүүхэд ( )-ээр зорчих үед хүүхдийн аюулгүй байдлыг хангах зорилгоор хамгаалах хэрэгслийг заавал өмсөнө. ( )-д хамаарахгүй нь аль вэ?","c":["Кик скүүтер","Нэг дугуйт унадаг дугуй","Дугуйтай ролик","Скейтборд"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 11 дүгээр зүйл (Хүүхэд зэргийг хамгаалах)-ийн 3 дахь хэсэг: Хүүхдийн асран хамгаалагч зам дээр хүүхэд унадаг дугуй унах эсвэл Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон аюул ихтэй хөдөлгөөнт тоглоомын хэрэгсэл унах тохиолдолд хүүхдийн аюулгүй байдлын үүднээс Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон хүний амь насыг хамгаалах хэрэгсэл зүүлгэх ёстой. Унадаг дугуйн хэрэглээг дэмжих тухай хууль: «Унадаг дугуй» гэж хүний хүчээр дөрөө эсвэл гар дөрөө ашиглан хөдөлдөг хөтлөх төхөөрөмж, жолооны механизм болон тоормосны төхөөрөмжтэй, хоёр ба түүнээс дээш дугуйтай тээврийн хэрэгсэл бөгөөд Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон хэмжээ, бүтэцтэйг хэлнэ."},{"n":165,"b":"Явган зорчигчийг хамгаалах үүргийн талаар зөв тайлбар аль нь вэ?","c":["Зөвшөөрөлгүйгээр зам хөндлөн гарч буй согтуу явган зорчигчийг хамгаалах шаардлагагүй.","Гэрлэн дохиотой зам дээр зам гарч буй явган зорчигчийн хөдөлгөөнд саад учруулж болно.","Явган зорчигчийн гэрлэн дохио ногоон өнгөөр анивчиж байгаа үед автомашин явж болно.","Гэрлэн дохиотой уулзварт баруун эргэх үед дохионы дагуу гарч буй явган зорчигчийн хөдөлгөөнд саад учруулж болохгүй."],"a":"4","imgs":[],"t":"문장형","e":"Зөвшөөрөгдөөгүй газраар хөндлөн гарч буй согтуу явган зорчигч ч хамгаалах хамрах хүрээнд ордог. Явган зорчигчийн гэрлэн дохионы ногоон гэрэл анивчиж байгаа үед ч явган зорчигчийг хамгаалахаа умартаж болохгүй бөгөөд гэрлэн дохиотой уулзварт баруун эргэх тохиолдолд дохионы дагуу явж буй явган зорчигчид саад учруулж болохгүй."},{"n":166,"b":"Замын голоор зорчих эрхтэй хүн эсвэл жагсаал аль нь вэ?","c":["Нийгмийн ач холбогдолтой арга хэмжээний хүрээнд жагсаал хийж буй цуваа","Морь, үхэр зэрэг том амьтан тууж яваа хүн","Зам цэвэрлэх, засварлах зэрэг зам дээр ажиллаж байгаа хүн","Туг эсвэл самбар зэргийг барьсан оршуулгын цуваа"],"a":"1","imgs":[],"t":"문장형","e":"Том амьтан туугаад явж буй хүн, шат, мод болон бусад явган зорчигчийн хөдөлгөөнд саад учруулж болзошгүй эд зүйл зөөж буй хүн, зам дээр цэвэрлэгээ, засвар зэрэг ажил хийж буй хүн, цэргийн анги эсвэл түүнтэй адилтгах байгууллагын жагсаал, туг эсвэл уриа самбар зэрэг барьсан жагсаал, оршуулгын жагсаал нь зорчих хэсгийн баруун талаар явах ёстой. (Замын хөдөлгөөний тухай хуулийн 9 дүгээр зүйл болон мөн хуулийг хэрэгжүүлэх журмын 7 дугаар зүйл)"},{"n":167,"b":"Автомашины жолооч гэрлэн дохиогүй явган хүний гарцаар нэвтрэх үед хамгийн аюулгүй жолоодох арга аль нь вэ?","c":["Явган зорчигч байхгүй байсан ч урд болон орчны нөхцөлөө сайтар ажиглан хурдаа сааруулна.","Явган зорчигч байхгүй тул шууд явна.","Явган зорчигч байхгүй үед хурдан өнгөрнө.","Явган зорчигч байж болзошгүй тул дуут дохио өгөөд шууд явна."],"a":"1","imgs":[],"t":"문장형","e":"Гэрлэн дохиогүй явган хүний гарцад байж болзошгүй явган зорчигчийн төлөө урд болон ойролцоох явган хүний замыг сайтар ажиглаж хурдаа бууруулан жолоодох ёстой."},{"n":168,"b":"Төмөр замын гарам нэвтрэх үед эвдэрч, гарам дотор автомашинаа хөдөлгөх боломжгүй болсон бол жолоочийн авах арга хэмжээнээс аль нь буруу вэ?","c":["Зорчигчдыг нэн даруй аюулгүй газар гаргана.","Яаралтай дохионы хэрэгсэл ашиглана.","Төмөр замын ажилтанд мэдэгдэнэ.","Автомашины эвдрэлийн шалтгааныг яаралтай шалгана."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 24 дүгээр зүйл (Төмөр замын гарам өнгөрөх): Бүх тээврийн хэрэгсэл буюу трамвайн жолооч гарам өнгөрч яваад эвдрэл зэрэг шалтгаанаар гарам дотор тээврийн хэрэгсэл буюу трамвайг ажиллуулах боломжгүй болсон тохиолдолд нэн даруй зорчигчдыг нүүлгэн шилжүүлж, ослын дохиолол зэргийг ашиглах эсвэл бусад аргаар төмөр замын албан хаагч буюу цагдаагийн алба хаагчид уг нөхцөл байдлыг мэдэгдэх ёстой."},{"n":169,"b":"Автомашины жолооч явган хүний замыг хөндлөн гарч барилга руу орох гэж байна. Жолоочийн хийх зөв дараалал аль нь вэ?","c":["Удаан явах → Чиг заах дохио өгөх → Шуурхай нэвтрэх","Түр зогсох → Дуут дохио өгөх → Шуурхай нэвтрэх","Удаан явах → Зүүн болон баруун талыг шалгах → Удаан нэвтрэх","Түр зогсох → Зүүн болон баруун талыг шалгах → Удаан нэвтрэх"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйл (Тээврийн хэрэгслийн зорчих)-ийн 2 дахь хэсэг: Тээврийн хэрэгслийн жолооч явган хүний замыг хөндлөн гарахын өмнө түр зогсож зүүн, баруун хэсэг зэргийг ажигласны дараа явган зорчигчийн хөдөлгөөнд саад учруулахгүйгээр хөндлөн гарах ёстой."},{"n":170,"b":"Дараах зүйлсээс замын хөдөлгөөний тухай хуулийн дагуу явган зорчигч зам хөндлөн гарах аргын талаар аль тайлбар буруу вэ?","c":["Ямар ч тээврийн хэрэгслийн яг урд эсвэл яг ар талаар зам хөндлөн гарч болохгүй.","Хөдөлгөөний бэрхшээлтэй хүн байсан ч заавал зам хөндлөн гарах байгууламжаар дамжин зам хөндлөн гарах ёстой.","Аюулгүйн тэмдэглэгээ зэргээр зам хөндлөн гарахыг хориглосон замын хэсгээр зам хөндлөн гарч болохгүй.","Явган хүний гарцгүй зам дээр хамгийн богино зайгаар зам хөндлөн гарах ёстой."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 10 дугаар зүйл (Замыг хөндлөн гарах)-ийн 2 дахь хэсэг: Газар доорх гарц, явган хүний гүүр зэрэг замыг хөндлөн гарах байгууламжийг ашиглах боломжгүй бие махбодын бэрхшээлтэй хүний хувьд бусад хөдөлгөөнд саад учруулахгүй аргаар замыг хөндлөн гарах байгууламжийг ашиглалгүйгээр замыг хөндлөн гарч болно."},{"n":171,"b":"Шөнийн цагаар зам дээрх явган зорчигч эсвэл саад тотгор түр хугацаанд харагдахгүй болох \"алга болох үзэгдэл \" хамгийн их үүсэх магадлалтай байрлал аль нь вэ?","c":["Эсрэг урсгалын эгнээний зах хэсэг","Өөрийн зорчих эгнээний баруун хэсэг","Замын төв шугамын орчим","Замын баруун зах хэсэг"],"a":"3","imgs":[],"t":"문장형","e":"Шөнийн цагаар зам дээрх явган зорчигч буюу эд зүйлс түр зуур харагдахгүй болох «ууршилтын үзэгдэл» гарахад хялбар байрлал нь замын төвийн шугамын ойролцоо юм."},{"n":172,"b":"Явган зорчигчийн зорчих журмын талаар зөв нь аль вэ?","c":["Явган зорчигч зам хөндлөн гарахдаа автомашины яг урд эсвэл хойноос хурдан гарна.","Хөдөлгөөний бэрхшээлтэй хүн зам хөндлөн гарах байгууламжтай бол заавал түүгээр гарна.","Явган зорчигч зам хөндлөн гарахыг хориглосон хэсгээр хурдан гарах ёстой.","Явган зорчигч явган хүний гарцгүй замыг хамгийн богино зайгаар хөндлөн гарна."],"a":"4","imgs":[],"t":"문장형","e":"Явган зорчигч явган хүний зам ба зорчих хэсэг нь тусгаарлагдсан зам дээр заавал явган хүний замаар зорчих ёстой. Бие махбодын бэрхшээлтэй хүн замыг хөндлөн гарах байгууламжийг ашиглалгүйгээр хөндлөн гарч болно. Гэхдээ аюулгүйн тэмдэглэгээ зэргээр хөндлөн гарахыг хориглосон тохиолдолд хөндлөн гарч болохгүй. (Замын хөдөлгөөний тухай хуулийн 10 дугаар зүйл)"},{"n":173,"b":"Явган хүний замаар зорчих үндсэн зарчим аль нь вэ?","c":["Явган хүний замын баруун талаар явна","Явган хүний замын зүүн талаар явна","Явган хүний замын голоор явна","Явган хүний замаар зорчих тусгай зарчим байхгүй"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 8 дугаар зүйл (Явган зорчигчийн зорчих) ④ Явган зорчигч явган хүний зам дотор баруун талаар зорчих нь зарчим юм."},{"n":174,"b":"Хүүхдийн хамгаалалтын бүсэд байрлах гэрлэн дохиогүй явган хүний гарцын өмнө (зогсох шугамтай бол зогсох шугамын өмнө) жолоочийн зөв үйлдэл болох 2-ыг сонгоно уу.","c":["Явган зорчигч явган хүний гарцаар гарах гэж байвал аюулгүй байдлыг шалган удаан явж өнгөрнө.","Явган зорчигч явган хүний гарцаар гарах гэж байвал түр зогсож, аюулгүй гаргах нөхцөлийг бүрдүүлнэ.","Явган зорчигч гарч байгаа эсэхээс үл хамааран удаан явна.","Явган зорчигч гарч байгаа эсэхээс үл хамааран түр зогсоно."],"a":"2, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах)-ийн 7 дахь хэсэг: Бүх тээврийн хэрэгсэл буюу трамвайн жолооч 12 дугаар зүйлийн 1 дэх хэсэгт заасан хүүхдийн хамгаалалтын бүс дотор байгуулсан явган хүний гарцаас гэрлэн дохио суурилуулаагүй явган хүний гарцын өмнө (зогсох шугам байрлуулсан бол уг зогсох шугамыг хэлнэ) явган зорчигч хөндлөн гарч байгаа эсэхээс үл хамааран түр зогсох ёстой."},{"n":175,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган зорчигчийг хамгаалах талаар зөв 2-ыг сонгоно уу.","c":["Унадаг дугуйгаа түрэн явж байгаа хүн явган зорчигчид хамаарахгүй.","Замын хөдөлгөөнийг зохицуулаагүй уулзварт түрүүлж орсон тээврийн хэрэгсэл явган зорчигчоос давуу эрхтэй.","Аймаг, нийслэлийн цагдаагийн газрын дарга явган зорчигчийн хөдөлгөөнийг хамгаалах зорилгоор явган зорчигчийн зориулалтын зам байгуулж болно.","Явган зорчигчийн зориулалтын замаар хүүхдийн тэргийг түрж явж болно."],"a":"3, 4","imgs":[],"t":"문장형","e":"Унадаг дугуйгаа түлхэж алхаж буй хүн ч явган зорчигчид хамаарах бөгөөд замын хөдөлгөөний зохицуулалтгүй уулзварт түрүүлж орсон тээврийн хэрэгсэл ч явган зорчигчид зам тавьж өгөх ёстой."},{"n":176,"b":"Явган зорчигчийн зорчих журмын талаар зөв 2-ыг сонгоно уу.","c":["Явган зорчигч зорчих хэсгээр явахдаа үргэлж зүүн талаар явах ёстой.","Явган зорчигч нийгмийн ач холбогдолтой арга хэмжээний жагсаалын үед явган зорчигч замын голоор явж болно.","Зам хөндлөн гарах байгууламж ашиглах боломжгүй хөдөлгөөний бэрхшээлтэй хүн тухайн байгууламжийг ашиглахгүйгээр зам хөндлөн гарч болно.","Зам хөндлөн гарах байгууламжгүй үед явган зорчигч аюулгүй байдлын үүднээс хамгийн урт зайгаар зам хөндлөн гарна."],"a":"2, 3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 9 дүгээр зүйл ① Сурагчдын эгнээ болон бусад явган зорчигчийн хөдөлгөөнд саад учруулж болзошгүй гэж үзэж Ерөнхийлөгчийн зарлигаар тогтоосон хүн эсвэл жагсаал (цаашид «жагсаал зэрэг» гэх) нь 8 дугаар зүйлийн 1 дэх хэсгийн үндсэн заалтаас үл хамааран зорчих хэсгээр зорчиж болно. Энэ тохиолдолд жагсаал зэрэг нь зорчих хэсгийн баруун талаар явах ёстой. Хуулийн 13 дугаар зүйл ③ Тээврийн хэрэгслийн жолооч зам (явган хүний зам ба зорчих хэсэг нь тусгаарлагдсан замд зорчих хэсгийг хэлнэ)-ын төв (төвийн шугам байрлуулсан бол уг төвийн шугамыг хэлнэ. Цаашид мөн адил)-өөс баруун талын хэсгээр зорчих ёстой."},{"n":177,"b":"Замын хөдөлгөөний тухай хуулийн дагуу суудлын автомашины жолооч явган хүний замыг хөндлөн гарах журмыг з өрчсөн бол хэдэн воны зөрчлийн торгууль ногдуулах вэ?","c":["30,000 вон","40,000 вон","50,000 вон","60,000 вон"],"a":"4","imgs":[],"t":"문장형","e":"Зорчих ангилал зөрчих (явган хүний зам руу орох, явган хүний замыг хөндлөн гарах аргыг зөрчих) <Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8> зөрчлийн торгууль 60,000 вон"},{"n":178,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган зорчигчийг хамгаалахтай холбоотой суудлын автомашины жолоочийн зөрчлийн торгуулийн хэмжээ нь өөр аль нь вэ? (Хамгаалалтын бүсийг хамаарахгүй)","c":["Гэрлэн дохионы дагуу зам гарч буй явган зорчигчийн хөдөлгөөнд саад учруулах","Явган зорчигчийн зориулалтын замаар зорчих журам зөрчих","Зам дээр явж буй автомашинаас гадна тал руу эд зүйл шидэх","Хүүхэд, харааны бэрхшээлтэй хүн зэрэг хүнийг хамгаалах үүргээ зөрчих"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 8 Зөрчлийн үйлдэл ба зөрчлийн торгуулийн хэмжээ (жолооч): ①, ②, ④ нь 60,000 вон, ③ нь 50,000 вон зөрчлийн торгууль ногдуулна"},{"n":179,"b":"Жолоочийн явган зорчигчид хандах хамгийн зөв хандлага аль нь вэ?","c":["Зөвшөөрөлгүйгээр зам хөндлөн гарч буй явган зорчигчийг хамгаалах шаардлагагүй.","Автомашины хажуугаар өнгөрч буй явган зорчигчид анхаарах шаардлагагүй.","Явган зорчигч автомашинаас өөрөө зайлсхийх ёстой.","Жолооч явган зорчигчийг нэн тэргүүнд хамгаалах ёстой."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах) ⑤ Бүх тээврийн хэрэгсэл буюу трамвайн жолооч явган зорчигч 10 дугаар зүйлийн 3 дахь хэсгийн дагуу явган хүний гарц байгуулаагүй замыг хөндлөн гарч байх үед аюулгүй зай барьж түр зогсон явган зорчигчийг аюулгүй хөндлөн гарах боломжоор хангах ёстой."},{"n":180,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган зорчигч зам хөндлөн гарах боломжтойг замын тэмдгээр тэмдэглэсэн хэсгийг юу гэж нэрлэдэг вэ?","c":["Явган хүний зам","Замын хажуугийн хөвөө","Явган хүний гарц","Явган зорчигчийн зориулалтын зам"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 12 дахь заалт: «Явган хүний гарц» гэж явган зорчигч замыг хөндлөн гарах боломжтой байхаар аюулгүйн тэмдэглэгээгээр тэмдэглэсэн замын хэсгийг хэлнэ."},{"n":181,"b":"Дараах үйлдлүүдээс явган зорчигчид хандах жолоочийн үйлдлээс аль нь буруу вэ?","c":["Хүүхдийн хамгаалалтын тэмдэгтэй газарт хүүхэд гэнэт гарч ирж болзошгүй тул анхааралтай явна.","Явган хүний замыг хөндлөн гарахын өмнө удаан явж явган зорчигчийг хамгаална.","Зөвшөөрөлгүйгээр зам хөндлөн гарч буй явган зорчигчийг ч хамгаалах ёстой.","Хүүхэд асран хамгаалагчгүйгээр зам хөндлөн гарч байвал түр зогсоно."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйлийн 1 дэх хэсгээс 2 дахь хэсэг: Явган хүний замыг хөндлөн гарахын өмнө түр зогсож зүүн болон баруун хэсэг зэргийг ажигласны дараа явган зорчигчийн хөдөлгөөнд саад учруулахгүйгээр хөндлөн гарах ёстой."},{"n":182,"b":"Явган зорчигчийн зам хөндлөн гарах аргын талаар аль нь буруу вэ?","c":["Явган зорчигч явган хүний гарцгүй замыг хамгийн богино зайгаар хөндлөн гарна.","Явган зорчигч ямар ч тээврийн хэрэгслийн яг урд эсвэл хойноос зам хөндлөн гарч болохгүй.","Зөвшөөрөлгүйгээр зам хөндлөн гарахаас сэргийлэх зориулалттай тусгаарлах хашлага байсан ч давж гарч болно.","Зам засвар зэрэг шалтгаанаар явган хүний замаар зорчихыг хориглосон үед зорчих хэсгээр явж болно."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 8 дугаар зүйл (Явган зорчигчийн зорчих) ① Явган зорчигч явган хүний зам ба зорчих хэсэг нь тусгаарлагдсан зам дээр үргэлж явган хүний замаар зорчих ёстой. Гэхдээ зорчих хэсгийг хөндлөн гарах тохиолдол, замын ажил зэргээс явган хүний замаар зорчихыг хориглосон тохиолдол болон бусад аргагүй тохиолдолд энэ хамаарахгүй. Замын хөдөлгөөний тухай хуулийн 10 дугаар зүйл (Замыг хөндлөн гарах) ② Явган зорчигч 1 дэх хэсэгт заасан явган хүний гарц, газар доорх гарц, явган хүний гүүр болон бусад замыг хөндлөн гарах байгууламж байгуулсан зам дээр тэр газраар хөндлөн гарах ёстой. Гэхдээ газар доорх гарц, явган хүний гүүр зэрэг замыг хөндлөн гарах байгууламжийг ашиглах боломжгүй бие махбодын бэрхшээлтэй хүний хувьд бусад хөдөлгөөнд саад учруулахгүй аргаар замыг хөндлөн гарах байгууламжийг ашиглалгүйгээр замыг хөндлөн гарч болно. ③ Явган зорчигч 1 дэх хэсэгт заасан явган хүний гарц байгуулаагүй зам дээр хамгийн богино зайгаар хөндлөн гарах ёстой. ④ Явган зорчигч тээврийн хэрэгсэл болон трамвайн яг урд буюу ард хөндлөн гарч болохгүй. Гэхдээ явган хүний гарцаар хөндлөн гарах эсвэл гэрлэн дохио буюу цагдаагийн алба хаагч зэргийн дохио, зааврын дагуу замыг хөндлөн гарах тохиолдолд энэ хамаарахгүй."},{"n":183,"b":"Дараах хүмүүсээс хэн нь харааны бэрхшээлтэй хүнтэй адилтган үзэх ангилалд хамаарахгүй вэ?","c":["Хүүхэд болон бага насны хүүхэд","Хиймэл хөл зэрэг туслах хэрэгсэлгүйгээр алхаж чаддаггүй хүн","Биеийн тэнцвэрийн үйл ажиллагааны бэрхшээлтэй хүн","Сонсголгүй хүн"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 11 дүгээр зүйлийн 2 дахь хэсэг болон мөн хуулийг хэрэгжүүлэх журмын 8 дугаар зүйлд заасан хараагүй хүнтэй адилтгах хүн гэж дараах заалтуудын аль нэгэнд хамаарах хүнийг хэлнэ. 1. Сонсголгүй хүн 2. Биеийн тэнцвэрийн үйл ажиллагааны бэрхшээлтэй хүн 3. Хиймэл хөл зэргийг ашиглахгүйгээр алхаж чадахгүй хүн"},{"n":184,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хүүхдийн хамгаалалтын бүсэд ( )~( ) цагийн хооронд гэрлэн дохио зөрчсөн суудлын автомашины жолоочид өмнөх торгуулийн оноог 2 дахин ногдуулна. ( )-д зөв дарааллаар орсон нь аль вэ?","c":["Өглөөний 6 цаг, оройн 6 цаг","Өглөөний 7 цаг, оройн 7 цаг","Өглөөний 8 цаг, оройн 8 цаг","Өглөөний 9 цаг, оройн 9 цаг"],"a":"3","imgs":[],"t":"문장형","e":"12 дугаар зүйл (Хүүхдийн хамгаалалтын бүсийг тогтоох, цуцлах болон удирдах) Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 28] Жолоодох эрхийг хүчингүй болгох, түдгэлзүүлэх арга хэмжээний шалгуур 4. Дээрх хүснэгтээс үл хамааран хүүхдийн хамгаалалтын бүс болон ахмад настан, хөгжлийн бэрхшээлтэй иргэдийн хамгаалалтын бүс дотор өглөөний 8 цагаас оройн 8 цагийн хооронд дараах дэд заалтуудад заасан зөрчил гаргасан жолоочид тухайн дэд заалтад тогтоосон торгуулийн оноо ногдуулна. а. 1 дэх заалт болон 3 дахь заалтын аль нэгэнд хамаарах зөрчил: 120 оноо б. 3 дахь заалтын 2, 9 дэх заалт, 14 дэх заалт, 15 дахь заалт эсвэл 25 дахь заалт (хуулийн 27 дугаар зүйлийн 7 дахь хэсгийг хасна)-ын аль нэгэнд хамаарах зөрчил: тухайн заалтын дагуух зөрчилд ногдуулах торгуулийн онооны 2 дахин"},{"n":185,"b":"Замын хөдөлгөөний тухай хуулийн дагуу 4.5 тонн ачааны автомашин өглөөний 10:00–11:00 цагийн хооронд ахмад настны хамгаалалтын бүсэд зогсоолын журам зөрчсөн бол хэдэн воны торгууль ногдуулах вэ?","c":["40,000 вон","50,000 вон","90,000 вон","100,000 вон  хөгжлийн бэрхшээлтэй хүний туслах нохойтойгоо зам хөндлөн гарч байгааг олж харсан тохиолдолд аль нь зөв жолоодлого вэ?","c":["Түр зогсох, зогсоолд тавихыг хориглосон газар бол шууд үргэлжлүүлэн явна.","Түр зогсоно.","Нэн даруй зогсож, харааны бэрхшээлтэй хүнийг буцаж гарахыг чиглүүлнэ.","Дуут дохио өгч хамгаална."],"a":"2","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийн 49 дүгээр зүйл (Бүх жолоочийн дагаж мөрдөх зүйл гэх мэт)> ① Бүх тээврийн хэрэгслийн жолооч дараах заалтуудыг дагаж мөрдөх ёстой. 2. Дараах дэд заалтуудын аль нэгэнд хамаарах тохиолдолд түр зогсох б. Хараагүй хүн цагаан таяг барих эсвэл хөгжлийн бэрхшээлтэй хүний туслах нохой дагуулах зэрэг арга хэмжээ авч замыг хөндлөн гарч байгаа тохиолдол"},{"n":190,"b":"Замын хөдөлгөөний тухай хуулийн дагуу бүх тээврийн хэрэгслийн жолооч хүүхдийн хамгаалалтын бүсэд байрлах гэрлэн дохиогүй явган хүний гарцын өмнө явган зорчигч гарч байгаа эсэхээс үл хамааран ( ) ёстой. ( ) -д тохирох нь аль вэ?","c":["Удаан явах","Түр зогсох","Удаан явах эсвэл түр зогсох","Хурдаа сааруулан явах"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах) ⑦ Бүх тээврийн хэрэгслийн жолооч хүүхдийн хамгаалалтын бүс дотор байгуулсан явган хүний гарцаас гэрлэн дохио суурилуулаагүй явган хүний гарцын өмнө явган зорчигч хөндлөн гарч байгаа эсэхээс үл хамааран түр зогсох ёстой."},{"n":191,"b":"Зам хөндлөн гарч буй явган зорчигчийг хамгаалах талаар зөв тайлбар аль нь вэ?","c":["Уулзвараас бусад зам дээр явган зорчигчийг хамгаалах үүрэг байхгүй.","Гэрлэн дохио зөрчин зөвшөөрөлгүйгээр зам хөндлөн гарч буй явган зорчигчийг хамгаалах үүрэг байхгүй.","Зөвшөөрөлгүйгээр зам хөндлөн гарч буй явган зорчигчийг ч хамгаалах ёстой.","Нэг чигийн хөдөлгөөнтэй зам дээр зөвшөөрөлгүйгээр зам хөндлөн гарч буй явган зорчигчийг хамгаалах үүрэг байхгүй."],"a":"3","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах)> ⑤ Бүх тээврийн хэрэгсэл буюу трамвайн жолооч явган зорчигч 10 дугаар зүйлийн 3 дахь хэсгийн дагуу явган хүний гарц байгуулаагүй замыг хөндлөн гарч байх үед аюулгүй зай барьж түр зогсон явган зорчигчийг аюулгүй хөндлөн гарах боломжоор хангах ёстой."},{"n":192,"b":"Замын хөдөлгөөний тухай хуулийн дагуу үндсэндээ зорчих хэсгээр зорчихыг зөвшөөрдөггүй хүн аль нь вэ?","c":["Явган зорчигчид зориулсан тэргэнцэр ашиглан зорчиж буй хүн","Нийгмийн ач холбогдолтой арга хэмжээний хүрээнд жагсаалд оролцож буй хүн","Зам дээр цэвэрлэгээ, засварын ажил хийж буй хүн","Шат зэрэг явган зорчигчийн хөдөлгөөнд саад учруулж болзошгүй зүйл тээвэрлэж буй хүн"],"a":"1","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 7 дугаар зүйл (Зорчих хэсгээр зорчиж болох хүн эсвэл жагсаал)> Хуулийн 9 дүгээр зүйлийн 1 дэх хэсгийн эхний өгүүлбэрт заасан «Ерөнхийлөгчийн зарлигаар тогтоосон хүн эсвэл жагсаал» гэж дараах заалтуудын аль нэгэнд хамаарах хүн эсвэл жагсаалыг хэлнэ. 1. Морь, үхэр зэрэг том амьтан туугаад явж буй хүн 2. Шат, мод болон бусад явган зорчигчийн хөдөлгөөнд саад учруулж болзошгүй эд зүйл зөөж буй хүн 3. Зам дээр цэвэрлэгээ, засвар зэрэг ажил хийж буй хүн 4. Цэргийн анги эсвэл түүнтэй адилтгах байгууллагын жагсаал 5. Туг эсвэл уриа самбар зэрэг барьсан жагсаал 6. Оршуулгын жагсаал"},{"n":193,"b":"Явган зорчигчийн ногоон гэрэл анивчиж байх үед явган зорчигчийн хамгийн зөв үйлдэл аль нь вэ?","c":["Явган хүний гарц руу хараахан ороогүй явган зорчигч дараагийн ногоон гэрлийг хүлээж гарна.","Явган хүний гарцын голд зогсоно.","Дараагийн дохиог хүлээлгүйгээр явган хүний гарцаар гарна.","Улаан гэрэл асахаас өмнө бол хэзээ ч зам хөндлөн гарч эхэлж болно."],"a":"1","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 2 Гэрлэн дохионы дохионы төрөл ба дохионы утга> Ногоон гэрэл анивчих: Явган зорчигч хөндлөн гарч эхлэх ёсгүй бөгөөд хөндлөн гарч буй явган зорчигч хурдан хөндлөн гарч дуусгах эсвэл хөндлөн гарахаа зогсоож явган хүний зам руу буцах ёстой."},{"n":194,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган хүний замаар зорчиж буй явган зорчигчийн талаар зөв тайлбар аль нь вэ?","c":["125 см³-ээс бага багтаамжтай мотоцикл унаж явж байгаа хүнийг явган зорчигч гэж үзэж болно.","Унадаг дугуй унаж байгаа хүнийг явган зорчигч гэж үзэж болно.","Явган зорчигчид зориулсан тэргэнцэр ашиглаж байгаа хүнийг явган зорчигч гэж үзэж болно.","49 см³ хөдөлгүүртэй моторт унадаг дугуй унаж байгаа хүнийг явган зорчигч гэж үзэж болно."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Тодорхойлолт)-ийн 10 дахь заалт: «Явган хүний зам» гэж хашлагын шугам, аюулгүйн тэмдэглэгээ эсвэл түүнтэй төстэй хиймэл байгууламжаар хил хязгаарыг нь тэмдэглэж явган зорчигч (хүүхдийн тэрэг болон Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон явган хүний туслах сандалтай тэргэнцэрийг оролцуулна. Цаашид мөн адил) зорчих боломжтой болгосон замын хэсгийг хэлнэ."},{"n":195,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган зорчигчийн зориулалтын замын талаар зөв 2-ыг сонгоно уу.","c":["Зөвшөөрөгдсөн тээврийн хэрэгслийн болон хөсгийн жолооч явган зорчигчийн алхах хурдтайгаар зорчих ёстой.","Тээврийн хэрэгсэл болон хөсгийн жолооч үндсэндээ явган зорчигчийн зориулалтын замаар зорчиж болно.","Цагдаагийн газрын дарга онцгой шаардлагатай гэж үзсэн тохиолдолд ч тээврийн хэрэгслийн болон хөсгийн хөдөлгөөнийг зөвшөөрч болохгүй.","Зөвшөөрөгдсөн тээврийн хэрэгслийн болон хөсгийн жолооч явган зорчигчид аюул учруулж болзошгүй үед түр зогсох ёстой."],"a":"1, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 28 дугаар зүйл (Явган зорчигчийн зориулалтын зам байгуулах) ① Аймаг, нийслэлийн Цагдаагийн газрын дарга эсвэл цагдаагийн хэлтсийн дарга явган зорчигчийн хөдөлгөөнийг хамгаалахад онцгой шаардлагатай тохиолдолд зам дээр явган зорчигчийн зориулалтын зам байгуулж болно. ② Тээврийн хэрэгсэл болон хөсгийн жолооч 1 дэх хэсэгт заасан явган зорчигчийн зориулалтын замаар зорчиж болохгүй. Гэхдээ аймаг, нийслэлийн Цагдаагийн газрын дарга эсвэл цагдаагийн хэлтсийн дарга онцгой шаардлагатай гэж үзвэл явган зорчигчийн зориулалтын замаар тээврийн хэрэгсэл болон хөсөг зорчихыг зөвшөөрч болно. ③ 2 дахь хэсгийн тусгай заалтын дагуу явган зорчигчийн зориулалтын замаар зорчихыг зөвшөөрсөн тээврийн хэрэгсэл болон хөсгийн жолооч явган зорчигчид аюул учруулахгүй, зорчиход нь саад болохгүйн тулд тээврийн хэрэгслийг явган хүний алхах хурдаар явуулах эсвэл түр зогсох ёстой."},{"n":196,"b":"Автомашинд ачиж явсан ачаа унаж, явган зорчигчид 2 долоо хоногийн эмчилгээ шаардлагатай гэмтэл учруулсан жолоочид ногдуулах шийтгэлийн зөв 2-ыг сонгоно уу.","c":["Хохирогч шийтгэхийг хүсэхгүй байсан ч эрүүгийн хариуцлага хүлээнэ.","Хохирогчтой эвлэрвэл шийтгэлгүй.","Хохирлыг бүрэн нөхөн төлөх даатгалтай бол шийтгэхгүй.","Хохирлыг бүрэн нөхөн төлөх даатгалтай эсэхээс үл хамааран эрүүгийн хариуцлага хүлээнэ."],"a":"1, 4","imgs":[],"t":"문장형","e":"Зам тээврийн ослыг шийдвэрлэх тусгай журмын тухай хуулийн 3 дугаар зүйл (Шийтгэлийн онцгой журам)-ын 2 дахь хэсгийн 12 дахь заалт: «Замын хөдөлгөөний тухай хууль»-ийн 39 дүгээр зүйлийн 4 дэх хэсгийг зөрчиж автомашины ачаа унахгүй байх шаардлагатай арга хэмжээ авалгүй жолоодсон тохиолдолд хамаарах тул иж бүрэн даатгалд хамрагдсан ч эрүүгийн хариуцлага хүлээнэ."},{"n":197,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган хүний гарцгүй зам дээр явган зорчигчийн хамгийн зөв зам хөндлөн гарах арга аль нь вэ?","c":["Өнгөрсөн автомашины яг араар гарна.","Автомашин байхгүй үед хурдан гарна.","Явган хүний гарц байхгүй тул хүссэн газраараа гарна.","Замыг хамгийн богино зайгаар хөндлөн гарна."],"a":"4","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийн 10 дугаар зүйлийн 3 дахь хэсэг>: Явган зорчигч 1 дэх хэсэгт заасан явган хүний гарц байгуулаагүй зам дээр хамгийн богино зайгаар хөндлөн гарах ёстой."},{"n":198,"b":"Дараах тайлбаруудаас замын хөдөлгөөний тухай хуулийн дагуу явган хүний гарцаар гарах аргын талаар буруу тайлбар аль нь вэ?","c":["Хувийн хөдөлгөөнт хэрэгслийг түрэн гарч болно.","Явган зорчигчид зориулсан тэргэнцэртэй гарч болно.","Унадаг дугуй унаж гарч болно.","Хүүхдийн тэргийг түрэн гарч болно."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 12 дахь заалт: Явган хүний гарц гэж явган зорчигч замыг хөндлөн гарах боломжтой байхаар аюулгүйн тэмдэглэгээгээр тэмдэглэсэн замын хэсгийг хэлнэ. Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 1 дэх хэсэг: Бүх тээврийн хэрэгслийн жолооч явган зорчигч (13-2 дугаар зүйл-ын 6 дахь хэсгийн дагуу унадаг дугуйнаас бууж унадаг дугуйгаа түлхэж явж буй унадаг дугуйн жолоочийг оролцуулна) явган хүний гарцаар гарч байх үед явган зорчигчийн хөндлөн гарахад саад болохгүй, аюул учруулахгүйн тулд уг явган хүний гарцын өмнө (зогсох шугам байрлуулсан газарт уг зогсох шугамыг хэлнэ) түр зогсох ёстой."},{"n":199,"b":"Дараах нь замын хөдөлгөөний тухай хуулийн дагуу тээврийн хэрэгслийн болон хөсгийн зорчих журмын тухай юм. Буруу нь аль вэ?","c":["Явган хүний зам, зорчих хэсэг тусгаарлагдсан замд зорчих хэсгээр зорчих ёстой.","Явган хүний замыг хөндлөн гарахын өмнө удаан явж, баруун зүүн талыг шалган, явган зорчигчийн хөдөлгөөнд саад учруулахгүйгээр гарна.","Замын төвийн баруун талаар зорчих ёстой.","Нэг чигийн хөдөлгөөнтэй зам бол замын төв хэсэг эсвэл зүүн талаар зорчиж болно."],"a":"2","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйлийн 2 дахь хэсэг> 1 дэх хэсгийн тусгай заалтын тохиолдолд тээврийн хэрэгсэл, хөсгийн жолооч явган хүний замыг хөндлөн гарахын яг өмнө түр зогсож, зүүн, баруун тал зэргийг ажигласны дараа явган зорчигчийн хөдөлгөөнд саад учруулахгүйгээр хөндлөн гарах ёстой."},{"n":200,"b":"Дараах нь замын хөдөлгөөний тухай хуулийн дагуу явган зорчигчийг хамгаалах тухай тайлбар юм. Буруу нь аль вэ?","c":["Явган зорчигч явган хүний гарцаар гарч байгаа үед гарцын өмнө түр зогсох ёстой.","Цагдаагийн албан хаагчийн дохио, зааврын дагуу зам гарч буй явган зорчигчийн хөдөлгөөнд саад учруулж болохгүй.","Уулзвар дээр зам хөндлөн гарч буй явган зорчигчийн хөдөлгөөнд саад учруулж болохгүй.","Явган зорчигч явган хүний гарцгүй замыг хөндлөн гарч байгаа үед аюулгүй зай барин удаан явах ёстой."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах) ① Бүх тээврийн хэрэгсэл болон трамвайн жолооч нь явган зорчигч (13-2 дугаар зүйл-ын 6 дахь хэсгийн дагуу унадаг дугуй зэргээс бууж, унадаг дугуй зэргийг түлхэж буюу өргөж явж буй унадаг дугуй зэргийн жолоочийг оролцуулна) явган хүний гарцаар гарч байгаа буюу гарах гэж байгаа үед явган зорчигчийн хөндлөн гарахад саад учруулах буюу аюул учруулахгүйн тулд тухайн явган хүний гарцын өмнө (зогсох шугам тавигдсан газарт тухайн зогсох шугамыг хэлнэ) түр зогсох ёстой. ② Бүх тээврийн хэрэгсэл болон трамвайн жолооч нь замын хөдөлгөөний зохицуулалт хийгдэж буй уулзварт зүүн буюу баруун тийш эргэх тохиолдолд гэрлэн дохио буюу цагдаагийн алба хаагч зэргийн дохио, заавраар замыг хөндлөн гарч буй явган зорчигчийн хөдөлгөөнд саад учруулж болохгүй. ③ Бүх тээврийн хэрэгслийн жолооч нь замын хөдөлгөөний зохицуулалт хийгдээгүй уулзвар буюу түүний ойролцоох замыг хөндлөн гарч буй явган зорчигчийн хөдөлгөөнд саад учруулж болохгүй. ⑤ Бүх тээврийн хэрэгсэл болон трамвайн жолооч нь явган зорчигч 10 дугаар зүйлийн 3 дахь хэсгийн дагуу явган хүний гарц тавигдаагүй замыг хөндлөн гарч байгаа үед аюулгүй зай барьж түр зогсож, явган зорчигчийг аюулгүй хөндлөн гарах боломжоор хангах ёстой."},{"n":201,"b":"Тээврийн хэрэгсэл жолоодож байх үед автомашины гэрлэн дохио болон явган зорчигчийн гэрлэн дохио хоёулаа эвдэрсэн бо л явган хүний гарцаар хэрхэн нэвтрэх нь зөв бэ?","c":["Явган зорчигч байвал удаан явж өнгөрнө.","Явган хүний гарц дээр явган зорчигч байхгүй бол удаан явахгүйгээр хурдан өнгөрнө.","Гэрлэн дохио эвдэрсэн тул явган хүний гарцын үүрэг хүчингүй болсон учир удаан явах шаардлагагүй.","Явган зорчигч байвал явган хүний гарцын өмнө түр зогсоно."],"a":"4","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 27 дугаар зүйлийн 1 дэх хэсэг> Бүх тээврийн хэрэгсэл болон трамвайн жолооч нь явган зорчигч (13-2 дугаар зүйл-ын 6 дахь хэсгийн дагуу унадаг дугуй зэргээс бууж, унадаг дугуй зэргийг түлхэж буюу өргөж явж буй унадаг дугуй зэргийн жолоочийг оролцуулна) явган хүний гарцаар гарч байгаа буюу гарах гэж байгаа үед явган зорчигчийн хөндлөн гарахад саад учруулах буюу аюул учруулахгүйн тулд тухайн явган хүний гарцын өмнө (зогсох шугам тавигдсан газарт тухайн зогсох шугамыг хэлнэ) түр зогсох ёстой."},{"n":202,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган хүний зам, зорчих хэсэг тусгаарлагдаагүй, төв шугамтай зам дээр явган зорчигч хэрхэн зорчих нь хамгийн зөв бэ?","c":["Зорчих хэсгийн голоор явна.","Зорчих хэсгийн баруун талаар явна.","Замын хажуугийн хөвөөгөөр явна.","Замын бүх хэсгээр явна."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 8 дугаар зүйл (Явган зорчигчийн хөдөлгөөн) ① Явган зорчигч нь явган хүний зам болон зорчих хэсэг нь тусгаарлагдаагүй замын дотроос төвийн шугамтай замд (нэг чиглэлийн хөдөлгөөнтэй тохиолдолд эгнээний шугамаар тусгаарлагдсан замыг оролцуулна) замын захаар буюу замын захын бүсээр явах ёстой. ② Явган зорчигч дараах заалтуудын аль нэгэнд хамаарах газарт замын бүх хэсгээр явж болно. Энэ тохиолдолд явган зорчигч тээврийн хэрэгсэл, хөсгийн хөдөлгөөнд санаатайгаар саад учруулж болохгүй. 1. Явган хүний зам болон зорчих хэсэг нь тусгаарлагдаагүй замын дотроос төвийн шугамгүй зам (нэг чиглэлийн хөдөлгөөнтэй тохиолдолд эгнээний шугамаар тусгаарлагдаагүй замаар хязгаарлана. Цаашид мөн адил) 2. Явган зорчигчийн давуу эрхтэй зам"},{"n":203,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган зорчигчийн зориулалтын замаар зорчихыг зөвшөөрсөн тээврийн хэрэгслийн болон хөсгийн жолоочийн зөв зорчих арга аль нь вэ?","c":["Явган зорчигч байвал удаан явна.","Дуут дохио өгч явна.","Явган зорчигчийн алхах хурдтайгаар зорчих эсвэл түр зогсох ёстой.","Явган зорчигч байхгүй бол хурдан явна."],"a":"3","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийн 28 дугаар зүйлийн 3 дахь хэсэг> Зөвхөн явган зорчигчид зориулсан замаар явахыг зөвшөөрсөн тээврийн хэрэгсэл, хөсгийн жолооч нь явган зорчигчид аюул учруулах буюу явган зорчигчийн хөдөлгөөнд саад учруулахгүйн тулд тээврийн хэрэгслээ явган хүний алхах хурдаар явуулах буюу түр зогсох ёстой."},{"n":204,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хашлага, замын тэмдэг эсвэл түүнтэй адил хиймэл байгууламжаар хил заагийг нь тэмдэглэж, явган зорчигч зорчихоор зориулсан замын хэсгийг юу гэдэг вэ?","c":["Явган хүний зам","Замын хажуугийн хөвөө","Явган хүний гарц","Унадаг дугуйн гарц"],"a":"1","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 10 дахь заалт> Явган хүний зам гэж хашлагын шугам, аюулгүйн тэмдэглэгээ буюу түүнтэй адил төстэй хиймэл байгууламжаар хил хязгаарыг тэмдэглэж, явган зорчигч (хүүхдийн тэрэг болон Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон явган хүний туслах сандалтай тэргэнцрийг оролцуулна. Цаашид мөн адил) явахад зориулсан замын хэсгийг хэлнэ."},{"n":205,"b":"Замын хөдөлгөөний тухай хуулийн дагуу явган зорчигчийн гэрлэн дохио анивчиж байх үед зөв үйлдэлд хамаарахгүй нь аль вэ?","c":["Явган зорчигч зам хөндлөн гарч эхлэх ёсгүй.","Зам хөндлөн гарч байгаа явган зорчигч аль болох хурдан гарч дуусгах ёстой.","Зам хөндлөн гарахаа зогсоож, буцаад явган хүний зам руу очих ёстой.","Зам хөндлөн гарахаа зогсоож, тухайн газраа дараагийн дохиог хүлээнэ."],"a":"4","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 6 дугаар зүйлийн 2 дахь хэсэг, Хавсралт 2> Гэрлэн дохионы заадаг дохионы төрөл болон дохионы утгын дотроос явган зорчигчийн гэрлэн дохио"},{"n":206,"b":"Замын хөдөлгөөний тухай хуулийн дагуу жолооч дараах нөхцөлүүдийн аль үед удаан явах ёстой вэ?","c":["Унадаг дугуйгаа түрэн явган хүний гарцаар гарч буй хүнийг олж харсан үед","Нарийн гудамжаар явж байхдаа явган зорчигчийн хажуугаар өнгөрөх үед","Явган зорчигч явган хүний гарцаар гарч байгааг харсан үед","Явган зорчигч явган хүний гарцгүй замыг хөндлөн гарч байгааг харсан үед"],"a":"2","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 4 дэх хэсэг> Бүх тээврийн хэрэгслийн жолооч нь замд байрлуулсан аюулгүйн бүсэд явган зорчигч байгаа тохиолдолд болон эгнээ тэмдэглээгүй нарийн замд явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явах ёстой."},{"n":207,"b":"Замын хөдөлгөөний тухай хуулийн дагуу өндөрлөсөн явган хүний гарцыг хурдны дээд хязгаарыг цагт ( ) км ба түүнээс бага байхаар тогтоох шаардлагатай замд байгуулна. ( ) -д тохирох нь аль вэ?","c":["10","20","30","50"],"a":"3","imgs":[],"t":"문장형","e":"Өндөрлөсөн явган хүний гарцыг хурдны дээд хязгаарыг 30 км/ц буюу түүнээс доош хязгаарлах шаардлагатай замд явган хүний гарцыг замын гадаргуугаас өндөр болгож жолоочийн анхаарлыг татах шаардлагатай цэгт байрлуулна. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, 5. 533)"},{"n":208,"b":"Замын хөдөлгөөний тухай хуулийн дагуу тээврийн хэрэгсэл жолоодож байх үед түр зогсох шаардлагагүй нөхцөл аль нь вэ?","c":["Хүүхэд асран хамгаалагчгүйгээр зам хөндлөн гарч байгаа үед","Автомашины гэрлэн дохио улаан анивчсан үед","Хүүхэд зам дээр сууж эсвэл зогсож байгаа үед","Автомашины гэрлэн дохио шар анивчсан үед"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 49 дүгээр зүйл (Бүх жолоочийн дагаж мөрдөх зүйл)-ийн 1 дэх хэсгийн 2 дахь заалт, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 2. Тээврийн хэрэгслийн гэрлэн дохио шар өнгөөр анивчих дохиотой үед бусад хөдөлгөөн буюу аюулгүйн тэмдэглэгээний заалтад анхаарал хандуулан явж болно."},{"n":209,"b":"Замын хөдөлгөөний тухай хуулийн дагуу диагональ явган хүний гарцын явган зорчигчийн гэрэл ногоон байх үед тээврийн хэрэгслийн болон хөсгийн зөв зорчих арга аль нь вэ?","c":["Чигээрээ явах бол зогсох шугамын өмнө түр зогсох ёстой.","Явган зорчигч байхгүй бол хурдаа нэмэн баруун эргэж болно.","Явган зорчигч байхгүй бол хурдаа нэмэн зүүн эргэж болно.","Явган зорчигч гарахгүй чиглэл рүү явж болно."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6-ийн 532-ын 2 Диагональ явган хүний гарцын тэмдэглэгээ. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 6 дугаар зүйлийн 2 дахь хэсэг, Хавсралт 2 Гэрлэн дохионы заадаг дохионы төрөл болон дохионы утгын дотроос улаан гэрэл"},{"n":210,"b":"Замын хөдөлгөөний тухай хуулийн дагуу жолооч тээврийн хэрэгслийн дугуйг түр хугацаанд бүрэн зогсоохыг юу гэдэг вэ?","c":["Удаан явах","Зогсолт","Зогсоолд тавих","Түр зогсолт"],"a":"4","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 30 дахь заалт> \"Түр зогсох\" гэж тээврийн хэрэгслийн жолооч тухайн тээврийн хэрэгслийн дугуйг түр зуур бүрэн зогсоохыг хэлнэ."},{"n":211,"b":"Замын хөдөлгөөний тухай хуулийн дагуу эмнэлгийн зориулалттай цахилгаан тэргэнцэр зорчиж болохгүй газар аль нь вэ?","c":["Унадаг дугуйн зориулалтын зам","Замын хажуугийн хөвөө","Явган хүний зам","Замын зах хэсэг"],"a":"1","imgs":[],"t":"문장형","e":"<Замын хөдөлгөөний тухай хуулийн 8 дугаар зүйлийн 1 дэх хэсэг> Явган зорчигч нь явган хүний зам болон зорчих хэсэг нь тусгаарлагдсан замд үргэлж явган хүний замаар явах ёстой. Гэхдээ зорчих хэсгийг хөндлөн гарах тохиолдол, замын ажил зэргээс шалтгаалан явган хүний замаар явахыг хориглосон тохиолдол болон бусад аргагүй тохиолдолд үүнд хамаарахгүй."},{"n":212,"b":"Замын хөдөлгөөний зохицуулалтгүй уулзварт зүүн эргэх хамгийн зөв арга аль нь вэ?","c":["Ердийн зам дээр зүүн эргэх уулзварын өмнө чиг заах дохиогоо өгөөд зүүн эргэнэ.","Урьдчилан замын төв шугам даган удаан явж, уулзварын төвийн гадуур тойрон зүүн эргэнэ.","Аймаг, нийслэлийн цагдаагийн газрын дарга зөвшөөрсөн байсан ч уулзварын төвийн гадуур тойрон зүүн эргэж болохгүй.","Заавал удаан явах ёстой бөгөөд түр зогсох эсэхийг жолооч нөхцөл байдлаас шалтгаалан шийднэ."],"a":"4","imgs":[],"t":"문장형","e":"Ердийн замд зүүн тийш эргэхдээ зүүн тийш эргэх цэгээс 30 метр ба түүнээс дээш зайтай цэгээс чиг заах дохиог асаах ёстой бөгөөд замын төвийн шугамыг дагаж удаан явж, уулзварын төвийн дотор талаар зүүн тийш эргэх ёстой ба аймаг, нийслэлийн Цагдаагийн газрын даргын тогтоосон газарт уулзварын төвийн гадна талаар зүүн тийш эргэж болно. Мөн зүүн тийш эргэхдээ үргэлж удаан явах үүрэгтэй боловч түр зогсохыг нөхцөл байдлаас хамааран хийж ч болно, хийхгүй байж ч болно."},{"n":213,"b":"Замын хөдөлгөөний тухай хуулийн дагуу эгнээний өргөн ( ) метр ба түүнээс их байх ёстой. Харин зөвхөн зүүн эргэх эгнээ зэрэг зайлшгүй шаардлагатай гэж үзвэл ( ) см ба түүнээс их байж болно. ( ) -д тус тус тохирох нь аль вэ?","c":["5, 300","4, 285","3, 275","2, 265"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 15 дугаар зүйл (Эгнээ байгуулах)-ийн 2 дахь хэсэг, эгнээний өргөн 3 метр ба түүнээс дээш байх ёстой боловч зөвхөн зүүн эргэлтийн эгнээ байгуулах зэрэг аргагүй гэж үзсэн тохиолдолд 275 сантиметр ба түүнээс дээш байж болно."},{"n":214,"b":"Замын баруун хэсгийн өргөн 6 метрээс бага зам дээр өөр автомашиныг гүйцэж түрүүлэх боломжтой тохиолдол аль нь вэ?","c":["Замын зүүн хэсгийг харах боломжгүй үед","Эсрэг урсгалын хөдөлгөөнд саад учруулах эрсдэлтэй үед","Урд автомашин удаан явж байгаа бөгөөд бусад автомашинтай аюулгүй зай хангагдсан үед","Замын тэмдэг зэргээр гүйцэж түрүүлэхийг хориглосон эсвэл хязгаарласан үед"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйл (Тээврийн хэрэгсэл, хөсгийн хөдөлгөөн)-ийн 4 дэх хэсгийн 3 дахь заалт"},{"n":215,"b":"Замын хөдөлгөөний тухай хуулийн дагуу өдрийн цаг хугацаанаас шалтгаалан хоёр чиглэлийн хөдөлгөөний ачаалал эрс ялгаатай замд хөдөлгөөн ихтэй чиглэл рүү эгнээний тоог нэмэгдүүлэх зорилгоор гэрлэн дохиогоор зорчих чиглэлийг заадаг эгнээг юу гэдэг вэ?","c":["Хувьсах эгнээ","Автобусны тусгай эгнээ","Хурд авах эгнээ","Гүйцэж түрүүлэх эгнээ"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 14 дүгээр зүйл (Эгнээ байгуулах зэрэг)-ийн 1 дэх хэсэг, аймаг, нийслэлийн Цагдаагийн газрын дарга нь цагийн хуваариас хамааран хоёр чиглэлийн хөдөлгөөний эрчим нь илт ялгаатай замд хөдөлгөөний эрчим их талд эгнээний тоог нэмэгдүүлэх боломжтой байхаар гэрлэн дохиогоор эгнээний хөдөлгөөний чиглэлийг заадаг хувьсах эгнээ байгуулж болно."},{"n":216,"b":"Замын хөдөлгөөний тухай хуулийн дагуу \"Бүх тээврийн хэрэгслийн жолооч уулзварт ( ) гэж байгаа бол урьдчилан замын баруун захыг даган удаан явж ( ) ёстой. Энэ тохиолдолд ( ) зорчих хэсгийн жолооч гэрлэн дохионы дагуу зогсож эсвэл хөдөлж буй явган зорчигч болон унадаг дугуй зэрэгт анхаарах ёстой.” ( ) -д зөв тохирох нь аль вэ?","c":["Баруун эргэх – Баруун эргэх – Баруун эргэх","Зүүн эргэх – Зүүн эргэх – Зүүн эргэх","Баруун эргэх – Зүүн эргэх – Баруун эргэх","Зүүн эргэх – Баруун эргэх – Зүүн эргэх"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйл (Уулзвараар нэвтрэх арга) ① Бүх тээврийн хэрэгслийн жолооч уулзварт баруун тийш эргэх тохиолдолд урьдчилан замын баруун захаар удаан явж баруун тийш эргэх ёстой. Энэ тохиолдолд баруун тийш эргэж буй тээврийн хэрэгслийн жолооч дохионы дагуу зогсож буюу явж буй явган зорчигч буюу унадаг дугуй зэрэгт анхаарал хандуулах ёстой. <2020 оны 6 дугаар сарын 9-ний өдөр нэмэлт өөрчлөлт орсон>"},{"n":217,"b":"Замын хөдөлгөөний тухай хуулийн дагуу эгнээ солих тухай зөв тайлбар аль нь вэ?","c":["Гүүрэн дээр аюултай бүс тул ихэвчлэн цагаан тасралтгүй шугамаар эгнээ солихыг хориглодог.","Эгнээ солихыг хориглох хэсгийг цагаан тасархай шугамаар тэмдэглэдэг.","Эгнээ солихыг хориглосон хэсэгт зам засвар зэрэг шалтгаанаар саадтай байсан ч эгнээ сольж болохгүй.","Эгнээ солихыг хориглосон хэсэг байсан ч аюулгүйгээр сольсон бол дүрэм зөрчөөгүйд тооцно."],"a":"1","imgs":[],"t":"문장형","e":"Замын эвдрэл зэргээс шалтгаалан явах боломжгүй тохиолдолд эгнээ сольж явах ёстой бөгөөд эгнээ солихыг хориглосон газарт аюулгүйгээр эгнээ солисон ч хууль тогтоомж зөрчсөнд тооцогдоно. Эгнээ солихыг хориглосон шугамыг тасралтгүй шугамаар тэмдэглэнэ."},{"n":218,"b":"Ногоон гэрлээр уулзварт орсон боловч гэрэл солигдсоны дараа гарч чадалгүй бусад тээврийн хэрэгслийн хөдөлгөөнд саад учруулсан буюу \"дайран орох\" үйлдэл хийсэн бол ямар зөрчилд тооцох вэ?","c":["Уулзвараар нэвтрэх журам зөрчсөн","Түр зогсох журам зөрчсөн","Чиглэл өөрчлөх журам зөрчсөн","Замын түгжрэлийг бууруулах арга хэмжээг зөрчсөн"],"a":"1","imgs":[],"t":"문장형","e":"Бүх тээврийн хэрэгсэл болон трамвайн жолооч нь гэрлэн дохиогоор замын хөдөлгөөний зохицуулалт хийгдэж буй уулзварт орох тохиолдолд явах гэж буй чиглэлийн урд байгаа тээврийн хэрэгсэл буюу трамвайн нөхцөл байдлаас хамааран уулзварт (зогсох шугам тавигдсан тохиолдолд тухайн зогсох шугамыг давсан хэсгийг хэлнэ) зогсох болж бусад тээврийн хэрэгсэл буюу трамвайн хөдөлгөөнд саад учруулах эрсдэлтэй тохиолдолд тухайн уулзварт орж болохгүй (Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйлийн 5 дахь хэсэг). Үүнийг зөрчихийг \"сүүл залгах\" (уулзвар бөглөх) гэнэ."},{"n":219,"b":"Хурдны замын хурд авах эгнээний талаар зөв тайлбар аль нь вэ?","c":["Хурдны замаар явж буй автомашин гарах зам руу эгнээ солиход зориулсан эгнээ","Хурдны замд нэвтрэх автомашин хангалттай хурд авахад зориулсан эгнээ","Хурдны зам дээр гүйцэж түрүүлэх автомашин хурд авахад зориулсан эгнээ","Өгсүүр замд том оврын автомашины хурд буурснаас үүсэх нөлөөг багасгах зорилготой эгнээ"],"a":"2","imgs":[],"t":"문장형","e":"Хурд өөрчлөх эгнээ гэж өндөр хурдтай явж буй автомашин хурдаа сааруулж өөр замд орох тохиолдолд, эсвэл бага хурдтай явж буй автомашин өндөр хурдтай явж буй автомашины урсгалд нэгдэх тохиолдолд үндсэн замын бусад өндөр хурдтай автомашины хөдөлгөөнд саад учруулахгүйгээр аюулгүй хурдаа сааруулах буюу нэмэх зорилгоор байгуулсан нэмэлт эгнээг хэлнэ. Ерөнхийдөө эхнийхийг хурд сааруулах эгнээ, сүүлийнхийг хурд нэмэх эгнээ гэнэ [Замын бүтэц, байгууламжийн стандартын тухай дүрмийн тайлбар (2020), Газар, дэд бүтэц, тээврийн яам, х.40]."},{"n":220,"b":"Хурдны замд орсны дараа буруу орсноо мэдсэн бол хамгийн зөв үйлдэл аль нь вэ?","c":["Замын захад зогсоод ослын гэрлээ асаан хурдны замын эргүүлийн албанаас тусламж хүснэ."," цагаан тасархай шугаман замын гадаргуу дээрх тэмдэглэгээ","Замын төвд байрлах цэнхэр тасралтгүй шугаман замын гадаргуу дээрх тэмдэглэгээ"],"a":"3","imgs":[],"t":"문장형","e":"Замын төвд цагаан тасархай шугам хэлбэрийн замын гадаргуугийн тэмдэглэгээ байрлуулсан хэсэгт буцаж эргэх (U-эргэлт) зөвшөөрөгдөнө."},{"n":224,"b":"Замын хөдөлгөөний тухай хуулийн дагуу эгнээгээр зорчих журмын талаар тайлбар. Буруу нь аль вэ?","c":["Эгнээг замын төв шугамд хамгийн ойр байгаа талаас нь 1-р эгнээ гэж дугаарлана.","Хэт удаан явж бусад автомашины хэвийн хөдөлгөөнд саад учруулах эрсдэлтэй бол тухайн эгнээнийхээ баруун талын эгнээгээр зорчих ёстой.","Нэг чигийн хөдөлгөөнтэй замд замын баруун талаас 1-р эгнээ гэж тоолно.","Нэг чиглэлд 2 эгнээтэй хурдны замд бүх автомашин үндсэндээ 2-р эгнээгээр зорчих ёстой."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 16 дугаар зүйл (Эгнээгээр явах ангилал) - Нэг чиглэлийн хөдөлгөөнтэй замд замын зүүн талаас эхлэн 1 дүгээр эгнээ гэж тооцно."},{"n":225,"b":"Автомашин жолоодож байх үед хүчтэй аадар борооны улмаас үзэгдэх орчин 50 метр ба түүнээс бага болсон бол замын хөдөлгөөний тухай хуулийн дагуу дээд хурдыг ( )-иар бууруулж зорчих ёстой. ( )-д тохирох нь аль вэ?","c":["100-ийн 50","100-ийн 40","100-ийн 30","100-ийн 20"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйл (Автомашин зэрэг болон трамвайн хурд) ② Бороо, манан, цас зэргээс үүдсэн цаг агаарын таагүй нөхцөлд 1 дэх хэсгийг үл харгалзан дараах заалтуудын стандартын дагуу хурдаа сааруулж явах ёстой."},{"n":226,"b":"Замын хөдөлгөөний тухай хуулийн дагуу олон зорчигчтой тээврийн хэрэгслийн зориулалтын эгнээгээр зорчиж болох тээврийн хэрэгслийн зөв 2-ыг сонгоно уу.","c":["3 ба түүнээс их хүн суусан суудлын автомашин","3 ба түүнээс их хүн суусан ачааны автомашин","3 ба түүнээс их хүн суусан олон суудалт автомашин","2 ба түүнээс их хүн суусан хоёр дугуйт тээврийн хэрэгсэл"],"a":"1, 3","imgs":[],"t":"문장형","e":"За зүүн эргэх үед чигээрээ явах өөр автомашин байвал түүнд зам тавьж өгнө.","Явган хүний зам болон зорчих хэсэг тусгаарлагдаагүй замд автомашиныг зогсоохдоо замын баруун захаас төв рүү 50 см ба түүнээс их зайтай зогсооно.","Уулзварт урд автомашин баруун эргэх дохио өгсөн бол арын автомашин түүний хөдөлгөөнд саад учруулж болохгүй.","Автомашины зориулалтын замын хамгийн бага хурд нь цагт 40 км."],"a":"4","imgs":[],"t":"문장형","e":"① Замын хөдөлгөөний тухай хуулийн 26 дугаар зүйлийн 4 дэх хэсэг, ② Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 11 дүгээр зүйлийн 1 дэх хэсгийн 1 дэх заалт, ③ Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйлийн 4 дэх хэсэг, ④ Автомашины зориулалтын замд хурдны доод хязгаар нь цагт 30 километр юм. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлийн 1 дэх хэсгийн 2 дахь заалт)"},{"n":230,"b":"Замын хөдөлгөөний тухай хуулийн дагуу нэг чиглэлд 4 эгнээтэй, дээд хурд нь цагт 100 км хурдны зам дээр 3 тонны ачааны даацтай ачааны автомашины хамгийн дээд хурд хэд вэ?","c":["Цагт 60 км","Цагт 70 км","Цагт 80 км","Цагт 90 км"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлийн 1 дэх хэсэг, нэг чиглэлд 2 ба түүнээс дээш эгнээтэй хурдны замд ачаалах жин нь 1.5 тонноос хэтэрсэн ачааны автомашины хурдны дээд хязгаар нь цагт 80 километр юм."},{"n":231,"b":"Дараах нөхцөлөөс аль үед тээврийн хэрэгсэл болон хөсгийн жолооч замын зүүн талаар зорчиж болохгүй вэ?","c":["Замын тэмдэг зэргээр гүйцэж түрүүлэхийг хориглосон үед","Зам нэг чигийн хөдөлгөөнтэй үед","Зам засвар зэрэг шалтгаанаар баруун талаар зорчих боломжгүй үед","Замын баруун хэсгийн өргөн тээврийн хэрэгсэл болон хөсөг зорчиход хангалтгүй үед"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйл (Тээврийн хэрэгсэл, хөсгийн хөдөлгөөн)-ийн 4 дэх хэсэг"},{"n":232,"b":"Уулзвар болон дилемма бүс (Dilemma Zone)-ээр нэвтрэх аргын талаар хамгийн буруу нь аль вэ?","c":["Уулзварт орохоос өмнө хөдөлгөөний нөхцөл байдлыг урьдчилан шалгаж, аюулгүй зай барин хурдаа сааруулж бүх нөхцөл байдлыг урьдчилан таамаглан хамгаалалтын жолоодлого хийнэ.","Улаан гэрлээр уулзварт орвол гэрлэн дохио зөрчсөнд тооцогдоно.","Гэрлэн дохио ногооноос шар болж солигдох үед урд дугуй зогсох шугамыг давсан бол уулзварын нөхцөл байдлыг ажиглан шуурхай гарч өнгөрнө.","Замын хөдөлгөөний тухай хуульд дилемма бүсийг хүлээн зөвшөөрдөг тул уулзварт орохоос өмнө гэрэл шар болсон бол уулзварын өмнө зогсох шаардлагагүй."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 6 дугаар зүйлийн 2 дахь хэсэг, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 2], Замын хөдөлгөөний тухай хуулийн дагуу тээврийн хэрэгсэл уулзварт орохын өмнө \"шар гэрэл\" болж өөрчлөгдсөн тохиолдолд тээврийн хэрэгсэл зогсох шугам буюу \"уулзварын яг өмнө\" зогсох ёстой эсэх (тийм) [Дээд шүүхийн 2018 оны 12 дугаар сарын 27-ны өдрийн 2018До14262 шийдвэр]"},{"n":233,"b":"Дараах нь тээврийн хэрэгсэл хоорондын зайн тухай тайлбар юм. Зөв нь аль вэ?","c":["Чөлөөт явалтын зай гэдэг нь аюулыг илрүүлээд тоормосны дөрөөг гишгэж тоормос ажиллаж эхлэх хүртэл явсан зай юм.","Зогсох зай гэдэг нь урд автомашин огцом зогсоход мөргөлдөхгүй байх зай юм.","Аюулгүйн зай гэдэг нь тоормос ажиллуулаад бүрэн зогсох хүртэлх зай юм.","Тоормослох зай гэдэг нь аюулыг илрүүлснээс автомашин бүрэн зогсох хүртэлх зай юм."],"a":"1","imgs":[],"t":"문장형","e":"①Хариу үйлдлийн зай ②Аюулгүй зай ③Тоормослох зай ④Зогсох зай"},{"n":234,"b":"Дараах газруудаас аль нь гүйцэж түрүүлэхийг зөвшөөрдөг вэ?","c":["Уулзвар","Төв шугам (шар тасархай шугам)","Хонгил дотор (цагаан тасралтгүй эгнээ)","Гүүрэн дээр (цагаан тасралтгүй эгнээ)"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 22 дугаар зүйл (Гүйцэж түрүүлэхийг хориглох цаг хугацаа болон газар), Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] 501 уулзвар. Уулзвар, шар тасралтгүй шугамтай хэсэг, хонгил дотор, гүүрэн дээр, аймаг, нийслэлийн Цагдаагийн газрын даргын тогтоосон газар нь гүйцэж түрүүлэхийг хориглосон газар юм."},{"n":235,"b":"Замын хөдөлгөөний тухай хуулийн дагуу уулзвар дээр удаан явах талаар хамгийн зөв тайлбар аль нь вэ?","c":["Тээврийн хэрэгслийг шаардлагатай үед нэн даруй зогсоож чадахуйц удаан хурдтай явах","Цагт 30 км хурдыг хадгалан явах","Осол гаргахгүй хэмжээнд удаан явах","Урд автомашины огцом зогсолтоос зайлсхийх хэмжээний хурдтай явах"],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Тодорхойлолт)-ын 28 дахь заалт. \"Удаан явах\" гэж жолооч тээврийн хэрэгслийг нэн даруй зогсоож чадах хэмжээний удаан хурдаар явахыг хэлнэ."},{"n":236,"b":"Зам дээр дээд хурдыг хэтрүүлэн тээврийн хэрэгсэл (хувийн хөдөлгөөнт хэрэгслийг хамаарахгүй) жолоодсон тохиолдолд шийтгэлийн зөв үндэслэл аль нь вэ?","c":["Цагт 100 км-ээс их хурдаар 3 ба түүнээс олон удаа жолоодсон хүн 5,000,000 вон хүртэл торгууль эсвэл баривчлах ял","Цагт 100 км-ээс их хурдаар 3 ба түүнээс олон удаа жолоодсон хүн 1 жил хүртэл хорих ял эсвэл 5,000,000 вон хүртэл торгууль","Цагт 100 км-ээс их хурдаар 2 удаа жолоодсон хүн 3,000,000 вон хүртэл торгууль","Цагт 80 км-ээс их хурд хэтрүүлсэн хүн 500,000 вон хүртэл торгууль эсвэл баривчлах ял"],"a":"2","imgs":[],"t":"문장형","e":"①② Замын хөдөлгөөний тухай хуулийн 151-2 дугаар зүйл-ын 2 дахь заалт: хурдны дээд хязгаараас цагт 100 километрээс илүү хурдаар 3 ба түүнээс дээш удаа автомашин зэргийг жолоодсон хүнд 1 жил хүртэл хугацаагаар хорих ял буюу 5,000,000 вон хүртэл торгууль, ③ Замын хөдөлгөөний тухай хуулийн 153 дугаар зүйлийн 2 дахь хэсгийн 2 дахь заалт: хурдны дээд хязгаараас цагт 100 километрээс илүү хурдаар автомашин зэргийг жолоодсон хүнд 1,000,000 вон хүртэл торгууль буюу баривчлах ял, ④ Замын хөдөлгөөний тухай хуулийн 154 дүгээр зүйлийн 9 дэх заалт: хурдны дээд хязгаараас цагт 80 километрээс илүү хурдаар автомашин зэргийг жолоодсон хүнд 300,000 вон хүртэл торгууль буюу баривчлах ял"},{"n":237,"b":"Гэрлэн дохиогүй уулзварт баруун эргэх үед зөв үйлдэл аль нь вэ?","c":["Аль болох хурдан баруун эргэнэ.","Уулзварт түрүүлж орсон автомашин өнгөрсний дараа баруун эргэнэ.","Эсрэг талаас зүүн эргэж байгаа автомашин байвал аюулгүй байдлыг ханган хамт баруун эргэнэ.","Өргөн замаас нарийн зам руу баруун эргэх үед бусад автомашинд анхаарах шаардлагагүй."],"a":"2","imgs":[],"t":"문장형","e":"Уулзварт баруун тийш эргэхдээ удаан явж баруун тийш эргэх ёстой бөгөөд түрүүлж орсон зүүн тийш эргэж буй тээврийн хэрэгсэлд замаа тавьж өгөх ёстой. Мөн өргөн замаас нарийн замд баруун тийш эргэхдээ ч бусад тээврийн хэрэгсэлд анхаарал хандуулах ёстой."},{"n":238,"b":"Гэрлэн дохиотой боловч тээврийн хэрэгслийн нэмэлт дохиогүй уулзварт баруун эргэх гэж байна. Замын хөдөлгөөний тухай хуулийн дагуу буруу нь аль вэ?","c":["Автомашины гэрэл улаан бол явган хүний гарц дээр явган зорчигчийн дохионоос үл хамааран зогсох шугамын өмнө түр зогсоно.","Автомашины гэрэл ногоон бол зогсох шугамын өмнө түр зогсолгүйгээр баруун эргэнэ.","Автомашины гэрэл зүүн эргэх дохио бол явган хүний гарц дээр явган зорчигчийн дохионоос үл хамааран зогсох шугамын өмнө түр зогсоно.","Автомашины гэрлэн дохионоос үл хамааран бусад автомашины хөдөлгөөнд саад учруулахгүй бол түр зогсолгүйгээр баруун эргэнэ."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйл, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 2, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 2 ① Тээврийн хэрэгслийн гэрлэн дохио улаан гэрэлтэй тохиолдолд явган хүний гарц дээр явган зорчигчийн дохиог үл харгалзан зогсох шугамын яг өмнө түр зогссоны дараа дохионы дагуу явж буй бусад тээврийн хэрэгслийн хөдөлгөөнд саад учруулахгүйгээр баруун тийш эргэнэ. ② Тээврийн хэрэгслийн гэрлэн дохио ногоон гэрэлтэй тохиолдолд явган хүний гарц дээр түр зогсох үүрэг байхгүй. ③ Тээврийн хэрэгслийн гэрлэн дохио ногоон сумтай гэрэл (зүүн эргэлт) тохиолдолд явган хүний гарц дээр явган зорчигчийн дохиог үл харгалзан зогсох шугамын яг өмнө түр зогссоны дараа дохионы дагуу явж буй бусад тээврийн хэрэгслийн хөдөлгөөнд саад учруулахгүйгээр баруун тийш эргэнэ. ※ Түр зогсоогүй тохиолдолд гэрлэн дохио зөрчсөнөөр, түр зогссон боловч явган зорчигчийн хөдөлгөөнд саад учруулсан тохиолдолд явган зорчигчийг хамгаалах үүргээ зөрчсөнөөр шийтгэгдэнэ."},{"n":239,"b":"Уулзварт зүүн болон баруун эргэх аргыг хамгийн зөв тайлбарласан нь аль вэ?","c":["Баруун эргэхдээ дохионы дагуу зогсож эсвэл хөдөлж буй явган зорчигч болон унадаг дугуй зэрэгт анхааран хурдан өнгөрнө.","Зүүн эргэхдээ үргэлж уулзварын төвийн гадуур тойрон эргэнэ.","Баруун эргэхдээ урьдчилан замын баруун захыг даган удаан явна.","Гэрлэн дохиогүй уулзварт зүүн эргэхдээ явган зорчигч зам гарч байвал түүний урдуур хурдан өнгөрнө."],"a":"3","imgs":[],"t":"문장형","e":"Бүх тээврийн хэрэгслийн жолооч уулзварт баруун тийш эргэх гэж буй үед урьдчилан замын баруун захаар удаан явж баруун тийш эргэх ёстой. Энэ тохиолдолд баруун тийш эргэж буй тээврийн хэрэгслийн жолооч дохионы дагуу зогсож буюу явж буй явган зорчигч буюу унадаг дугуйд анхаарал хандуулах ёстой."},{"n":240,"b":"Зогсох зайны талаар зөв тайлбар аль нь вэ?","c":["Жолооч тоормосны дөрөө гишгэсний дараа бүрэн зогсох хүртэлх зай","Урд автомашин огцом зогссон үед мөргөлдөхөөс зайлсхийх боломжтой зай","Жолооч аюулыг илрүүлж, тоормосны дөрөө гишгэснээс автомашин бүрэн зогсох хүртэл туулсан нийт зай","Жолооч аюулыг мэдэрч, тоормосны дөрөө гишгэснээс тоормос бодитоор ажиллаж эхлэх хүртэлх зай"],"a":"3","imgs":[],"t":"문장형","e":"① Тоормослох зай ② Аюулгүй зай ④ Хариу үйлдлийн зай"},{"n":241,"b":"Уулзвараар зөв нэвтрэх арга аль нь вэ?","c":["Гэрлэн дохио улаан анивчиж байвал удаан явна.","Гэрлэн дохио шар анивчиж байвал хурдан нэвтэрнэ.","Уулзвар дээр гүйцэж түрүүлэхгүй.","Уулзварт ойртох үед үргэлж холын гэрлээ асаан явна."],"a":"3","imgs":[],"t":"문장형","e":"Уулзварт шар гэрэл анивчиж байгаа тохиолдолд анхааралтай нэвтэрч, улаан гэрэл анивчиж байгаа тохиолдолд түр зогсоно. Уулзварт ойртох үед урд гэрлийг холын гэрлээр асаах нь нөгөө талын аюулгүй жолоодлогод аюул учруулна."},{"n":242,"b":"Hi-pass эгнээний тайлбар болон ашиглах аргын тайлбар юм. Хамгийн зөв нь аль вэ?","c":["Hi-pass эгнээ үргэлж 1-р эгнээнд байдаг тул урьдчилан ердийн эгнээнээс Hi-pass эгнээ рүү шилжин аюулгүй нэвтэрнэ.","Ачааны автомашины Hi-pass эгнээний чиглүүлэх шугам цэнхэр өнгөтэй бөгөөд зөвхөн ачааны автомашинд зориулагдсан тул явж байсан хурдаараа нэвтэрнэ.","Олон эгнээтэй Hi-pass хэсгээр нэвтрэх хурдыг цагт 30 км хүртэл хязгаарладаг тул урьдчилан хурдаа сааруулж удаан явна.","Олон эгнээтэй Hi-pass хэсгээр тогтоосон хурдыг мөрдөж, Hi-pass төхөөрөмжийн гэмтэл зэрэг шалтгаанаар мэдээлэл уншигдахгүй бол хүрэх төлбөр авах цэг дээр тооцоо хийнэ."],"a":"4","imgs":[],"t":"문장형","e":"Ачааны автомашины Хай-пасс (Hi-pass) чиглүүлэх шугам улбар шар өнгөтэй, ердийн Хай-пасс эгнээ хөх өнгөтэй бөгөөд олон эгнээт Хай-пасс хэсэгт цагт 50∼80 километр гэж хэсгээс хамааран өөр өөр байна."},{"n":243,"b":"Замын хөдөлгөөний тухай хуулийн дагуу автомашины зориулалтын зам дээр суудлын автомашины зөв дээд хурд аль нь вэ?","c":["Цагт 60 км-ээр жолоодно.","Цагт 70 км-ээр жолоодно.","Цагт 80 км-ээр жолоодно.","Цагт 90 км-ээр жолоодно."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйл (Автомашин зэрэг болон трамвайн хурд) ① 2 дахь заалт. Автомашины зориулалтын замд хурдны дээд хязгаар нь цагт 90 километр, хурдны доод хязгаар нь цагт 30 километр"},{"n":244,"b":"Замын хөдөлгөөний тухай хуулийн дагуу орон сууцны бүс, худалдааны бүс болон үйлдвэрийн бүсийн ердийн замд тогтоож болох хурдны хязгаар аль нь вэ?","c":["Цагт 20 км дотор","Цагт 30 км дотор","Цагт 40 км дотор","Цагт 50 км дотор"],"a":"4","imgs":[],"t":"문장형","e":"Хурдыг бууруулах замаар замын хөдөлгөөнд оролцогчдын аюулгүй байдлыг хангах \"5030\" бодлогын хүрээнд 2021 оны 4 дүгээр сарын 17-ны өдөр Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрэм хэрэгжиж, орон сууц, худалдаа, үйлдвэрийн бүсийн ердийн замд цагт 50 километрээс дотор, харин аймаг, нийслэлийн Цагдаагийн газрын дарга онцгой шаардлагатай гэж үзэж тогтоосон чиглэл буюу хэсэгт цагт 60 километрээс дотор автомашин зэрэг болон трамвайн хөдөлгөөний хурдыг тогтоосон."},{"n":245,"b":"Зам тээврийн ослыг бууруулах зорилгоор хотын төвийн замын дээд хурдыг цагт 50 км, орон сууцны бүс зэрэг нарийн гудамжны хурдыг цагт 30 км ба түүнээс бага болгон тогтоосон замын хөдөлгөөний аюулгүй байдлын бодлогыг юу гэдэг вэ?","c":["New Deal бодлого","Аюулгүй хурд 5030","Зам тээврийн ослыг бууруулах нэгдсэн аян","Ухаалаг тээврийн систем (ITS)"],"a":"2","imgs":[],"t":"문장형","e":"\"Шинэ курс бодлого\" гэдэг нь Их хямралыг даван туулахын тулд хэрэгжүүлсэн бүх бодлого юм (Дүсан нэвтэрхий толь). \"Зам тээврийн ослыг бууруулах нэгдсэн уулзалт\" нь Солонгосын Замын хөдөлгөөний газар (KoROAD)-аас зохион байгуулж, Дотоод хэрэг, аюулгүй байдлын яам болон Цагдаагийн ерөнхий газраас ивээн тэтгэдэг замын хөдөлгөөний аюулгүй байдлын ухамсрыг дээшлүүлэх арга хэмжээ юм. \"Ухаалаг тээврийн систем\" гэж электроник, мэдээлэл, холбоо, удирдлага зэргийн технологийг тээврийн системд нэвтрүүлсэн тээврийн системийг хэлнэ (Дүсан нэвтэрхий толь). Асуултад буй замын хөдөлгөөний аюулгүй байдлын бодлого нь \"Аюулгүй хурд 5030\" юм. 2019 оны 4 дүгээр сарын 16-ны өдөр Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлд нэмэлт өөрчлөлт оруулснаар \"Газар нутгийн төлөвлөлт, ашиглалтын тухай хууль\"-ийн 36 дугаар зүйлийн 1 дэх хэсгийн 1 дэх заалтын \"а\" дэд заалтаас \"в\" дэд заалт хүртэлх заалтын дагуух орон сууцны бүс, худалдааны бүс, үйлдвэрийн бүсийн ердийн замд цагт 50 километрээс дотор, харин аймаг, нийслэлийн Цагдаагийн газрын дарга онцгой шаардлагатай гэж үзэж тогтоосон чиглэл буюу хэсэгт цагт 60 километрээс дотор автомашин зэрэг болон трамвайн хөдөлгөөний хурдыг тогтоосон. Хэрэгжиж эхэлсэн огноо (2021 оны 4 дүгээр сарын 17-ны өдөр)"},{"n":246,"b":"Хамгаалалтгүй зүүн эргэлттэй уулзварт зүүн эргэх үед жолоочийн зөв үйлдэл болох 2-ыг сонгоно уу.","c":["Ногоон гэрэлтэй үед өөдөөс ирэх автомашин байхгүй бол зүүн эргэнэ.","Гэрлэн дохионоос үл хамааран өөдөөс ирэх автомашинд саад болохгүй бол хэзээ ч зүүн эргэж болно.","Хоёр чиглэлд чигээрээ явах дохиотой үед өөдөөс ирэх автомашинд саад болохгүйгээр аюулгүй зүүн эргэнэ.","Улаан гэрлээр хамгаалалтгүй зүүн эргэлт хийж осол гаргавал аюулгүй жолоодох үүргээ зөрчсөнөөр шийтгүүлнэ."],"a":"1, 3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 62 дугаар зүйлийн 2 дахь хэсэгт холбогдох Хавсралт 2 Гэрлэн дохионы заадаг дохионы төрөл болон дохионы утга"},{"n":247,"b":"Хотын төв замын дунд байрлах автобусны тусгай эгнээтэй замаар явж байна. Хамгийн аюулгүй жолоодох арга болох 2-ыг сонгоно уу.","c":["Бусад автомашиныг эгнээ рүү оруулахгүйн тулд дуут дохиог байнга хэрэглэнэ.","Баруун талаас явган зорчигч зөвшөөрөлгүйгээр зам хөндлөн гарч болзошгүй тул анхааралтай явна.","Зүүн талын автобусны буудлаас явган зорчигч гарч ирж болзошгүй тул удаан явна.","Гэрэл улаан болж болзошгүй тул хурдан нэвтэрнэ."],"a":"2, 3","imgs":[],"t":"문장형","e":"Төв автобусны зориулалтын эгнээ (BRT)-тэй хэсэгт хотын замаар явж байгаа тохиолдолд автобусны буудал төв хэсэгт байрладаг бөгөөд явган хүний гарцын урт богино тул явган зорчигчийн зөвшөөрөлгүй хөндлөн гарах осол их гардаг учир анхааралтай удаан явах ёстой."},{"n":248,"b":"Замын хөдөлгөөний тухай хуулийн дагуу эгнээ солих үед аюулгүй жолоодох арга болох 2-ыг сонгоно уу.","c":["Эгнээ солихдоо аль болох хурдан хийх ёстой.","Зөвхөн цагаан тасралтгүй шугамтай хэсэгт эгнээ сольж болно.","Явж буй бусад тээврийн хэрэгслийн хөдөлгөөнд саад болохгүй үед эгнээ солино.","Зөвхөн цагаан тасархай шугамтай хэсэгт эгнээ сольж болно."],"a":"3, 4","imgs":[],"t":"문장형","e":"Эгнээ солихдоо эгнээ солих боломжтой хэсэгт аюулгүй байдлыг шалгасны дараа эгнээ солих ёстой."},{"n":249,"b":"Уулзварт баруун эргэх үед хамгийн аюулгүй жолоодох үйлдэл болох 2-ыг сонгоно уу.","c":["Чиг заах дохиог баруун эргэх цэгээс 30 метр ба түүнээс их зайд урьдчилан өгнө.","Цагаан тасралтгүй шугамтай бол болгоомжлон баруун тийш эгнээ солино.","Өөрийн зорчих чиглэлийн зүүн талаас ирж буй тээврийн хэрэгсэлд саад болохгүйгээр баруун эргэнэ.","Бусад хөдөлгөөнд анхааран хурдан баруун эргэнэ."],"a":"1, 3","imgs":[],"t":"문장형","e":"Уулзварт ойртоход цагаан тасралтгүй шугам зурагдсан бол тухайн хэсэгт чиглэлээ өөрчилж болохгүй бөгөөд бусад хөдөлгөөнд анхаарал хандуулан удаан явж эргэх ёстой. Мөн баруун тийш эргэхдээ гэрлэн дохиогүй уулзварт давуу эрхтэй тээврийн хэрэгсэлд замаа тавьж өгөх ёстой."},{"n":250,"b":"Суудлын автомашины жолооч гүйцэж түрүүлэх үед зөв жолоодох арга болох 2-ыг сонгоно уу.","c":["Гүйцэж түрүүлж эхлэхдээ зүүн талд хангалттай зай байгаа эсэхийг шалгах ёстой.","Явж буй замын зөвшөөрөгдсөн хурдны хязгаарын хүрээнд гүйцэж түрүүлэх ёстой.","Аюулгүй нь батлагдсан тохиолдолд баруун талаар гүйцэж түрүүлж болно.","Урд автомашины зүүн талаар өнгөрсний дараа арын тольд баруун талын автомашин харагдахгүй болсон үед хурдан эгнээндээ буцаж орно."],"a":"1, 2","imgs":[],"t":"문장형","e":"Бүх тээврийн хэрэгслийн жолооч өөр тээврийн хэрэгслийг гүйцэж түрүүлэх гэж буй үед урд явж буй тээврийн хэрэгслийн зүүн талаар явах ёстой. Гүйцэж түрүүлэх гэж буй бүх тээврийн хэрэгслийн жолооч эсрэг чиглэлийн хөдөлгөөн болон урд явж буй тээврийн хэрэгслийн урд талын хөдөлгөөнд ч хангалттай анхаарал хандуулах ёстой бөгөөд урд явж буй тээврийн хэрэгслийн хурд, эгнээ болон бусад замын нөхцөл байдлаас хамааран чиг заах дохио, гэрэл буюу дуут дохио ашиглах зэрэг аюулгүй хурд, аргаар гүйцэж түрүүлэх ёстой."},{"n":251,"b":"Замаар зорчих үед аюулгүй жолоодох аргын зөв 2-ыг сонгоно уу.","c":["Машинаа тавихдаа аль болох аюулгүйн бүсэд зогсоох нь аюулгүй.","Шар гэрэл асахад гэрлэн дохиог мөрдөхийн тулд уулзвар дотор зогсоно.","Урд автомашин огцом тоормослохыг тооцоолж, мөргөлдөхөөс сэргийлэх хангалттай зай барина.","Гүйцэж түрүүлэхдээ урд автомашины зүүн талаар өнгөрнө."],"a":"3, 4","imgs":[],"t":"문장형","e":"Урд явж буй тээврийн хэрэгсэл гэнэт тоормослох үед мөргөлдөхөөс зайлсхийх боломжтой зайг барьж, гүйцэж түрүүлэх тохиолдолд урд явж буй тээврийн хэрэгслийн зүүн талаар явна."},{"n":252,"b":"Дараах тээврийн хэрэгслүүдээс аль нь гал унтраагуурыг заавал суурилуулах буюу авч явах шаардлагагүй вэ?","c":["5 ба түүнээс дээш хүний суудалтай суудлын автомашин","Олон суудалт автомашин","Ачааны автомашин","Хоёр дугуйт тээврийн хэрэгсэл"],"a":"4","imgs":[],"t":"문장형","e":"Галын аюулаас хамгаалах байгууламж суурилуулах, ашиглах тухай хуулийн 11 дүгээр зүйл (Автомашинд суурилуулах буюу байрлуулах гал унтраагуур)-ийн 1 дэх хэсэг \"Автотээврийн хэрэгслийн удирдлагын тухай хууль\"-ийн 3 дугаар зүйлийн 1 дэх хэсгийн дагуух автомашины дотроос дараах заалтуудын аль нэгэнд хамаарах автомашиныг үйлдвэрлэх, угсрах, импортлох, борлуулах гэж буй этгээд буюу тухайн автомашины өмчлөгч нь автомашины гал унтраагуурыг суурилуулах буюу байрлуулах ёстой. 1. 5 ба түүнээс дээш суудалтай суудлын автомашин 2. Олон суудалт автомашин"},{"n":253,"b":"Замын хөдөлгөөний тухай хуулийн дагуу яаралтай үүрэг гүйцэтгэж буй тусгай зориулалтын тээврийн хэрэгсэл ойртож ирэх үед жолоочийн зөв үйлдэл аль нь вэ?","c":["Уулзварт тусгай зориулалтын тээврийн хэрэгсэл ойртож ирвэл уулзварын зүүн захад түр зогсоно.","Уулзвараас бусад газарт тусгай зориулалтын тээврийн хэрэгсэл давуу зорчих боломжтой байхаар зам тавьж өгнө.","Тусгай зориулалтын тээврийн хэрэгслээс хурдан явж түрүүлж өнгөрнө.","Байгаа газартаа түр зогсож, тусгай зориулалтын тээврийн хэрэгсэл өнгөрөхийг хүлээнэ."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 29 дүгээр зүйл (Тусгай зориулалтын тээврийн хэрэгслийн давуу эрхтэй хөдөлгөөн) ④ Уулзвар буюу түүний ойролцоо тусгай зориулалтын тээврийн хэрэгсэл ойртож ирэх тохиолдолд тээврийн хэрэгсэл, хөсөг болон трамвайн жолооч уулзвараас зайлсхийж түр зогсох ёстой. ⑤ Бүх тээврийн хэрэгсэл болон трамвайн жолооч 4 дэх хэсэгт заасан газраас бусад газарт тусгай зориулалтын тээврийн хэрэгсэл ойртож ирсэн тохиолдолд тусгай зориулалтын тээврийн хэрэгслийг давуу эрхтэйгээр нэвтрүүлэхийн тулд зам тавьж өгөх ёстой."},{"n":254,"b":"У
