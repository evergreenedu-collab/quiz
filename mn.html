"img_0050.jpg"],"t":"사진형","e":"Аюулгүйн тэмдэглэгээ суурилуулж эгнээ солихыг тусгайлан хориглосон газарт тээврийн хэрэгслийн эгнээг сольж болохгүй. Цагаан тасархай шугамтай хэсэгт эгнээ солих боломжтой боловч цагаан үргэлжилсэн шугамтай хэсэгт эгнээ сольж болохгүй. Цагаан үргэлжилсэн шугам ба тасархай шугамын давхар шугамтай хэсэгт тасархай шугам байгаа талаас л эгнээ солих боломжтой."},{"n":735,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Гарах эгнээ түгжирсэн бол аюулгүйн бүсээр дайран хурдан гарна.","Гарах эгнээ рүү шилжсэний дараа өөр автомашин урдуур шахаж оруулахгүйн тулд урд автомашины ард маш ойрхон явна.","Цагаан үргэлжилсэн болон тасархай хос шугамтай хэсэг тул тасархай шугамтай талаас чиглэлээ өөрчлөн гарна.","Баруун талын гарах эгнээ рүү шилжсэний дараа буруу замаар орсноо мэдвэл дахин зүүн талын үндсэн эгнээ рүү шилжинэ.","Гарах эгнээ рүү шилжих үед баруун чиг заах дохиог ажиллуулна."],"a":"3, 5","imgs":["img_0051.jpg"],"t":"사진형","e":"Аюулгүйн тэмдэглэгээ суурилуулж эгнээ солихыг тусгайлан хориглосон газарт тээврийн хэрэгслийн эгнээг сольж болохгүй. Цагаан тасархай шугамтай хэсэгт эгнээ солих боломжтой боловч цагаан үргэлжилсэн шугамтай хэсэгт эгнээ сольж болохгүй. Цагаан үргэлжилсэн шугам ба тасархай шугамын давхар шугамтай хэсэгт тасархай шугам байгаа талаас л эгнээ солих боломжтой. Эгнээ солих үед чиг заах дохиог асааж урд, хойд явж буй тээврийн хэрэгслүүдийн аюулгүй байдлыг шалган явах ёстой бөгөөд аюулгүйн арал руу орохыг хориглоно."},{"n":736,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Газар доорх зам руу орохоос өмнөх цагаан үргэлжилсэн шугамтай хэсэгт 2-р эгнээ рүү шилжиж болно.","Газар доорх зам дотор урд гэрлээ асааж, урд талын нөхцөл байдлыг анхааран аюулгүй хурдтай явна.","Газар доорх зам дотор цагаан үргэлжилсэн шугамтай байсан ч удаан явж буй автомашиныг гүйцэж түрүүлж болно.","Газар доорх зам дотор урд автомашинтай хангалттай аюулгүйн зай барина.","Автомашины зориулалтын зам руу андуурч орсон бол аюулгүйгээр ухарч явна. ■ Автомашины зориулалтын зам ■ Газар доорх замын үүд"],"a":"2, 4","imgs":["img_0052.jpg"],"t":"사진형","e":"Аюулгүйн тэмдэглэгээ суурилуулж эгнээ солихыг тусгайлан хориглосон газарт тээврийн хэрэгслийн эгнээг сольж болохгүй. Цагаан тасархай шугамтай хэсэгт эгнээ солих боломжтой боловч цагаан үргэлжилсэн шугамтай хэсэгт эгнээ сольж болохгүй. Газар доорх замд өдрийн цагт ч гэрлээ асаах нь аюулгүй бөгөөд урд тээврийн хэрэгсэлтэй аюулгүй зайг барьж явна. Автомашины зориулалтын замд ухрахыг хориглоно."},{"n":737,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Дуут дохио эсвэл холын гэрлийг дараалан ашиглан ачааны автомашины эгнээ солиход саад учруулна.","Ачааны автомашин аюулгүйгээр эгнээ солих боломжийг олгон зам тавьж өгнө.","Хурдаа нэмэгдүүлэн ачааны автомашины ард маш ойрхон явна.","3-р эгнээгээр явж буй арын автомашиныг үл харгалзан 3-р эгнээ рүү огцом шилжин ачааны автомашины хажуугаас хурдан гарна.","Дотор болон гадна арын харах толийг ашиглан арын хөдөлгөөнийг шалгаж, анхааран хурдаа бууруулж явна."],"a":"2, 5","imgs":["img_0053.jpg"],"t":"사진형","e":"Чиглэлээ өөрчлөх гэж буй тээврийн хэрэгсэл байвал хурдаа аажмаар бууруулж, аюулгүй чиглэлээ өөрчлөх боломж олгон зам тавьж өгөх бөгөөд энэ үед дотор, гадна талын арын толь зэргээр дамжуулан араас ирж буй тээврийн хэрэгслийн нөхцөл байдлыг мөн ажиглах нь чухал."},{"n":738,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Урд талын ачааны автомашиныг гүйцэж түрүүлэхийн тулд дуут дохио эсвэл холын гэрлийг дараалан ашиглан зам тавьж өгөхийг шаардана.","4-р эгнээг ашиглан хурдан гүйцэж түрүүлнэ.","Урд талын ачааны автомашинд аль болох ойртсоны дараа гүйцэж түрүүлнэ.","Урьдчилан зүүн чиг заах дохио өгч, хангалттай аюулгүйн зай барьсны дараа 2-р эгнээгээр гүйцэж түрүүлнэ.","Эгнээ солих үед зүүн эгнээгээр явж буй автомашинуудыг ажиглаж, хүчээр гүйцэж түрүүлэхийг оролдохгүй."],"a":"4, 5","imgs":["img_0054.jpg"],"t":"사진형","e":"Өөр тээврийн хэрэгслийг гүйцэж түрүүлэхийн тулд урд тээврийн хэрэгслийн зүүн талаар явах ёстой бөгөөд энэ үед чиг заах дохиог урьдчилан асааж аюулгүй зайг хангасны дараа гүйцэж түрүүлэхийг оролдох ёстой. Тээврийн хэрэгслийн эгнээг солих гэж буй тохиолдолд солих гэж буй чиглэлээс ирж буй өөр тээврийн хэрэгслийн хэвийн хөдөлгөөнд саад учруулж болзошгүй үед эгнээ сольж болохгүй."},{"n":739,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["3-р эгнээгээр явж буй автомашины байрлал, хурдыг шалгаж, аюулгүй болох нь батлагдвал эгнээ солино.","3-р эгнээ рүү орохдоо заавал хурдаа аль болох ихээр бууруулна.","3-р эгнээнд хангалттай зайгүй байсан ч хурдан огцом эгнээ солино.","Эгнээ солихын өмнө урьдчилан чиг заах дохио өгч, аюулгүй байдлыг шалгасны дараа явна.","Урьдчилан чиг заах дохио өгвөл зам тавьж өгөхгүй тул эгнээ сольж эхлэхтэй зэрэгцэн чиг заах дохиогоо асааж орно."],"a":"1, 4","imgs":["img_0055.jpg"],"t":"사진형","e":"Тээврийн хэрэгслийн эгнээг солих гэж буй тохиолдолд солих гэж буй чиглэлээс ирж буй өөр тээврийн хэрэгслийн хэвийн хөдөлгөөнд саад учруулж болзошгүй үед эгнээ сольж болохгүй. Хурдны зам болон автомашины зориулалтын замд эгнээ солихоос 100 м-ийн өмнө чиг заах дохиог урьдчилан асааж аюулгүй зайг хангасны дараа эгнээ солих ёстой."},{"n":740,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Эгнээ сольж буй ачааны автомашинаас зайлсхийхийн тулд 1-р эгнээ рүү шилжинэ.","Ачааны автомашинтай мөргөлдөхөөс сэргийлэхийн тулд арын хөдөлгөөнийг шалгаж, хурдаа бууруулан явна.","Хонгил богино тул гаднах нөхцөл байдлыг харж болох учраас хонгилоос гарахдаа хурдаа нэмэгдүүлэн явна.","Хонгилд ороход урд гэрлээ асаана.","Ачааны автомашин 3-р эгнээ рүү шилжиж, урд суудлын автомашинтайгаа зай авмагц тэр автомашины ард аль болох ойрхон даган явна."],"a":"2, 4","imgs":["img_0056.jpg"],"t":"사진형","e":"Аюулгүйн тэмдэглэгээ суурилуулж эгнээ солихыг тусгайлан хориглосон газарт тээврийн хэрэгслийн эгнээг сольж болохгүй. Цагаан тасархай шугамтай хэсэгт эгнээ солих боломжтой боловч цагаан үргэлжилсэн шугамтай хэсэгт эгнээ сольж болохгүй. Хонгил дотор урд тээврийн хэрэгсэлтэй аюулгүй зайг барьж ослоос сэргийлэх шаардлагатай."},{"n":741,"b":"Дараах нөхцөлд буруу жолоодох арга 2-ыг сонгоно уу.","c":["Hi-pass ашиглагч урьдчилан Hi-pass тусгай эгнээ рүү шилжинэ.","Hi-pass эгнээнд зогсохгүй тул урд явж буй автомашины нөхцөл байдлыг анхаарах шаардлагагүй.","Бэлэн мөнгө эсвэл картаар төлбөр төлөх бол урьдчилан тухайн эгнээ рүү чиглэлээ өөрчилнө.","Бэлэн мөнгөөр төлөхөөр байсан ч өөр эгнээ рүү орсон бол ухарч зөв эгнээгээ олно.","Төлбөр авах цэгээр өнгөрөхдөө цагт 30 км-ээс ихгүй хурдтай явна."],"a":"2, 4","imgs":["img_0057.jpg"],"t":"사진형","e":"Төлбөрийн цэгт урьдчилан эгнээгээ сонгож түгжрэл, ослоос сэргийлэх ёстой тул хай-пасс (автомат төлбөрийн) төхөөрөмжтэй тээврийн хэрэгсэл зориулалтын эгнээнд урьдчилан орж, бэлэн мөнгө буюу карт ашиглах тээврийн хэрэгсэл холбогдох эгнээ рүү урьдчилан шилжих ёстой. Мөн хай-пасс эгнээ гэдэг нь урд талаа ажиглахаа хайнга хийж болно гэсэн үг биш. Автомашины жолооч тухайн тээврийн хэрэгслийг жолоодож хурдны зам зэргийг хөндлөн гарах, буцаж эргэх буюу ухарч болохгүй (Замын хөдөлгөөний тухай хуулийн 62 дугаар зүйл). Иймд буруу жолоодлогын арга нь ② болон ④ юм."},{"n":742,"b":"Дараах нөхцөлөөс ойлгож болох мэдээлэл болон түүнд тохирох аюулгүй жолоодох аргыг холбосноос буруу 2-ыг сонгоно уу.","c":["Зам дээрх унасан зүйл – Аюулын дохионы гэрэл анивчуулж арын автомашинд аюултай нөхцөл байдлыг мэдэгдэнэ.","1-р эгнээ – Ажлын өдөр суудлын автомашин гүйцэж түрүүлэх зорилгоор ашиглаж болно.","3-р эгнээний өнгөт чиглүүлэх тэмдэглэгээ – Ажлын өдөр автобусны тусгай эгнээ болгон ашиглагддаг.","Амрах зогсоолын тэмдэг – Урд баруун талд удахгүй амрах зогсоол байгааг заана.","Нэг чиглэлд 3 эгнээтэй хурдны зам – Ачааны автомашины жолооч гүйцэж түрүүлэхийн тулд 1-р эгнээгээр явж болно."],"a":"3, 5","imgs":["img_0058.jpg"],"t":"사진형","e":"3 дугаар эгнээнд тэмдэглэсэн ногоон шугам нь эгнээний шугам биш, замын гадаргуугийн өнгөт чиглүүлэх шугам юм. Замын гадаргуугийн өнгөт чиглүүлэх шугам нь автомашины явах чиглэлийг заахын тулд эгнээний яг голд үргэлжлүүлэн зурсан шугам юм. Ачааны автомашин хурдны замын нэг чиглэлд 3 ба түүнээс дээш эгнээтэй замд баруун эгнээ (зураг дээр 3 дугаар эгнээ)-гээр явах ёстой бөгөөд гүйцэж түрүүлэх үед зүүн талын яг хажуугийн эгнээгээр явж болно (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 9])."},{"n":743,"b":"Дараах нөхцөлд хамгийн буруу жолоодох арга 2-ыг сонгоно уу.","c":["Автобусны тусгай эгнээгээр зөвхөн автобус явж болно.","Суудлын автомашин урд явж буй ачааны автомашиныг гүйцэж түрүүлэхийн тулд 1-р эгнээгээр явж болно.","Урд явж буй ачааны автомашинтай хангалттай аюулгүйн зай барьж, унасан зүйлсээс болгоомжилно.","Хувьсах эгнээгээр явж буй автомашин 3-р эгнээ рүү шилжих ёстой.","5 тонн ачааны автомашин Оксан IC гарцаар гарч болохгүй."],"a":"1, 2","imgs":["img_0059.jpg"],"t":"사진형","e":"Ажлын өдрүүдэд Кёнбү хурдны замын автобусны зориулалтын эгнээ нь Осан IC-ээс Ханнам гүүрний өмнөд үзүүр хүртэл л ажилладаг. Ажлын өдрүүдэд энэ хэсгээс бусад Кёнбү хурдны замын 1 дүгээр эгнээ нь автобусны зориулалтын эгнээ биш, хурдны замын 1 дүгээр эгнээ болно. Хурдны замын 1 дүгээр эгнээгээр гүйцэж түрүүлэх гэж буй суудлын автомашин болон гүйцэж түрүүлэх гэж буй хөнгөн, жижиг, дунд оврын олон суудалт автомашин явж болно (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 9]). Гүүрэн дээр гүйцэж түрүүлэхийг хориглосон (Замын хөдөлгөөний тухай хуулийн 22 дугаар зүйлийн 3 дахь хэсгийн 3 дахь заалт)."},{"n":744,"b":"Дараах нөхцөлд буруу жолоодох арга 2-ыг сонгоно уу.","c":["Аажмаар хурдаа бууруулна.","Урд талын зам засварын мэдээллийн автомашинд анхаарна.","Урд автомашинтай хангалттай аюулгүйн зай барина.","Гар утас ашиглахын тулд зам засварын мэдээллийн автомашины ард түр зогсоно.","Амрах зогсоол руу орохгүй байхаар шийдсэн бол зүүн арын харах толийг ажиглан чиг заах дохио өгч 3-р эгнээ рүү шууд шилжинэ."],"a":"4, 5","imgs":["img_0060.jpg"],"t":"사진형","e":"Хурдны замд огцом тоормослох буюу огцом хурд сааруулбал осол гарах эрсдэл их. Аль болох аажмаар хурдаа сааруулж хурдны дээд хязгаарыг баримтлах ёстой. Цагаан үргэлжилсэн шугам нь эгнээ солихыг хязгаарлах утгатай (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] дугаар 503)."},{"n":745,"b":"Дараах нөхцөлд аюулгүй жолоодох арга биш 2-ыг сонгоно уу.","c":["Хувьсах эгнээгээр явж болохгүй.","1 км-ийн цаана манан байнга тогтдог бүс тул анхааран жолоодно.","Хэсгийн хурдны хяналтын эхлэл ойртож байгаа тул хяналтын камерыг тойрон замын захаар явна.","Ачааны автомашин гүйцэж түрүүлэхдээ 2-р эгнээгээр явж болно.","Хурдны зам дээр ачааны автомашины зорчигч аюулгүйн бүсээ бүслэх үүрэггүй."],"a":"3, 5","imgs":["img_0061.jpg"],"t":"사진형","e":"Хурдны замд огцом тоормослох буюу огцом хурд сааруулбал осол гарах эрсдэл их. Автомашин (хоёр дугуйт тээврийн хэрэгслийг оролцуулахгүй)-ы жолооч автомашин жолоодох үед суудлын хамгаалах бүс зүүх ёстой бөгөөд бүх суудлын хамт зорчигчид ч суудлын хамгаалах бүс (нялх, бага насны хүүхдийн хувьд хүүхэд хамгаалах хэрэгсэл суурилуулсны дараах суудлын хамгаалах бүсийг хэлнэ. Энэ зүйл болон 160 дугаар зүйлийн 2 дахь хэсгийн 2 дахь заалтад цаашид мөн адил) зүүлгэх ёстой (Замын хөдөлгөөний тухай хуулийн 50 дугаар зүйлийн 1 дэх хэсэг)."},{"n":746,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Hi-pass эгнээ рүү орсны дараа өөр эгнээ рүү явах бол ухарч зөв эгнээгээ олно.","Hi-pass төхөөрөмжгүй бол Hi-pass эгнээнд заавал зогсож төлбөрөө төлөөд гарна.","Бэлэн мөнгө эсвэл картаар төлбөр төлөх бол урьдчилан тухайн эгнээ рүү чиглэлээ өөрчилнө.","Hi-pass эгнээнд зогсохгүй тул урд явж буй автомашины нөхцөл байдлыг анхаарах шаардлагагүй.","Hi-pass эгнээгээр өнгөрөхдөө цагт 30 км-ээс ихгүй хурдтай явах нь аюулгүй. ■ Хурдны замаар явж байна. ■ Hi-pass эгнээгээр явж байна."],"a":"3, 5","imgs":["img_0062.jpg"],"t":"사진형","e":"Хурдны замд хөндлөн гарах, буцаж эргэх буюу ухарч болохгүй (Замын хөдөлгөөний тухай хуулийн 62 дугаар зүйл). Хай-пасс төхөөрөмж суурилуулаагүй ч хай-пасс эгнээгээр зогсолтгүй өнгөрсний дараа төлбөрийг дараа нь тооцох боломжтой. Хай-пасс эгнээнд зогсдоггүй боловч урд явж буй тээврийн хэрэгсэл огцом хурд сааруулж болзошгүй тул урд талын нөхцөл байдалд анхаарал хандуулан жолоодох ёстой. Хай-пасс эгнээгээр явах үед цагт 30 километрийн доторх хурдаар өнгөрөх нь аюулгүй."},{"n":747,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["1-р эгнээнд зам засварын мэдээллийн автомашин байгаа тул хурдаа нэмэгдүүлэн хурдан явна.","Аажмаар хурдаа бууруулж, урд талын нөхцөл байдлыг анхааран явна.","Аюулын дохионы гэрэл анивчуулж, арын автомашинуудад аюултай нөхцөл байдлыг мэдэгдэнэ.","Зам засварын мэдээллийн автомашинаас зайлсхийхийн тулд 3-р эгнээ рүү огцом шилжинэ.","Зам засварын мэдээллийн автомашинаас илүү хурдны замаар явж буй автомашин давуу эрхтэй тул дуут дохиог тасралтгүй өгөөд үргэлжлүүлэн явна."],"a":"2, 3","imgs":["img_0063.jpg"],"t":"사진형","e":"Хурдны замд автомашин өндөр хурдтай явдаг тул зам дээр ажлын тээврийн хэрэгсэл буюу барилгын ажлын зааварлах тээврийн хэрэгсэл байвал урьдчилан хурдаа сааруулж аюулгүй явах ёстой бөгөөд хажуугийн эгнээ рүү огцом эгнээ солих буюу огцом хурдлах, сааруулахаас зайлсхийх ёстой."},{"n":748,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Ачааны автомашин удаан явдаг тул автомашин хоорондын зайнаас үл хамааран эгнээ сольж болно.","Ачааны автомашины хэвийн хөдөлгөөнд саад учруулж болзошгүй тул аюулгүйн зай барин эгнээ солино.","Эгнээ солихдоо заавал хурдаа хамгийн ихээр нэмэгдүүлнэ.","Ачааны автомашины байрлал болон хурдыг шалгасны дараа анхааралтай эгнээ солино.","Хангалттай аюулгүйн зай байгаа бол чиг заах дохио өгөх шаардлагагүй."],"a":"2, 4","imgs":["img_0064.jpg"],"t":"사진형","e":"Тээврийн хэрэгслийн эгнээг солих гэж буй тохиолдолд солих гэж буй чиглэлээс ирж буй өөр тээврийн хэрэгслийн хэвийн хөдөлгөөнд саад учруулж болзошгүй үед эгнээ сольж болохгүй. Эгнээ солих үед чиг заах дохиог асаах ёстой."},{"n":749,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Хонгил дотор зогсоолд тавихыг хориглодог боловч зориулалтын газарт яаралтай түр зогсож болно.","Хонгил дотор харанхуй байсан ч нарны шилээ тайлалгүй үргэлжлүүлэн явна.","Хонгил дотор цагаан үргэлжилсэн шугамтай байсан ч хоёр талын эгнээний хөдөлгөөн саадгүй бол эгнээ сольж болно.","Хонгил дотор хурдны дээд хязгаар үйлчлэхгүй тул хурдаа нэмэгдүүлэн хурдан гарна.","Хонгилын орчимд салхи гарч болзошгүй тул анхааран хурдаа бууруулна. ■ Нэг чиглэлд 3 эгнээтэй хурдны зам ■ Хонгилын үүд"],"a":"1, 5","imgs":["img_0065.jpg"],"t":"사진형","e":"Хонгил дотор зогсоолд тавихыг хориглосон боловч тодорхой газарт зогсох боломжтой. Хонгил дотор харанхуй бол нарны шил зүүхгүй байх нь зүйтэй бөгөөд хонгил дотор ч хурдны дээд хязгаарыг сахих ба цагаан үргэлжилсэн шугамтай хэсэгт эгнээ солихыг хязгаарладаг. Хонгилын орчимд салхи үлээж болзошгүй тул анхаарч орох ёстой."},{"n":750,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Урд талд автомат хурдны хяналтын төхөөрөмж ажиллаж байгаа тул огцом тоормослон хурдаа бууруулна.","Урьдчилан хурдаа бууруулж, аюулгүйгээр явна.","Эгнээгээ андуурсан бол аюулгүйн бүсийг ашиглан чиглэлээ өөрчилж болно.","Автомат хяналтын төхөөрөмжөөс зайлсхийхийн тулд баруун эгнээ рүү огцом шилжинэ.","Хөдөлгөөний хурдыг цагт 50 км-ээс ихгүй байлгана. ■ Хурдны замын орох, гарах үүдний орчим"],"a":"2, 5","imgs":["img_0066.jpg"],"t":"사진형","e":"Огцом тоормослох, огцом хурд сааруулах, огцом эгнээ солих нь осол гарах эрсдэл ихтэй тул урьдчилан хурдаа сааруулж аюулгүй явна."},{"n":751,"b":"Хаазны дөрөө жолоочийн шалны дэвсэнд тээглэн буцаж ирэхгүйгээс автомашин хурдассан тохиолдолд жолооч аюулгүйгээр зогсох эсвэл хурдыг бууруулах арга 2-ыг сонгоно уу.","c":["Тоормосны дөрөөг бүх хүчээр хүчтэй гишгэнэ.","Аюулын дохионы гэрлийн товчийг тасралтгүй ажиллуулна.","Дуут дохиог чанга дарсаар явна.","Цахилгаан зогсоолын тоормос (EPB)-ыг тасралтгүй ажиллуулна.","Жолооны хүрдийг хүчтэйгээр баруун, зүүн тийш эргүүлнэ."],"a":"1, 4","imgs":["q751.png"],"t":"사진형","e":"Хурдасгуурын дөрөө эд зүйл (дэвсгэр, гадны биет зэрэг)-д хавчуулагдаж тасралтгүй даралттай байсан ч тоормосны дөрөөг гишгэх тохиолдолд тоормосны давуу эрхийн систем (BOS) ажиллаж тоормосны дохиог тэргүүн ээлжинд тавьснаар хурд сааруулах, зогсох боломжтой. Цахилгаан зогсоолын тоормос (EPB) нь яаралтай тоормослох функцтэй тул тасралтгүй ажиллуулах тохиолдолд хурд сааруулах буюу удирдах боломжтой. - Санамсаргүй хурдлах нөхцөлд ч ижил аргаар зогсох буюу хурд сааруулах боломжтой ※ Санамсаргүй хурдлах нөхцөл гэж юу вэ? ∘ Механик гэмтлээс хурдасгуурын дөрөө гацах ∘ Хурдасгуурын дөрөө шалны дэвсгэрт торох ∘ Гадны биет (усны сав, гутал, нойтон салфетка зэрэг) хавчуулагдах зэргээс хурдасгуурын дөрөө буцаж ирэхгүй тохиолдол"},{"n":752,"b":"Дараах бүсийн тухай тайлбараас хамгийн зөв 2-ыг сонгоно уу.","c":["Хүүхдийн хамгаалалтын бүсэд түр зогсох болон зогсоолд тавьж болно.","Хүүхдийн хамгаалалтын бүсэд хамгаалалтын хашлага суурилуулсан бол хүүхэд зорчих хэсэгт орж ирэх боломжгүй тул анхаарах шаардлагагүй.","Зам тээврийн ослын аюулаас хүүхдийг хамгаалахын тулд хүүхдийн хамгаалалтын бүсийг тогтоож болно.","Цас хуримтлагдсан нөхцөлийг харгалзан зөвшөөрөгдсөн хурдыг мөрдөж, хүүхдийн аюулгүй байдалд анхааран явна.","Хүүхдийн хамгаалалтын бүсэд хүүхдүүд өөрсдөө анхаардаг тул осол гарах эрсдэл байхгүй. ■ Хүүхдийн хамгаалалтын бүс"],"a":"3, 4","imgs":["q752.png"],"t":"사진형","e":"Хүүхдийн хамгаалалтын бүс дотор тул хурдны дээд хязгаарыг баримталж, хүүхдийн хөдөлгөөнд анхаарч урд талаа сайтар ажиглах ёстой. Хүүхдийн хамгаалалтын бүс доторх осол нь аюулгүй жолоодлогыг биелүүлээгүй, явган зорчигчийг хамгаалах үүргийг зөрчсөн, хууль бусаар зогсоолд тавьсан, зогссон, гэрлэн дохио зөрчсөн зэрэг хууль дүрэм сахиагүйгээс үүдэлтэй. Мөн явган зорчигч гарах үед заавал түр зогссоны дараа явган зорчигчийн гарах дуусахад аюулгүй байдлыг шалгаж өнгөрөх ёстой."},{"n":753,"b":"Дараахаас хөгжлийн бэрхшээлтэй иргэн, ахмад настан, жирэмсэн эмэгтэй зэрэг иргэдийн хүртээмжийг дэмжих тухай хууль тогтоомжийн дагуу “хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолын ашиглалтад саад учруулах үйлдэл”-д хамаарахгүй 2-ыг сонгоно уу.","c":["Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоол дээр эд зүйл хурааж байрлуулан зогсоол ашиглахад саад учруулах үйлдэл","Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолын урд, хойд болон хоёр хажууд эд зүйл тавих эсвэл автомашин байрлуулж саад учруулах үйлдэл","Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолын зөвшөөрлийн тэмдэггүй автомашиныг хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолд байрлуулах үйлдэл","Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолын шугам болон зориулалтын тэмдэглэгээг арилгах, гэмтээж зогсоол ашиглахад саад учруулах үйлдэл","Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолын зөвшөөрлийн тэмдэгтэй боловч хөдөлгөөний бэрхшээлтэй хүн суугаагүй автомашиныг хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолд байрлуулах үйлдэл"],"a":"3, 5","imgs":["q753.png"],"t":"사진형","e":"Хөгжлийн бэрхшээлтэй хүн, ахмад настан, жирэмсэн эмэгтэй зэрэгт үзүүлэх тав тухыг сайжруулах баталгааны тухай хуулийн 17 дугаар зүйл (Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоол зэрэг) - Хэн ч 2 дахь хэсэгт заасан хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолын тэмдэг наагаагүй автомашиныг хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолд тавьж болохгүй. Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолын тэмдэг наасан автомашинд явахад бэрхшээлтэй хүн суугаагүй тохиолдолд ч мөн адил. - Хэн ч хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолд эд зүйл овоолох буюу түүний нэвтрэх замыг хаах зэргээр зогсоолд тавихад саад учруулах үйлдэл хийж болохгүй. Хөгжлийн бэрхшээлтэй хүн, ахмад настан, жирэмсэн эмэгтэй зэрэгт үзүүлэх тав тухыг сайжруулах баталгааны тухай хуулийг хэрэгжүүлэх журмын 9 дүгээр зүйл (Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолд саад учруулах үйлдэл): Хуулийн 17 дугаар зүйлийн 5 дахь хэсэгт заасан зогсоолд саад учруулах үйлдэл нь дараах заалтын үйлдлүүд байна. 1. Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоол дотор эд зүйл зэргийг овоолж зогсоолд тавихад саад учруулах үйлдэл 2. Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолын урд буюу ард, хоёр хажууд эд зүйл зэргийг овоолох буюу зогсоолд тавих үйлдэл 3. Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолын орох замд эд зүйл зэргийг овоолох буюу зогсоолд тавих үйлдэл 4. Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолын шугам болон хөгжлийн бэрхшээлтэй хүний зориулалтын тэмдэглэгээ зэргийг арилгах буюу гэмтээж зогсоолд тавихад саад учруулах үйлдэл 5. Хөгжлийн бэрхшээлтэй хүний зориулалтын зогсоолд тавихад саад учруулах бусад үйлдэл"},{"n":754,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Явах чиглэлд автомашин байхгүй тул замын баруун талд түр зогсож болно.","Хүүхдийн хамгаалалтын бүс байсан ч хүүхэд байхгүй бол зөвшөөрөгдсөн дээд хурдыг мөрдөх шаардлагагүй.","Аюулгүй байдлын тэмдэгтээр заасан зөвшөөрөгдсөн дээд хурдыг мөрдөнө.","Хүүхэд гэнэт гарч ирж болзошгүй тул орчноо сайтар ажиглан явна.","Хүүхдийн хамгаалалтын бүсээр аль болох хурдтай нэвтэрнэ. ■ Хүүхдийн хамгаалалтын бүс"],"a":"3, 4","imgs":["img_0067.jpg"],"t":"사진형","e":"Хүүхдийн хамгаалалтын бүс дотор тул хурдны дээд хязгаар цагт 30 км-ийн дотор байхыг баримталж, хүүхэд олж харах үед хүүхдийн хөдөлгөөнд анхаарч урд талаа сайтар ажиглах ёстой. Хүүхдийн хамгаалалтын бүс доторх осол нь аюулгүй жолоодлогыг биелүүлээгүй, явган зорчигчийг хамгаалах үүргийг зөрчсөн, хууль бусаар зогсоолд тавьсан, зогссон, гэрлэн дохио зөрчсөн зэрэг хууль дүрэм сахиагүйгээс үүдэлтэй. Мөн явган зорчигч гарах үед заавал түр зогссоны дараа явган зорчигчийн гарах дуусахад аюулгүй байдлыг шалгаж өнгөрөх ёстой."},{"n":755,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Дуут дохиог тасралтгүй өгч хурдан явна.","Урьдчилан хангалттай хурдаа бууруулж, аюулгүй байдалд анхаарна.","Явган явж буй ахмад настан харагдахгүй байсан ч удаан явна.","Боломжтой бол урд автомашины ард маш ойрхон дагаж явна.","Урд явган хүний гарц байгаа тул хурдаа нэмэгдүүлж ахмад настан хамгаалалтын бүсээс хурдан гарна. ■ Ахмад настан хамгаалалтын бүс"],"a":"2, 3","imgs":["img_0068.jpg"],"t":"사진형","e":"Энэ хэсэг нь ахмад настны хамгаалалтын бүс бөгөөд цагт 30 км-ийн дотор хурдаа сааруулан аюулгүй жолоодох ёстой. Мөн явган зорчигч харагдахгүй байсан ч явган хүний гарцад ойртох үед удаан явж явган зорчигч гарч ирэхэд бэлтгэх ёстой. Иймд хамгийн аюулгүй жолоодлогын арга нь урьдчилан хурдаа сааруулж аюулгүй байдалд анхаарах (②) болон ахмад настан харагдахгүй байсан ч удаан явах (③) явдал юм. Эсрэгээр дуут дохиог шаардлагагүй хэрэглэн хурдан явах (①), урд тээврийн хэрэгслийн араас нягт дагах (④), хурдаа нэмж бүсээс гарах гэсэн үйлдэл (⑤) нь бүгд аюулгүй бус жолоодлогын аргад хамаарна."},{"n":756,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Цагт 30 километрээс илүүгүй хурдтай удаан явна.","Урд автомашин байхгүй тул хурдан явна.","Зогсоолд тавьж болохгүй боловч түр зогсож болно.","Явган хүний гарцаар гарахдаа хүүхэд байгаа эсэхээс үл хамааран дуут дохио өгч хурдан явна.","Явган хүний хууль бус хөндлөн гаралтаас сэргийлэх хашлага суурилуулсан байсан ч гэнэт гарч ирж болзошгүй хүүхдэд анхааран жолоодно."],"a":"1, 5","imgs":["img_0069.jpg"],"t":"사진형","e":"Хүүхдийн хамгаалалтын бүс дотор тул хурдны дээд хязгаар цагт 30 км-ийн дотор байхыг баримталж, хүүхдийн хөдөлгөөнд анхаарч урд талаа сайтар ажиглах ёстой. Хүүхдийн хамгаалалтын бүс доторх осол нь аюулгүй жолоодлогыг биелүүлээгүй, явган зорчигчийг хамгаалах үүргийг зөрчсөн, хууль бусаар зогсоолд тавьсан, зогссон, гэрлэн дохио зөрчсөн зэрэг хууль дүрэм сахиагүйгээс үүдэлтэй. Мөн явган зорчигч зам хөндлөн гарах үед заавал түр зогсож, явган зорчигч гарч дууссаны дараа аюулгүй байдлыг шалган өнгөрөх ёстой."},{"n":757,"b":"Дараах нөхцөлд жолооч эсвэл хамт зорчигчид зөрчлийн торгууль эсвэл торгууль ногдуулахгүй үйлдэл 2-ыг сонгоно уу.","c":["Суудлын автомашин урьдчилан цагт 30 километрээс илүүгүй хурдтай болгон хурдаа бууруулсан.","Хөдөлгүүрээ унтраасан хоёр дугуйт тээврийн хэрэгслийг түрж явган хүний замаар явсан.","Хувийн хөдөлгөөнт хэрэгслийн жолооч үлгэр жишээ жолоочийн зааврыг дагаагүй.","Суудлын автомашины жолооч хүүхдийн хамгаалалтын бүсэд автомашинаа зогсоолд тавьсан.","Асран хамгаалагч нь харж байхад хамгаалалтын малгай өмсөөгүй хүүхэд унадаг дугуйгаар явган хүний замаар явсан."],"a":"1, 2","imgs":["img_0070.jpg"],"t":"사진형","e":"Хоёр дугуйт тээврийн хэрэгсэл, моторт унадаг дугуй буюу унадаг дугуйг жолооч нь буугаад түрж буюу өргөж явах тохиолдолд явган зорчигч гэж үздэг тул явган хүний замаар явж болно (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 2 дугаар зүйлийн 1 дэх хэсгийн 6 дахь заалт)."},{"n":758,"b":"Дараах нөхцөлд замын хөдөлгөөний аюулгүй байдлын тэмдгийн талаарх зөв тайлбар 2-ыг сонгоно уу.","c":["Замын гадаргуу дээр тэмдэглэсэн 30 нь тухайн замын хамгийн дээд хурд цагт 30 километр болохыг илэрхийлнэ.","Явган хүний гарцыг зөвхөн цагаан өнгөөр тэмдэглэх ёстой тул шар өнгийн явган хүний гарц нь буруу байгууламж юм.","Зигзаг хэлбэрийн цагаан үргэлжилсэн шугам нь удаан явахыг илэрхийлдэг бөгөөд тухайн хэсэгт эгнээ солих боломжтой.","Тээврийн хэрэгслийн гэрлэн дохионд байрлуулсан заах тэмдэг нь явган хүний гарц байгааг илэрхийлнэ.","Улаан өнгөөр хучсан асфальтыг зөвхөн хүүхдийн хамгаалалтын бүсэд ашигладаг. ■ Хүүхдийн хамгаалалтын бүс"],"a":"1, 4","imgs":["q758.png"],"t":"사진형","e":"Замын гадаргуу дээрх 30 нь хурдны дээд хязгаарыг илэрхийлдэг бөгөөд явган хүний гарцыг хүүхдийн хамгаалалтын бүсэд шар өнгөөр тэмдэглэж болох ба зигзаг хэлбэрийн цагаан үргэлжилсэн шугамын тэмдэглэгээ нь эгнээ солихыг хязгаарлах болон удаан явах гэсэн утгыг нэгэн зэрэг агуулдаг бөгөөд тээврийн хэрэгслийн гэрлэн дохионд тэмдэглэсэн явган хүний гарцын тэмдэг нь урд явган хүний гарц байгааг илэрхийлдэг ба улаан асфальтыг хүүхдийн хамгаалалтын бүсээс гадна ахмад настны хамгаалалтын бүс, хөгжлийн бэрхшээлтэй хүний хамгаалалтын бүсэд ч ашиглаж байна."},{"n":759,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зүүн тийш мурийсан зам тул баруун талд суурилуулсан замын толь ашиглан урд талын нөхцөл байдлыг шалгаж явбал аюулгүй.","Өгсүүр зам тул хамгийн дээд хурдны хязгаарыг бага зэрэг давсан ч хурдаа нэмэгдүүлэн явах нь зүйтэй.","Замын баруун захад шар өнгийн үргэлжилсэн шугам тэмдэглэгдсэн тул зогсоолд тавихыг хориглох боловч түр зогсох боломжтой.","Гэрлэн дохиогүй явган хүний гарц дээр явган зорчигч байхгүй байсан ч гарцын өмнө заавал бүрэн зогсоод хөдөлнө.","Зүүн тийш мурийсан зам дээр төв шугам давсан ч замын зүүн талаар шахаж явах нь аюулгүй. ■ Хүүхдийн хамгаалалтын бүс ■ Зүүн тийш мурийсан өгсүүр зам ■ Эсрэг хөдөлгөөнтэй хоёр эгнээтэй зам"],"a":"1, 4","imgs":["img_0071.jpg"],"t":"사진형","e":"Хүүхдийн хамгаалалтын бүсэд хурдыг цагт 30 км-ийн дотор тогтоож болох бөгөөд хүүхдийн хамгаалалтын бүс доторх гэрлэн дохиогүй явган хүний гарцад явган зорчигчийг хамгаалахын тулд явган зорчигч байгаа эсэхээс үл хамааран заавал түр зогссоны дараа явах ёстой. Зүүн тийш тахирсан замд замын зүүн тал руу явах эрсдэлтэй тул эгнээгээ баримтлан явах бөгөөд шар үргэлжилсэн шугамтай хэсэгт зогсох, зогсоолд тавихыг бүгдийг хориглоно."},{"n":760,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Хүүхдийн хамгаалалтын бүс дуусах хэсэгт хүрэхээс өмнө хурдаа урьдчилан нэмэгдүүлэн явна.","Төв шугамгүй нарийн гудамжинд явган зорчигчийн аюулгүй байдалд онцгой анхаарч жолоодно.","Хүүхдийн хамгаалалтын бүс дууссан хэсгийн явган хүний гарц байсан ч явган зорчигч байгаа эсэхийг шалган удаан явна.","Нар жаргаж байгаа тул урд талын аюулгүй байдлыг шалгахын тулд холын гэрлээ асааж, дуут дохиогоо байнга өгч жолоодно.","Замын баруун талын шар тасархай шугам нь зогсоолд тавихыг зөвшөөрдөг боловч түр зогсохыг хориглодог гэсэн утгатай тул зогсоолд тавьж болно."],"a":"2, 3","imgs":["img_0072.jpg"],"t":"사진형","e":"Хүүхдийн хамгаалалтын бүс дууссан ч туслах замд хурдаа нэмж явахаас зайлсхийх ёстой бөгөөд гэрлэн дохиогүй явган хүний гарцад явган зорчигчийн аюулгүй байдлыг шалган удаан явах ёстой. Нар жаргах үе боловч холын гэрлийг үргэлжлүүлэн асааж жолоодох нь эсрэг талын тээврийн хэрэгсэл болон явган зорчигчийн нүдийг гялбуулж болзошгүй тул зайлсхийх ба шар тасархай шугам нь зогсохыг зөвшөөрөх боловч зогсоолд тавихыг хориглох утгатай."},{"n":761,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Хүүхдийн хамгаалалтын бүс тул явган зорчигч байхгүй байсан ч дуут дохиогоо байнга өгч явна.","Төв шугам даван явж буй тээврийн хэрэгсэл байгаа тул хурдыг бууруулж ослын эрсдэлийг багасгана.","Зүүн талын барилгын зогсоол руу орох үүд байгаа тул төв шугам даван орж болно.","Эсрэг урсгалаар явж буй автобусаас болж харагдах орчин хязгаарлагдсан тул зөрөхөөс өмнө хурдыг улам бууруулж явган зорчигч байгаа эсэхийг шалгана.","Хүүхдийн хамгаалалтын бүс доторх хурд сааруулагч дээр зогсоолд тавихыг хориглодог боловч түр зогсох боломжтой."],"a":"2, 4","imgs":["img_0073.jpg"],"t":"사진형","e":"Хүндэтгэн үзэх шалтгаангүйгээр дуут дохиог тасралтгүй дуугарган явж болохгүй бөгөөд зүүн талын орох зам руу явах гэсэн ч төвийн шугам байгаа тул давж явж болохгүй. Хүүхдийн хамгаалалтын бүс доторх хурд сааруулагч нь явган хүний гарцын үүрэг гүйцэтгэдэггүй. Төвийн шугам давж явж буй тээврийн хэрэгсэл байгаа тохиолдолд хурдаа бууруулж ослын эрсдэлээс зайлсхийх нь аюулгүй бөгөөд зүүн талын автобусны улмаас харагдах байдлыг хангахад хүндрэлтэй тул явган зорчигчийн аюулгүй байдалд онцгой анхаарч явна. Хүүхдийн хамгаалалтын бүсэд зөвшөөрсөн хэсгээс бусад газарт зогсох, зогсоолд тавихыг хориглоно."},{"n":762,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Урд талын тээврийн хэрэгслийн гэрлэн дохио улаан үед баруун эргэх гэж байгаа бол бүрэн зогсолгүйгээр урд талын явган хүний гарцаар гарч болно.","Баруун талын явган хүний гэрлэн дохио ногоон бөгөөд явган зорчигч байгаа тул баруун эргэх гэж байгаа бол явган хүний гарцын өмнө бүрэн зогсоно.","Явган хүний гэрлэн дохио улаан болсон ч явган зорчигч гарцаар гарч байвал дуут дохио өгч яаравчлуулна.","Баруун талын явган хүний гэрлэн дохио ногоон тул тээврийн хэрэгслийн гэрлэн дохионоос үл хамааран зүүн эргэж болно.","Хожимдож зам хөндлөн гарч буй явган зорчигч байж болзошгүй тул аюулгүй байдалд илүү анхаарч жолоодно."],"a":"2, 5","imgs":["img_0074.jpg"],"t":"사진형","e":"Хүүхдийн хамгаалалтын бүс дотор явган хүний гарц байгуулсан газарт явган зорчигчийн аюулгүй байдлын үүднээс илүү анхааралтай жолоодох ёстой бөгөөд гурван өнгийн гэрлэн дохио улаан гэрэлтэй үед баруун эргэхийн тулд урд талын явган хүний гарцад орохын өмнө түр зогссоны дараа баруун эргэх боломжтой. Баруун эргэхэд тааралдах явган хүний гарцын явган зорчигчийн дохионд явган зорчигч байгаа тохиолдолд түүний аюулгүй байдлын үүднээс түр зогсож хүлээх бөгөөд дуут дохио дуугаргаж явган явахыг шахаж болохгүй. Тээврийн хэрэгслийн гэрлэн дохио улаан гэрэлтэй үед зүүн эргэх тохиолдолд гэрлэн дохио зөрчих зөрчил үүснэ."},{"n":763,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Баруун талын нарийн гудамжаас тээврийн хэрэгсэл гарч ирж болзошгүй тул уулзварыг хурдан нэвтэрнэ.","Урд зүүн талд зогсоолд тавьсан гал унтраах машинаас болж харагдах орчин хязгаарлагдсан тул хурдыг бууруулж урд талын нөхцөл байдлыг сайн ажиглана.","Хүүхдийн хамгаалалтын бүсэд явган хүний гарц дээр явган зорчигч байгаа үед л бүрэн зогсоно.","Баруун эргэх гэж байгаа бол баруун талын нарийн гудамжаас гарч ирэх тээврийн хэрэгсэл болон явган зорчигчийг сайн ажиглан хөдөлнө.","Хүүхдийн хамгаалалтын бүсэд бүгд цагт 30 километрийн хамгийн дээд хурдтай тул зөвхөн уг хурдны дотор явбал хангалттай."],"a":"2, 4","imgs":["img_0075.jpg"],"t":"사진형","e":"Хүүхдийн хамгаалалтын бүс доторх гэрлэн дохиогүй явган хүний гарцад явган зорчигч байгаа эсэхээс үл хамааран заавал түр зогсох ёстой (Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 7 дахь хэсэг). Урд зогсоолд тавьсан гал унтраах автомашиныг давж явах тээврийн хэрэгсэлд бэлтгэж жолоодох шаардлагатай. Харагдах байдал хангагдаагүй замд хурдаа нэмж явах нь аюултай бөгөөд баруун эргэх гэж буй тохиолдолд явган зорчигч буюу бусад тээврийн хэрэгслийг сайтар ажиглан жолоодох нь аюулгүй."},{"n":764,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Шүхэр барьсан явган зорчигчийн аюулгүй байдалд илүү анхаарч жолоодно.","Эргэн тойронд явган зорчигч олон байгаа тул хурдаа нэмэгдүүлэн хурдан нэвтэрнэ.","Хүүхдийн хамгаалалтын бүс биш байсан ч сургуулийн өмнөх зам тул явган зорчигчийн аюулгүй байдалд анхаарч явна.","Урд талд гэрлэн дохиогүй уулзвар байгаа бөгөөд баруун, зүүн талын харагдах орчин хязгаарлагдсан тул удаан явна.","Зогсоолд тавьсан тээврийн хэрэгслүүдийн дундаас явган зорчигч гарч ирж болзошгүй тул дуут дохиогоо байнга өгч анхааруулан явна."],"a":"1, 3","imgs":["img_0076.jpg"],"t":"사진형","e":"Хүүхдийн хамгаалалтын бүс биш ч гэсэн явган зорчигч олон зам болон ялангуяа бороотой өдөр шүхрийн улмаас явган зорчигчийн харах хүрээ хязгаарлагддаг тул жолооч явган зорчигчийн аюулгүй байдалд илүү анхаарах ёстой бөгөөд гэрлэн дохиогүй уулзварт эргэн тойрны зогсоолд тавьсан тээврийн хэрэгслийн улмаас харагдах байдал хангагдахгүй тохиолдолд удаан явах биш түр зогссоны дараа орох ба хүндэтгэн үзэх шалтгаангүйгээр дуут дохиог тасралтгүй дуугарган явахаас зайлсхийх ёстой."},{"n":765,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Явган зорчигч байхгүй байсан ч дуут дохиогоо байнга өгч явна.","Баруун талд зогсоолд тавьсан ачааны автомашины ард нарийн гудамж байгаа тул явган зорчигч болон тээврийн хэрэгслийн нөхцөл байдлыг сайн шалгахын тулд бүрэн зогсоод уулзварт орно.","Явган хүний гарц дээр гэрлэн дохио байхгүй тул явган зорчигч байхгүй бол удаан явж шууд гарна.","Урд талд төв шугам даван явж буй тээврийн хэрэгсэл байгаа тул хурдыг бууруулж ослын эрсдэлийг багасгана.","Баруун эргэх гэж байгаа үед баруун талд “Зогс” тэмдэг байгаа боловч тээврийн хэрэгслийн гэрлэн дохио байхгүй тул бүрэн зогсолгүйгээр шууд баруун эргэнэ."],"a":"2, 4","imgs":["img_0077.jpg"],"t":"사진형","e":"Зүүн, баруун талыг харах боломжгүй гэрлэн дохиогүй уулзварт түр зогссоны дараа орох ёстой бөгөөд хүүхдийн хамгаалалтын бүс доторх гэрлэн дохиогүй явган хүний гарцад явган зорчигч байгаа эсэхээс үл хамааран түр зогсох ёстой (Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 7 дахь хэсэг). Урд төвийн шугам давж буй тээврийн хэрэгсэл байгаа тул осол гаргахгүйн тулд хурдаа бууруулж, хүндэтгэн үзэх шалтгаангүйгээр дуут дохиог тасралтгүй дуугарган явахаас зайлсхийх ёстой. \"Зогс\" тэмдэг байгаа тохиолдолд баруун эргэхийн тулд заавал түр зогссоны дараа орох ёстой."},{"n":766,"b":"Дараах зүйлсээс гал түймрийн үндсэн хуулийн дагуу гал унтраах автомашины зориулалтын бүсийн талаарх тайлбараас буруу 2-ыг сонгоно уу.","c":["Гал унтраах ажиллагааг саадгүй явуулахын тулд орон сууцны хороололд байгуулдаг.","Хэн ч зориулалтын бүсэд тээврийн хэрэгслээ зогсоолд тавих, эсвэл зориулалтын бүс рүү нэвтрэхийг саатуулах зэрэг саад учруулах үйлдэл хийж болохгүй.","Орон сууцны барилгын захиалагч нь ямар ч онцгой тохиолдолгүйгээр барилга тус бүрт дор хаяж 1 газарт заавал байгуулах ёстой.","Зурагт үзүүлсэн шиг зогсоолд тавьсан тохиолдолд торгууль ногдуулах объект болно.","Зориулалтын бүсийн тэмдгийг арилгах, гэмтээх үйлдэл нь зориулалтын бүсэд саад учруулах үйлдэлд хамаарахгүй."],"a":"3, 5","imgs":["q766.png"],"t":"사진형","e":"①, ② Гал түймэртэй тэмцэх тухай үндсэн хуулийн 21-2 дугаар зүйл (Гал унтраах автомашины зориулалтын бүс зэрэг) ③ Гал түймэртэй тэмцэх тухай үндсэн хуулийг хэрэгжүүлэх журмын 7-13 дугаар зүйл (Гал унтраах автомашины зориулалтын бүсийг байгуулах шалгуур, арга) ④ Гал түймэртэй тэмцэх тухай үндсэн хуулийг хэрэгжүүлэх журмын 19 дүгээр зүйл (Захиргааны торгууль ногдуулах шалгуур) Хавсралт 3 ⑤ Гал түймэртэй тэмцэх тухай үндсэн хуулийг хэрэгжүүлэх журмын 7-14 дүгээр зүйл (Зориулалтын бүсэд саад учруулах үйлдлийн шалгуур)"},{"n":767,"b":"Гал унтраах автомашин яаралтай дуудлагаар хөдөлгөөнд оролцож байх үед замд саад болсон тээврийн хэрэгсэлд албадан арга хэмжээ авах тухай тайлбараас буруу 2-ыг сонгоно уу.","c":["Гал унтраах ажиллагаанд саад болж буй хууль бусаар зогсоолд тавьсан тээврийн хэрэгслийг шилжүүлж болно.","Гал унтраах ажиллагаанд саад болж буй зогсоолын тэмдэглэгээний дотор зогсоолд тавьсан тээврийн хэрэгслийг зайлуулж болно.","Гал унтраах автомашины хөдөлгөөнд саад болж буй эд зүйлийг зайлуулах буюу шилжүүлж болно.","Албадан арга хэмжээ авсан хууль бусаар зогсоолд тавьсан тээврийн хэрэгслийн жолооч учирсан хохирлын нөхөн төлбөр шаардах боломжтой.","Албадан арга хэмжээ авсан зогсоолын тэмдэглэгээний дотор зогсоолд тавьсан тээврийн хэрэгслийн жолооч хохирол барагдуулахыг шаардах боломжтой."],"a":"4, 5","imgs":["q767.png"],"t":"사진형","e":"Гал түймрийн тухай үндсэн хуулийн 25 дугаар зүйл (Албадан арга хэмжээ зэрэг) ② Гал түймрийн төв газрын дарга, гал түймрийн албаны дарга буюу гал унтраах ангийн дарга хүнийг аврах буюу гал тархахаас сэргийлэхийн тулд яаралтай гэж үзвэл 1 дэх хэсэгт заасан гал түймрийн объект буюу газраас бусад гал түймрийн объект болон газарт 1 дэх хэсэгт заасан арга хэмжээг авч болно. ③ Гал түймрийн төв газрын дарга, гал түймрийн албаны дарга буюу гал унтраах ангийн дарга гал унтраах үйл ажиллагааны тулд яаралтай гарах үед гал унтраах автомашины хөдөлгөөн болон гал унтраах үйл ажиллагаанд саад болох зогсоолд тавьсан буюу зогссон тээврийн хэрэгсэл болон эд зүйл зэргийг зайлуулах буюу шилжүүлж болно. ④ Гал түймрийн төв газрын дарга, гал түймрийн албаны дарга буюу гал унтраах ангийн дарга 3 дахь хэсэгт заасан гал унтраах үйл ажиллагаанд саад болох зогсоолд тавьсан буюу зогссон тээврийн хэрэгслийг зайлуулах буюу шилжүүлэхийн тулд харьяа орон нутгийн засаг захиргаа зэрэг холбогдох байгууллагад чирэгч тээврийн хэрэгсэл, хүн хүч зэргийн дэмжлэг хүсч болох бөгөөд хүсэлт хүлээн авсан холбогдох байгууллагын дарга хүндэтгэн үзэх шалтгаангүй бол үүнд хамтран ажиллах ёстой. ⑤ Аймаг, нийслэлийн Засаг дарга 4 дэх хэсгийн дагуу чирэгч тээврийн хэрэгсэл, хүн хүч зэргээр дэмжлэг үзүүлсэн этгээдэд аймаг, нийслэлийн тогтоолд заасны дагуу зардлыг олгож болно. 49-2 дугаар зүйл (Хохирлын нөхөн төлбөр) 1 дэх хэсгийн 3. 25 дугаар зүйлийн 2 дахь хэсэг буюу 3 дахь хэсэгт заасан арга хэмжээний улмаас хохирол амссан этгээд. Гэхдээ мөн зүйлийн 3 дахь хэсэгт хамаарах тохиолдлын хувьд хууль тогтоомж зөрчиж гал унтраах автомашины хөдөлгөөн болон гал унтраах үйл ажиллагаанд саад болсон тохиолдлыг хасна."},{"n":768,"b":"Дараах нөхцөлд хууль тогтоомжийг зөрчсөн жолоодох арга 2-ыг сонгоно уу.","c":["B жолооч – Цагт 100 километрийн хурдтай явна.","A жолооч – Цагт 70 километрийн хурдтай явна.","B жолооч – Уулзвар дээр гүйцэж түрүүлнэ.","A жолооч – Уулзвар дээр гүйцэж түрүүлнэ.","B жолооч – Урд явж буй тээврийн хэрэгсэлтэй аюулгүйн зай барихгүй."],"a":"2, 4","imgs":["img_0078.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 30 дугаар зүйл (Тусгай зориулалтын тээврийн хэрэгсэлд олгох онцгой эрх): Тусгай зориулалтын тээврийн хэрэгсэлд дараах заалтын зүйлсийг хэрэглэхгүй. Гэхдээ 4 дэх заалтаас 12 дахь заалт хүртэлх зүйлсийг тусгай зориулалтын тээврийн хэрэгслийн дотроос 2 дугаар зүйлийн 22 дахь заалтын \"а\"-аас \"в\" дэд заалт хүртэлх автомашин болон Ерөнхийлөгчийн зарлигаар тогтоосон цагдаагийн автомашинд л хэрэглэхгүй."},{"n":769,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Тусгай зориулалтын тээврийн хэрэгсэл ойртож ирвэл энгийн тээврийн хэрэгслүүд замын баруун эсвэл зүүн талаар шахан орж зам тавьж өгнө.","Тусгай зориулалтын тээврийн хэрэгслийн араас дагаж явбал илүү хурдан зорчих боломжтой тул араас нь дагаж явна.","Баруун талын тусгай зориулалтын тээврийн хэрэгсэл эгнээ солих боломжгүй байхаар хурдаа улам нэмэгдүүлэн явна.","Тусгай зориулалтын тээврийн хэрэгсэл яаралтай үүргээ гүйцэтгээд буцаж явах үед тусгай гэрлэн дохио болон дуут дохио ажиллуулахгүй тул зам тавьж өгөх шаардлагагүй.","Ар талаас тусгай зориулалтын тээврийн хэрэгсэл дагаж ирж байгааг мэдвэл гүйцэж түрүүлэх боломжгүй болгохын тулд хурдаа нэмэгдүүлэн явна."],"a":"1, 4","imgs":["img_0079.jpg"],"t":"사진형","e":"Дуудлагаар явж буй тусгай зориулалтын тээврийн хэрэгслийг олж харсан тохиолдолд уулзварт уулзвараас зайлсхийж зогсож, бусад газарт тусгай зориулалтын тээврийн хэрэгслийг түрүүлж явуулахаар зам тавьж өгөх бөгөөд тусгай зориулалтын тээврийн хэрэгслийн араас дагах буюу гүйцэгдэхгүйн тулд хурдаа нэмж явах нь аюулгүй бус жолоодлогын арга юм."},{"n":770,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зам тавьж өгөх нь зөвхөн 2-р эгнээнд боломжтой тул 1-р эгнээгээр явж байгаа бол арын тусгай зориулалтын тээврийн хэрэгслийг анхаарах шаардлагагүй.","Урд талд уулзвар байгаа бол уулзварыг хаалгүйгээр зам тавьж өгнө.","2-р эгнээ рүү хурдан шилжин орж аюулын дохионы гэрлээ асаагаад тусгай зориулалтын тээврийн хэрэгслээс түрүүлэн явна.","Тусгай зориулалтын тээврийн хэрэгслийн урд явж байгаа бол замын баруун эсвэл зүүн талаар шахан орж зам тавьж өгнө.","Тусгай зориулалтын тээврийн хэрэгслийн араас дагаж явбал илүү хурдан зорчих боломжтой тул өнгөрсний дараа 2-р эгнээ рүү шилжин маш ойрхон дагаж явна."],"a":"2, 4","imgs":["img_0080.jpg"],"t":"사진형","e":"Дуудлагаар явж буй тусгай зориулалтын тээврийн хэрэгслийг олж харвал замын зүүн, баруун тал руу зайлж зогсох буюу уулзвар бол уулзвараас зайлсхийж зам тавьж өгнө. Тусгай зориулалтын тээврийн хэрэгслийн замаар үргэлжлүүлэн явах буюу араас нь дагаж явах нь аюултай бөгөөд заавал 2 дугаар эгнээний баруун тал руу зайлж зам тавьж өгөх шаардлагагүй."},{"n":771,"b":"Дараах нөхцөлд замын хөдөлгөөний аюулгүй байдлын байгууламж болон түүнд тохирсон үйлдлээс хамгийн зөв 2-ыг сонгоно уу.","c":["Явган хүний гарц – Унадаг дугуй унаж гарч болно.","Унадаг дугуйн гарц – Унадаг дугуйн гарцтай замыг хөндлөн гарахдаа унадаг дугуйгаа унан гарна.","Явган хүний гэрлэн дохио – Ногоон гэрэл анивчиж байвал явган зорчигч зам хөндлөн гарахаа хурдан эхлэх ёстой.","Явган хүний гэрлэн дохио – Унадаг дугуйн гэрлэн дохио суурилуулаагүй бол унадаг дугуй явган хүний гэрлэн дохиог дагана.","Тээврийн хэрэгслийн гэрлэн дохио – Унадаг дугуйн гэрлэн дохио суурилуулаагүй бол унадаг дугуй тээврийн хэрэгслийн гэрлэн дохиог дагана."],"a":"2, 4","imgs":["img_0081.jpg"],"t":"사진형","e":"Явган зорчигчийн гэрлэн дохионы дотроос ногоон гэрэл анивчих үед явган зорчигч гарч эхэлж болохгүй бөгөөд гарч буй явган зорчигч түргэн гарч дуусгах буюу гарахаа зогсоож явган хүний зам руу буцаж ирэх ёстой (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 2]). Унадаг дугуй зэргээр явах тохиолдолд унадаг дугуйн явах гэрлэн дохио суурилуулаагүй газарт тээврийн хэрэгслийн гэрлэн дохионы заалтыг дагана. Унадаг дугуйн гарцад унадаг дугуйн гарцын гэрлэн дохио суурилуулаагүй тохиолдолд унадаг дугуй зэрэг нь явган зорчигчийн гэрлэн дохионы заалтыг дагана (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 2])."},{"n":772,"b":"Дараах нөхцөлд хамгийн буруу жолоодох арга 2-ыг сонгоно уу.","c":["Баруун эргэхдээ зогсох шугамын өмнө бүрэн зогсоод баруун эргэнэ.","Баруун эргэхдээ урьдчилан замын баруун захаар удаан явж баруун эргэнэ.","Баруун эргэж буй жолооч дохионы дагуу зогсож эсвэл явж байгаа явган зорчигч болон унадаг дугуй зэрэгт анхаарах ёстой.","Зорчигч буулгах үед түр зогсох төдий учир галын цоргоны өмнө түр зогсож болно.","Хотын доторх замд шөнийн цагаар ч орчин гэрэлтэй байдаг тул урд гэрлээ асаах шаардлагагүй."],"a":"4, 5","imgs":["img_0082.jpg"],"t":"사진형","e":"Бүх тээврийн хэрэгслийн жолооч уулзварт баруун эргэлт хийх гэж буй тохиолдолд урьдчилан замын баруун захаар удаан явж баруун эргэх ёстой. Энэ тохиолдолд баруун эргэж буй тээврийн хэрэгслийн жолооч дохионы дагуу зогсох буюу явж буй явган зорчигч буюу унадаг дугуй зэрэгт анхаарах ёстой (Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйлийн 1 дэх хэсэг). \"Удаан явах\" гэж жолооч тээврийн хэрэгсэл буюу трамвайг нэн даруй зогсоож чадахуйц удаан хурдаар явахыг хэлнэ (Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 28 дахь заалт). Нар жаргаснаас хойш нар мандахаас өмнө бүх тээврийн хэрэгсэл буюу трамвайн жолооч Ерөнхийлөгчийн зарлигаар тогтоосны дагуу урд гэрэл, оврын гэрэл, арын гэрэл болон бусад гэрлээ асаах ёстой (Замын хөдөлгөөний тухай хуулийн 37 дугаар зүйлийн 1 дэх хэсгийн 1 дэх заалт)."},{"n":773,"b":"Дараах нөхцөлд хамгийн буруу жолоодох арга 2-ыг сонгоно уу.","c":["Унадаг дугуйн жолооч унадаг дугуйгаа унасан чигээрээ явган хүний гарцаар гарч болно.","Унадаг дугуйн жолооч хүүхэд бол явган хүний замаар явж болно.","Унадаг дугуйн жолооч хамгаалалтын малгай өмсөх ёстой.","Унадаг дугуйн жолооч шөнийн цагаар замаар явахдаа урд гэрэл, арын гэрлээ асаах эсвэл гэрэл ойлгогч бүс зэрэг гэрэлтэх хэрэгсэл өмсөх ёстой.","Хүүхдийн сургуулийн автобус хүүхдийг суулгах, буулгах зорилгоор замын зүүн талд зогсоолд тавих буюу түр зогсож болно."],"a":"1, 5","imgs":["img_0083.jpg"],"t":"사진형","e":"Унадаг дугуй зэргийн жолооч унадаг дугуйн зам (15 дугаар зүйлийн 1 дэх хэсгийн дагуу зөвхөн унадаг дугуй явахаар байгуулсан зориулалтын эгнээг оролцуулна. Энэ зүйлд цаашид мөн адил) тусдаа байгаа газарт тухайн унадаг дугуйн замаар явах ёстой (Замын хөдөлгөөний тухай хуулийн 13-2 дугаар зүйл-ын 1 дэх хэсэг). Унадаг дугуй зэргийн жолооч унадаг дугуйн зам байгуулаагүй газарт замын баруун захад шахаж явах ёстой (Замын хөдөлгөөний тухай хуулийн 13-2 дугаар зүйл-ын 2 дахь хэсэг). Унадаг дугуй зэргийн жолооч 1 дэх хэсэг болон 13 дугаар зүйлийн 1 дэх хэсгээс үл хамааран хүүхэд, ахмад настан, бие махбодийн бэрхшээлтэй хүнд хамаарах тохиолдолд явган хүний замаар явж болно. Энэ тохиолдолд унадаг дугуй зэргийн жолооч явган хүний замын төвөөс зорчих хэсгийн тал буюу аюулгүйн тэмдэглэгээгээр тогтоосон газраар удаан явах ёстой бөгөөд явган зорчигчийн явахад саад болох үед түр зогсох ёстой (Замын хөдөлгөөний тухай хуулийн 13-2 дугаар зүйл-ын 4 дэх хэсгийн 1 дэх заалт). Унадаг дугуй зэргийн жолооч унадаг дугуйн зам болон «Замын тухай хууль»-ийн дагуух замаар явах үед Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон хүний амь нас хамгаалах хэрэгслийг өмсөх ёстой бөгөөд хамт зорчигчид ч үүнийг өмсүүлэх ёстой (Замын хөдөлгөөний тухай хуулийн 50 дугаар зүйлийн 4 дэх хэсэг). Унадаг дугуй зэргийн жолооч шөнө замаар явах үед урд гэрэл болон арын гэрлээ асаах буюу гэрэлтдэг тууз зэрэг гэрэл цацруулах хэрэгсэл зүүх ёстой (Замын хөдөлгөөний тухай хуулийн 50 дугаар зүйлийн 9 дэх хэсэг). Бүх тээврийн хэрэгслийн жолооч замд зогсох үед зорчих хэсгийн баруун захад зогсох (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын 11 дүгээр зүйлийн 1 дэх хэсгийн 1 дэх заалт)."},{"n":774,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Хөдөө аж ахуйн машин хөдөлгөөнд оролцоогүй бол жолооч онцгой анхаарах зүйл байхгүй.","Хөдөө орон нутгийн замд хурдны хязгаар байхгүй тул хурдаа нэмэгдүүлэн жолоодно.","Замын гадаргуу дээр элс, тоос их байгаа тул үүнд анхаарч жолоодно.","Хөдөө аж ахуйн машинд ойртохоос өмнө бүрэн зогсох эсвэл хурд сааруулах зэрэг аргаар аюулгүйн зай барина.","Хөдөө аж ахуйн машины жолоочид саад болохгүй байхын тулд дуут дохиог огт ажиллуулахгүй. ■ Хөдөө орон нутгийн зам"],"a":"3, 4","imgs":["img_0084.jpg"],"t":"사진형","e":"Хөдөө, загас агнуурын тосгоны зам ч Замын хөдөлгөөний тухай хуулийн дагуух замд хамаарна (Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 1 дэх заалтын \"в\" дэд заалт). Хурдны хязгаарын тэмдэг байхгүй ч ердийн замын хурдны дээд хязгаар нь цагт 60 километр юм (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлийн 1 дэх хэсгийн 1 дэх заалтын \"б\" дэд заалт)."},{"n":775,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Хөдөө орон нутгийн замд хурдны хязгаар байхгүй тул хурдаа нэмэгдүүлэн явна.","Суудлын автомашин болон хөдөө аж ахуйн машины хооронд явах зай байсан ч мотоблок дээр сууж буй хүний аюулгүй байдлыг х ангахын тулд бүрэн зогсоно.","Хөдөө аж ахуйн машинд ойртохоос өмнө бүрэн зогсох эсвэл хурд сааруулах зэрэг аргаар хөдөө аж ахуйн машинаас аюулгүйн зай барина.","Хөдөө аж ахуйн машины жолоочид саад болохгүй байхын тулд дуут дохиог огт ажиллуулахгүй.","Замын баруун, зүүн талын замын хажуугийн хөвөө дээр түр зогсохыг хориглодог боловч зогсоолд тавихыг зөвшөөрдөг тул зогсоолд тавьж болно."],"a":"2, 3","imgs":["img_0085.jpg"],"t":"사진형","e":"Хөдөө, загас агнуурын тосгоны зам ч Замын хөдөлгөөний тухай хуулийн дагуух замд хамаарна (Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 1 дэх заалтын \"в\" дэд заалт). Хурдны хязгаарын тэмдэг байхгүй ч ердийн замын хурдны дээд хязгаар нь цагт 60 километр юм (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлийн 1 дэх хэсгийн 1 дэх заалтын \"б\" дэд заалт). Хөдөө аж ахуйн машин жолоодож байх үед хөдөө аж ахуйн машины дуу чимээ их тул шаардлагатай тохиолдолд дуут дохио хэрэглэж хөдөө аж ахуйн машины жолоочийн анхаарлыг татаж болно."},{"n":776,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Гэрлэн дохио ажиллахгүй байгаа тул уулзварт орохдоо уулзварын нөхцөл байдлыг сайтар шалгаж орно.","Баруун эргэх гэж байгаа бол мотоблокийн зүүн талаар дуут дохио өгч гүйцэж түрүүлнэ.","Мотоблок удаан хурдтай явдаг тул хурдаа нэмэгдүүлж түрүүлэн баруун эргэнэ.","3-р эгнээгээр чигээрээ явах гэж байгаа бол мотоблокийн хөдөлгөөнийг нарийн ажиглан үргэлжлүүлэн явна.","Мотоблок чигээрээ явж болзошгүй тул урьдчилан таамаглаж 2-р эгнээ рүү яаралтай эгнээ сольж чигээрээ явна. ■ Нэг чиглэлд 3 эгнээтэй зам ■ Гэрлэн дохио ажиллахгүй уулзвар ■ Урд явж буй мотоблок"],"a":"1, 4","imgs":["img_0086.jpg"],"t":"사진형","e":"Урд хурд нь удаан гар трактор зэрэг хөдөө аж ахуйн машин байгаа тохиолдолд хурд нь автомашинтай харьцуулахад удаан тул гар тракторын байдлыг сайтар ажиглан жолоодох ёстой. Урьдчилан таамаглаж огцом эгнээ сольж жолоодох буюу гүйцэж түрүүлэхийг оролдох нь аюултай."},{"n":777,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Мотоблокийг гүйцэж түрүүлэхийн тулд төв шугам давж явж болно.","Мотоблок зогсоолд тавьсан тээврийн хэрэгслийг өнгөрсний дараа баруун талын зайг ашиглан өндөр хурдтай гүйцэж түрүүлнэ.","Мотоблокийн жолооч гараараа түрүүлж явахыг дохисон ч аюулгүйн зай баримтлан аюулгүйгээр араас нь дагана.","Мотоблок 2-р эгнээ рүү шилжин зам тавьж өгвөл төв шугам давахгүйгээр мотоблокийн зүүн талаар явна.","Зогсоолд тавьсан тээврийн хэрэгслийн урдаас явган зорчигч гарч ирж болзошгүйг урьдчилан тооцох шаардлагагүй."],"a":"3, 4","imgs":["img_0087.jpg"],"t":"사진형","e":"Урд хурд нь удаан гар трактор зэрэг хөдөө аж ахуйн машин байгаа тохиолдолд хурд нь автомашинтай харьцуулахад удаан тул гар тракторын байдлыг сайтар ажиглан жолоодох ёстой. Урьдчилан таамаглаж жолоодох буюу гүйцэж түрүүлэхийг оролдох нь аюултай. Гар тракторын жолооч гараар дохиж гүйцэж түрүүлэхийг хүссэн ч төвийн шугам давж гүйцэж түрүүлж болохгүй. Баруун талын зайгаар гүйцэж түрүүлэх нь гүйцэж түрүүлэх зөв арга биш."},{"n":778,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Чигээрээ явах гэж байгаа бол урд талын тээврийн хэрэгслийн гэрлэн дохио улаан тул удаан явж урд яваа тээврийн хэрэгслийн ард аюулгүйгээр зогсоно.","Тээврийн хэрэгслийн гэрлэн дохио ногоон болмогц эхлээд одоогийн эгнээгээр явж, хангалттай зай гарсны дараа аюулгүйгээр эгнээ солино.","Зүүн эргэх эгнээ рүү шилжин, гэрлэн дохио ногоон болмогц эсрэг урсгалын эгнээг ашиглан хурдан явна.","Тракторын араас дагаж явах үед тракторыг баруун талаар нь гүйцэж түрүүлж болно.","Буцаж эргэх гэж байгаа бол тээврийн хэрэгслийн гэрлэн дохио улаан байсан ч буцаж эргэж болно."],"a":"1, 2","imgs":["img_0088.jpg"],"t":"사진형","e":"Урд хурд нь удаан гар трактор буюу трактор зэрэг хөдөө аж ахуйн машин байгаа тохиолдолд хурд нь автомашинтай харьцуулахад удаан тул хөдөө аж ахуйн машины явж буй байдлыг сайтар ажиглан жолоодох ёстой. Урьдчилан таамаглаж огцом эгнээ солих буюу гүйцэж түрүүлэхийг оролдох нь аюултай. Гүйцэж түрүүлэхдээ урд тээврийн хэрэгслийн зүүн талаар явах ёстой бөгөөд буцаж эргэх үед заах тэмдгийн дагуу цаг хугацааг баримтлах ёстой."},{"n":779,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Трактор зогссон байгаа тул дуут дохиог байнга өгч хөдөл гэж яаруулна.","Эсрэг урсгалын тээврийн хэрэгсэл өнгөрмөгц төв шугам давж зүүн талаар нь гүйцэж түрүүлнэ.","Баруун талын ачааны автомашин гэнэт хөдөлж болзошгүй тул үүнд бэлтгэлтэй жолоодно.","Тракторын баруун талд зай байвал тэр зайгаар гүйцэж түрүүлнэ.","Трактор автомашинаас удаан явдаг ч хүчээр гүйцэж түрүүлэхээс илүүтэй аюулгүйн зай баримтлан явна."],"a":"3, 5","imgs":["img_0089.jpg"],"t":"사진형","e":"Урд хурд нь удаан гар трактор буюу трактор зэрэг хөдөө аж ахуйн машин байгаа тохиолдолд хурд нь автомашинтай харьцуулахад удаан тул хөдөө аж ахуйн машины явж буй байдлыг сайтар ажиглан жолоодох ёстой. Урьдчилан таамаглаж жолоодох буюу гүйцэж түрүүлэхийг оролдох нь аюултай. Төвийн шугам давж гүйцэж түрүүлэх нь аюултай тул аюулгүй жолоодлогын арга биш."},{"n":780,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Явган хөдөлгөөнд туслах сандалтай цахилгаан хэрэгслийг явган зорчигч гэж үздэг тул хангалттай зай баримтлан явна.","Урд талын ачааны автомашин гүйцэж түрүүлж дуусмагц шууд араас нь дагаж гүйцэж түрүүлнэ.","Урд талын нөхцөл байдлыг харах боломжгүй тул ачааны автомашины араас маш ойрхон дагаж явна.","Явган хөдөлгөөнд туслах сандалтай цахилгаан хэрэгсэл явган хүний замаар явах ёстой тул дуут дохио өгч зүүн талын явган хүний замаар явахыг шаардана.","Аюулын дохионы гэрэл анивчихыг асааж удаан яван, арын тээврийн хэрэгслүүдэд урд талын аюултай нөхцөл байдлыг мэдэгдэнэ."],"a":"1, 5","imgs":["img_0090.jpg"],"t":"사진형","e":"Явган хүний туслах сандалтай тэргэнцэрийг явган зорчигч гэж үздэг боловч явган хүний замыг ашигладаггүй тохиолдол олон тул явган хүний туслах сандалтай тэргэнцэрийг олж харсан тохиолдолд явган зорчигчийг хамгаалдагтай адил аюулгүй байдлыг хангаж өгөх ёстой. Төвийн шугам давж гүйцэж түрүүлэх нь аюултай тул аюулгүй жолоодлогын арга биш бөгөөд урд гүйцэж түрүүлж буй тээврийн хэрэгслийн яг араас дагаж явах нь аюултай."},{"n":781,"b":"Дараах нөхцөлд чигээрээ явах гэж байгаа бол хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Хүүхдийн сургуулийн автобус хөдөлж эхлэх хүртэл уулзварт орохгүй.","Хүүхдийн сургуулийн автобус түр зогссон тул зүүн талаар нь өнгөрнө.","Хүүхдийн сургуулийн автобусны жолоочийн гарын дохионы дагуу зүүн талаар нь өнгөрнө.","Уулзварт орж хүүхдийн сургуулийн автобусны ард хүлээнэ.","Эсрэг талын ачааны автомашины араас явган зорчигч гарч ирж болзошгүйг тооцно."],"a":"1, 5","imgs":["img_0091.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйлийн 3 дахь хэсэг. Тээврийн хэрэгслийн жолооч зам (явган хүний зам, зорчих хэсэг ялгасан замд зорчих хэсгийг хэлнэ)-ын төв (төвийн шугам тэмдэглэсэн тохиолдолд тухайн төвийн шугамыг хэлнэ. Цаашид мөн адил)-ийн баруун талын хэсгээр явах ёстой. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 2. Шар гэрэл анивчих нь «тээврийн хэрэгсэл бусад хөдөлгөөн буюу аюулгүйн тэмдэглэгээний заалтад анхаарч явж болно» гэсэн утгатай тул урд талын хүүхдийн сургуулийн автобус хөдөлж уулзварт орж болох үед ч анхаарал тавьж явах ёстой. Замын хөдөлгөөний тухай хуулийн 51 дүгээр зүйл. ① Хүүхдийн сургуулийн автобус замд зогсож хүүхэд буюу нялх, бага насны хүүхэд суух, буух явцад байгааг илэрхийлэх анивчих гэрэл зэрэг төхөөрөмж ажиллаж байх үед хүүхдийн сургуулийн автобус зогссон эгнээ болон тухайн эгнээний яг хажуугийн эгнээгээр явж буй тээврийн хэрэгслийн жолооч хүүхдийн сургуулийн автобусанд хүрэхийн өмнө түр зогсож аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ② 1 дэх хэсгийн тохиолдолд төвийн шугам тэмдэглээгүй зам болон нэг чиглэлд 1 эгнээтэй замд эсрэг чиглэлээс явж буй тээврийн хэрэгслийн жолооч ч хүүхдийн сургуулийн автобусанд хүрэхийн өмнө түр зогсож аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ③ Бүх тээврийн хэрэгслийн жолооч хүүхэд буюу нялх, бага насны хүүхэд тээвэрлэж байгааг илэрхийлсэн байдлаар замаар явж буй хүүхдийн сургуулийн автобусыг гүйцэж түрүүлж болохгүй."},{"n":782,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Унадаг дугуйн жолоочид холын гэрлээр анхааруулж хурдан өнгөрнө.","Унадаг дугуйн жолооч зориулалтын бус газраар зам хөндлөн гарч болзошгүй тул анхаарч удаан явна.","Унадаг дугуй нь тээврийн хэрэгсэл тул одоо байгаа газартаа зогсоно гэж таамаглан уулзварыг нэвтэрнэ.","Унадаг дугуйн жолооч аюултай үйлдэл хийхээс сэргийлэхийн тулд дуут дохиог давтан өгч хурдан өнгөрнө.","Унадаг дугуйн жолооч зорчих хэсэг дээр байгаа тул хажуугийн аюулгүйн зайг ханган явна."],"a":"2, 5","imgs":["img_0092.jpg"],"t":"사진형","e":"Аюулыг урьдчилан таамаглах. Замын хөдөлгөөний тухай хуулийн дагуу шууд үргэлжлүүлэн явах нь зөрчил гэж хэлж болохгүй. Гэхдээ асуултын нөхцөлд уулзвараар явж буй тээврийн хэрэгсэл байхгүй тул унадаг дугуйн жолооч бусад тээврийн хэрэгсэл орж ирэхийг таамаглалгүй зөвшөөрөлгүй газраар гарах магадлал өндөр. Мөн зөвшөөрөлгүй газраар гараагүй ч уулзварыг өнгөрсөн цэгийн унадаг дугуй нь 2 дугаар эгнээний талд байрлаж байгаа тул уулзварыг өнгөрөх жолооч тухайн унадаг дугуйн хажуу тал руу ч аюулгүй зай гарган удаан явах нь аюулгүй жолоодлогын арга гэж хэлж болно."},{"n":783,"b":"Дараах нөхцөлд уулзварыг нэвтрэх гэж байгаа үед урьдчилан таамаглах аюул 2-ыг сонгоно уу.","c":["3-р эгнээний цагаан өнгийн тээврийн хэрэгсэл баруун эргэж болзошгүй.","2-р эгнээний цагаан өнгийн тээврийн хэрэгсэл 1-р эгнээ рүү огцом эгнээ сольж болзошгүй.","Гүүрэн байгууламжийн доороос зориулалтын бус газраар зам хөндлөн гарах явган зорчигч гарч ирж болзошгүй.","Явган хүний гарцыг оройтож гарах гэж буй явган зорчигчийн төлөө бүрэн зогсоно.","Арын тээврийн хэрэгсэл миний урдуур гүйцэж түрүүлж болзошгүй."],"a":"2, 3","imgs":["q783.png"],"t":"사진형","e":"Зам дээр гүүрний тулгуур багана суурилуулсан орчин тул гүүрний тулгуур баганын зүүн, баруун талаас орж ирэх хоёр дугуйт тээврийн хэрэгсэл болон явган зорчигч зэрэг аюулыг урьдчилан таамаглан жолоодох ёстой."},{"n":784,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Ногоон гэрэл тул хурдаа нэмэгдүүлэн уулзварыг хурдан чигээрээ нэвтэрнэ.","Аюулын дохионы гэрэл анивчихыг асааж ойр орчмын тээврийн хэрэгслүүдэд мэдэгдэн 2-р эгнээнээс баруун эргэнэ.","Урд талын 3-р эгнээнээс гэнэт зүүн тийш эгнээ сольж болзошгүй тээврийн хэрэгсэлд анхаарч жолоодно.","Арын тээврийн хэрэгсэл хэт ойрхон дагаж байгаа тул аюулгүйн зай гаргахын тулд хурдаа огцом нэмэгдүүлж уулзварыг хурдан нэвтэрнэ.","Уулзвар орчмын нөхцөл байдлыг нүдээрээ шалган аажмаар хурдаа нэмэгдүүлэн нэвтэрнэ."],"a":"3, 5","imgs":["img_0094.jpg"],"t":"사진형","e":"1 дүгээр эгнээ буюу 3 дугаар эгнээний урд талаас 2 дугаар эгнээ рүү гэнэт эгнээ сольж шулуун явах тээврийн хэрэгсэл байж болох бөгөөд 1, 3 дугаар эгнээнд зогсож буй тээврийн хэрэгслийн улмаас уулзварын зүүн буюу баруун талын замын нөхцөл байдлыг шалгахад хүндрэлтэй тул гэрлэн дохио зөрчиж явж буй тээврийн хэрэгслийг олж харахад хэцүү. Иймд дохио солигдсоны дараахан удаан явангаа уулзварын нөхцөл байдлыг нүдээр шалгаж өнгөрөх дадал хэвшүүлэх нь зүйтэй. Мөн баруун эргэх гэж буй тохиолдолд баруун эргэлтийн эгнээнээс дарааллаар баруун эргэх нь аюулгүй жолоодлогын арга юм. Цагаан үргэлжилсэн эгнээний шугам дээр эгнээ сольж болохгүй."},{"n":785,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Гэрэл солигдсон даруйд хурдаа огцом нэмэгдүүлж уулзварыг хурдан нэвтэрнэ.","Зүүн чиг заах дохиогоо асааж бусад тээврийн хэрэгсэлд анхааран зүүн эргэнэ.","Уулзвар дотор огцом хурдлан баруун тийш эгнээ сольж нэвтэрнэ.","Зүүн эргэж буй цагаан суудлын автомашин яагаад зогсож байгааг бодож, удаан яван аюулд бэлтгэлтэй байна.","Дохио зөрчин явж буй тээврийн хэрэгсэл байгаа эсэхийг баруун, зүүн талаас шалган аажмаар хурдаа нэмэгдүүлэн нэвтэрнэ."],"a":"4, 5","imgs":["q785.png"],"t":"사진형","e":"Жолооч уулзварт зүүн буюу баруун эргэхийн тулд урьдчилан зүүн, баруун эргэлтийн эгнээнд орж зүүн, баруун эргэх ёстой. Уулзварт ногоон болон зүүн эргэлтийн дохио нэгэн зэрэг солигдсоны дараахан 1 дүгээр эгнээнээс түрүүлж хөдөлсөн зүүн эргэж буй тээврийн хэрэгслийн жолооч тоормос гишгэж байгаагийн шалтгаан нь зүүн талын замаас гэрлэн дохио зөрчиж буй тээврийн хэрэгсэл зэрэг аюулын хүчин зүйл үүссэн гэсэн үг тул 2 дугаар буюу 3 дугаар эгнээний тээврийн хэрэгсэл удаан явангаа аюулын хүчин зүйлд бэлтгэх ёстой бөгөөд мөн уулзвар, хонгил дотор, гүүрэн дээр бусад тээврийн хэрэгслийг гүйцэж түрүүлж болохгүй."},{"n":786,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Хөдөлгөөнийг саадгүй болгохын тулд улаан гэрэл дээр урьдчилан зогсох шугам давж хүлээгээд зүүн эргэнэ.","Эсрэг талын замаас баруун эргэж буй улаан өнгийн тээврийн хэрэгсэлд анхаарах шаардлагагүй, учир нь зүүн эргэх тээврийн хэрэгсэл давуу эрхтэй.","Тээврийн хэрэгслийн сохор бүсийн улмаас хоёр дугуйт тээврийн хэрэгслийг түр хугацаанд харахгүй өнгөрөөж болзошгүй тул анхаарна.","Уулзварын замын гадаргуу дээрх цагаан өнгийн хөдөлгөөн чиглүүлэх шугамыг дагаж зүүн эргэнэ.","Зүүн эргэхдээ баруун чиг заах дохиогоо асааж, зүүн талын замын 3-р эгнээ рүү шууд орно."],"a":"3, 4","imgs":["img_0096.jpg"],"t":"사진형","e":"Жолооч уулзварын нөхцөл байдлыг үргэлж нүдээр шалгах дадалтай байх ёстой бөгөөд зүүн эргэх үед эсрэг талын замаас баруун эргэж буй тээврийн хэрэгсэлд ч анхаарах ёстой. Зүүн эргэх үед хөдөлгөөний чиглүүлэх шугамыг баримтлан 1 дүгээр эгнээнээс хөдөлбөл зүүн талын замын 1 дүгээр эгнээ рүү, 2 дугаар эгнээнээс хөдөлбөл зүүн талын замын 2 дугаар эгнээ рүү орох нь аюулгүй зүүн эргэлтийн арга юм. Зүүн талын замд орсны дараа дарааллаар цагаан тасархай эгнээний шугам дээр эгнээ солих ёстой. Мөн эргэх үед тээврийн хэрэгслийн A баганын улмаас үүсэх үл үзэгдэх бүсээс болж хоёр дугуйт тээврийн хэрэгсэл буюу явган зорчигчийг агшин зуур харахгүй өнгөрч болзошгүйг ч үргэлж анхаарах ёстой. Эсрэгээр нь бодвол хоёр дугуйт тээврийн хэрэгслийн жолооч буюу автомашины жолооч байхдаа ч бусад тээврийн хэрэгсэл намайг үргэлж харж чадна гэсэн бодол буруу тул зогсох шугамыг баримтлах зэрэг замын хөдөлгөөний дүрмийг сахидаг жолооч байх ёстой."},{"n":787,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Илүү олон тээврийн хэрэгсэл уулзвараар нэвтрүүлэхийн тулд урд тээврийн хэрэгсэлдээ аль болох ойрхон явна.","Урд талын 3-р эгнээнээс гэнэт зүүн тийш эгнээ сольж болзошгүй тээврийн хэрэгсэлд бэлтгэлтэй байна.","Урд талын түгжрэлийг үл харгалзан уулзварт орж хөдөлгөөнийг саадгүй болгоно.","Аюулын дохионы гэрэл анивчихыг асааж эсрэг урсгалын хоосон 1-р эгнээгээр аюулгүйгээр гүйцэж түрүүлэн чигээрээ явна.","Түгжрэлийн улмаас ногоон гэрэл дээр уулзварыг нэвтэрч амжихгүй гэж үзвэл зогсох шугамын өмнө зогсоно."],"a":"2, 5","imgs":["img_0097.jpg"],"t":"사진형","e":"Уулзварын зогсохыг хориглох бүсийн тэмдэглэгээ нь хөдөлгөөн ихтэйгээс байнгын түгжрэл үүсдэг газарт байдаг. Ногоон дохио байсан ч араас нь залгуулан хүчээр өнгөрөх гэж байгаад уулзвар дотор түгжирч бусад тээврийн хэрэгслийн урсгалд саад болж болохгүй. Орох гэж буй уулзварт түгжрэл үүсэх нь таамаглагдвал зогсох шугамын өмнө зогсож дараагийн ногоон дохионд хөдөлдөг тайван жолооч байцгаая. Урд талын 3 дугаар эгнээнээс хоосон 2 дугаар эгнээ рүү яаран эгнээ солих тээврийн хэрэгсэлд ч анхаарах шаардлагатай."},{"n":788,"b":"Дараах нөхцөлд зүүн эргэх гэж байна. Хамгийн аюултай жолоодох арга 2-ыг сонгоно уу.","c":["Аюулын дохионы гэрэл анивчихыг асааж, аюулгүйн бүсээр дайран 1-р эгнээнд орсны дараа зүүн эргэнэ.","Зүүн эргэх эгнээнд орсны дараа урд тээврийн хэрэгсэлдээ аль болох ойрхон явж хурдан зүүн эргэнэ.","1-р эгнээ рүү эгнээ солих үед араас дагаж буй тээврийн хэрэгсэлд анхаарна.","Цагаан тасархай шугамтай хэсгээр 1-р эгнээ рүү эгнээ сольсны дараа зүүн эргэнэ.","Зүүн эргэх эгнээ рүү эгнээ солих үед яг урд талын тээврийн хэрэгсэлд анхаарах шаардлагатай."],"a":"1, 2","imgs":["img_0098.jpg"],"t":"사진형","e":"Аюулгүйн арлын тэмдэглэгээ нь зам дээр саад байгаа буюу аюулгүй байдлыг хангах шаардлагатай аюулгүйн арал бөгөөд энэ бүсэд орж болохгүйг тэмдэглэдэг. Иймд аюулгүйн арлаар дайран өнгөрч жолоодож болохгүй. Мөн эгнээ солих үед чиг заах дохиог урьдчилан асааж, урд, хойд, зүүн, баруун талаа шалгаж, цагаан тасархай эгнээний шугам дээр солих ёстой. Мөн эгнээ солих үед яг урд буюу хойд тээврийн хэрэгсэл миний тээврийн хэрэгслээс түрүүлж яаран эгнээ солих тохиолдол ч байдаг тул урд, хойд тээврийн хэрэгсэлд ч анхаарах ёстой. Зүүн эргэлт болон буцаж эргэхийг нэгэн зэрэг хийж болох эгнээний хувьд урд тээврийн хэрэгсэл буцаж эргэж ч болзошгүй тул аюулгүй зайг хангангаа зүүн эргэх хамгаалалтын жолоодлого ч шаардлагатай."},{"n":789,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Тээврийн хэрэгслийн хөдөлгөөнд саад учруулахгүй байхын тулд дуут дохиог үргэлжлүүлэн ашиглана.","B тээврийн хэрэгслийн зүүн талаар явах болно гэж таамаглан хэвээр үргэлжлүүлэн явна.","B-ийн зам хөндлөн гарахад саад учруулахгүйн тулд зам хөндлөн гарч дуусах хүртэл зогсоно.","Зам биш газар бол тээврийн хэрэгслийн хөдөлгөөн давуу эрхтэй тул B-ийг зам хөндлөн гаргахгүй байхын тулд дуут дохио өгнө.","B-ийн хажуугаар өнгөрөх тохиолдолд хангалттай аюулгүйн зай баримтлан удаан явна."],"a":"3, 5","imgs":["img_0099.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 6 дахь хэсэг. Бүх тээврийн хэрэгслийн жолооч дараах заалтын аль нэгэнд хамаарах газарт явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явах ёстой бөгөөд явган зорчигчийн хөдөлгөөнд саад болох үед удаан явах буюу түр зогсож, явган зорчигчийг аюулгүй зорчих боломжоор хангах ёстой. 1. Явган хүний зам ба зорчих хэсэг нь тусгаарлагдаагүй замын дотроос төвийн шугамгүй зам 2. Явган зорчигчийн давуу эрхтэй зам 3. Замаас бусад газар"},{"n":790,"b":"Дараах нөхцөлд хамгийн аюулгүйгээр буцаж эргэх арга 2-ыг сонгоно уу.","c":["Буцаж эргэхийг зөвшөөрсөн дохионы үед цагаан тасархай шугамтай буцаж эргэх бүс дотор урд байгаа тээврийн хэрэгслээс эхлэн дарааллаар нь буцаж эргэнэ.","Зүүн талын туслах замаас үндсэн зам руу нийлж баруун эргэж буй тээврийн хэрэгсэлд анхаарах шаардлагагүй.","Эсрэг талын замын тээврийн хэрэгсэлд саад болохгүй бол дохионоос үл хамааран хэзээ ч буцаж эргэж болно.","Миний тээврийн хэрэгслийн яг ард эхэлж буцаж эргэж буй тээврийн хэрэгсэлд анхаарах шаардлагагүй.","Эсрэг талын замаас дохио зөрчин чигээрээ явж буй тээврийн хэрэгсэл байж болзошгүй тул нүдээрээ шалгаж буцаж эргэнэ."],"a":"1, 5","imgs":["img_0100.jpg"],"t":"사진형","e":"Зүүн эргэлтийн дохионы үед буцаж эргэж болох уулзвар бөгөөд зүүн эргэлтийн дохио солигдсоны дараахан эсрэг талын замаас гэрлэн дохио зөрчиж шулуун явах тээврийн хэрэгсэл болон эсрэг талын туслах замаас баруун эргэнгээ гол зам руу яаран орох тээврийн хэрэгслээс үүдэх аюулд ч бэлтгэх ёстой. Иймд буцаж эргэх боломжтой дохио болж солигдсон ч эргэн тойрноо өөрөө нүдээр шалгангаа дарааллаар буцаж эргэх бөгөөд буцаж эргэх дохионд буцаж эргэх үед ч миний тээврийн хэрэгслийн урд, хойд тээврийн хэрэгсэлд анхаарах шаардлагатай."},{"n":791,"b":"Дараахтай адил уулзварт баруун эргэх гэж байна. Хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Уулзварын зогсох шугамын өмнө бүрэн зогсолгүйгээр удаан явж баруун эргэнэ.","Уулзварын өмнөх гэрлэн дохиотой явган хүний гарц дээр явган зорчигч байгаа эсэхийг заавал шалгана.","Зүүн талын замаас баруун талын зам руу чигээрээ явж буй тээврийн хэрэгслийг заавал шалгах шаардлагагүй.","Баруун талын хажуугийн толинд харагдаж байгаа араас дагаж буй хоёр дугуйт тээврийн хэрэгсэлд анхаарна.","Баруун эргэсний дараах гэрлэн дохиотой явган хүний гарц дээрх явган зорчигчийг заавал шалгах шаардлагагүй."],"a":"2, 4","imgs":["q791.png"],"t":"사진형","e":"Тээврийн хэрэгслийн дохионы дотроос улаан дохионы утга нь тээврийн хэрэгсэл зогсох шугам, явган хүний гарц болон уулзварын яг өмнө зогсох ёстой гэсэн үг. Тээврийн хэрэгсэл баруун эргэх гэж буй тохиолдолд зогсох шугам, явган хүний гарц болон уулзварын яг өмнө зогссоны дараа дохионы дагуу явж буй бусад тээврийн хэрэгслийн хөдөлгөөнд саад учруулахгүйгээр баруун эргэж болно. Гэсэн хэдий ч тээврийн хэрэгсэл баруун эргэлтийн гурван өнгийн гэрлэн дохио улаан гэрэлтэй тохиолдолд баруун эргэж болохгүй. Иймд уулзварын яг өмнөх зогсох шугам дээр түр зогссоны дараа явган хүний гарцад явган зорчигч байгаа эсэх болон явган зорчигчийн дохио асаж байгаа эсэхийг заавал шалгах ёстой бөгөөд баруун эргэсний дараахан явган хүний гарцын явган зорчигч зэрэгт ч анхаарах ёстой. Мөн баруун талын хажуугийн толинд харагдах хоёр дугуйт тээврийн хэрэгсэл явган хүний зам ба миний тээврийн хэрэгслийн хооронд хүчээр явж шулуун явах тохиолдол ч байдаг тул баруун талын чиг заах дохиог урьдчилан асаах зэргээр бэлтгэх шаардлагатай. Мөн баруун эргэх үед зүүн талын замаас шулуун явж буй тээврийн хэрэгсэл буюу эсрэг талын замаас зүүн эргэж буй тээврийн хэрэгсэл зэрэгт ч анхаарах шаардлагатай."},{"n":792,"b":"Дараах нөхцөлд баруун эргэх үед хамгийн аюултай жолоодох арга 2-ыг сонгоно уу.","c":["Зогсох шугамын өмнө зогсоод баруун эргэх гурван өнгийн гэрлэн дохио явах дохио болох хүртэл хүлээнэ.","Баруун эргэх гурван өнгийн гэрлэн дохио ногоон суман дохио болсны дараа ч урд талын нөхцөл байдлыг шалгаж баруун эргэнэ.","Баруун эргэх гурван өнгийн гэрлэн дохио улаан байсан ч явган зорчигч байхгүй бол түр зогсоод аажмаар баруун эргэнэ.","Баруун эргэсний дараа шууд гарч ирэх баруун талын замын явган хүний гарцад анхаарах шаардлагагүй.","Баруун талын явган хүний замаас гэнэт явган хүний гарц руу гүйн гарч ирж болзошгүй явган зорчигчид анхаарна"],"a":"3, 4","imgs":["img_0101.jpg"],"t":"사진형","e":"Тээврийн хэрэгслийн дохионы дотроос улаан дохионы утга нь тээврийн хэрэгсэл зогсох шугам, явган хүний гарц болон уулзварын яг өмнө зогсох ёстой гэсэн үг. Тээврийн хэрэгсэл баруун эргэх гэж буй тохиолдолд зогсох шугам, явган хүний гарц болон уулзварын яг өмнө зогссоны дараа дохионы дагуу явж буй бусад тээврийн хэрэгслийн хөдөлгөөнд саад учруулахгүйгээр баруун эргэж болно. Гэсэн хэдий ч тээврийн хэрэгсэл баруун эргэлтийн гурван өнгийн гэрлэн дохио улаан гэрэлтэй тохиолдолд баруун эргэж болохгүй. Иймд уулзварын баруун эргэлтийн гурван өнгийн гэрлэн дохио улаан дохиотой тохиолдолд зогсох шугамын өмнө зогсож ногоон сумтай дохио болж солигдох хүртэл хүлээх ёстой. Мөн баруун талын явган хүний зам буюу хажууд зогсож буй тээврийн хэрэгслийн урд, хойд хоорондоос үсрэн гарч болзошгүй явган зорчигч болон баруун эргэсний дараахан тааралдах явган хүний гарцад явган зорчигч байгаа эсэхэд ч анхаарах шаардлагатай."},{"n":793,"b":"Дараах замаар зорчих гэж байгаа үед хамгийн зөв жолоодох арга 2-ыг сонгоно уу.","c":["Хүүхдийн сургуулийн автобус баруун тийш эгнээ сольж болзошгүй тул хурдаа бууруулж аюулгүйн зай баримтална.","Хүүхдийн сургуулийн автобус тоормослон хурд сааруулж байгаа тул гүйцэж түрүүлэх журмын дагуу аюулгүйгээр гүйцэж түрүүлнэ.","3-р эгнээнд явж буй цахилгаан кик скүүтерт анхаарч эгнээ сольж баруун талаар гүйцэж түрүүлнэ.","Хүүхдийн сургуулийн автобусны урд тал харагдахгүй байгаа тул эгнээ солихгүйгээр хурдаа бууруулж аюулгүйн зай баримтална.","Хүүхдийн сургуулийн автобусны жолоочид хамгийн бага хурдны ш аардлага зөрчиж байгааг мэдэгдэхийн тулд дуут дохио хэрэглэнэ."],"a":"1, 4","imgs":["q793.png"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 51 дүгээр зүйл (Хүүхдийн сургуулийн автобусыг тусгайлан хамгаалах) ① Хүүхдийн сургуулийн автобус замд зогсож хүүхэд буюу нялх, бага насны хүүхэд суух, буух явцад байгааг илэрхийлэх анивчих гэрэл зэрэг төхөөрөмж ажиллаж байх үед хүүхдийн сургуулийн автобус зогссон эгнээ болон тухайн эгнээний яг хажуугийн эгнээгээр явж буй тээврийн хэрэгслийн жолооч хүүхдийн сургуулийн автобусанд хүрэхийн өмнө түр зогсож аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ② 1 дэх хэсгийн тохиолдолд төвийн шугам тэмдэглээгүй зам болон нэг чиглэлд 1 эгнээтэй замд эсрэг чиглэлээс явж буй тээврийн хэрэгслийн жолооч ч хүүхдийн сургуулийн автобусанд хүрэхийн өмнө түр зогсож аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ③ Бүх тээврийн хэрэгслийн жолооч хүүхэд буюу нялх, бага насны хүүхэд тээвэрлэж байгааг илэрхийлсэн байдлаар замаар явж буй хүүхдийн сургуулийн автобусыг гүйцэж түрүүлж болохгүй. Автомашин болон автомашины эд ангийн чанар, стандартын тухай дүрэм. 48 дугаар зүйл (Гэрлийн талаарх бусад шалгуур)-ийн 4 дэх хэсэг. Хүүхэд тээвэрлэх олон суудалт автомашинд дараах заалтын шалгуурт нийцсэн заагч гэрэл суурилуулах ёстой. 5 дахь заалт. Замд зогсох буюу хөдлөх гэж буй үед дараах дэд заалтын шалгуурт нийцсэн байх. Замд зогсох гэж буй үед шар заагч гэрэл буюу хув өнгийн заагч гэрэл анивчихаар жолооч ажиллуулж чадахуйц байх. Хүүхдийн сургуулийн автобусны шар анивчих гэрэл ажиллаж буй байдалтай тул хүүхдийн сургуулийн автобус замын баруун захад зогсох гэж буй явц байж болзошгүй. Иймд хүүхдийн сургуулийн автобусны хурд таамаглаж байснаас өөрөөр огцом саарч болзошгүй нөхцөл байдал юм. Мөн хүүхдийн сургуулийн автобусны өндрөөс болж урд талын харагдах байдал хязгаарлагдсан байдалтай тул урд талын замын хөдөлгөөний нөхцөл байдал аюулгүй байх болно гэсэн таамаглалаас зайлсхийх ёстой."},{"n":794,"b":"Дараах нөхцөлд хамгаалалтгүй зүүн эргэлт хийх үед хамгийн том эрсдэлт хүчин зүйл 2-ыг сонгоно уу.","c":["Эсрэг талын 2-р эгнээгээр өндөр хурдтай чигээрээ ирж буй тээврийн хэрэгсэл байж болзошгүй.","Эсрэг талын 1-р эгнээнд байгаа ачааны автомашины ард зүүн эргэхээр зогссон тээврийн хэрэгсэл байж болзошгүй.","Араас дагаж буй тээврийн хэрэгсэл гэнэт 2-р эгнээ рүү эгнээ сольж болзошгүй.","Зүүн талын замын явган зорчигч явган хүний гарцаар гарч б олзошгүй.","Эсрэг талын 1-р эгнээнээс ачааны автомашин хамгаалалтгүй зүүн эргэлт хийж болзошгүй."],"a":"1, 4","imgs":["q794.png"],"t":"사진형","e":"Хамгаалалтгүй зүүн эргэлт хийх үед эсрэг талын замаас ногоон дохионд явж буй шулуун явах тээврийн хэрэгсэлд анхаарах ёстой бөгөөд тухайн тээврийн хэрэгслийн хурд бодсоноос хурдан байж болох ба эсрэг талын 1 дүгээр эгнээний олон суудалт автомашины улмаас 2 дугаар эгнээгээр давхиж ирэх шулуун явах тээврийн хэрэгслийг харахгүй байж болзошгүй. Мөн зүүн талын замд явган хүний гарц байгаа тохиолдолд явган явж буй явган зорчигч зэрэгт анхаарах ёстой."},{"n":795,"b":"Дараах замын нөхцөлд хамгийн аюултай хүчин зүйл 2-ыг сонгоно уу.","c":["Өөрийн явах чиглэлийн 1-р эгнээнээс хурдан зүүн эргэж буй тээврийн хэрэгсэлтэй мөргөлдөж болзошгүй.","Баруун талын замаас баруун эргэж буй тээврийн хэрэгсэлтэй мөргөлдөж болзошгүй.","Эсрэг талын замаас баруун эргэж буй тээврийн хэрэгсэлтэй мөргөлдөж болзошгүй.","Эсрэг талын замаас буцаж эргэж буй тээврийн хэрэгсэлтэй мөргөлдөж болзошгүй.","Өөрийн явах чиглэлийн 3-р эгнээний ар талаас баруун эргэх гэж буй тээврийн хэрэгсэлтэй мөргөлдөж болзошгүй."],"a":"2, 4","imgs":["q795.png"],"t":"사진형","e":"Гэрлэн дохио шар эсвэл улаан болж солигдоход жолооч уулзварыг хурдан гарахын тулд хурдаа нэмдэг бөгөөд энэ үед баруун талын замаас хүчээр баруун тийш эргэж буй автомашинтай осолдох магадлалтай. Мөн эсрэг талын замд зүүн эргэлтийн дохио асна гэж бодоод уулзварт урьдчилан орж ирэх буюу зүүн эргэлтийн дохио солигдсоны дараа огцом хөдөлж буй зүүн тийш эргэх автомашинтай ч мөргөлдөж болзошгүй, мөн эсрэг талын замаас буцаж эргэж буй тээврийн хэрэгсэлтэй ч мөргөлдөж болно. Гэрлэн дохио зөрчиж шулуун явж буй тээврийн хэрэгсэлд эсрэг талын замын зүүн тийш эргэх автомашин халхалснаас буцаж эргэх автомашин харагдахгүй байж болох бөгөөд эсрэгээр буцаж эргэж буй тээврийн хэрэгсэлд зүүн тийш эргэх автомашин халхалснаас гэрлэн дохио зөрчиж шулуун явж буй автомашин харагдахгүй байж болох тул осол гардаг. Иймд уулзварт гэрлэн дохиог дагаж мөрдөх нь аюулгүй жолоодлогын төлөө зайлшгүй шаардлагатай."},{"n":796,"b":"Дараах зурагтай адил “эгнээ нарийсдаг тойрог уулзвар”-аар баруун эргэж зорчих аргын талаарх тайлбараас зөв 2-ыг сонгоно уу.","c":["Тойрог уулзварт орсны дараа аюулгүйгээр баруун эргэх чиглэлээр гарна.","Тойрог уулзварт орохгүйгээр урьдчилан замын баруун захын эгнээг ашиглан удаан явж баруун эргэнэ.","Тойрог уулзварт орсны дараа шууд баруун эргэх нь уулзвараар нэвтрэх журам зөрчсөн үйлдэл юм.","Баруун эргэх эгнээний явган хүний гарц дээр явган зорчигч байгаа эсэхээс үл хамааран түр зогсоно.","Тойрог уулзварт орсны дараа цагийн зүүний дагуу том тойрог хийж баруун эргэх ёстой."],"a":"2, 3","imgs":["q796.png"],"t":"사진형","e":"* Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйл (Уулзвараар нэвтрэх арга) * Тойрог уулзварын зураг төслийн заавар 2.2 (Тойрог уулзварын төрөл) “Эгнээ багасгасан хэлбэрийн тойрог уулзвар” - Эгнээ багасгасан хэлбэрийн тойрог уулзвар: баруун тийш эргэх тээврийн хэрэгсэл болон шулуун явах, зүүн тийш эргэх тээврийн хэрэгслийн хөдөлгөөний шугамыг тусгаарлаж, тойрог уулзварын дотор эгнээ солих явдал гардаггүй хэлбэр - Спираль хэлбэрийн тойрог уулзвар: баруун тийш эргэх эгнээний хөдөлгөөний шугамыг тойрог уулзварын дотор тусад нь салгасан хэлбэр - Эгнээ солихыг хязгаарласан 2 эгнээт тойрог уулзвар: одоо байгаа тойрог уулзварын эгнээний шугамыг тохируулах замаар эгнээ солихыг хязгаарласан хэлбэр"},{"n":797,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Баруун эргэх гэж байгаа бол удаан явж явган хүний гарцаар нэвтэрнэ.","Баруун эргэх гэж байгаа бол явган хүний гарцын өмнө заавал түр зогсоно.","Чигээрээ явах гэж байгаа бол бусад тээврийн хэрэгслээс давуу эрхтэй тул удаан явж уулзварт орно.","Чигээрээ явах болон баруун эргэх гэж байгаа аль ч тохиолдолд түр зогссоны дараа уулзварт орно.","Зөвхөн баруун эргэх гэж байгаа тохиолдолд түр зогссоны дараа уулзварт орно."],"a":"2, 4","imgs":["img_0102.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 31 дүгээр зүйл (Удаан явах буюу түр зогсох газар) 2 дахь хэсэг. Бүх тээврийн хэрэгсэл буюу трамвайн жолооч дараах заалтын аль нэгэнд хамаарах газарт түр зогсох ёстой. 1. Хөдөлгөөний зохицуулалт хийгдээгүй бөгөөд зүүн, баруун талыг харах боломжгүй буюу хөдөлгөөн ачаалалтай уулзвар 2. Аймаг, нийслэлийн Цагдаагийн газрын дарга зам дээрх аюулаас урьдчилан сэргийлэх, хөдөлгөөний аюулгүй байдал, саадгүй нэвтрэлтийг хангахад шаардлагатай гэж үзэж аюулгүйн тэмдэглэгээгээр заасан газар. Сонголтод үзүүлсэн нөхцөл байдал нь баруун талыг харахад хүндрэлтэй газар тул түр зогсох ёстой газар бөгөөд энэ үед шулуун явах болон баруун тийш эргэх аль ч тохиолдолд түр зогсох ёстой. Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 7 дахь хэсэг. Бүх тээврийн хэрэгсэл буюу трамвайн жолооч мөн хуулийн 12 дугаар зүйлийн 1 дэх хэсэгт заасан хүүхдийн хамгаалалтын бүсэд байрлуулсан явган хүний гарцуудаас гэрлэн дохио суурилуулаагүй явган хүний гарцын өмнө (зогсох шугам байгаа бол тухайн зогсох шугамыг хэлнэ) явган зорчигч гарч байгаа эсэхээс үл хамааран түр зогсох ёстой."},{"n":798,"b":"Дараах нөхцөлд 12 цагийн чиглэл рүү гарах гэж байгаа бол хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Тойрог уулзварт орох гэж буй суудлын автомашинд зам тавьж өгөхийн тулд зогсоно.","Зүүн чиг заагчийг ажиллуулан ачааны автомашинд зориулсан дав ах хэсэг рүү орно.","Баруун чиг заагчийг ажиллуулан 12 цагийн чиглэл рүү явна.","Гарах цэгээ өнгөрөөсөн бол тойрог уулзварыг нэг бүтэн тойрч гарах цэгээр гарна.","12 цагийн чиглэл рүү чигээрээ явах гэж байгаа тул чиг заагчийг ажиллуулахгүй."],"a":"3, 4","imgs":["img_0103.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 25-2 дугаар зүйл (Тойрог уулзвараар нэвтрэх арга) ① Бүх тээврийн хэрэгслийн жолооч тойрог уулзварт цагийн зүүний эсрэг чиглэлд явах ёстой. ② Бүх тээврийн хэрэгслийн жолооч тойрог уулзварт орохдоо удаан явах буюу түр зогсох ёстой бөгөөд аль хэдийн явж буй өөр тээврийн хэрэгсэл байвал тухайн тээврийн хэрэгсэлд зам тавьж өгөх ёстой. ③ 1 дэх болон 2 дахь хэсгийн дагуу тойрог уулзвараар нэвтрэхийн тулд гараар, чиг заах дохиогоор буюу гэрлээр дохио өгч буй тээврийн хэрэгсэл байгаа тохиолдолд түүний ард явж буй тээврийн хэрэгслийн жолооч дохио өгсөн урд тээврийн хэрэгслийн явахад саад учруулж болохгүй. Замын хөдөлгөөний тухай хуулийн 38 дугаар зүйл (Тээврийн хэрэгслийн дохио) ① Бүх тээврийн хэрэгслийн жолооч зүүн тийш эргэх, баруун тийш эргэх, хөндлөн гарах, буцаж эргэх, удаан явах, зогсох буюу ухрах, эсвэл нэг чиглэлд явж байхдаа замаа өөрчлөх, мөн тойрог уулзварт орох буюу тойрог уулзвараас гарах тохиолдолд гараар, чиг заах дохиогоор буюу гэрлээр тухайн үйлдэл дуустал дохио өгөх ёстой. Суудлын автомашин буюу ачааны автомашин зам тавьж өгөлгүй хүчээр орж ирэх гэж байвал 12 цагийн чиглэлээр гарахаас түдгэлзэж, дахин цагийн зүүний эсрэг 360 градус эргээд 12 цагийн чиглэлээр гарна."},{"n":799,"b":"Дараах нөхцөлд баруун эргэх гэж байг
