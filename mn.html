эрэгжүүлэх журмын 28 дугаар зүйлийн дагуу автомашины шилний үзэгдэх гэрлийн нэвтрүүлэх чадварын шалгуур нь урд салхины шилний хувьд 70 хувь, жолоочийн суудлын зүүн, баруун хажуугийн шилний хувьд 40 хувь байх ёстой."},{"n":78,"b":"Жолоодож байх үед тоормос ажиллах хүртэлх жолоочийн үйл ажиллагааны зөв дараалал аль нь вэ?","c":["Аюулыг мэдрэх → Нөхцөл байдлыг үнэлэх → Үйлдэл хийхийг шийдэх → Тоормос ажиллуулах","Аюулыг мэдрэх → Үйлдэл хийхийг шийдэх → Нөхцөл байдлыг үнэлэх → Тоормос ажиллуулах","Нөхцөл байдлыг үнэлэх → Аюулыг мэдрэх → Үйлдэл хийхийг шийдэх → Тоормос ажиллуулах","Үйлдэл хийхийг шийдэх → Аюулыг мэдрэх → Нөхцөл байдлыг үнэлэх → Тоормос ажиллуулах"],"a":"1","imgs":[],"t":"문장형","e":"Жолоодож явахдаа аюултай нөхцөл байдлыг таньж, дүгнэж, үйлдлийн тушаал өгсний дараа тоормос ажилладаг."},{"n":79,"b":"Дараах зүйлсээс автомашинд суурилуулсан аюулгүйн дэрийн шаардлагад хамгийн бага хамаарах нь аль вэ?","c":["Өндөр температурт суналтын бат бэх, халуунд тэсвэрлэх чанар","Бага температурт суналтын бат бэх, халуунд тэсвэрлэх чанар","Урагдахааргүй бат бэхтэй, элэгдэлд тэсвэртэй, уян хатан байх","Жолоочтой мөргөлдөх үеийн цохилтын энергийг хамгийн их байлгах"],"a":"4","imgs":[],"t":"문장형","e":"Автомашин мөргөлдөх үед жолоочтой шууд хүрэлцэж, цохилтын энергийг шингээх ёстой."},{"n":80,"b":"Дараах зүйлсээс жолооч болон зорчигч автомашинд суух, буух үед мөрдөх зөв дүрэм аль нь вэ?","c":["Суух, буухдаа ар талаас автомашин ирж байгаа эсэхийг шалгана.","Хаалгыг бүрэн онгойлгоод шууд бууна.","Арын суудлын зорчигч буух үед жолооч зөвхөн урагшаа харж байх ёстой.","Жолооч түр хугацаагаар суудлаа орхих үед хөдөлгүүрийг унтраахгүй байж болно."],"a":"1","imgs":[],"t":"문장형","e":"Жолооч зэрэг автомашинд суух, буухдаа ардаас ирж буй тээврийн хэрэгсэл байгаа эсэхийг шалгана."},{"n":81,"b":"Замын хөдөлгөөний тухай хуульд заасан зөв жолоодох аргыг зөв холбосон нь аль вэ?","c":["Сургуулийн өмнөх явган хүний зам – Хүүхдэд автомашин ирж байгааг мэдэгдэхийн тулд дуут дохио өгч өнгөрнө.","Төмөр замын гарц – Хаалт бууж эхлэх үед аль болох хурдан гарч өнгөрнө.","Гэрлэн дохиогүй уулзвар – Баруун эргэхдээ урьдчилан замын баруун зах руу шахаж, удаан яван баруун эргэнэ.","Шөнийн жолоодлого – Эсрэг чиглэлээс автомашин ирж байвал нөгөө жолоочид анхааруулахын тулд холын гэрлээ асаана."],"a":"3","imgs":[],"t":"문장형","e":"Сургуулийн урдах явган хүний замаар хүүхэд гарч байвал түр зогсох ёстой бөгөөд төмөр замын гарамд хаалт буух гэж байгаа үед орж болохгүй. Мөн шөнийн цагаар жолоодохдоо эсрэг талын тээврийн хэрэгслийн хөдөлгөөнд саад болохгүйн тулд их гэрлийг ойрын гэрэл болгон тохируулах ёстой."},{"n":82,"b":"Дараах зүйлсээс Замын хөдөлгөөний тухай хуульд заасан гүйцэж түрүүлэхтэй холбоотой зөв тайлбар аль нь вэ?","c":["Хонгил дотор өдрийн цагаар гүйцэж түрүүлж болох боловч шөнийн цагаар хориглоно.","Гүйцэж түрүүлэхдээ урд гэрлээ асааж, дуут дохио өгөөд зүүн эсвэл баруун талаар аль ч талаас гүйцэж түрүүлж болно.","Гүүрэн дээр болон уулзварт гүйцэж түрүүлэхийг хориглодог тул гүйцэж түрүүлэх боломжгүй.","Цагдаагийн албан хаагчийн зааврын дагуу зогсох эсвэл удаан явж байх үед гүйцэж түрүүлж болно."],"a":"3","imgs":[],"t":"문장형","e":"21 дүгээр зүйл (Гүйцэж түрүүлэх арга гэх мэт) ① Бүх тээврийн хэрэгслийн жолооч өөр тээврийн хэрэгслийг гүйцэж түрүүлэхдээ урд явж буй тээврийн хэрэгслийн зүүн талаар явах ёстой. 22 дугаар зүйл (Гүйцэж түрүүлэхийг хориглох үе ба газар) ①, ②, ③ ④ 2. Цагдаагийн алба хаагчийн зааврын дагуу зогсож эсвэл удаан явж буй тээврийн хэрэгсэл"},{"n":83,"b":"Дараах зүйлсээс жолоочийн зөв хандлагад хамгийн тохиромжгүй нь аль вэ?","c":["Замын хөдөлгөөний нөхцөл өөрчлөгдөхгүй тул урьдчилан жолоодох төлөвлөгөө гаргах шаардлагагүй.","Автомашины зориулалтын галын хорыг машин дотроо байрлуулж гал гарсан тохиолдолд бэлтгэлтэй байх.","Автомашин дотор асаагуур зэрэг шатамхай зүйл хадгалахгүй байх.","Туршлага багатай жолоочид хүндэтгэлтэй хандаж жолоодох."],"a":"1","imgs":[],"t":"문장형","e":"Эвдэрсэн тээврийн хэрэгсэл зэргээс үүдэлтэй замын аюултай хүчин зүйлийг илрүүлсэн тохиолдолд ослын дохио асааж ард явж буй тээврийн хэрэгсэлд урд талын нөхцөл байдлыг урьдчилан мэдэгдэж, удаан явж аюултай хэсгээс аюулгүйгээр гарсны дараа тусламж шаардлагатай гэж үзвэл давтан (2 дахь) ослоос сэргийлэх арга хэмжээ авч, шаардлагатай арга хэмжээг хэрэгжүүлнэ."},{"n":84,"b":"Дараах зүйлсээс жолоочийн зөв үйлдэлд хамгийн тохиромжтой нь аль вэ?","c":["Нойрмоглож байвал ослоос сэргийлж замын зах хэсэгт зогсож амарна.","Шинэхэн жолооч хурдны зам дээр үргэлж гүйцэж түрүүлэх эгнээгээр явна.","Замын хөдөлгөөний хяналтын төхөөрөмжийн ажиллагаанд саад учруулах төхөөрөмж суурилуулж жолоодно.","Замын хөдөлгөөний аюултай нөхцөл илэрвэл ослын дохионы гэрлээ асааж бусдад анхааруулна."],"a":"4","imgs":[],"t":"문장형","e":"Замын захад амрах, гүйцэж түрүүлэх эгнээгээр үргэлжлүүлэн явах, саад учруулах төхөөрөмж суурилуулах нь зөв жолоодлогын үйлдэл гэж үзэж болохгүй."},{"n":85,"b":"Дараах зүйлсээс жолоочийн зөв хандлагад хамгийн тохиромжгүй нь аль вэ?","c":["Тогтмол хурдтай явах зэрэг зөв жолоодлогын дадалтай болох хүсэлтэй байх.","Зам түгжирсэн үед замын зах (замын хажуугийн хөвөө)-өөр явахыг хүсэх.","Замын хөдөлгөөний дүрмийг харилцан мөрдөх ёстой амлалт гэж ойлгох.","Автомашины хурдан хөдөлгөөнөөс илүү явган зорчигчийг нэн тэргүүнд тавих."],"a":"2","imgs":[],"t":"문장형","e":"Түгжрэлтэй байсан ч замын зах (замын ирмэг)-аар явах нь буруу жолоодлогын хандлага юм."},{"n":86,"b":"Дараах зүйлсээс зам тээврийн осол гарсан тохиолдолд жолоочийн хариуцлагад хамгийн бага хамаарах нь аль вэ?","c":["Эрүүгийн хариуцлага","Захиргааны хариуцлага","Иргэний хариуцлага","Нийтийн хариуцлага"],"a":"4","imgs":[],"t":"문장형","e":"Торгууль ногдуулах зэрэг эрүүгийн хариуцлага, торгуулийн онооны дагуух захиргааны хариуцлага, хохирол нөхөн төлөх иргэний хариуцлага хүлээнэ."},{"n":87,"b":"Хурдны зам дээр зам тээврийн осол гарсан үед жолоочийн авах арга хэмжээний талаар буруу нь аль вэ?","c":["Хамт явсан зорчигчийн гэмтлийн байдлаас хамаарч анхны тусламж үзүүлнэ.","Ослын дохионы гэрлээ асааж, араас ирж буй жолооч нарт аюулыг анхааруулна.","Осолд орсон автомашины ард зогсон цагдаагийн албан хаагч ирэх хүртэл хөдөлгөөн зохицуулна.","Хоёрдогч ослоос урьдчилан сэргийлэхийн тулд аюулгүй газар руу шилжинэ."],"a":"3","imgs":[],"t":"문장형","e":"Осолд орсон автомашины ард давтан (2 дахь) осол гарах аюултай тул аюулгүй газар руу шилжих нь зүйтэй."},{"n":88,"b":"Суудлын автомашинд нярай болон бага насны хүүхэдтэй хамт зорчиж байгаа үед жолоочийн хамгийн зөв үйлдэл аль нь вэ?","c":["Урд зорчигчийн суудалд насанд хүрсэн хүн нярай хүүхдийг тэвэрч, хамгаалах бүсээ зүүнэ.","Нярай болон бага насны хүүхэд арын суудалд сууж байгаа бол хүүхдийн хамгаалах суудалгүйгээр хамгаалах бүс хэрэглэж болно.","Жолоодож байх үед нярай болон бага насны хүүхэд уйлбал жолооч хүүхдээ тэвэрч хамгаалах бүсээ хамт зүүнэ.","Нярай болон бага насны хүүхэд сууж байгаа тохиолдолд ямар ч зам дээр хүүхдийн хамгаалах суудал суурилуулж, хамгаалах бүсийг зүүлгэнэ."],"a":"4","imgs":[],"t":"문장형","e":"Суудлын автомашинд нялх, балчир хүүхэд суулгахдаа жолоочийн суудлын ард хүүхэд хамгаалах хэрэгсэл суурилуулсны дараа суудлын хамгаалах бүс зүүлгэх нь аюулгүй."},{"n":89,"b":"Жолоочийн мөрдөх ёстой зөв үйлдэл 2-ыг сонгоно уу.","c":["Хүүхэд зам тээврийн осолд өртөх эрсдэлтэй үед түр зогсоно.","Ус тогтсон хэсгээр гарахдаа бусдад хохирол учруулахгүйн тулд хурдаа сааруулна.","Автомашины шилний гэрэл нэвтрүүлэх чадварт хязгаарлалт байхгүй тул маш бараан хальс наана.","Явган зорчигч урд талын явган хүний гарцаар гарч байгаа үед удаан явна."],"a":"1, 2","imgs":[],"t":"문장형","e":"Зам дээр хүүхдийн зам тээврийн ослын аюул байгааг илрүүлсэн тохиолдолд түр зогсох ёстой. Мөн явган зорчигч явган хүний гарцаар гарч байх үед түр зогсох ёстой бөгөөд аюулгүйн бүсэд явган зорчигч байгаа тохиолдолд аюулгүй зай барьж удаан явах ёстой."},{"n":90,"b":"Дараах зүйлсээс хурдны зам дээр жолоочийн зөв үйлдэл 2-ыг сонгоно уу.","c":["Ядарсан үедээ замын захад зогсож амарсны дараа хөдөлгөөнөө үргэлжлүүлнэ.","Дуртай бичлэгээ үзэнгээ жолоо барина.","Тогтмол амарч, эсвэл агаар сэлгэж нойрмоглон жолоо барихаас урьдчилан сэргийлнэ.","Зөвхөн хөдөлгөөн эхлэхээс өмнө бус, амрах үедээ ч хүрэх газрын чиглэл дэх эрсдэлт хүчин зүйлсийг шалган жолоодно."],"a":"3, 4","imgs":[],"t":"문장형","e":"Урьдчилан жолоодлогын төлөвлөгөө гаргаж, жолоодож явахдаа гар утас хэрэглэх бус амрах үедээ аюултай хүчин зүйлийг тодорхойлж, нойрмог жолоодлогыг даван туулахыг оролдохын оронд тогтмол амрах, агааржуулах замаар нойрмог жолоодлогоос урьдчилан сэргийлнэ."},{"n":91,"b":"Дараах зүйлсээс аюулгүй жолоодлогод шаардлагатай жолоочийн бэлтгэлийн талаар хамгийн тохиромжгүй нь аль вэ?","c":["Анхаарал сарнихгүй байхын тулд биеийн байдлаа зохицуулна.","Жолоодлогын төхөөрөмжийг ажиллуулахад эвтэйхэн, жолоо барихад тохиромжтой хувцас өмсөнө.","Галын дохиогуур зэрэг ослын үеийн дохионы хэрэгслийг бэлтгэнэ.","Түлш хэмнэхийн тулд хөдөлгөөн эхлэхээс 10 минутын өмнө хөдөлгүүрээ асааж халаана."],"a":"4","imgs":[],"t":"문장형","e":"Автомашиныг сул зогсоолд ажиллуулах нь байгаль орчны бохирдол үүсгэж болно."},{"n":92,"b":"Жолоодож байх үеийн анхаарал төвлөрөлтэй холбоотой зөв 2-ыг сонгоно уу.","c":["Жолоодож байх үед хамт зорчигчтой байнга ярилцах нь анхаарал төвлөрлийг нэмэгдүүлдэг.","Жолоочийн харах орчныг халхалж буй автомашинд суурилуулсан зүйлсийг авч хаях нь зүйтэй.","Жолоодож байх үеийн анхаарал төвлөрөл нь аюулгүй жолоодлоготой хамааралгүй.","TV/DMB төхөөрөмжийг зөвхөн арын суудлын зорчигчид үзэх боломжтой газарт суурилуулах нь зүйтэй."],"a":"2, 4","imgs":[],"t":"문장형","e":"Жолоодож явахдаа хамт явагчтай тасралтгүй ярилцах нь анхаарлыг сарниулдаг бөгөөд жолоодож явах үед анхаарал төвлөрөл үргэлж шаардлагатай."},{"n":93,"b":"Замын хөдөлгөөний тухай хуулийн дагуу автомашинд (хоёр дугуйт тээврийн хэрэгслээс бусад) нярай болон бага насны хүүхэ дтэй хамт зорчих үед хүүхдийн хамгаалах суудал ашиглах ёстой. Дараах зүйлсээс нярай болон бага насны хүүхдийн насны зөв ш алгуур аль нь вэ?","c":["8 нас ба түүнээс бага","8 наснаас бага","6 наснаас бага","6 нас ба түүнээс бага"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 11 дүгээр зүйл (Хүүхэд зэргийг хамгаалах): Нялх, балчир хүүхэд (6 нас хүрээгүй хүнийг хэлнэ)-ийн асран хамгаалагч нь хөдөлгөөн ихтэй зам дээр хүүхдийг тоглуулж болохгүй."},{"n":94,"b":"Замын хөдөлгөөний тухай хууль тогтоомжид заасан хувийн хөдөлгөөнт хэрэгслийн журам болон аюулгүй жолоодох аргын талаар буруу нь аль вэ?","c":["Жолооч шөнийн цагаар замаар зорчих үедээ урд гэрэл болон арын гэрлээ асаах ёстой.","Хувийн хөдөлгөөнт хэрэгслийн нэг төрөл болох цахилгаан скүүтерийн суудлын тоо 1 тул 2 хүн сууж болохгүй.","Хувийн хөдөлгөөнт хэрэгсэлд цахилгаан өөрөө тэнцвэржүүлэгч, цахилгаан кик скүүтер, цахилгаан унадаг дугуй, цахилгаан дугуй, цахилгаан скутер зэрэг хувь хүний зорчиход тохиромжтой хэрэгслүүд хамаарна.","Зөвхөн цахилгаан хөдөлгүүрийн хүчээр хөдөлдөг унадаг дугуйн суудлын тоо 2 байна."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 50 дугаар зүйл (Тодорхой жолоочийн дагаж мөрдөх зүйл)-ийн 9 дэх хэсэг: Унадаг дугуй зэргийн жолооч шөнийн цагаар замаар явахдаа урд гэрэл болон арын гэрлээ асаах эсвэл гэрэл ойлгогч бүс зэрэг гэрэлтэгч хэрэгсэл зүүх ёстой. 10 дахь хэсэг: Хувийн хөдөлгөөнт хэрэгслийн жолооч Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон суудлын багтаамжаас хэтрүүлэн хамт явагч суулгаж хувийн хөдөлгөөнт хэрэгслийг жолоодож болохгүй. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 33 дугаар зүйлийн 3 (Хувийн хөдөлгөөнт хэрэгслийн суудлын багтаамж): Цахилгаан скүүтер болон цахилгаан хоёр дугуйт тэнцвэржүүлэгч хэрэгслийн хувьд суудлын багтаамж 1 хүн, зөвхөн цахилгаан моторын хүчээр хөдөлж чадах унадаг дугуйн хувьд суудлын багтаамж 2 хүн"},{"n":95,"b":"Дараах зүйлсээс автомашины (хоёр дугуйт тээврийн хэрэгслээс бусад) хамгаалах бүс хэрэглэх тухай зөв тайлбар аль нь вэ?","c":["13 наснаас бага хүүхэд хамгаалах бүс хэрэглээгүй бол жолоочид ногдуулах торгууль 100,000 вон байна.","13 нас ба түүнээс дээш настай хамт зорчигч хамгаалах бүс хэрэглээгүй бол жолоочид ногдуулах торгууль 30,000 вон байна.","Ердийн замд зөвхөн жолооч болон урд суудлын зорчигч хамгаалах бүс хэрэглэх үүрэгтэй.","Бүх суудалд хамгаалах бүс хэрэглэх нь заавал мөрдөх журам боловч 3 наснаас бага нярай болон бага насны хүүхдийг хамгаалагч тэвэрч хамт зорчиж болно."],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 50 дугаар зүйл (Тодорхой жолоочийн дагаж мөрдөх зүйл)-ийн 1 дэх хэсэг: Автомашин (хоёр дугуйт тээврийн хэрэгслийг хасна)-ы жолооч автомашин жолоодохдоо суудлын хамгаалах бүс зүүх ёстой бөгөөд Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын Хавсралт 6: хамгаалах бүс зүүгээгүй (хамт явагч 13 нас хүрээгүй бол захиргааны торгууль 60,000 вон, 13 ба түүнээс дээш настай бол захиргааны торгууль 30,000 вон)"},{"n":96,"b":"Зам тээврийн ослоос урьдчилан сэргийлэх жолоочийн зөв дадал аль нь вэ?","c":["Чиг заах дохиогоор зорчих чиглэлээ тодорхой мэдэгдэнэ.","Жолоодлогын огцом үйлдэл хийх, болон огцом тоормослохыг байнга хийдэг.","Өөрт ашигтайг тал руу таамаглан жолоодно.","Бусад жолоочийн дүрэм зөрчсөн үйлдэлд заавал хариу үйлдэл үзүүлнэ."],"a":"1","imgs":[],"t":"문장형","e":"Огцом удирдлага, огцом тоормослолт хийж болохгүй бөгөөд бусдыг хүндэтгэсэн жолоодлого, хууль дүрмийн зөв ойлголт шаардлагатай."},{"n":97,"b":"Дараах зүйлсээс жолоочийн зөв жолоодлогын үйлдэлд хамгийн тохиромжгүй нь аль вэ?","c":["Хурдны дээд хязгаарыг баримтлан хөдөлгөөний урсгалд нийцүүлэн жолоодно.","Шинэхэн жолооч бол хурдны замд замын захаар явж хөдөлгөөний урсгалд саад учруулахгүй.","Зам дээр автомашинаа зогсоочихоод маргалдахгүй.","Дадлагын жолоодох эрхийн үнэмлэхтэй хүн хуульд заасан хамт явах хүний хамт жолоодно."],"a":"2","imgs":[],"t":"문장형","e":"Шинэ жолооч байсан ч хурдны зам дээр замын захаар явж болохгүй."},{"n":98,"b":"Замын хөдөлгөөний тухай хууль тогтоомжид заасан зам тавьж өгөх жолоодлогын талаар хамгийн зөв тайлбар аль нь вэ?","c":["Үргэлжлүүлэн удаан хурдтай явж байгаа бол замын зүүн зах руу шахаж эгнээгээ тавьж өгнө.","Тусгай зориулалтын тээврийн хэрэгсэл араас ирж байвал хурдан үргэлжлүүлэн явна.","Гэрлэн дохиогүй уулзварт нэгэн зэрэг орох гэж байгаа автомашины жолооч нь зүүн талаас ирж буй автомашинд зам тавьж өгнө.","Зам тавьж өгөх тэмдэгтэй замаар явж байгаа автомашин бусад замаар явж буй автомашинд зам тавьж өгнө."],"a":"4","imgs":[],"t":"문장형","e":"Тусгай зориулалтын тээврийн хэрэгсэл ард нь ирж байгаа тохиолдолд ч эгнээг тавьж өгөх ёстой. Мөн замын хөдөлгөөний зохицуулалтгүй уулзварт зам тавьж өгөх жолоодлогын шалгуурын дагуу явах ёстой бөгөөд зам тавьж өгөх тэмдэг байрлуулсан замын тээврийн хэрэгсэл бусад тээврийн хэрэгсэлд эгнээг тавьж өгөх ёстой."},{"n":99,"b":"Хөдөлгөөний боломж хязгаарлагдсан иргэдийн зорчих нөхцөлийг сайжруулах тухай хуульд заасан \"хөдөлгөөний боломж хязгаарлагдсан хүн\"-д хамаарахгүй нь аль вэ?","c":["Ахмад настан","Жирэмсэн эмэгтэй","Нярай болон бага насны хүүхэдтэй хамт яваа хүн","Гэрийн тэжээвэр амьтантай хамт яваа хүн"],"a":"4","imgs":[],"t":"문장형","e":"Зорчиход бэрхшээлтэй иргэдийн зорчих тав тухыг нэмэгдүүлэх тухай хуулийн 2 дугаар зүйл: «Зорчиход бэрхшээлтэй иргэн» гэж хөгжлийн бэрхшээлтэй хүн, ахмад настан, жирэмсэн эмэгтэй, нялх, балчир хүүхэд дагуулсан хүн, хүүхэд зэрэг өдөр тутмын амьдралд зорчиход бэрхшээл мэдэрдэг хүнийг хэлнэ."},{"n":100,"b":"Хөдөлгөөний боломж хязгаарлагдсан иргэдийн зорчих нөхцөлийг сайжруулах тухай хуульд заасан тэдэнд зориулсан \"явган зорчигчийн аюулгүй байдлын байгууламж\" гэж үзэхэд хамгийн тохиромжгүй нь аль вэ?","c":["Хурд сааруулах байгууламж","Дугуйн тусгай зам","Нийтийн тээврийн мэдээлэл хүргэх байгууламж зэрэг тээврийн мэдээллийн байгууламж","Явган зорчигчид түрүүлж зорчиход зориулсан гэрлэн дохио"],"a":"2","imgs":[],"t":"문장형","e":"Зорчиход бэрхшээлтэй иргэдийн зорчих тав тухыг нэмэгдүүлэх тухай хуулийн 21 дүгээр зүйл (Явган зорчигчийн аюулгүй байдлын байгууламж суурилуулах)-ийн 1 дэх хэсэг: Хотын захирагч эсвэл сумын дарга явган зорчигчийн давуу эрхтэй бүсэд явган зорчигч аюулгүй, тав тухтай явах боломжтой байлгахын тулд дараах явган зорчигчийн аюулгүй байдлын байгууламжийг суурилуулж болно. 1. Хурд бууруулах байгууламж. 2. Хөндлөн гарах байгууламж. 3. Нийтийн тээврийн мэдээлэл мэдээлэх байгууламж зэрэг замын хөдөлгөөний мэдээллийн байгууламж. 4 Явган зорчигчийг тэргүүн ээлжинд нэвтрүүлэх гэрлэн дохио. 5. Автомашин нэвтрэхээс сэргийлэх шон. 6. Зорчиход бэрхшээлтэй иргэдэд зориулсан дуут дохио зэрэг явган зорчих замын чиглүүлэх төхөөрөмж. 7. Бусад явган зорчигчийн аюулгүй байдал, зорчих тав тухын төлөө Ерөнхийлөгчийн зарлигаар тогтоосон байгууламж"},{"n":101,"b":"Замын хөдөлгөөний тухай хуулийн дагуу ямар тохиолдолд удаан явж жолоодох ёстой вэ?","c":["Уулзварын гэрлэн дохио улаан анивчиж байгаа үед","Замын хөдөлгөөнийг зохицуулаагүй, хөдөлгөөн ихтэй уулзварыг нэвтрэн өнгөрөх үед","Замын хөдөлгөөнийг зохицуулаагүй уулзварыг нэвтрэн өнгөрөх үед","Уулзварын орчимд эгнээ солих үед"],"a":"3","imgs":[],"t":"문장형","e":"① Түр зогсох ёстой. ③ Замын хөдөлгөөний зохицуулалтгүй уулзвараар өнгөрөхдөө удаан явж өнгөрөх ёстой."},{"n":102,"b":"Түгжрэлтэй уулзварт зүүн эргэх үед хамгийн зөв арга аль нь вэ?","c":["Аль болох урд явж байгаа автомашиныг дагаж орно.","Ногоон гэрэл ассан бол уулзварт орж болно.","Улаан гэрэл ассан байсан ч зай гарвал орно.","Ногоон суман гэрэл ассан байсан ч уулзварт орохгүй."],"a":"4","imgs":[],"t":"문장형","e":"Бүх тээврийн хэрэгслийн жолооч гэрлэн дохиотой уулзварт орох гэж байгаа тохиолдолд явах гэж буй эгнээний урд байгаа тээврийн хэрэгслийн нөхцөл байдлаас хамаарч уулзварт зогсох ёстой бөгөөд бусад тээврийн хэрэгслийн хөдөлгөөнд саад учруулж болзошгүй тохиолдолд уг уулзварт орж болохгүй."},{"n":103,"b":"Хурдны замын хурд авах эгнээнээс үндсэн зорчих эгнээ рүү орох зөв арга аль нь вэ?","c":["Заавал түр зогсож хөдөлгөөний урсгалыг ажигласны дараа хурдан орно.","Орохын өмнө түр зогсоод зорчиж буй автомашин байвал огцом орно.","Орох зай хүрэлцэхгүй байсан ч арын автомашиныг бодож хүчээр орно.","Хурд авах эгнээг ашиглан тохирох хурд авч, хангалттай зай гарсны дараа орно."],"a":"4","imgs":[],"t":"문장형","e":"Хурдны замд орохдоо хурдлах эгнээг ашиглан аажмаар хурдаа нэмэгдүүлэн орох ёстой. Удаан орох эсвэл түр зогсох тохиолдолд хурдлахад хэцүү тул харин ч аюултай байж болно. Орох зай хангалттай байгааг шалгаад хурдлан орох ёстой."},{"n":104,"b":"Хурдны замын үндсэн зорчих хэсгийн баруун эгнээгээр удаан явж байгаа А автомашин байна. Энэ үед В автомашин үндсэн з орчих хэсэгт аюулгүй орох хамгийн зөв арга аль нь вэ?","c":["Хурдаа аажмаар нэмэгдүүлж, А автомашин өнгөрсний дараа орно.","Хурдаа нэмж, сул байгаа замын захаар орно.","Хурд авах эгнээний төгсгөлд зогсож, А автомашин өнгөрсний дараа орно.","Хурд авах эгнээнд А автомашинтай ижил хурдтай үргэлжлүүлэн явна."],"a":"1","imgs":[],"t":"문장형","e":"Автомашин (тусгай зориулалтын тээврийн хэрэгслийг хасна)-ы жолооч хурдны замд орох гэж байгаа тохиолдолд уг хурдны замаар явж буй бусад автомашины хөдөлгөөнд саад учруулж болохгүй."},{"n":105,"b":"Хүүхэд хамгаалагчгүйгээр зам хөндлөн гарч байгаа үед жолоочийн хамгийн зөв үйлдэл аль нь вэ?","c":["Дуут дохиог олон дахин өгч хүүхдийг хурдан гаргахыг шаардана.","Удаан явж, зам хөндлөн гарч буй хүүхдийн аюулгүй байдлыг хангана.","Түр зогсож, зам хөндлөн гарч буй хүүхдийн аюулгүй байдлыг хангана.","Хурдан өнгөрч, зам хөндлөн гарч буй хүүхдийн аюулгүй байдлыг хангана."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 49 дүгээр зүйл (Бүх жолоочийн дагаж мөрдөх зүйл гэх мэт): Хүүхэд асран хамгаалагчгүйгээр замыг хөндлөн гарч байх үед жолооч түр зогсох ёстой."},{"n":106,"b":"Гэрлэн дохиогүй бөгөөд баруун, зүүн талыг харах боломжгүй уулзварт орох үед хамгийн аюулгүй арга аль нь вэ?","c":["Орчны нөхцөлөөс шалтгаалан удаан явж аюулгүй эсэхийг шалгасны дараа гарна.","Дуут дохио өгч, урд гэрлээ анивчуулан орсны дараа удаан явж гарна.","Заавал түр зогсож, аюулгүй эсэхийг шалгасны дараа зам тавьж өгөх журмын дагуу гарна.","Түрүүлж орсон нь давуу эрхтэй тул орчноо ажиглан хурдан гарна."],"a":"3","imgs":[],"t":"문장형","e":"Гэрлэн дохиогүй уулзварт удаан явах нь зарчим боловч уулзварын хөдөлгөөн ихтэй эсвэл саад зэргээс болж зүүн, баруун талыг шалгах боломжгүй тохиолдолд заавал түр зогсож аюулгүй байдлыг шалгасны дараа өнгөрөх ёстой."},{"n":107,"b":"Уулзварт зүүн эргэх үед хамгийн аюултай хүчин зүйл аль нь вэ?","c":["Баруун талын замын явган хүний гарцаар гарч буй явган зорчигч","Баруун эгнээний араас хурдтай ирж буй мотоцикл","Зүүн талын замаас баруун эргэж буй суудлын автомашин","Эсрэг талаас баруун эргэж буй унадаг дугуй"],"a":"4","imgs":[],"t":"문장형","e":"Уулзварт зүүн эргэхдээ эсрэг талын замаас баруун эргэж буй тээврийн хэрэгсэлд анхаарах ёстой."},{"n":108,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хувийн хөдөлгөөнт хэрэгсэл жолоодож байгаа хүний зөв үйлдэл аль нь вэ?","c":["Явган хүний замаар зорчих үед явган зорчигчдыг тойрон жолоодно.","Согтууруулах ундаа хэрэглэсэн үедээ илүү болгоомжтой жолоодно.","Явган хүний гарц болон унадаг дугуйн гарц хамт байгаа бол унадаг дугуйн гарцаар гарна.","Явган хүний гарцаар гарахдаа гарцаар гарч буй явган зорчигчдыг тойрон жолоодно."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 15 дугаар зүйлийн 2 (Унадаг дугуйн хөндлөн гарц байгуулах). Унадаг дугуй зэрэг (унадаг дугуй болон хувийн хөдөлгөөнт хэрэгсэл)-ээр унадаг дугуйн хөндлөн гарц тусдаа байгаа замыг хөндлөн гарахдаа унадаг дугуйн хөндлөн гарцыг ашиглах ёстой. Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйлийн 2 (Унадаг дугуй зэргийн зорчих аргын онцгой журам): Хувийн хөдөлгөөнт хэрэгслийн жолооч явган хүний гарцыг ашиглан замыг хөндлөн гарахдаа буугаад түлхэж эсвэл өргөж явган явах ёстой. 109. «Аюулгүй хурд 5030» замын хөдөлгөөний аюулгүй байдлын бодлогын талаарх зөв тайлбар нь аль вэ? ① Автомашины зориулалтын замд цагт 50 километрээс ихгүй, хотын орон сууцны бүсийн туслах замд цагт 30 километр ② Хотын бүсийн ердийн замд цагт 50 километрээс ихгүй, хотын орон сууцны бүсийн туслах замд цагт 30 километрээс ихгүй ③ Автомашины зориулалтын замд цагт 50 километрээс ихгүй, хүүхдийн хамгаалалтын бүсэд цагт 30 километрээс ихгүй ④ Хотын бүсийн ердийн замд цагт 50 километрээс ихгүй, унадаг дугуйн замд цагт 30 километрээс ихгүй"},{"n":109,"b":"\"Аюулгүй хурд 5030\" замын хөдөлгөөний аюулгүй байдлын бодлогын талаар зөв нь аль вэ?","c":["Автомашины зориулалтын замд цагт 50 км-ээс ихгүй, хотын суурьшлын бүсийн доторх замд цагт 30 км","Хот суурин газрын ердийн замд цагт 50 км-ээс ихгүй, хотын суурьшлын бүсийн доторх замд цагт 30 км-ээс ихгүй","Автомашины зориулалтын замд цагт 50 км-ээс ихгүй, хүүхдийн хамгаалалтын бүсэд цагт 30 км-ээс ихгүй","Хот суурин газрын ердийн замд цагт 50 км-ээс ихгүй, дугуйн замд цагт 30 км-ээс ихгүй"],"a":"2","imgs":[],"t":"문장형","e":"«Аюулгүй хурд 5030» нь явган зорчигчийн хөдөлгөөн ихтэй хотын бүсийн ердийн замд цагт 50 километр (хөдөлгөөний урсгалд шаардлагатай бол 60 километр хэрэглэж болно), орон сууцны хороолол зэрэг туслах замд цагт 30 километрээс ихгүй болгон бууруулах бодлого бөгөөд хурдыг бууруулах замаар явган зорчигчийн аюулгүй байдлыг хамгаалах зорилгоор нэвтрүүлсэн."},{"n":110,"b":"Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу удаан явж жолоодох шаардлагатай тохиолдол буюу газарт хамаарах 2-ыг сонгоно уу.","c":["Гэрлэн дохиогүй уулзвар","Хүүхэд хамгаалагчгүйгээр зам хөндлөн гарч байгаа үед","Харааны бэрхшээлтэй хүн цагаан таягтай зам хөндлөн гарч байгаа үед","Зам тахирласан хэсгийн орчим"],"a":"1, 4","imgs":[],"t":"문장형","e":"Гэрлэн дохиогүй уулзварт удаан явах бөгөөд хүүхэд асран хамгаалагчгүйгээр замыг хөндлөн гарч байгаа үед болон хараагүй хүн цагаан таягтай замыг хөндлөн гарч байгаа тохиолдолд түр зогсох ёстой."},{"n":111,"b":"Дараах зүйлсээс тойрог уулзвараар нэвтрэх зөв арга 2-ыг сонгоно уу.","c":["Тойрог уулзварт аль хэдийн эргэж байгаа автомашин давуу эрхтэй.","Тойрог уулзварт орох гэж байгаа бол аль болох хурдан орно.","Тойрог уулзварт орохдоо ослын дохионы гэрлээ асааж орж байгаагаа мэдэгдэнэ.","Тойрог уулзварт цагийн зүүний эсрэг чиглэлээр явна."],"a":"1, 4","imgs":[],"t":"문장형","e":"25-2 дугаар зүйл (Тойрог уулзвараар зорчих арга) ① Бүх тээврийн хэрэгслийн жолооч тойрог уулзварт цагийн зүүний эсрэг чиглэлд явах ёстой. ② Бүх тээврийн хэрэгслийн жолооч тойрог уулзварт орох гэж байгаа тохиолдолд удаан явах эсвэл түр зогсох ёстой бөгөөд аль хэдийн явж буй өөр тээврийн хэрэгсэл байгаа үед уг тээврийн хэрэгсэлд зам тавьж өгөх ёстой."},{"n":112,"b":"Хурдны замаар зорчих үед зөв 2-ыг сонгоно уу.","c":["Бүх суудлын зорчигч хамгаалах бүсээ зүүх ёстой.","Хурдны замаар явж байгаа автомашин хурдны замд орж буй автомашинд эгнээгээ тавьж өгөх ёстой.","Хурдны замаар зорчиж байгаа үед тусгай зориулалтын тээврийн хэрэгсэл орж ирсэн ч зам тавьж өгөх шаардлагагүй.","Эвдэрсэн автомашины анхааруулах тэмдэг (аюулгүйн гурвалжин тэмдэг орно)-ийг авч явах ёстой."],"a":"1, 4","imgs":[],"t":"문장형","e":"Хурдны замд орж буй тээврийн хэрэгсэл явж буй тээврийн хэрэгсэлд эгнээг тавьж өгөх ёстой бөгөөд явж байх үед тусгай зориулалтын тээврийн хэрэгсэл орж ирвэл зам тавьж өгөх ёстой. (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 40 дүгээр зүйл (Эвдэрсэн автомашины тэмдэг) ① Хуулийн 66 дугаар зүйлийн дагуу автомашины жолооч эвдрэл болон бусад шалтгаанаар хурдны зам эсвэл автомашины зориулалтын зам (цаашид «хурдны зам зэрэг» гэх) дээр автомашиныг ажиллуулах боломжгүй болсон үед дараах заалтуудад заасан тэмдгийг байрлуулах ёстой.)"},{"n":113,"b":"Дараах тайлбаруудаас зөв 2-ыг сонгоно уу.","c":["Зам тавьж өгөх тэмдэглэгээг замын гадаргуу дээр цагаан өнгийн \"△\" тэмдгээр тэмдэглэдэг.","Зам тавьж өгөх тэмдэгтэй эгнээгээр явж байгаа автомашин бусад эгнээгээр явж байгаа автомашинд эгнээгээ тавьж өгөх ёстой.","Энгийн зам дээр эгнээ солих үед 30 метрийн өмнөөс дохио өгөөд эгнээгээ солино.","Замын хөдөлгөөнийг саадгүй байлгахын тулд хүндрэлтэй байсан ч хурд нэмж, тээврийн хэрэгсэл хоорондын зайг багасган ж олоодох ёстой."],"a":"2, 3","imgs":[],"t":"문장형","e":"Зам тавьж өгөх замын гадаргуугийн тэмдэглэгээ нь «▽» бөгөөд хөдөлгөөний урсгалд саад болсон ч аюулгүй байдал хамгийн чухал гэсэн бодлоор жолоодох ёстой."},{"n":114,"b":"Замын хөдөлгөөний зохицуулалтгүй уулзварт зам тавьж өгөх жолоодлогын талаар зөв 2-ыг сонгоно уу.","c":["Зүүн эргэх гэж байгаа автомашины жолооч тухайн уулзварт чигээрээ явах эсвэл баруун эргэх гэж байгаа автомашинд зам тавьж өгөх ёстой.","Уулзварт орох гэж байгаа автомашины жолооч уулзварт аль хэдийн орчихсон байгаа зүүн эргэх автомашинд зам тавьж өгөх үүрэггүй.","Уулзварт орох гэж байгаа автомашины жолооч нарийн замаас уулзварт орж байгаа автомашинд зам тавьж өгч болохгүй.","Давуу эрх ижил автомашинууд уулзварт нэгэн зэрэг орох гэж байгаа бол баруун талаас ирж байгаа автомашинд зам тавьж өгөх ёстой."],"a":"1, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний зохицуулалтгүй уулзварт зүүн эргэх гэж буй тээврийн хэрэгслийн жолооч уг уулзварт шулуун явах эсвэл баруун эргэх гэж буй тээврийн хэрэгсэлд зам тавьж өгөх ёстой бөгөөд ижил давуу эрхтэй тээврийн хэрэгслүүд уулзварт нэгэн зэрэг орох гэж байгаа үед баруун талын замын тээврийн хэрэгсэлд зам тавьж өгөх ёстой."},{"n":115,"b":"Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу хувийн хөдөлгөөнт хэрэгслийн тухай буруу тайлбар 2-ыг сонгоно уу.","c":["Цагт 25 километр ба түүнээс их хурдтай явах үед цахилгаан хөдөлгүүр ажиллахгүй байх бөгөөд өөрийн жин нь 30 кг-а ас бага төхөөрөмжийг хэлнэ.","Хувийн хөдөлгөөнт хэрэгслийг 13 нас хүрсэн хүн жолоодох эрхгүйгээр жолоодож болно.","Зөвхөн цахилгаан хөдөлгүүрийн хүчээр хөдөлдөг унадаг дугуйг хууль тогтоомжийн дагуу хувийн хөдөлгөөнт хэрэгсэлд ангилдаг.","Хувийн хөдөлгөөнт хэрэгсэл нь дугуйн зам болон явган хүний замаар чөлөөтэй зорчиж болно."],"a":"2, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Тодорхойлолт): Хувийн хөдөлгөөнт хэрэгсэл гэж моторт унадаг дугуйнаас цагт 25 километрээс дээш хурдтай явахад цахилгаан мотор нь ажилладаггүй, их биеийн жин нь 30 килограммаас бага, Дотоод хэрэг, аюулгүй байдлын яамны тушаалаар тогтоосон хэрэгслийг хэлнэ. Зөвхөн цахилгаан моторын хүчээр хөдөлж чадах унадаг дугуйг хууль тогтоомжийн дагуу хувийн хөдөлгөөнт хэрэгсэлд ангилна"},{"n":116,"b":"Зам тээврийн осол гаргах магадлал хамгийн өндөр жолооч аль нь вэ?","c":["Зөвхөн жолоодлогодоо анхаарлаа төвлөрүүлдэг жолооч","Огцом хөдөлж эхлэх, огцом тоормослох, огцом эгнээ солих үйлдлийг давтан хийдэг жолооч","Унадаг дугуй болон хоёр дугуйт тээврийн хэрэгсэлтэй аюулгүй зай барьдаг жолооч","Яаруу зангаа хаяж, тэвчээртэй ханддаг жолооч"],"a":"2","imgs":[],"t":"문장형","e":"Жолоодлогын туршлага багатай жолоочид хүндэтгэл үзүүлж, зам тавьж өгөх нь чухал бөгөөд огцом хөдлөх, огцом тоормослох, огцом эгнээ солихыг давтан жолоодвол зам тээврийн осол гаргах магадлал өндөр."},{"n":117,"b":"Дараах зүйлсээс жолоочийн зөв хандлагад хамгийн тохиромжгүй нь аль вэ?","c":["Гэрлэн дохионоос илүү цагдаагийн албан хаагчийн дохио давуу хүчинтэй болохыг үргэлж санана.","Замын хөдөлгөөний орчны өөрчлөлтийн дагуу шинэчлэгддэг замын хөдөлгөөний дүрмийг сайн мэддэг байна.","Тусгай зориулалтын тээврийн хэрэгсэл хармагц байршлаас үл хамааран түр зогсож, зам тавьж өгнө.","Аадар бороо болон борооны улиралд байнга бороо ордог замд замын эвдрэл (pothole)-ээс болгоомжилно."],"a":"3","imgs":[],"t":"문장형","e":"Тусгай зориулалтын тээврийн хэрэгсэлд зам тавьж өгөх нь зөв боловч уулзвар дотор эсвэл уулзварын ойролцоо биш газарт тусгай зориулалтын тээврийн хэрэгсэлд зам тавьж өгөх ёстой."},{"n":118,"b":"Замын хөдөлгөөнийг зохицуулдаггүй уулзварт чигээрээ явах гэж орж байна. Эсрэг урсгалаас зүүн эргэх гэж байгаа автомашин аль хэдийн уулзварт орсон бол жолооч хэрхэн зөв жолоодох вэ?","c":["Өөр автомашин байгаа тохиолдолд тухайн автомашинд зам тавьж өгнө.","Өөр автомашин байсан ч чигээрээ явж байгаа автомашин давуу эрхтэй тул түрүүлж гарна.","Өөр автомашин байгаа тохиолдолд баруун, зүүн талаа шалгаад тухайн автомашинаас үл хамааран уулзварыг хурдан нэвтэрнэ.","Өөр автомашин байсан ч өөрийн эгнээ эсрэг талынхаас өргөн бол давуу эрхийн дагуу шууд орно."],"a":"1","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 26 дугаар зүйл (Замын хөдөлгөөний зохицуулалтгүй уулзварт зам тавьж өгөх жолоодлого)-ийн 1 дэх хэсэг: Замын хөдөлгөөний зохицуулалтгүй уулзварт орох гэж буй тээврийн хэрэгслийн жолооч аль хэдийн уулзварт орсон өөр тээврийн хэрэгсэл байгаа үед уг тээврийн хэрэгсэлд зам тавьж өгөх ёстой."},{"n":119,"b":"Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу хувийн хөдөлгөөнт хэрэгслийн суудлын тооны талаар буруу тайлбар аль нь вэ?","c":["Цахилгаан кик скүүтерийн суудлын тоо 1 хүн байна.","Цахилгаан өөрөө тэнцвэржүүлэгчийн суудлын тоо 1 хүн байна.","Зөвхөн цахилгаан хөдөлгүүрийн хүчээр хөдөлдөг унадаг дугуйн суудлын тоо 1 хүн байна.","Суудлын тоог хэтрүүлсэн тохиолдолд 40,000 воны зөрчлийн торгууль ногдуулна."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 33-3 дугаар зүйл (Хувийн хөдөлгөөнт хэрэгслийн суудлын багтаамж): Зөвхөн цахилгаан моторын хүчээр хөдөлж чадах унадаг дугуйн хувьд суудлын багтаамж 2 хүн байна. Үүнийг зөрчсөн тохиолдолд 40,000 вон зөрчлийн торгууль ногдуулна."},{"n":120,"b":"Жолоочийн баримтлах зөв хандлагад хамгийн тохирох нь аль вэ?","c":["Харилцан ойлголцол аюулгүй байдлыг эрхэмлэсэн хандлага","Хүнээс илүү автомашиныг чухалчилсан хандлага","Бусдын автомашинаас илүү өөрийн автомашиныг түрүүнд боддог хандлага","Зам тээврийн осол нь хууль дүрэм мөрдөхөөс илүү азаас шалтгаална гэж үздэг хандлага"],"a":"1","imgs":[],"t":"문장형","e":"Автомашинаас хүн тэргүүнд, өөрөөсөө бусад тээврийн хэрэгсэл тэргүүнд, осол гарах эсэх нь азаас бус хууль сахисан жолоодлогоос шалтгаална."},{"n":121,"b":"Замын хөдөлгөөний тухай хуулийн дагуу согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулах нөхцөлтэй жолоодох эрх авсан хүний талаар буруу тайлбар аль нь вэ?","c":["Автомашин жолоодох гэж байгаа бол согтуугаар жолоо барихаас сэргийлэх төхөөрөмжийг суурилуулж, аймаг, нийслэлийн цагдаагийн газрын даргад бүртгүүлэх ёстой.","Согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулаагүй автомашин жолоодож болохгүй.","Суурилуулалтын шаардлага хангаагүй согтуугаар жолоо барихаас сэргийлэх төхөөрөмжтэй автомашиныг жолоодож болно.","Жилд 2-оос доошгүй удаа согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулсан автомашины ашиглалтын бүртгэлийг аймаг, нийслэлийн цагдаагийн газрын даргад хүргүүлэх ёстой."],"a":"3","imgs":[],"t":"문장형","e":"① Замын хөдөлгөөний тухай хуулийн 50-3 дугаар зүйл-ын 1 дэх хэсэг ②③ Замын хөдөлгөөний тухай хуулийн 50-3 дугаар зүйл-ын 3 дахь хэсэг: Согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулах болзолт жолоодох эрх авсан хүн согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулаагүй эсвэл суурилуулах шалгуурт нийцээгүй согтуугаар жолоо барихаас сэргийлэх төхөөрөмж суурилуулсан автомашин зэргийг жолоодож болохгүй. ④ Замын хөдөлгөөний тухай хуулийн 50-3 дугаар зүйл-ын 6 дахь хэсэг"},{"n":122,"b":"Замын хөдөлгөөний тухай хуулийн дагуу хэт ядарсан (нойрмоглон жолоо барихыг оролцуулан) улмаас хэвийн жолоодох боломжгүй байдалтай автомашин жолоодсон хүнд оногдуулах шийтгэл аль нь вэ?","c":["Шийтгэл оногдуулахгүй.","100,000 вон ба түүнээс бага торгууль эсвэл баривчлах ял оногдуулна.","200,000 вон ба түүнээс бага торгууль эсвэл баривчлах ял оногдуулна.","300,000 вон ба түүнээс бага торгууль эсвэл баривчлах ял оногдуулна."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 45 дугаар зүйл (Хэт ядарсан үед зэрэгт жолоо барихыг хориглох), 154 дүгээр зүйл (Шийтгэл): 300,000 вон хүртэл торгууль эсвэл баривчлах ялаар шийтгэнэ. 3 дахь заалт: 45 дугаар зүйлийг зөрчиж хэт ядарсан, өвчтэй байдлаас хэвийн жолоодож чадахгүй байж болзошгүй байдалд автомашин зэрэг буюу трамвай жолоодсон хүн (гэхдээ хувийн хөдөлгөөнт хэрэгсэл жолоодсон тохиолдлыг хасна)"},{"n":123,"b":"Жолоочийн ядралт нь жолоодлогын үйлдэлд нөлөөлдөг. Ядралт нь жолоодлогын үйлдэлд хэрхэн нөлөөлөхийг зөв тайлбарласан нь аль вэ?","c":["Орчны өдөөлтөд үзүүлэх хариу үйлдэл илүү хурдан болдог.","Хараа муудаж, харах хүрээ өргөсдөг.","Мэдрэх болон жолоодлогын удирдлагын чадвар буурдаг.","Нягт нямбай, төлөвлөгөөтэй жолоодлогын үйлдэл илэрдэг."],"a":"3","imgs":[],"t":"문장형","e":"Ядаргаа нь мэдрэх чадвар болон жолоодлогын удирдлагын чадварыг бууруулдаг."},{"n":124,"b":"Суудлын автомашиныг согтуугаар жолоодсон тохиолдолд оногдуулах шийтгэлийн талаар буруу тайлбар аль нь вэ?","c":["Анх удаа зөрчил гаргасан бөгөөд цусан дахь спиртийн агууламж 0.2 хувь ба түүнээс их бол 2 жил ба түүнээс их, 5 жил ба түүнээс бага хугацаагаар хорих ял эсвэл 10,000,000 вон ба түүнээс их, 20,000,000 вон ба түүнээс бага торгууль ногдуулна.","Согтууруулах ундааны хэмжилтээс 1 удаа татгалзсан бол 1 жил ба түүнээс их, 5 жил ба түүнээс бага хугацаагаар хорих ял эсвэл 5,000,000 вон ба түүнээс их, 20,000,000 вон ба түүнээс бага торгууль ногдуулна.","Цусан дахь спиртийн агууламж 0.05 хувь байсан бөгөөд 2 дахь удаагаа зөрчил гаргасан бол 1 жил ба түүнээс бага хугацаагаар хорих ял эсвэл 5,000,000 вон ба түүнээс бага торгууль ногдуулна.","Анх удаа зөрчил гаргасан бөгөөд цусан дахь спиртийн агууламж 0.08 хувь ба түүнээс их, 0.2 хувиас бага бол 1 жил ба түүнээс их, 2 жил ба түүнээс бага хугацаагаар хорих ял эсвэл 5,000,000 вон ба түүнээс их, 10,000,000 вон ба түүнээс бага торгууль ногдуулна."],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 148 дугаар зүйлийн 2 (Шийтгэл) ① 44 дүгээр зүйлийн 1 дэх хэсэг эсвэл 2 дахь хэсгийг (автомашин зэрэг буюу трамвай жолоодсон хүнээр хязгаарлана. Гэхдээ хувийн хөдөлгөөнт хэрэгсэл жолоодсон тохиолдлыг хасна.) зөрчсөнөөр торгууль ба түүнээс хүнд ял оногдуулж, уг ял хүчин төгөлдөр болсон өдрөөс хойш 10 жилийн дотор мөн зүйлийн 1 дэх хэсэг эсвэл 2 дахь хэсгийг дахин зөрчсөн хүн (ял нь хүчингүй болсон хүнийг оролцуулан) нь"},{"n":125,"b":"Жолооч ядарсан үедээ жолоо баривал хурдыг буруу үнэлэх хандлагатай болдог. Дараах зүйлсээс зөв нь аль вэ?","c":["Нарийн зам дээр бодит хурднаас удаан явж байгаа мэт санагддаг.","Эргэн тойрон задгай зам дээр бодит хурднаас хурдан явж байгаа мэт санагддаг.","Алсаас ойртож буй автомашины хурдыг дутуу үнэлснээс осол гарч болзошгүй.","Хурдны зам дээр урд зогсож байгаа автомашиныг явж байгаа автомашин гэж андуурах тохиолдол гардаггүй."],"a":"3","imgs":[],"t":"문장형","e":"① Нарийн замд бодит хурднаас илүү хурдан мэт санагддаг. ② Эргэн тойрон нь задгай замд бодит хурднаас удаан мэт санагддаг. ④ Хурдны зам дээр урд зогссон тээврийн хэрэгслийг явж буй тээврийн хэрэгсэл гэж андуурч мөргөлдөх осол гарч болно."},{"n":126,"b":"Автомашин жолоодох үед чөлөөт явалтын зайд нөлөөлж болох зөв 2-ыг сонгоно уу.","c":["Бороотой өдөр жолоодох үед","Согтууруулах ундаа хэрэглэсэн үед жолоодох үед","Автомашины тоормосны шингэн дутагдалтай үед жолоодох үед","Жолооч ядарсан үед жолоодох үед"],"a":"2, 4","imgs":[],"t":"문장형","e":"Хариу үйлдлийн зай нь жолоочийн бие, сэтгэцийн байдлаас хамаарч нөлөөлөлд өртдөг."},{"n":127,"b":"Согтуугаар жолоо барьсан жолоочид оногдуулах шийтгэлийн талаар зөв 2-ыг сонгоно уу.","c":["Цусан дахь спиртийн агууламж 0.08 хувь ба түүнээс их бол жолоодох эрхийг хүчингүй болгож, эрүүгийн хариуцлага хүлээлгэнэ.","Цагдаагийн албан хаагчийн согтууруулах ундааны хэмжилтээс татгалзсан эсвэл цусан дахь спиртийн агууламж 0.03 хувь ба түүнээс их үед хүний хохиролтой зам тээврийн осол гаргасан бол жолоодох эрхийг хүчингүй болгож, эрүүгийн хариуцлага хүлээлгэнэ.","Цусан дахь спиртийн агууламж 0.03 хувь ба түүнээс их, 0.08 хувиас бага үед согтуугаар жолоо барьсан бол жолоодох эрхийг 120 хоног түдгэлзүүлж, эрүүгийн хариуцлага хүлээлгэнэ.","Анх удаа цусан дахь спиртийн агууламж 0.03 хувь ба түүнээс их, 0.08 хувиас бага үед эд хөрөнгийн хохиролтой зам тээврийн осол гаргасан бол жолоодох эрхийг хүчингүй болгоно."],"a":"1, 2","imgs":[],"t":"문장형","e":"Цусан дахь спиртийн агууламж 0.03 хувь ба түүнээс дээш, 0.08 хувиас доош энгийн согтуугаар жолоо барьсан тохиолдолд 100 хоногийн жолоодох эрх түдгэлзүүлэх болон эрүүгийн хариуцлага хүлээх бөгөөд цусан дахь спиртийн агууламж 0.03 хувь ба түүнээс дээш согтуу жолооч хүний амь нас, эрүүл мэндэд хохирол учруулсан зам тээврийн осол гаргасан тохиолдолд жолоодох эрхийг хүчингүй болгоно."},{"n":128,"b":"Согтуугаар жолоо барихтай холбоотой зөв 2-ыг сонгоно уу.","c":["Амьсгалын хэмжилтээр хийсэн согтууруулах ундааны хэмжилтийн үр дүнг зөвшөөрөхгүй бол дахин амьсгалын хэмжилт өгч болно.","Замын хөдөлгөөний тухай хуульд согтууруулах ундааны хэмжилтэд саад учруулах үйлдлийг шийтгэх заалт байхгүй.","Согтуугаар унадаг дугуй унаад согтууруулах ундааны хэмжилтэд саад учруулсан хүнийг шийтгэж болно.","Согтууруулах ундаа хэрэглэсэн гэж үзэх хангалттай үндэслэлтэй байсан ч цагдаагийн албан хаагчийн согтууруулах ундааны хэмжилтээс татгалзсан автомашины жолоочийн жолоодох эрхийг хүчингүй болгоно."],"a":"3, 4","imgs":[],"t":"문장형","e":"① Замын хөдөлгөөний тухай хуулийн 44 дүгээр зүйлийн 3 дахь хэсэг: Цус авах зэрэг аргаар хэмжилт хийхийг шаардаж болно. ② Замын хөдөлгөөний тухай хуулийн 44 дүгээр зүйлийн 5 дахь хэсэг: Жолоодлогын хяналт шалгалтын нарийвчлал, шударга байдлыг дээшлүүлж, согтуугаар жолоо барьснаас үүдэх нийгмийн хохирлыг бууруулах зорилгоор нэвтрүүлсэн [2024. 1. 3-ны хэсэгчилсэн нэмэлт өөрчлөлт, 2025. 6. 4-нөөс хэрэгжсэн] ③ Замын хөдөлгөөний тухай хуулийн 156 дугаар зүйлийн 12 дахь заалтын 2 ④ Замын хөдөлгөөний тухай хуулийн 93 дугаар зүйл (Жолоодох эрхийг хүчингүй болгох, түдгэлзүүлэх)-ийн 1 дэх хэсгийн 3 дахь заалт"},{"n":129,"b":"Ядралт, хэт ядаргаа, нойрмоглон жолоо барихтай холбоотой зөв 2-ыг сонгоно уу.","c":["Ядарсан үед нойрмоглон жолоо барих нь элбэг тул кофеин их хэрэглэж, нэгэн хэвийн байдлаас зайлсхийхийн тулд ойр ойрхон эгнээ солино.","Өөрчлөлт багатай, аюултай нөхцөл ховор гардаг замд анхаарал төвлөрөл сайжирч, нойрмоглон жолоо барих нь багасдаг.","Ханиадны эм уувал нойр хүрч болзошгүй тул аюулгүй байдлын үүднээс жолоо барихаас зайлсхийх хэрэгтэй.","Согтууруулах ундаа хэрэглэн жолоо барих үед тархины үйл ажиллагаа саарч, нойрмоглон жолоо барих магадлал нэмэгддэг."],"a":"3, 4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний орчны өөрчлөлт нь нэгэн хэвийн хурдны зам зэрэг дээр жолоодох нь хотын зам эсвэл ердийн зам дээр жолоодохоос анхаарал суларч, нойр дутуу эсэхээс үл хамааран нойрмог жолоодлогын үйлдэл ихэсдэг. Мөн амь нас, эрүүл мэндэд хохирол учруулсан зам тээврийн осол гаргасан тохиолдолд 5 жил хүртэл хорих ял (албадан хөдөлмөргүй) эсвэл 20,000,000 вон хүртэл торгуулиар шийтгэнэ. Энэ нь иж бүрэн даатгал эсвэл хариуцлагын даатгалд хамрагдсан эсэх болон эвлэрсэн эсэхээс үл хамааран эрүүгийн хариуцлага хүлээлгэх зүйл юм."},{"n":132,"b":"Цусан дахь спиртийн агууламж 0.03 хувь ба түүнээс их байсан жолооч А гэрлэн дохион дээр зогсож байхад арын автомашин (жолооч Б) мөргөсөн тохиолдолд зөв тайлбар аль нь вэ?","c":["Согтуугаар жолоо барих нь илүү ноцтой зөрчил тул А ослын буруутан болж шийтгүүлнэ.","Ослын буруутан нь Б боловч А-гийн согтуугаар жолоо барьсан үйлдлийг тусад нь шийтгэнэ.","А нь хохирогч тул жолоодох эрхтэй холбоотой захиргааны арга хэмжээ авахгүй.","Б-д ослын шалтгаан, үр дагавартай холбоотой торгуулийн оноо тооцохгүй."],"a":"2","imgs":[],"t":"문장형","e":"Урд явсан тээврийн хэрэгслийн жолооч А согтуу байсан ч согтуугаар жолоо барьсан нь осол гарахад шууд шалтгаан болоогүй бол зам тээврийн ослын хохирогч болох бөгөөд зөвхөн энгийн согтуугаар жолоо барьсан үйлдлийнх нь төлөө тусад нь эрүүгийн хариуцлага болон жолоодох эрхийн захиргааны арга хэмжээ хүлээнэ."},{"n":133,"b":"Замын хөдөлгөөний тухай хуулийн дагуу согтууруулах ундаа хэрэглэсэн үед жолоо барихыг хориглох шалгуур нь жолоочийн цусан дахь спиртийн агууламж ( ) байна. ( ) -д тохирох нь аль вэ?","c":["0.01 хувь ба түүнээс их","0.02 хувь ба түүнээс их","0.03 хувь ба түүнээс их","0.08 хувь ба түүнээс их"],"a":"3","imgs":[],"t":"문장형","e":"44 дүгээр зүйл (Согтуу байдалтай жолоо барихыг хориглох)-ийн 4 дэх хэсэг: Согтуу байдлын шалгуур нь жолоочийн цусан дахь спиртийн агууламж 0.03 хувь ба түүнээс дээш байх тохиолдол байна."},{"n":134,"b":"Дараах нь ядарсан үед жолоо барих болон эмийн нөлөөтэй жолоодлогын тухай тайлбар юм. Зөв 2-ыг сонгоно уу.","c":["Ядарсан үед жолоо барих нь нойрмоглон жолоо барихад хүргэх магадлал бага байдаг.","Ядарсан үед жолоо барих нь анхаарал, дүгнэх чадвар, хариу үйлдлийн хурдыг бууруулдаг тул аюултай.","Мансууруулах бодис хэрэглээд жолоо барьж, зам тээврийн ослоор хүнийг гэмтээсэн жолооч шийтгүүлж болно.","Мансууруулах бодис хэрэглэн жолоо барьж, зам тээврийн ослоор хүнийг гэмтээгээд хэргийн газраас зугтсаны улмаас жолоодох эрх нь хүчингүй болсон бол 3 жил өнгөрсний дараа жолоодох эрх авч болно."],"a":"2, 3","imgs":[],"t":"문장형","e":"Ядарсан байдалтай болон эм бэлдмэл хэрэглэсэн байдалтай жолоодох нь анхаарал, дүгнэх чадвар, хариу үйлдлийн хурдыг бууруулж, нойрмог жолоодлогыг хялбархан үүсгэдэг. Ялангуяа хар тамхи зэрэг эм бэлдмэлийн нөлөөгөөр хэвийн жолоодоход хүндрэлтэй байдалд жолоодож яваад зам тээврийн осол гаргаж, гэмтэлд хүргэсэн тохиолдолд Тодорхой төрлийн гэмт хэрэгт оногдуулах ялыг хүндрүүлэх тухай хуулийн 5-11 дүгээр зүйл (Аюултай жолоодлого зэргээр хүний амь нас, эрүүл мэндэд хохирол учруулах)-ээр шийтгэнэ. ④-ийн тохиолдолд 5 жил өнгөрсөн байх ёстой."},{"n":135,"b":"Дараах зүйлсээс хариу авах жолоодлогоос урьдчилан сэргийлэх арга гэж үзэх боломжгүй нь аль вэ?","c":["Огцом тоормослох үед ослын дохионы гэрлээ асаах","Эсрэг урсгалын автомашин ойртож ирэхэд холын гэрлээ унтраах","Хурдаа нэмэх үед холын гэрлээ асаах","Урд автомашин оройтож хөдлөх үед ойролцоогоор 3 секунд хүлээцтэй хандах"],"a":"3","imgs":[],"t":"문장형","e":"Заналхийлсэн жолоодлогоос урьдчилан сэргийлэх аргад эгнээ солих үед чиг заах дохио асаах, ослын дохио асаах, зам тавьж өгч хүндэтгэх, хоцорч хөдлөх үед 3 секунд хүлээж хүндэтгэх, дуут дохио эсвэл холын гэрлээр өдөөхгүй байх зэрэг орно."},{"n":136,"b":"Дараах зүйлсээс хариу авах жолоодлогын хохирогч болсон үед мэдэгдэх хамгийн тохиромжгүй арга аль нь вэ?","c":["120 дугаарт мэдэгдэх.","112 дугаарт мэдэгдэх.","Ухаалаг гар утасны “Аюулгүй байдлын мэдээлэх төв” -д мэдэгдэх.","Цахим Цагдаагийн газарт мэдэгдэх."],"a":"1","imgs":[],"t":"문장형","e":"Заналхийлсэн жолоодлогод өртсөн үед 112, Цагдаагийн ерөнхий газар болон аймаг, нийслэлийн Цагдаагийн газрын цахим хуудас, Аюулгүй байдлын мэдээллийн цонх зэрэгт мэдэгдэж болно."},{"n":137,"b":"Замын хөдөлгөөний тухай хуулийн дагуу ( )-ын жолооч зам дээр 2 ба түүнээс их хүн хамтран 2 ба түүнээс их автомашиныг үндэслэлгүйгээр урд хойноо цувуулан явуулж, замын хөдөлгөөнд аюул учруулж болохгүй. Үүнийг зөрчсөн тохиолдолд ( )-аар шийтгүүлж болно. ( )-д зөв харгалзуулсан нь аль вэ?","c":["Цахилгаан өөрөө тэнцвэржүүлэгч, 1 жил ба түүнээс бага хугацаагаар хорих ял эсвэл 5,000,000 вон ба түүнээс бага торгууль","Хоёр дугуйт тээврийн хэрэгсэл, 6 сар ба түүнээс бага хугацаагаар хорих ял эсвэл 3,000,000 вон ба түүнээс бага торгууль","Тусгай зориулалтын тээврийн хэрэгсэл, 2 жил ба түүнээс бага хугацаагаар хорих ял эсвэл 5,000,000 вон ба түүнээс бага торгууль","Моторт унадаг дугуй, 6 сар ба түүнээс бага хугацаагаар хорих ял эсвэл 3,000,000 вон ба түүнээс бага торгууль"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 46 дугаар зүйл (Хамтарсан аюултай үйлдлийг хориглох)-ийн 1 дэх хэсэг: Автомашин зэрэг (хувийн хөдөлгөөнт хэрэгслийг хасна)-ийн жолооч зам дээр 2 ба түүнээс дээш хүн хамтран 2 ба түүнээс дээш автомашин зэргийг хууль ёсны шалтгаангүйгээр урд хойно эсвэл зүүн баруун талд эгнүүлэн явуулж бусдад хор хохирол учруулах эсвэл замын хөдөлгөөний аюул үүсгэж болохгүй. Мөн 2 жил хүртэл хорих ял эсвэл 5,000,000 вон хүртэл торгуулиар шийтгэгдэж болно. Цахилгаан хоёр дугуйт тэнцвэржүүлэгч хэрэгсэл нь хувийн хөдөлгөөнт хэрэгсэл тул дээрх заалт хамаарахгүй. Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 21 дэх заалт: «Автомашин зэрэг» гэж автомашин болон моторт унадаг дугуйг хэлнэ. Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 18 дахь заалт: «Автомашин» гэж төмөр зам эсвэл татсан утсыг ашиглалгүйгээр хөдөлгүүр ашиглан жолоодогддог тээврийн хэрэгсэл (чирүүлж буй автомашиныг ч автомашины нэг хэсэг гэж үзнэ) бөгөөд дараах дэд заалтуудын тээврийн хэрэгслийг хэлнэ. а. «Автотээврийн хэрэгслийн удирдлагын тухай хууль»-ийн 3 дугаар зүйлд заасан дараах автомашин. Гэхдээ моторт унадаг дугуйг хасна. 1) суудлын автомашин 2) олон суудалт автомашин 3) ачааны автомашин 4) тусгай автомашин 5) хоёр дугуйт тээврийн хэрэгсэл б. «Барилгын машин механизмын удирдлагын тухай хууль»-ийн 26 дугаар зүйлийн 1 дэх хэсгийн тусгай заалтад заасан барилгын машин механизм"},{"n":138,"b":"Хохирогч автомашины араас явж байсан суудлын автомашины жолооч төвийн шугам даван гүйцэж түрүүлээд огцом тоормослох зэрэг заналхийлсэн жолоодлого хийсэн бол Эрүүгийн хуулийн дагуу хариу авах жолоодлого гэж үзэн шийтгэж болно. Үүнд оногдуулах шийтгэлийн зөв нь аль вэ?","c":["7 жил ба түүнээс бага хугацаагаар хорих ял эсвэл 10,000,000 вон ба түүнээс бага торгууль","10 жил ба түүнээс бага хугацаагаар хорих ял эсвэл 20,000,000 вон ба түүнээс бага торгууль","1 жил ба түүнээс их хугацаатай хорих ял","1 жил 6 сар ба түүнээс их хугацаатай хорих ял"],"a":"1","imgs":[],"t":"문장형","e":"«Эрүүгийн хууль»-ийн 284 дүгээр зүйл (Тусгай заналхийлэл)-ийн дагуу аюултай эд зүйл болох автомашиныг ашиглан Эрүүгийн хуулийн заналхийлэх гэмт хэрэг үйлдсэн этгээдийг 7 жил хүртэл хорих ял эсвэл 10,000,000 вон хүртэл торгуулиар шийтгэнэ."},{"n":139,"b":"Суудлын автомашины жолооч эгнээ солих асуудлаас болж уурлан, нөгөө автомашины өмнө огцом тоормосолсны улмаас араас нь явж байсан ачааны автомашин мөргөж, ачааны автомашины жолооч гэмтсэн бол Эрүүгийн хуулийн дагуу хариу авах жолоодлого гэж үзэн шийтгэж болно. Үүнд оногдуулах шийтгэлийн зөв нь аль вэ? (Хүнд гэмтэл биш.)","c":["1 жил ба түүнээс их, 10 жил ба түүнээс бага хугацаагаар хорих ял","1 жил ба түүнээс их, 20 жил ба түүнээс бага хугацаагаар хорих ял","2 жил ба түүнээс их, 10 жил ба түүнээс бага хугацаагаар хорих ял","2 жил ба түүнээс их, 20 жил ба түүнээс бага хугацаагаар хорих ял"],"a":"1","imgs":[],"t":"문장형","e":"Заналхийлсэн жолоодлогоор хүнийг гэмтээсэн тохиолдлын шийтгэл нь Эрүүгийн хуулийн 258 дугаар зүйлийн 2 (Тусгай гэмтэл учруулах)-ын 1 дэх хэсгийг зөрчсөнөөр 1 жилээс 10 жил хүртэл хорих ял оногдуулна."},{"n":140,"b":"Дараах зүйлсээс Замын хөдөлгөөний тухай хуулийн дагуу аюултай, түрэмгий жолоодлогод хамаарахгүй нь аль вэ?","c":["Хамгийн дээд зөвшөөрөгдөх хурдыг хэтрүүлэх","Зам хөндлөн гарах, буцаж эргэх, ухрахыг хориглосон дүрэм зөрчих","Зам шахан орох","Дуут дохиог дараалан үргэлжлүүлэн өгөх"],"a":"3","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн ① 17 дугаар зүйлийн 3 дахь хэсэгт заасан хурд зөрчих ② 18 дугаар зүйлийн 1 дэх хэсэгт заасан хөндлөн гарах, буцаж эргэх, ухрахыг хориглосныг зөрчих ④ 49 дүгээр зүйлийн 1 дэх хэсгийн 8 дахь заалтад заасан хууль ёсны шалтгаангүй дуу чимээ гаргах бөгөөд ③ нь 23 дугаар зүйл, эгнээ хооронд шургах нь бүдүүлэг жолоодлогын зөрчилд хамаарахгүй."},{"n":141,"b":"Автомашины (хувийн хөдөлгөөнт хэрэгслээс бусад) жолооч дараах үйлдлийг давтан хийж бусдад заналхийлсэн тохиолдолд аюултай, түрэмгий жолоодлогоор шийтгүүлнэ. Аюултай, түрэмгий жолоодлогын үйлдэлд хамаарахгүй нь аль вэ?","c":["Гэрлэн дохио болон зааврыг зөрчих","Зам хөндлөн гарах, буцаж эргэх, ухрахыг хориглосон дүрэм зөрчих","Үндэслэлгүйгээр дуу чимээ гаргах","Хурдны замд зориулалтын эгнээний дүрэм зөрчих"],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 46-3 дугаар зүйл (Бүдүүлэг жолоодлогыг хориглох): Дохио эсвэл заавар зөрчих, төвийн шугам давах, хурд зөрчих, хөндлөн гарах, буцаж эргэх, ухрахыг хориглосныг зөрчих, аюулгүй зай барихгүй байх, эгнээ солихыг хориглосныг зөрчих, огцом тоормослохыг хориглосныг зөрчих, гүйцэж түрүүлэх арга эсвэл гүйцэж түрүүлэхэд саад учруулахыг хориглосныг зөрчих, хууль ёсны шалтгаангүй дуу чимээ гаргах, хурдны зам дээр гүйцэж түрүүлэх арга зөрчих, хурдны зам зэрэг дээр хөндлөн гарах, буцаж эргэх, ухрахыг хориглох"},{"n":142,"b":"Суудлын автомашины жолооч аюултай, түрэмгий жолоодлого хийсэн тохиолдолд Замын хөдөлгөөний тухай хуулийн дагуу оногдуулах шийтгэлийн зөв нь аль вэ?","c":["60,000 воны зөрчлийн торгуулийн мэдэгдэл авна.","30,000 воны захиргааны торгууль ногдуулна.","6 сар ба түүнээс бага хугацаагаар хорих ял эсвэл 2,000,000 вон ба түүнээс бага торгууль ногдуулна.","1 жил ба түүнээс бага хугацаагаар хорих ял эсвэл 5,000,000 вон ба түүнээс бага торгууль ногдуулна."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 46-3 дугаар зүйл болон мөн хуулийн 151-2 дугаар зүйл-ын дагуу бүдүүлэг жолоодлого үйлдсэн тохиолдолд 1 жил хүртэл хорих ял эсвэл 5,000,000 вон хүртэл торгуулиар шийтгэнэ."},{"n":143,"b":"Хурдны замаар зорчиж байх үед автомашины (өөрийн автомашиныг оролцуулан) ачаа зорчих эгнээнд унасан бол жолоочийн авах арга хэмжээний талаар хамгийн буруу нь аль вэ?","c":["Арын автомашины хөдөлгөөнийг шалган аюулгүй газар зогсоно.","Хурдны замын удирдах байгууллага эсвэл холбогдох байгууллагад яаралтай мэдэгдэнэ.","Аюулгүй газар зогссоны дараа ачааны бэхэлгээг шалгана.","Ачаагаа унагасан автомашины жолоочид хариу авах жолоодлого хийнэ."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 39 дүгээр зүйл (Хүн суулгах буюу ачаа ачих арга ба хязгаарлалт)-ийн 4 дэх хэсэг: Бүх тээврийн хэрэгслийн жолооч жолоодож явахдаа ачсан ачаа унахгүй байхаар бүрээс хучих, уях зэргээр найдвартай бэхлэгдэх шаардлагатай арга хэмжээг авах ёстой."},{"n":144,"b":"Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу моторт унадаг дугуйн (хувийн хөдөлгөөнт хэрэгслээс бусад) жолоодлогын дараах үйлдлээс аюултай, түрэмгий жолоодлого гэж үзэх боломжгүй нь аль вэ?","c":["Гэрлэн дохио зөрчих үйлдлийг 3 удаа давтан хийсэн.","Хурд хэтрүүлэх болон заавар зөрчих үйлдлийг дараалан хийсэн.","Гэрлэн дохио зөрчих болон төвийн шугам давах үйлдлийг дараалан хийсэн.","Согтуугаар жолоо барих болон явган зорчигчид зам тавьж өгөх үүргээ зөрчих үйлдлийг дараалан хийсэн."],"a":"4","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 46-3 дугаар зүйл: Дохио эсвэл заавар зөрчих, төвийн шугам давах, хурд зөрчих, хөндлөн гарах, буцаж эргэх, ухрахыг хориглосныг зөрчих, аюулгүй зай барихгүй байх, чиглэл өөрчлөхийг хориглосныг зөрчих, огцом тоормослохыг хориглосныг зөрчих, гүйцэж түрүүлэх арга эсвэл гүйцэж түрүүлэхэд саад учруулахыг хориглосныг зөрчих, хууль ёсны шалтгаангүй дуу чимээ гаргах, хурдны зам дээр гүйцэж түрүүлэх арга зөрчих, хурдны зам зэрэг дээр хөндлөн гарах, буцаж эргэх, ухрахыг хориглосныг зөрчихөд хамаарах хоёр ба түүнээс дээш үйлдлийг дараалан хийх, эсвэл нэг үйлдлийг үргэлжлүүлэн буюу давтан хийж бусдад заналхийлэх, хор хохирол учруулах эсвэл замын хөдөлгөөний аюул үүсгэж болохгүй. Явган зорчигчийг хамгаалах үүргийн зөрчил нь бүдүүлэг жолоодлогын үйлдэлд хамаарахгүй."},{"n":145,"b":"Дараах нь аюултай, түрэмгий жолоодлого болон хариу авах жолоодлогын тухай тайлбар юм. Зөв нь аль вэ?","c":["Мотоциклийн жолооч үндэслэлгүйгээр олон дахин дуу чимээ гарган тодорхойгүй олон хүнд заналхийлсэн бол хариу авах жолоодлогод хамаарна.","Суудлын автомашины жолооч төвийн шугам давж, хурд хэтрүүлэх үйлдлийг дараалан хийж тодорхойгүй олон хүнд аюул учруулсан бол аюултай, түрэмгий жолоодлого болно.","Том оврын ачааны автомашины жолооч тодорхой нэг автомашины урд зориудаар гүйцэж түрүүлэн орж огцом тоормосолсон бол аюултай, түрэмгий жолоодлого болно.","Автобусны жолооч гүйцэж түрүүлэх журмыг олон удаа зөрчиж замын хөдөлгөөнд аюул учруулсан бол хариу авах жолоодлого болно."],"a":"2","imgs":[],"t":"문장형","e":"Бүдүүлэг жолоодлого нь бусдад аюул, саад учруулах жолоодлогын үйлдэл бөгөөд тодорхой бус хүмүүст таагүй мэдрэмж, аюул учруулах үйлдэл тул «Замын хөдөлгөөний тухай хууль»-ийн зохицуулалтад хамаарах бол заналхийлсэн жолоодлого нь зориудаар, санаатайгаар тодорхой хүнд заналхийлэх үйлдэл тул «Эрүүгийн хууль»-ийн зохицуулалтад хамаарна."},{"n":146,"b":"Автомашины жолооч төвийн шугам давах үйлдлийг давтан хийж бусдад хохирол учруулах буюу замын хөдөлгөөнд аюул учруулсан бол Замын хөдөлгөөний тухай хуулийн дагуу ( )-д хамаарна. ( ) -д тохирох нь аль вэ?","c":["Хамтын аюултай үйлдэл","Аюултай, түрэмгий жолоодлого","Хүч хэрэглэсэн жолоодлого","Хариу авах жолоодлого"],"a":"2","imgs":[],"t":"문장형","e":"Замын хөдөлгөөний тухай хуулийн 46-3 дугаар зүйл (Бүдүүлэг жолоодлогыг хориглох): Автомашин зэрэг (хувийн хөдөлгөөнт хэрэгслийг хасна)-ийн жолооч дараах заалтуудаас хоёр ба түүнээс дээш үйлдлийг дараалан
