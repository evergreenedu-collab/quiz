айгаар чигээрээ - чигээрээ\" явах аргаар зүүн тийш эргэх \"дэгээн эргэлт\"-ийг тогтоосон гэж үзэж, хэрэв унадаг дугуйн жолооч автомашины жолооч зэргийн адил ногоон зүүн эргэлтийн сумтай дохио зэрэгт шууд зүүн тийш эргэвэл тухайн заалтыг зөрчсөн гэж тайлбарлаж ирсэн бөгөөд иргэн Цагдаагийн ерөнхий газрын дээрх тайлбартай санал зөрөлдөж Хууль зүйн яаманд хууль тогтоомжийн тайлбар хүссэн. 2. Дүгнэлт: Унадаг дугуй зэргийн жолоочийн уулзварт зүүн тийш эргэх аргыг тогтоосон «Замын хөдөлгөөний тухай хууль»-ийн 25 дугаар зүйлийн 3 дахь хэсэг нь унадаг дугуйн жолооч уулзварт зүүн эргэлтийн дохиогоор шууд зүүн тийш эргэж болохгүй, явах чиглэлийн чигээрээ явах дохиогоор замын баруун захад наалдан \"2 үе шаттайгаар чигээрээ - чигээрээ\" явах аргаар зүүн тийш эргэх ёстой гэсэн \"дэгээн эргэлт\"-ийг хэлж байгаа юм."},{"n":866,"b":"Дараах явган хүний гарцын тэмдгийг суурилуулахад хамгийн тохиромжтой газар аль вэ?","c":["Явган хүний гарцтай, гэрлэн дохиотой хатуу хучилттай замын уулзвар","Явган хүний гарцтай, гэрлэн дохиотой хатуу хучилттай шулуун зам","Явган хүний гарцтай боловч явган зорчигч зам хөндлөн гарахыг хориглосон газар","Явган хүний гарцтай, гэрлэн дохиогүй хатуу хучилттай замын уулзвар эсвэл шулуун зам"],"a":"4","imgs":["q866.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6. 132. Явган хүний гарцын тэмдэг"},{"n":867,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас зөв нь аль вэ?","c":["Цэцэрлэгийн хүүхдийн зорчих зам тул автомашин зорчих боломжгүйг илэрхийлнэ.","Хүүхэд эсвэл бага насны хүүхдийн зорчих зам, эсвэл явган хүний гарц байгааг анхааруулна.","Сургуулийн орцноос 2 км-ийн дараах бүсэд суурилуулна.","Хүүхэд эсвэл бага насны хүүхэд зам хөндлөн гарч болохгүйг анхааруулна."],"a":"2","imgs":["sign_0135.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] Хүүхэд хамгаалах тэмдэг (анхааруулах тэмдэг №133) Хүүхэд буюу балчир хүүхдийн явах зам буюу явган хүний гарц байгааг мэдэгдэх. Сургууль, цэцэрлэг зэ png"],"t":"표지판형","e":"Тухайн аюулгүйн тэмдэглэгээ нь анхааруулах тэмдэг бөгөөд Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6]-д байрлуулах журам болон газрыг тогтоосон. A тэмдгийг хажуугийн салхитай байж болзошгүй цэгийн өмнө 50 метрээс 200 метрийн зайд замын баруун талд байрлуулна (анхааруулах тэмдэг №137). B тэмдгийг хонгилын орох хэсгийн өмнө 50 метрээс 200 метрийн зайд замын баруун талд байрлуулна (анхааруулах тэмдэг №138). C тэмдгийг аюултай бүсийн өмнө 50 метрээс 200 метрийн зайд замын баруун талд байрлуулна (анхааруулах тэмдэг №140). D тэмдгийг байнгын түгжрэлтэй хэсгийн өмнө 50 метрээс 200 метрийн зайд замын баруун талд байрлуулна (анхааруулах тэмдэг №141)."},{"n":872,"b":"Замын хөдөлгөөний тухай хуульд зааснаар зурагт үзүүлсэнтэй адил анхааруулах тэмдэгт хамаарахыг зөв жагсаасан нь аль вэ?","c":["Өгсүүр тэмдэг, байнгын түгжрэлтэй хэсгийн тэмдэг","Тээврийн хэрэгслийн өргөний хязгаарын тэмдэг, тээврийн хэрэгсэл хоорондын зай барих тэмдэг","Трамвайн зориулалтын замын тэмдэг, тойрч явах замын тэмдэг","Хамгаалалтгүй зүүн эргэлтийн тэмдэг, зүүн эргэх болон буцаж эргэх тэмдэг"],"a":"1","imgs":["q872.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, хажуугийн салхины тэмдэг (анхааруулах тэмдэг №137), зэрлэг амьтан хамгаалах тэмдэг (анхааруулах тэмдэг №139) ① Өгсүүр налуугийн тэмдэг болон байнгын түгжрэлтэй хэсгийн тэмдэг нь анхааруулах тэмдэг юм. ② Тээврийн хэрэгслийн өргөний хязгаарлалтын тэмдэг болон тээврийн хэрэгсэл хоорондын зай барих тэмдэг нь хориглох тэмдэг юм. ③ Трамвайн зориулалтын замын тэмдэг болон тойруу замын тэмдэг нь заах тэмдэг юм. ④ Хамгаалалтгүй зүүн эргэлтийн тэмдэг болон зүүн эргэлт ба буцаж эргэх тэмдэг нь заах тэмдэг юм."},{"n":873,"b":"Дараах аюулгүй байдлын тэмдгийн утга зөв аль нь вэ?","c":["Урд 100 метрээс эхлэн хад асгатай аюултай хэсэг тул анхаарна.","Урд 100 метрээс эхлэн зам засварын хэсэг тул анхаарна.","Урд 100 метрээс эхлэн голын эргийн зам тул анхаарна.","Урд 100 метрээс эхлэн олбоотой анхааруулах гэрэл."],"a":"4","imgs":["q907.png"],"t":"표지판형","e":"Автомашин болон автомашины эд ангийн чанар, стандартын тухай дүрмийн 13 дугаар зүйлийн 4 дэх хэсэг болон 15 дахь хэсэгтэй холбоотой <Хавсралт 2> ④ Хөдөлгүүрийн тос дутагдсаны анхааруулах гэрэл"},{"n":908,"b":"Дараах аюулгүй байдлын тэмдгийг суурилуулах газрын талаарх шалгуураас буруу нь аль вэ?","c":["A тэмдгийг трамвайн уулзвараас өмнөх 50–120 метрийн хооронд, замын төв хэсэг эсвэл баруун талд байрлуулна.","B тэмдгийг тойрог уулзвараас өмнөх 30–120 метрийн баруун талд байрлуулна.","C тэмдгийг огцом уруудах налуу эхлэх цэгээс өмнөх 30–200 метрийн баруун талд байрлуулна.","D тэмдгийг замын өргөн нарийсах цэгээс өмнөх 30–200 метрийн баруун талд байрлуулна."],"a":"4","imgs":["q908.png"],"t":"표지판형","e":"A. Трамвайн анхааруулах тэмдэг - Трамвайн уулзварын өмнө 50 метрээс 120 метрийн хооронд замын төв буюу баруун талд (анхааруулах тэмдэг №110-ийн 2) B. Тойрог уулзварын тэмдэг - Уулзварын өмнө 30 метрээс 120 метрийн зайд замын баруун талд (анхааруулах тэмдэг №109) C. Уруудах налуугийн тэмдэг - Уруудах налуу эхлэх цэгийн өмнө 30 метрээс 200 метрийн зайд замын баруун талд (анхааруулах тэмдэг №117) D. Замын өргөн нарийсах тэмдэг - Замын өргөн нарийсах цэгийн өмнө 50 метрээс 200 метрийн зайд замын баруун талд (анхааруулах тэмдэг №118)"},{"n":909,"b":"Дараах хориглох тэмдэг байрлуулсан бүсэд зорчиж болох тээврийн хэрэгсэл аль вэ?","c":["Ачааны автомашин","Мотоблок","Трактор","Гар тэрэг"],"a":"1","imgs":["q909.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] хориглох тэмдэг №207, хөдөө аж ахуйн гар трактор, трактор болон гар тэрэгний хөдөлгөөнийг хориглох тэмдэг юм."},{"n":910,"b":"Дараах хориглох тэмдгийн тайлбараас зөв нь аль вэ?","c":["Хамгийн бага хурдны хязгаарын тэмдэг","Хамгийн дээд хурдны хязгаарын тэмдэг","Тээврийн хэрэгсэл хоорондын зай барих тэмдэг","Аюулгүй хурд барих тэмдэг"],"a":"1","imgs":["q910.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэг ан аюулгүй байдлын тэмдэг.","Буцаж эргэх тээврийн хэрэгсэл зүүн эргэх тээврийн хэрэгслээс давуу болохыг заасан аюулгүй байдлын тэмдэг."],"a":"2","imgs":["sign_0170.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] заах тэмдэг №309-ийн 2 зүүн эргэлт ба буцаж эргэх тэмдэг бөгөөд тээврийн хэрэгсэл зүүн тийш эргэх буюу буцаж эргэхийг заадаг. Зүүн тийш эргэх буюу буцаж эргэхийн давуу эрхийн дарааллыг тодорхой заагаагүй. Энэ аюулгүйн тэмдэглэгээг тээврийн хэрэгсэл зүүн тийш эргэх буюу буцаж эргэх цэгийн замын баруун тал буюу төвд байрлуулна."},{"n":915,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас зөв нь аль вэ?","c":["Авто зогсоол руу орохдоо сумны чиглэлээр зорчихыг заана.","Зүүн эргэхийг хориглосон бүсэд тойруу замаар зорчихыг заана.","Тойрог уулзвар тул анхааралтай эргэхийг заана.","Замын зүүн талаар зорчихыг заана."],"a":"2","imgs":["sign_0171.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] заах тэмдэг №316, тойруу замын тэмдэг бөгөөд тээврийн хэрэгсэл зүүн тийш эргэхийг хориглосон бүсэд тойруу замаар явахыг заадаг"},{"n":916,"b":"Дараах аюулгүй байдлын тэмдэг ямар утгатай вэ?","c":["Цагаан сумны чиглэлээр явж буй тээврийн хэрэгсэл давуу эрхтэйгээр зорчиж болно.","Улаан сумны чиглэлээр явж буй тээврийн хэрэгсэл давуу эрхтэйгээр зорчиж болно.","Цагаан сумны чиглэлээр явж буй тээврийн хэрэгсэл зорчиж болохгүй.","Улаан сумны чиглэлээр явж буй тээврийн хэрэгсэл зорчиж болохгүй."],"a":"1","imgs":["sign_0172.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] заах тэмдэг №332 хөдөлгөөний давуу эрхийн тэмдэг бөгөөд цагаан сумын чиглэлд явж буй тээврийн хэрэгсэл давуу эрхтэй явах боломжтойг илэрхийлдэг"},{"n":917,"b":"Дараах аюулгүй байдлын тэмдэг ямар утгатай вэ?","c":["Унадаг дугуй хөндлөн гарах боломжтой унадаг дугуйн гарц байна.","Унадаг дугуй хөндлөн гарах боломжгүйг мэдээлэх буюу заана.","Унадаг дугуй болон явган зорчигч хөндлөн гарч болно.","Унадаг дугуй болон явган зорчигч хөндлөн гарахад анхаарна."],"a":"1","imgs":["sign_0173.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] заах тэмдэг №325, унадаг дугуйн гарцын тэмдэг юм."},{"n":918,"b":"Дараах аюулгүй байдлын тэмдэг ямар утгатай вэ?","c":["Зүүн талын зам нэг чиглэлийн хөдөлгөөнтэй зам.","Баруун талын зам нэг чиглэлийн хөдөлгөөнтэй зам.","Бүх зам нэг чиглэлийн хөдөлгөөнтэй зам.","Чигээрээ явах зам нэг чиглэлийн хөдөлгөөнтэй зам."],"a":"4","imgs":["sign_0174.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] заах тэмдэг №328 нэг чиглэлийн хөдөлгөөнтэй замын тэмдэг бөгөөд зөвхөн урагш явах боломжтой нэг чиглэлийн хөдөлгөөнтэй зам гэдгийг заасан тэмдэг юм. Нэг чиглэлийн хөдөлгөөнтэй замын орц болон хэсэг доторх шаардлагатай цэгийн замын хоёр талд байрлуулж, хэсгийн эхлэл ба төгсгөлийн нэмэлт тэмдгийг хавсаргаж байрлуулах бөгөөд хэсэг дотор огтлолцох зам байгаа тохиолдолд уулзварын ойролцоох замын хоёр талд байрлуулна."},{"n":919,"b":"Дараах аюулгүй байдлын тэмдэг байрлуулсан эгнээгээр зорчих зөв арга аль вэ?","c":["Цахилгаан кик скүүтер энэ тэмдэгтэй эгнээгээр зорчиж болно.","Цахилгаан унадаг дугуй энэ тэмдэгтэй эгнээгээр зорчиж болохгүй.","Зөвхөн унадаг дугуй энэ тэмдэгтэй эгнээгээр зорчиж болно.","Автомашин энэ тэмдэгтэй эгнээгээр зорчиж болно."],"a":"1","imgs":["sign_0175.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, унадаг дугуйн тусгай эгнээний тэмдэг (заах тэмдэг №318) нь зөвхөн унадаг дугуй зэрэг зорчихоор тогтоосон эгнээний дээр байрлуулна. Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Тодорхойлолт)-ын дагуу унадаг дугуй зэрэг гэдэг нь унадаг дугуй болон хувийн хөдөлгөөнт хэрэгсэл юм. Унадаг дугуй гэдэг нь Унадаг дугуйн хэрэглээг идэвхжүүлэх тухай хуулийн 2 дугаар зүйлийн 1 дэх заалт болон 1 дэх заалтын 2-т заасан унадаг дугуй болон цахилгаан унадаг дугуйг хэлнэ. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 2 дугаар зүйлийн 3 (Хувийн хөдөлгөөнт хэрэгслийн шалгуур)-ын дагуу цахилгаан кикборд нь хувийн хөдөлгөөнт хэрэгсэл юм. Иймд цахилгаан кикборд нь зөвхөн унадаг дугуй зэрэг зорчихоор тогтоосон эгнээгээр зорчиж болно."},{"n":920,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас зөв нь аль вэ?","c":["Зөвхөн унадаг дугуй зорчихыг заана.","Унадаг дугуй болон явган зорчигч хамтран ашиглах зам болохыг заана.","Хүүхдийн хамгаалалтын бүс дотор хүүхэд буюу бага насны хүүхдийг хамгаалахы г заана.","Унадаг дугуйн гарц болохыг заана."],"a":"2","imgs":["sign_0176.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] заах тэмдэг №303 унадаг дугуй, явган зорчигчийн хамтарсан замын тэмдэг бөгөөд унадаг дугуй, явган зорчигчийн хамтарсан замын хэсэг буюу газар доторх шаардлагатай цэгийн хоёр талд байрлуулна."},{"n":921,"b":"Дараах аюулгүй байдлын тэмдэг байрлуулсан уулзварын тайлбар болон зорчих аргын зөв нь аль вэ?","c":["Төвийн хөдөлгөөний арлын захад ачааны автомашинд зориулсан давах хэсэг (Truck Apron) суурилуулж болохгүй.","Уулзварт орох болон гарах үед заавал чиг заах дохио ажиллуулах ёстой.","Чиг заах дохиог зөвхөн орох үед ажиллуулж, гарах үед ажиллуулах ша ардлагагүй.","Уулзвар руу орох гэж буй тээврийн хэрэгсэл сумны чиглэлээр эргэж буй тээврийн хэрэгслээс давуу эрхтэй."],"a":"2","imgs":["sign_0177.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, тойрог уулзварын тэмдэг (заах тэмдэг №304) Тойрог уулзварт байрлуулдаг тойрог уулзварын тэмдэг юм. Тойрог уулзварт орох гэж байгаа тохиолдолд уулзварын дотор цагийн зүүний эсрэг чиглэлд тойрч буй тээврийн хэрэгсэлд зам тавьж өгөх ёстой бөгөөд орох, гарах үед заавал чиг заах дохиог ажиллуулах ёстой. Мөн төв хөдөлгөөний арлын захад том оврын автомашин буюу хагас чиргүүл гишгэн өнгөрөх боломжтойгоор хийсэн ачааны машины гишгүүр зурвас байдаг. Тойрог уулзвар болон ердийн тойргийн ялгааг “Замын бүтэц, байгууламжийн стандартын тухай дүрмийн тайлбар” (Газар нутаг, дэд бүтэц, тээврийн яам) болон “Тойрог уулзварын зураг төслийн заавар” (Газар нутаг, дэд бүтэц, тээврийн яам)-ын дагуу байрлуулж, ашиглана. Ангилал: Тойрог уулзвар / Хөдөлгөөний тойрог. Орох арга: • Орж буй автомашин зам тавьж өгнө (тойрч буй автомашин орж буй автомашинаас хөдөлгөөний давуу эрхтэй) / • Тойрч буй автомашин зам тавьж өгнө. Орох хэсэг: • Удаан хурдтай орохыг чиглүүлнэ / • Өндөр хурдтай орно. Тойрох хэсэг: • Тойрох эгнээнд өндөр хурдтай явахаас сэргийлэх зураг төсөл (том хэмжээний эргэх радиусаас зайлсхийнэ) / • Том хэмжээний тойрох хэсэгт өндөр хурдтай явна. Тусгаарлах хөдөлгөөний арал: • Хурд сааруулах болон чиглэл тусгаарлахын тулд заавал байрлуулна / • Сонголтоор байрлуулна. Төв хөдөлгөөний арал: • Диаметр нь ихэвчлэн 50 м-ийн дотор • Хотын бүсэд диаметр нь хамгийн багадаа 2 м бүхий маш жижиг тойрог уулзварыг ч байрлуулах боломжтой / • Диаметрийн хязгаарлалтгүй. <Тойрог уулзвар ба хөдөлгөөний тойргийн ялгаа>. Мэдээллийн эх сурвалж: “Тойрог уулзварын зураг төслийн заавар” (Газар нутаг, дэд бүтэц, тээврийн яам)"},{"n":922,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас зөв нь аль вэ?","c":["Унадаг дугуйн зам дээр хоёр ба түүнээс дээш унадаг дугуй зэрэгцэн зорчихыг зөвшөөрнө.","Унадаг дугуйн гарц болохыг заана.","Зөвхөн унадаг дугуй зорчихыг заана.","Унадаг дугуйн зогсоол байгааг мэдээлнэ."],"a":"1","imgs":["sign_0178.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] заах тэмдэг №333 унадаг дугуй зэрэгцэн явахыг зөвшөөрөх тэмдэг бөгөөд унадаг дугуйн замд 2 буюу түүнээс олон унадаг дугуй зэрэгцэн явахыг зөвшөөрсөн тэмдэг юм."},{"n":923,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас зөв нь аль вэ?","c":["Унадаг дугуйн гарцын тэмдэг","Унадаг дугуй давуу эрхтэй замын тэмдэг","Унадаг дугуй болон явган зорчигч хамтран ашиглах замын тэмдэг","Унадаг дугуй болон явган зорчигчийн хөдөлгөөнийг тусгаарласан тэмдэг"],"a":"4","imgs":["sign_0179.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] заах тэмдэг №317 унадаг дугуй болон явган зорчигчийн хөдөлгөөн тусгаарласан замын тэмдэг бөгөөд унадаг дугуй болон явган зорчигчийн хамтарсан замд унадаг дугуй болон явган зорчигчийг тусгаарлан явахыг заасан тэмдэг юм."},{"n":924,"b":"Дараах аюулгүй байдлын тэмдгийн утга болон энэ тэмдэг байрлуулсан зам дээр жолоодох аргаас зөв нь аль вэ?","c":["Чиглэл тус бүрээр зорчих эгнээг заасан тэмдэг бөгөөд хориглох тэмдэг юм.","Тээврийн хэрэгсэл зүүн эргэх, чигээрээ явах эсвэл баруун эргэхийг заасан анхааруулах тэмдэг юм.","Тээврийн хэрэгсэл зүүн эргэхдээ уулзварын төвийн гадна талаар эргэнэ.","Тээврийн хэрэгсэл зүүн эргэхдээ урьдчилан замын төв шугам даган удаан явна."],"a":"4","imgs":["sign_0180.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, явах чиглэл тус бүрийн хөдөлгөөний ангиллын тэмдэг (заах тэмдэг №315) Тээврийн хэрэгсэл зүүн тийш эргэх, шулуун явах буюу баруун тийш эргэхийг заадаг. Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйл (Уулзвараар нэвтрэх арга) 1 дэх хэсэг. Бүх тээврийн хэрэгслийн жолооч уулзварт баруун тийш эргэх гэж байгаа тохиолдолд урьдчилан замын баруун захаар удаан явангаа баруун тийш эргэх ёстой. Энэ тохиолдолд баруун тийш эргэж буй тээврийн хэрэгслийн жолооч дохионы дагуу зогсож буй буюу явж буй явган зорчигч буюу унадаг дугуй зэрэгт анхаарах ёстой. 2 дахь хэсэг. Бүх тээврийн хэрэгслийн жолооч уулзварт зүүн тийш эргэх гэж байгаа тохиолдолд урьдчилан замын төвийн шугамыг дагаж удаан явангаа уулзварын төвийн дотор талыг ашиглан зүүн тийш эргэх ёстой."},{"n":925,"b":"Дараах аюулгүй байдлын тэмдэгтэй холбоотой тайлбараас зөв нь аль вэ?","c":["Хувийн хөдөлгөөнт хэрэгсэл зогсоолд тавихыг хориглосон бүсийг мэдээлэх анхааруулах тэмдэг.","Энэ тэмдэг байрлуулсан бүсэд мотоциклыг мөн түр хугацаагаар зогсоолд тавьж болно.","Энэ тэмдэг байрлуулсан бүсэд суудлын автомашиныг мөн түр хугацаагаар зогсоолд тавьж болно.","Хувийн хөдөлгөөнт хэрэгслийн зогсоол байгааг мэдээлэх заах тэмдэг."],"a":"4","imgs":["q925.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] заах тэмдэг №320-ийн 2. Хувийн хөдөлгөөнт хэрэгслийн зогсоолын тэмдэглэгээ. Хувийн хөдөлгөөнт хэрэгслийн зогсоол байгааг мэдэгдэж, хувийн хөдөлгөөнт хэрэгслийн зогсоолд зогсоолд тавихыг заасан тэмдэг юм. Зогсоолын хэсгийг цагаан үргэлжилсэн шугамаар байрлуулна."},{"n":926,"b":"Дараах аюулгүй байдлын тэмдгүүдээс замын хөдөлгөөний тухай хуульд заасан хориглох тэмдэг хэд байгаа вэ?","c":["1","2","3","4"],"a":"3","imgs":["q926.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, 4 аюулгүйн тэмдэглэгээнээс хориглох тэмдэг 3, нэмэлт тэмдэг 1 байна."},{"n":927,"b":"Замын хөдөлгөөний тухай хуульд зааснаар заах тэмдэг байрлуулсан замаар зорчих аргын зөв нь аль вэ?","c":["Тусгай зориулалтын тээврийн хэрэгсэл энэ замаар зорчиж болохгүй.","Ачааны автомашин энэ замаар зорчиж болохгүй.","Хоёр дугуйт тээврийн хэрэгсэл зөвхөн яаралтай тусгай зориулалтын тээврийн хэрэгсэл бол энэ замаар зорчиж болно.","Моторт унадаг дугуй зөвхөн яаралтай тусгай зориулалтын тээврийн хэрэгсэл бол энэ замаар зорчиж болно."],"a":"3","imgs":["q927.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, автомашины зориулалтын замын тэмдэг (заах тэмдэг №301) Автомашины зориулалтын зам буюу зориулалтын бүс гэдгийг заадаг. Замын хөдөлгөөний тухай хуулийн дагуу автомашинаас (хоёр дугуйт тээврийн хэрэгслийн хувьд зөвхөн тусгай зориулалтын тээврийн хэрэгсэл хамаарна) бусад тээврийн хэрэгслийн жолооч буюу явган зорчигч хурдны зам болон автомашины зориулалтын замаар явах буюу хөндлөн гарч болохгүй. Иймд хоёр дугуйт тээврийн хэрэгсэл нь зөвхөн тусгай зориулалтын тээврийн хэрэгсэл байх тохиолдолд л тухайн замаар явж болно."},{"n":928,"b":"Дараах аюулгүй байдлын тэмдэг байрлуулсан замаар зорчиж болохгүй тээврийн хэрэгсэл аль вэ?","c":["Цахилгаан унадаг дугуй","Цахилгаан хоёр дугуйт тэнцвэржүүлэгч хэрэгсэл","Хувийн хөдөлгөөнт хэрэгсэл","Моторт унадаг дугуй (хувийн хөдөлгөөнт хэрэгслийг оруулахгүй)"],"a":"4","imgs":["sign_0181.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, заах тэмдэг №302, унадаг дугуйн зориулалтын замын тэмдэг бөгөөд унадаг дугуйн зориулалтын зам буюу зориулалтын бүс гэдгийг заадаг. Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Тодорхойлолт). Унадаг дугуй зэрэг гэж унадаг дугуй болон хувийн хөдөлгөөнт хэрэгслийг хэлнэ. Унадаг дугуй гэж Унадаг дугуйн хэрэглээг идэвхжүүлэх тухай хуулийн 2 дугаар зүйлийн 1 дэх заалт болон 1 дэх заалтын 2-ын дагуух унадаг дугуй болон цахилгаан унадаг дугуйг хэлнэ. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 2-2 дугаар зүйл (Хувийн хөдөлгөөнт хэрэгслийн шалгуур) 1. Цахилгаан скүтер 2. Цахилгаан хоёр дугуйт тэнцвэржүүлэгч тээврийн хэрэгсэл 3. Зөвхөн цахилгаан моторын хүчээр хөдөлж чадах унадаг дугуй"},{"n":929,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас зөв нь аль вэ?","c":["Хүүхдийн хамгаалалтын бүс дотор хүүхэд буюу бага насны хүүхдийг хамгаалахы г заана.","Явган зорчигчийг явган хүний гарцаар зорчихыг заана.","Явган зорчигчийн зориулалтын зам болохыг заана.","Ахмад настны хамгаалалтын бүс дотор ахмад настныг хамгаалахыг заана."],"a":"3","imgs":["sign_0182.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] заах тэмдэг №321 явган зорчигчийн зориулалтын замын тэмдэг бөгөөд явган зорчигчийн зориулалтын зам гэдгийг заасан тэмдэг юм."},{"n":930,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас зөв нь аль вэ?","c":["Тээврийн хэрэгсэл чигээрээ явсны дараа зүүн эргэхийг заана.","Тээврийн хэрэгсэл зүүн эргэсний дараа чигээрээ явахыг заана.","Тээврийн хэрэгсэл чигээрээ явах эсвэл зүүн эргэхийг заана.","Чигээрээ явж буй тээврийн хэрэгсэл зүүн эргэж буй тээврийн хэрэгслээс давуу эрхтэйг заана."],"a":"3","imgs":["sign_0183.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, заах тэмдэг №309, шулуун явах ба зүүн эргэлтийн тэмдэг бөгөөд тээврийн хэрэгсэл шулуун явах буюу зүүн тийш эргэхийг заадаг"},{"n":931,"b":"A, B-тай холбоотой дараах тайлбаруудаас буруу 2 нь аль вэ?","c":["A нь явган зорчигч давуу эрхтэй замыг илэрхийлсэн заах тэмдэг, B нь явган зорчигч давуу эрхтэй замыг илэрхийлсэн замын тэмдэглэл юм.","Явган зорчигч давуу эрхтэй зам дээр явган зорчигч замын бүх хэсгээр зорчиж болно.","Явган зорчигч давуу эрхтэй зам дээр явган зорчигч давуу эрхтэй тул санаатайгаар тээврийн хэрэгсэл болон хөсгийн хөдөлгөөнд саад учруулж болно.","Явган зорчигч давуу эрхтэй зам дээр зөвхөн явган зорчигч зорчиж болно. A B"],"a":"3, 4","imgs":["q931.png"],"t":"표지판형","e":"A нь явган зорчигчийн давуу эрхтэй замын заах тэмдэг бөгөөд B нь ижил утгатай замын гадаргуугийн тэмдэглэгээ юм (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6]). Явган зорчигчийн давуу эрхтэй замд явган зорчигч замын бүх хэсгээр явж болно. Нөгөө талаар явган зорчигч давуу эрхтэй байсан ч явган зорчигч зам дээр санаатайгаар тээврийн хэрэгслийн хөдөлгөөнд саад учруулж болохгүй (Замын хөдөлгөөний тухай хуулийн 8 дугаар зүйлийн 3 дахь хэсэг). ④ нь явган зорчигчийн зориулалтын замын тухай тайлбар юм (Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйлийн 31 дэх заалт)."},{"n":932,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас зөв нь аль вэ?","c":["Ахмад настны хамгаалалтын бүс тул тээврийн хэрэгсэл болон хөсгийн хөдөлгөөнийг хориглоно.","Ахмад настны хамгаалалтын бүсэд ахмад настнууд зэрэгцэн алхахыг зөвшөөрнө.","Ахмад настны хамгаалалтын бүсэд ахмад настнууд зэрэгцэн алхахыг хориглоно.","Ахмад настны хамгаалалтын бүсэд ахмад настныг хамгаалахыг заана."],"a":"4","imgs":["sign_0184.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] заах тэмдэг №323 ахмад настан хамгаалах тэмдэг бөгөөд ахмад настны хамгаалалтын бүс дотор ахмад настныг хамгаалахыг заадаг."},{"n":933,"b":"Дараах аюулгүй байдлын тэмдэг дээрх зүүн эргэх мэдрэгчтэй гэрлэн дохионы тайлбараас буруу нь аль вэ?","c":["Тээврийн хэрэгсэл зам дээрх дөрвөлжин тэмдэглэгээ (илрүүлэх шугам)-д зогсоход мэдрэгч ажиллаж, тээврийн хэрэгслийг илрүүлнэ.","Зүүн эргэх тээврийн хэрэгсэл байхгүй үед чигээрээ явах дохионы хугацааг уртасгаж болно.","Замын хөдөлгөөний урсгалыг сайжруулж, агаарын бохирдлыг бууруулах үр нөлөөтэй.","Ажиллуулахын тулд зогсоод замын зүүн талд байрлах унтраалгыг дарсны дараа хэсэг хугацаанд хүлээх шаардлагатай."],"a":"4","imgs":["q933.png"],"t":"표지판형","e":"Тухайн аюулгүйн тэмдэглэгээ нь “зүүн эргэлтийн мэдрэгчтэй дохио”-ны тэмдэг бөгөөд заах тэмдэгт хамаарна (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] №335). Зүүн эргэлтийн мэдрэгчтэй дохио нь тээврийн хэрэгсэл зам дээрх дөрвөлжин тэмдэглэгээ (илрүүлэх шугам) дотор зогсоход мэдрэгч ажиллаж тээврийн хэрэгслийг илрүүлээд зүүн эргэлтийн дохио өгч эхэлдэг. Зүүн тийш эргэх тээврийн хэрэгсэл байхгүй үед шулуун явах дохионд илүү хугацаа өгөх боломжтой тул хөдөлгөөний урсгалыг саадгүй болгож, агаарын бохирдлыг бууруулах үр нөлөө хүлээгдэж байна. Мөн сул зогсолтын хугацаа багасахын хэрээр жолоочийн шатахууны зардал буурах зэрэг эдийн засгийн үр нөлөөг ч хүлээж болно (Газар нутаг, дэд бүтэц, тээврийн яамны хэвлэлийн мэдээ, Солонгосын Замын хөдөлгөөний газар (KoROAD)-ын сурталчилгааны материал)."},{"n":934,"b":"Дараах аюулгүй байдлын тэмдгийн төрлийн зөв нь аль вэ?","c":["Баруун эргэлтийн тэмдэг","Баруун тийш мурийсан замын тэмдэг","Баруун эргэлт давуу эрхтэй тэмдэг","Баруун талаар давуу эрхтэй тэмдэг"],"a":"1","imgs":["sign_0185.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, баруун эргэлтийн тэмдэг (заах тэмдэг №306) юм."},{"n":935,"b":"Дараах замын хөдөлгөөний аюулгүй байдлын байгууламж суурилуулсан уулзвар дээр зорчих аргуудаас зөв нь аль вэ?","c":["Зөвхөн зүүн эргэх ногоон суман гэрэл ассан үед зүүн эргэж болно.","Зүүн эргэх дохионы үед зүүн эргэнэ, эсвэл чигээрээ явах дохионы үед эсрэг чиглэлээс ирж буй тээврийн хэрэгсэлд саад болохгүйгээр зүүн эргэж болно.","Гэрлэн дохионоос үл хамааран эсрэг чиглэлээс ирж буй тээврийн хэрэгсэлд саад болохгүйгээр зүүн эргэж болно.","Шар гэрэл ассан үед эсрэг чиглэлээс ирж буй тээврийн хэрэгсэлд саад болохгүйгээр зүүн эргэж болно."],"a":"2","imgs":["q935.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийн 5 дугаар зүйл, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 6 дугаар зүйл, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 8 дугаар зүйл. Гэрлэн дохионы зүүн эргэлтийн ногоон сумтай гэрэл асаж байгаа тохиолдолд зүүн тийш эргэж болох бөгөөд явах дохионы үед эсрэг чиглэлээс ирж буй тээврийн хэрэгсэлд саад болохгүйгээр зүүн тийш эргэж болно."},{"n":936,"b":"Төв шугам дээр суурилуулсан замын аюулгүй байдлын байгууламжийн тайлбараас буруу нь аль вэ?","c":["Төв шугамын замын тэмдэглэл дээр суурилуулсан замын аюулгүй байдлын байгууламж нь төв тусгаарлах шон юм.","Зам тээврийн ослын эрсдэл өндөртэй газрыг урьдчилан анхааруулах зорилгоор суурилуулдаг.","Жолоочийн анхаарал шаардлагатай газарт замын тэмдэглэлийг дэмжиж харааг чиглүүлэх байгууламж юм.","Ижил болон эсрэг чиглэлийн хөдөлгөөний урсгалыг орон зайн хувьд тусгаарлах зорилгоор суурилуулдаг."],"a":"1","imgs":["q936.png"],"t":"표지판형","e":"① Асуултын замын аюулгүй байдлын байгууламж нь харааны чиглүүлэх шон юм. Замын аюулгүй байдлын байгууламжийг байрлуулах, арчлах заавар (Газар нутаг, дэд бүтэц, тээврийн яамны дүрэм №318) - 1 дүгээр хэсэг Харааны чиглүүлэх байгууламжийн хэсэг. Харааны чиглүүлэх шон нь зам тээврийн осол гарах эрсдэл өндөр бөгөөд жолоочийн анхаарал онцгой шаардлагатай газарт замын гадаргуугийн тэмдэглэгээг нөхөж нэг чиглэлийн болон эсрэг чиглэлийн хөдөлгөөний урсгалыг орон зайн хувьд тусгаарлаж, аюултай хэсгийг урьдчилан мэдэгдэх зорилгоор байрлуулдаг байгууламж юм."},{"n":937,"b":"Дараах замын тэмдэглэл ямар утгатай вэ?","c":["Урд талд хурд сааруулагч эсвэл уулзварын өгсүүр хэсэг байна.","Урд талын зам нарийсаж байна.","Хоёр тээврийн хэрэгсэл зэрэгцэн зорчиж болно.","Уулын бүсийн зам."],"a":"1","imgs":["q937.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, өгсүүр налуу гадаргуугийн тэмдэглэгээ (замын гадаргуугийн тэмдэглэгээ №544) Өгсүүр налуу гадаргуугийн замын гадаргуугийн тэмдэглэгээ бөгөөд урд өгсүүр налуу гадаргуу буюу хурд сааруулах довжоо байгааг мэдэгдэх"},{"n":938,"b":"Дараах замын тэмдэглэлийг суурилуулах газрын зөв нь аль вэ?","c":["Тээврийн хэрэгсэл болон хөсөг урсгал сөрөн зорчихыг хориглосон замын хэсэгт суурилуулна.","Тээврийн хэрэгсэл болон хөсөг буцаж эргэхийг хориглосон замын хэсэгт суурилуулна.","Тойрог уулзвар дотор урсгал сөрж зорчихыг хориглосон замын хэсэгт суурилуулна.","Тойрог уулзвар дотор буцаж эргэхийг хориглосон замын хэсэгт суурилуулна."],"a":"2","imgs":["q938.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, буцаж эргэхийг хориглох тэмдэглэгээ (замын гадаргуугийн тэмдэглэгээ №514) Тээврийн хэрэгсэл буцаж эргэхийг хориглох замын хэсэг буюу газар доторх шаардлагатай цэгт байрлуулна."},{"n":939,"b":"Дараах нөхцөлд улаан өнгийн замын тэмдэглэлийн тайлбараас зөв нь аль вэ?","c":["Зорчих хэсэг болон явган хүний замыг тусгаарлах замын хажуугийн хөвөөг тэмдэглэсэн.","Тээврийн хэрэгслийн эгнээ солихыг хязгаарласан.","Явган зорчигчийг хамгаалах шаардлагатай бүсийг тэмдэглэсэн.","Гал унтраах байгууламж зэрэг суурилуулсан бүсийг тэмдэглэсэн."],"a":"4","imgs":["img_0186.jpg"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, замын гадаргуугийн тэмдэглэгээ №516-ийн 3. Гал унтраах байгууламж зэргийг байрлуулсан газраас тус бүр 5 метрийн дотор, гал унтраах ажиллагааг шуурхай явуулахад онцгой шаардлагатай гэж үзсэн газарт зогсох, зогсоолд тавихыг хориглосныг илэрхийлдэг"},{"n":940,"b":"Дараах замын тэмдэглэлийн дагуу зөв жолоодох арга аль вэ?","c":["Хүүхдийн хамгаалалтын бүс тул зогсоолд тавихыг хориглодог боловч түр зогсо х боломжтой учир замын хажууд богино хугацаанд зогсож хүүхдээ суулгана.","Хүүхдийн хамгаалалтын бүс дотор явган хүний гарцын урьдчилан анхааруула х тэмдэглэл байгаа тул урьдчилан удаан явна.","Хүүхдийн хамгаалалтын бүс тул хүүхэд болон бага насны хүүхдийн аюулгү й байдалд анхаарч, зигзаг замын тэмдэглэлийн дагуу удаан явна.","Хүүхдийн хамгаалалтын бүс нь цагийн хуваарьтай ажилладаг эсэхээс үл хамаара н түр зогсож болно."],"a":"3","imgs":["q940.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, удаан явах тэмдэглэгээ (замын гадаргуугийн тэмдэглэгээ №520), зогсох, зогсоолд тавихыг хориглох тэмдэглэгээ (замын гадаргуугийн тэмдэглэгээ №516), хүүхдийн хамгаалалтын бүсийн тэмдэглэгээ (замын гадаргуугийн тэмдэглэгээ №536), Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Тодорхойлолт) Хүүхэд гэж 13 наснаас доош насны хүнийг хэлнэ."},{"n":941,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас буруу нь аль вэ?","c":["Өндөрлөсөн явган хүний гарцын тэмдэглэл юм.","Гүдгэр трапец хэлбэртэй, хурд сааруулагчийн хэлбэртэй бөгөөд өндөр нь 10 см байна.","Жолоочийн анхаарлыг сэргээх шаардлагатай газарт суурилуулдаг.","Бүх замд суурилуулж болно."],"a":"4","imgs":["sign_0187.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, өндөрлөсөн явган хүний гарцын тэмдэглэгээ (замын гадаргуугийн тэмдэглэгээ №533) Хурдны дээд хязгаарыг цагт 30 километр буюу түүнээс доош хязгаарлах шаардлагатай замд явган хүний гарц гэдгийг илэрхийлдэг"},{"n":942,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас зөв нь аль вэ?","c":["Урд талд аюулгүйн бүс байгааг мэдээлнэ.","Тээврийн хэрэгсэл зам тавьж өгөх ёстой газрыг тэмдэглэнэ.","Урд талд явган хүний гарц байгааг мэдээлнэ.","Зогсоолд тавьж болох газрыг тэмдэглэнэ."],"a":"3","imgs":["sign_0188.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, явган хүний гарцын тэмдэглэгээ (замын гадаргуугийн тэмдэглэгээ №529) Явган хүний гарцын өмнө 50 метрээс 60 метрийн зайд замын гадаргуу дээр байрлуулж, шаардлагатай тохиолдолд 10 метрээс 20 метр нэмсэн зайд нэмэлтээр байрлуулна"},{"n":943,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас зөв нь аль вэ?","c":["Унадаг дугуйн зориулалтын замыг тэмдэглэнэ.","Унадаг дугуй зэрэг тээврийн хэрэгслийн унадаг ду рэл ассан үед буцаж эргэж болно.","Буцаж эргэх тэмдэг нь замын хөдөлгөөний аюулгүй байдлын тэмдгийн заах тэмдэгт хамаарна."],"a":"3","imgs":["q953.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, буцаж эргэх тэмдэг (заах тэмдэг №311) Тээврийн хэрэгсэл болон хөсөг буцаж эргэх цэгийн замын баруун тал буюу төвд байрлуулна"},{"n":954,"b":"Дараах аюулгүй байдлын тэмдгийн утгаас хамгийн зөв нь аль вэ?","c":["Автомашин болон хоёр дугуйт тээврийн хэрэгсэл 08:00–20:00 цагийн хооронд зорчихыг хориглоно.","Автомашин, хоёр дугуйт тээврийн хэрэгсэл болон моторт унадаг дугуй 08:00–20:00 цагийн хооронд зорчихыг хориглоно.","Автомашин болон моторт унадаг дугуй 08:00–20:00 цагийн хооронд зорчихыг хориглоно.","Автомашин болон унадаг дугуй 08:00–20:00 цагийн хооронд зорчихыг хориглоно."],"a":"2","imgs":["sign_0195.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, автомашин, хоёр дугуйт тээврийн хэрэгсэл болон моторт унадаг дугуйн хөдөлгөөнийг хориглох тэмдэг (хориглох тэмдэг №206) Автомашин, хоёр дугуйт тээврийн хэрэгсэл болон моторт унадаг дугуйн хөдөлгөөнийг заасан цагт хориглохыг илэрхийлнэ."},{"n":955,"b":"Дараах аюулгүй байдлын тэмдгийн дагуу чирж ачихгүй нөхцөл аль нь вэ?","c":["Жолооч машинаасаа бууж 4 минутын турш ариун цэврийн өрөө орсон тохиолдол.","Жолооч машинаасаа бууж 10 минутын турш ачаа хүргээд ирсэн тохиолдол.","Жолооч машинаа зогсоож, жолоочийн суудалд 10 минут сууж байгаа тохиолдол.","Жолооч машинаа зогсоож, жолоочийн суудалд 4 минут сууж байгаа тохиолдол."],"a":"4","imgs":["q955.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Тодорхойлолт) Зогсоолд тавих гэж жолооч зорчигч хүлээх, ачаа ачих, тээврийн хэрэгсэл эвдрэх буюу бусад шалтгаанаар тээврийн хэрэгслийг үргэлжлүүлэн зогссон байдалд байлгах, эсвэл жолооч тээврийн хэрэгслээс холдож тухайн тээврийн хэрэгслийг шууд жолоодох боломжгүй байдалд байлгахыг хэлнэ. Зогсох гэж жолооч 5 минутаас хэтрүүлэлгүйгээр тээврийн хэрэгслийг зогсоохыг хэлэх бөгөөд зогсоолд тавихаас бусад зогссон байдлыг хэлнэ. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, зогсоолд тавихыг хориглох тэмдэг (хориглох тэмдэг №219) Тээврийн хэрэгсэл зогсоолд тавихыг хориглодог. Чирэх бүсийн тэмдэг (нэмэлт тэмдэг №428)"},{"n":956,"b":"Дараах зургийн тайлбараас тохиромжгүй нь аль вэ?","c":["Барилгагүй замын хажуу эсвэл сул талбайд байрлуулдаг хаягийн мэдээллийн байгууламж (суурь дугаарын самбар) юм.","Ногоон замын эхлэх цэгээс 4.73 км-ийн зайд баруун талын замын хажууд байрлуулсан суурь дугаарын самбар юм.","Ногоон замын эхлэх цэгээс 40.73 км-ийн зайд зүүн талын замын хажууд байрлуулсан суурь дугаарын самбар юм.","Суурь дугаарын самбар дээрх замын нэр болон суурь дугаараар тухайн цэгийн байршлыг нарийн тодорхойлж болно."],"a":"2","imgs":["q956.png"],"t":"표지판형","e":"Суурь дугаарын хавтанг гудамжны гэрэл, замын гэрлэн дохио, замын тэмдэг зэргийг суурилуулсан шон, замын хэсгийн хонгил болон гүүр зэрэг байршлыг заах шаардлагатай газар, бусад хотын дарга зэрэг шаардлагатай гэж үзсэн газарт байрлуулна. Замын нэрийн хаягийн тухай хуулийн 9 дүгээр зүйл (Замын нэрийн хавтан болон суурь дугаарын хавтанг байрлуулах) 2 дахь хэсэг. Замын нэрийн хаягийн тухай хуулийн 9 дүгээр зүйл (Замын нэрийн хавтан болон суурь дугаарын хавтанг байрлуулах) 1 дэх хэсэг. Хаягийн мэдээллийн байгууламжийн дүрмийн 15 дугаар зүйл (Суурь дугаарын хавтанг байрлуулах арга) 1 дэх хэсгийн 3 дахь заалт. Хаягийн мэдээллийн байгууламжийн дүрмийн 14 дүгээр зүйл (Суурь дугаарын хавтанг байрлуулах газар зэрэг). Замын нэрийн хаягийн тухай хуулийн 11 дүгээр зүйл (Барилгын дугаар олгох), мөн хуулийг хэрэгжүүлэх журмын 23 дугаар зүйл (Барилгын дугаар олгох шалгуур)"},{"n":957,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас зөв нь аль вэ?","c":["Зөвхөн Ням гараг болон бүх нийтийн амралтын өдөр автобусны тусгай эгнээгээр зөвшөөрөгдсөн тээврийн хэрэгсэл зорчиж болохыг мэдээлнэ.","Ням гараг болон бүх нийтийн амралтын өдрөөс бусад үед автобусны тусгай эгнээгээр зөвшөөрөгдсөн тээврийн хэрэгсэл зорчиж болохыг мэдээлнэ.","Долоо хоногийн бүх өдөр автобусны тусгай эгнээгээр зөвшөөрөгдсөн тээврийн хэрэгсэл зорчиж болохыг мэдээлнэ.","Ням гараг болон бүх нийтийн амралтын өдрөөс бусад үед бүх тээврийн хэрэгсэл зорчиж болохыг мэдээлнэ."],"a":"2","imgs":["sign_0197.png"],"t":"표지판형","e":"Заасан өдрөөс бусад үед зөвхөн автобусны зориулалтын эгнээгээр явах эрхтэй тээврийн хэрэгсэл явж болохыг илэрхийлнэ."},{"n":958,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас буруу нь аль вэ?","c":["Хүүхдийн хамгаалалтын бүсэд хүүхдийн сургуулийн автобус хүүхэд суулгах , буулгах зорилгоор тэмдэг дээр заасан цагт түр зогсож болно.","Хүүхдийн хамгаалалтын бүсэд хүүхдийн сургуулийн автобус хүүхэд суулгах , буулгах зорилгоор тэмдэг дээр заасан цагт түр зогсох болон зогсоолд тавих ал ь аль нь боломжтой.","Автомашин хүүхэд суулгах, буулгах зорилгоор хүүхдийн хамгаалалтын бүсэд тү р зогсож болно.","Автомашин хүүхэд суулгах, буулгах зорилгоор хүүхдийн хамгаалалтын бүсэд тү р зогсож болох боловч зогсоолд тавьж болохгүй."],"a":"4","imgs":["q958.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6, 320-ийн 4 хүүхэд суулгах, буулгах тэмдэглэгээ. Хүүхдийн хамгаалалтын бүсэд хүүхдийн сургуулийн автобус болон автомашин зэрэг хүүхэд суулгах, буулгахын тулд тэмдэг дээр заасан цагийн турш зогсох болон зогсоолд тавьж болохыг заасан бөгөөд хүүхдийн хамгаалалтын бүсэд хүүхдийн сургуулийн автобус болон автомашин зэрэг хүүхэд суулгах, буулгахын тулд зогсох болон зогсоолд тавьж болох газар болон шаардлагатай цэг буюу хэсгийн замын баруун талд байрлуулах, эсвэл хэсгийн эхлэл ба төгсгөл буюу цагийн нэмэлт тэмдгийг хавсаргаж байрлуулна"},{"n":959,"b":"Замын тэмдгийн дүрмийн дагуу дараах замын тэмдгийн нэр зөв аль нь вэ?","c":["Аюултай хэсгийг урьдчилан анхааруулах тэмдэг","Хурдны хязгаар дууссаны тэмдэг","Нийлэх цэг рүү чиглүүлэх тэмдэг","Гарцын өмнөх хурд сааруулах чиглүүлэх тэмдэг"],"a":"4","imgs":["q959.png"],"t":"표지판형","e":"Замын тэмдгийн дүрэм (Газар нутаг, дэд бүтэц, тээврийн яамны тушаал), гарцын хурд сааруулах чиглүүлэх тэмдэг (замын тэмдгийн стандартын дэлгэрэнгүй болон байрлуулах арга №426-3) Эхний гарцын хурд сааруулах эгнээний эхлэх цэгээс урагш 300 м, 200 м, 100 м-ийн цэгт тус тус байрлуулна."},{"n":960,"b":"Дараах замын нэрийн самбарын тайлбараас зөв нь аль вэ?","c":["Зүүн болон баруун хоёр чиглэлд зориулсан замын нэрийн самбар юм.","“1→” гэсэн байрлал нь зам дуусах цэгийг илэрхийлнэ.","Ганнамын гудамж нь 699 метр юм.","“Ганнамын гудамж” нь замын нэрийг илэрхийлнэ."],"a":"4","imgs":["q960.png"],"t":"표지판형","e":"Каннам-дэро өргөн замын эхлэх цэгийг илэрхийлэх бөгөөд “1→” гэсэн энэ байршил нь замын эхлэх цэгийг илэрхийлж, Каннам-дэро замын урт нь 6.99 километр гэдгийг илэрхийлнэ."},{"n":961,"b":"Дараах эхлэх цэгийн тэмдэг ямар утгатай вэ?","c":["Улсын чанартай авто зам болон хурдны замын орох, гарах уулзвар (IC) хүртэлх зайг мэдээлэх тэмдэг.","Хурдны зам эхэлсэн цэгээс одоогийн байрлал хүртэлх зайг мэдээлэх тэмдэг.","Хурдны замын амрах зогсоол хүртэлх зайг мэдээлэх тэмдэг.","Төлбөр авах цэг хүртэлх зайг мэдээлэх тэмдэг."],"a":"2","imgs":["q961.png"],"t":"표지판형","e":"Хурдны зам эхлэх цэгээс одоогийн байршил хүртэлх зайг мэдэгдэх тэмдэг. Тээврийн хэрэгсэл эвдрэх буюу осол зэрэг санаанд оромгүй нөхцөл байдалд өөрийн байршлыг нарийн мэдэж болно. - Ногоон дэвсгэртэй тоо: эхлэх цэгээс хойших зай (км) - Цагаан дэвсгэртэй тоо: аравтын бутархай зай (км)"},{"n":962,"b":"Дараах аюулгүй байдлын тэмдгийн тайлбараас буруу нь аль вэ?","c":["Диагональ явган хүний гарцын тэмдэглэл юм.","Бүх чиглэлд зам хөндлөн гарах боломжтой явган хүний гарц юм.","Явган зорчигчийн хөдөлгөөн ихтэй эсвэл хүүхдийн хамгаалалтын бүс зэрэг явга н зорчигчийн аюулгүй байдал, тав тухыг хангах шаардлагатай газарт байрлуулна.","Явган хүний гарцын тэмдэглэгээ хоорондын хоосон зай нь явган хүний гарцад хамаарахгүй."],"a":"4","imgs":["sign_0198.png"],"t":"표지판형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6. 532-ын 2. Диагональ явган хүний гарцын тэмдэглэгээ. Бүх чиглэлд явах боломжтой явган хүний гарц (явган хүний гарцын тэмдэглэгээний хоорондох хоосон зай ч явган хүний гарцад багтана) гэдгийг илэрхийлдэг. Явган хүний замын хөдөлгөөн ихтэй буюу хүүхдийн хамгаалалтын бүс зэрэг явган зорчигчийн аюулгүй байдал, тав тухыг хангах боломжтой цэгт байрлуулна."},{"n":963,"b":"Дараахаас төрийн байгууллагын барилгын дугаарын самбар аль нь вэ?","c":["Ⓐ","Ⓑ","Ⓒ","Ⓓ"],"a":"4","imgs":["q963.png"],"t":"표지판형","e":"Хаягийн мэдээллийн байгууламжийн дүрмийн [Хавсралт 13] <2024. 7.19-нд нэмэлт өөрчлөлт орсон> Ⓐ нь суурь дугаарын хавтан, Ⓑ нь ердийн зориулалтын барилгын дугаарын хавтан, Ⓒ нь үндэсний өв болон аялал жуулчлалын зориулалтын барилгын дугаарын хавтан, Ⓓ нь төрийн байгууллагын зориулалтын барилгын дугаарын хавтан юм."},{"n":964,"b":"Дараах барилгын дугаарын самбарын тайлбараас зөв нь аль вэ?","c":["Пёнчон зам нь замын нэр, 30 нь барилгын дугаар юм.","Пёнчон зам нь үндсэн үүд, 30 нь суурь дугаар юм.","Пёнчон зам нь замын эхлэх цэг, 30 нь барилгын хаяг юм.","Пёнчон зам нь замыг ангилах шалгуур, 30 нь дэлгэрэнгүй хаяг юм."],"a":"1","imgs":["q964.png"],"t":"표지판형"},{"n":965,"b":"Дараах гурван чиглэлийн замын нэрийн урьдчилан мэдээлэх тэмдгийн тайлбараас зөв нь аль вэ?","c":["Зүүн эргэвэл 300 метрийн цаана хотын захиргаа гарч ирнэ.","“Гуанпён гудамж” нь баруунаас зүүн чиглэлд тогтоогдсон замын хэсэг юм.","Баруун эргэвэл 300 метрийн цаана Пёнчон метроны буудал гарч ирнэ.","Чигээрээ явбал 300 метрийн цаана “Гуанпён гудамж” гарч ирнэ."],"a":"4","imgs":["q965.png"],"t":"표지판형","e":"Замын хэсэг зэргийг тогтоох, өөрчлөх тухай нарийвчилсан шалгуур [Дотоод хэрэг, аюулгүй байдлын яамны заавар №162, 2021.6.9-нд батлагдсан] 5 дугаар зүйл 1. Өөр замын хэсэгтэй холбогдсон цэг буюу орох гарах хэсгийг эхлэх цэг болгох боловч эхлэх цэг болон төгсгөлийн цэг ижил нөхцөлтэй тохиолдолд өрнөөс дорно зүг, өмнөөс умар зүгийн чиглэлд тогтооно"},{"n":966,"b":"Дараах бичлэгийг үзээд хамгийн аюултай нөхцөл аль болохыг тодорхойлно уу. (Вэбсайтаас үзнэ үү)","c":["Баруун талд түр зогссон том оврын тээврийн хэрэгсэл хөдөлж эхлэх гэж буй нөхцөл.","Эсрэг чиглэлээс ирж буй шар өнгийн суудлын автомашин гэрлэн дохио зөрчиж буй нөхцөл.","Баруун талын замаас баруун эргэсэн хар өнгийн суудлын автомашин 1-р эгнээ рүү орж буй нөхцөл.","Эсрэг чиглэлээс ирж буй цагаан өнгийн суудлын автомашин эргэлтийн гадна дугуйн хөдөлгөөнийг тооцоололгүйгээр баруун эргэж буй нөхцөл."],"a":"3","imgs":[],"t":"동영상형","e":"Баруун тийш эргэх гэж буй автомашин шулуун явж буй тээврийн хэрэгслийн хурдыг удаан гэж таамагласан тохиолдолд зогсоолд тавьсан автомашинуудаас зайлсхийж 1 дүгээр эгнээ рүү нэг дор орох тохиолдол олон байдаг. Иймд баруун тийш эргэж буй автомашин байгаа тохиолдолд шулуун явах нь давуу эрхтэй гэсэн туйлын дүгнэлтээс зайлсхийж баруун тийш эргэх автомашины жолооч хүчээр орж ирэх тохиолдлыг урьдчилан таамаглаж жолоодох шаардлагатай."},{"n":967,"b":"Дараах бичлэгийг үзээд хамгийн аюултай нөхцөл аль болохыг тодорхойлно уу. (Вэбсайтаас үзнэ үү)","c":["Урд явж буй саарал өнгийн суудлын автомашин огцом тоормослож буй нөхцөл","Эсрэг чиглэлээс ирж буй шар өнгийн суудлын автомашин төв шугам давж буцаж эргэх гэж буй нөхцөл","Зүүн эргэхээр хүлээж байсан автобус чигээрээ явахын тулд гэнэт хөдөлж буй нөхцөл","Баруун эгнээнээс цагаан өнгийн суудлын автомашин миний урд орж ирж буй нөхцөл"],"a":"4","imgs":[],"t":"동영상형","e":"Уулзварт орж явж буй тээврийн хэрэгслийн жолооч орсон байрлалаа үндэслэн гарахын тулд явах замналыг дагаж уулзварыг аюулгүй нэвтрэх ёстой. Гэвч асуултын бичлэгт үзүүлсэн шиг уулзварын чиглүүлэх шугам байхгүй тохиолдолд буюу чиглүүлэх шугам байсан ч хүлээгдэж буй замналаас гарах тохиолдол байнга гардаг. Иймд уулзварыг нэвтрэх тохиолдолд урдах автомашин төдийгүй хажуугийн автомашины явах замналд анхаарч жолоодох шаардлагатай."},{"n":968,"b":"Дараах бичлэгийг үзээд хамгийн аюултай нөхцөл аль болохыг тодорхойлно уу. (Вэбсайтаас үзнэ үү)","c":["Эсрэг чиглэлийн 1-р эгнээгээр явж буй автомашин төв шугам давж буй нөхцөл","Баруун талын явган зорчигч гэнэт зорчих хэсэг рүү орох гэж буй нөхцөл","Эсрэг чиглэлээс ирж буй автомашин урд гэрлээ асааж анхааруулж буй нөхцөл","Уулзварын баруун талын замын автомашин гэрлэн дохио зөрчин уулзварт орж буй нөхцөл"],"a":"4","imgs":[],"t":"동영상형","e":"Уулзварын зүүн, баруун талын замын хөдөлгөөний нөхцөл байдлыг барилга байгууламж зэргээс болж шалгах боломжгүй нөхцөл байдал юм. Энэ тохиолдолд зүүн, баруун талын автомашинууд шар гэрэл буюу улаан гэрлийг харсан ч зогсож чадалгүй дохио болон зааврыг зөрчихөд хүргэж зам тээврийн осол үүсгэх магадлал өндөр. Иймд явах чиглэлийн дохио ногоон гэрэлтэй байсан ч уулзварт ойртох үед хурдаа сааруулах жолоодлогын хандлага шаардлагатай."},{"n":969,"b":"Дараахаас хүүхдийн хамгаалалтын бүсэд зам хөндлөн гарч буй хүүхдийг хамгаалахын тулд замын хөдөлгөөний туха й хуулийг мөрдөж буй тээврийн хэрэгсэл аль нь вэ? (Вэбсайтаас үзнэ үү)","c":["Улаан өнгийн суудлын автомашин","Цагаан өнгийн ачааны автомашин","Цэнхэр өнгийн ачааны автомашин","Улбар шар өнгийн такси"],"a":"3","imgs":[],"t":"동영상형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах), Замын хөдөлгөөний тухай хуулийн 49 дүгээр зүйл (Бүх жолоочийн дагаж мөрдөх зүйл зэрэг) Хүүхдийн хамгаалалтын бүсэд хүүхэд хэзээ, аль мөчид гарч ирэхийг мэдэхгүй тул хурдаа бууруулж удаан явах ёстой. Гэнэт гарч ирсэн хүүхдээс болж урд тээврийн хэрэгсэл огцом тоормослоход ард нь явж буй тээврийн хэрэгсэл мөргөж болзошгүй тул аюулгүй зайг хангах ёстой. Хүүхдийн хажуугаар өнгөрөх үед хангалттай зай барьж заавал удаан явах ёстой."},{"n":970,"b":"Дараах бичлэгийг үзээд хамгийн аюултай нөхцөл аль болохыг тодорхойлно уу. (Вэбсайтаас үзнэ үү)","c":["Уулзварт хүлээж байсан 1-р эгнээний суудлын автомашин зүүн эргэж буй нөхцөл","2-р эгнээ рүү эгнээ сольж байх үед 2-р эгнээгээр явж буй автомашинтай мөргөлдөх гэж буй нөхцөл","Зөөврийн самбарын ардаас явган зорчигч зориулалтын бус газраар зам хөндлөн гарахын тулд гэнэт зам руу гарч ирж буй нөхцөл","Явган хүний гарц дээр хүлээж байсан явган зорчигч гэрлэн дохиогүй явган хүний гарц руу орох гэж буй нөхцөл"],"a":"3","imgs":[],"t":"동영상형","e":"Самбар буюу тэмдгийн ард байгаа явган зорчигч нь саадаас үүссэн үл үзэгдэх бүсэд байгаа тул жолооч харахад хэцүү. Энэ үед явган зорчигч алсаас ирж буй автомашины оршихуйг сонирхохгүй байх буюу тухайн автомашиныг олж харсан ч нэлээд хол зайтай тул хөндлөн гарч болно гэж буруу дүгнэж зөвшөөрөлгүй газраар хөндлөн гарах магадлалтай. Мөн явган хүний гарцын урд, хойно зөвшөөрөлгүй хөндлөн гарах явдал их байдгийг хамгаалалтын жолоодлогын тулд санаж байх ёстой."},{"n":971,"b":"Дараах бичлэгийг үзээд хамгийн аюултай нөхцөл аль болохыг тодорхойлно уу. (Вэбсайтаас үзнэ үү)","c":["Зогсоолд тавихыг хориглосон газарт зогсоолд тавьсан тээврийн хэрэгсэл 1-р эгнээгээр хөдөлгөөнд оролцож буй нөхцөл","Урсгалын эсрэг чиглэлд зогсоолд тавьсан тээврийн хэрэгслийн хаалга онгойж буй нөхцөл","Хөдөлгөөний чиглэлийн эсрэг явж буй унадаг дугуйтай мөргөлдөх нөхцөл","Зам хөндлөн гарч буй явган зорчигч унаж буй нөхцөл"],"a":"3","imgs":[],"t":"동영상형","e":"Нэг чиглэлд 1 эгнээтэй замд хууль бусаар зогсоолд тавьсан тээврийн хэрэгслүүдээс болж төвийн шугам даван явахаас өөр аргагүй. Энэ тохиолдолд жолооч явах чиглэл буюу эсрэг чиглэлээс явж буй тээврийн хэрэгсэлд анхаарч жолоодох ёстой. Ялангуяа хүүхдийн хамгаалалтын бүсэд Замын хөдөлгөөний тухай хууль зөрчиж буй хүүхэд болон өсвөр насныхны жолоодож буй унадаг дугуй зэрэгт анхаарах шаардлагатай."},{"n":972,"b":"Дараахаас уулзвар дээр зам хөндлөн гарч буй явган зорчигчийг хамгаалахын тулд замын хөдөлгөөний тухай хуулийг мөрдөж буй тээврийн хэрэгсэл аль нь вэ? (Вэбсайтаас үзнэ үү)","c":["Бор өнгийн SUV","Шар өнгийн суудлын автомашин","Улбар шар өнгийн такси","Хар өнгийн суудлын автомашин"],"a":"4","imgs":[],"t":"동영상형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах) 2 дахь хэсэг, Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 2 (Гэрлэн дохионы илэрхийлэх дохионы төрөл болон дохионы утга) Явган зорчигчийн ногоон дохиог дагаж мөрдөхгүй буюу дохиог урьдчилан таамаглаж эрт хөдөлж буй явган зорчигчид анхаарах ёстой. Явган зорчигчийн ногоон дохио анивчих үед гэнэт гүйж эхлэн хөндлөн гарч буй явган зорчигчид анхаарах ёстой. Баруун тийш эргэх үед явган хүний гарц руу буун хүлээж буй явган зорчигч татагдан орох үзэгдэлд анхаарах ёстой. Баруун тийш эргэх үед эсрэг талаас шулуун явж буй тээврийн хэрэгсэлд анхаарах ёстой."},{"n":973,"b":"Дараах бичлэгт жолооч ямар арга хэмжээ авах нь зөв бэ? (Вэбсайтаас үзнэ үү)","c":["Урд талын автомашины жолоочид урд холын гэрлийг асааж хариу үйлдэл үзүүлнэ.","Аюулын дохионы гэрэл анивчихыг ажиллуулан замын захад түр зогсоод маргалдана.","Дуут дохио болон чиг заагч гэрлийг ажиллуулан гүйцэж түрүүлсний дараа огцом тоормослоно.","Хурдны замаас гарч аюулгүй газарт хүрсний дараа цагдаагийн байгууллагад мэдэгдэнэ."],"a":"4","imgs":[],"t":"동영상형","e":"Тодорхойгүй жолооч зигзаг хэлбэрээр жолоодох буюу миний явж буй эгнээнд санаатайгаар тоормослож замыг хаах үйлдэл хийх тохиолдолд тухайн жолоочид шууд хариу үйлдэл үзүүлэлгүй замын гарах замаар зайлсхийж тойрох, эсвэл амралтын газар зэрэгт орж автомашины хаалгаа түгжээд нэн даруй мэдэгдэж хариу арга хэмжээ авах нь зүйтэй."},{"n":974,"b":"Дараах бичлэгт жолооч ямар үйлдэл хийх нь зөв бэ? (Вэбсайтаас үзнэ үү)","c":["Цагдаагийн машины ард удаан явна.","Цагдаагийн машины жолоочийн зөрчлийг нэн даруй мэдээлнэ.","Зүүн эгнээнд аюулгүй зай байгаа бол гүйцэж түрүүлнэ.","Баруун эгнээнд аюулгүй зай байгаа бол гүйцэж түрүүлнэ."],"a":"1","imgs":[],"t":"동영상형","e":"Бичлэгт цагдаагийн машин зигзаг хэлбэрээр зорчих хэсгээр явж буй тохиолдолд зохиомол түгжрэл үүсгэх дохио болон заавар өгч байна. Энэ аргыг хөдөлгөөний тоормос гэж ч нэрлэдэг. Энэ нь зам дээр унасан зүйл, зам тээврийн ослын дараах арга хэмжээ болон бусад аюултай нөхцөл байдал зэрэг байгаа тохиолдолд 2 дахь буюу 3 дахь удаагийн холбогдох зам тээврийн ослоос урьдчилан сэргийлэх зорилготой. Иймд бусад автомашины жолооч хурдаа бууруулж удаан явах бөгөөд цагдаагийн машины жолоочийн үйлдлийг зөрчлийн үйлдэл гэж буруу ойлгохгүй байх ёстой ба дохио болон зааврыг дагах ёстой."},{"n":975,"b":"Дараах бичлэгт гарч буй хамгийн аюултай нөхцөл аль вэ? (Вэбсайтаас үзнэ үү)","c":["Аюулгүйн бүс рүү орсон автомашин гэнэт баруун эгнээ рүү орж ирэх нөхцөл","Миний автомашины баруун талаар чигээрээ явж буй автомашинтай мөргөлдөх магадлал","Аюулгүйн бүсэд түр зогссон автомашин ухарсны улмаас зам тээврийн осол гарах нөхцөл","Эгнээ солихыг хориглосон газарт эгнээ сольсны улмаас шүргэлцэх осол гарах нөхцөл"],"a":"1","imgs":[],"t":"동영상형","e":"Аюулгүйн бүсийг Замын хөдөлгөөний тухай хуулийн дагуу орохыг хориглох газарт байрлуулдаг. Иймд жолооч аюулгүйн бүсэд орж болохгүй. Гэвч зарим жолооч салаа зангилаа (JCT) болон орох гарах зангилаа (IC)-д маршрутын шийдвэр хойшлох буюу агшин зуурын шийдвэр өөрчлөгдөх тохиолдол, эсвэл утас ашиглах зэргээр анхаарал сарнихыг мэдэрч хоцорч явах чиглэл рүү аюултай замаа өөрчлөх үйлдэл хийдэг. Энэ үед аюулгүйн бүсэд халдах зөрчлийн үйлдлийг мэдэрдэг. Иймээс жолооч аюулгүйн бүсэд ослын анивчдаг дохиогоо ажиллуулан удаан хурдтай явж буй буюу зогссон тээврийн хэрэгслийг олж харсан тохиолдолд тухайн тээврийн хэрэгсэл миний явж буй эгнээ рүү гэнэт орж ирэхийг урьдчилан таамаглаж анхаарч бэлтгэх ёстой."},{"n":976,"b":"Дараах бичлэгт хамгийн аюултай нөхцөл аль нь вэ? (Вэбсайтаас үзнэ үү)","c":["Баруун захаас баруун эргэх гэж буй хоёр дугуйт тээврийн хэрэгсэлтэй мөргөлдөх магадлал","Баруун талын хар өнгийн суудлын автомашинтай мөргөлдөх магадлал","Эсрэг талд зүүн эргэхээр хүлээж буй цагаан өнгийн суудлын автомашинтай мөргөлдөх магадлал","Явган хүний гарцын зүүн талд зогсож буй явган зорчигчтой мөргөлдөх магадлал"],"a":"1","imgs":[],"t":"동영상형","e":"Бичлэг дэх жолооч баруун тийш эргэх гэж буй нөхцөл байдал болон баруун тийш эргэж буй нөхцөл байдалд баруун чиг заах дохиогоо асаагаагүй. Энэ нь замын хөдөлгөөнд оролцогчдод мэдээлэл дамжуулаагүй явдал юм. Ялангуяа баруун тийш эргэх гэж буй тээврийн хэрэгслийн жолооч баруун тийш эргэх үед урд дугуйны явах зам болон хойд дугуйны явах замын зөрүүнээс (дотоод дугуйны зөрүү) болж арай өргөн эргэх хандлагатай байдаг. Энэ үед баруун талд зай байгаа тохиолдолд хоёр дугуйт тээврийн хэрэгслийн жолооч чиг заах дохиогоо асаалгүй баруун тийш эргэх гэж буй урдах тээврийн хэрэгслийг хараад тэр хэвээрээ шулуун явна гэж дүгнэх бөгөөд энэ нь зам тээврийн ослын шууд шалтгаан ч болдог."},{"n":977,"b":"Дараах бичлэгт гарч буй нөхцөлүүдээс хамгийн аюултай нь аль вэ? (Вэбсайтаас үзнэ үү)","c":["Зүүн эргэх үед зүүн талын зорчих хэсгээс баруун эргэж буй тээврийн хэрэгсэлтэй мөргөлдөх магадлал","Зүүн эргэх үед эсрэг талаас чигээрээ явж буй тээврийн хэрэгсэлтэй мөргөлдөх магадлал","Явган хүний гарцаар гарч буй явган зорчигчтой мөргөлдөх магадлал","Баруун талд чигээрээ явж буй хар өнгийн суудлын автомашинтай шүргэлцэх осол гарах магадлал"],"a":"3","imgs":[],"t":"동영상형","e":"Ногоон гэрлийн үед зүүн тийш эргэх гэж буй нөхцөл байдалд зүүн талд тулгарах явган хүний гарцын гэрлэн дохио ногоон асаалттай байсан тул явган хүний гарц руу орохын өмнө зогсох ёстой байсан. Энэ үед зүүн тийш эргэсэн үйлдэл нь Замын хөдөлгөөний тухай хуулийн дагуу ногоон гэрэл байсан тул дохиог дагаж мөрдсөн нөхцөл байдал юм. Гэвч явган хүний гарцын явган зорчигчийг хамгаалаагүй үйлдэл байсан. Уулзварт хамгаалалтгүй зүүн эргэлт хийх гэж буй жолооч зүүн талд тулгарах явган хүний гарцад онцгой анхаарах шаардлагатайг ухамсарлаж жолоодох сэтгэлгээ чухал."},{"n":978,"b":"Дараах бичлэгээс тодорхойлогдож буй аюултай нөхцөлөөс буруу нь аль вэ? (Вэбсайтыг үзнэ үү) (Автобус хурдаа хасаж төв шугам давж буй бичлэг)","c":["Эсрэг чиглэлээс автомашин зорчиж буй нөхцөл","Урд замын нөхцөл халхлагдсан үзэгдэх орчин хязгаарлагдсан нөхцөл","Зам хөндлөн гарах гэж буй явган зорчигч явган хүний гарц руу орж буй нөхцөл","Автобусаас буух зорчигч явган хүний замаар зорчих нөхцөл"],"a":"4","imgs":[],"t":"동영상형","e":"Гэрлэн дохиогүй явган хүний гарцтай холбогдсон явган хүний замд хөндлөн гарахаар хүлээж буй явган зорчигч жолоочийн дүгнэлтээс өөрөөр гэнэт орж ирж болзошгүй тул явган хүний гарцад ойртох үед удаан явж, явган хүний гарцаар хөндлөн гарч буй буюу хөндлөн гарах гэж буй явган зорчигч байгаа тохиолдолд зогсох ёстой. Баруун тийш тахирсан замын хэлбэрт хурдаа сааруулж буй урдах автомашинаас болж төвийн шугам давах нь Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйлийг зөрчиж буй явдал бөгөөд энэ үйлдэл нь зам тээврийн осол үүсгэх шууд шалтгаан болдог. Иймд төвийн шугам шар үргэлжилсэн шугамаар байрлуулсан тохиолдолд баруун талаар явж урд тээврийн хэрэгслээс аюулгүй зайг барин явах ёстой. Өндөр том оврын олон суудалт автомашин буюу том оврын ачааны автомашины ард явж буй жолооч урд талын замын нөхцөл байдлыг шалгах боломжгүй тул удаан явж тээврийн хэрэгсэл хоорондын зайг өргөн барьж тоормослох буюу зогсох боломжтой зайг хадгалах хандлагатай байх ёстой. Асуултын бичлэгт автобуснаас буусан зорчигч явган хүний замаар явж байгаа нь аюултай нөхцөл байдалд тооцогдохгүй."},{"n":979,"b":"Дараах бичлэгт жолоодож байх үед урьдчилан таамаглаж болох аюултай нөхцөлөөс гарах магадлал хамгийн бага нь аль вэ? (Вэбсайтаас үзнэ үү)","c":["Нарийн гудамжинд түр зогссон болон зогсоолд тавьсан тээврийн хэрэгслүүдийн дундаас хүүхэд гэнэт гарч ирж болзошгүй.","Цэнхэр өнгийн суудлын автомашины жолооч хаалгаа онгойлгож гарч ирж болзошгүй.","Эсрэгээс ирж буй хувийн хөдөлгөөнт хэрэгслийн жолооч түр зогсож болзошгүй.","Урд яваа хоёр дугуйт тээврийн хэрэгслийн жолооч эсрэг талаас ирж буй суудлын автомашинд зам тавьж өгөх үедээ унаж болзошгүй."],"a":"3","imgs":[],"t":"동영상형","e":"Үргэлж үл үзэгдэх газарт аюул байна гэж бэлтгэх жолоодлогын хандлага шаардлагатай. Зүгээр л аюулын шинж тэмдэг гэж бодох бус хамгийн муу нөхцөл байдалд бэлтгэх хандлага юм. Жолооч хангалттай урьдчилан таамаглаж болох аюул гарч ирэх үед амархан бэлтгэж чаддаг боловч сураагүй буюу туршаагүй аюулыг үл тоомсорлох хандлагатай байдаг. Ялангуяа орон сууцны бүсийн зам тээврийн осол нь аюулыг үл тоомсорлох үед гардаг."},{"n":980,"b":"Дараах бичлэгээс урьдчилан таамаглаж болох хамгийн аюултай нөхцөл аль вэ? (Вэбсайтаас үзнэ үү)","c":["Урд талын ачааны автомашин хурдаа нэмэгдүүлж болзошгүй.","1-р болон 3-р эгнээгээр явж байсан тээврийн хэрэгслүүд нэгэн зэрэг ачааны автомашины урдуур огцом эгнээ сольсноор ачааны автомашин огцом тоормослох нөхцөл үүсэж болзошгүй.","4-р эгнээнд явж буй тээврийн хэрэгсэл гарах рамп руу орохын тулд 5-р эгнээ рүү эгнээ сольж болзошгүй.","3-р эгнээгээр явж буй суудлын автомашин 4-р эгнээ рүү эгнээ сольж болзошгүй."],"a":"2","imgs":[],"t":"동영상형","e":"Аюулын талаар сонор сэрэмжтэй байж ослоос урьдчилан сэргийлэхэд анхаарал тавьсаар байвал зам дээр ямар аюул байгааг ажиглах болно. Аюулаас урьдчилан сэргийлэхийн тулд ийм ажиглалтыг оролцуулан туршлагаар дамжуулан зам дээр гардаг ердийн бус хөдөлгөөний үйлдлийн талаарх мэдлэгийг эзэмшиж бэлтгэх чадварыг хангалттай эзэмшсэн байх ёстой. Гэвч анхаарах ёстой зүйл нь туршлага хязгаарлагдмал бөгөөд зөвхөн хязгаарлагдмал мэдлэг олж авах боломжтой тул урьдчилан таамаглаагүй аюулд өртөх магадлал үргэлж оршдог."},{"n":981,"b":"Жолоочийн дараах үйлдлээс замын хөдөлгөөний тухай хууль зөрчсөн нь аль вэ? (Вэбсайтаас үзнэ үү)","c":["Явган хүний гарцын урьдчилан анхааруулах замын тэмдэглэлийг хараад удаан явсан.","Явган хүний гарцаар гарах гэж буй явган зорчигчийг хамгаалахын тулд зогссон.","Баруун эргэх эгнээнд чиг заах дохио асаасан.","Баруун эргэхтэй зэрэгцэн зүүн талын чигээрээ явах эгнээ рүү шуурхай орсон."],"a":"4","imgs":[],"t":"동영상형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах). Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] Аюулгүйн тэмдэглэгээний төрөл, хийх арга болон байрлуулах, арчлах шалгуур. Замын гадаргуугийн тэмдэглэгээ №529. Явган хүний гарцыг урьдчилан мэдэгдэх тэмдэглэгээ. 38 дугаар зүйл (Тээврийн хэрэгслийн дохио) ① Бүх тээврийн хэрэгслийн жолооч зүүн тийш эргэх, баруун тийш эргэх, хөндлөн гарах, буцаж эргэх, удаан явах, зогсох буюу ухрах, эсвэл нэг чиглэлд явж байхдаа замаа өөрчлөх, мөн тойрог уулзварт орох буюу тойрог уулзвараас гарах тохиолдолд гараар, чиг заах дохиогоор буюу гэрлээр тухайн үйлдэл дуустал дохио өгөх ёстой. Гол дүрийн жолооч явган хүний гарцыг урьдчилан мэдэгдэх тэмдэглэгээг хараад удаан явсан бөгөөд явган хүний гарцын яг өмнө байрлуулсан зогсох шугамд хүрэхээс өмнө түр зогссон. Мөн Замын хөдөлгөөний тухай хуулийн 38 дугаар зүйлийн дагуу чиг заах дохиог ашиглан дохио өгсөн."},{"n":982,"b":"Жолоочийн дараах үйлдлээс замын хөдөлгөөний тухай хууль зөрчсөн нь аль вэ? (Вэбсайтаас үзнэ үү)","c":["Чиг заах дохио асааж явах чиглэлээ мэдэгдсэн.","Урьдчилан замын баруун захаар явж баруун эргэлт хийсэн.","Урд талын автомашиныг араас мөргөхөөс сэргийлэн анхаарч явсан.","Урд талын замын хөдөлгөөний гэрлэн дохионы дагуу баруун эргэсэн."],"a":"4","imgs":[],"t":"동영상형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах). Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] Аюулгүйн тэмдэглэгээний төрөл, хийх арга болон байрлуулах, арчлах шалгуур. Замын гадаргуугийн тэмдэглэгээ №529. Явган хүний гарцыг урьдчилан мэдэгдэх тэмдэглэгээ. 38 дугаар зүйл (Тээврийн хэрэгслийн дохио) ① Бүх тээврийн хэрэгслийн жолооч зүүн тийш эргэх, баруун тийш эргэх, хөндлөн гарах, буцаж эргэх, удаан явах, зогсох буюу ухрах, эсвэл нэг чиглэлд явж байхдаа замаа өөрчлөх, мөн тойрог уулзварт орох буюу тойрог уулзвараас гарах тохиолдолд гараар, чиг заах дохиогоор буюу гэрлээр тухайн үйлдэл дуустал дохио өгөх ёстой. Гол дүрийн жолооч явган хүний гарцыг урьдчилан мэдэгдэх тэмдэглэгээг хараад удаан явсан бөгөөд явган хүний гарцын яг өмнө байрлуулсан зогсох шугамд хүрэхээс өмнө түр зогссон. Мөн Замын хөдөлгөөний тухай хуулийн 38 дугаар зүйлийн дагуу чиг заах дохиог ашиглан дохио өгсөн. 982. Жолоочийн үйлдлүүдээс Замын хөдөлгөөний тухай хууль зөрчсөн нь аль вэ? (вэб хуудаснаас үзнэ үү) ① Чиг заах дохиогоо асааж явах чиглэлээ мэдэгдсэн. ② Урьдчилан замын баруун захаар явж баруун эргэлтэд орсон. ③ Урдах автомашинтай мөргөлдөхөөс зайлсхийхийн тулд анхаарал тавьсан. ④ Урд талын гэрлэн дохионы гэрлийн дагуу баруун тийш эргэсэн."},{"n":983,"b":"Жолоочийн дараах үйлдлээс замын хөдөлгөөний тухай хууль зөрчсөн нь аль вэ? (Вэбсайтаас үзнэ үү)","c":["Тухайн замын хэсгийн хамгийн дээд хурдны хязгаарыг мөрдсөн.","Эгнээ солих боломжтой газарт аюулгүйгээр эгнээ сольсон.","Явган хүний гарцаар зорчиж буй явган зорчигчийг хамгаалахын тулд зогссон.","Явган хүний гарцын гэрлэн дохио улаан болсон тул уулзварын өмнөх зогсох шугам руу шилжин очиж зогссон."],"a":"4","imgs":[],"t":"동영상형","e":"Гол дүрийн жолооч Замын хөдөлгөөний тухай хуулийн дагуу чиглэл өөрчлөх дохиог биелүүлсэн. Мөн уулзвараар нэвтрэх аргын дагуу баруун тийш эргэхийн тулд урьдчилан замын баруун эгнээгээр явсан. Мэдээж урдах тээврийн хэрэгсэлтэй мөргөлдөхөөс урьдчилан сэргийлэхийн тулд удаан явахын зэрэгцээ зохих тээврийн хэрэгсэл хоорондын зайг хангасан бөгөөд мөргөлдөөгүй. Гэвч гол дүрийн жолооч тээврийн хэрэгслийн гэрлэн дохионы улаан гэрлийн үед явган хүний гарцын яг өмнөх зогсох шугам дээр зогсох ёстой байсан боловч урд нь түрүүлж баруун тийш эргэж буй тээврийн хэрэгслийн араас тэр хэвээр дагасан. Энэ нь Замын хөдөлгөөний тухай хуулийн 5 дугаар зүйлийн дохио болон зааврыг дагах үүргийг зөрчсөн явдал юм. Баруун тийш эргэх гэж буй тээврийн хэрэгсэл дараалан байгаа тохиолдолд эхний тээврийн хэрэгсэл түр зогссон үед хоёр дахь тээврийн хэрэгсэл ч түр зогсох ёстой эсэх нь дараах байдалтай. Цагдаагийн ерөнхий газрын асуулга хариулт (2023.6.8)-ын дагуу Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 1 дэх хэсэг болон Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 2]-ын дагуу бүх тээврийн хэрэгсэл урд нь улаан гэрэл асаж байх тохиолдолд зогсох үүрэгтэй. Иймд эхний тээврийн хэрэгсэл (A) түр зогссоны дараа шууд залгуулан ирж буй хоёр дахь тээврийн хэрэгсэл (B) ч түр зогсох ёстой. 983. Жолоочийн үйлдлүүдээс Замын хөдөлгөөний тухай хууль зөрчсөн нь аль вэ? (вэб хуудаснаас үзнэ үү) ① Замын хэсгийн дээд хурдны хязгаарыг дагаж мөрдсөн. ② Замаа өөрчлөх боломжтой газарт аюулгүйгээр замаа өөрчилсөн. ③ Явган хүний гарцаар явж буй явган зорчигчийг хамгаалахын тулд зогссон. ④ Явган хүний гарцын гэрлэн дохио улаан гэрэл болж солигдсон тул уулзварын яг өмнөх зогсох шугам руу шилжиж зогссон."},{"n":984,"b":"Дараахаас замын хөдөлгөөний тухай хуулийг мөрдсөн тээврийн хэрэгслийн зөв хослол аль вэ? (Вэбсайтаас үзнэ үү)","c":["Хар өнгийн хоёр дугуйт тээврийн хэрэгсэл, цагаан өнгийн суудлын автомашин","Гол дүрийн автомашин, цагаан өнгийн суудлын автомашин","Хар өнгийн хоёр дугуйт тээврийн хэрэгсэл, хар өнгийн суудлын автомашин","Гол дүрийн автомашин, хар өнгийн хоёр дугуйт тээврийн хэрэгсэл"],"a":"3","imgs":[],"t":"동영상형","e":"Замын хөдөлгөөний тухай хуулийн 5 дугаар зүйл. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] Аюулгүйн тэмдэглэгээний төрөл, хийх арга болон байрлуулах, арчлах шалгуур. Уулзварт ойртож байхдаа ногоон гэрлийг хараад уулзварт орох хүсэл нь хурдлахад хүргэж өндөр хурдтай болбол шар гэрлийг харсан ч уулзварын яг өмнө зогсож чадахгүй. Энэ нь Замын хөдөлгөөний тухай хуулийн 5 дугаар зүйлийн (Дохио болон зааврыг дагах үүрэг) ноцтой зөрчилд хүргэдэг. Иймд жолооч ногоон гэрэл асаж хадгалагдаж байгаа хугацаа урт байх тусам удахгүй шар гэрэл болж солигдоно гэж урьдчилан таамаглаж уулзварт ойртох үед хурдаа бууруулж шар гэрлийн үед зогсож чадахаар бэлтгэх ёстой."},{"n":985,"b":"Бичлэгт харагдаж буй гол дүрийн жолоочийн замын хөдөлгөөний тухай хуулийн зөрчлийг зөв хослуулсан нь аль вэ? (Вэбсайтаас үзнэ үү)","c":["Явган зорчигчийг хамгаалах үүргээ зөрчсөн, гэрлэн дохио зөрчсөн, зориулалтын эгнээ зөрчсөн, түр зогсох болон зогсоолд тавихыг хориглосон дүрэм зөрчсөн","Явган зорчигчийг хамгаалах үүргээ зөрчсөн, гэрлэн дохио зөрчсөн, зориулалтын эгнээ зөрчсөн, шахаж орохыг хориглосон дүрэм зөрчсөн","Эгнээ солихыг хориглосон газар зөрчсөн, гүйцэж түрүүлэх аргыг зөрчсөн, явган зорчигчийг хамгаалах үүргээ зөрчсөн, гэрлэн дохио зөрчсөн","Эгнээ солихыг хориглосон газар зөрчсөн, түр зогсох болон зогсоолд тавихыг хориглосон дүрэм зөрчсөн, явган зорчигчийг хамгаалах үүргээ зөрчсөн, гэрлэн дохио зөрчсөн"],"a":"4","imgs":[],"t":"동영상형","e":"Замын хөдөлгөөний тухай хуулийн 5 дугаар зүйл. 1 дэх хэсэг. Замаар явж буй явган зорчигч, тээврийн хэрэгсэл буюу трамвайн жолооч замын хөдөлгөөний аюулгүй байдлын байгууламжийн илэрхийлэх дохио буюу заавар болон дараах заалтын аль нэгэнд хамаарах хүний өгч буй дохио буюу зааврыг дагах ёстой (“заалт”-ыг орхив). Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл. 1 дэх хэсэг. Бүх тээврийн хэрэгсэл буюу трамвайн жолооч явган зорчигч (13-2 дугаар зүйл-ын 6 дахь хэсгийн дагуу унадаг дугуй зэргээс буун унадаг дугуй зэргийг чирч буюу өргөж явж буй унадаг дугуй зэргийн жолоочийг оролцуулна) явган хүний гарцаар явж байгаа буюу явах гэж байгаа үед явган зорчигчийн хөндлөн гарахад саад учруулах буюу аюул учруулахгүй байхаар тухайн явган хүний гарцын өмнө (зогсох шугам байрлуулсан газарт тухайн зогсох шугамыг хэлнэ) түр зогсох ёстой. 19 дүгээр зүйл (Аюулгүй зайг хангах зэрэг) 3 дахь хэсэг. Бүх тээврийн хэрэгслийн жолооч тээврийн хэрэгслийн замаа өөрчлөх тохиолдолд өөрчлөх гэж буй чиглэлээс ирж буй бусад тээврийн хэрэгслийн хэвийн хөдөлгөөнд саад учруулж болзошгүй үед замаа өөрчилж болохгүй. Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл “Зогсоолд тавих” гэж жолооч зорчигч хүлээх, ачаа ачих, тээврийн хэрэгсэл эвдрэх буюу бусад шалтгаанаар тээврийн хэрэгслийг үргэлжлүүлэн зогссон байдалд байлгах, эсвэл жолооч тээврийн хэрэгслээс холдож тухайн тээврийн хэрэгслийг шууд жолоодох боломжгүй байдалд байлгахыг хэлнэ. “Зогсох” гэж жолооч 5 минутаас хэтрүүлэлгүйгээр тээврийн хэрэгслийг зогсоохыг хэлэх бөгөөд зогсоолд тавихаас бусад зогссон байдлыг хэлнэ. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 6] Аюулгүйн тэмдэглэгээний төрөл, хийх арга болон байрлуулах, арчлах шалгуур, замын гадаргуугийн тэмдэглэгээ №516-ийн 2 зогсох, зогсоолд тавихыг хориглох тэмдэглэгээ. Бичлэг дэх гол дүрийн тээврийн хэрэгслийн зогссон газар нь замын гадаргуугийн тэмдэглэгээ шар давхар шугамаар байрлуулсан замын хэсэг тул зогсоолд тавих, зогсох боломжгүй хэсэг юм."},{"n":986,"b":"Орон сууцны бүсээр зорчиж байна. Жолоодох үед анхаарах шаардлагатай объект болон газраас хамгийн хамаарал багатай нь аль вэ? (Вэбсайтаас үзнэ үү)","c":["Хууль бусаар зогсоолд тавьсан автомашин","Эсрэг талын замаар явж буй автомашин","Гэрлэн дохиогүй явган хүний гарц","Зүүн талын явган хүний зам дээр ярилцаж буй явган зорчигчид"],"a":"4","imgs":[],"t":"동영상형","e":"Шөнө жолоодох тохиолдолд хууль бусаар зогсоолд тавьсан тээврийн хэрэгслийн урд буюу ардаас явган зорчигч буюу унадаг дугуй гэнэт орж ирж болзошгүй. Эсрэг талын замаар явж буй автомашины урд гэрлээс болж агшин зуур хараа алдаж болзошгүй тул анхаарах шаардлагатай. Гэрлэн дохиогүй явган хүний гарцаар хөндлөн гарч буй явган зорчигч эсрэг талаас ирж буй автомашины гэрлээс болж харагдахгүй байж болзошгүй тул гэрлэн дохиогүй явган хүний гарцад ойртох үед хурдаа сааруулж орохын өмнө явган хүний гарцыг шалгаж, явган зорчигч хөндлөн гарч байгаа буюу хөндлөн гарах гэж байгаа тохиолдолд зогсох ёстой. Бичлэгт ажиглагдаж буй зүүн талын явган хүний замын явган зорчигчийг аюулын хүчин зүйл их гэж хэлж болохгүй."},{"n":987,"b":"Дараах бичлэгт хамгийн зөв жолоодох үйлдэл аль вэ? (Вэбсайтаас үзнэ үү)","c":["1-р эгнээгээр явж буй суудлын автомашины жолооч чигээрээ явж болно.","2-р эгнээгээр явж буй ачааны автомашины жолооч зүүн эргэж болно.","3-р эгнээгээр явж буй суудлын автомашины жолооч баруун эргэхдээ түр зогсож, баруун талын арын харах толийг харан аюулд бэлтгэх ёстой.","3-р эгнээгээр явж буй суудлын автомашины жолооч явган зорчигч явган хүний гарцаар гарч байсан ч баруун эргэж болно."],"a":"3","imgs":[],"t":"동영상형","e":"Жолоодлогын үйлдлийн бүх хүрээнд хэт өөртөө итгэх буюу замын хөдөлгөөний дүрмийг дур мэдэн зөрчдөг жолооч нар ихэнхдээ аюулыг урьдчилан таамаглах чадвар дутмаг жолооч нар юм. Замын хөдөлгөөний дүрэм зөрчсөн үед буюу аюулгүй жолоодлогод хүчин чармайлт гаргаж чадаагүй үед ямар аюул байгааг сайн ойлгодоггүй жолооч байх тусам дүрмийг амархан зөрчиж аюултай жолоодлого хийдэг. Зам дээр харагдаж буй аюул бүгд биш бөгөөд үргэлж далд аюулыг харахыг хичээж, бусдын төлөө миний хийж чадах жолоодлогын үйлдэл юу болохыг бодож байж ослын магадлалыг бууруулж чадна."},{"n":988,"b":"Бичлэгт харагдаж буй зам тээврийн ослоос урьдчилан сэргийлэх аргуудаас хамгийн хамаарал багатай нь аль вэ? (Вэбсайтаас үзнэ үү)","c":["Урьдчилан хурдаа сааруулж, зогсох шугамын өмнө зогсох ёстой.","Баруун талаас орж ирэх гэж буй автомашинд зам тавьж өгөх шаардлагатай тул урьдчилан удаан явж уулзварт ойртох ёстой.","Зам мөстсөн тул тоормосны дөрөөг хүчтэй гишгэнэ.","Цас орж байгаа үед дугуйнд цасны гинж угсарч жолоодох нь зүйтэй."],"a":"3","imgs":[],"t":"동영상형","e":"Хөдөлгүүрийн тоормос гэж автомашинд хөдөлгүүрийн шахалтын эсэргүүцэл буюу хөдөлгүүр ба хурдны хайрцгийн үрэлтийн эсэргүүцэл зэргийг ашиглан хурдаа сааруулахыг хэлэх бөгөөд явж байгаад хурдасгуурын дөрөөнөөс хөлөө авбал тоормос дарахгүйгээр хурд буурч, доод араа байх тусам үр нөлөө нь их байдаг. Хөдөлгүүрээр тоормослох гэдэг нь хөдөлгүүрийн тоормостой ижил утгыг агуулдаг. Өөрөөр хэлбэл ижил утгатай үг юм. Цастай замаар явж буй жолооч зогсох магадлалтай газарт ойртох үед тоормосны дөрөө дарах үед гулсахаас сэргийлэх ёстой. Иймд зогсох шаардлагатай газарт ойртох тохиолдолд урьдчилан хөдөлгүүрийн тоормосны (хөдөлгүүрээр тоормослох) аргаар удаан явж тоормос дарах үед гулсахаас сэргийлэх ёстой. Замын хөдөлгөөний тухай хуулийн 26 дугаар зүйл. 3 дахь хэсэг. Хөдөлгөөний зохицуулалт хийгдээгүй уулзварт нэгэн зэрэг орох гэж буй тээврийн хэрэгслийн жолооч баруун талын замын тээврийн хэрэгсэлд зам тавьж өгөх ёстой."},{"n":989,"b":"Уулзварт ойртож, нэвтэрч байна. Замын хөдөлгөөний тухай хуулийн дагуу зөрчилд тооцогдох нь аль вэ? (Вэбсайтыг үзнэ үү) (Танин мэдэхүйн асуулт – Тойрог уулзварыг нэвтрэн өнгөрөх)","c":["Гарах үед зөв чиг заах дохио асаасан.","Орох үед зөв чиг заах дохио асаасан.","Гарахдаа уулзвар дотор эгнээ солилгүйгээр дотор эгнээнээс шууд гарсан.","Орохдоо уулзвар дотор эгнээ солилгүйгээр дотор эгнээ рүү шууд орсон."],"a":"2","imgs":[],"t":"동영상형","e":"Бичлэг дэх уулзвар нь тойрог уулзваруудаас 2 эгнээгээр ордог төрөл юм. Замын хөдөлгөөний тухай хуулийн 25-2 дугаар зүйл-ын дагуу тойрог уулзварт орох буюу гарах гэж байгаа тохиолдолд урьдчилан чиг заах дохиог ажиллуулах ёстой. Энэ үед асаах ёстой гэрэл нь Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх журмын хавсралтын дагуу орох үед зүүн, гарах үед баруун талынхыг асаах ёстой. 2 эгнээгээр ажилладаг тойрог уулзварт орох үед замын гадаргуугийн тэмдэглэгээний дагуу зүүн эгнээнээс (1 дүгээр эгнээ) уулзвар доторх дотор талын эгнээ рүү, баруун эгнээнээс (2 дугаар эгнээ) уулзвар доторх гадна талын эгнээ рүү орж тойрох ёстой."},{"n":990,"b":"Уулзварт зүүн эргэж орон зорчих гэж байна. Харагдаж буй нөхцөлөөс зөв тайлбар аль вэ? (Вэбсайтаас үзнэ үү)","c":["Гол дүрийн жолооч уулзварын гэрлэн дохионы дагуу зүүн эргэсэн.","Гол дүрийн жолооч удаан явснаар бусад жолоочийг гүйцэж түрүүлэх нөхцөл бүрдүүлсэн.","Гүйцэж түрүүлсэн жолооч уулзварт орохдоо дарааллын эрхийг мөрдсөн.","Гүйцэж түрүүлсэн жолооч улаан анивчдаг гэрлэн дохионы дагуу уулзварт орсон."],"a":"1","imgs":[],"t":"동영상형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрэм. Хавсралт 2. Улаан гэрлийн анивчилт. Тээврийн хэрэгсэл зогсох шугам буюу явган хүний гарц байгаа үед түүний яг өмнө буюу уулзварын яг өмнө түр зогссоны дараа бусад хөдөлгөөнд анхаарангаа явж болно. Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйл. 3 дахь хэсэг. Тээврийн хэрэгслийн жолооч замын (явган хүний зам ба зорчих хэсэг нь тусгаарлагдсан замд зорчих хэсгийг хэлнэ) төвөөс (төвийн шугам байрлуулсан тохиолдолд тухайн төвийн шугамыг хэлнэ. Цаашид мөн адил) баруун талын хэсгээр явах ёстой. 5 дахь хэсэг. Тээврийн хэрэгслийн жолооч аюулгүйн бүс зэрэг аюулгүйн тэмдэглэгээгээр орохыг хориглосон газарт орж болохгүй. Замын хөдөлгөөний тухай хуулийн 22 дугаар зүйл (Гүйцэж түрүүлэхийг хориглох үе болон газар). 3 дахь хэсэг. Бүх тээврийн хэрэгслийн жолооч дараах заалтын аль нэгэнд хамаарах газарт өөр тээврийн хэрэгслийг гүйцэж түрүүлж болохгүй. 1. Уулзвар 2. Хонгилын дотор 3. Гүүрэн дээр 4. Замын тахир хэсэг, налуу замын давааны оройн ойролцоо буюу эгц налуу замын уруудах хэсэг зэрэг аймаг, нийслэлийн Цагдаагийн газрын дарга зам дээрх аюулаас урьдчилан сэргийлэх, хөдөлгөөний аюулгүй байдал, саадгүй нэвтрэлтийг хангахад шаардлагатай гэж үзсэн газар бөгөөд аюулгүйн тэмдэглэгээгээр заасан газар"},{"n":991,"b":"Дараах нь бичлэгтэй адил Hi-Pass эгнээгээр зорчих тухай тайлбар юм. Буруу нь аль вэ? (Вэбсайтаас үзнэ үү)","c":["Нэг эгнээтэй Hi-Pass тул цагт 30 км ба түүнээс бага хурдтай удаан явж нэвтрэх ёстой.","Төлбөртэй замаар замын төлбөр төлөхгүйгээр зорчсон тохиолдолд замын төлбөрийн 5 дахин их хэмжээтэй нэмэлт төлбөр ногдуулж болно.","Hi-Pass картын үлдэгдэл хүрэлцэхгүй бол Солонгосын Авто Замын Корпорацийн цахим хуудсаар төлбөрөө төлж болно.","Hi-Pass эгнээ ашиглаж буй цэргийн ажиллагааны зориулалттай тээврийн хэрэгсэл замын төлбөрөөс 100% чөлөөлөгдөнө."],"a":"2","imgs":[],"t":"동영상형","e":"Нэг эгнээт хай-пасс (цахим замын хураамжийн систем) нь нэвтрэх хурдыг цагт 30 километр буюу түүнээс доош хязгаарладаг бөгөөд олон эгнээт хай-пасс нь цагт 80 километр буюу түүнээс доош хязгаарладаг. Мөн замын хураамж төлөлгүйгээр төлбөртэй замаар явсан тохиолдолд замын хураамжийн 10 дахин хэмжээтэй тэнцэх нэмэлт замын хураамж ногдуулж, хурааж болно. (Төлбөртэй замын тухай хуулийг хэрэгжүүлэх журмын 14 дүгээр зүйлийн 5 дахь заалт)"},{"n":992,"b":"Дараахаас нарийн гудамжинд аюулыг урьдчилан таамаглахдаа хамгийн их анхаарах зүйл аль вэ? (Вэбсайтаас үзнэ үү)","c":["Түгжирсэн автомашинуудын дундаас гэнэт гарч ирж болзошгүй хүүхэд","Доторх арын харах толинд харагдах цэнхэр өнгийн ачааны автомашины зүүн эргэлт","Баруун талын унадаг дугуй унаж буй хүний баруун эргэлт","Урд талын суудлын автомашины огцом тоормослолт"],"a":"1","imgs":[],"t":"동영상형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл (Явган зорчигчийг хамгаалах), Замын хөдөлгөөний тухай хуулийн 49 дүгээр зүйл (Бүх жолоочийн дагаж мөрдөх зүйл зэрэг) Туслах замаар өнгөрөх үед тээврийн хэрэгслүүдийн хооронд гэнэт гарч ирж болзошгүй явган зорчигчид анхаарах ёстой. Туслах зам нь төвийн шугамгүй тохиолдол ихэнх тул хэдийд ч зүүн чиг заах дохиогоо асаалгүй гэнэт эгнээ сольж орж ирэх тээврийн хэрэгсэлд анхаарах ёстой. Баруун буюу зүүн тийш эргэх үед тээврийн хэрэгслийн их биеийн тулгуур баганын үл үзэгдэх бүс зэргээс ойр орчмын тээврийн хэрэгсэл буюу явган зорчигчийг сайн харж чадахгүй байх зэрэг аюулын хүчин зүйлд анхаарах ёстой."},{"n":993,"b":"Нэг чиглэлд 1 эгнээтэй замаар зорчиж байна. Аюултай нөхцөл аль нь вэ? (Вэбсайтаас үзнэ үү)","c":["Урд талын хөдөө аж ахуйн машинтай аюулгүй зай барьсан тул араас ирж буй автомашины гүйцэж түрүүлэх нөхцөлийг бүрдүүлсэн.","Огцом хурд сааруулан удаан явсан тул араас ирж байсан автомашины гүйцэж түрүүлэх нөхцөлийг бүрдүүлсэн.","Орон нутгийн зам дээр зорчиж байгаа эсвэл зам хөндлөн гарч буй хөдөө аж ахуйн машиныг оройтож анзаарах боломжтой.","Араас ирж буй автомашины аюулгүй гүйцэж түрүүлэх үйлдэлд саад учруулсан."],"a":"3","imgs":[],"t":"동영상형","e":"Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйлийн ③ дахь хэсэгт “Тээврийн хэрэгслийн жолооч замын (явган хүний зам ба зорчих хэсэг нь тусгаарлагдсан замд зорчих хэсгийг хэлнэ) төвөөс (төвийн шугам байрлуулсан тохиолдолд тухайн төвийн шугамыг хэлнэ. Цаашид мөн адил) баруун талын хэсгээр явах ёстой.” гэж заасан. Бичлэгт тухайн жолооч төвийн шугамын баруун талаар явж байгаа бөгөөд түүний ард явж буй тээврийн хэрэгслийн жолооч ч үүнийг дагах ёстой. Иймд жолооч Замын хөдөлгөөний тухай хуулийг дагаж мөрдөн явж байгаа тул тухайн жолоочийн аюулгүй зай хангасан болон удаан явсан нь ард нь явж буй автомашины жолоочийн төвийн шугам давахад хүргэсэн гэж хэлж болохгүй. Ард нь явж буй автомашины жолооч нар Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйлийг дагаж мөрдөөгүй, төвийн шугам давсан бөгөөд зарчмын хувьд хориглосон гүйцэж түрүүлэх үйлдэл хийсэн. Тахир зам буюу давааны орой зэрэг газартай орон нутгийн замаар явах тохиолдолд хөдөө аж ахуйн машиныг амархан олж харахгүй байж болзошгүй тул хурдаа сааруулах хандлагатай байх ёстой."},{"n":994,"b":"Дараах бичлэгт баруун эргэхийн тулд мотоблокийг гүйцэж түрүүлж буй нөхцөлд урьдчилан таамаглаж болох хамгийн а юултай нөхцөл аль вэ? (Вэбсайтаас үзнэ үү)","c":["Баруун талын замын ачааны автомашин уулзвараар нэвтрэхийн тулд хурдаа сааруулж болзошгүй.","Зүүн талын замын улаан өнгийн суудлын автомашин баруун эргэхийн тулд хурдаа сааруулж болзошгүй.","Мотоблок баруун эргэж байх үед баруун талын замын цагаан өнгийн суудлын автомашин уулзвар дээр ачааны автомашиныг г үйцэж түрүүлж болзошгүй.","Мотоблок баруун эргэхийн тулд зогсох шугам дээр түр зогсож болзошгүй."],"a":"3","imgs":[],"t":"동영상형","e":"Замын хөдөлгөөний тухай хуулийн 19 дүгээр зүйл (Аюулгүй зайг хангах зэрэг), Замын хөдөлгөөний тухай хуулийн 20 дугаар зүйл (Зам тавьж өгөх үүрэг) ○ Орох замын ойролцоо орж ирж буй автомашиныг эрт олж хараад тухайн автомашинтай харьцах зай болон хурдны зөрүүг харгалзан өөрийн тээврийн хэрэгсэл түрүүлж явах уу, өөрийн урд оруулах уу гэдгийг шийдэх ёстой. ○ Энэ тохиолдолд баруун талаас орох гэж буй тээврийн хэрэгсэл байгаа бөгөөд арын тээврийн хэрэгсэл аль хэдийн гүйцэж түрүүлэх эгнээ рүү замаа өөрчлөх гэж байгаа тул зүүн тийш замаа өөрчлөх нь аюултай. Хурдлах эгнээний тээврийн хэрэгсэл орж ирэхэд хялбар байхаар хурдаа тогтмол барьж явна."},{"n":995,"b":"Хурдны замаас гарах гэж байна. Хамгийн зөв арга аль вэ? (Вэбсайтаас үзнэ үү)","c":["Хурдан гарахын тулд сааталгүйгээр дараалан хэд хэдэн эгнээ хөндлөн гарна.","Огцом хурд сааруулж шуурхай эгнээ солино.","Хурд сааруулах эгнээнд орсноосоо хойш хурд хэмжигчийг харж хурдаа бууруулна.","Хурд сааруулах эгнээний өмнө автомашин байхгүй бол хурдаа нэмэгдүүлж гарцаар хурдан гарна."],"a":"3","imgs":[],"t":"동영상형","e":"Хурдны замын жолоодлого нь өндөр хурднаас болж сэтгэл догдолсон жолоодлого хийхээс өөр аргагүй. Иймд үндсэн эгнээнээс гарах зам руу гарах үед ард нь явж буй тээврийн хэрэгсэл байгаа тул огцом хурдаа сааруулбал арын тээврийн хэрэгсэлтэй мөргөлдөх эрсдэлтэй тул анхаарах ёстой. Үндсэн эгнээнээс гарч хурд сааруулах эгнээнд орвол мэдрэмжид найдалгүй хурд хэмжигчийг хараад хурдаа бүрэн бууруулах ёстой."},{"n":996,"b":"Бичлэгээс харагдаж буй аюултай хүчин зүйл, нөхцөлд хамаарахгүй нь аль вэ? (Вэбсайтаас үзнэ үү)","c":["Хонгил руу орох үед үзэгдэх орчин муудах нөхцөл","Хонгилоос гарах үед үзэгдэх орчин муудах нөхцөл","Хонгилын орох, гарах үүд эсвэл гүүрэн дээрх нимгэн мөсөн бүрхүүл (Black Ice)","Хонгилоор зорчих үед гүйцэж түрүүлэх дүрэм зөрчсөн тээврийн хэрэгслүүд"],"a":"4","imgs":[],"t":"동영상형","e":"Гэрэлд дасах гэж харанхуй газраас гэнэт гэрэлтэй газар руу шилжих үед харааны систем огцом мэдрэмж буурах үйл явцыг хэлнэ. Харанхуйд дасах нь гэрэлд дасахын эсрэг үйл явц гэж хэлж болно. Ийм онцлогоос газар доорх зам буюу хонгил зэрэгт орох, гарах үед урд талын замын хөдөлгөөний нөхцөл байдал зэрэг амархан харагддаггүй онцлогтой. Иймд жолооч газар доорх зам буюу хонгил зэрэгт орох, гарах гэж байгаа тохиолдолд урьдчилан тээврийн хэрэгслийн хурдаа сааруулж урд талын замын хөдөлгөөний нөхцөл байдалд бэлтгэх жолоодлогын хандлагатай байх ёстой. Ялангуяа тэгээс доош хэмийн температурт замын (нарийн) тоос, элс ба ус холилдон нимгэн мөс үүсгэдэг бөгөөд энэ нимгэн мөсийг жолоодож байхдаа жолооч нүдээрээ ялгаж таних нь амаргүй. Энэ нимгэн мөс (хар мөс гэж нэрлэдэг) нь газрын дулаангүй гүүр хэлбэрийн зорчих хэсэг (гүүр) буюу хонгилын орох, гарах хэсэгт үүсэх магадлал өндөр. Иймд жолооч үүнд анхаарах шаардлагатай. Бичлэгт хонгил болон гүүрний хэсэгт гүйцэж түрүүлэх зөрчлийн үйлдэл хийсэн тээврийн хэрэгсэл байгаагүй."},{"n":997,"b":"Бичлэгээс харагдаж буй жолоочийн хууль дүрэм мөрдсөн жолоодлогыг зөв тайлбарласан нь аль вэ? (Вэбсайтаас үзнэ үү)","c":["Урд гэрлээ асаасан.","Аюулгүйгээр гүйцэж түрүүлсэн.","Цаг агаарын онцгой нөхцөлд хурд бууруулах журмыг мөрдсөн.","Хажуугийн явган зорчигч руу ус цацагдахгүй бай
