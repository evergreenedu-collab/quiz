аа бол хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Баруун талын харагдах орчин хязгаарлагдмал тул зогссоны дараа баруун эргэнэ.","Явган хүний гарц дээр явган зорчигч байхгүй тул шууд хурдан өнгөрнө.","Эсрэг чиглэлийн тээврийн хэрэгслийн хөдөлгөөнд саад учруулахгүйгээр зогсох шугамын өмнө зогсоно.","Уулзварт түрүүлж орсон байгаа тул үргэлжлүүлэн явна.","Явган зорчигчийг явган хүний гарц руу оруулахгүйн тулд дуут дохио өгнө."],"a":"1, 3","imgs":["img_0104.jpg"],"t":"사진형","e":"Аюулыг урьдчилан таамаглах. Зам дээр байрлуулсан явган хүний гарц нь гэрлэн дохио суурилуулаагүй явган хүний гарц юм. Энэ үед жолооч эсрэг чиглэлээс зүүн тийш эргэх гэж буй жолооч болон баруун талын явган хүний гарц руу гүйж буй хүүхдийг харж болно. Мөн баруун тийш эргэх тохиолдолд Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу бусад тээврийн хэрэгслийн хөдөлгөөнд саад учруулахгүй байх ёстой бөгөөд баруун талд зогсох болон зогсоолд тавих журам зөрчсөн автомашинуудаас болж баруун талын явган хүний гарц халхлагдсан үл үзэгдэх бүсэд байж болох явган зорчигчийг урьдчилан таамаглаж, зогссоны дараа анхааралтай ажиглаад баруун тийш эргэх үйлдэл хийх ёстой."},{"n":800,"b":"Зүүн эгнээ (1-р эгнээ)-гээр чигээрээ явж уулзварт ойртож байгаа нөхцөл байна. Аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Эсрэг чиглэлд тээврийн хэрэгсэл байхгүй тул зүүн талаар гүйцэж түрүүлэн өнгөрнө.","Хурдаа бууруулан 1-р эгнээнд байгаа такситай аюулгүйн зай баримтлан ойртоно.","Дуут дохио хэрэглэн таксийг зогсоож, таксины баруун талаар хурдан өнгөрнө.","Дараалан 3-р эгнээ рүү эгнээ сольж зогсоно.","2-р эгнээ рүү эгнээ солих тохиолдолд такси болон явган зорчигчид ойртох үед хурдаа бууруулна."],"a":"2, 5","imgs":["q800.png"],"t":"사진형","e":"1 дүгээр эгнээгээр явж буй такси баруун талын явган зорчигчийг хараад тоормослож, жолооны механизмыг баруун тийш эргүүлсэн байдалтай байна. Иймд ард нь явж буй жолооч таксины гэнэтийн огцом хурд сааруулалтаас болгоомжилж аюулгүй зайг барих ёстой. Мөн баруун тийш замаа өөрчлөх тохиолдолд ч зогсоолд тавьсан автомашинуудаас зайлсхийж 2 дугаар эгнээнд зогсоод зорчигч суулгах нь урьдчилан харагдаж байгаа тул хурдаа сааруулж уулзварт ойртох ёстой."},{"n":801,"b":"Чигээрээ явж байна. Аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Цагаан өнгийн автомашиныг оруулахгүй байхын тулд хурдаа нэмэгдүүлэн явна.","Цагаан өнгийн автомашин чигээрээ явах боломжтой тул хурдаа сааруулан анхааралтай ажиглана.","Зам засварын ажлын улмаас зүүн талаар зорчих боломжтой тул хэвийн үргэлжлүүлэн явна.","Цагаан өнгийн суудлын автомашин зогсоно гэж таамаглан эсрэг чиглэлийн тээврийн хэрэгсэлд анхаарч явна.","Эсрэг чиглэлийн улаан өнгийн суудлын автомашин зүүн эргэх эгнээнд орох боломжтой тул шаардлагатай бол зогсож нөхцөл байдлыг ажиглана."],"a":"2, 5","imgs":["q801.png"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйл. Замын арчлалт, засварын ажлаас болж баруун талаар явах боломжгүй тохиолдолд Замын хөдөлгөөний тухай хуулийн дагуу зүүн талаар явж болно. Энэ үед эсрэг чиглэлээс явж буй автомашинд онцгой анхаарал хандуулах шаардлагатай. Эсрэг чиглэлийн суудлын автомашин зүүн тийш эргэх гэж байвал мөргөлдөх магадлал өндөр тул шаардлагатай бол зогсох ёстой. Мөн үзүүлсэн нөхцөл байдалд цагаан суудлын автомашин явж байгаа бөгөөд зогсох, баруун тийш эргэх буюу шулуун явах (төвийн шугам давах) болон зүүн тийш эргэх (төвийн шугам давах) үйлдлүүдээс аль нэгийг хийж болно. Ялангуяа зарим жолооч туслах замд төвийн шугам даваад шулуун явах буюу зүүн тийш эргэх тохиолдол байдаг тул урдаас орж ирж буй тээврийн хэрэгслийн жолооч нар бүгд зогсоно гэж таамаглах буюу зөвхөн баруун тийш эргэнэ гэж урьдчилан дүгнэх нь аюултай."},{"n":802,"b":"Хотын нарийн гудамжаар явж байгаа нөхцөлд хамгийн аюулгүй жолоодох арга аль 2 вэ?","c":["Унадаг дугуй болон салхилуулж буй тэжээвэр нохой гэнэт замын гол хэсэг рүү гарч ирж болзошгүй тул анхаарна.","Дуут дохио өгч өөрийн автомашины хөдөлгөөнийг мэдэгдээд үргэлжлүүлэн явна.","Хүүхэд гэнэт замын гол хэсэг рүү гарч ирж болзошгүй тул хурдаа сааруулна.","Хурдаа нэмэгдүүлэн унадаг дугуйг тойрч хурдан өнгөрнө.","Урд гэрлээ анивчуулан өөдөөс ирж буй автомашинд анхааруулна."],"a":"1, 3","imgs":["q802.png"],"t":"사진형","e":"Хотын төвийн туслах замд явган зорчигч, унадаг дугуй, гэрийн тэжээвэр амьтан зэрэг олон төрлийн хөдөлгөөнд оролцогч холилдон байдаг тул гэнэтийн аюул их байдаг. Жолооч ийм аюулд бэлтгэж анхааралтай жолоодох ёстой. Ялангуяа хүүхэд гэнэт зам руу үсрэн гарч болзошгүй тул хурдаа бууруулж удаан явах ёстой (③). Харин дуут дохио буюу урд гэрлийг шаардлагагүйгээр ашиглаж явган зорчигч буюу эсрэг талын жолоочид заналхийлэх үйлдэл (②, ⑤) болон хурдаа нэмж хурдан өнгөрөх үйлдэл (④) нь бүгд хууль тогтоомж зөрчиж болзошгүй бөгөөд аюулгүй биш. Иймд зөв хариулт нь ① болон ③ юм."},{"n":803,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зогсоолд тавьсан автомашинуудын хоорондоос явган зорчигч гарч ирж болзошгүй тул удаан явна.","Зогсоолд байгаа автомашин гэнэт хөдөлж болзошгүй тул анхааралтай жолоодно.","Газар доорх зогсоолын замын тэмдэглэлийг заавал мөрдөх шаардлагагүй.","Зөвхөн өөрийн автомашиныг байрлуулах боломжтой зогсоолын хэсгийг ажиглан жолоодно.","Газар доорх зогсоолын багана нь жолоочийн харах орчныг хаадаг байгууламж тул дуут дохиог байнга өгч жолоодно."],"a":"1, 2","imgs":["img_0105.jpg"],"t":"사진형","e":"Аюул үргэлж далд оршдог. Аюулыг урьдчилан таамаглах гэдэг нь далд аюулыг урьдчилан таамаглаж бэлтгэх явдал юм. Газар доорх зогсоолд замаас өөр аюул байж болох тул болгоомжтой жолоодох ёстой. Зогсоолд тавьсан тээврийн хэрэгслүүдийн хооронд явган зорчигч гэнэт гарч ирж болзошгүй тул заавал удаан явах ёстой (①), зогсоолд байгаа тээврийн хэрэгсэл санаанд оромгүй мөчид хөдөлж болзошгүй тул үүнд анхаарч жолоодох ёстой (②). Нөгөө талаар замын гадаргуугийн тэмдэглэгээг заавал дагаж мөрдөх ёстой (③). Зөвхөн тодорхой зогсоолын хэсгийг харах (④) буюу дуут дохиог шаардлагагүйгээр тасралтгүй дуугаргах үйлдэл (⑤) нь бүгд аюулгүй биш жолоодлогын арга юм. Иймд зөв хариулт нь ① болон ② юм."},{"n":804,"b":"Цагт 30 километр хурдтай чигээрээ явж байна. Аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зогсоолд тавьсан автомашинуудтай мөргөлдөхгүй байхын тулд явган хүний гарцаар цагт 30 километрээс ихгүй хурдтай гарна.","Хурдаа сааруулан ойртож, явган хүний гарцын өмнөх зогсох шугам дээр зогсоно.","Явган хүний гарц дээр хүн байхгүй тул цагт 30 километр хурдтай удаан явна.","Явган хүний гарц дээр хүн байхгүй тул шууд өнгөрнө.","Баруун талаас зам руу орох гэж буй автомашинд анхаарч удаан явна."],"a":"2, 5","imgs":["q804.png"],"t":"사진형","e":"Үзүүлсэн нөхцөл байдлын газар нь орон сууцны хорооллын хүүхдийн хамгаалалтын бүс юм. Хүүхдийн хамгаалалтын бүсийн гэрлэн дохиогүй явган хүний гарц руу орохдоо явган зорчигч гарч байгаа эсэхээс үл хамааран зогссоны дараа орох ёстой. Ялангуяа явган хүний гарцын ойролцоо зогсоолд тавьсан автомашин байгаа тохиолдолд хөндлөн гарах гэж буй явган зорчигч харагдахгүй тул зогссоны дараа удаан явж нэвтрэх тохиолдолд ч явган зорчигч орж ирэхэд бэлтгэх ёстой. Замаас өөр газраас зам руу орох гэж буй тээврийн хэрэгслийн жолооч эхлээд зогсох ёстой боловч зарим жолооч зам руу хүчээр ордог. Иймд замаас өөр газраас зам руу орох гэж буй тээврийн хэрэгсэл ажиглагдвал удаан явж анхаарах ёстой."},{"n":805,"b":"Орон сууцны хорооллын зогсоолд зүүн эргэх гэж байна. Урьдчилан анхаарах шаардлагатай эрсдэлт хүчин зүйлээс хамгийн хамаарал багатай 2 нь аль вэ?","c":["Байгууламжаар халхлагдсан тул харагдахгүй байгаа А бүс","Ухрах гэж буй цагаан өнгийн автомашин","Дахин боловсруулах хог цуглуулах шуудайтай мөргөлдөх магадлал","Тоглож буй хүүхэд зорчих хэсэг рүү орж ирэх","Ард яваа автомашинтай мөргөлдөх магадлал"],"a":"3, 5","imgs":["q805.png"],"t":"사진형","e":"Үзүүлсэн нөхцөл байдал нь орон сууцны хороолол болон нийтийн орон сууцаар явах үед байнга тохиолддог нөхцөл байдал юм. Энэ үед орон сууцны тохижилтын мод, хүнсний хог хаягдлын сав, бусад байгууламж зэргээр халхлагдсан газарт үргэлж анхаарал тавих ёстой. Дээрх A бүсэд онцгой анхаарч, удаан явж ойртон зүүн тийш эргэхийн өмнө зогсох дадалтай байх ёстой. Цагаан суудлын автомашин цагаан гэрлээ асаасан байдалтай тул ухрах нь урьдчилан таамаглагдах нөхцөл байдал юм. Иймд ухарч буй нөхцөл байдал уу, эсвэл ухрах арааг залгасан байдалтай зогсож байна уу гэдгийг анхааралтай ажиглах ёстой. Орон сууцны хорооллын хүүхдийн үйлдлийг урьдчилан таамаглах боломжгүй тул хүүхэд зорчих хэсэг рүү орж ирэхийг урьдчилан таамаглаж жолоодох ёстой. Шуудайтай мөргөлдөх магадлал болон арын тээврийн хэрэгсэлтэй мөргөлдөх магадлал нь мэдэгдэхүйц бага."},{"n":806,"b":"Уулзварт ойртож байгаа бөгөөд баруун эргэх гэж байна. Хамгийн аюулгүй зорчих арга аль 2 вэ?","c":["Хүүхэд зүүн тийш зам хөндлөн гарч байгаа тул баруун талын сул зайгаар шууд орж баруун эргэнэ.","Эсрэг чиглэлээс ирж буй автомашин зүүн эргэх эсэхийг ажиглана.","Явган хүний гарцын өмнөх зогсох шугам дээр зогсож, хүүхэд зам хөндлөн гарч дуусах хүртэл хүлээнэ.","Эсрэг чиглэлийн суудлын автомашинаас түрүүлж уулзварт орохын тулд хурдаа нэмэгдүүлэн зогсох шугамыг давна.","Замын хөдөлгөөний гэрлэн дохионы дагуу анхааралтай удаан орж баруун эргэнэ."],"a":"2, 3","imgs":["q806.png"],"t":"사진형","e":"Үзүүлсэн нөхцөл байдалд хүүхэд хөндлөн гарч байна. Энэ үед жолооч явган хүний гарцын яг өмнө байрлуулсан зогсох шугам дээр зогсох ёстой. Энэ үед баруун тийш эргэх гэж буй жолооч явган хүний гарцын явган зорчигч хөндлөн гарч дуустал хүлээх ёстой. Мөн эсрэг талаас уулзварт орж ирж буй автомашин нь зүүн тийш эргэх гэж буй автомашин тул тухайн автомашин зүүн тийш эргэж дуустал хүлээх ёстой. Үүний дараа бүх чиглэлийн аюулгүй байдлыг шалгаад баруун тийш эргэх ёстой. Улаан анивчих гэрэл нь түр зогссоны дараа орохыг заасан дохио юм."},{"n":807,"b":"Т хэлбэрийн уулзварт зүүн эргэх гэж байна. Хамгийн аюулгүй жолоодох арга болох 2-ыг сонгоно уу.","c":["Зүүн эргэх гэрлэн дохионы дагуу хурдан зүүн эргэнэ.","Явган хүний гарцын зогсох шугамын өмнө зогсоно.","Удаан явж явган хүний гарц руу орсны дараа зүүн талаас ирэх автомашинд анхаарч зүүн эргэнэ.","Баруун талын хүнээс аюулгүйн зай барин зүүн эргэнэ.","Явган хүний гарц ашиглаж буй явган зорчигч болон унадаг дугуй зам хөндлөн гарч дуусах хүртэл хүлээнэ."],"a":"2, 5","imgs":["q807.png"],"t":"사진형","e":"Зурагт үзүүлсэн уулзварт тээврийн хэрэгслийн гэрлэн дохио суурилуулагдан ажиллаж байгаа боловч урд талын явган хүний гарцад гэрлэн дохио байхгүй байна. Тээврийн хэрэгслийн дохио нь зүүн эргэлтийн ногоон сумтай гэрэл асаж байгаа тул жолооч ногоон сумын заасан чиглэлд явж болно. Гэвч гэрлэн дохиогүй явган хүний гарцаар хөндлөн гарч буй хүн болон хөндлөн гарах гэж буй хүн байгаа тул ийм нөхцөлд зогсох шугамын өмнө хүлээж, явган хүний гарцын явган зорчигч аюулгүй хөндлөн гарч дуустал хүлээх ёстой."},{"n":808,"b":"Дараах замын нөхцөлд хамгийн их анхаарах шаардлагатай аюултай нөхцөл байдал аль 2 вэ?","c":["Цахилгаан кик скүүтер жолоодож буй хүн урд талын явган зорчигчоос зайлсхийхийн тулд гэнэт зүүн тийш шилжиж болзошгүй.","Баруун талын явган зорчигчид зүүн тийш зам хөндлөн гарч болзошгүй.","Удаан явсны улмаас арын автомашинуудтай мөргөлдөж болзошгүй.","Эсрэг чиглэлийн цагаан өнгийн автомашинтай мөргөлдөж болзошгүй.","Цахилгаан кик скүүтер автобусны буудал дээрх явган зорчигчийг мөргөж болзошгүй."],"a":"1, 2","imgs":["q808.png"],"t":"사진형","e":"Өгөгдсөн нөхцөл байдалд хамгийн аюултай нөхцөл байдал нь нэгдүгээрт, нэг чиглэлд урд баруун тийш хазайн явж буй цахилгаан скүтерийн жолооч урдах явган зорчигчтой мөргөлдөхөөс зайлсхийхийн тулд зүүн тийш шилжин явж болзошгүй. Цахилгаан скүтерийн ийм үйлдлийг урьдчилан таамаглаж чадалгүй урд талын зай руу хурдлан явах тохиолдолд зам тээврийн осол амархан гарч болно. Хоёрдугаарт, баруун талаар явж буй явган зорчигч хөндлөн гарах байгууламжгүй газарт амархан хөндлөн гарах хандлагатай байдаг. Иймд туслах замаар явах тохиолдолд хүчээр хурдлах буюу урд болон баруун талд байгаа хөдөлгөөнд оролцогчид үргэлж ижил хөдөлгөөний чиглэлтэй байна гэж таамаглах нь зам тээврийн ослоос урьдчилан сэргийлэхэд сөрөг нөлөөтэй гэж хэлж болно."},{"n":809,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зүүн чиг заах дохио болон урд гэрлээ ажиллуулж аюулгүйгээр гүйцэж түрүүлнэ.","Мотоблокийн жолоочийн дохионы дагуу анхааралтай аюулгүйгээр г үйцэж түрүүлнэ.","Мотоблокийн жолоочийн дохио дууссаны дараа гүйцэж түрүүлнэ.","Мотоблокийн жолоочийн гарын дохиог үл тоомсорлон араас нь д агана.","Мотоблокоос хангалттай аюулгүйн зай барина."],"a":"4, 5","imgs":["img_0106.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 13 дугаар зүйлийн 3 дахь хэсэг. Тээврийн хэрэгслийн жолооч замын (явган хүний зам ба зорчих хэсэг нь тусгаарлагдсан замд зорчих хэсгийг хэлнэ) төвөөс (төвийн шугам байрлуулсан тохиолдолд тухайн төвийн шугамыг хэлнэ. Цаашид мөн адил) баруун талын хэсгээр явах ёстой. 4 дэх хэсэг. Тээврийн хэрэгслийн жолооч 3 дахь хэсгээс үл хамааран дараах заалтын аль нэгэнд хамаарах тохиолдолд замын төв буюу зүүн талын хэсгээр явж болно. 1. Зам нэг чиглэлийн хөдөлгөөнтэй тохиолдолд 2. Замын эвдрэл, замын ажил буюу бусад саад зэргээс болж замын баруун талын хэсгээр явах боломжгүй тохиолдолд 3. Замын баруун талын хэсгийн өргөн нь 6 метрт хүрэхгүй замд өөр тээврийн хэрэгслийг гүйцэж түрүүлэх тохиолдолд. Гэхдээ дараах дэд заалтын аль нэгэнд хамаарах тохиолдолд энэ нь хамаарахгүй. а. Замын зүүн талын хэсгийг харах боломжгүй тохиолдолд б. Эсрэг чиглэлийн хөдөлгөөнд саад учруулж болзошгүй тохиолдолд в. Аюулгүйн тэмдэглэгээ зэргээр гүйцэж түрүүлэхийг хориглосон буюу хязгаарласан тохиолдолд 4. Замын баруун талын хэсгийн өргөн нь тээврийн хэрэгсэл явахад хүрэлцэхгүй тохиолдолд 5. Эгц налуу замын тахир хэсэгт хөдөлгөөний аюулаас урьдчилан сэргийлэхийн тулд аймаг, нийслэлийн Цагдаагийн газрын дарга шаардлагатай гэж үзэж хэсэг болон явах аргыг заасан тохиолдолд тухайн зааврын дагуу явах тохиолдолд. Хөдөө аж ахуйн машины жолооч нь гараар дохио өгөх эрхтэй хүн биш. Замаар явах үед удаан хурдтай явж буй ачааны автомашин, тусгай автомашин болон хөдөө аж ахуйн машин зэргийн жолооч “шууд гүйцээд яваарай” гэсэн утгаар гараар дохих тохиолдол байдаг боловч энэ үеийн гарын хөдөлгөөн нь гарын дохио биш."},{"n":810,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Орох гэж буй тээврийн хэрэгсэл тойрог уулзвараар эргэлдэж буй тээврийн хэрэгсэлд зам тавьж өгнө.","Тойрог уулзварт орохдоо удаан явах эсвэл түр зогсоно.","Орох гэж буй тээврийн хэрэгсэл давуу эрхтэй тул хурдан орж зорьсон чиглэлдээ явна.","Тойрог уулзварт орохдоо эргэлдэж буй тээврийн хэрэгслээс түрүүлж орно.","Орчны тээврийн хэрэгслийн хөдөлгөөнд анхаарах шаардлагагүй."],"a":"1, 2","imgs":["img_0107.jpg"],"t":"사진형","e":"Тойрог уулзварт тойрч буй хөдөлгөөн нь орох хөдөлгөөнөөс давуу эрхтэй тул үргэлж зам тавьж өгөх жолоодлогын хандлага шаардлагатай бөгөөд тойрох үед ойр орчмын тээврийн хэрэгслээс аюулгүй зайг барьж удаан явах нь чухал. Өөрөөр хэлбэл тойрог уулзварт орох гэж буй тээврийн хэрэгсэл аль хэдийн тойрч буй тээврийн хэрэгсэлд зам тавьж өгөх ёстой. Мөн орохдоо удаан явах буюу шаардлагатай бол түр зогсох ёстой бөгөөд тойрч буй тээврийн хэрэгслийн хөдөлгөөнд саад учруулахгүй байх ёстой (②). Эсрэгээр орж буй тээврийн хэрэгсэл давуу эрхтэй гэсэн үзэл (③, ④) болон ойр орчмын тээврийн хэрэгслийг ажиглахгүй жолоодох (⑤) нь бүгд аюулгүй биш жолоодлогын арга юм. Иймд зөв хариулт нь ① болон ② юм."},{"n":811,"b":"Уулзварт орж чигээрээ явах гэж байна. Хамгийн аюулгүй жолоодох арга болох 2-ыг сонгоно уу.","c":["Хар өнгийн автомашин ухарч болзошгүй тул хурдаа сааруулан бэлтгэлтэй байна.","Хоёр дугуйт тээврийн хэрэгсэл хар өнгийн суудлын автомашины зүүн талаар эгнээ сольж болзошгүй тул анхаарна.","Эсрэг чиглэлийн сул байгаа чигээрээ явах эгнээг ашиглан чигээрээ явсны дараа анхны эгнээндээ буцаж орно.","Зогссон хар өнгийн автомашины хажуугаар хурдаа нэмэгдүүлэн чигээрээ өнгөрнө.","Хоёр дугуйт тээврийн хэрэгсэл миний урд эгнээ сольж орох боломжгүй байхаар хурдаа нэмэгдүүлэн өнгөрнө."],"a":"1, 2","imgs":["q811.png"],"t":"사진형","e":"Үзүүлсэн нөхцөл байдалд хар суудлын автомашин Замын хөдөлгөөний тухай хуулийн 18 дугаар зүйлийн буцаж эргэхийг хориглосон заалтыг зөрчиж байна. Хар суудлын автомашин ухрах гэрлээ асаасан байдалтай тул эргэх радиусаа хангахын тулд ухрах үйлдэл хийхийг урьдчилан таамаглаж болно. Иймд жолооч ухрах гэрлээ асаасан автомашиныг олж харвал анхаарахын зэрэгцээ удаан явах буюу зогсох ёстой. Баруун талын эгнээгээр (2 дугаар эгнээ) явж буй хоёр дугуйт тээврийн хэрэгслийн жолооч урд талын хөдөлгөөнд саад учирч байна гэж үзвэл зүүн тийш замаа өөрчлөх магадлал өндөр. Ийм тохиолдолд баруун талын хоёр дугуйт тээврийн хэрэгсэлд онцгой анхаарал хандуулах шаардлагатай."},{"n":812,"b":"Дараах нөхцөлд аюулгүй жолоодох арга аль 2 вэ?","c":["Хар өнгийн автомашины жолооч P зайг ашиглан хурдан явж өнгөрнө.","Хар өнгийн автомашины жолооч хүүхдийн сургуулийн автобусны ард зогсоно.","Цагаан өнгийн автомашины жолооч хүүхдийн сургуулийн автобусанд анхаарч удаан чигээрээ явна.","Цагаан өнгийн автомашины жолооч хүүхдийн сургуулийн автобусанд хүрэхээс өмнө зогсож, дараа нь удаан явна.","Цагаан өнгийн автомашины жолооч дуут дохиог тасралтгүй өгч өөрөө чигээрээ явах гэж байгаагаа мэдэгдэнэ."],"a":"2, 4","imgs":["img_0108.jpg"],"t":"사진형","e":"51 дүгээр зүйл (Хүүхдийн сургуулийн автобусыг онцгойлон хамгаалах) ① Хүүхдийн сургуулийн автобус зам дээр зогсож, хүүхэд буюу нялх, балчир хүүхэд сууж, буулгаж байгааг илэрхийлэх анивчдаг гэрэл зэрэг төхөөрөмжийг ажиллуулж байх үед хүүхдийн сургуулийн автобус зогссон эгнээ болон тухайн эгнээний яг хажуугийн эгнээгээр явж буй тээврийн хэрэгслийн жолооч хүүхдийн сургуулийн автобуст хүрэхээс өмнө түр зогсож аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ② 1 дэх хэсгийн тохиолдолд төвийн шугам байрлуулаагүй зам болон нэг чиглэлд 1 эгнээтэй замд эсрэг чиглэлээс явж буй тээврийн хэрэгслийн жолооч ч хүүхдийн сургуулийн автобуст хүрэхээс өмнө түр зогсож аюулгүй байдлыг шалгасны дараа удаан явах ёстой. ③ Бүх тээврийн хэрэгслийн жолооч хүүхэд буюу нялх, балчир хүүхэд тээвэрлэж байгааг илэрхийлсэн байдалтай замаар явж буй хүүхдийн сургуулийн автобусыг гүйцэж түрүүлж болохгүй."},{"n":813,"b":"Дараах уулзварт хамгийн аюулгүй зорчих аргыг зөв тайлбарласан 2 нь аль вэ?","c":["А эгнээнээс орохдоо зүүн чиг заах дохиог ажиллуулсан.","А эгнээнээс орсон жолооч нэн даруй a эгнээнд орж эргэлдээд хойд зүг рүү гарсан.","B эгнээнээс орохдоо баруун чиг заах дохиог ажиллуулсан.","B эгнээнээс орсон жолооч нэн даруй b эгнээнд орж эргэлдээд a эгнээ рүү эгнээ сольж хойд зүг рүү гарсан.","Дотор талаар эргэлдэж байгаад гарахдаа зүүн чиг заах дохиог ажиллуулсан."],"a":"1, 2","imgs":["q813.png"],"t":"사진형","e":"Үзүүлсэн уулзвар нь “спираль хэлбэрийн тойрог уулзвар” юм. A эгнээнээс орж буй жолооч тойрч буй тээврийн хэрэгсэлд зам тавьж өгсний дараа шууд a эгнээнд орох ёстой. Энэ үед цагаан тасархай шугамыг ашиглах ёстой. A эгнээний гарах чиглэл нь дорно зүг болон хойд зүг юм. B эгнээнээс орж буй жолооч тойрч буй тээврийн хэрэгсэлд зам тавьж өгсний дараа шууд b эгнээнд орох ёстой. B эгнээний гарах чиглэл нь өмнө зүг болон дорно зүг юм. Мөн тойрог уулзварт орох үед зүүн, гарах үед баруун чиг заах дохиог заавал ажиллуулах ёстой."},{"n":814,"b":"Дараах нөхцөлд баруун эргэх гэж байгаа бол хамгийн аюулгүй жолоодох арга аль 2 вэ?","c":["Урд талын ногоон явах дохионы дагуу хурдан баруун эргэнэ.","Баруун талын явган зорчигч явган хүний гарцаар гарч болзошгүй тул түр зогсож аюулгүй байдлыг шалган баруун эргэнэ.","Баруун эргэх тусгай гэрлэн дохио улаан тул зогсоно.","Баруун эргэх тусгай гэрлэн дохио улаан байсан ч явган зорчигчийн хөдөлгөөнд саад учруулахгүй бол баруун эргэж болно.","Зогсох шугам дээр зогсож, баруун эргэх суман гэрэл асах хүртэл хүлээнэ."],"a":"3, 5","imgs":["img_0109.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 2]-т баруун тийш эргэх гэж буй тээврийн хэрэгсэл нь баруун эргэлтийн гурван өнгийн гэрлэн дохио байгаа тохиолдолд бусад гэрлэн дохиог үл харгалзан түүнийг дагах ёстой гэж тодорхой заасан. Баруун эргэлтийн гурван өнгийн гэрлэн дохио суурилуулсан уулзварт улаан дохионд явбал гэрлэн дохио зөрчсөнд тооцогдох бөгөөд зөвхөн баруун эргэлтийн сумтай гэрэл асаж байх үед л баруун тийш эргэж болно."},{"n":815,"b":"Дараах нөхцөлд зүүн эргэх гэж байгаа бол хамгийн аюулгүй жолоодох арга аль 2 вэ?","c":["Ногоон явах дохионы дагуу уулзварт шууд хурдан орно.","Урд явж буй автомашины араас маш ойрхон дагана.","Зүүн эргэх эгнээ түгжрэлтэй тул 3-р эгнээг ашиглан зүүн эргэнэ.","Уулзварт дайран орсноор бусад автомашины хөдөлгөөнд саад учруулж болзошгүй тул уулзварт орохгүй.","Уулзварт орох гэж буй арын автомашин байж болзошгүй тул урьдчилан хурдаа сааруулж арын мөргөлдөөнөөс урьдчилан сэргийлнэ."],"a":"4, 5","imgs":["img_0110.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйлд (Уулзвараар нэвтрэх арга) бүх тээврийн хэрэгсэл буюу трамвайн жолооч гэрлэн дохиогоор хөдөлгөөний зохицуулалт хийж буй уулзварт орох гэж байгаа тохиолдолд явах гэж буй замын урд байгаа тээврийн хэрэгсэл буюу трамвайн нөхцөл байдлаас шалтгаалан уулзварт (зогсох шугам байрлуулсан тохиолдолд тухайн зогсох шугамыг давсан хэсгийг хэлнэ) зогсох болж бусад тээврийн хэрэгсэл буюу трамвайн хөдөлгөөнд саад учруулж болзошгүй тохиолдолд тухайн уулзварт орж болохгүй гэж тодорхой заасан. Мөн зам дээр хүчээр орох гэж буй өөр жолооч байж болзошгүй тул урьдчилан хурдаа бууруулах зэрэг хамгаалалтын жолоодлого ч шаардлагатай."},{"n":816,"b":"Осол гарах магадлал хамгийн өндөр хүчин зүйл аль 2 вэ?","c":["Ухрах гэж буй А ачааны автомашин","Ачааны автомашины араар зам хөндлөн гарч буй B явган зорчигч","Ар талаас ирж буй C тээврийн хэрэгсэл","Явган хүний замаар явж буй D явган зорчигч","Зүүн талаас баруун эргэх гэж буй E тээврийн хэрэгсэл"],"a":"1, 2","imgs":["q816.png"],"t":"사진형","e":"Хөдөлгөөн ихтэй туслах замаар явах гэж буй жолооч тээврийн хэрэгсэлд халхлагдсан явган зорчигч буюу ачаа ачиж, буулгах нь байнга тохиолддог шуудан хүргэлтийн болон ачааны тээврийн хэрэгслийн орчимд аюулын хүчин зүйл байгаа эсэхийг анхааралтай ажиглах шаардлагатай."},{"n":817,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Уулзварт түрүүлж орох нь хамгийн чухал.","Зөвхөн урд талаа харж жолоодно.","1-р эгнээнд явж буй ачааны автомашин уулзварт орох үедээ 2-р эгнээ рүү эгнээ сольж болзошгүй тул бэлтгэлтэй байна.","Зүүн талаас эргэж буй тээврийн хэрэгсэл болон баруун замаас орж ирэх тээврийн хэрэгсэлд анхаарч жолоодно.","Орж ирж буй тээврийн хэрэгсэл эргэж буй тээврийн хэрэгслээс давуу эрхтэй гэж бодон жолоодно."],"a":"3, 4","imgs":["img_0111.jpg"],"t":"사진형","e":"Тойрог уулзварт орох гэж байгаа тохиолдолд удаан явах буюу түр зогсох ёстой бөгөөд тойрч буй тээврийн хэрэгсэлд зам тавьж өгөх ёстой. Мөн цагаан ачааны автомашин миний урд шургалж орох тохиолдолд бэлтгэж хурдаа бууруулан ачааны автомашинаас аюулгүй зайг барих ёстой."},{"n":818,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Чигээрээ явах дохио хүлээж зогссон автомашинуудын дундаас гэнэт зам хөндлөн гарах гэж буй явган зорчигчид анхаарна.","Урд талын зүүн эргэх гэрэл солигдохоос өмнө өнгөрөхийн тулд хурдан орно.","Зориулалтын бус газраар зам хөндлөн гарч буй явган зорчигчийг айлгахын тулд харин ч хурдаа нэмэгдүүлнэ.","Зам хөндлөн гарах гэж буй явган зорчигчийг хамгаалахын тулд аюулын дохионы гэрэл анивчуулж хурдаа сааруулна.","Явган зорчигчтой мөргөлдөхөөс зайлсхийхийн тулд 1-р эгнээ рүү огцом эгнээ солино."],"a":"1, 4","imgs":["img_0112.jpg"],"t":"사진형","e":"Зөвшөөрөлгүй газраар хөндлөн гарч буй явган зорчигч байсан ч жолооч хөндлөн гарч буй явган зорчигчийг аюулгүй гарахад анхаарал тавих ёстой."},{"n":819,"b":"Баруун тийш явах ёстой байсан боловч замаа андуурчээ. Энэ үед хамгийн аюулгүй жолоодох арга аль 2 вэ?","c":["Аюулгүйн бүс рүү орж, аюулын дохионы гэрлийг ажиллуулсны дараа баруун тийш орно.","Баруун чиг заах дохиог ажиллуулан аюулгүйн бүс рүү орж, дараа нь баруун тийш орно.","Хурдан хурдаа нэмэгдүүлэн баруун тийш орно.","Дэгү чиглэл рүү үргэлжлүүлэн явна","Дараагийн уулзах гарц эсвэл салаа замыг ашиглана."],"a":"4, 5","imgs":["q819.png"],"t":"사진형","e":"Зарим жолооч хурдны замын орох гарах зангилаа буюу салаа зангилааны яг өмнө аль тийш орохоо шийдэхийн тулд огцом хурдаа сааруулах буюу орохыг хориглосон аюулгүйн бүсэд орж хүлээгээд хүчээр ордог. Мөн орох замыг өнгөрөөсөн тохиолдолд аюулгүйн бүс буюу замын захад зогсоод ухрах үйлдэл хийдэг. Ийм үйлдэл нь бусад жолоочийн урьдчилан таамаглах боломжгүй үйлдэл бөгөөд ослын шууд шалтгаан болж болзошгүй тул орохоос татгалзаж дараагийн салаа зангилаа буюу орох гарах зангилааг ашиглан аюулгүй байдлыг хангах ёстой. Хамгийн аюулгүй жолоодлогын арга нь хөдлөхөөс очих газар хүртэлх явах маршрутыг урьдчилан судлах хандлагыг эзэмших явдал юм."},{"n":820,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Тээврийн хэрэгсэл хоорондын зайг ердийнхөөс хангалттай их байлгана.","Хонгилд орохоос өмнө тоормосыг маш хүчтэй дарж урьдчилан хурдаа бууруулна.","Хонгил дотор цас овоороогүй тул хурдаа нэмэгдүүлэн явна.","Цастай зам маш халтиргаатай тул урд автомашины дугуйн мөрийг даган явна.","Хальтрахаас сэргийлэхийн тулд арааг сул байрлалд шилжүүлэн явна."],"a":"1, 4","imgs":["img_0113.jpg"],"t":"사진형","e":"Цастай замд аюулгүй явахын тулд огцом тоормослох, огцом хурдлах, жолоог огцом эргүүлэхээс зайлсхийж хангалттай аюулгүй зайг хангах ёстой. Мөн гулсахаас сэргийлэхийн тулд урд тээврийн хэрэгслийн дугуйны мөрөөр явах нь зүйтэй бөгөөд аль болох доод арааг ашиглана. Ялангуяа хонгилын орох, гарах хэсгийг багтаасан хонгилын хэсэг нь мөстөх магадлал өндөр тул хурдаа сааруулж явах ёстой."},{"n":821,"b":"Аж үйлдвэрийн хот, Терминал чиглэл рүү зүүн эргэх гэж байна. Хамгийн аюулгүй жолоодох арга болох 2-ыг сонгоно уу.","c":["Зам заагчийн зааврын дагуу урд талд зүүн эргэх шаардлагатай тул урьдчилан 1-р эгнээ рүү эгнээ солино.","1, 2-р эгнээ газар доорх зам руу ордог тул 3-р эгнээний арын автомашиныг эхэлж өнгөрүүлж, аюулгүй байдлаа хангаад 3-р эгнээ рүү эгнээ солино.","Замын чиглэлээ зөв олохын тулд зам заагчийг дахин дахин ажиллуулна.","3-р эгнээнд арын автомашин байгаа ч миний автомашин урд байгаа тул чиг заах дохио өгөхгүйгээр урдуур нь хурдан эгнээ солино.","Урд автомашин огцом тоормослох нөхцөлд бэлэн байхын тулд аюулгүйн зай барин явна."],"a":"2, 5","imgs":["q821.png"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 28]. Явж байх үед навигацийг ажиллуулбал анхаарал сарниж ослын эрсдэл нэмэгддэг тул үүнээс татгалзах ёстой. Мөн жолоодож байхдаа зөвхөн навигацид найдалгүй замын тэмдгийг хамт шалгах дадал хэвшүүлэх нь аюулгүй жолоодлогод тустай."},{"n":822,"b":"Дараах нөхцөлд осол гарах магадлал хамгийн өндөр 2 нөхцөл аль вэ?","c":["Урд талд явж буй автомашин","Зүүн тийш орохын тулд гэнэт эргэж буй цахилгаан скутер","Баруун талаас хөдөлж эхлэх гэж буй ачааны автомашин","Баруун талд ажиллаж байгаа хүн","Урд зүүн талын хоёр дугуйт тээврийн хэрэгсэл"],"a":"2, 3","imgs":["q822.png"],"t":"사진형","e":"Тариалангийн ид ажлын үеэр хотын захын бүсийн замд хөдөө аж ахуйн машин, тээврийн хэрэгсэл, явган зорчигчийн хөдөлгөөн эрчимждэг бөгөөд ялангуяа тариалангийн талбайн замын орцтой холбогдсон замд санаанд оромгүй орж ирэх буюу замын хөдөлгөөний дүрэм мөрдөөгүй гэнэтийн үйлдэл гарах магадлал өндөр тул урдаа ажиглах болон хамгаалалтын жолоодлого шаардлагатай."},{"n":823,"b":"Дараах зам дээр хамгийн аюулгүй зорчих арга аль 2 вэ?","c":["Явган зорчигч түрүүлж зорчих зам нь зөвхөн хүүхдэд хамаарах тул насанд хүрсэн явган зорчигчийн ойролцоо явна.","Явган зорчигчоос аюулгүйн зай барин явна.","Зэрэгцэн явж буй явган зорчигчдыг нэг эгнээнд явуулахын тулд дуут дохио өгнө.","Явган зорчигчийн хөдөлгөөнд саад учруулахгүй байхын тулд удаан явах эсвэл түр зогсоно.","Явган зорчигчийн хөдөлгөөнд саад учруулахгүй бол цагт 20 км-ээс дээш хурдтай явж болно."],"a":"2, 4","imgs":["q823.png"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл. Явган зорчигчийн давуу эрхтэй замд явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явах ёстой бөгөөд явган зорчигчийн хөдөлгөөнд саад болох үед удаан явах буюу түр зогсож явган зорчигчийг аюулгүй явах боломжоор хангах ёстой."},{"n":824,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Эгнээ сольж буй автомашинаас зайлсхийхийн тулд 3-р эгнээ рүү огцом эгнээ солино.","1-р эгнээнд явж буй автомашиныг оруулахгүйн тулд хурдаа нэмэгдүүлэн жолоодно.","Дуут дохио болон урд гэрлийн холын тусгалыг ашиглан эгнээ солихыг саатуулна.","Хурдаа сааруулж эгнээ сольж буй автомашинд зам тавьж өгнө.","Бороотой замд тоормослох зай ердийнхөөс урт болдог тул урьдчилан хурдаа сааруулна."],"a":"4, 5","imgs":["img_0114.jpg"],"t":"사진형","e":"Тээврийн хэрэгслийн түгжрэлийн нөхцөлд үүнээс зайлсхийхийн тулд замаа өөрчлөх явдал байнга гарч болзошгүй тул үргэлж урдаа ажиглаж жолоодох ёстой. Мөн бороотой замд тоормосны зам ердийнхөөс урт болдог тул хангалттай аюулгүй зай болон хурд сааруулалт шаардлагатай."},{"n":825,"b":"Осол гарах магадлал хамгийн өндөр нөхцөл аль 2 вэ?","c":["Явган хүний замын баруун талаар явж буй унадаг дугуй","Барилга руу орохын тулд зүүн эргэхээр хүлээж буй автомашин","Замын зүүн талаас баруун тийш явж буй автомашин","Эсрэг талын сул талбайд зогсоолд тавьсан автомашин","Замын тусгал толинд харагдаж буй автомашин"],"a":"1, 2","imgs":["q825.png"],"t":"사진형","e":"Орох, гарах хаалганы орчимд ялангуяа явган зорчигч болон унадаг дугуй гэнэт орж ирж болзошгүй тул жолооч удаан явж анхаарах ёстой. Мөн барилга руу орохын тулд зүүн тийш эргэхээр хүлээж буй автомашин нь орж гарч буй тээврийн хэрэгсэл, явган зорчигч, унадаг дугуй зэрэгтэй мөргөлдөх эрсдэл их тул ослын магадлал өндөр. Харин эгнээгээ дагаж хэвийн явж буй тээврийн хэрэгсэл (③), зогссон тээврийн хэрэгсэл (④), толинд тусгагдсан тээврийн хэрэгсэл (⑤) нь харьцангуй ослын эрсдэл бага. Иймд осол гарах магадлал хамгийн өндөр нь ① болон ② юм. Зогсоол зэрэг газраас зам руу орохын өмнө заавал зүүн, баруун талаа ажиглаж явган зорчигч болон бусад тээврийн хэрэгслийн хөдөлгөөний байдлыг шалгах ёстой."},{"n":826,"b":"Дараах нөхцөлд хамгийн зөв жолоодох арга аль 2 вэ?","c":["Өөдөөс ирж буй хүргэлтийн автомашинд зам тавьж өгнө.","Суудлын автомашины жолооч давуу эрхтэй тул шууд явна.","Холын гэрлийг дахин дахин асааж, эсрэг жолоочийг явах боломжгүй болгоно.","Түр зогссон болон зогсоолд тавьсан автомашинаас буух гэж буй хүнд анхаарна.","Зогсож, эсрэг жолооч зам тавьж өгөх хүртэл хүлээнэ."],"a":"1, 4","imgs":["img_0115.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 20 дугаар зүйл (Зам тавьж өгөх үүрэг) ① Бүх тээврийн хэрэгслийн (тусгай зориулалтын тээврийн хэрэгслээс бусад) жолооч ард нь явж буй тээврийн хэрэгслээс удаан хурдтай явах тохиолдолд замын баруун захад шилжин зам тавьж өгөх ёстой. Гэхдээ хөдөлгөөний ангилал тогтоосон замын тохиолдолд энэ нь хамаарахгүй. ② Нарийн замд тусгай зориулалтын тээврийн хэрэгслээс бусад автомашин бие биенийхээ эсрэг явах үед дараах заалтын ангиллын дагуух автомашин замын баруун захад шилжин зам тавьж өгөх ёстой. 1. Налуу нарийн замд автомашин бие биенийхээ эсрэг явах тохиолдолд өгсөж буй автомашин 2. Налуу нарийн замаас бусад нарийн замд хүн суулгасан буюу ачаа ачсан автомашин болон хамт явагчгүй бөгөөд ачаа ачаагүй автомашин бие биенийхээ эсрэг явах тохиолдолд хамт явагчгүй бөгөөд ачаа ачаагүй автомашин"},{"n":827,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Цагаан автомашины урд тоормослон, огцом эгнээ сольсонд нь эсэргүүцлээ илэрхийлнэ.","Хурдаа сааруулж, цагаан автомашин эгнээ солих боломжтой байхаар аюулгүйн зай барина.","Арын мөргөлдөөнөөс зайлсхийхийн тулд 4-р эгнээ рүү эгнээ солино.","Огцом хурдлан, цагаан автомашиныг араас мөргөхөөс зайлсхийнэ.","Жолооны хүрдийг зүүн тийш эргүүлэн огцом тоормослоно."],"a":"2, 3","imgs":["img_0116.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 19 дүгээр зүйлийн 3 дахь хэсэг. Бүх тээврийн хэрэгслийн жолооч тээврийн хэрэгслийн замаа өөрчлөх тохиолдолд өөрчлөх гэж буй чиглэлээс ирж буй бусад тээврийн хэрэгслийн хэвийн хөдөлгөөнд саад учруулж болзошгүй үед замаа өөрчилж болохгүй. Нөгөө талаар орох, гарах зам зэрэгт замаа өөрчлөх үйлдэл байнга гарч болзошгүй тул хурдаа сааруулж аюулгүй байдалд анхаарах ёстой."},{"n":828,"b":"Хурдны замын амрах зогсоолд амарч, хурдны зам руу нийлэх гэж байна. Хамгийн аюулгүй жолоодох арга болох 2-ыг сонгоно уу.","c":["Түр зогссоны дараа явж буй тээврийн хэрэгсэл байхгүй үед зам руу нийлнэ.","Хурдаа нэмэгдүүлэн нэг дор 1-р эгнээ хүртэл хөндлөн гарна.","Хангалттай хурд авч, зүүн талыг шалгасны дараа нийлнэ.","Замын захаар үргэлжлүүлэн явна.","Бусад тээврийн хэрэгслийн хөдөлгөөнд саад учруулахгүй байна."],"a":"3, 5","imgs":["q828.png"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 65 дугаар зүйл. Хурдны замд орох үед автомашины (тусгай зориулалтын тээврийн хэрэгслээс бусад) жолооч тухайн хурдны замаар явж буй бусад автомашины хөдөлгөөнд саад учруулж болохгүй. Мөн хурдны замаар явж буй тээврийн хэрэгслийн хурд маш өндөр тул хангалттай хурдлан хурдны замд орох ёстой."},{"n":829,"b":"Дараах нөхцөлд хамгийн зохистой жолоодох арга аль 2 вэ?","c":["1-р эгнээ рүү эгнээ сольж хурдан явна.","Гэрлийн төхөөрөмжөө ажиллуулж, өөрийн автомашины байршлыг бусад жолоочид мэдэгдэнэ.","Замын гадаргуу нойтон байгаа тул хурдаа сааруулж удаан явна.","Урд автомашины хурдыг даган зөвхөн урд автомашиныг харж явна.","Замын зах рүү эгнээ сольж, урд байгаа автомашинуудаас түрүүлнэ."],"a":"2, 3","imgs":["img_0117.jpg"],"t":"사진형","e":"Аюулыг урьдчилан таамаглах. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйл. 2 дахь хэсэг. Бороо, манан, цас зэргээс үүдсэн хүнд цаг агаарын үед 1 дэх хэсгээс үл хамааран дараах заалтын шалгуурын дагуу хурдаа сааруулж явах ёстой. Гэхдээ Цагдаагийн ерөнхий газрын дарга буюу аймаг, нийслэлийн Цагдаагийн газрын дарга Хавсралт 6-ийн Ⅰ. 1 дэх заалтын “к” дэд заалтын дагуух хувьсах хурдны хязгаарлалтын тэмдгээр дээд хурдыг тогтоосон тохиолдолд түүнийг дагах ёстой бөгөөд хувьсах хурдны хязгаарлалтын тэмдгээр тогтоосон дээд хурд болон бусад аюулгүйн тэмдэглэгээгээр тогтоосон дээд хурд өөр байвал хувьсах хурдны хязгаарлалтын тэмдгийг дагах ёстой. 1. Дээд хурдыг 100-ны 20 хувиар бууруулсан хурдаар явах ёстой тохиолдол а. Бороо орж замын гадаргуу норсон тохиолдолд б. Цас 20 миллиметрээс бага зузаантай хуримтлагдсан тохиолдолд 2. Дээд хурдыг 100-ны 50 хувиар бууруулсан хурдаар явах ёстой тохиолдол а. Аадар бороо, их цас, манан зэргээс үзэгдэх орчин 100 метрийн дотор байгаа тохиолдолд б. Замын гадаргуу мөстсөн тохиолдолд в. Цас 20 миллиметр буюу түүнээс их зузаантай хуримтлагдсан тохиолдолд. Манантай замаар явах тохиолдолд Замын хөдөлгөөний тухай хууль тогтоомжийн дагуу хурдаа сааруулах бөгөөд замын гадаргуу чийг ихтэй байдалтай тул тоормослоход шаардагдах зай цэлмэг өдрийнхөөс урт болно. Иймд жолооч огцом тоормослох нөхцөл байдал үүсгэхгүй байх нь чухал. Энэ үед зарим жолооч урдах тээврийн хэрэгсэл харагдахгүй бол тавгүйрхэх хандлага гардаг бөгөөд хурдан явж буй урдах автомашин байсан ч тухайн автомашиныг хараад аюулгүй зай хангалгүй явах үйлдэл гардаг. Манантай замд аюулгүй жолоодох арга нь үзэгдэх орчин богино тул урдах тээврийн хэрэгсэл харагдахгүй байсан ч хурд сааруулах шалгуурыг дагаж мөрдөж, тохиолдлоос шалтгаалан хуулиар тогтоосон хурд сааруулах шалгуураас ч илүү хурдаа бууруулах хандлага гэж хэлж болно. Мөн бусад жолооч миний оршихуйг таньж чадахуйц гэрлийн төхөөрөмжийг ажиллуулах аргыг ч ашиглаж болно."},{"n":830,"b":"Дараах нөхцөлд хамгийн зөв жолоодох арга аль 2 вэ?","c":["Цас их овоороогүй тул ердийнхөөрөө жолоодно.","Ачааны автомашин цастай замд халтирч эргэж болзошгүй тул бэлтгэлтэй байна.","Хамгийн дээд хурдыг 10 хувиар бууруулсан хурдтай явна.","Аюулын дохионы гэрлийг анивчуулан удаан явна.","Зигзаг хөдөлгөөнөөр хурдаа бууруулна."],"a":"2, 4","imgs":["q830.png"],"t":"사진형","e":"Цаг агаарын нөхцөл байдлаас шалтгаалан хурд сааруулах журмыг хэрэглэнэ. Дээд хурдыг 100-ны 20 хувиар бууруулсан хурдаар явах ёстой тохиолдол нь бороо орж замын гадаргуу норсон тохиолдол, цас 20 миллиметрээс бага зузаантай хуримтлагдсан тохиолдол бөгөөд дээд хурдыг 100-ны 50 хувиар бууруулсан хурдаар явах ёстой тохиолдол нь аадар бороо, их цас, манан зэргээс үзэгдэх орчин 100 метрийн дотор байгаа тохиолдол, замын гадаргуу мөстсөн тохиолдол, цас 20 миллиметр буюу түүнээс их зузаантай хуримтлагдсан тохиолдол юм (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйлийн 2 дахь хэсэг)."},{"n":831,"b":"Дараахтай адил гал гарсан хэсгээр нэвтрэн өнгөрөх үед зөв жолоодох арга аль 2 вэ?","c":["Зам дээр гацаж болзошгүй тул хэт хурдтай байсан ч хурдан гарч явна.","Урд талын үзэгдэх орчин муу тул аюулын дохионы гэрлийг асааж жолоодно.","Радио зэрэг хэрэгслээр тойруу замын талаарх мэдээллийг авна.","Цэвэр агаар оруулахын тулд агааржуулагчийг гадна агаарын горимд тохируулна.","Замын захад автомашинаа зогсоолд тавиад баруун талын ха мгаалалтын хашлагыг давж замаас гарна."],"a":"2, 3","imgs":["img_0118.jpg"],"t":"사진형","e":"Түймрийн бүсээр явах нь аюултай тул тойрсон ч замын хөдөлгөөний мэдээлэл зэргийг ашиглан тойруу замыг сонгох нь аюулгүй. Мөн түймрийн утаа зэргээс үзэгдэх орчин хязгаарлагддаг тул ослын дохионы гэрлээ асааж удаан явж тухайн хэсгээс гарах ёстой."},{"n":832,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Удаан явж буй чиргүүлийг дуут дохиог дугаргаж хурдлуулахыг шаардана.","1-р эгнээг ашиглан урд байгаа чиргүүлийг аюулгүйгээр гүйцэж түрүүлнэ.","Эгнээ солихдоо урьдчилан чиг заах дохиог ажиллуулна.","Зорчих эгнээ болох 1-р эгнээнд орж тогтмол хурдтай явна.","1-р эгнээнд хамгийн дээд хурдны хязгаар байдаггүй тул хурдаа нэмэгдүүлэн явна."],"a":"2, 3","imgs":["img_0119.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 2 дугаар зүйл (Тодорхойлолт) 29. “Гүйцэж түрүүлэх” гэж тээврийн хэрэгслийн жолооч урд явж буй өөр тээврийн хэрэгслийн хажуугаар өнгөрч тухайн тээврийн хэрэгслийн урд гарахыг хэлнэ. Замын хөдөлгөөний тухай хуулийн 60 дугаар зүйл. Автомашины жолооч хурдны замд өөр тээврийн хэрэгслийг гүйцэж түрүүлэхдээ чиг заах дохио, гэрэл буюу дуут дохио ашиглан тогтоосон эгнээгээр аюулгүй явахаар заасан. Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 9] Эгнээгээр явах тээврийн хэрэгслийн шалгуурын дагуу гүйцэж түрүүлэх гэж буй суудлын автомашин 1 дүгээр эгнээ болон заасан эгнээний зүүн хажуугийн эгнээгээр явж болно. Мөн гүйцэж түрүүлэх тохиолдолд ч тогтоосон хурдыг дагаж мөрдөх ёстой."},{"n":833,"b":"Дараах нөхцөлд гарч болзошгүй аюул аль 2 вэ?","c":["Урд талд зам засвар явагдаж байгааг анхааруулсан ачааны автомашин зогссон байж болзошгүй.","2-р эгнээнд байгаа автобус аюулгүй байдлын үүднээс хурдаа сааруулж болзошгүй.","4-р эгнээ рүү эгнээ сольсон автобус үргэлжлүүлэн явж болзошгүй.","1-р эгнээнд байгаа автомашин хурдаа нэмэгдүүлэн явж болзошгүй.","Өөр автомашин миний урдуур гүйцэж түрүүлж болзошгүй."],"a":"1, 5","imgs":["img_0120.jpg"],"t":"사진형","e":"Үргэлж үл үзэгдэх газарт аюул байна гэж бодох хандлага шаардлагатай. Жолоодож байх үед нүдний өмнөх аюул төдийгүй алс байгаа аюулыг ч урьдчилан таамаглах ёстой бөгөөд аюулд бэлтгэж чадахуйц аюулгүй хурд болон аюулгүй зайг барих нь чухал."},{"n":834,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Эгнээ солихыг хориглосон шугамтай эсэхээс үл хамааран баруун эгнээ рүү эгнээ солино.","Баруун чиг заах дохиог асааж, ойр орчмын жолооч нарт мэдэгдэнэ.","Огцом хурдлан баруун эгнээ рүү эгнээ солино.","Гарах замын яг өмнө хурдаа сааруулж эгнээ солихыг оролдоно.","Бусад тээврийн хэрэгслийн хөдөлгөөнд саад учруулах эрсдэлтэй бол эгнээ сольж болохгүй."],"a":"2, 5","imgs":["img_0121.jpg"],"t":"사진형","e":"Замаа өөрчлөх гэж байгаа тохиолдолд замаа өөрчлөх боломжтой тэмдэглэгээтэй газарт гараар, чиг заах дохиогоор буюу гэрлээр тухайн үйлдэл дуустал ойр орчмын жолооч нарт идэвхтэй мэдэгдэх ёстой бөгөөд бусад тээврийн хэрэгслийн хэвийн хөдөлгөөнд саад учруулж болзошгүй үед замаа өөрчилж болохгүй. Замын хөдөлгөөний тухай хуулийн 19 дүгээр зүйл, 38 дугаар зүйл - Бүх тээврийн хэрэгслийн жолооч тээврийн хэрэгслийн замаа өөрчлөх тохиолдолд өөрчлөх гэж буй чиглэлээс ирж буй бусад тээврийн хэрэгслийн хэвийн хөдөлгөөнд саад учруулж болзошгүй үед замаа өөрчилж болохгүй. - Бүх тээврийн хэрэгслийн жолооч зүүн тийш эргэх, баруун тийш эргэх, хөндлөн гарах, буцаж эргэх, удаан явах, зогсох буюу ухрах, эсвэл нэг чиглэлд явж байхдаа замаа өөрчлөх тохиолдолд гараар, чиг заах дохиогоор буюу гэрлээр тухайн үйлдэл дуустал дохио өгөх ёстой."},{"n":835,"b":"Хурдны замаар явж буй дараах тээврийн хэрэгслээс зориулалтын эгнээний журам зөрчсөн 2 тээврийн хэрэгсэл аль нь вэ?","c":["A (Гүйцэж түрүүлж буй суудлын автомашин)","B (36 хүний суудалтай том оврын олон суудалт автомашин)","C (1 тонн ачааны автомашин)","D (26 хүний суудалтай том оврын олон суудалт автомашин)","E (Явж буй суудлын автомашин)"],"a":"2, 3","imgs":["q835.png"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн [Хавсралт 9] Эгнээгээр явах тээврийн хэрэгслийн шалгуур. Нэг чиглэлд 2 эгнээтэй хурдны замд 1 дүгээр эгнээгээр гүйцэж түрүүлэх гэж буй бүх автомашин, 2 дугаар эгнээгээр бүх автомашин явах боломжтой. Нэг чиглэлд 3 буюу түүнээс олон эгнээтэй тохиолдолд 1 дүгээр эгнээгээр гүйцэж түрүүлэх гэж буй суудлын автомашин болон бага, жижиг, дунд оврын олон суудалт автомашин, зүүн талын эгнээгээр суудлын автомашин болон бага, жижиг, дунд оврын олон суудалт автомашин, баруун талын эгнээгээр том оврын олон суудалт автомашин, ачааны автомашин, тусгай автомашин, хуулийн 2 дугаар зүйлийн 18 дахь заалтын “б” дэд заалтын дагуух барилгын машин механизм явах боломжтой. Зүүн талын эгнээ гэж хурдны замын тохиолдолд 1 дүгээр эгнээг хассан эгнээг хоёр хувааж түүнээс 1 дүгээр эгнээнд ойр байгаа эгнээг хэлэх бөгөөд (гэхдээ 1 дүгээр эгнээг хассан эгнээний тоо сондгой бол түүний голын эгнээг хасна), баруун талын эгнээ гэж 1 дүгээр эгнээ болон зүүн талын эгнээг хассан үлдсэн эгнээг хэлнэ."},{"n":836,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Борооны улмаас замын гадаргуу нойтон тул цагт 80 км-ээс ихгүй хурдтай явна.","Баруун талын том оврын автобус ус тогтсон хэсгээр өнгөрөх үед ус цацагдан үзэгдэх орчныг хааж болзошгүйг анхаарч жолоодно.","Арын жолоочид өөрийн байршлыг мэдэгдэхийн тулд аюулын дохионы гэрлийг асаан явна.","Баруун урд талын автомашин эгнээ сольж болзошгүй тул 1-р эгнээ рүү эгнээ солиод үргэлжлүүлэн явна.","Ус тогтсон хэсгээс ус гэнэт цацагдаж үзэгдэх орчин хязгаарлагдвал аюулгүй байдлын үүднээс огцом зогсоно."],"a":"2, 3","imgs":["img_0122.jpg"],"t":"사진형","e":"① Нэг чиглэлд 2 буюу түүнээс олон эгнээтэй хурдны замд (тусгай тэмдэггүй) суудлын автомашины дээд хурд нь цагт 100 километр боловч бороо, манан, цас зэргээс үүдсэн хүнд цаг агаарын үед дараах шалгуурын дагуу хурдаа сааруулж явах ёстой (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн 19 дүгээр зүйл)."},{"n":837,"b":"Дараах цастай замын хөдөлгөөний нөхцөлд аюулгүй жолоодох арга аль 2 вэ?","c":["Их цасны улмаас эгнээ харагдахгүй бол урд автомашины дугуйн мөрийг даган явна.","Цастай болон мөстсөн замд тоормослох зай богиносдог тул ердийнхөөс илүү аюулгүйн зай барина.","Их цас орох үед хонгилын орох, гарах хэсэг байнга мөстдөг бүс тул халтиргаанаас үүдэх цуваа арын мөргөлдөөнөөс урьдчилан сэргийлнэ.","Зам мөстсөн үед хамгийн дээд хурдыг 20 хувиар бууруулна.","Хонгилоос гарсны дараа харанхуйд дасан зохицох үзэгдлийн улмаас түр хугацаанд хараа алдагдаж болзошгүй тул анхаарна."],"a":"1, 3","imgs":["q837.png"],"t":"사진형","e":"② Цастай зам буюу бороо, манантай үед тоормосны зам урт болдог тул ердийнхөөс аюулгүй зайг илүү барих ёстой. ④ Замын гадаргуу мөстсөн замд дээд хурдыг 100-ны 50 хувиар бууруулах ёстой. ⑤ Их цастай үед хонгилоор нэвтрэх тохиолдолд харанхуй газраас гэрэлтэй газар руу гэнэт гарснаас гэрэлд дасах үзэгдлээс болж түр зуур хараа алдаж болзошгүй."},{"n":838,"b":"Дараах замын нөхцөлд хамгийн аюулгүй жолоодох арга аль 2 вэ?","c":["Хонгил дотор цас овоороогүй тул хамгийн дээд хурдыг бууруулах шаардлагагүй.","Хонгилын гадна гэнэтийн нөхцөл байдал үүссэнийг мэдэж болох тул түүнд бэлтгэлтэй байна.","Урд автомашинтай арын мөргөлдөөнөөс зайлсхийхийн тулд 3-р эгнээ рүү огцом эгнээ солино.","Хонгилоор гарах үед гэрэлд дасан зохицох үзэгдлийн улмаас түр хугацаанд хараа алдагдаж болзошгүй тул анхаарна.","Хонгилын дотор болон гаднах замын орчны гэнэтийн өөрчлөлтөд урьдчилан бэлтгэлтэй байна."],"a":"2, 5","imgs":["q838.png"],"t":"사진형","e":"① Хонгилын дотор цас хуримтлагдаагүй байсан ч мөстсөн зам үүсэж болзошгүй зэргийг харгалзан дээд хурдыг бууруулж явах ёстой. ③ Хонгил доторх үргэлжилсэн шугамтай хэсэгт эгнээ солих боломжгүй бөгөөд өвлийн улиралд хурдны замын хонгилын орох, гарах хэсэгт гулсаж осолдох явдал байнга гарч болзошгүй тул урдаа ажиглах нь чухал. ④ Шөнийн жолоодлогын тохиолдолд хонгилын дотор доторх гэрэлтүүлгээс болж гэрэлтэй, хонгилын гадна харанхуй тул хонгилын гадна гарах тохиолдолд харанхуйд дасах үзэгдлээс болж түр зуур хараа алдаж болзошгүй."},{"n":839,"b":"Дараах замаар зорчих гэж байгаа үед хамгийн зөв жолоодох арга 2-ыг сонгоно уу.","c":["Унадаг дугуйд хүрэхээс өмнө түр зогсоно.","Явган хүний гарцаар гарахдаа зогсох шугамын өмнө түр зогсоно.","Арын автомашинтай зай ойрхон тул хурдлан зайгаа холдуулна.","Явган хүний гарцан дээр хүн байхгүй тул шууд өнгөрнө.","Дуут дохиог дахин дахин өгч, удаан явж өнгөрнө."],"a":"1, 2","imgs":["q839.png"],"t":"사진형","e":"Аюулыг урьдчилан таамаглах. Хүүхдийн хамгаалалтын бүсэд зогсох болон зогсоолд тавих журам зөрчсөн автомашинууд ажиглагдаж байна. Хүүхдийн хамгаалалтын бүсээр явж буй жолооч хүүхдийн биеийн онцлогоос “намхан өндөр”-өөс болж зогсох болон зогсоолд тавих журам зөрчсөн автомашинд халхлагдан харагдахгүй байдгийг үргэлж санаж байх ёстой. Асуултын зурагт зүүн талын саарал автомашины урдуур унадаг дугуй зорчих хэсэг рүү хөндлөн гарах гэж буй нөхцөл байдал юм. Ийм үед явган хүний гарц биш байсан ч зогсох ёстой. Замын хөдөлгөөний тухай хуулийн 12 дугаар зүйлийн 3 дахь хэсэг. Тээврийн хэрэгсэл буюу трамвайн жолооч хүүхдийн хамгаалалтын бүсэд 1 дэх хэсгийн дагуух арга хэмжээг дагаж мөрдөж, хүүхдийн аюулгүй байдалд анхаарч явах ёстой. Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 7 дахь хэсэг. Бүх тээврийн хэрэгсэл буюу трамвайн жолооч 12 дугаар зүйлийн 1 дэх хэсэгт заасан хүүхдийн хамгаалалтын бүсэд байрлуулсан явган хүний гарцуудаас гэрлэн дохио суурилуулаагүй явган хүний гарцын өмнө (зогсох шугам байгаа бол тухайн зогсох шугамыг хэлнэ) явган зорчигч гарч байгаа эсэхээс үл хамааран түр зогсох ёстой."},{"n":840,"b":"Замын хөдөлгөөний тухай хуулийн дагуу дараах замын хөдөлгөөний аюулгүй байдлын байгууламжийн талаар зөв тайлбар аль 2 вэ?","c":["Хурдны хязгаар цагт 50 км бөгөөд хэтрүүлсэн тохиолдолд хяналт шалгалтад өртөж болно.","Урд талын гэрлэн дохио ногоон суман дохиотой үед л зүүн эргэж болно.","Бүх хүүхдийн хамгаалалтын бүсийн хурдны хязгаар цагт 50 км байдаг.","Гэрлэн дохионы дараалал нь улаан – шар – ногоон – ногоон суман дохио юм.","Урд талын гэрлэн дохио ногоон байвал эсрэг урсгалд автомашин байхгүй үед зүүн эргэж болно."],"a":"1, 5","imgs":["q840.png"],"t":"사진형","e":"Цуглуулсан замын хөдөлгөөний мэдээлэл нь дараагийн нөхцөл байдлыг урьдчилан таамаглах үндсэн мэдээлэл болдог. Зам дээр зогссон зүйл ч, хөдөлж буй зүйл ч байдаг. Хөдөлж буй зүйл хаашаа хөдлөх, зогссон зүйл үргэлжлүүлэн зогсох эсэхийг урьдчилан таамаглах ёстой. Мөн замын зарчим болон энгийн ойлголтыг аюулгүй байдлын төлөө шаардлагатай хэмжээгээр хэрэгжүүлэх нь чухал. Хамгаалалтгүй зүүн эргэлт нь нэрнийхээ дагуу “хамгаалалт хүлээж аваагүй зүүн эргэлт” тул жолоочийн шийдвэр маш чухал. Өөрөөр хэлбэл эсрэг талын эгнээний тээврийн хэрэгсэл миний бодсоноос хамаагүй хурдан ойртон ирдэг тул тээврийн хэрэгслүүдийг бүгдийг нь өнгөрөөсний дараа аюулгүй байдлыг хангаад анхааралтайгаар зүүн тийш эргэж болно. Тухайн зураг нь хамгаалалтгүй хавсарсан зүүн эргэлт бөгөөд тээврийн хэрэгслийн шулуун явах дохионы үед зүүн тийш эргэж болох ба мөн ногоон сумтай гэрэл асах үед зүүн тийш эргэж болно."},{"n":841,"b":"Хүүхдийн хамгаалалтын бүсээр аюулгүй зорчих жолоодох арга ал ь 2 вэ?","c":["Урд автомашиныг даган удаан явж А явган хүний гарцаар гарна.","Арын автомашинтай мөргөлдөхөөс зайлсхийхийн тулд хурдаа хадгалж урд автомашиныг дагана.","А явган хүний гарцын зогсох шугамын өмнө түр зогсоод гарна.","В явган хүний гарц дээр явган зорчигч байхгүй тул удаан явж гарна.","В явган хүний гарцын өмнө түр зогсоод гарна."],"a":"3, 5","imgs":["q841.png"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 7 дахь хэсэг. Бүх тээврийн хэрэгсэл буюу трамвайн жолооч мөн хуулийн 12 дугаар зүйлийн 1 дэх хэсэгт заасан хүүхдийн хамгаалалтын бүс дотор байгуулсан явган хүний гарцаас гэрлэн дохио суурилуулаагүй явган хүний гарцын өмнө (зогсох шугам тавигдсан тохиолдолд тухайн зогсох шугамыг хэлнэ) явган зорчигч хөндлөн гарч байгаа эсэхээс үл хамааран түр зогсох ёстой."},{"n":842,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Явган хүний туслах сандалтай тэргэнцэртэй аюулгүй зай барихын тулд төв шугам давж зүүн талаар явна.","Явган хүний туслах сандалтай тэргэнцэрт хүрэхээс өмнө хурдаа сааруулж хөдөлгөөнийг нь ажиглана.","Явган хүний туслах сандалтай тэргэнцэр замын эгнээнд орохоос өмнө хурдлан өнгөрнө.","Явган хүний туслах сандалтай тэргэнцэр замын эгнээнд орохгүй байхаар дуут дохиог тасралтгүй өгнө.","Явган хүний туслах сандалтай тэргэнцэр зорчих хэсэг рүү орох гэж байгаа тул түр зогсож аюулгүй байдлыг хангана."],"a":"2, 5","imgs":["q842.jpg"],"t":"사진형","e":"Аюулыг урьдчилан таамаглах. Зураг дээрх нөхцөл нь цахилгаан тэргэнцэр ашиглаж буй ахмад настан зорчих хэсэгт орох гэж буй нөхцөл юм. Ийм үед олон жолооч цахилгаан тэргэнцрээс зайлсхийхийн тулд зүүн тийш шилжиж, төвийн шугам давж явах үйлдэл гаргадаг. Ийм үйлдэл нь Замын хөдөлгөөний тухай хуулийг зөрчсөн үйлдэл бөгөөд эсрэг чиглэлийн автомашинтай мөргөлдөх магадлал өндөр аюултай үйлдэл гэдгийг санах ёстой. Тиймээс жолооч цахилгаан тэргэнцэр буюу ахмад настан явган зорчигчийг олж харсан тохиолдолд баруун талаар явахаа хадгалж, тухайн цахилгаан тэргэнцэр буюу ахмад настан явган зорчигчид хүрэхээс өмнө хурдаа бууруулах ёстой бөгөөд тэдгээр нь ямар үйлдэл хийж байгааг ажиглах ёстой. Мөн зураг дээрх нөхцөлд цахилгаан тэргэнцэр зорчих хэсэгт орж хөндлөн гарах гэж буй нөхцөл тул хөндлөн гарах байгууламж байгаа эсэхээс үл хамааран түр зогсож явган зорчигчийг хамгаалах ёстой."},{"n":843,"b":"Дараах замын нөхцөлд хамгийн аюулгүй жолоодох арга аль 2 вэ?","c":["Хүүхдийн сургуулийн автобусны араас хүүхэд гэнэт гарч ирж болзошгүй тул анхаарна.","Урд талын гэрлэн дохиогүй явган хүний гарц дээр явган зорчигч байхгүй тул удаан явж өнгөрнө.","Баруун талд гүйж байгаа хүүхдүүд гэнэт явган хүний гарц руу орж ирж болзошгүй тул явган хүний гарцын өмнө түр зогсоно.","Энэ бүсэд зөвхөн хүүхдийн сургуулийн автобусанд түр зогсох болон зогсоол хийхийг зөвшөөрсөн байдаг.","Урд баруун талын хүүхдийн сургуулийн автобусанд хүүхдүүд сууж, бууж байгаа тул автобусны хажуугаар өнгөрөхөөс өмнө түр зогсоод өнгөрнө."],"a":"1, 3","imgs":["q843.png"],"t":"사진형","e":"② Жолооч хүүхдийн хамгаалалтын бүсэд байрлуулсан явган хүний гарцуудаас гэрлэн дохио суурилуулаагүй явган хүний гарцын өмнө (зогсох шугам байгаа бол тухайн зогсох шугамыг хэлнэ) явган зорчигч гарч байгаа эсэхээс үл хамааран түр зогсох ёстой (Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 7 дахь хэсэг). ④ Хүүхдийн хамгаалалтын бүсэд зогсоолд тавих, зогсохыг хориглоно (Замын хөдөлгөөний тухай хуулийн 32 дугаар зүйлийн 8 дахь хэсэг). ⑤ Хүүхдийн сургуулийн автобусны шар анивчдаг гэрлийг зам дээр зогсох гэж байх үед болон хөдлөхийн тулд хаалгаа хаасан үед ашигладаг. (Автомашин болон автомашины эд ангийн гүйцэтгэл, стандартын тухай дүрмийн 48 дугаар зүйлийн 4 дэх хэсэг)"},{"n":844,"b":"Дараах замын нөхцөлд хамгийн аюулгүй жолоодох үйлдэл аль 2 вэ?","c":["Уулзварт орохоос өмнө түр зогсоод өнгөрнө.","Дуут дохио ашиглан хурдаа нэмэгдүүлж өнгөрнө.","Цахилгаан хөдөлгөөнт хэрэгсэл унасан өндөр настай явган зорчигч автомашиныг өнгөрөхийг хүлээж байгаа тул хурдан уулзварыг нэвтэрнэ.","Түр зогссон болон зогсоолд тавьсан автомашинуудын дундаас хүүхэд гарч ирж болзошгүй тул анхаарна.","Чигээрээ явах автомашин давуу эрхтэй тул зүүн зах руу шахаж шууд өнгөрнө."],"a":"1, 4","imgs":["q844.png"],"t":"사진형","e":"Замыг зөвхөн автомашин төдийгүй хүүхэд, өндөр настан, сул дорой хүн, хөгжлийн бэрхшээлтэй хүн ч ашиглаж болно. Ийм хөдөлгөөний эмзэг оролцогчид замыг аюулгүй ашиглахын тулд бүх жолооч хөдөлгөөний эмзэг оролцогчийг хамгаалах идэвхтэй хандлагатай байх шаардлагатай. Иймд бүх тээврийн хэрэгслийн жолооч дараах заалтын аль нэгэнд хамаарах газарт явган зорчигчийн хажуугаар өнгөрөх тохиолдолд аюулгүй зай барьж удаан явах ёстой бөгөөд явган зорчигчийн хөдөлгөөнд саад болох үед удаан явах буюу түр зогсож явган зорчигчийг аюулгүй явах боломжоор хангах ёстой. 1. Явган хүний зам ба зорчих хэсэг нь тусгаарлагдаагүй замуудаас төвийн шугамгүй зам. 2. Явган зорчигчийн давуу эрхтэй зам. 3. Замаас өөр газар (Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 6 дахь хэсэг)"},{"n":845,"b":"Дараах замын нөхцөлд хамгийн аюулгүй жолоодох үйлдэл аль 2 вэ?","c":["Урд талын хүүхдийн сургуулийн автобус зогсож болзошгүй тул аюулгүйн зай барина.","Хурдаа бууруулбал арын автомашин мөргөж болзошгүй тул хүүхдийн сургуулийн автобусыг гүйцэж түрүүлнэ.","Зүүн талын хүүхэд явган хүний гарц руу орж болзошгүй тул хүүхдийн хөдөлгөөнийг ажиглана.","Урд зүүн талд түр зогссон болон зогсоолд тавьсан хоёр дугуйт тээврийн хэрэгсэлтэй мөргөлдөхөөс болгоомжлон, хүүхдийн сургуулийн автобусыг аажмаар гүйцэж түрүүлнэ.","Урд талын хүүхдийн сургуулийн автобусанд хүүхдүүд сууж, бууж байгаа тул аажмаар гүйцэж түрүүлэн явна."],"a":"1, 3","imgs":["q845.png"],"t":"사진형","e":"Хүүхдийн хамгаалалтын бүсэд үл үзэгдэх газраас аюул үүсэж болзошгүй тул аюулыг урьдчилан таамаглаж, урьдчилан хурдаа бууруулсан байдалтай явангаа хүүхдийн гэнэтийн үйлдэлд анхаарах ёстой. ⑤ Хүүхдийн сургуулийн автобусны шар анивчдаг гэрлийг зам дээр зогсох гэж байх үед болон хөдлөхийн тулд хаалгаа хаасан үед ашигладаг. (Автомашин болон автомашины эд ангийн чанар, стандартын тухай дүрмийн 48 дугаар зүйлийн 4 дэх хэсэг)"},{"n":846,"b":"Дараах замын нөхцөлд хамгийн аюулгүй жолоодох арга аль 2 вэ?","c":["Дуут дохиог тасралтгүй өгч аюулыг анхааруулан өнгөрнө.","Урд гэрлээр хүүхдийн сургуулийн автобусны жолоочид аюулыг анхааруулан өнгөрнө.","Баруун талд хууль бусаар түр зогссон болон зогсоолд тавьсан автомашины урдаас хүүхэд гэнэт гарч ирж болзошгүйг анхааран өнгөрнө.","Зүүн талын хүүхдийн сургуулийн автобусанд хүрэхээс өмнө түр зогсоод дараа нь удаан явж өнгөрнө.","Баруун талын сургуулийн автобус хүүхэд суулгах, буулгахын тулд зогссон байгаа тул хурдан гүйцэж түрүүлэн нарийн гудамжнаас гарна."],"a":"3, 4","imgs":["q846.png"],"t":"사진형","e":"Хүүхдийн сургуулийн автобус зам дээр зогсож, хүүхэд буюу нялх, балчир хүүхэд сууж, буулгаж байгааг илэрхийлэх анивчдаг гэрэл зэрэг төхөөрөмжийг ажиллуулж байх үед хүүхдийн сургуулийн автобус зогссон эгнээ болон тухайн эгнээний яг хажуугийн эгнээгээр явж буй тээврийн хэрэгслийн жолооч хүүхдийн сургуулийн автобуст хүрэхээс өмнө түр зогсож аюулгүй байдлыг шалгасны дараа удаан явах ёстой. Мөн төвийн шугам байрлуулаагүй зам болон нэг чиглэлд 1 эгнээтэй замд эсрэг чиглэлээс явж буй тээврийн хэрэгслийн жолооч ч хүүхдийн сургуулийн автобуст хүрэхээс өмнө түр зогсож аюулгүй байдлыг шалгасны дараа удаан явах ёстой. (Замын хөдөлгөөний тухай хуулийн 51 дүгээр зүйл)"},{"n":847,"b":"Дараах замын нөхцөлд хамгийн аюулгүй жолоодох арга аль 2 вэ?","c":["Явган хүний гарц дээр байгаа хүүхэдтэй мөргөлдөх эрсдэлгүй тул баруун эргэнэ.","Гэнэт гарч ирж болзошгүй хүүхдүүдийн хөдөлгөөнд бэлтгэлтэй байна.","Явган хүний гарц дээрх хүүхэд гарч дууссаны дараа баруун эргэнэ.","Хүүхдийг хурдан гаргахын тулд дуут дохио хэрэглэнэ.","Явган хүний гарц дээр зогсож, бусад хүүхэд гарч ирэхээс сэргийлнэ."],"a":"2, 3","imgs":["q847.png"],"t":"사진형","e":"Явган хүний гарцын явган зорчигчийн дохио бараг дуусах гэж байсан ч явган зорчигч, ялангуяа хүүхдүүд чиглэлээ өөрчилж буцах тохиолдол байдаг. Мөн анивчиж байх үед хүчээр хөндлөн гарах гэж буй явган зорчигчид байдаг тул тээврийн хэрэгслийн дохио ногоон байсан ч явган зорчигч байгаа эсэхийг шалгасны дараа явах нь аюулгүй. Уулзварт баруун тийш эргэсний дараа явган хүний гарцтай тулгарах тохиолдолд явган зорчигч байвал түр зогсоод явган зорчигч хөндлөн гарч дууссаны дараа өнгөрөх ёстой (Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйл)."},{"n":848,"b":"Дараах замын нөхцөлд хамгийн зөв жолоодох арга аль 2 вэ?","c":["Цагт 20 км-ээс ихгүй хурдтай явна.","Явган хүний гарцын өмнө удаан явж, шууд өнгөрнө.","Сургуулийн гол хаалганы өмнөөс зайлсхийж баруун замын хажууд түр зогсоно.","Хүүхдүүд зам руу гэнэт гарч ирж болзошгүй тул анхааран өнгөрнө.","Сургуулийн гол хаалганы өмнө автомашинаа байрлуулж хүүхдээ хүлээнэ."],"a":"1, 4","imgs":["q848.png"],"t":"사진형","e":"② Хүүхдийн хамгаалалтын бүс доторх гэрлэн дохиогүй явган хүний гарцын өмнө явган зорчигч байгаа эсэхээс үл хамааран түр зогссоны дараа өнгөрөх ёстой (Замын хөдөлгөөний тухай хуулийн 27 дугаар зүйлийн 7 дахь хэсэг). ⑤ Замын захын зогсоолд тавих, зогсохыг хориглосон шугам нь шар тасархай шугам бол 5 минутын дотор зогсох боломжтой бөгөөд үргэлжилсэн шугам бол зогсоолд тавих, зогсохыг хориглоно (Замын хөдөлгөөний тухай хуулийг хэрэгжүүлэх дүрмийн Хавсралт 6)."},{"n":849,"b":"Дараах нөхцөлд хамгийн зөв жолоодох арга аль 2 вэ?","c":["Тусгай зориулалтын автомашин замын хөдөлгөөний тухай хуулийг зөрчиж байгаа тул үл тоон явна.","Тусгай зориулалтын автомашиныг зөрчил гаргах боломжгүй болгохын тулд холын гэрлийг хэд хэдэн удаа асаана.","Ард дагаж яваа жолоочид мэдэгдэхийн тулд тоормосны дөрөөг хэд хэдэн удаа тасалдуулан гишгэнэ.","Тусгай зориулалтын автомашин эсрэг урсгалаар явах боломжтой байхаар зай авч зогсоно.","Тусгай зориулалтын автомашин явах боломжгүй болгохын тулд урд нь зогсоно."],"a":"3, 4","imgs":["img_0123.jpg"],"t":"사진형","e":"29 дүгээр зүйл (Тусгай зориулалтын тээврийн хэрэгслийн давуу эрхтэй хөдөлгөөн) ① Тусгай зориулалтын тээврийн хэрэгсэл 13 дугаар зүйлийн 3 дахь хэсгээс үл хамааран яаралтай бөгөөд зайлшгүй тохиолдолд замын төв буюу зүүн талын хэсгээр явж болно. ② Тусгай зориулалтын тээврийн хэрэгсэл энэ хууль буюу энэ хуулийн дагуух тушаалын дагуу зогсох ёстой тохиолдолд ч яаралтай бөгөөд зайлшгүй тохиолдолд зогсохгүй байж болно. ③ Тусгай зориулалтын тээврийн хэрэгслийн жолооч 1 дэх буюу 2 дахь хэсгийн тохиолдолд замын хөдөлгөөний аюулгүй байдалд онцгой анхаарч явах ёстой. ④ Уулзвар буюу түүний ойролцоо тусгай зориулалтын тээврийн хэрэгсэл ойртож буй тохиолдолд тээврийн хэрэгсэл болон трамвайн жолооч уулзвараас зайлсхийж түр зогсох ёстой. ⑤ Бүх тээврийн хэрэгсэл болон трамвайн жолооч 4 дэх хэсэгт заасан газраас бусад газарт тусгай зориулалтын тээврийн хэрэгсэл ойртож ирсэн тохиолдолд тусгай зориулалтын тээврийн хэрэгслийг давуу эрхтэй явах боломжоор хангаж зам тавьж өгөх ёстой. ⑥ 2 дугаар зүйлийн 22 дахь заалтын дэд заалт бүрийн автомашины жолооч тухайн автомашиныг анхны яаралтай зориулалтаар нь ашиглаагүй тохиолдолд “Автомашины удирдлагын тухай хууль”-ийн дагуу суурилуулсан анхааруулах гэрлийг асаах буюу дуут дохиолол ажиллуулж болохгүй. Гэхдээ Ерөнхийлөгчийн зарлигаар тогтоосны дагуу гэмт хэрэг болон түймрээс урьдчилан сэргийлэх зэрэг зорилгоор эргүүл, сургуулилт зэргийг хэрэгжүүлэх тохиолдолд энэ нь хамаарахгүй. Асуултын зурагт ажиглагдаж буй нөхцөл байдал нь Замын хөдөлгөөний тухай хуулийн дагуу анхны яаралтай зориулалтаар нь явж буй үе юм. Иймд тусгай зориулалтын тээврийн хэрэгслийн давуу эрхтэй явах үе тул бүх тээврийн хэрэгсэл болон трамвайн жолооч тусгай зориулалтын тээврийн хэрэгслийг давуу эрхтэй явах боломжоор хангаж зам тавьж өгөх ёстой. Мөн энэ үед ард нь явж буй автомашины жолооч нарт мэдээлэл өгөхийн тулд тоормосны дөрөөг хэд хэдэн удаа богино давтан дарах зэрэг зогсохыг урьдчилан мэдэгдэх үйлдэл шаардлагатай байж болно."},{"n":850,"b":"Дараах замын нөхцөлд хамгийн зөв жолоодох арга аль 2 вэ?","c":["Түргэн тусламжийн автомашин өнгөрөх боломжтой байхаар 3-р эгнээ рүү орж хурдаа нэмэгдүүлэн өнгөрнө.","Урд талын тээврийн хэрэгслийн гэрлэн дохио ногоон байсан ч түргэн тусламжийн автомашинд зам тавьж өгнө.","Түргэн тусламжийн автомашин өнгөрсний дараа араас нь өөр тусгай зориулалтын тээврийн хэрэгсэл ирж байгаа эсэхийг шалгана.","Улаан өнгийн автомашиныг даган хурдаа нэмэгдүүлэн явна.","Түргэн тусламжийн автомашины жолоочид дуут дохио өгөөд шууд өнгөрнө."],"a":"2, 3","imgs":["q850.png"],"t":"사진형","e":"Жолооч уулзвар буюу түүний ойролцоо тусгай зориулалтын тээврийн хэрэгсэл ойртож буй тохиолдолд уулзвараас зайлсхийж түр зогсох ёстой (Замын хөдөлгөөний тухай хуулийн 29 дүгээр зүйл). ③ Тусгай зориулалтын тээврийн хэрэгсэл нь ажиллагааны онцлогоос шалтгаалан дангаараа биш бүлгээрээ дуудлагад явах магадлал өндөр тул ослоос урьдчилан сэргийлэхийн тулд уулзварт түрүүлж явж буй тусгай зориулалтын тээврийн хэрэгсэлд зам тавьж өгсний дараа араас нь явж буй тээврийн хэрэгсэл байгаа эсэхийг шалгаад хөдлөх ёстой."},{"n":851,"b":"Дараах замын нөхцөлд хамгийн зөв жолоодох арга аль 2 вэ?","c":["Гал гарсан эсэхээс үл хамааран чигээрээ явна.","Агааржуулалтын системийг гадаад агаарын горимд яаралтай шилжүүлнэ.","Явж буй эгнээнд зогсоолд тавьж, хаалгаа түгжин зугтана.","Тээврийн хэрэгслийн цонхыг хааж, хорт хийгээр амьсгалахаас сэргийлнэ.","Гал ихтэй хэсэг рүү орохгүй, цагдаагийн зохицуулагчийн дохиог дагана."],"a":"4, 5","imgs":["q851.png"],"t":"사진형","e":"Замаар явж байхдаа ойн түймэр гарсан газартай тулгарах тохиолдолд эхлээд хорт хийг амьсгалахаас сэргийлэхийн тулд тээврийн хэрэгслийн цонхоо хааж, алчуур, хувцас зэргээр амьсгалын замаа халхалж биеийн аюулгүй байдлаа хангана. Мөн ослын дохионы гэрлээ асааж ард явж буй тээврийн хэрэгсэлд нөхцөл байдлыг шуурхай дамжуулж, галын улмаас замаар нэвтрэх боломжгүй тохиолдолд хүчээр нэвтрэлгүй аюулгүйгээр тойрч гарах аргыг эрж хайна. Мөн тээврийн хэрэгсэл явах боломжтой нөхцөл байдалд гал унтраах машин зэрэг орж ирэх зай гаргахын тулд тээврийн хэрэгслээ зөөсний дараа нүүлгэн шилжих ёстой."},{"n":852,"b":"Дараах нөхцөлд хамгийн зохистой жолоодох арга аль 2 вэ?","c":["Тээврийн хэрэгслийн гэрлэн дохио ногоон тул уулзварт шууд орно.","Тусгай зориулалтын тээврийн хэрэгсэл түрүүлж зорчих шаардлагатай тул уулзварт орохоос өмнө зогсоно.","2-р эгнээнд байгаа тээврийн хэрэгсэл гэнэт зүүн тийш эгнээ сольж болзошгүй тул урьдчилан хангалттай хурд сааруулна.","Тусгай зориулалтын тээврийн хэрэгслээс тээврийн хэрэгслийн дохио давуу тул шууд орно.","Тусгай зориулалтын тээврийн хэрэгслээс түрүүлж өнгөрөхийн тулд хурдлан уулзварт орно."],"a":"2, 3","imgs":["img_0124.jpg"],"t":"사진형","e":"Уулзвар буюу уулзварын ойролцоо тусгай зориулалтын тээврийн хэрэгсэл ойртож буй тохиолдолд тээврийн хэрэгсэл болон трамвайн жолооч уулзвараас зайдуу түр зогсох ёстой. Тусгай зориулалтын тээврийн хэрэгслийн давуу эрхтэй хөдөлгөөнд зам тавьж өгсөнөөс тээврийн хэрэгсэл түгжрэх тохиолдолд замаа өөрчлөх тохиолдол байнга гардаг. Өөрөөр хэлбэл ③-ын тохиолдол шиг 2 дугаар эгнээнд байгаа тээврийн хэрэгсэл зүүн тийш замаа өөрчлөх магадлалыг үгүйсгэх боломжгүй. Иймд урьдчилан хангалттай хурдаа сааруулж ослоос урьдчилан сэргийлэх боломжтой байх ёстой (Замын хөдөлгөөний тухай хуулийн 29 дүгээр зүйлийн 4 дэх хэсэг)."},{"n":853,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["\"2-р эгнээ дуусна\" гэсэн тэмдгийн дагуу 1-р эгнээгээр үргэлжлүүлэн явна.","Засварын хэсгээс зайлсхийхийн тулд огцом тоормослоно.","Урд талын эгнээ нарийсах тул урьдчилан 2-р эгнээ рүү эгнээ солино.","Зам засвар хийж байгааг мэдэгдэхийн тулд аюулын дохионы гэрэл анивчуулна.","1-р эгнээгээр явж байгаад засварын хэсгийн яг өмнө 2-р эгнээ рүү шахаж орно."],"a":"3, 4","imgs":["img_0125.jpg"],"t":"사진형","e":"Замын ажлаас болж зайлшгүй тохиолдолд миний жолоодлогын үйлдлийг бусад жолооч нар хангалттай урьдчилан таамаглаж чадахуйц санаагаа илэрхийлж аюулгүйгээр замаа өөрчилнө. Мөн замын ажлын хэсэг зэрэг нөхцөл байдлыг урьдчилан таамаглахад хэцүү замаар явах тохиолдолд удаан явах буюу түр зогсож анхаарал тавин явах ёстой."},{"n":854,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2 нь аль вэ?","c":["Унадаг дугуйтай мөргөлдөхөөс зайлсхийхийн тулд зүүн эгнээгээр явна.","Унадаг дугуй байгаа цэгт хүрэхээс өмнө хангалттай хурд сааруулна.","Ардаас ирж буй автомашины хөдөлгөөнийг саатуулахгүй байх үүднээс хурдлана.","Явган зорчигч зорчих хэсэг рүү орж ирж болзошгүйг тооцон хурд сааруулж, явган зорчигчийг ажиглана.","Явган зорчигчийг хамгаалахын тулд замын хажуугийн хөвөөгөөр явна."],"a":"2, 4","imgs":["img_0126.jpg"],"t":"사진형","e":"Аюулыг урьдчилан таамаглах. Асуултын зурагт ажиглагдаж буй нөхцөл байдал нь замын захын бүсэд явган зорчигч болон унадаг дугуй явж буй нөхцөл байдал юм. Ийм нөхцөлд ерөнхийдөө унадаг дугуйн хурд явган зорчигчийн хурдаас хурдан байдалтай унадаг дугуйн жолооч явган зорчигчийг гүйцэж түрүүлэх жолоодлогын үйлдэл гардаг. Унадаг дугуй зүүн буюу баруун талаар гүйцэж түрүүлэх явцад мөргөлдөж, зорчих хэсэг рүү гэнэт орох буюу унах зэрэг зам тээврийн осол байнга гардаг. Иймд жолооч замын захын бүсэд явган зорчигч болон унадаг дугуй байгаа тохиолдолд урьдчилан хурдаа бууруулж явган зорчигч болон унадаг дугуй зорчих хэсэг рүү орохыг урьдчилан таамаглаж зогсоход бэлтгэх нь зүйтэй. Мөн энэ үед явган зорчигч болон унадаг дугуйгаас зайлсхийхийн тулд төвийн шугам даван зүүн талаар явах тохиолдол ч байнга гардаг бөгөөд энэ нь зүйтэй үйлдэл гэж хэлж болохгүй."},{"n":855,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Хөдөлгөөний урсгалыг саатуулахгүй байхын тулд урд явж буй тээврийн хэрэгслийг даган явна.","Унадаг дугуйн хурднаас илүү хурдлан явна.","Явган хүний гарцын өмнөх зогсох шугам дээр зогсоно.","Явган зорчигч зам хөндлөн гарч дууссан тул хурдан явна.","Түр зогссон автомашин гэнэт хөдөлж болзошгүй тул хурд сааруулна."],"a":"3, 5","imgs":["img_0127.jpg"],"t":"사진형","e":"Аюулыг урьдчилан таамаглах. Асуултын зургийн нөхцөл байдалд зүүн талд зогссон автомашины жолооч яарсан байдалтай буюу баруун талаа шалгалгүй анхны эгнээ рүүгээ гэнэт орж ирж болзошгүй. Ийм нөхцөл байдал зам дээр байнга гардаг. Иймд замын захад зогсож буй тээврийн хэрэгсэлд онцгой анхаарах ёстой. Мөн зүүн талд зогссон автомашины ард унадаг дугуйн жолооч явган хүний гарц руу орох гэж буй нөхцөл байдалтай бөгөөд хэдийгээр явган зорчигч биш ч жолооч тухайн этгээдийг хамгаалах ёстой. Иймд унадаг дугуйн орох хурд болон өөрийн автомашины явах хурдыг харгалзахгүйгээр явган хүний гарцын яг өмнөх зогсох шугам дээр зогсох ёстой."},{"n":856,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Унадаг дугуйн зүүн талаар явж, зүүн эргэх боломжгүй болтол нь сүрдүүлнэ.","Төв шугам давж унадаг дугуйг гүйцэж түрүүлнэ.","Унадаг дугуй замаас аюулгүй гарч дуустал удаан явж хүлээнэ.","Унадаг дугуй зүүн эргэж болзошгүй тул аюулгүйн зай барина.","Унадаг дугуйг хурдлуулахын тулд дуут дохио хэрэглэнэ."],"a":"3, 4","imgs":["img_0128.jpg"],"t":"사진형","e":"Хөдөлгөөн багатай хөдөөгийн замын тохиолдолд тээврийн хэрэгслийн хөдөлгөөн бага тул төвийн шугам даван замыг хөндлөн гарах унадаг дугуйн жолооч олон байдгийг анхаарах ёстой. Иймд хөдөөгийн замаар явж байхдаа урдаа унадаг дугуй олж харсан тохиолдолд удаан явангаа урдаа сайн ажиглаж унадаг дугуйн жолоочийн хөдөлгөөнийг сайтар ажиглах ёстой. ③ Автомашин зэргийн жолооч нэг чиглэлд явж буй унадаг дугуй зэргийн жолоочид анхаарах ёстой бөгөөд түүний хажуугаар өнгөрөх үед унадаг дугуй зэрэгтэй мөргөлдөхөөс зайлсхийж чадахуйц шаардлагатай зайг хангах ёстой (Замын хөдөлгөөний тухай хуулийн 19 дүгээр зүйлийн 2 дахь хэсэг)."},{"n":857,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Тээврийн хэрэгслийн гэрлэн дохио улаан болохоос өмнө хурдан өнгөрнө.","Явган хүний гарцын өмнөх зогсох шугам дээр зогсоно.","Унадаг дугуй зам хөндлөн гарах боломжтой өндөрсгөсөн явган хүний гарц байгаа тул анхааралтай өнгөрнө.","Аюулгүйн бүсээр дайран хурдан явна.","Ачааны машины араас хүүхэд гэнэт гарч ирж болзошгүй тул анхаарна."],"a":"2, 5","imgs":["img_0129.jpg"],"t":"사진형","e":"Хүүхдийн хамгаалалтын бүсэд үл үзэгдэх газраас аюул үүсэж болзошгүй тул урьдчилан хурдаа бууруулсан байдалтай явангаа хүүхдийн гэнэтийн үйлдэлд анхаарах ёстой. ③ Өндөрлөсөн явган хүний гарц нь хурдны дээд хязгаарыг 30 км/цаг буюу түүнээс доош хязгаарлах шаардлагатай замд явган хүний гарцыг замын гадаргуугаас өндөр болгож жолоочийн анхаарлыг татах шаардлагатай цэгт байрлуулдаг явган хүний гарц бөгөөд явган хүний гарцын хоёр хажууд цагаан гурвалжин хоёр зурсан байдаг. Унадаг дугуй нь унадаг дугуйн гарцаар хөндлөн гарах боломжтой."},{"n":858,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Зогсоолд тавьсан тээврийн хэрэгсэл гэнэт хөдөлж болзошгүй тул дуут дохиог тасралтгүй өгч хурдан өнгөрнө.","Зогсоолд тавьсан тээврийн хэрэгслүүдийн дундаас явган зорчигч гэнэт гарч ирж болзошгүй тул анхаарч удаан явна.","Урд яваа унадаг дугуйг хурдлуулахын тулд дуут дохиог тасралтгүй өгнө.","Урд байгаа хурд сааруулагч, унадаг дугуй унаж буй хүн, үзэгдэх орчин муу зэрэг нөхцөлийг харгалзан байнга анхаарч болгоомжтой жолоодно.","Урд байгаа унадаг дугуйтай зай хангалттай тул хурдлан хурдан өнгөрнө."],"a":"2, 4","imgs":["img_0130.jpg"],"t":"사진형","e":"Хоёр хажууд зогсоолд тавьсан тээврийн хэрэгсэл байгаа бөгөөд урд талд замыг хөндлөн гарч буй унадаг дугуй байгаа тул гэнэтийн нөхцөл байдал хангалттай үүсэж болзошгүй хэсэг юм. Зогсоолд тавьсан тээврийн хэрэгслүүдийн хооронд хүүхэд буюу явган зорчигч гэнэт гүйн гарч болзошгүй тул анхааралтайгаар удаан явах ёстой. Мөн урд талын унадаг дугуй, хурд сааруулах довжоо, хязгаарлагдмал үзэгдэх орчин зэргийг бүгдийг харгалзан болгоомжтой жолоодох нь аюулгүй жолоодлогын арга юм. Харин дуут дохиог тасралтгүй дуугаргаж хурдан өнгөрөх буюу унадаг дугуйгаас хангалттай зайтай гээд эсрэгээрээ хурдлах жолоодлогын үйлдэл нь аюултай нөхцөл байдал үүсгэж болзошгүй буруу жолоодлогын үйлдэл юм."},{"n":859,"b":"Дараахын аль нь хамгийн аюулгүй жолоодох арга 2 вэ?","c":["Хар өнгийн тээврийн хэрэгслийн баруун талаар гүйцэж түрүүлнэ.","Хар өнгийн тээврийн хэрэгсэлтэй нэг эгнээнд зэрэгцэн явна.","Гоян чиглэл рүү гарахын тулд нэн даруй 3-р эгнээ рүү эгнээ солино.","Цагаан өнгийн тээврийн хэрэгсэл эгнээ сольж болзошгүй тул хурд сааруулж аюулгүйн зай барина.","Эгнээ солих боломжтой цагаан тасархай шугамтай хэсэг хүртэл явж байгаад 3-р эгнээ рүү орно."],"a":"4, 5","imgs":["q859.png"],"t":"사진형","e":"③ Цагаан үргэлжилсэн ба тасархай давхар шугамын тохиолдолд зам салах, нийлэх хэсэг буюу газар доторх шаардлагатай цэгт байрлуулдаг бөгөөд тээврийн хэрэгсэл тасархай шугам байгаа талаас замаа өөрчилж болох боловч үргэлжилсэн шугам байгаа талаас замаа өөрчлөхийг хязгаарласныг илэрхийлнэ."},{"n":860,"b":"Дараах нөхцөлд 1-р эгнээ рүү эгнээ солих гэж байгаа үед хамгийн аюулгүй жолоодох арга 2 нь аль вэ?","c":["Зүүн талын арын харах толиор 1-р эгнээнд явж буй тээврийн хэрэгслийг шалгана.","Урд байгаа суудлын автомашиныг 1-р эгнээ рүү эгнээ солихоос сэргийлэхийн тулд урьдчилан урд гэрлийн холын гэрлийг асааж анхааруулна.","Хөдөө аж ахуйн машин зам руу орж ирж болзошгүй тул 1-р эгнээ рүү хурдан эгнээ солино.","Өгсүүр эгнээ тул хурдаа нэмэгдүүлж жолоодно.","Урд байгаа хоёр дугуйт тээврийн хэрэгсэл 1-р эгнээ рүү эгнээ сольж болзошгүй тул аюулгүйн зай барина."],"a":"1, 5","imgs":["img_0132.jpg"],"t":"사진형","e":"Аюулгүй зайг хангаагүй тохиолдолд урд тээврийн хэрэгслийн огцом тоормослолт буюу огцом эгнээ солилтын үед зохих арга хэмжээ авахад хэцүү. Ялангуяа уулын замын тохиолдолд давааны оройн цаадах нөхцөл байдал харагдахгүй тул улам аюултай учир хурдаа бууруулж урд тээврийн хэрэгслээс аюулгүй зайг хангалттай барина."},{"n":861,"b":"Дараахын аль нь хамгийн аюулгүй жолоодох арга 2 вэ?","c":["Унадаг дугуйн хөдөлгөөнд саад учруулахгүйгээр баруун замын хажууд түр зогсоно.","Урд явган хүний гарц байгаа тул явган зорчигчийг анхаарч удаан явна.","Гүйцэж түрүүлэх үед хурд хэтрүүлэхийг зөвшөөрдөг тул цагт 50 км хурдтай явна.","1-р эгнээ рүү эгнээ сольсны дараа унадаг дугуйтай аюулгүйн зай барина.","Дуут дохио ашиглан унадаг дугуйг замын хажуугаар явахыг яаруулна."],"a":"2, 4","imgs":["q861.png"],"t":"사진형","e":"Унадаг дугуйн давуу эрхтэй зам гэж автомашины хөдөлгөөний хэмжээ нь Ерөнхийлөгчийн зарлигаар тогтоосон шалгуураас бага замын зарим хэсэг болон эгнээг тогтоож унадаг дугуй болон бусад тээврийн хэрэгсэл харилцан аюулгүй явах боломжтой байхаар замд замын гадаргуугийн тэмдэглэгээгээр байрлуулсан зам юм. Унадаг дугуйтай хуваалцдаг зам бөгөөд унадаг дугуйн хөдөлгөөн давуу эрхтэй байдаг зам юм. ① Замын захад шар үргэлжилсэн шугам зурсан газар нь зогсоолд тавих, зогсохыг хориглосон бүс юм."},{"n":862,"b":"Унадаг дугуй унаж явж байна. Хамгийн аюулгүй жолоодох арга болох 2-ыг сонгоно уу.","c":["Урд байгаа явган зорчигчийн өмнө зогсоно.","Унадаг дугуй давуу эрхтэй тул дуут дохио өгч гүйцэж түрүүлнэ.","Урд байгаа явган зорчигчтой мөргөлдөх эрсдэл өндөр тул явган зорчигчийн бүсээр явна.","Баруун талын явган зорчигчтой мөргөлдөх эрсдэлтэй тул унадаг дугуйгаа түрж явна.","Унадаг дугуйн хувьд хурдны хязгаар байхгүй тул аюултай хэсгийг хурдан өнгөрнө."],"a":"1, 4","imgs":["q862.png"],"t":"사진형","e":"Унадаг дугуй, явган зорчигчийн хамтарсан замаар явж буй унадаг дугуйн жолооч удаан явангаа урдаа сайн ажиглаж явган зорчигчийн хөдөлгөөнийг сайтар ажиглах ёстой. Унадаг дугуйн жолооч замын захаар явж явган зорчигчийн хөдөлгөөнд саад болохгүй байхад анхаарах ёстой."},{"n":863,"b":"Дараах газарт унадаг дугуй унаж буй хүн аюулгүйгээр зам хөндлөн гарах арга 2 нь аль вэ?","c":["Унадаг дугуйтайгаа явган хүний гарцын ногоон гэрлийг хүлээгээд унадаг дугуйгаа унан гарна.","Өөр унадаг дугуй унаж буй хүн гарч байгаа тул хурдан гарна.","Бусад унадаг дугуйтай мөргөлдөх эрсдэлтэй тул унадаг дугуйнаасаа бууж, явган хүний замын аюулгүй хэсэгт хүлээнэ.","Унадаг дугуй унаж буй хүн хүүхэд эсвэл ахмад настан бол явган зорчигчийн гэрлэн дохио ногоон байх үед унаж гарна.","Явган хүний гарцын гэрлэн дохио ногоон байх үед унадаг дугуйгаа түрж гарна."],"a":"3, 5","imgs":["q863.png"],"t":"사진형","e":"13-2 дугаар зүйл (Унадаг дугуй зэргийн зорчих аргын онцгой журам)-ын 6 дахь хэсэг. Унадаг дугуй зэргийн жолооч явган хүний гарцыг ашиглан замыг хөндлөн гарахдаа унадаг дугуй зэргээсээ бууж унадаг дугуй зэргийг түлхэж буюу өргөж явган явах ёстой."},{"n":864,"b":"Дараах нөхцөлд хамгийн аюулгүй жолоодох арга 2-ыг сонгоно уу.","c":["Урд байгаа явган зорчигч гэнэт зүүн тийш зам хөндлөн гарч болзошгүйг урьдчилан таамаглаж, зогсоход бэлдэнэ.","Чигээрээ явах бол урд уулзварт тээврийн хэрэгсэл байхгүй тул удаан явж өнгөрнө.","Уулзварт орохоос өмнө түр зогсож, баруун болон зүүн талаас ойртож буй тээврийн хэрэгслийг шалгана.","Ойр орчмын унадаг дугуй болон явган зорчигчдод тээврийн хэрэгсэл явж байгааг мэдэгдэхийн тулд дуут дохиог давтан өгнө.","Урд байгаа явган зорчигчийг замын хажуугийн хөвөө рүү оруулахын тулд баруун талаар шахаж явна."],"a":"1, 3","imgs":["img_0133.jpg"],"t":"사진형","e":"Аюулыг урьдчилан таамаглах. Замын хөдөлгөөний тухай хуулийн 31 дүгээр зүйл (Удаан явах буюу түр зогсох газар) ② дахь хэсэг. Бүх тээврийн хэрэгсэл буюу трамвайн жолооч дараах заалтын аль нэгэнд хамаарах газарт түр зогсох ёстой. 1. Хөдөлгөөний зохицуулалт хийгдээгүй бөгөөд зүүн, баруун талыг харах боломжгүй буюу хөдөлгөөн ачаалалтай уулзвар. 25 дугаар зүйл (Уулзвараар нэвтрэх арга) ① Бүх тээврийн хэрэгслийн жолооч уулзварт баруун тийш эргэх гэж байгаа тохиолдолд урьдчилан замын баруун захаар удаан явангаа баруун тийш эргэх ёстой. Энэ тохиолдолд баруун тийш эргэж буй тээврийн хэрэгслийн жолооч дохионы дагуу зогсож буй буюу явж буй явган зорчигч буюу унадаг дугуй зэрэгт анхаарах ёстой. ② Бүх тээврийн хэрэгслийн жолооч уулзварт зүүн тийш эргэх гэж байгаа тохиолдолд урьдчилан замын төвийн шугамыг дагаж удаан явангаа уулзварын төвийн дотор талыг ашиглан зүүн тийш эргэх ёстой. Гэхдээ аймаг, нийслэлийн Цагдаагийн газрын дарга уулзварын нөхцөл байдлаас шалтгаалан онцгой шаардлагатай гэж үзэж заасан газарт уулзварын төвийн гадна талаар нэвтэрч болно. ③ 2 дахь хэсгээс үл хамааран унадаг дугуй зэргийн жолооч уулзварт зүүн тийш эргэх гэж байгаа тохиолдолд урьдчилан замын баруун захад наалдан удаан явангаа уулзварын захын хэсгийг ашиглан зүүн тийш эргэх ёстой. ④ 1 дэх хэсгээс 3 дахь хэсэг хүртэлх зохицуулалтын дагуу баруун буюу зүүн тийш эргэхийн тулд гараар, чиг заах дохиогоор буюу гэрлээр дохио өгч буй тээврийн хэрэгсэл байгаа тохиолдолд түүний ард явж буй тээврийн хэрэгслийн жолооч дохио өгсөн урд тээврийн хэрэгслийн явахад саад учруулж болохгүй. ⑤ Бүх тээврийн хэрэгсэл буюу трамвайн жолооч гэрлэн дохиогоор хөдөлгөөний зохицуулалт хийж буй уулзварт орох гэж байгаа тохиолдолд явах гэж буй замын урд байгаа тээврийн хэрэгсэл буюу трамвайн нөхцөл байдлаас шалтгаалан уулзварт (зогсох шугам байрлуулсан тохиолдолд тухайн зогсох шугамыг давсан хэсгийг хэлнэ) зогсох болж бусад тээврийн хэрэгсэл буюу трамвайн хөдөлгөөнд саад учруулж болзошгүй тохиолдолд тухайн уулзварт орж болохгүй. ⑥ Бүх тээврийн хэрэгслийн жолооч хөдөлгөөний зохицуулалт хийгдээгүй бөгөөд түр зогсох буюу зам тавьж өгөхийг илэрхийлсэн аюулгүйн тэмдэглэгээ байрлуулсан уулзварт орох гэж байх үед бусад тээврийн хэрэгслийн явахад саад учруулахгүй байхаар түр зогсох буюу зам тавьж өгөх ёстой. Замын хөдөлгөөний тухай хуулийн 49 дүгээр зүйл (Бүх жолоочийн дагаж мөрдөх зүйл зэрэг) 1 дэх хэсгийн 8 дахь заалт. Жолооч хүндэтгэн үзэх шалтгаангүйгээр дараах дэд заалтын аль нэгэнд хамаарах үйлдэл хийж бусдад хохирол учруулах дуу чимээ гаргахгүй байх. а. Автомашин зэргийг огцом хөдөлгөх буюу хурдыг огцом нэмэх үйлдэл б. Автомашин зэргийн хөдөлгүүрийн хүчийг тээврийн хэрэгслийн дугуйд дамжуулалгүйгээр хөдөлгүүрийн эргэлтийн тоог нэмэгдүүлэх үйлдэл в. Давтан буюу тасралтгүй дуут дохио дуугаргах үйлдэл"},{"n":865,"b":"Дараах нөхцөлд цахилгаан кик скүүтер жолоодож буй хүн зүүн эргэх гэж байгаа бол аюулгүй арга 2 нь аль вэ?","c":["A явган хүний гарцаар цахилгаан кик скүүтерээ унан орсны дараа B цэг дээр D чиглэлийн ногоон гэрлийг хүлээнэ.","A явган хүний гарцаар цахилгаан кик скүүтерээ түрж орсны дараа B цэг дээр D чиглэлийн ногоон гэрлийг хүлээнэ.","Цахилгаан кик скүүтерээ унан E чиглэл рүү явахын тулд уулзварын төвийн дотор талаар зүүн эргэнэ.","Цахилгаан кик скүүтерээ унан B цэг хүртэл чигээрээ явсны дараа D чиглэлийн ногоон гэрлийг хүлээнэ.","Цахилгаан кик скүүтерээ унан C цэг хүртэл чигээрээ явсны дараа нэн даруй B цэгээс D чиглэл рүү чигээрээ явна."],"a":"2, 4","imgs":["img_0134.jpg"],"t":"사진형","e":"Замын хөдөлгөөний тухай хуулийн 25 дугаар зүйлийн 3 дахь хэсэг. Унадаг дугуй зэргийн жолооч уулзварт зүүн тийш эргэх гэж буй тохиолдолд урьдчилан замын баруун захад наалдан удаан явж уулзварын захын хэсгийг ашиглан зүүн тийш эргэх ёстой. Хууль зүйн яамны хууль тогтоомжийн тайлбарын жишээ. Хэргийн дугаар 17-0078. (Доорх унадаг дугуй нь одоо унадаг дугуй зэрэгт хамаарна.) «Замын хөдөлгөөний тухай хууль»-ийн 25 дугаар зүйлийн 2 дахь хэсэгт бүх тээврийн хэрэгслийн жолооч уулзварт зүүн тийш эргэх гэж буй тохиолдолд урьдчилан замын төвийн шугамыг дагаж удаан явж уулзварын төвийн дотор талыг ашиглан зүүн тийш эргэх ёстой. Гэхдээ аймаг, нийслэлийн Цагдаагийн газрын дарга уулзварын нөхцөл байдлаас хамааран онцгой шаардлагатай гэж үзэж тогтоосон газарт уулзварын төвийн гадна талаар өнгөрч болно (тайлбар заалт) гэж заасан бөгөөд мөн зүйлийн 3 дахь хэсэгт мөн зүйлийн 2 дахь хэсгээс үл хамааран унадаг дугуйн жолооч уулзварт зүүн тийш эргэх гэж буй тохиолдолд урьдчилан замын баруун захад наалдан удаан явж уулзварын захын хэсгийг ашиглан зүүн тийш эргэх ёстой гэж заасан тул, унадаг дугуйн жолоочийн уулзварт зүүн тийш эргэх аргыг тогтоосон «Замын хөдөлгөөний тухай хууль»-ийн 25 дугаар зүйлийн 3 дахь хэсэг нь унадаг дугуйн жолооч уулзварт зүүн эргэлтийн дохиогоор шууд зүүн тийш эргэж болохгүй, явах чиглэлийн чигээрээ явах дохиогоор замын баруун захад наалдан \"2 үе шаттайгаар чигээрээ - чигээрээ\" явах аргаар зүүн тийш эргэх ёстой гэсэн тэрхүү \"дэгээн эргэлт (hook-turn)\"-ийг хэлж байгаа юм уу, эсвэл унадаг дугуйн жолоочийн хувьд ч уулзварт зүүн эргэлтийн дохиогоор шууд зүүн тийш эргэж болох боловч мөн зүйлийн 2 дахь хэсгийн дагуу ижил чиглэлд зүүн тийш эргэж буй автомашин зэргийн жолоочийн баруун талын замын хэсгийг ашиглан зүүн тийш эргэх ёстой гэсэн утгатай юу? ※ Асуултын үндэслэл: Цагдаагийн ерөнхий газар унадаг дугуйн жолоочийн уулзварт зүүн тийш эргэх аргын талаарх «Замын хөдөлгөөний тухай хууль»-ийн 25 дугаар зүйлийн 3 дахь хэсгийг явах чиглэлийн чигээрээ явах дохиогоор \"2 үе шатт
